name: diag
on:
  push:
    branches: [diag-almacen]
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vuelta: [1, 2, 3]
        modo: [file, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          export CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          if [ "${{ matrix.modo }}" = http ]; then
            python3 -m http.server 8787 --bind 127.0.0.1 >/dev/null 2>&1 &
            sleep 1
            export GLOSS_APP_URL=http://127.0.0.1:8787/index.html
          fi
          node diag/almacen.js
