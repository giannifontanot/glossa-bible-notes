      if (r.width < .5 && r.height < .5) continue;
      if (r.right > c.right + 1.5 || r.bottom > c.bottom + 1.5) return false;
    }
  }
  return true;
}
/* Con `hasta` se pintan exactamente esos versículos, sin medir: la hoja ya
   tiene decidido su contenido. Sin `hasta` se mide hasta que desborda, que
   es como se construye el mapa de hojas. */
function paginate(bodyEl, from, below, hasta){
  aplicarEstilo(bodyEl);
  bodyEl.innerHTML = '';
  const tope = hasta == null ? plano.length : hasta;
  let i = from;
  while (i < tope){
    const marca = bodyEl.childNodes.length;
    bodyEl.insertAdjacentHTML('beforeend', verseHTML(i, SPAN_MARKS, below));
    if (hasta == null && i > from && !cabe(bodyEl, marca)){
      while (bodyEl.childNodes.length > marca) bodyEl.removeChild(bodyEl.lastChild);
      break;
    }
    i++;
  }
  return Math.max(i, from+1);
}
const glosasEn = (a,b) => marcas.filter(m => m.nota && visible(m) && RES.has(m.id) &&
  plano.findIndex(p => p.cap===m.cap && p.vers===m.vers) >= a &&
  plano.findIndex(p => p.cap===m.cap && p.vers===m.vers) < b)
  .sort((x,y) => x.cap-y.cap || x.vers-y.vers);
/* En teléfono el margen NO se encoge: la hoja es más ancha que la pantalla a
   propósito, así que la columna de glosas conserva su ancho de tablet y se
   asoma corriendo el papel. Encogerla aquí sería justo el error que estamos
   evitando. */
const enTelefono = () => window.matchMedia('(max-width: 560px)').matches;
/* En teléfono el ancho lo manda el CSS, que es donde está escrito el acomodo
   de la hoja. Leerlo de ahí en vez de repetir el número evita justo lo que ya
   nos pasó una vez: dos sitios con la misma medida y uno que se queda atrás. */
const anchoGlosaCSS = () => {
  const v = parseFloat(getComputedStyle(pg).getPropertyValue('--col-glosa'));
  return Number.isFinite(v) && v > 0 ? v : 240;
};
const MARGIN_W = () => enTelefono() ? anchoGlosaCSS()
                     : stage.offsetWidth >= 560 ? 152
                     : stage.offsetWidth >= 420 ? 132 : 104;

function layoutInto(bodyEl, marginEl, footEl, from, hasta){
  const below = placement === 'below';
  const setM = o => { marginEl.style.setProperty('--mw', o?MARGIN_W()+'px':'0px');
                      marginEl.style.setProperty('--mgap', o?'11px':'0px'); };
  marginEl.innerHTML = ''; footEl.innerHTML = '';
  const out = n => ({ next:n, mw:marginEl.style.getPropertyValue('--mw'),
                      gap:marginEl.style.getPropertyValue('--mgap'),
                      marginHTML:marginEl.innerHTML, footHTML:footEl.innerHTML });
  const pie = (a, b) => {
    const gl = glosasEn(a, b), fc = columns >= 2 ? 2 : 1;
    return gl.length ? '<div class="foot-in" style="column-count:' + fc + ';--fcols:' + fc + '">' +
      gl.map(m => glossHTML(m,'gl-foot')).join('') + '</div>' : '';
  };
  if (below){ setM(false); return out(paginate(bodyEl, from, true, hasta)); }
  if (placement === 'foot'){
    setM(false);
    if (hasta != null){                       // la hoja ya sabe qué trae
      footEl.innerHTML = pie(from, hasta);
      return out(paginate(bodyEl, from, false, hasta));
    }
    let next = paginate(bodyEl, from, false);
    for (let p = 0; p < 4; p++){              // el pie ocupa alto y cambia qué cabe
      const html = pie(from, next);
      if (html === footEl.innerHTML) break;
      footEl.innerHTML = html;
      const otra = paginate(bodyEl, from, false);
      if (otra === next) break;
      next = otra;
    }
    return out(next);
  }
  /* El margen queda SIEMPRE abierto, tenga o no glosas esta hoja. El espacio
     en blanco no es desperdicio: es la promesa de que el texto no se va a
     mover cuando escribas la primera glosa de la página. Además así todas
     las hojas tienen la misma caja de texto y el ojo no brinca al pasar. */
  setM(true);
  const next = paginate(bodyEl, from, false, hasta);
  asentarGlosas(bodyEl); asentarGlosas(footEl);   /* las de "abajo" y las del pie */
  colocarMargen(bodyEl, marginEl);
  return out(next);
}

/* ============================================================
   MAPA DE HOJAS. Como en una Biblia de papel, cada versículo vive
   en una hoja concreta y siempre en la misma. Se calcula una vez
   para todo el libro, midiendo fuera de pantalla, y solo se rehace
   cuando cambia algo que afecta el acomodo (letra, columnas, ancho,
   dónde van las glosas, o las glosas mismas si estorban al texto).
   ============================================================ */
let paginas = [0], paginaActual = 0, paginasSucias = true;
/* ============================================================
   LA PAGINACIÓN, CORTE A CORTE Y SOLO HASTA DONDE HAGA FALTA.

   Aquí está TODO el coste de llegar a un libro. Cronometrado con la CPU
   frenada a la cuarta parte —un teléfono de verdad— llegar a Mateo eran:

     rehacerPlano         0 ms
     resolverTodas        0 ms
     recalcularRefs       1 ms
     calcularVinculos     0 ms
     asegurarPaginas  11087 ms

   Y no es que paginar sea caro: es que se paginaba el libro ENTERO para
   enseñar una hoja. Sesenta cortes, cada uno maquetando en las cuatro
   traducciones, para acabar mirando el primero. Once segundos con la pantalla
   quieta después de tocar un botón.

   Ahora los cortes se calculan cuando alguien pregunta por ellos. `paginas`
   deja de ser "todas las hojas del libro" y pasa a ser "las que se han tenido
   que averiguar"; `paginasCompletas` dice si además resultan ser todas.
   Entrar a un libro por delante cuesta UN corte en vez de sesenta.

   La regla para el resto del programa es una sola: nadie mira `paginas.length`
   para saber si existe una hoja. Se pregunta con hayHojaN, que corta lo que
   falte antes de contestar. Mirar el largo a pelo daría "no hay" para toda
   hoja que todavía no se haya averiguado, que es justo el error que esta
   estructura invita a cometer.

   PAGINACIÓN SINCRONIZADA, que es lo que la hace cara y hay que conservar.
   Cada hoja se corta donde quepa en TODAS las versiones, no solo en la que
   estás leyendo. Así la hoja 7 contiene los mismos versículos en la VBL y en
   la RVR1909, y cambiar de versión te deja mirando exactamente el mismo
   pasaje. El precio: en la versión de texto más corto sobra un poco de
   espacio al final de la hoja. Se paga con gusto —es lo que hacen las Biblias
   interlineales impresas—.
   ============================================================ */
let paginasCompletas = false;
function asegurarPaginas(){
  if (!paginasSucias) return;
  /* Ya no pagina: solo tira lo sabido. Lo que se sabía valía para otro ancho,
     otra letra u otro libro, y sostenerlo sería peor que no tener nada. */
  paginas = [0]; paginasCompletas = false; paginasSucias = false;
}
/* El molde se prepara en CADA corte y no una vez por tanda. La hoja fantasma
   la comparten el paginador, la foto del pliegue y la instantánea, y cada uno
   la deja con sus medidas; con un corte suelto en medio de una foto, el molde
   sería el de la foto y el corte saldría en otro sitio. Prepararlo cuesta unas
   propiedades de estilo, contra los ~175 ms que cuesta el corte en sí.
   Va con el ancho del PAPEL y no el de la ventana: con el de la ventana la
   columna de texto sale más angosta, el texto más alto, y las hojas se
   cortarían antes de tiempo. */
function moldeDeCorte(){
  const med = medirHojaTelefono();
  const w = med ? (med.texto + med.hueco + med.glosa) : pg.offsetWidth;
  prepararHoja(ghost, w, pg.offsetHeight);
  if (med) ghost.style.setProperty('--mx', '0px');
}
/* Un corte más, a partir del último que se sabe. Devuelve false cuando ya no
   queda libro por cortar. */
function unCorteMas(){
  if (paginasCompletas) return false;
  const original = plano;
  const i = paginas[paginas.length - 1];
  if (!(i < original.length)){ paginasCompletas = true; return false; }
  moldeDeCorte();
  let corte = Infinity;
  /* EL PLANO SE DEVUELVE PASE LO QUE PASE.

     Aquí se le da la vuelta a una variable global para maquetar el mismo corte
     en las otras traducciones, y se devolvía al terminar el bucle. Bastaba con
     que layoutInto tirara una excepción —una versión con un hueco, un dato
     raro— para que el plano se quedara apuntando a OTRA traducción. Y lo que
     sale de ahí es exactamente lo peor: el programa sigue vivo, sin error a la
     vista, pero contando versículos de un libro que no es el que se lee. El
     titulillo se queda en blanco en cuanto el índice se sale del plano nuevo.
     No he conseguido provocarlo, y por eso mismo va con finally: una variable
     global prestada se devuelve siempre, no solo cuando todo va bien. */
  try {
    for (const v of versionesSincronizables()){
      plano = (v === version) ? original : planoDe(v);
      const r = layoutInto(ghostBody, ghostMargin, ghostFoot, i);
      corte = Math.min(corte, r.next);
    }
  } finally { plano = original; }
  /* Un corte que no avanza, o que cae fuera, es el final del libro. Que caiga
     JUSTO en el largo del plano también: significa que la última hoja acaba
     con el último versículo y no hay una hoja más que empiece en la nada. */
  if (!isFinite(corte) || corte <= i || corte >= original.length){
    paginasCompletas = true;
    return false;
  }
  paginas.push(corte);
  return true;
}
/* ¿Existe la hoja p? Corta lo justo para poder contestar. */
function hayHojaN(p){
  if (!(p >= 0)) return false;
  let guard = 0;
  while (paginas.length <= p && guard++ < 20000)
    if (!unCorteMas()) break;
  return p < paginas.length;
}
/* Y todas, para lo poco que de verdad las necesita todas: entrar a un libro
   por el final, y estimar el grosor de un bonche. */
function todasLasPaginas(){
  let guard = 0;
  while (!paginasCompletas && guard++ < 20000) unCorteMas();
  return paginas.length;
}
const paginaDe = k => {
  let p = 0;
  while (hayHojaN(p + 1) && paginas[p+1] <= k) p++;
  return p;
};
const finDe = p => (hayHojaN(p + 1) ? paginas[p+1] : plano.length);
/* ¿Hay hoja de ese lado? La pregunta ya se hacía en tres sitios con la cuenta
   escrita a mano —al apagar el filo, al empezar el pliegue y al pasar la
   hoja— y la huella necesitaba hacerla una cuarta vez. Con la cuenta suelta,
   olvidarla es lo natural: es justo lo que pasó, y el síntoma fue una huella
   prometiendo un giro en un filo donde no hay a dónde ir. */
/* DOS PREGUNTAS QUE ANTES ERAN UNA.

   «¿Queda hoja en este libro?» y «¿hay a dónde ir?» eran la misma cuenta
   mientras la lectura se acababa con el libro. Ahora no: pasando la última
   hoja de Mateo empieza Marcos, así que el filo sigue vivo donde el libro se
   termina. Separarlas es lo que deja que cada cosa diga lo suyo:

   · hojaEnEsteLibro decide el CANTO, la raya del margen. Sigue siendo verdad
     que aquí se acaba el libro, y esa es justo la información que hace falta
     cuando el texto de la hoja siguiente ya es otro.
   · hayHoja decide el FILO y los botones de la vista de lejos. Apagarlos al
     final de un libro sería mentir: hay a dónde ir. */
const hojaEnEsteLibro = s => s === 'right' ? hayHojaN(paginaActual + 1)
                                           : paginaActual > 0;
const hayHoja = s => hojaEnEsteLibro(s) || !!libroVecino(s);
/* Libro, capítulo y versículo con los que ARRANCA la hoja */
const cabezaDe = k => {
  const it = plano[Math.min(Math.max(k,0), plano.length-1)];
  return it ? nombreDe(LIBRO) + '  ' + it.cap + ':' + it.vers : '';
};

/* ============================================================
   MEDIR SIN EL ZOOM PUESTO.

   La vista de lejos escala .pg-inner, y getBoundingClientRect devuelve las
   coordenadas YA escaladas. Todo lo que mide la hoja para colocar algo —dónde
   va cada nota del margen, dónde cae cada palabra para la foto del pliegue,
   qué rectángulos ocupan las marcas— compara esas medidas con altos de
   maquetación, que NO se escalan. Mezclar las dos escalas descoloca las notas
   y descompone la foto: por eso pasar hoja de lejos empezó siendo instantáneo.

   La solución no es corregir cada cuenta dividiendo por la escala —serían
   cinco sitios y el sexto que se olvide—, sino quitar el zoom un instante
   mientras se mide y devolverlo. Es exactamente lo que ya hace medirPalabras
   con las glosas torcidas: las endereza para medirlas en limpio y las vuelve a
   torcer. Nadie ve nada, porque entre lo uno y lo otro no hay repintado: el
   navegador solo pinta al final del cuadro, y aquí todo pasa dentro del mismo.
   ============================================================ */
function sinZoom(fn){
  /* EL SUAVIZADO SE CANCELA ANTES DE MIRAR zoomActivo, y el orden es el
     arreglo. cerrarZoom apaga zoomActivo en su primer renglón, pero la
     transición de 460 ms sigue corriendo detrás: durante ese rato .pg-inner
     está a una escala intermedia y zoomActivo ya dice que no hay zoom. Con la
     comprobación después del return de abajo, esa ventana se iba sin
     neutralizar nada y lo que se midiera salía encogido —medido: el cuerpo de
     la hoja da 360 px donde da 412—. Palabras y marcas colocadas con esa
     medida componen una foto de pliegue que no es la hoja.
     Aquí arriba cubre las dos ventanas, la de entrar y la de salir, porque
     pregunta por lo único que de verdad importa: si hay algo moviéndose.
     Lo levantó la revisión de Codex. */
  if (pg.classList.contains('suavizando')) finSuave();
  const inner = zoomActivo ? pg.querySelector('.pg-inner') : null;
  if (!inner) return fn();
  /* Si el suavizado del zoom está armado, se CANCELA en vez de esquivarlo.
     Quitar y devolver el transform con la transición puesta haría que la
     medición se viera: la hoja saldría creciendo a tamaño natural y volviendo
     a encogerse. Y no vale con apagar la clase durante la llamada, porque los
     estilos se resuelven una sola vez al final de la tarea y lo que el
     navegador compararía sería el estado final —transform devuelto, clase
     devuelta—, que es exactamente el caso que anima.
     Perder la transición aquí no cuesta nada: si algo repagina a media
     transición, esa repaginación es la noticia. */
  inner.style.transform = 'none';
  try { return fn(); }
  finally { inner.style.removeProperty('transform'); }
}

/* SIN FUNDIDO, para el momento en que se mueve el sepia.

   Los dos rótulos de la hoja llevan una transición de .34s en color y en
   fondo. Está ahí para cuando los tocas —se encienden en ámbar y vuelven—,
   pero el sepia les cambia esas dos mismas propiedades, y entonces la
   transición estorba dos veces.

   La que se ve: el resto de la hoja se tiñe de golpe y los dos rótulos se
   quedan un tercio de segundo con el tono anterior, como dos pegatinas
   recortadas de otro papel.

   Y LA QUE NO SE VE, QUE ES LA GRAVE. renderPage pide foto nueva del pliegue
   con un setTimeout de cero, y la foto se arma midiendo el getComputedStyle de
   cada palabra, rótulos incluidos: el SVG los pinta transparentes —.sin-tinta—
   y quien les pone color es el lienzo. A los cero milisegundos la transición
   acaba de empezar, así que se fotografía la tinta VIEJA sobre el papel NUEVO.
   Medido en un salto de 0 a 100: 4.07 y 3.34 de contraste donde tocaban 5.60 y
   4.56. Y la foto queda firmada como al día, así que eso no se corrige solo:
   se queda puesto hasta el siguiente cambio de estilo. Lo levantó la revisión.

   Se apaga la transición, se aplica el cambio, se obliga a resolver el estilo
   —leer el color es lo que fuerza el recálculo— y se vuelve a encender, todo
   dentro de la misma tarea. Así no hay cuadro intermedio: el rótulo llega al
   color nuevo sin animar, igual que el papel, y la foto lo encuentra ya
   puesto. El encendido al tocarlos no se entera, que para eso se devuelve. */
function sinFundido(fn){
  /* Solo la hoja viva: el molde no se funde nunca, y por eso no hace falta
     acordarse de él aquí. Ver la regla de #ghost en PAGE_CSS. */
  pg.classList.add('sin-fundido');
  try { return fn(); }
  finally {
    getComputedStyle($('pgCabeza')).color;
    pg.classList.remove('sin-fundido');
  }
}

function renderPage(){
  const r = sinZoom(renderPageCrudo);
  /* Las piedras se repintan con la hoja y no antes: cuáles tocan depende del
     reparto, que es lo que renderPageCrudo acaba de decidir. */
  if (typeof pintarPiedras === 'function') pintarPiedras();
  /* Los dos puntos de pasar hoja se apagan en las puntas del libro, y quien
     sabe si estamos en una punta es esto, que corre después de cada cambio de
     hoja venga de donde venga: del filo, del botón o de un salto. */
  if (zoomActivo) refrescarPasos();
  return r;
}
function renderPageCrudo(){
  resolverTodas(); recalcularRefs(); calcularVinculos();
  asegurarPaginas();
  /* Se corta hasta la hoja que toca, y solo si no existe se recula. Con el
     largo a pelo —Math.min(paginaActual, paginas.length-1)— cualquier hoja
     todavía sin averiguar se leería como inexistente y la lectura saltaría a
     la primera del libro en cuanto se recargara la página. */
  if (!hayHojaN(paginaActual)) paginaActual = paginas.length - 1;
  paginaActual = Math.max(0, paginaActual);
  startIdx = paginas[paginaActual];
  nextIdx = finDe(paginaActual);
  prepararHoja(pg);
  reflejarTamano();
  $('pgCabeza').textContent = cabezaDe(startIdx);
  $('pgCabeza').title = 'Libros, glosas, formato y respaldo';
  $('pgVersion').textContent = D.versiones[version].abrev || version;
  /* El aviso dice lo que hacen los dos gestos, no lo que hacían: un toque abre
     la lista de versiones y dos abren Libros. Decía "Formato y versión" desde
     antes de que ninguna de las dos cosas fuera cierta. */
  $('pgVersion').title = 'Versiones · doble clic: Libros · versión ' + window.GLOSS_BUILD;
  /* La pestaña lleva solo el nombre de la aplicación. Le puse el libro un
     rato —'Gloss Bible · Marcos'— y estorba: el libro y el capítulo ya se
     leen en la esquina de la hoja, y en la pestaña solo hacían ruido. Si
     algún día abres varias hojas a la vez y quieres distinguirlas, se le
     agrega de vuelta ' · ' + nombreDe(LIBRO) aquí mismo. */
  document.title = 'Gloss Bible';
  const r = layoutInto(pgBody, pgMargin, pgFoot, startIdx, nextIdx);
  curMW = r.mw; curGap = r.gap;
  curMarginHTML = r.marginHTML; curFootHTML = r.footHTML;
  if (HL_API) aplicarHighlights();
  edgeR.classList.toggle('off', !hayHoja('right'));
  edgeL.classList.toggle('off', !hayHoja('left'));
  /* El canto marca el final del LIBRO, no el final de la lectura. Antes eran
     lo mismo y se preguntaba una sola vez; ahora, pasando la última hoja
     empieza el libro siguiente, así que el filo sigue encendido y el canto
     igualmente se pinta: lo que anuncia es que el texto de la hoja de al lado
     ya es de otro libro, y eso es justo lo que hay que saber antes de pasarla. */
  $('cantoDer').classList.toggle('viva', !hojaEnEsteLibro('right'));
  $('cantoIzq').classList.toggle('viva', !hojaEnEsteLibro('left'));
  /* Y el panel de Libros se entera de que cambiamos de libro. Se repinta solo
     la marca y no la lista entera: si estás dentro de la cascada de capítulos,
     rehacer el panel te sacaría de ella. */
  refrescarLibroActual();
  medirHojaTelefono();
  /* Lo apuntado de la selección era de la hoja que estaba puesta: sus
     posiciones ya no dicen nada. Ver selRecordada. */
  olvidarSeleccion();
  pintarFiltros(); pintarIndice(); invalidateSnapshot(); updateReadout();
  /* La cinta se vuelve a colgar aquí, después del acomodo: layoutInto vacía la
     columna de glosas cada vez, así que ponerla antes sería ponerla para que
     se la lleven. La foto del pliegue SÍ la incluye (htmlCintaFoto): se pinta
     en el SVG del retrato, no en este nodo vivo. */
  if (typeof separadorAlPintar === 'function') separadorAlPintar();
  if (typeof guardarAjustes === 'function') guardarAjustes();
}

/* ---------- rangos ---------- */
function nodoEn(root, off){
  let acc = 0, res = null;
  (function rec(n){
    if (res) return;
    if (n.nodeType===1 && n.classList && (n.classList.contains('vn')||n.classList.contains('cap'))) return;
    if (n.nodeType===3){
      if (off <= acc + n.nodeValue.length){ res = {node:n, offset:off-acc}; return; }
      acc += n.nodeValue.length; return;
    }
    for (const c of n.childNodes){ rec(c); if (res) return; }
  })(root);
  return res;
}
function rangoDe(m, bodyEl){
  bodyEl = bodyEl || pgBody;
  if (m.libro !== LIBRO) return null;
  const r = RES.get(m.id); if (!r) return null;
  const k = plano.findIndex(p => p.cap===m.cap && p.vers===m.vers);
  const el = bodyEl.querySelector('.v[data-k="'+k+'"]'); if (!el) return null;
  const a = nodoEn(el, r.ini), b = nodoEn(el, r.fin);
  if (!a || !b) return null;
  const rg = document.createRange();
  try { rg.setStart(a.node, a.offset); rg.setEnd(b.node, b.offset); } catch(e){ return null; }
  return rg;
}
function aplicarHighlights(){
  for (const c of COLORS){ CSS.highlights.delete('f-'+c); CSS.highlights.delete('b-'+c); }
  CSS.highlights.delete('aprox');
  const b = {}, dud = [];
  for (const m of marcas){
    if (!visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, pgBody); if (!rg) continue;
    const n = (m.estilo==='fill'?'f-':'b-') + m.color;
    (b[n] = b[n] || []).push(rg);
    const g = RES.get(m.id).grado;
    if (g === 'aprox' || g === 'versiculo') dud.push(rg.cloneRange());
  }
  for (const n in b) CSS.highlights.set(n, new Highlight(...b[n]));
  if (dud.length) CSS.highlights.set('aprox', new Highlight(...dud));
}
/* La escala del destello vive aquí arriba a la fuerza: el bloque de estilos
   de abajo la usa en el momento en que se carga la página, y un const no
   existe antes de su propia línea. Declararla después del uso no es un
   detalle de orden —es un ReferenceError que mata el script entero. */
const ESCALA = [.04, .09, .15, .22, .30, .38];

/* ENCENDER LA REFERENCIA ANTES DE SALTAR. Sube en rampa hasta el dorado
   pleno y solo entonces llama a lo que sigue. La curva es cuadrática por lo
   mismo que la del destello: el ojo lee el color por la raíz del pigmento, y
   una rampa lineal se ve como un escalón al principio y como nada al final.
   Al terminar se cede un cuadro más para que el último paso alcance a
   pintarse antes de que el cálculo congele todo. */
const DORADO = '184,137,43', TOPE_DORADO = .62, RAMPA = 260;
function pintarDorado(el, k){
  const a = (k * k * TOPE_DORADO).toFixed(3);
  el.style.backgroundColor = 'rgba(' + DORADO + ',' + a + ')';
  el.style.boxShadow = '0 0 0 3px rgba(' + DORADO + ',' + a + ')';
}
function apagar(el){ el.classList.remove('buscando'); el.style.backgroundColor = ''; el.style.boxShadow = ''; }
function encender(el, alLlegar){
  const t0 = performance.now();
  (function sube(ahora){
    const k = Math.min(1, (ahora - t0) / RAMPA);
    pintarDorado(el, k);
    if (k < 1) return requestAnimationFrame(sube);
    requestAnimationFrame(alLlegar);
  })(t0);
}
if (HL_API){
  const F = Object.fromEntries(COLORS.map(c => [c, lavado(c)]));
  const st = document.createElement('style');
  st.textContent = COLORS.map(c =>
    '::highlight(f-'+c+'){ background-color:'+F[c]+'; }\n'+
    '::highlight(b-'+c+'){ text-decoration:underline '+GRUESO_TRAZO+'px '+TRAZO_HEX[c]+';'+
    ' text-underline-offset:4px; text-decoration-skip-ink:none; }'
  ).join('\n') +
  '\n::highlight(aprox){ text-decoration:underline dotted 2px #b23a3a; text-underline-offset:4px; }' +
  /* Naranja, tres pulsos, y ya. Probamos el contorno pegado a las letras —se
     veía fantasmal— y el marco alrededor del versículo —se veía bien, pero
     pedía una capa de elementos encima de la hoja y medir rectángulos en cada
     salto—. Esto es un fondo y nada más: dos estados, un puñado de relojes.
     Lo único que hay que cuidar es que no se confunda con la marca naranja de
     abajo, y de eso se encarga el movimiento: la marca no late. */
  ESCALA.map((a, i) =>
    '\n::highlight(d' + i + '){ background-color:rgba(255,138,20,' + a + '); }').join('');
  document.head.appendChild(st);
}
/* UNA SOLA RESPIRACIÓN, NO TRES PARPADEOS.

   Lo que se leía como alarma era el encendido y apagado: algo que aparece de
   golpe tres veces es un foco, y un foco avisa de un peligro. Aquí no hay
   peligro, hay un "es aquí". Así que ahora el color SUBE, se queda un momento
   y se DISUELVE, sin pasar dos veces por el mismo sitio. Una respiración.

   La subida es rápida y la bajada es como el doble de lenta, que es como se
   comporta cualquier cosa que se desvanece de verdad —tinta secándose, una
   nota de piano— y por eso se siente orgánico y no mecánico. Y la escala de
   opacidades no es lineal sino cuadrática: el ojo percibe el color en
   proporción a la raíz del pigmento, así que pasos iguales de número se ven
   como saltos desiguales de brillo. */
let relojes = [];
function apagarDestello(){
  relojes.forEach(clearTimeout); relojes = [];
  if (HL_API) for (let i = 0; i < ESCALA.length; i++) CSS.highlights.delete('d' + i);
}
function resaltarSuave(rangos){
  if (!HL_API || !rangos || !rangos.length) return;
  apagarDestello();
  const marca = new Highlight(...rangos);
  const poner = n => {
    for (let i = 0; i < ESCALA.length; i++) CSS.highlights.delete('d' + i);
    if (n !== null) CSS.highlights.set('d' + n, marca);
  };
  /* TRES RESPIRACIONES. Aquí decía dos, y decía que tres eran un tic. Lo
     pedido son tres, y en uso hay una razón que la teoría no vio: llegar de un
     salto largo no es como encender una marca que ya sabías dónde estaba. El
     bonche de hojas termina de girar, los ojos aterrizan en cualquier parte de
     la hoja y para cuando encuentran el sitio ya iba la segunda. Con tres,
     todavía queda una por ver.
     Se pagan unos 900 ms más de destello, y ese es el costo real de la
     decisión: si alguna vez estorba, aquí es donde se baja el número.
     Entre una y otra NO se apaga: baja hasta el tinte más tenue y vuelve a
     subir. Apagarse del todo y volver a prender es parpadeo, y el parpadeo
     es lo que se lee como alarma. Bajar y subir es oleaje.
     El QUIETO se acorta un poco con el número de vueltas: tres mesetas del
     largo de las de antes se harían eternas, y lo que hace falta repetir es el
     pulso, no la pausa. */
  const guion = [];
  let t = 0;
  const VUELTAS = 3;
  const SUBE = 55, BAJA = 105, QUIETO = 340, ENTRE = 120;
  for (let vuelta = 0; vuelta < VUELTAS; vuelta++){
    /* la primera sube desde nada; las demás, desde el tinte que quedó */
    for (let i = (vuelta ? 1 : 0); i < ESCALA.length; i++){ guion.push([i, t]); t += SUBE; }
    t += QUIETO;
    const ultima = vuelta === VUELTAS - 1;
    const hasta = ultima ? -1 : 0;                    // la última baja hasta apagarse
    for (let i = ESCALA.length - 2; i > hasta; i--){ guion.push([i, t]); t += BAJA; }
    if (!ultima) t += ENTRE;                          // un respiro entre una y otra
  }
  guion.push([null, t]);
  for (const [n, cuando] of guion){
    if (cuando === 0) poner(n);
    else relojes.push(setTimeout(() => poner(n), cuando));
  }
}
function flash(m){
  const rg = rangoDe(m, pgBody);
  if (rg) resaltarSuave([rg]);
}

/* ---------- glosas al margen (centrado por grupo) ---------- */
const GAP = 9;   /* aire entre glosas del margen; con el giro actual las esquinas
                    apenas se asoman 0.9px, así que sobra de sobra */
function colocarMargen(bodyEl, marginEl){
  const mR = marginEl.getBoundingClientRect();
  if (mR.width < 8) return;
  const alto = marginEl.clientHeight, items = [];
  for (const m of marcas){
    if (!m.nota || !visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, bodyEl); if (!rg) continue;
    const rects = rg.getClientRects(); if (!rects.length) continue;
    const d = document.createElement('div');
    d.className = 'gl gl-margin g-' + m.color; d.dataset.gl = m.id;
    d.innerHTML = glossHTML(m,'x').replace(/^<div[^>]*>|<\/div>$/g,'');
    const forma = formaOrganica(m);          /* la misma forma que tendría en cualquier otro sitio */
    d.style.cssText = forma.css;
    d.style.top = '0px'; marginEl.appendChild(d);
    asentarGiro(d, forma.frac);              /* ya está en el papel: ya se puede medir su alto */
    items.push({ m, el:d, h:d.offsetHeight, deseo: rects[0].top + rects[0].height/2 - mR.top });
  }
  if (!items.length) return;
  items.sort((a,b) => a.deseo - b.deseo);
  let cl = items.map(it => ({items:[it], n:1, suma:it.deseo, centro:it.deseo, h:it.h}));
  let cambio = true, guard = 0;
  while (cambio && guard++ < 300){
    cambio = false;
    for (let i = 0; i < cl.length-1; i++){
      if (cl[i].centro + cl[i].h/2 + GAP > cl[i+1].centro - cl[i+1].h/2){
        const a = cl[i], b = cl[i+1];
        const m = {items:a.items.concat(b.items), n:a.n+b.n, suma:a.suma+b.suma, h:a.h+b.h+GAP};
        m.centro = m.suma/m.n; cl.splice(i,2,m); cambio = true; break;
      }
    }
    if (cambio) continue;
    for (const c of cl){
      if (c.h >= alto){ if (Math.abs(c.centro-alto/2)>.5){ c.centro = alto/2; cambio = true; } continue; }
      const t = c.centro-c.h/2, b = c.centro+c.h/2;
      if (t < 0){ c.centro -= t; cambio = true; } else if (b > alto){ c.centro -= (b-alto); cambio = true; }
    }
  }
  for (const c of cl){ let y = c.centro-c.h/2; for (const it of c.items){ it.el.style.top = Math.round(y)+'px'; y += it.h+GAP; } }
}

/* ---------- selección y toque ---------- */
function offsetGlobal(node, off){
  const el = node.nodeType===3 ? node.parentElement : node;
  const v = el && el.closest ? el.closest('.v') : null;
  if (!v) return null;
  /* Si el punto cae dentro del número, se pega al arranque del versículo en
     vez de rendirse. user-select:none evita el caso común —el doble clic— pero
     no todos: seleccionar todo, arrastrar desde el versículo anterior o algún
     navegador que lo ignore. Y devolver null aquí no fallaba con un aviso:
     fallaba en silencio, que es la peor manera. Redondear hacia el primer
     carácter del texto es lo que el usuario quiso decir de todos modos. */
  if (el.closest('.vn, .cap')) return { k:+v.dataset.k, off:0 };
  let acc = 0, out = null;
  (function rec(n){
    if (out !== null) return;
    if (n.nodeType===1 && n.classList && (n.classList.contains('vn')||n.classList.contains('cap'))) return;
    if (n === node && n.nodeType===3){ out = acc+off; return; }
    if (n.nodeType===3){ acc += n.nodeValue.length; return; }
    for (const c of n.childNodes){ rec(c); if (out !== null) return; }
  })(v);
  return out === null ? null : { k:+v.dataset.k, off:out };
}
function puntoA(x,y){
  let p = null;
  if (document.caretPositionFromPoint){ const q = document.caretPositionFromPoint(x,y); if (q) p={node:q.offsetNode,offset:q.offset}; }
  else if (document.caretRangeFromPoint){ const q = document.caretRangeFromPoint(x,y); if (q) p={node:q.startContainer,offset:q.startOffset}; }
  return p ? offsetGlobal(p.node, p.offset) : null;
}
function marcaEn(k, off){
  const it = plano[k];
  return marcas.find(m => m.cap===it.cap && m.vers===it.vers && visible(m) &&
    RES.has(m.id) && off >= RES.get(m.id).ini && off < RES.get(m.id).fin);
}
/* ============================================================
   EL PANEL DE LA MARCA. Uno solo para todo: el que sale al subrayar
   y el que sale al tocar una marca ya hecha son el mismo panel, con
   los mismos mandos en el mismo orden y en el mismo sitio. Antes eran
   dos menús distintos para el mismo objeto, y había que aprenderse los
   dos.

   TODA MARCA ES UNA GLOSA. Los dos botones no eligen QUÉ clase de cosa
   estás haciendo —siempre es la misma, una nota con un ancla— sino cómo
   se dibuja el ancla: el texto al que la nota se agarra va resaltado o
   va subrayado. De ahí salen las dos consecuencias que ordenan todo lo
   demás: la caja de escribir está SIEMPRE, y sin texto no hay nada que
   guardar.

   NADA SE GUARDA HASTA CERRAR. Mientras el panel está abierto, lo que
   tocas se ve en la hoja pero no llega al almacén: se cobra entero al
   tocar fuera, y solo si hay texto. Un subrayado hecho por accidente se
   va sin dejar rastro —que es lo que hacía el menú de antes y no había
   por qué perder— y una glosa que vacías es una glosa que se borra.
   ============================================================ */
const menu = $('menu');
let ultimoBorrado = null, tempDeshacer = null;
/* LA ÚLTIMA ETIQUETA QUE PUSISTE, y nada más que eso. Aquí vivía la
   "etiqueta activa", que se ponía sola a cada marca nueva: ponerle algo
   a lo que escribes sin que lo hayas pedido es adivinar, y adivinar en
   silencio se descubre tarde y de mala manera. Ahora no se aplica a
   nada; solo sale en negrita en la lista. Es toda la ayuda que hacía
   falta —la de la tanda de hoy se ve de un vistazo entre veinte y se
   toca sin buscarla— y no decide nada por ti. */
let ultimaEtiqueta = '';
/* LA MARCA QUE SE ESTÁ EDITANDO, y lo poco que hay que recordar para
   saber qué hacer con ella al cerrar:
   · nueva      — todavía no existía; si te vas sin escribir, no existió.
   · teniaNota  — traía nota al abrir. Vaciarla es borrar la marca.
                  Sin esto, una marca vieja SIN nota —de las de antes de
                  este cambio— se borraría solo por mirarla, porque su
                  caja nace vacía y vacía se queda. */
let borrador = null;

let ultimoRect = null;
/* LA GENERACIÓN DEL PANEL, que hace falta desde que el panel tarda en irse.

   El adiós dura unas décimas, y en esas décimas puede abrirse otro panel
   —tocar un vínculo cierra el de antes y enseña el suyo en la misma línea—. Sin
   una cuenta, el temporizador del adiós del primero llegaría tarde y vaciaría
   el segundo, que ya estaba puesto. Cada vez que el panel se enseña o se
   recoge, la cuenta sube; el adiós solo limpia si nadie ha vuelto a tocarlo. */
let vidaMenu = 0;
function mostrarMenu(html, rect){
  guardarMenu();                          /* corta un adiós a medias, si lo hay */
  if (rect) ultimoRect = rect;
  menu.innerHTML = html;
  menu.style.display = 'flex';
  colocarMenu();
}
/* Recoger el panel de verdad: esto es lo que antes hacía ocultarMenu de una
   vez, y ahora es el final de los dos caminos —el instantáneo y el del adiós—.
   Devuelve el panel a su estado de reposo: sin transformación, sin la
   transparencia del adiós y sin el ancho de glosa, que la lista de vínculos
   reusa el mismo #menu y no es una glosa. */
function guardarMenu(){
  vidaMenu++;
  if (menu._adios){ menu._adios.cancel(); menu._adios = null; }
  /* El deslizamiento de las etiquetas y su alto de destino se van con el
     panel. Si no, un panel cerrado a media apertura de la lista dejaría el
     alto apuntado, y el SIGUIENTE panel —que quizá no tiene ni lista— se
     colocaría con la medida del anterior. */
  if (menu._resbalon){ menu._resbalon.cancel(); menu._resbalon = null; }
  menu._altoFinal = 0;
  menu.style.display = 'none';
  menu.innerHTML = '';
  menu.style.width = '';
  menu.style.transform = '';
  menu.style.opacity = '';
  menu.style.pointerEvents = '';
}
/* Medir y colocar es su propia función porque ahora hay que rehacerlo
   sin volver a pintar: cuando sube el teclado la caja de etiquetas se
   pliega, el panel encoge, y un panel que encoge sin recolocarse se
   queda flotando donde ya no está lo que señalaba. */
function colocarMenu(){
  const r = ultimoRect || {left:0,top:0,width:0,height:0,bottom:0};
  const s = stage.getBoundingClientRect(), w = menu.offsetWidth;
  /* EL ALTO QUE MANDA ES EL DE DESTINO MIENTRAS SE PLIEGAN LAS ETIQUETAS.
     Durante el pliegue el panel mide algo que ya no va a medir, y colocarMenu
     lo llaman de paso otras cosas —escribir en la caja, sin ir más lejos—. Con
     el alto de ese instante, cada una de esas llamadas plantaría el panel en
     un sitio distinto del que el deslizamiento tiene por meta, y el panel
     daría el respingo que este pliegue viene a quitar. */
  const h = menu._altoFinal || menu.offsetHeight;
  /* EL PANEL DE LA GLOSA VA CENTRADO; el resto, sobre lo que señalaste.

     Iba centrado en el pasaje, y con un panel estrecho eso estaba bien: era un
     bocadillo, y un bocadillo apunta. Desde que mide lo que mide la glosa ya
     no apunta a nada —ocupa media pantalla— y lo único que hacía era saltar de
     izquierda a derecha según qué palabra hubieras tocado, y pegarse a un filo
     cuando el pasaje caía en una esquina. Centrado se queda quieto: abras la
     glosa que abras, aparece en el mismo sitio, y de dónde sale ya lo cuenta
     el crecimiento, que sigue anclado en las palabras señaladas.
     Solo el de la glosa: la lista de «citado desde» sí es un bocadillo de su
     botón, y esa sí tiene a qué apuntar. */
  const p = sitioDelMenu(w, h, r, s);
  menu.style.left = p.x + 'px';
  menu.style.top  = p.y + 'px';
}
/* DÓNDE IRÍA UN PANEL DE ESTE TAMAÑO. Sale de colocarMenu para poder
   preguntarlo SIN mover nada: el pliegue de las etiquetas necesita saber a
   dónde va a parar el panel antes de empezar a plegarlas, y con la cuenta
   metida dentro del que la aplica no había manera de preguntar sin aplicar. */
function sitioDelMenu(w, h, r, s){
  let x = borrador ? (s.width - w) / 2
                   : r.left - s.left + r.width/2 - w/2;
  let y = r.top - s.top - h - 8;
  if (y < 2) y = r.bottom - s.top + 8;
  return { x: Math.round(Math.min(Math.max(x, 2), s.width - w - 2)),
           y: Math.round(Math.min(Math.max(y, 2), s.height - h - 2)) };
}
function ocultarMenu(){
  if (menu._teclado) menu._teclado();
  /* El punto del adiós se mide ANTES de cerrar el borrador: cerrarlo repinta
     la hoja, y lo que hace falta es de dónde salió este panel. Y solo para el
     panel de la glosa: la lista de vínculos no nació de un pasaje, así que no
     tiene a dónde recogerse. */
  const adios = (borrador && menu.style.display !== 'none') ? origenDelPanel() : null;
  const volo = borrador ? cerrarBorrador() : false;
  ultimoRect = null;
  /* Si lo escrito se fue volando a su sitio, no hay nada más que despedir: el
     vuelo ya cuenta la salida, y encoger el panel además sería contarla dos
     veces. */
  if (adios && !volo) morirPanel(adios); else guardarMenu();
}

/* ---------- lo que se ve ---------- */

/* EL ANTICIPO ES LA GLOSA, no una caja de formulario que se le parece.

   La caja de escribir y la nota del margen eran dos objetos distintos que
   contaban lo mismo: se escribía en un textarea de panel, a 16px, y lo que
   quedaba era una glosa de 13.95 con sus etiquetas debajo. Dos cosas, no una,
   y ninguna de las dos enseñaba cómo iba a quedar la otra.

   Aquí el recuadro es una .gl de verdad: la misma clase, la misma familia, el
   mismo tamaño derivado de --fs, la misma forma torcida que le toca por su id,
   y el MISMO ANCHO que tendrá al margen. El ancho es la mitad del asunto: si no
   es el de allá, los renglones parten en otro sitio y esto deja de ser un
   anticipo para ser otra cosa parecida.

   Y las etiquetas van DENTRO, pintadas con etiquetasHTML —el mismo HTML que
   usa la hoja—, no con un marcado paralelo que mañana se quede atrás. */
/* El ancho de dentro, sin el relleno. getBoundingClientRect() da la caja
   entera —relleno y borde incluidos— y para saber dónde parten los renglones
   hace falta el hueco donde de verdad cae el texto. Medido: el cuerpo da 412
   de caja y 380 de contenido, y esos 32 son justo lo que separaba la cuenta de
   la nota real. */
function anchoContenido(el){
  if (!el) return 0;
  const cs = getComputedStyle(el);
  return el.getBoundingClientRect().width -
         (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
}
function anchoVista(){
  /* SI YA HAY UNA GLOSA PINTADA, SU ANCHO ES EL BUENO: medido, no estimado, y
     válido para las tres disposiciones sin tener que reproducir la cuenta de
     cada una. Al margen la nota mide la columna menos su hueco de giro; abajo,
     la columna de texto menos la sangría; al pie, el ancho del pie. Calcular
     eso tres veces aquí sería tener la misma medida en dos sitios, y uno se
     queda atrás —ya pasó con el ancho del margen—. */
  const puesta = document.querySelector('#pgMargin .gl[data-gl], #pgFoot .gl[data-gl], #pgBody .gl[data-gl]');
  if (puesta){
    const w = puesta.getBoundingClientRect().width;
    if (w > 60) return Math.round(w);
  }
  /* Y si la hoja todavía no tiene ninguna, se estima por disposición. Forzar
     el ancho del margen en las otras dos era partir los renglones donde no se
     van a partir, que es justo lo que este anticipo venía a arreglar. */
  if (placement === 'foot'){
    /* NO SE MIDE EL PIE, y esto costó una segunda mirada. Cuando la hoja
       todavía no tiene ninguna nota al pie, .pg-foot:empty lo pone en
       display:none: medirlo da CERO y la cuenta se caía al ancho del margen,
       que no tiene nada que ver. O sea que justo la primera nota de la hoja
       —la única que necesita la estimación, porque las demás ya tienen una
       hermana pintada que medir— era la que salía mal.
       Y aun con el pie visible, su ancho tampoco es el de la nota: layoutInto
       mete las notas en un .foot-in de DOS columnas cuando el texto va a dos.
       Así que se deriva del hueco DONDE VA A CABER, que es el de su padre: el
       pie es hermano de .pg-cols y ocupa el ancho entero de la hoja, no el de
       la columna de texto. Medido en un teléfono de 412: el padre da 663, y
       (663 − 15 de hueco) / 2 − 5 del margen de .gl-foot = 319, que es
       exactamente lo que mide la nota una vez puesta.
       Lo levantó la segunda revisión de Codex. */
    const fc = columns >= 2 ? 2 : 1;
    const w = anchoContenido(pgFoot.parentElement);
    if (w > 60) return Math.max(120, Math.round((w - (fc - 1) * 15) / fc) - 5);
  }
  if (placement === 'below'){
    /* La columna se le PREGUNTA al cuerpo, no se deduce de `columns`: entre las
       columnas hay un hueco, y repartir el ancho a partes iguales sin descontarlo
       da de más. Medido en un teléfono de 412 a dos columnas: la cuenta ingenua
       daba 187 y la nota mide 164. Con el column-gap computado la cuenta sale
       sola y sigue saliendo el día que ese hueco cambie. Los 19px son la
       sangría que .gl-below se reserva —14 a la izquierda y 5 a la derecha—. */
    const cs = getComputedStyle(pgBody);
    const cc = parseInt(cs.columnCount) || Math.max(1, columns);
    const cg = parseFloat(cs.columnGap) || 0;
    const w = anchoContenido(pgBody);
    if (w > 60) return Math.max(120, Math.round((w - cg * (cc - 1)) / cc) - 19);
  }
  return Math.max(120, MARGIN_W() - 8);
}

function panelHTML(m){
  const forma = formaOrganica(m);
  return '<div class="mcolores">' +
      COLORS.map(c => '<button class="mc" data-color="' + c + '" style="background:' +
        LINE_HEX[c] + '"' + (m.color===c ? ' data-on="1"' : '') + '></button>').join('') +
    '</div>' +
    /* Los dos primeros dicen lo que hacen: no "esto es un resaltado" sino "el
       texto de esta glosa va resaltado". El tercero no es de esa familia —no
       elige nada, termina— y por eso se ve distinto; ver .mmodos y .mok. */
    '<div class="mmodos">' +
      '<button data-modo="fill" class="modo' + (m.estilo!=='border' ? ' on' : '') +
        '"><span class="mg" aria-hidden="true">▮</span>resaltado</button>' +
      '<button data-modo="border" class="modo' + (m.estilo==='border' ? ' on' : '') +
        '"><span class="mg" aria-hidden="true">▁</span>línea</button>' +
      '<button type="button" class="mok" data-acc="ok"' +
        ' aria-label="Terminar y guardar la glosa">OK</button>' +
    '</div>' +
    /* El valor NO va aquí dentro. Un textarea con el texto metido en el
       HTML obliga a escapar bien lo que escribió una mano, y basta un
       caso raro para que la nota se corrompa al releerla. Se pone
       después, por propiedad, donde no hay escape que valga. */
    /* EL ANCLA VA TAMBIÉN, y no es un adorno: glossHTML le antepone a cada
       nota un «12·» que ocupa sitio en el PRIMER RENGLÓN y por tanto decide
       dónde parte. Sin ella, el anticipo acertaba el ancho y erraba el corte,
       que es la mitad de lo que se venía a copiar. Lo levantó Codex. */
    '<div class="gl gl-vista g-' + m.color + '" id="glVista" style="' + forma.css + '">' +
      '<span class="gl-ref"></span>' +
      /* EL ECO: el mismo texto, calcado encima y sin tinta, solo para poder
         subrayar las escrituras. Un textarea no deja pintar nada por dentro
         —no admite marcado—, así que la raya se dibuja en una copia puesta
         justo encima. Va aquí, antes del textarea, para que no le quite el
         sitio a nadie: se coloca por medida, no por flujo. */
      '<div class="gl-eco" aria-hidden="true"></div>' +
      '<textarea id="glosaCaja" rows="2" placeholder="glosa…" spellcheck="false"></textarea>' +
      '<span class="gl-tags"></span>' +
    '</div>' +
    /* LA LISTA DE ETIQUETAS YA NO VIVE ABIERTA. Las que lleva puestas se leen
       arriba, dentro de la glosa, que es donde van a estar para siempre; abrir
       la lista es para CAMBIARLAS, y eso no se hace en cada nota. */
    '<button class="mtags" data-acc="vertags"></button>' +
    tagboxHTML(m);
}
/* LA LISTA, EN RENGLÓN Y CON SU ALMOHADILLA. Eran pastillas, y una pastilla
   dice «esto es una cosa»; aquí lo que hace falta es un vocabulario que se
   recorra con la vista, como el índice de un libro. Con la almohadilla delante
   cada palabra ya se lee como etiqueta sin necesidad de recuadro.

   Y las que YA ESTÁN PUESTAS se apagan, que es lo contrario de lo que hacía
   antes. Tiene su lógica: puestas ya se ven dentro de la glosa de arriba, así
   que aquí no hay nada que decidir sobre ellas. Lo que esta lista ofrece es lo
   que TODAVÍA PUEDES añadir. Tocar una apagada la quita, que es la vuelta
   natural del mismo gesto. */
function tagboxHTML(m){
  const tiene = new Set(m.etiquetas || []);
  const lista = [...new Set([...todasEtiquetas().mapa.keys(), ...tiene])].sort();
  return '<div class="tagbox' + ((m.nota||'').trim() ? '' : ' dormida') + '">' +
    '<div class="taglista">' +
    (lista.length
      ? lista.map(t => '<button class="tg' + (tiene.has(t) ? ' on' : '') +
          (t && t === ultimaEtiqueta ? ' ultima' : '') +
          '" data-tag="' + esc(t) + '">#' + esc(t) + '</button>').join('')
      : '<span class="vacio">sin etiquetas todavía</span>') +
    '</div><div class="tagctl">' +
    '<input id="tagNueva" placeholder="nueva…" enterkeyhint="done" ' +
      'autocapitalize="none" autocomplete="off" />' +
    /* EL + DICE LO QUE HACE. Era un signo suelto de menos de un centímetro
       al lado de una caja de texto, y un signo no se lee: se adivina. */
    '<button class="crear" data-acc="creartag" ' +
      'title="Crear la etiqueta">+ crear</button>' +
    '</div></div>';
}
/* PAPEL DEBAJO, TINTE ENCIMA, EN UNA SOLA PILA DE FONDO.

   El color de la marca vive en background-color, puesto por .g-yellow y sus
   hermanas, y es translúcido a propósito: al margen la nota tiene la crema de
   la hoja detrás y con una insinuación basta. Aquí el recuadro está sobre el
   panel oscuro, así que hace falta papel opaco DEBAJO del tinte —si no, sale
   letra oscura sobre fondo oscuro y se reporta, con razón, como «no se puede
   editar»—.

   Y hay un detalle que cuesta descubrir: un fondo solo tiene UN color, y las
   imágenes de fondo se pintan ENCIMA de él. Así que el papel va de color y el
   tinte pasa a ser una imagen —un degradado de un solo tono— sobre el papel.
   Un pseudoelemento por debajo no sirve: dentro de un contexto de apilado el
   fondo del propio elemento se pinta primero.

   El alfa sube a un mínimo legible conservando el matiz: los tintes de la hoja
   van de .07 a .19 y a .08 el verde y el azul son papel a secas cuando no
   tienen la hoja detrás para contrastarlos. */
function opacarVista(caja){
  const tinte = getComputedStyle(caja).backgroundColor;
  caja.style.backgroundColor = colorPapel();
  if (!tinte || tinte === 'rgba(0, 0, 0, 0)' || tinte === 'transparent') return;
  const n = tinte.match(/[\d.]+/g) || [];
  const a = n.length > 3 ? parseFloat(n[3]) : 1;
  const fuerte = 'rgba(' + n[0] + ',' + n[1] + ',' + n[2] + ',' + Math.max(a, 0.42) + ')';
  caja.style.backgroundImage = 'linear-gradient(' + fuerte + ',' + fuerte + ')';
}
/* Vestir el anticipo con lo de su marca. cssText borra TODO lo puesto en línea,
   así que la forma se escribe primero y las medidas después: al revés, cambiar
   de color le quitaría el ancho y el cuerpo de letra. */
function vestirVista(m){
  const caja = menu.querySelector('#glVista'); if (!caja) return;
  caja.className = 'gl gl-vista g-' + m.color;
  caja.style.cssText = formaOrganica(m).css;
  /* Se le pasa --fs, NO un font-size ya hecho. El panel cuelga del escenario y
     no hereda el --fs de la hoja, pero dárselo como font-size en línea pisaría
     el factor con el que .gl calcula su letra: se escribiría a 15 y se leería a
     13.95, los renglones partirían en otro sitio y el anticipo mentiría. */
  caja.style.setProperty('--fs', fontSize + 'px');
  caja.style.setProperty('--fs-glosa', fontSizeGlosa + 'px');
  caja.style.setProperty('--papel', colorPapel());
  caja.style.width = anchoVista() + 'px';
  opacarVista(caja);
}
/* EL PANEL NACE DE LO QUE SEÑALASTE, no encima de ello.

   Aparecía de golpe, hecho y derecho, y eso lo delata como lo que no queremos
   que sea: una ventana del programa que se planta delante de la hoja. Creciendo
   desde el propio pasaje —desde el punto exacto que acabas de subrayar— se lee
   como que la nota SALE de ahí, que es lo que de verdad pasa.

   El truco está en transform-origin, no en un viaje: se ancla el crecimiento en
   las palabras señaladas y basta con escalar. Un panel que además se traslada
   se lee como algo que llega volando de otro sitio, y de dónde viene ya lo dice
   el sitio donde crece.

   170ms, que es poco a propósito: esto no cuenta nada —a diferencia del vuelo
   del final, que sí enseña adónde fue lo escrito— solo evita el salto. Un
   nacimiento lento sería una animación pidiendo que la miren.

   Y AL CERRARSE, DEPENDE DE SI HAY VUELO. Con algo escrito la glosa se va
   volando a su sitio, y eso ya es una salida: encogerla además sería contar la
   misma despedida dos veces. Pero cuando no se escribió nada no hay vuelo
   ninguno, y ahí el panel desaparecía de golpe —abrir era suave y cerrar era
   un corte—. Para ese caso está morirPanel: el mismo camino, del revés. */
/* EL PUNTO POR EL QUE EL PANEL CRECE Y POR EL QUE SE RECOGE, que es el mismo:
   el centro de lo que señalaste, en coordenadas del panel y sin salirse de él.
   Si lo señalado queda lejos —el panel topa con un filo de la pantalla— el
   origen se pega al borde más cercano, que sigue apuntando hacia allá.
   Devuelve null cuando no hay de dónde tirar, y también cuando se ha pedido
   menos movimiento: así los dos extremos preguntan una sola vez y no pueden
   contestarse distinto. */
function origenDelPanel(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
  if (!ultimoRect) return null;
  const m = menu.getBoundingClientRect();
  if (!m.width || !m.height) return null;
  const cx = ultimoRect.left + ultimoRect.width / 2;
  const cy = ultimoRect.top + ultimoRect.height / 2;
  const ox = Math.max(0, Math.min(m.width, cx - m.left));
  const oy = Math.max(0, Math.min(m.height, cy - m.top));
  return Math.round(ox) + 'px ' + Math.round(oy) + 'px';
}
function nacerPanel(){
  const origen = origenDelPanel(); if (!origen) return;
  menu.style.transformOrigin = origen;
  menu.animate([
    { transform:'scale(.82)', opacity:0 },
    { transform:'none', opacity:1 }
  ], { duration:170, easing:'cubic-bezier(.2,.75,.35,1)' });
}
/* EL PANEL SE RECOGE POR DONDE SALIÓ.

   Cuando te vas sin escribir nada no hay glosa que volar, y el panel se
   quitaba de un fotograma para otro. Nacer despacio y desaparecer de golpe es
   la peor de las dos mitades: el corte llama más la atención que el
   nacimiento, y encima deja la duda de si se guardó algo.

   Es nacerPanel del revés y con el mismo origen —se recoge hacia el pasaje del
   que salió—, con dos diferencias a propósito:
   · 140ms contra 170. Irse puede ser más rápido que llegar: al llegar hay algo
     nuevo que mirar y al irse ya no, y una salida que se demora es una salida
     pidiendo que la miren.
   · la curva al revés. Nacer frena al final para posarse; irse acelera, que es
     como se va algo que ya no está.

   NO SE CLONA NADA, a diferencia del vuelo. El vuelo dura 2.4 segundos y en
   ese rato la hoja se repinta, así que necesita un calco suelto que nadie
   pueda borrarle a media pista. Aquí son catorce centésimas y lo que se anima
   es el panel mismo, que ya está donde tiene que estar; el precio es que
   vaciarlo hay que aplazarlo hasta el final, y de eso se encarga la cuenta de
   vidaMenu.

   La transparencia va con la escala y no sola: encoger sin desvanecer parece
   que la nota se cae por un desagüe, y desvanecer sin encoger no cuenta a
   dónde fue. Y se apagan los punteros desde el primer fotograma, que si no un
   panel ya invisible sigue comiéndose el toque siguiente.

   EL ESTADO FINAL SE ESCRIBE EN EL PANEL, NO SE DEJA EN MANOS DE fill.
   Sin nada, al acabar la animación el panel vuelve un fotograma a su tamaño
   entero antes de que le llegue el display:none: un parpadeo justo al final,
   que es donde más se ve. Lo primero que probé fue fill:'forwards', y trajo un
   fallo peor —medido, no supuesto—: si el panel se reabre en el instante justo
   después de terminar el adiós, guardarMenu ya no encuentra animación viva que
   cortar, el relleno se queda puesto, y el panel nuevo aparece a escala .82 y
   transparente. Estaba abierto y no se veía.
   Escribiendo el estado final como estilo en línea ANTES de animar no hace
   falta relleno ninguno: mientras corre mandan los fotogramas, y cuando
   termina el panel ya está donde tiene que estar. Y guardarMenu, que devuelve
   esos dos estilos a su sitio, deja de tener que acertar con el momento. */
function morirPanel(origen){
  const g = ++vidaMenu;
  menu.style.transformOrigin = origen;
  menu.style.pointerEvents = 'none';
  menu.style.transform = 'scale(.82)';
  menu.style.opacity = '0';
  const a = menu.animate([
    { transform:'none', opacity:1 },
    { transform:'scale(.82)', opacity:0 }
  ], { duration:140, easing:'cubic-bezier(.65,0,.8,.25)' });
  menu._adios = a;
  /* onfinish y no la promesa `finished`: cancelar una animación cuya promesa
     se ha llegado a pedir la rechaza, y una promesa rechazada que nadie mira
     sale por consola como un error del programa sin que haya pasado nada.
     Cancelar no dispara onfinish, así que el que se va cancelado no limpia — y
     está bien, porque a ese lo canceló quien ya estaba limpiando. */
  a.onfinish = () => { if (g === vidaMenu) guardarMenu(); };
}
/* EL PANEL MIDE LO QUE MIDE LA GLOSA. Es lo que lo convierte en «esta nota y
   sus mandos» en vez de en «un panel que además enseña una nota»: la columna
   de la izquierda y la de la derecha son las mismas arriba y abajo, y el ojo
   deja de tener que emparejar dos anchos distintos.

   Con box-sizing:border-box —que lo pone el reset de arriba para todo— el
   width incluye relleno y borde, así que hay que sumarlos: si no, el recuadro
   de dentro sale más ancho que su hueco y se recorta por el filo.

   Se pone desde el guion y no en la hoja de estilos porque el ancho de una
   glosa depende de la disposición y del tamaño de letra, y eso solo se sabe
   aquí. Y se quita al cerrar, porque el mismo #menu lo reusa la lista de
   «citado desde», que no es una glosa y no tiene por qué medir como una. */
function anchoPanelComoGlosa(){
  const cs = getComputedStyle(menu);
  const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const bor = parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  /* CON TOPE, IGUAL QUE EL ALTO. La columna de glosas del teléfono mide 240px
     clavados, así que en una ventana más angosta que eso —una pantalla partida,
     una vista incrustada— el panel salía más ancho que la escena. Y entonces
     colocarMenu calcula `s.width - w - 2` en negativo: medido a 240 de ancho,
     el panel pedía 253 y se plantaba en left:-15, con el filo izquierdo y el
     principio de cada renglón fuera de la pantalla y sin nada que desplazar.
     Es el mismo fallo que el del alto, por el otro eje; el tope es la misma
     clase de red. Pasado el tope manda el max-width:100% que .gl-vista ya
     tenía: el anticipo encoge, que es lo honesto —más ancho que la pantalla no
     va a poder ser tampoco cuando se guarde—.
     Lo levantó la cuarta revisión de Codex. */
  const tope = stage.getBoundingClientRect().width - 4;
  menu.style.width = Math.round(Math.min(anchoVista() + pad + bor, tope)) + 'px';
}
/* EL ANCLA DEL ANTICIPO, con la misma cuenta que glossHTML: la señal de
   aproximación cuando el anclaje no es exacto, y la referencia que le toca.

   Va colocada en absoluto SIN left ni top, o sea en su posición estática: el
   principio del contenido, justo donde la pinta la hoja. Y como sale del flujo,
   el primer renglón del textarea se sangra a mano con su ancho. Es la única
   manera de que un textarea —que no deja fluir texto alrededor de nada— parta
   el primer renglón donde lo parte la nota de verdad. */
function pintarAncla(m){
  const ancla = menu.querySelector('#glVista .gl-ref'); if (!ancla) return;
  /* Se recalculan las referencias antes de leer la suya: la de una glosa nueva
     nace en cuanto hay texto, y depende de cuántas notas lleve ya ese
     versículo. Sale barato —solo recorre las marcas con nota— y evita repintar
     la hoja entera para averiguar dos caracteres. */
  recalcularRefs();
  const grado = (RES.get(m.id) || {}).grado;
  const senal = (grado && grado !== 'exacta' && grado !== 'cita') ? '≈' : '';
  ancla.textContent = senal + (REFS.get(m.id) || '') + '·';
  const ta = menu.querySelector('#glosaCaja');
  if (ta) ta.style.textIndent = Math.round(ancla.getBoundingClientRect().width) + 'px';
}
/* EL RECUADRO CRECE CON LO ESCRITO, como crece la glosa del margen. Un alto
   fijo delataría el formulario: al margen ninguna nota mide tres renglones
   porque sí, mide lo que ocupa. */
function ajustarAlto(ta){
  if (!ta) return;
  ta.style.height = 'auto';
  /* CON TOPE. Sin él, una nota larga hacía el panel más alto que la escena, y
     entonces colocarMenu calculaba un tope NEGATIVO —Math.min(2, negativo)— así
     que el panel se plantaba con la cabeza fuera; y como .stage recorta, lo que
     quedaba cortado era justo lo de arriba: los colores y los dos trazos, sin
     manera de llegar a ellos porque no había nada que desplazar.
     El tope es una fracción de la escena y no un número fijo: la escena mide
     470px en pantalla ancha y toda la pantalla en teléfono, así que un valor
     clavado sobraría en una y ahogaría en la otra. Lo que pase de ahí se
     desplaza dentro de la propia caja, que para eso es un textarea.
     Lo levantó la segunda revisión de Codex. */
  const tope = Math.max(80, Math.round(stage.getBoundingClientRect().height * 0.42));
  ta.style.height = Math.min(ta.scrollHeight, tope) + 'px';
  ta.style.overflowY = ta.scrollHeight > tope ? 'auto' : 'hidden';
  pintarEco();
}
/* LAS ESCRITURAS QUE ESCRIBES SE SUBRAYAN MIENTRAS ESCRIBES.

   Tocar una referencia dentro de la caja abre la ventanita con el versículo,
   pero eso no se veía por ninguna parte: el texto era texto plano y no había
   manera de saber que aquellas dos palabras respondían. En la hoja una
   referencia se reconoce por su raya de puntos; aquí no había ninguna, así
   que la única forma de descubrirlo era tocar por si acaso.

   Un textarea no admite marcado por dentro, o sea que la raya no se le puede
   poner al texto: se dibuja en una copia calcada encima, sin tinta, que solo
   aporta el subrayado. Es la técnica de siempre para esto, y toda su
   dificultad está en que el calco parta los renglones EXACTAMENTE donde los
   parte el textarea; de ahí que se copien letra, ancho, sangría y desplazamiento
   en vez de fiarlo a que dos elementos parecidos se comporten igual.

   Se subrayan las mismas que responden al toque, ni una más: las que existen
   de verdad en los datos. Una referencia a medio escribir no se subraya
   —todavía no lleva a ningún sitio— y en cuanto queda completa aparece la
   raya, que es la manera de enterarse de que ya vale. */
function pintarEco(){
  const ta = menu.querySelector('#glosaCaja');
  const eco = menu.querySelector('.gl-eco');
  if (!ta || !eco) return;
  /* La sangría del primer renglón es la del ancla, y el textarea la lleva
     puesta por propiedad: se copia de él y no se recalcula, que dos cuentas
     del mismo número acaban siempre en dos números. */
  eco.style.left      = ta.offsetLeft + 'px';
  eco.style.top       = ta.offsetTop + 'px';
  eco.style.width     = ta.offsetWidth + 'px';
  eco.style.height    = ta.offsetHeight + 'px';
  eco.style.textIndent = ta.style.textIndent || '';
  const texto = ta.value;
  const trozos = refsDe(texto).filter(refExiste)
    .sort((a, b) => a.inicio - b.inicio);
  let html = '', i = 0;
  for (const r of trozos){
    if (r.inicio < i) continue;          /* solapadas: manda la primera */
    html += esc(texto.slice(i, r.inicio)) +
            '<span class="ref">' + esc(texto.slice(r.inicio, r.fin)) + '</span>';
    i = r.fin;
  }
  /* El renglón de más al final es del navegador y no un descuido: un texto
     que acaba en salto de línea deja el último renglón vacío, y sin algo
     detrás el calco lo pierde y se descuadra a partir de ahí. */
  eco.innerHTML = html + esc(texto.slice(i)) + '\u200b';
  eco.scrollTop = ta.scrollTop;
}
/* La lista se retoca en su sitio, NUNCA repintando el panel entero. Repintar
   destruiría el textarea, y con él el foco, el cursor y el teclado del teléfono
   a media palabra. */
function refrescarTags(){
  if (!borrador) return;
  const m = borrador.m;
  const caja = menu.querySelector('.tagbox');
  const tiene = new Set(m.etiquetas || []);
  if (caja) caja.querySelectorAll('.tg').forEach(b => {
    b.classList.toggle('on', tiene.has(b.dataset.tag));
    b.classList.toggle('ultima', !!ultimaEtiqueta && b.dataset.tag === ultimaEtiqueta);
  });
  /* Y AQUÍ SE PINTAN DENTRO DE LA GLOSA, con etiquetasHTML —el mismo que usa
     la hoja—. Escribir aquí otro marcado sería tener el mismo dibujo en dos
     sitios, y uno de los dos se quedaría atrás. */
  const dentro = menu.querySelector('.gl-tags');
  if (dentro) dentro.innerHTML = etiquetasHTML(m);
  pintarAncla(m);
  const bot = menu.querySelector('.mtags');
  if (bot) bot.textContent =
    rotuloTags(!!caja && caja.classList.contains('abierta'), tiene.size);
  ajustarAlto(menu.querySelector('#glosaCaja'));
  /* Y SE RECOLOCA, porque esto acaba de cambiar el ALTO del panel: una
     etiqueta más puede partir el renglón de las etiquetas dentro de la glosa y
     estirar el recuadro. Un panel puesto encima del pasaje crecía hacia abajo
     y se le echaba encima; uno puesto debajo crecía más allá del filo de la
     escena, que recorta. Lo hacían ya los otros dos caminos que cambian el
     alto —escribir y crear una etiqueta—; a éste se le había olvidado.
     Va aquí y no en quien llama, para que el que venga mañana a añadir otro
     camino no tenga que acordarse. Lo levantó la segunda revisión de Codex. */
  colocarMenu();
}
/* El rótulo del botón de las etiquetas, en un solo sitio: lo escriben dos
   —el repintado y el pliegue— y con la cuenta escrita dos veces una de las dos
   se queda atrás. */
const rotuloTags = (abierta, cuantas) =>
  (abierta ? '▾ ' : '▸ ') + 'etiquetas' + (cuantas ? ' · ' + cuantas : '');

/* ABRIR Y CERRAR LA LISTA, SIN DAR UN SALTO.

   La lista aparecía y desaparecía de un fotograma para otro, y con ella el
   panel entero cambiaba de alto de golpe: el gesto más frecuente del panel era
   también el más brusco. Ahora se despliega como se despliega un papel doblado
   —el alto, de cero a lo que mida, y al revés—, con las mismas dos curvas del
   resto del programa: al abrir frena para posarse, al cerrar acelera para irse.

   EL ALTO SE MIDE, NO SE ADIVINA. Depende de cuántas etiquetas haya y de
   cuántos renglones ocupen, así que se pone la lista en su sitio, se mide, y se
   anima desde cero hasta esa cifra. Animar `height:auto` no vale: lo que
   interpola la API de animaciones son números, y `auto` no lo es.

   Y SE RECOLOCA EN CADA CUADRO. El panel cuelga de un `top` calculado a partir
   de su propio alto: puesto encima del pasaje y creciendo sin recolocarse,
   crece HACIA ABAJO y se echa encima justo de lo que estás mirando. Es la misma
   razón por la que refrescarTags termina llamando a colocarMenu; la diferencia
   es que aquí el alto cambia durante nueve o diez cuadros y no una sola vez.

   No se le toca la transparencia, y es a propósito: .tagbox.dormida ya usa
   opacity para decir «esto no responde todavía», y una animación que la mueva
   discutiría con esa señal —la lista dormida se abriría hasta opaca del todo
   para volver a apagarse al acabar—. El doblez solo se ve con el alto. */
const TAGS_MS = 160;
function plegarTags(caja, abrir){
  if (!caja) return;
  if (caja._pliegue){ caja._pliegue.cancel(); caja._pliegue = null; }
  /* El deslizamiento se corta con el doblez que lo trajo: el que cancela ya
     trae su propia meta, y dos deslizamientos a la vez se pelean por el mismo
     transform —gana el último, y el panel llega a la meta del otro—. */
  if (menu._resbalon){ menu._resbalon.cancel(); menu._resbalon = null; }
  caja._destino = abrir;
  /* La clase se pone SIEMPRE antes de medir: cerrada, #menu .tagbox no se
     dibuja y mediría cero, que es justo el dato que hay que averiguar del otro
     lado del pliegue. */
  caja.classList.add('abierta');
  caja.style.height = ''; caja.style.overflow = '';
  const alto = caja.getBoundingClientRect().height;
  const rematar = () => {
    caja._pliegue = null;
    menu._altoFinal = 0;
    caja.style.height = ''; caja.style.overflow = '';
    caja.classList.toggle('abierta', abrir);
    refrescarTags(); colocarMenu();
  };
  /* Quien pidió menos movimiento no recibe el doblez: la lista está o no está.
     Y si no hay nada que doblar —alto cero— tampoco hay animación que valga. */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !alto){
    rematar(); return;
  }
  /* EL PANEL SE DESLIZA, NO SE TELETRANSPORTA.

     El panel se recolocaba en cada cuadro a partir de su alto de ese
     instante, y casi siempre eso bastaba: crece hacia arriba, el `top` baja
     un poco cada cuadro y se ve venir. Pero colocarMenu tiene un escalón —si
     arriba ya no cabe, el panel se pasa DEBAJO del pasaje— y ese escalón no
     tiene cuadros intermedios que enseñar. Medido en un teléfono de 412,
     abriendo la lista sobre el versículo 2 de la hoja: el panel pasaba de
     top 54 a top 311 de un cuadro para el siguiente. 309px de salto.
     Y no pasaba siempre, solo con los pasajes que caen a esa altura —«a
     veces salta», que es exactamente como se ve desde fuera—.

     Ahora la meta se calcula UNA vez, con el alto que el panel va a tener al
     acabar, se planta ahí desde el primer cuadro, y lo que se anima es la
     diferencia: el panel arranca dibujado donde estaba y se desliza hasta la
     meta con la misma curva que dobla la lista. El escalón sigue estando —a
     veces el panel tiene que cambiarse de lado—, pero ahora el cambio de lado
     se ve, que es lo único que se le pedía.

     Es la misma técnica del vuelo de la glosa: mover con transform y dejar la
     posición de verdad ya escrita. Si el hilo se traba, el panel está donde
     tiene que estar aunque el deslizamiento se pierda. */
  const desde = menu.getBoundingClientRect();
  menu._altoFinal = abrir ? menu.offsetHeight : menu.offsetHeight - alto;
  colocarMenu();
  const hasta = menu.getBoundingClientRect();
  const dx = Math.round(desde.left - hasta.left), dy = Math.round(desde.top - hasta.top);
  /* UN VIAJE LARGO PIDE MÁS TIEMPO. Con los 160ms del doblez, el cambio de
     lado —250px o más— sale disparado: sigue siendo un salto, solo que con
     cuadros. El añadido va con la distancia y con tope, y se le da a las DOS
     animaciones para que el alto y la posición no se separen: si la lista
     acabara de desplegarse con el panel todavía en camino, se vería el
     recuadro llegando a su sitio ya lleno, que es peor que las dos cosas por
     separado.

     El factor sale de medir. Recorriendo los catorce pasajes de una hoja y
     mirando el cuadro más rápido de cada uno: el cambio de lado pasa de 309px
     —el salto— a 25, y el crecimiento de siempre, de 24 a 14. El precio es que
     abrir la lista pasa de 160ms a 258 en el caso corriente y a 520 en el
     cambio de lado, y se paga: el panel es un objeto grande, y un objeto
     grande que se coloca en diez cuadros se lee como un respingo aunque no
     llegue a saltar. */
  const viaje = Math.round(Math.hypot(dx, dy));
  const ms = TAGS_MS + Math.round(Math.min(viaje, 300) * 1.2);
  const curva = abrir ? 'cubic-bezier(.2,.75,.35,1)' : 'cubic-bezier(.65,0,.8,.25)';
  if (dx || dy){
    /* CURVA PROPIA PARA EL VIAJE, y no la del doblez. La del doblez arranca
       casi a toda velocidad —está pensada para que un papel se despliegue de
       golpe y frene al final—, y aplicada a un recorrido de 250px reparte el
       movimiento fatal: medido, 33px en el cuadro más rápido contra los 8 de
       media. Una curva que acelera y frena por igual baja ese pico a 25.
       Empiezan y acaban a la vez, que es lo que hacía falta; por dentro cada
       una hace lo suyo. */
    const res = menu.animate(
      [{ transform:'translate(' + dx + 'px,' + dy + 'px)' }, { transform:'none' }],
      { duration: ms, easing: 'cubic-bezier(.4,0,.2,1)' });
    menu._resbalon = res;
    res.onfinish = () => { if (menu._resbalon === res) menu._resbalon = null; };
  }
  caja.style.overflow = 'hidden';
  const an = caja.animate(
    [{ height: (abrir ? 0 : alto) + 'px' },
     { height: (abrir ? alto : 0) + 'px' }],
    { duration: ms, easing: curva });
  caja._pliegue = an;
  /* El rótulo dice ya lo que va a pasar y no lo que está pasando: mientras se
     cierra la clase sigue puesta —hace falta para que se siga viendo— y leerla
     diría «abierta» de una lista que se está yendo. */
  const bot = menu.querySelector('.mtags');
  if (bot) bot.textContent =
    rotuloTags(abrir, ((borrador && borrador.m.etiquetas) || []).length);
  an.onfinish = () => rematar();
}
/* ¿Está abierta, o va a estarlo? A media animación la clase dice lo que se ve
   y no lo que se ha pedido, y el botón tiene que alternar sobre lo pedido: si
   no, tocarlo dos veces seguidas y rápido la deja donde estaba. */
const tagsAbiertas = caja =>
  !!caja && (caja._pliegue ? !!caja._destino : caja.classList.contains('abierta'));

/* Dormir o despertar la lista según haya texto o no: sin nota no se guarda
   nada, así que una etiqueta puesta ahora se perdería al cerrar. */
function afinarTagbox(){
  const caja = menu.querySelector('.tagbox'), ta = menu.querySelector('#glosaCaja');
  if (!caja || !ta) return;
  caja.classList.toggle('dormida', !ta.value.trim());
}
/* EL RÓTULO DEL OK DICE LO QUE VA A PASAR, y cambia porque lo que va a pasar
   cambia. El botón está siempre activo —terminar con la caja vacía es un
   camino que existe— pero con la caja vacía sobre una glosa que YA tenía nota,
   terminar la BORRA (ver cerrarBorrador, rama teniaNota). Quien no ve la
   pantalla oía «terminar y guardar la glosa» justo en el momento en que el
   botón la destruye. El rótulo se afina en los mismos tres casos que
   cerrarBorrador reconoce, ni uno más. Lo levantó la revisión de Codex. */
function rotularOk(){
  const ok = menu.querySelector('.mok'), ta = menu.querySelector('#glosaCaja');
  if (!ok || !ta) return;
  ok.setAttribute('aria-label',
    ta.value.trim()          ? 'Terminar y guardar la glosa' :
    (borrador && borrador.teniaNota) ? 'Terminar y borrar la glosa'
                                     : 'Terminar sin escribir glosa');
}
/* ---------- abrir y cerrar ---------- */

/* PINTAR LA MARCA RECIÉN NACIDA NO CUESTA UNA HOJA ENTERA.

   Aquí había un renderPage(), y era lo único caro de abrir el panel. Medido
   con la CPU frenada a la sexta parte —que es lo que se parece a un teléfono—:
   abrir el panel de una marca que YA existe tarda 50 ms, y el de una recién
   nacida 390. Con veinte glosas ya son 234 contra 47. Todo eso es el
   repintado, y lo que se ve entretanto es una caja que tarda en salir después
   de haber tocado: el gesto parece que no ha entrado.

   Y no hacía falta, por lo mismo que ya está escrito en save() para las glosas
   al margen y en repintarMarcas() para el color: rehacer la hoja entera es
   trabajo tirado cuando nada de lo que cambió mueve un corte de hoja. Lo único
   que esta marca tiene que enseñar es SU RESALTADO —el subrayado bajo el texto
   es la mitad de la decisión mientras escribes—, y para eso basta con
   resolverla y volver a pintar los resaltados.

   La nota todavía no existe: nace sin texto, así que no ocupa renglones ni
   siquiera con las glosas «abajo» o «al pie», que es el único caso en que una
   nota mueve el reparto. El ancla la pinta pintarAncla unas líneas más abajo,
   y el reparto se rehace en save() cuando de verdad hay algo que repartir.

   SIN LA API DE RESALTADO no hay atajo: sin ella las marcas son <span>, y
   meter uno en la hoja es rehacerla. Ahí se sigue repintando, como antes. */
function pintarMarcaNueva(m){
  if (!HL_API){ renderPage(); return; }
  /* Y SE RESUELVE UNA, NO LAS DOSCIENTAS. resolverTodas rehace el mapa entero,
     y las demás marcas siguen exactamente donde estaban: no ha cambiado ni el
     texto ni la versión. Resolver sólo la recién nacida deja el mapa al día
     con el trabajo de una. Los turnos sí se rehacen enteros —son el orden de
     lectura del capítulo, y una marca nueva puede meterse en medio— pero eso
     es contar, no buscar cadenas. */
  const r = resolver(m, version);
  if (r) RES.set(m.id, r); else RES.delete(m.id);
  recalcularTurnos();
  recalcularRefs();         /* su «12a», que pintarAncla necesita ya resuelto */
  aplicarHighlights();
}
function abrirPanel(m, nueva, rect){
  if (borrador) cerrarBorrador();          /* el anterior se cobra antes */
  /* Lo que traía al abrirse, para saber al cerrar si algo cambió de verdad.
     Sin esto, mirar una glosa y tocar fuera la hacía volar como si la
     acabaras de escribir: 2.4 segundos de animación por haberla abierto.
     Lo levantó Codex. */
  borrador = { m, nueva, teniaNota: !!(m.nota||'').trim(),
               notaAntes: (m.nota || '').trim(),
               tagsAntes: (m.etiquetas || []).join('\u0001') };
  /* La marca provisional entra en la lista para poder VERLA mientras
     decides —el subrayado bajo el texto es la mitad de la decisión— y
     sale de ella al cerrar si no llegaste a escribir nada. Lo que no se
     toca en todo el rato es save(). */
  if (nueva && !marcas.includes(m)) marcas.push(m);
  mostrarMenu(panelHTML(m), rect);
  const ta = menu.querySelector('#glosaCaja');
  if (ta){
    ta.value = m.nota || '';
    vestirVista(m);
    /* El foco se pide, no se exige: en un teléfono el teclado solo sube
       si el foco cae dentro del gesto que lo pidió, y este panel nace en
       el cuadro siguiente al toque. Si no sube, tocar la caja lo sube, y
       no se ha perdido nada. */
    ta.focus();
    /* Y el cursor AL FINAL, no en el principio. Al reabrir una glosa escrita,
       un cursor en la posición cero invita a escribir delante de lo que ya
       hay; al final es donde se sigue una nota. */
    try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch(e){ /* da igual */ }
    /* Y SE VUELVE A PEDIR EN EL SIGUIENTE TURNO. El panel nace en el pointerup,
       y después de él el navegador todavía fabrica los eventos de ratón de
       compatibilidad de ese mismo toque —mousedown, mouseup, click—; un
       mousedown sobre la hoja, que no toma foco, se lo quita a quien lo tenga.
       Aquí no lo he visto pasar (medido: la caja conserva el foco con un clic
       de verdad, con dedo y con ratón), pero es barato asegurarlo y el fallo
       que evita es de los que solo se ven en el navegador de otro.
       Con dos guardas: que el panel siga siendo este —si te fuiste y abriste
       otro, esto llega tarde— y que el foco no esté ya dentro del panel, para
       no arrebatárselo a la caja de etiquetas si fuiste directo a ella. */
    const mio = ++vidaMenu;
    setTimeout(() => {
      if (mio !== vidaMenu) return;
      if (document.activeElement && document.activeElement.closest('#menu')) return;
      const viva = menu.querySelector('#glosaCaja');
      if (viva) viva.focus();
    }, 0);
  }
  /* EL ANCHO VA ANTES QUE EL ALTO, y el orden no es cosmético: .gl-vista lleva
     max-width:100%, así que mientras el panel conserve su ancho de fábrica el
     recuadro se queda encogido dentro de él por mucho que se le pida el ancho
     de la glosa. Midiendo el alto en ese momento se mide el de un texto que
     parte donde NO va a partir, y al ensanchar después el panel el texto se
     recoloca pero el alto ya está clavado: queda un blanco al pie del recuadro
     y un panel más alto de lo que necesita, hasta que tocas una tecla.
     Se ve en el pie, que es donde la glosa es más ancha que el panel de
     fábrica. Lo levantó la tercera revisión de Codex. */
  anchoPanelComoGlosa();
  refrescarTags();
  rotularOk();
  if (nueva) pintarMarcaNueva(m);
  /* EL ANCLA SE REPINTA DESPUÉS DE renderPage, y no es redundante: la
     referencia de una marca nueva —el «12a» que le toca por su sitio en el
     capítulo— la calcula el repintado, así que antes de él REFS todavía no la
     tiene y el ancla salía como un punto suelto. Medido: «·» en vez de «1a·»,
     con la sangría del primer renglón corta en la misma proporción. */
  pintarAncla(m);
  /* Y el alto otra vez al final: el ancla sangra el primer renglón, y una
     sangría cambia dónde parte ese renglón y por tanto cuántos hay. */
  ajustarAlto(menu.querySelector('#glosaCaja'));
  colocarMenu();
  /* Al final del todo: crecer hacia un sitio exige saber dónde acabó el panel,
     y eso no se sabe hasta haberlo medido y colocado. */
  nacerPanel();
}
/* LO QUE PASA AL CERRAR, que es lo único que toca el almacén.

   Con texto se guarda, y punto. Sin texto hay tres casos y son tres
   cosas distintas:
   · una marca nueva no llegó a existir: se quita de la lista y no se
     guarda nada. Un subrayado por accidente no deja rastro.
   · una glosa que TENÍA nota y ahora no: la vaciaste, y vaciar una
     glosa es borrarla. Se va, y se avisa para poder deshacerlo.
   · una marca vieja que nunca tuvo nota se queda donde está. Su caja
     nace vacía sin que nadie la vacíe, y borrarla por eso sería borrar
     por mirar. */
/* UNA GLOSA RECIÉN ESCRITA NO SE ESCONDE.

   Los filtros de la lista de glosas —los chips de VER y el día— gobiernan las
   dos cosas por las que se sabe que una nota quedó puesta: visible() pinta el
   amarillo en la hoja y enLista() la mete en el panel. Y una glosa nueva NACE
   SIN ETIQUETAS. Así que con cualquier chip marcado pasaba esto: escribes la
   nota, cierras, y no aparece el amarillo ni sale en la lista. La nota estaba
   guardada —medido: en el almacén sí, en la hoja no, en la lista tampoco— pero
   por lo que se ve desde fuera, la aplicación se comió lo que acabas de
   escribir. Es el defecto que se reportó como «abre y no guarda».

   Y no era un despiste de un rato: etiquetasVer se guarda en los ajustes, o
   sea que un chip que tocaste hace días sigue puesto al día siguiente y sigue
   escondiendo cada glosa nueva, sin decir nada. Es la misma trampa que ya está
