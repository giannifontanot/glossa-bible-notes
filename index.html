   descrita unas líneas más abajo para los chips de libro —«un estado sin
   salida obvia: la lista vacía… con las tuyas escondidas detrás de un chip que
   no recuerdas haber puesto»— y aquí se paga más caro, porque ahí sólo
   desaparecen glosas viejas y aquí desaparece la que estás escribiendo.

   LA REGLA: gana el gesto de ahora. Escribir una glosa es lo más reciente que
   ha hecho el lector; un filtro es algo que dejó puesto antes. Cuando chocan,
   el filtro se quita —sólo el que estorba— y se dice en el aviso, para que no
   sea magia y para que se entere de que lo tenía puesto.

   Las marcas apagadas se tratan igual: escribir una glosa con las marcas en
   OFF es pedir y esconder la misma cosa en el mismo gesto.

   Se llama al guardar y sólo cuando hay nota: una marca que se va sin texto no
   tiene nada que enseñar, así que no hay filtro que estorbe. */
function destaparLaNueva(m){
  const quitados = [];
  if (!pasaDia(m)){ diaFiltro = ''; quitados.push('el filtro de día'); }
  if (!pasaEtiquetas(m)){ etiquetasVer.clear(); quitados.push('el filtro de etiquetas'); }
  if (!showMarks){
    showMarks = true;
    const b = $('marksBtn'); if (b) b.textContent = 'Marcas: ON';
    paginasSucias = true;                  /* con las marcas puestas los cortes cambian */
    quitados.push('las marcas apagadas');
  }
  if (!quitados.length) return;
  guardarAjustes();
  /* Los dos repintados del panel van con red: se puede escribir una glosa sin
     haber abierto nunca el panel de Glosas, y entonces sus trozos no existen. */
  try { pintarFiltros(); } catch(e){}
  try { pintarIndice(); } catch(e){}
  readout.textContent = 'se quitó ' + quitados.join(' y ') +
    ': escondía la glosa que acabas de escribir';
}
function cerrarBorrador(){
  const b = borrador; borrador = null;
  const ta = menu.querySelector('#glosaCaja');
  const nota = ta ? ta.value.trim() : (b.m.nota || '').trim();
  const m = b.m;
  /* SOLO VUELA LO QUE CAMBIÓ. El vuelo cuenta «aquí quedó lo que acabas de
     escribir», así que abrir una nota, leerla y salir no tiene nada que
     contar: animarla igual convierte un vistazo en un aviso de guardado, y de
     paso esconde la nota de verdad 2.4 segundos por nada.
     Se despega ANTES de repintar, que es cuando el recuadro todavía está en su
     sitio y se puede medir de dónde sale. El destino se mide después, cuando
     renderPage ya lo ha pintado. */
  const cambio = b.nueva || nota !== b.notaAntes ||
                 (m.etiquetas || []).join('\u0001') !== b.tagsAntes;
  const viajero = (nota && cambio) ? despegarVista() : null;
  if (nota){
    m.nota = nota;
    if (b.nueva){
      /* Las marcas que pisaba la nueva se quitan AHORA y no al abrir el
         panel: quitarlas antes de saber si esto se guarda dejaría un
         hueco por el que se cae lo de otro por haber dudado. */
      const r = RES.get(m.id);
      if (r) marcas = marcas.filter(x => x === m ||
        !(x.libro===m.libro && x.cap===m.cap && x.vers===m.vers && RES.has(x.id) &&
          r.ini < RES.get(x.id).fin && r.fin > RES.get(x.id).ini));
      if (!marcas.includes(m)) marcas.push(m);
    }
    save();
    /* ANTES del renderPage del final, que es quien pinta la hoja: quitando los
       filtros después, la hoja se habría pintado ya con la glosa escondida. */
    destaparLaNueva(m);
  } else if (b.nueva){
    marcas = marcas.filter(x => x !== m);
  } else if (b.teniaNota){
    marcas = marcas.filter(x => x !== m);
    save(); avisarBorrado(m);
  } else {
    save();                                /* color o trazo, sin nota: se respeta */
  }
  renderPage();
  /* Después de repintar, que es cuando el destino existe y su rectángulo es
     el de verdad y no una estimación. Si no hay a dónde volar —la glosa no
     cae en esta hoja— volarGlosa quita el calco sin más: inventarle un
     destino sería mentir. */
  if (viajero) volarGlosa(viajero, m.id);
  /* Se dice si hubo vuelo para que ocultarMenu sepa si además toca despedir el
     panel encogiéndolo. Con vuelo no: una salida por despedida. */
  return !!viajero;
}
/* Y AL GUARDAR, EL RECUADRO SE VA VOLANDO A SU SITIO.

   Sin esto la nota desaparece de un lado y aparece en el otro: dos cosas, no
   una. Viéndola viajar, lo que escribiste y lo que quedó son el mismo objeto
   —que es la verdad— y de paso el ojo aprende dónde buscarlo la próxima vez.

   El vuelo estuvo quitado un tiempo y con razón: la caja de escribir no se
   parecía a la glosa del margen, así que verla viajar era ver una cosa
   convertirse en otra a media pista. Ahora el anticipo ES la glosa —misma
   letra, mismo ancho, mismas etiquetas dentro— y el viaje vuelve a contar lo
   que siempre quiso contar.

   Lo que vuela es un CALCO, no el recuadro del panel: el panel se vacía al
   cerrarse y se llevaría por delante al viajero a mitad de camino. Y en el
   calco el textarea se cambia por su texto, porque lo que tiene que volar es
   una glosa y no un campo de escribir con el cursor dentro. */
function despegarVista(){
  const vista = menu.querySelector('#glVista'); if (!vista) return null;
  const r = vista.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const clon = vista.cloneNode(true);
  clon.removeAttribute('id');
  /* EL ECO NO VUELA. Es el calco sin tinta que sirve para subrayar las
     escrituras mientras escribes, y se sostiene sobre una regla con #menu
     delante —que es la casa: dentro del panel, las reglas van prefijadas—.
     Este clon sale del panel y se cuelga del cuerpo del documento, así que
     esa regla deja de alcanzarle: el eco perdía el `position:absolute`, se
     volvía un bloque normal, y empujaba al texto de la nota a un renglón
     nuevo por debajo del ancla. Medido: el primer renglón se plantaba en 6
     cuando el ancla acaba en 29. Aquí no pinta nada —el calco es una foto—,
     así que se va. */
  const eco = clon.querySelector('.gl-eco');
  if (eco) eco.remove();
  const ta = clon.querySelector('textarea');
  if (ta){
    const texto = document.createElement('span');
    texto.textContent = ta.value;
    /* EL CALCO SE COMPONE COMO LA GLOSA DE LA HOJA, no como el editor.

       En el editor el ancla va en absoluto y el primer renglón del textarea se
       sangra a mano: es el apaño para que un textarea —que no deja fluir texto
       alrededor de nada— parta donde parte la nota. Pero esa sangría vive en el
       textarea, y al cambiarlo por su texto se iba con él, dejando al ancla
       encima de las primeras palabras.
       Copiar la sangría al calco tampoco vale, y se ve midiendo: el ancla va en
       su posición ESTÁTICA, así que una sangría la corre a ella también —el
       ancla se iba de 29 a 49— y el calco dejaba de parecerse a su destino.
       Aquí no hace falta ningún apaño: sin textarea, el ancla y el texto son
       dos hijos en línea, que es exactamente como los compone glossHTML. Se le
       devuelve al ancla su sitio en el flujo y se quita la sangría.
       Lo levantó la tercera revisión de Codex. */
    const anclaClon = clon.querySelector('.gl-ref');
    if (anclaClon) anclaClon.style.position = 'static';
    texto.style.textIndent = '0';
    ta.replaceWith(texto);
  }
  /* Fijo y colgado del cuerpo del documento: así arrastrar el papel no se lo
     lleva, y repaginar —que rehace el margen entero— no lo borra a media
     animación. */
  clon.style.position = 'fixed';
  clon.style.left = Math.round(r.left) + 'px';
  clon.style.top = Math.round(r.top) + 'px';
  clon.style.width = Math.round(r.width) + 'px';
  clon.style.margin = '0';
  clon.style.zIndex = '12';
  clon.style.pointerEvents = 'none';
  document.body.appendChild(clon);
  return clon;
}

/* EL VUELO DE LA GLOSA RECIÉN ESCRITA.

   Se mide de dónde sale y a dónde va, y se lleva la caja de una a otra con un
   transform: la caja no se re-maqueta, se mueve. El destino ya existe cuando
   esto corre —renderPage lo acaba de pintar— así que su rectángulo es el de
   verdad y no una estimación.
   El de destino se esconde mientras dura el viaje y se destapa al llegar. Sin
   eso se verían las dos a la vez y el viaje parecería una copia. */
/* CUÁNTO DURA EL VUELO, y por qué ha ido a parar entre los dos extremos.

   Empezó en 900 ms y con eso la nota no viajaba: se escapaba. La distancia es
   casi la hoja entera y el ojo venía de leer, no de vigilar el margen, así que
   para cuando la encontraba ya había aterrizado y lo único que quedaba era la
   sensación de que algo se movió.
   Se pasó a 4500 —cinco veces— y ahí se cruzó la otra raya. Lo que se está
   enseñando es a DÓNDE se fue lo que acabas de escribir, y eso se ve entero
   mucho antes de cuatro segundos y medio; el resto del tiempo la nota ya no
   informa de nada y se queda flotando delante de lo que quieres seguir
   leyendo. Una cosa lenta y otra que se demora no son la misma.
   2400 es la medida que quedó: el triple de despacio que el arranque, tiempo
   de sobra para seguirla con la vista sin proponérselo, y termina dentro del
   rato en que todavía te importa dónde acabó.
   Sigue sin estorbar en cualquier caso: el vuelo lo lleva el compositor y no
   bloquea nada, así que mientras dura se puede leer, escribir o pasar hoja. */
const VUELO_MS = 2400;
function volarGlosa(caja, id){
  /* QUIEN PIDIÓ MENOS MOVIMIENTO NO RECIBE ÉSTE TAMPOCO. El programa apaga sus
     otras animaciones grandes por esta preferencia, pero lo hace desde el CSS,
     y una animación creada con Element.animate() no la ve ninguna regla: había
     que preguntarlo aquí. La nota aparece en su sitio y ya está, que es lo que
     esa preferencia viene a pedir. Lo levantó Codex. */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ caja.remove(); return; }
  const destino = document.querySelector('.gl[data-gl="' + id + '"]');
  const a = caja.getBoundingClientRect();
  const b = destino && destino.getBoundingClientRect();
  if (!destino || !b.width || !a.width){ caja.remove(); return; }
  destino.style.visibility = 'hidden';
  caja.style.transformOrigin = 'top left';
  caja.style.pointerEvents = 'none';

  /* DERECHA A SU SITIO, SIN PASAR POR EL CENTRO.

     El vuelo daba un rodeo por el medio de la hoja. La idea era que el ojo
     viera el viaje entero sin apartarse de donde ya miraba, y tenía sentido
     cuando el viaje duraba novecientos milisegundos: sin la curva, la nota se
     iba por la orilla y se perdía. En cuanto el vuelo se alargó el problema se
     acabó solo, y lo que quedó del rodeo fue una nota dando un paseo. Un
     trayecto que no es el camino a ningún sitio se lee como decoración, y a
     esta velocidad hay tiempo de sobra para leerlo.

     Se quedan las dos cosas que sí hacían falta:
     · el despegue —tiempo largo, distancia corta— para que arranque en vez de
       aparecer ya lanzada.
     · el aterrizaje que frena, para que se pose en vez de chocar.

     Se sigue usando la API de animaciones y no una transición: hay tres puntos
     y una transición solo sabe de dos. Y solo mueve transform y opacity, así
     que la lleva el compositor —si el hilo se traba repaginando a media
     escritura, el vuelo no se entrecorta. */
  const fin  = { x: b.left - a.left, y: b.top - a.top };
  const escala = (b.width / a.width).toFixed(3);
  /* Va encogiendo por el camino, no de golpe al final: llegar al primer palmo
     con el tamaño definitivo la haría verse como otra cosa antes de haberse
     movido, y encoger solo al aterrizar sería un respingo. */
  const enCamino = q => (1 - (1 - escala) * q).toFixed(3);
  const en = q => 'translate(' + Math.round(fin.x*q) + 'px,' +
                  Math.round(fin.y*q + (q < .5 ? -10 : 0)) + 'px)';
  /* TRES TRAMOS Y UN CRUCERO EN MEDIO, y el crucero es el que faltaba.

     Con solo despegue y aterrizaje —dos tramos— la curva del segundo tenía que
     cubrir el 93% del camino ella sola, y por muy suave que se eligiera acababa
     repartiéndolo mal: medido, 41% del recorrido en el último cuarto del
     tiempo. O sea una nota que va tomando velocidad según se acerca, que es lo
     contrario de posarse.
     Con un tramo recto y llano en medio, cada parte hace una cosa sola: el
     despegue arranca de cero y toma velocidad, el crucero la mantiene igual, y
     el aterrizaje la suelta hasta parar. La curva de fuera es lineal para no
     torcer ninguno de los tres. */
  const vuelo = caja.animate([
    /* el despegue: se levanta un pelo y casi no avanza */
    { transform:'translate(0px,0px) scale(1)', opacity:1, offset:0,
      easing:'cubic-bezier(.42,0,.72,.72)' },
    { transform: en(.08) + ' scale(' + enCamino(.10) + ')',
      opacity:1, offset:.18, easing:'linear' },
    /* el crucero: derecho y a velocidad pareja */
    { transform: en(.88) + ' scale(' + enCamino(.86) + ')',
      opacity:.78, offset:.78, easing:'cubic-bezier(.2,.6,.35,1)' },
    /* y se posa */
    { transform: en(1) + ' scale(' + escala + ')', opacity:.45, offset:1 }
  ], { duration:VUELO_MS, easing:'linear', fill:'forwards' });

  const aterrizar = () => {
    caja.remove();
    if (destino.isConnected) destino.style.visibility = '';
  };
  vuelo.addEventListener('finish', aterrizar);
  /* Red por si la animación no llega a terminar —pestaña de fondo, o un
     navegador que no la soporte—: la caja no se puede quedar volando. */
  setTimeout(() => { if (caja.isConnected) aterrizar(); }, VUELO_MS + 400);
}
function avisarBorrado(m){
  ultimoBorrado = m;
  const d = $('deshacer'); d.style.display = 'flex';
  clearTimeout(tempDeshacer);
  tempDeshacer = setTimeout(() => { d.style.display='none'; ultimoBorrado=null; }, 7000);
}
$('btnDeshacer').onclick = () => {
  if (!ultimoBorrado) return;
  marcas.push(ultimoBorrado); ultimoBorrado = null;
  $('deshacer').style.display = 'none'; save(); renderPage();
};

/* ---------- el gesto que lo abre ---------- */

/* LA SELECCIÓN SE RECUERDA, PORQUE EN EL TELÉFONO NO ESTÁ CUANDO SE PREGUNTA.

   En escritorio la selección ya existe al soltar el ratón, y el oyente de
   abajo la lee y abre el panel. En Android no: el sistema termina de armar la
   selección DESPUÉS del pointerup —es cuando salen los tiradores— así que al
   preguntar todavía no hay nada y el gesto se va sin hacer nada. El lector
   entonces hace lo natural, tocar lo que acaba de seleccionar para
   confirmarlo… y ese toque la deshace antes de que nadie la lea. Medido: tras
   el toque la selección vale "" y el panel que se abre es el de otra glosa o
   ninguno. Se seleccionaba, se abría una caja, y no se guardaba nada.

   Así que se apunta la última selección buena que hubo dentro del cuerpo, y
   cuando el toque llega con la selección ya deshecha se usa esa. Tres
   guardias para que sea la del lector y no un fantasma:
   · tiene que estar dentro de #pgBody y caber en UN versículo —lo mismo que
     ya exigía el camino normal—;
   · caduca: una selección de hace un minuto no convierte un toque de ahora en
     una glosa. VIDA_SELECCION;
   · y el toque tiene que caer ENCIMA de lo seleccionado, con holgura de un
     dedo. Tocar en otro sitio sigue queriendo decir lo de siempre: nada.
   Se gasta al usarla, así que dos toques seguidos no crean dos marcas.

   LO APUNTADO SE OLVIDA POR EL GESTO, NO POR LA SELECCIÓN. Es la parte que
   costó y conviene no volver a moverla. Lo primero que hice fue olvidarlo en
   cuanto la selección dejaba de ser la que era, con una excepción para el
   toque que la confirma. Suena bien y no aguanta un teléfono: en Android el
   toque sobre lo seleccionado se lo queda la propia capa de la selección —los
   tiradores, el menú de copiar— y el pointerdown no llega nunca a la hoja. Así
   que la excepción no se activaba, la selección se deshacía, lo apuntado se
   borraba con ella, y el lector veía lo de siempre: se abre una caja, no es la
   suya, y no se guarda nada. La prueba no lo veía porque un PointerEvent
   despachado a mano SIEMPRE llega.

   Así que ya no se mira cuándo se deshace la selección —eso pasa cuando el
   aparato quiere— sino dónde baja el dedo, que es lo único que dice la
   intención del lector:
   · un dedo que baja FUERA de lo apuntado lo cancela, y se olvida ahí mismo.
     Se escucha en el documento entero y en captura, para que cuente también el
     toque que se queda en un botón o en el escritorio;
   · un dedo que baja encima —o que no llega, porque se lo comió la selección—
     no borra nada: la marca la decide el toque cuando se suelta.
   Con el olvido atado a un gesto de verdad, la caducidad puede ser holgada:
   quien selecciona, lee, se lo piensa y luego toca sigue estando a tiempo. */
const VIDA_SELECCION = 60000;
const HOLGURA_SELECCION = 26;          /* px: el ancho de un dedo, más o menos */
let selRecordada = null;
const encimaDeLoApuntado = (ev, r) => {
  if (!r) return false;
  const c = r.caja, h = HOLGURA_SELECCION;
  return ev.clientX >= c.left - h && ev.clientX <= c.right + h &&
         ev.clientY >= c.top  - h && ev.clientY <= c.bottom + h;
};
function recordarSeleccion(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  if (!sel.toString().trim()) return;
  const rg = sel.getRangeAt(0);
  if (!pgBody.contains(rg.commonAncestorContainer)) return;
  const a = offsetGlobal(sel.anchorNode, sel.anchorOffset);
  const b = offsetGlobal(sel.focusNode, sel.focusOffset);
  if (!a || !b || a.k !== b.k || a.off === b.off) return;
  const caja = rg.getBoundingClientRect();
  if (caja.width < 1 && caja.height < 1) return;
  selRecordada = { k:a.k, ini:Math.min(a.off,b.off), fin:Math.max(a.off,b.off),
                   caja: { left:caja.left, top:caja.top, right:caja.right,
                           bottom:caja.bottom, width:caja.width, height:caja.height },
                   t: Date.now() };
}
document.addEventListener('selectionchange', recordarSeleccion);
/* EL DEDO QUE BAJA FUERA CANCELA. En el documento y en captura: un toque en un
   botón, en el margen o en el escritorio también es cancelar. */
document.addEventListener('pointerdown', ev => {
  if (selRecordada && !encimaDeLoApuntado(ev, selRecordada)) selRecordada = null;
}, true);
/* Y UNA TECLA TAMBIÉN CANCELA. Lo levantó la revisión de Codex, y es el hueco
   que deja colgar el olvido del dedo: con el teclado se deshace una selección
   sin que baje ningún dedo. Alguien selecciona con el ratón, pulsa una flecha
   —la selección se va— y al rato hace clic donde estaba: sin esta línea ese
   clic cae dentro de lo apuntado, no cancela, y al soltar sale una glosa
   sobre unas palabras que ya no estaban seleccionadas.
   No toca el camino del teléfono, que es justo el que no tiene teclas de por
   medio: entre seleccionar y confirmar no se pulsa nada. Y extender con
   mayúsculas y flechas tampoco se pierde: la selección nueva se vuelve a
   apuntar en el selectionchange que viene detrás. */
document.addEventListener('keydown', () => { selRecordada = null; }, true);
/* Cambiar de hoja, repaginar o abrir un panel invalidan lo apuntado: las
   posiciones son de la hoja que estaba puesta. */
function olvidarSeleccion(){ selRecordada = null; }
function seleccionParaEsteToque(ev){
  const r = selRecordada;
  if (!r) return null;
  if (Date.now() - r.t > VIDA_SELECCION){ selRecordada = null; return null; }
  if (!encimaDeLoApuntado(ev, r)) return null;
  selRecordada = null;                 /* se gasta: un toque, una marca */
  return r;
}

pgBody.addEventListener('pointerup', ev => {
  if (ev.target.tagName === 'TEXTAREA') return;
  if (ev.target.closest('.gl')) return;   // las glosas de "abajo" viven aquí dentro
  setTimeout(() => {
    const sel = window.getSelection();
    const arrastre = sel && !sel.isCollapsed && sel.toString().trim().length > 0;
    /* La selección ya deshecha, pero el toque cayó sobre la que había: es la
       misma intención, así que se atiende igual. Ver selRecordada. */
    if (!arrastre){
      const r = seleccionParaEsteToque(ev);
      if (r){
        const it = plano[r.k];
        if (it){
          abrirPanel(crearMarca(it.cap, it.vers, r.ini, r.fin), true, r.caja);
          return;
        }
      }
    }
    if (arrastre){
      const a = offsetGlobal(sel.anchorNode, sel.anchorOffset);
      const b = offsetGlobal(sel.focusNode, sel.focusOffset);
      if (a && b && a.k === b.k && a.off !== b.off){
        const it = plano[a.k];
        const ini = Math.min(a.off,b.off), fin = Math.max(a.off,b.off);
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        olvidarSeleccion();
        /* La selección del navegador se suelta aquí: a partir de ahora
           lo que enseña dónde estás es el ancla de la marca, y dos
           subrayados a la vez sobre las mismas palabras se leen como un
           error. En el teléfono además se lleva los tiradores, que
           taparían medio panel. */
        sel.removeAllRanges();
        abrirPanel(crearMarca(it.cap, it.vers, ini, fin), true, rect);
      } else if (a && b && a.k !== b.k){
        readout.textContent = 'por ahora una marca no puede cruzar de versículo';
        ocultarMenu();
      }
      return;
    }
    const p = puntoA(ev.clientX, ev.clientY);
    const m = p && marcaEn(p.k, p.off);
    if (!m){ ocultarMenu(); return; }
    const rg = rangoDe(m, pgBody);
    abrirPanel(m, false, rg ? rg.getBoundingClientRect()
      : { left:ev.clientX, top:ev.clientY, width:0, height:0, bottom:ev.clientY });
  }, 0);
});

/* ---------- los mandos ---------- */

/* Repintar lo justo. Cambiar de color o de trazo no cambia dónde está
   nada, así que rehacer la hoja entera es trabajo tirado —y trabajo
   tirado con el teclado abierto es la manera más corta de que la
   pantalla dé un salto a media frase. Donde hay API de resaltado basta
   con volver a pintar los resaltados. */
function repintarMarcas(){
  if (HL_API) aplicarHighlights(); else renderPage();
}
menu.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  ev.preventDefault();

  if (b.dataset.ir){
    const [c, v, l] = b.dataset.ir.split(':');
    /* De dónde: el versículo cuyo contador abrió esta lista. Si el botón no lo
       trae —por venir de otro sitio—, la hoja en la que estás. */
    const d = (b.dataset.desde || '').split(':');
    const origen = d.length === 2 && +d[0] > 0 && +d[1] > 0
      ? { libro: LIBRO, cap: +d[0], vers: +d[1] } : dondeEstoy();
    irA(LIBRO, +c, +v, l || '', { origen }); return;
  }
  if (!borrador) return;                   /* el menú de vínculos no tiene más */
  const m = borrador.m;

  if (b.dataset.color){
    m.color = b.dataset.color; reanclar(m);
    menu.querySelectorAll('.mc').forEach(x =>
      x.toggleAttribute('data-on', x.dataset.color === m.color));
    vestirVista(m); refrescarTags();
    repintarMarcas(); return;
  }
  if (b.dataset.modo){
    m.estilo = b.dataset.modo; reanclar(m);
    menu.querySelectorAll('.mmodos button').forEach(x =>
      x.classList.toggle('on', x.dataset.modo === m.estilo));
    repintarMarcas(); return;
  }
  /* prender/apagar una etiqueta: el panel se queda abierto, porque casi
     siempre pones dos o tres de un tirón */
  if (b.dataset.tag){
    if (b.closest('.tagbox').classList.contains('dormida')) return;
    const t = b.dataset.tag, cur = m.etiquetas || [];
    const puesta = cur.includes(t);
    m.etiquetas = puesta ? cur.filter(x => x !== t) : cur.concat(t);
    if (!puesta) ultimaEtiqueta = t;
    refrescarTags(); return;
  }
  const acc = b.dataset.acc;
  /* El + de la caja. Va antes que 'listo' porque los dos viven en el
     mismo panel y el orden aquí es el que decide. */
  if (acc === 'creartag'){ crearTagDeMarca(menu.querySelector('#tagNueva')); return; }
  /* ABRIR Y CERRAR LA LISTA. Va cerrada de nacimiento: lo que la nota lleva
     puesto ya se lee dentro de la glosa de arriba, así que la lista solo hace
     falta cuando quieres CAMBIAR algo, y eso no es en cada nota. */
  if (acc === 'vertags'){
    const caja = menu.querySelector('.tagbox');
    if (caja) plegarTags(caja, !tagsAbiertas(caja));
    return;
  }
  /* Y EL OK VUELVE, que aquí hubo un «Listo» y se quitó. Se quitó con este
     argumento: es un blanco más al que apuntar para decir algo que el gesto
     natural —dejar de tocar el panel— ya dice, y encima repite lo que hace
     tocar fuera. El argumento sigue siendo cierto y aun así estaba mal, porque
     medía la cosa equivocada: no sobra por repetir, hace falta por DECIR. Sin
     él, quien abre la caja por primera vez no tiene delante nada que le
     confirme que lo escrito se guarda, y la duda pesa más que el toque de
     más. Un botón que repite un gesto que ya existe no es ruido si el gesto
     que repite no se ve.

     Hace exactamente lo mismo que tocar fuera, y por el mismo camino: llama a
     ocultarMenu, que cobra lo escrito, lo hace volar a su sitio y guarda. Ni
     una rama aparte, para que no puedan separarse nunca. Y sin texto NO se
     apaga: cerrar sin nota es lo que borra la glosa, así que ahí es cuando
     más falta hace tener una salida a la vista. */
  if (b.dataset.acc === 'ok'){
    ev.stopPropagation();
    ocultarMenu();
    return;
  }
});

/* TRAGARSE EL CLIC DE ESTE MISMO TOQUE.

   Un toque suelta tres eventos —pointerdown, pointerup y luego click— y son
   tres, no uno: cortar el pointerdown no impide que el click llegue a su
   botón. Sin esto, «el toque de fuera es de la ventanita» se quedaba a medias:
   la ventanita se cerraba, sí, pero el mismo dedo abría además el historial o
   el canto de los libros, y quedaban dos paneles puestos a la vez. Lo levantó
   Codex, y está medido: tocando #btnHistorial con la ventanita encima del
   panel salían panel Y historial; tocando #pgCabeza, panel Y canto.

   Se come UN clic y se quita solo. Y se quita además por dos caminos, porque
   un oyente de captura que se queda puesto se come el clic de otro:
   · al empezar OTRO toque, que ese ya es de quien lo dé;
   · y por tiempo, para el toque que nunca llega a clic —arrastrar para
     seleccionar, o desplazar la hoja—. */
function tragarElClic(){
  let t;
  const soltar = () => {
    document.removeEventListener('click', tragar, true);
    document.removeEventListener('pointerdown', soltar, true);
    clearTimeout(t);
  };
  const tragar = ev => { ev.stopPropagation(); ev.preventDefault(); soltar(); };
  document.addEventListener('click', tragar, true);
  document.addEventListener('pointerdown', soltar, true);
  t = setTimeout(soltar, 700);
}
document.addEventListener('pointerdown', ev => {
  /* CON LA VENTANITA PUESTA, EL TOQUE DE FUERA ES SUYO Y DE NADIE MÁS.

     Desde la caja de escribir se puede tocar una referencia y leer el
     versículo sin salir del panel; la ventanita sale por encima. Un toque
     fuera cerraba las dos cosas de una vez, y eso es perder el panel por
     haber querido quitar lo que tapaba el panel —lo escrito no se pierde,
     que cerrar guarda, pero hay que volver a abrirlo para seguir—.

     Así que el toque se lo queda la ventanita ENTERO: cierra lo de arriba y
     no llega a nadie más, ni al panel de debajo ni al botón que se haya
     tocado. El siguiente toque ya es normal.

     El historial va aparte y sigue como estaba: si está abierto, la ventanita
     salió de él y el toque de fuera se los lleva a los dos.

     Va aquí, en el oyente del panel, y no junto al resto del código de la
     ventanita: los dos son de captura sobre el documento, o sea que manda el
     que se registró antes, y ese es este. */
  if (plenoAbierto && !histAbierto && !ev.target.closest('#versoPleno')){
    cerrarPleno();
    tragarElClic();
    ev.stopPropagation();
    return;
  }
  /* Y LA VENTANITA CUENTA COMO DENTRO, igual que el panel.

     Este oyente cierra el panel de la glosa con cualquier toque que no caiga
     dentro de él, y hasta que la ventanita tuvo botones propios eso salía
     bien: lo único que había dentro era el versículo, y tocarlo es saltar a
     otro sitio, o sea que cerrar el panel era lo correcto —el propio oyente
     del salto llama a ocultarMenu—.

     Con la X ya no: tocarla es quitar de en medio lo que TAPA el panel, y el
     panel se iba con ella. Se leía como que la X cerraba las dos cosas, que es
     justo lo que la ventanita no debe hacer —se lee un versículo sin salir de
     lo que estabas escribiendo—. La ventanita se pone aquí al lado del panel:
     lo que pase dentro de ella es asunto suyo. El salto sigue cerrando el
     panel porque lo pide él mismo, no porque lo cierre este toque. */
  if (ev.target.closest('#menu, #versoPleno')) return;
  /* LO ESCRITO SE COBRA ANTES DE CERRAR, y el orden es todo el arreglo.

     Este oyente va en fase de CAPTURA, así que corre antes que nada; y
     ocultarMenu deja el borrador en null. El change de la caja llega
     después —el blur es posterior al pointerdown—, o sea que para cuando
     quería poner la etiqueta ya no había a quién ponérsela, y se perdía
     sin decir nada. Tocar fuera con algo escrito no es abandonar, es
     terminar. Se cobra aquí, mientras la marca todavía existe.
     Lo levantó la revisión de Codex. */
  const caja = document.getElementById('tagNueva');
  if (caja && caja.value.trim() && borrador) crearTagDeMarca(caja);
  ocultarMenu();
}, true);

/* ---------- la caja de escribir ---------- */

/* El texto vive en el textarea hasta que se cierra el panel; lo único
   que hace falta mientras tanto es despertar o dormir las etiquetas
   según haya algo escrito. La nota NO se copia a la marca en cada
   tecla: si se copiara, el panel dejaría de ser un borrador y vaciar la
   caja sería borrar antes de que hayas terminado de pensarlo. */
menu.addEventListener('input', ev => {
  if (ev.target.id !== 'glosaCaja') return;
  afinarTagbox();
  rotularOk();
  /* El ancla aparece en cuanto hay texto —antes esa nota no era una nota— y
     con ella cambia la sangría del primer renglón. */
  if (borrador) pintarAncla(borrador.m);
  ajustarAlto(ev.target);
  colocarMenu();
});
/* EN EL TELÉFONO, EL TECLADO CIERRA LA LISTA. Con la lista cerrada de
   nacimiento el apuro de sitio casi desaparece, pero si la tienes abierta y
   te pones a escribir, el teclado se come la mitad de abajo y el panel deja
   de caber. Cerrarla es ahora la respuesta obvia —antes había que inventar un
   estado «plegada» aparte, porque la lista no tenía manera de estar cerrada—.

   LO DICE EL TECLADO, NO EL FOCO. El panel nace con el foco pedido, así que
   reaccionar al foco cerraría la lista antes de que hubiera nada que
   estorbara, y en un teléfono donde el teclado no llega a subir la cerraría
   para siempre. La medida es la de la caja de escribir de antes: si la
   ventana visual encoge más de 80px, eso es un teclado y no la barra de
   direcciones. */
function vigilarTeclado(){
  const vv = window.visualViewport;
  if (!vv || menu._teclado) return;
  const mirar = () => {
    const caja = menu.querySelector('.tagbox'); if (!caja) return;
    /* Se pregunta por el destino y no por la clase: este oyente salta en cada
       cambio del alto de la ventana, y a media animación de cierre la clase
       todavía dice «abierta» —volvería a plegar lo que ya se está plegando, y
       cada salto reiniciaría el doblez desde el principio. */
    if (vv.height < window.innerHeight - 80 && tagsAbiertas(caja))
      plegarTags(caja, false);
  };
  vv.addEventListener('resize', mirar);
  menu._teclado = () => { vv.removeEventListener('resize', mirar); menu._teclado = null; };
  mirar();
}
menu.addEventListener('focusin', ev => {
  if (ev.target.id !== 'glosaCaja' || !enTelefono()) return;
  vigilarTeclado();
});
menu.addEventListener('focusout', ev => {
  if (ev.target.id !== 'glosaCaja') return;
  if (menu._teclado) menu._teclado();
});
/* etiqueta nueva desde el propio panel */
/* Enter no llega en el teléfono, así que se escucha por los cuatro
   caminos por los que puede llegar el mismo gesto. Se vacía la caja
   ANTES de tocar nada más, porque su salida dispararía otra vez esto
   con el mismo texto. */
function crearTagDeMarca(caja){
  if (!caja || !borrador) return;
  /* Dormida se comprueba ANTES de vaciar la caja: vaciarla y luego rendirse
     se llevaría lo escrito sin poner nada, que es el modo de fallar más
     antipático que tiene una caja de texto. */
  if (menu.querySelector('.tagbox').classList.contains('dormida')) return;
  const t = caja.value.trim(); if (!t) return;
  caja.value = '';
  const actuales = borrador.m.etiquetas || [];
  if (!actuales.includes(t)) borrador.m.etiquetas = actuales.concat(t);
  ultimaEtiqueta = t;
  /* Una etiqueta que no estaba en la lista necesita su botón; el resto
     se arregla retocando los que ya hay. Nunca se repinta el panel: el
     textarea está justo encima y se lo llevaría por delante.

     SE BUSCA COMPARANDO dataset.tag, NO METIENDO EL NOMBRE EN UN SELECTOR.
     Aquí había un selector armado a mano escapando solo las comillas, y una
     etiqueta la escribe una mano: puede llevar lo que sea. Medido en el
     navegador, con la barra invertida fallaba de las dos maneras posibles:
     «a\"b» —barra y comilla— tiraba un SyntaxError que abortaba esto DESPUÉS
     de haber vaciado la caja y apuntado la etiqueta, así que el chip no salía
     y quedaba una excepción sin recoger; y «promesas\» no tiraba nada pero
     tampoco encontraba el botón que sí existía, o sea que metía un segundo
     chip repetido, en silencio, que es la mitad peor.
     CSS.escape lo arreglaría, pero comparar el valor es más corto y no hay
     nada que escapar: el nombre nunca se convierte en sintaxis.
     Lo levantó la revisión de Codex. */
  const box = menu.querySelector('.tagbox');
  const yaEsta = [...box.querySelectorAll('.tg')].some(b => b.dataset.tag === t);
  if (!yaEsta){
    const vacio = box.querySelector('.vacio'); if (vacio) vacio.remove();
    const btn = document.createElement('button');
    /* La almohadilla va en el texto, como en las demás de la lista: es lo que
       hace que una palabra suelta se lea como etiqueta sin llevar recuadro. */
    btn.className = 'tg'; btn.dataset.tag = t; btn.textContent = '#' + t;
    /* Al final de la lista. Antes iba «antes del input», y el input no vive
       ahí: insertBefore con un nodo que no es hijo tira NotFoundError, y lo
       tiraría DESPUÉS de haber vaciado la caja, o sea perdiendo lo escrito. */
    box.querySelector('.taglista').appendChild(btn);
  }
  refrescarTags();
  colocarMenu();
}
/* UNA ESCRITURA DENTRO DE LA CAJA DE ESCRIBIR TAMBIÉN SE ABRE.

   En la hoja las referencias son <span class="ref"> y se tocan; aquí dentro no
   hay spans que tocar, porque lo que hay es un textarea y un textarea no deja
   marcar nada por dentro. Pero no hace falta marcarlo: al hacer clic, el
   navegador ya ha puesto el cursor donde tocaste, así que basta con preguntar
   en qué carácter cayó y mirar si ese carácter está dentro de una referencia.
   Las referencias las saca refsDe del mismo texto, que es exactamente lo que
   hace enlazar() para pintarlas en la hoja: un solo entendimiento de qué es
   una referencia, en los dos sitios.

   Con dos límites, y los dos son para no quitarle a la caja su oficio:
   · solo si no hay nada seleccionado. Arrastrar por encima de una referencia
     sigue siendo seleccionar texto para editarlo.
   · solo POR DENTRO, no en los filos. Tocando justo antes o justo después el
     cursor se queda donde lo pusiste, que es como se corrige lo de al lado.
   · y solo si la referencia existe de verdad en los datos, igual que en la
     hoja —donde una referencia muerta no salta—. Así una referencia a medio
     escribir se sigue pudiendo arreglar tocándola por el medio, que es
     justo cuando más falta hace. */
menu.addEventListener('click', ev => {
  const ta = ev.target.closest('#glosaCaja');
  if (!ta || !borrador) return;
  if (ta.selectionStart !== ta.selectionEnd) return;
  const donde = ta.selectionStart;
  const r = refsDe(ta.value).find(x => donde > x.inicio && donde < x.fin && refExiste(x));
  if (!r) return;
  ev.preventDefault(); ev.stopPropagation();
  const m = borrador.m;
  abrirPleno(r.libro, r.cap, r.vers, r.letra || '',
             { libro: m.libro, cap: m.cap, vers: m.vers });
});
/* Con nota larga el textarea se desplaza por dentro, y el calco tiene que
   desplazarse con él o la raya se queda en el renglón que ya no está. El

menu.addEventListener('scroll', ev => {

menu.addEventListener('keydown', ev => {

/* ============================================================
   NAVEGACIÓN POR VÍNCULOS. Saltar apila la hoja de origen, así que
   "volver por donde viniste" es el borde izquierdo de siempre: uno
   solo e inequívoco, porque es tu recorrido y no una lista derivada.
   ============================================================ */
/* Dónde estoy parado, en términos que sobreviven a un cambio de libro. */
function puntoActual(){
  const p = plano[Math.min(Math.max(paginas[paginaActual]||0,0), plano.length-1)];
  return { libro: LIBRO, hoja: paginaActual, ref: p ? {cap:p.cap, vers:p.vers} : {cap:1, vers:1} };
}
/* `opciones` lleva las dos cosas que un salto puede necesitar y no caben en
   una referencia:
   · origen — el pasaje DEL QUE se sale, para dejarlo apuntado en el rastro
     justo debajo del destino. Lo manda quien salta desde una glosa: sin él, el
     historial contaba a dónde fuiste y se callaba de dónde, que es la mitad
     que hace falta para volver.
   · sinApuntar — el salto no es un sitio nuevo del camino sino un paso atrás
     por el camino que ya hay. Apuntarlo convertiría el botón de atrás en un
     columpio: apuntar el sitio de atrás lo pondría el primero, y el siguiente
     «atrás» volvería al de delante. */
function irA(libro, cap, vers, letra, opciones){
  const op = opciones || {};
  /* Cruzar a otro libro. Esto estaba prohibido de cuando los datos eran solo
     Marcos: cualquier referencia a otro libro se rechazaba con "ese libro
     todavía no está en estos datos", aunque estuviera. Ahora solo se rechaza
     si de verdad no está, y si está, se salta como desde el menú de libros. */
  if (libro !== LIBRO){
    if (!D.versiones[version].texto[libro]){
      readout.textContent = 'ese libro no está en los datos cargados';
      return;
    }
    if (!versoTexto(version, cap, vers, libro)){
      readout.textContent = 'referencia fuera de rango: ' + nombreDe(libro) + ' ' + cap + ':' + vers;
      return;
    }
    ocultarMenu();
    /* Al rastro NO se apunta aquí, y esto costó una medida: saltarA ya apunta
       el destino, pero al ATERRIZAR —a propósito, porque un salto entre libros
       puede quedarse a medias y el rastro solo debe contar lo que llegaste a
       ver—. Apuntándolo también aquí, cada salto entre libros dejaba la misma
       escritura dos veces seguidas; y el paso atrás, que pide no apuntar nada,
       se apuntaba igual porque quien apuntaba de verdad era saltarA y no se
       había enterado. Así que lo que viaja es el encargo, y lo cumple el que
       aterriza. */
    saltarA(libro, cap, vers, puntoActual(), op);
    return;
  }
  const k = plano.findIndex(p => p.cap === cap && p.vers === vers);
  if (k < 0){ readout.textContent = 'referencia fuera de rango: ' + cap + ':' + vers; return; }
  ocultarMenu();
  /* Al rastro. Va DESPUÉS de las dos comprobaciones de arriba a propósito: una
     referencia que no lleva a ningún sitio no es un pasaje que hayas visto, y
     apuntarla dejaría el historial lleno de callejones. También se apunta
     cuando el versículo ya está en esta hoja: preguntaste por él igual. */
  if (!op.sinApuntar){
    /* Sin origen explícito (menú de cintas, índice…) se apunta de dónde
       estabas AHORA: si no, el «atrás» del rastro solo veía destinos y
       saltaba a un sitio viejo de la lista, no a lo que acababa de pasar. */
    const deAqui = puntoActual();
    const origen = op.origen || { libro: deAqui.libro, cap: deAqui.ref.cap, vers: deAqui.ref.vers };
    apuntarDeDonde(origen);
    apuntarVisto(libro, cap, vers);
  }
  const destino = paginaDe(k);
  if (destino === paginaActual){
    destacar(cap, vers, letra);
    /* Mismo destino: no hay pliegue, pero la cinta puede estar oculta
       (sep-espera de un salto anterior). Hay que enseñarla. */
    if (typeof pintarSeparador === 'function') pintarSeparador();
    if (typeof sepTrasPliegue === 'function') sepTrasPliegue();
    return;
  }
  volverA = puntoActual();                  // de dónde veníamos, para el botón de regreso
  sepSalto = true;                          /* ver sepSalto: esto es saltar */
  animarSalto(destino, () => destacar(cap, vers, letra));
}
/* Al llegar, parpadea lo que buscabas: la glosa concreta si la referencia
   traía letra, si no el versículo entero. */
function destacar(cap, vers, letra){
  if (!HL_API) return;
  let rangos = [];
  if (letra){
    const objetivo = marcas.find(m => m.cap===cap && m.vers===vers && visible(m) &&
                                      RES.has(m.id) && (REFS.get(m.id)||'') === vers + letra);
    if (objetivo){ const r = rangoDe(objetivo, pgBody); if (r) rangos = [r]; }
  }
  if (!rangos.length){
    const k = plano.findIndex(p => p.cap===cap && p.vers===vers);
    const el = pgBody.querySelector('.v[data-k="' + k + '"]');
    if (el){ const r = document.createRange(); r.selectNodeContents(el); rangos = [r]; }
  }
  resaltarSuave(rangos);
}
/* Quién cita este versículo. Nunca "el" regreso: todos, y tú eliges. */
function menuVinculos(cap, vers){
  /* El de dónde viaja en el botón: esta lista se abre desde el contador de UN
     versículo, así que el salto sale de ahí y no del principio de la hoja. */
  return '<div class="tagbox"><span class="vacio">citado desde</span>' +
    backDe(cap, vers).map(m => '<button data-desde="' + cap + ':' + vers +
      '" data-ir="' + m.cap + ':' + m.vers + ':' +
      (REFS.get(m.id)||'').replace(/^\d+/,'') + '">' +
      m.cap + ':' + (REFS.get(m.id) || m.vers) + ' · ' +
      esc(m.nota.slice(0,24)) + (m.nota.length > 24 ? '…' : '') + '</button>').join('') +
    '</div>';
}
/* DE QUÉ PASAJE CUELGA ESTA REFERENCIA. Es el «de dónde» que se apunta en el
   rastro al saltar, y tiene que ser el versículo al que la glosa está atada
   —no la primera escritura de la hoja, que es lo que sabe puntoActual—: si
   estás en una hoja con doce versículos y saltas desde la glosa del octavo,
   volver al primero no es volver. */
/* DÓNDE ESTOY, en la forma que pide el rastro. puntoActual() da la hoja y su
   referencia para el botón de regreso, que es otra cosa y otra forma; aquí
   hace falta el {libro, cap, vers} suelto que apunta el rastro.
   Es el primer versículo de la hoja: saltando desde una lista —el índice de
   glosas, o la de «citado desde»— no hay un versículo señalado del que salga
   el salto, y la hoja entera es lo que estabas mirando. */
function dondeEstoy(){
  const p = plano[Math.min(Math.max(paginas[paginaActual] || 0, 0), plano.length - 1)];
  return p ? { libro: LIBRO, cap: p.cap, vers: p.vers } : null;
}
function deQueGlosa(el){
  const caja = el && el.closest('.gl[data-gl]');
  const m = caja && marcas.find(x => x.id === caja.dataset.gl);
  return m ? { libro: m.libro, cap: m.cap, vers: m.vers } : null;
}
/* Un clic en una referencia abre la ventanita; uno en el contador, la lista. */
[pgMargin, pgFoot, pgBody].forEach(el => el.addEventListener('click', ev => {
  const r = ev.target.closest('.ref');
  if (r && !r.classList.contains('muerta')){
    ev.preventDefault(); ev.stopPropagation();
    const [lib, c, v, letra] = r.dataset.ref.split(':');
    /* PRIMERO SE LEE, LUEGO SE SALTA. Antes, tocar una referencia dentro de
       una glosa te llevaba allí de cabeza: un salto entero —repaginar, voltear
       el bonche, aterrizar— para averiguar qué decía el versículo, y otro
       tanto para volver si no era lo que buscabas. La mayoría de las veces la
       pregunta no es «llévame» sino «qué dice». Ahora sale la misma ventanita
       del historial, con el texto; y si además quieres ir, tocas el texto.
       Un solo camino para la misma pregunta, esté la referencia en el rastro o
       dentro de una glosa. */
    abrirPleno(lib, +c, +v, letra || '', deQueGlosa(r));
    return;
  }
  if (r){ readout.textContent = 'esa referencia no está en los datos cargados'; return; }
  const b = ev.target.closest('.back');
  if (b){
    ev.preventDefault(); ev.stopPropagation();
    const [c, v] = b.dataset.back.split(':').map(Number);
    /* Se cierra lo que hubiera antes de poner otra cosa dentro. No es una
       formalidad: si había un panel abierto, mostrarMenu le arranca del DOM
       la caja de escribir, y entonces lo escrito no tendría de dónde
       cobrarse. ocultarMenu lo cobra primero y luego vacía. */
    ocultarMenu();
    mostrarMenu(menuVinculos(c, v), b.getBoundingClientRect());
  }
}, true));

/* Un clic sobre la glosa hace parpadear su marca en el texto; dos clics
   la abren para editar. El parpadeo espera un momento por si viene el
   segundo clic, para no encender y apagar antes de abrir el editor. */
const glosaDe = ev => {
  const d = ev.target.closest('.gl');
  return d ? marcas.find(x => x.id === d.dataset.gl) : null;
};
let esperaTap = null;
function clicGlosa(ev){
  const m = glosaDe(ev); if (!m) return;
  ev.preventDefault();
  clearTimeout(esperaTap);
  esperaTap = setTimeout(() => flash(m), 210);
}
function dobleGlosa(ev){
  const m = glosaDe(ev); if (!m) return;
  ev.preventDefault();
  clearTimeout(esperaTap);
  apagarDestello();
  /* Se abre el MISMO panel que sale al tocar la marca en el texto, y
     anclado donde está la marca y no donde está la nota: lo que vas a
     editar es el pasaje, y el panel tiene que salir junto a él o se
     pierde de vista qué se está glosando. Si el ancla no cae en esta
     hoja se cuelga de la propia glosa, que es el único sitio seguro. */
  const rg = rangoDe(m, pgBody);
  const d = ev.target.closest('.gl');
  abrirPanel(m, false, rg ? rg.getBoundingClientRect() : d.getBoundingClientRect());
}
[pgMargin, pgFoot, pgBody].forEach(el => {
  el.addEventListener('click', clicGlosa);

});

/* El recuadro de edición se viste como la glosa que está reemplazando. Se
   deriva de las mismas tablas en vez de repetir los valores: así estaba antes
   y se había quedado con las alfas viejas sin que nadie lo notara. */
const TEXTO_HEX = {yellow:'#6d5410', green:'#235c31', blue:'#0f4b6b', orange:'#6e3406'};
const TINT = Object.fromEntries(COLORS.map(c =>
  [c, [LINE_HEX[c], 'rgba(' + FILL_RGB[c] + ',' + (FILL_ALFA[c]*.42).toFixed(2) + ')', TEXTO_HEX[c]]]));

/* ---------- etiquetas ---------- */
/* Las etiquetas viven en la marca, no en la glosa: así puedes filtrar
   también resaltados que todavía no tienen nada escrito. */
function todasEtiquetas(){
  const s = new Map();
  let sin = 0;
  for (const m of marcas){
    const t = m.etiquetas || [];
    if (!t.length) sin++;
    for (const x of t) s.set(x, (s.get(x)||0)+1);
  }
  return { mapa: s, sin };
}
/* El menú de libros del chip: solo los que de verdad tienen glosas, porque
   ofrecer los 66 obligaría a buscar entre libros vacíos. Y solo los que aún
   no están en el filtro. */
function menuDeLibros(rect){
  const conGlosas = new Map();
  for (const m of marcas)
    if (m.nota && m.libro !== LIBRO && !librosFiltro.has(m.libro))
      conGlosas.set(m.libro, (conGlosas.get(m.libro) || 0) + 1);
  if (!conGlosas.size){
    readout.textContent = 'no hay glosas en otros libros';
    return;
  }
  const orden = [...conGlosas.keys()].sort((a,b) =>
    CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b));
  mostrarMenu(orden.map(id =>
    '<button class="mi" data-libfil="' + id + '">' + esc(nombreDe(id)) +
    '<span class="n">' + conGlosas.get(id) + '</span></button>').join(''), rect);
}

function pintarFiltros(){
  const cont = $('filtros');
  cont.querySelectorAll('.chip').forEach(c => c.remove());
  const { mapa, sin } = todasEtiquetas();
  const add = (nombre, n) => {
    const b = document.createElement('span');
    b.className = 'chip' + (etiquetasVer.has(nombre) ? ' sel' : '');
    b.innerHTML = esc(nombre) + '<span class="n">' + n + '</span>';
    b.onclick = () => {
      etiquetasVer.has(nombre) ? etiquetasVer.delete(nombre) : etiquetasVer.add(nombre);
      guardarAjustes();
      renderPage();
    };
    cont.appendChild(b);
  };
  [...mapa.entries()].sort().forEach(([k,v]) => add(k,v));
  if (sin) add('(sin etiqueta)', sin);

  /* LOS CHIPS DE LIBRO. El abierto va siempre, con borde, para que se vea
     que la lista ya lo incluye. Los demás se AGREGAN con + libro. */
  {
    const n = marcas.filter(m => m.nota && m.libro === LIBRO).length;
    const b = document.createElement('span');
    b.className = 'chip chip-libro sel';
    b.innerHTML = esc(nombreDe(LIBRO)) + '<span class="n">' + n + '</span>';
    b.title = 'Libro abierto: sus glosas ya están en la lista';
    cont.appendChild(b);
  }
  for (const id of [...librosFiltro].filter(id => id !== LIBRO)
    .sort((a,b) => CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b))){
    const n = marcas.filter(m => m.nota && m.libro === id).length;
    const b = document.createElement('span');
    b.className = 'chip chip-libro';
    b.innerHTML = esc(nombreDe(id)) + '<span class="n">' + n + '</span><span class="x">×</span>';
    b.title = 'Quitar ' + nombreDe(id) + ' de la lista';
    b.onclick = () => { librosFiltro.delete(id); pintarFiltros(); pintarIndice(); };
    cont.appendChild(b);
  }
  const mas = document.createElement('span');
  mas.className = 'chip chip-mas';
  mas.textContent = '+ libro';
  mas.title = 'Sumar a la lista las glosas de otro libro';
  mas.onclick = ev => { ev.stopPropagation(); menuDeLibros(mas.getBoundingClientRect()); };
  cont.appendChild(mas);
  pintarDias();
}
/* ============================================================
   POR DÍA. La fecha se queda como campo, no como etiqueta: si cada
   día fuera un chip, a los seis meses habría ciento ochenta chips
   revueltos con "estudio". Aquí tiene su propio control, y filtra y
   nada más: el botón de etiquetar en tanda todo un día se fue con la
   etiqueta activa, porque era la misma idea —poner algo a un montón de
   notas de una vez, sin mirarlas— y esa idea es la que se quitó.
   ============================================================ */
function pintarDias(){
  const cuenta = new Map();
  for (const m of marcas) cuenta.set(diaDe(m), (cuenta.get(diaDe(m))||0) + 1);
  if (diaFiltro && !cuenta.has(diaFiltro)) diaFiltro = '';
  const sel = $('selDia');
  sel.innerHTML = '<option value="">todos los días</option>' +
    [...cuenta.keys()].sort().reverse()
      .map(d => '<option value="'+esc(d)+'">'+esc(d)+' ('+cuenta.get(d)+')</option>').join('');
  sel.value = diaFiltro;
}
$('selDia').onchange = e => { diaFiltro = e.target.value; renderPage(); };
/* Enseña u oculta la tira de chips para dejar el índice de glosas a la vista. */
$('btnVerEtiquetas').onclick = () => {

let eligiendoGlosas = false;
const glosasElegidas = new Set();
function marcasElegidas(){
  return marcas.filter(m => glosasElegidas.has(m.id));
}
function pintarBarraGrupo(){
  const n = glosasElegidas.size;
  const cuenta = $('cuentaGrupo');
  if (cuenta) cuenta.textContent = n === 1 ? '1 elegida' : n + ' elegidas';

                    k > 0 ? ' mix' : '';

        'autocapitalize="none" autocomplete="off" />' +
      '<button type="button" class="btn crear" data-acc="creartag-grupo">+ crear</button>' +
    '</div>';
}
function ponerTagGrupo(t){
  t = (t || '').trim(); if (!t || !glosasElegidas.size) return;
  for (const m of marcasElegidas()){
    const cur = m.etiquetas || [];
    if (!cur.includes(t)) m.etiquetas = cur.concat(t);
  }
  ultimaEtiqueta = t;
  save();
  pintarFiltros(); pintarIndice(); pintarBarraGrupo();
  if (typeof renderPage === 'function') renderPage();
}
function quitarTagGrupo(t){
  if (!t || !glosasElegidas.size) return;
  for (const m of marcasElegidas()){
    m.etiquetas = (m.etiquetas || []).filter(x => x !== t);
  }
  save();

  if (typeof renderPage === 'function') renderPage();
}
$('btnElegirGlosas').onclick = () => {

$('tagboxGrupo').addEventListener('click', ev => {
  const crear = ev.target.closest('[data-acc="creartag-grupo"]');

  const b = ev.target.closest('[data-tag-grupo]'); if (!b) return;
  const t = b.dataset.tagGrupo;

  if (todasLaTienen) quitarTagGrupo(t);

$('tagboxGrupo').addEventListener('keydown', ev => {

  ev.preventDefault();

/* ---------- fotos y pliegue ---------- */
let pageImg=null, nextImg=null, prevImg=null, pend=false, folding=false;
/* folding dice que HAY un pliegue dibujándose; esta otra dice QUIÉN lo lleva.
   Son dos cosas distintas y confundirlas costaba un fallo: ver endFold. */
let plegandoConDedo = false;
/* SOLO UN PLIEGUE MANDA A LA VEZ, y este número dice cuál.

   Cada animación de hoja corre en su propio bucle de cuadros leyendo anchor y
   F, que son de todos. Al terminar, un bucle los deja en nulo —es su forma de
   decir «ya no hay pliegue»—; si para entonces había OTRO bucle vivo, el
   siguiente cuadro de ese otro lee anchor.x de un nulo y tira el programa.

   Y sí hay forma de que haya dos. El botón de pasar hoja se protege con
   folding, pero folding no se enciende hasta que la foto de la hoja destino
   está descargada, y descargarla es asíncrono: en ese hueco un segundo toque
   pasa el guardia limpiamente y arranca su propio viaje. Con toques seguidos
   en la vista de lejos se reproduce a la primera.

   Cada animación toma un número al empezar; en cada cuadro comprueba que
   sigue siendo el suyo y, si no lo es, se retira sin tocar nada. La última
   petición gana, que es lo que espera quien está tocando. */
let generacionPliegue = 0;
/* Y esto cierra el hueco por delante: mientras se descarga la foto no se
   admite otra petición, así que las dos animaciones rara vez llegan a
   existir. El número de arriba es la red por si llegan igual. */
let preparandoPliegue = false;
/* El reloj de los reintentos por foto rancia. Vive aparte porque hay que poder
   cancelarlo desde fuera: ver pasarHoja. */
let relojReintento = null;
/* Y ESTO ES LO QUE DE VERDAD HAY QUE SOLTAR: que la tanda de reintentos tiene
   pedida la preparación. Mirar el reloj no alcanzaba, y ahí estaba el fallo.

   El callback del reintento se pone en nulo ANTES de volver a llamar a
   pasarHoja, así que cuando la tanda se agotaba —el respaldo de intento > 3, o
   toparse con el final del libro a media tanda— soltarReintento encontraba el
   reloj ya nulo, se iba por la primera línea y dejaba preparandoPliegue
   encendido sin nadie que lo apagara. Desde ese momento el guardia de pasarHoja
   rechazaba todos los toques normales del filo: la huella salía y la hoja no se
   movía, en esa hoja y en todas las demás, hasta recargar.

   Se ve solo en algunas hojas porque solo algunas agotan los cuatro reintentos:
   hace falta que la foto de la hoja viva no llegue en 520 ms —una hoja pesada
   en un teléfono lento, o una foto que falla— y eso depende de la hoja.

   Con la bandera, soltar la tanda es soltar la tanda, haya reloj o no. Y sigue
   sin tocar la preparación que NO es suya: la que pide la foto de la hoja
   destino se apaga sola en su callback, y detenerZoomAuto —que también llama
   aquí— no se la puede llevar por delante. */
let reintentando = false;
function soltarReintento(){
  if (relojReintento){ clearTimeout(relojReintento); relojReintento = null; }
  if (reintentando){ reintentando = false; preparandoPliegue = false; }
}
let snapFirma = null;
/* LA RONDA DE FOTOS, y por qué hace falta un número.

   makeSnapshot arranca tres cargas —la hoja de arriba y sus dos vecinas— y se
   vuelve a llamar seguido: cada repintado, cada reintento. Con las cargas
   tardando lo suyo, dos rondas se pisan, y la vieja siempre llega después.
   Da igual con qué llegue: una foto vieja puesta encima de la nueva retrata
   una hoja que ya no es, y un fallo viejo tira una foto nueva que sí servía —y
   la siguiente vuelta de hoja se va sin animación por una carga que ya no le
   importaba a nadie—. El plazo de loadSVG hizo esto más fácil de ver, pero
   pisarse ya se pisaban.
   Cada ronda toma su número y solo la última escribe. Es la misma regla que
   generacionPliegue, por la misma razón. Lo levantó la revisión de Codex. */
let rondaFoto = 0;
const snapStale = () => (snapFirma !== estiloFirma());
function invalidateSnapshot(){
  pageImg = nextImg = prevImg = null;

/* ============================================================
   LA FOTO, POR MEDICIÓN Y NO POR RECOMPOSICIÓN.
   Igualar ajustes entre la hoja viva y el SVG nunca alcanzó: son dos
   motores de composición y cada uno decide por su cuenta dónde parte el
   renglón. Así que ya no se le pide al SVG que componga texto —solo pinta
   papel, recuadros y bordes— y cada palabra se dibuja en el lienzo en la
   coordenada exacta donde el navegador la puso en la hoja real.
   Coincide por construcción, no por coincidencia.
   ============================================================ */
function medirPalabras(hostEl){
  const host = hostEl.getBoundingClientRect();
  const salida = [];
  /* Las glosas van torcidas, y un rectángulo de texto girado devuelve su caja
     envolvente, no su posición real: medir así dejaría las letras corridas.
     Se enderezan un instante para medirlas en limpio, se apunta el ángulo y el
     centro de giro de cada una, y al final se devuelven a su sitio. El lienzo
     rehace el giro palabra por palabra. Nadie ve nada: no hay repintado entre
     el enderezado y el restablecido, todo pasa dentro del mismo cuadro. */
  const torcidas = [];
  for (const el of hostEl.querySelectorAll('[data-giro]')){
    torcidas.push({ el:el, previo:el.style.transform });
    el.style.transform = 'none';
  }
  const eje = new Map();
  for (const t of torcidas){
    const r = t.el.getBoundingClientRect();
    eje.set(t.el, { a: parseFloat(t.el.dataset.giro || 0) * Math.PI / 180,
                    gx: r.left - host.left + r.width/2,
                    gy: r.top  - host.top  + r.height/2 });
  }
  const paseo = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT);
  const rango = document.createRange();
  let n;
  while ((n = paseo.nextNode())){
    if (!n.nodeValue.trim()) continue;
    const el = n.parentElement;
    if (!el || el.offsetParent === null && el.closest('#ghost') === null) continue;
    const est = getComputedStyle(el);
    if (est.visibility === 'hidden' || est.display === 'none') continue;
    /* El lienzo sí sabe de espaciado entre letras y de variantes numéricas,
       pero hay que pasárselos aparte: no viajan en la abreviatura de font. */
    const esp = est.letterSpacing === 'normal' ? '0px' : est.letterSpacing;
    /* Y las VERSALITAS, por dos caminos a la vez. Los titulillos se componen
       con font-variant-caps, y sin pasársela el lienzo mediría "Mateo 5:12" en
       capitales de altura de equis y lo pintaría en caja alta y baja, así que
       el ajuste de ancho de más abajo lo aplastaría para que cupiera: un
       titulillo estrujado durante el giro y el bueno al aterrizar, que es el
       brinco que este archivo lleva media docena de comentarios evitando.

       DOS CAMINOS Y NO UNO, y esto lo encontró la revisión de Codex. La
       propiedad ctx.fontVariantCaps es reciente; hay navegadores que entienden
       font-variant-caps en el CSS —así que la hoja SÍ sale en versalitas— y no
       conocen la propiedad del lienzo. Ahí preguntar y rendirse dejaba
       exactamente el defecto que se vino a arreglar, solo que en los
       navegadores que nadie prueba.
       Así que la variante viaja también en la ABREVIATURA de font, que admite
       small-caps desde CSS2 y la entiende todo el mundo. Comprobado que dan lo
       mismo: 99.58px por la propiedad y 99.58px por la abreviatura.
       El orden es el que manda CSS —estilo, variante, peso, tamaño, familia—
       y f0 guarda la misma cadena sin la variante, para lo de abajo. */
    const vers = est.fontVariantCaps || 'normal';
    const versalitas = (vers === 'small-caps' || vers === 'all-small-caps');
    const cola = ' ' + est.fontWeight + ' ' + est.fontSize + ' ' + est.fontFamily;
    const tipo0 = est.fontStyle + cola;
    const tipo = versalitas ? est.fontStyle + ' small-caps' + cola : tipo0;
    const re = /\S+/g;
    let m;
    while ((m = re.exec(n.nodeValue))){
      rango.setStart(n, m.index);
      rango.setEnd(n, m.index + m[0].length);
      const rects = rango.getClientRects();
      if (!rects.length) continue;
      const r = rects[0];                 // sin guiones, una palabra = un rectángulo
      if (r.width < .5) continue;
      const caja = el.closest('[data-giro]');
      const j = caja ? eje.get(caja) : null;
      salida.push({ t:m[0], x:r.left - host.left, y:r.top - host.top,
                    w:r.width, h:r.height, f:tipo, f0:tipo0, px:est.fontSize,
                    c:est.color, e:esp, vc:vers,
                    a: j ? j.a : 0, gx: j ? j.gx : 0, gy: j ? j.gy : 0 });
    }
  }
  for (const t of torcidas) t.el.style.transform = t.previo;
  return salida;
}
function pintarPalabras(g, palabras){
  g.textBaseline = 'alphabetic';
  let ultimo = null, subida = 0;
  for (const p of palabras){
    const clave = p.f + '|' + p.e + '|' + (p.vc || 'normal');
    if (clave !== ultimo){
      g.font = p.f;
      /* LA RED DEBAJO DE LA ABREVIATURA. Una asignación que el lienzo no
         entiende no lanza error: se ignora en silencio y ctx.font se queda
         con la letra ANTERIOR. Comprobado. Así que si algún motor rechazara
         la variante en la abreviatura, no perderíamos las versalitas de un
         titulillo: perderíamos la letra de TODAS las palabras que vinieran
         después, que sale infinitamente peor. Se comprueba que el tamaño
         pedido esté en lo que quedó puesto, y si no, se repite sin variante.
         Cuesta una comparación de cadenas por cambio de letra, no por
         palabra. */
      if (p.f !== p.f0 && g.font.indexOf(p.px) < 0) g.font = p.f0;
      if ('letterSpacing' in g) g.letterSpacing = p.e;
      /* La propiedad, encima de la abreviatura, para los motores que la
         tienen: es la única que sabe decir all-small-caps, y va DESPUÉS
         porque asignar font puede reponerla a normal. Se repone a 'normal'
         cuando toca, porque el estado del lienzo es pegajoso: si no, la
         primera palabra en versalitas dejaría en versalitas todo el resto. */
      if ('fontVariantCaps' in g) g.fontVariantCaps = p.vc || 'normal';
      ultimo = clave;
      const m = g.measureText('Hxg');
      subida = m.fontBoundingBoxAscent || m.actualBoundingBoxAscent || p.h * 0.8;
    }
    g.fillStyle = p.c;
    /* si la palabra vive en una glosa torcida, se gira el lienzo igual que
       la caja: mismo ángulo y mismo centro que en la hoja viva */
    if (p.a){ g.save(); g.translate(p.gx, p.gy); g.rotate(p.a); g.translate(-p.gx, -p.gy); }
    /* El motor de texto del lienzo compone las letras dentro de la palabra
       con mínimas diferencias respecto al del navegador —uno o dos píxeles.
       En vez de confiar en él, se le obliga a ocupar el ancho EXACTO que la
       palabra tiene en la página. */
    const anchoLienzo = g.measureText(p.t).width;
    if (p.w > 0.5 && Math.abs(anchoLienzo - p.w) > 0.25 && anchoLienzo > 0.5){
      g.save();
      g.translate(p.x, 0);
      g.scale(p.w / anchoLienzo, 1);
      g.fillText(p.t, 0, p.y + subida);
      g.restore();
    } else {
      g.fillText(p.t, p.x, p.y + subida);
    }
    if (p.a) g.restore();
  }
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  if ('fontVariantCaps' in g) g.fontVariantCaps = 'normal';
}

/* DE HTML A XML, que es lo que este SVG es de verdad.

   Los tres trozos llegan de innerHTML, o sea serializados como HTML: ahí los
   elementos vacíos van SIN cerrar, que es lo correcto en HTML y un error fatal
   en XML. Y este marcado se mete en un data:image/svg+xml, que lo parsea un
   lector de XML: un solo <wbr> sin cerrar tira el documento entero, la imagen
   dispara onerror, la foto se queda en null y pasar hoja pierde la animación.
   Medido con una etiqueta larga: 0 cuadros de lienzo y 0 tinta, contra 15
   cuadros y 75.831 píxeles sin ella.

   No basta con escribirlos cerrados donde se generan, porque el viaje por el
   DOM los vuelve a abrir. La conversión tiene que ocurrir aquí, en la frontera,
   que es el único punto por el que pasa todo lo que va a ser XML.
   La lista es la de los vacíos que pueden aparecer en una hoja: wbr lo pone el
   corte de etiquetas, y los otros tres por si alguna nota o versión los trae. */
const VACIOS_XML = /<(wbr|br|hr|img)((?:\s[^<>]*?)?)\s*\/?>/gi;
const aXML = h => String(h || '').replace(VACIOS_XML, (_, t, at) => '<' + t + at + '/>');

   la marca se queda quieta en el aire, o desaparece a mitad de gesto. Se
   dibuja con estilos en línea porque el SVG solo trae PAGE_CSS y no ve la
   hoja de la aplicación. hojaN es el índice de la página retratada. */
function htmlCintaFoto(hojaN){
  if (hojaN == null || typeof sepEnPagina !== 'function') return '';
  const s = sepEnPagina(hojaN);
  if (!s) return '';
  const t = (typeof telaDe === 'function' ? telaDe(s.color) : null) ||
            ['','','#9b2a2a','#7a1f1f'];

    ? sepMedidas()
    : { arriba:0, izq:0, ancho:48 };
  return '<div class="sep-percha" style="position:absolute;z-index:4;pointer-events:none;' +
    'top:' + m.arriba + 'px;left:' + m.izq + 'px;width:' + m.ancho + 'px;' +
    'aspect-ratio:1/1.75">' +
    '<div style="position:absolute;inset:0;border:0;padding:0;margin:0;' +
      'background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,' +
        'rgba(0,0,0,.05) 1px 3px),' +
        'linear-gradient(100deg,' + t[3] + ' 0%,' + t[2] + ' 32%,' +
        t[2] + ' 68%,' + t[3] + ' 100%);' +
      'clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);' +
      'filter:drop-shadow(-1.5px 0 0 rgba(252,247,235,.92))' +
             ' drop-shadow(0 2px 3px rgba(60,40,15,.42))"></div></div>';
}
function buildSVG(bodyHTML, marginHTML, footHTML, mw, gap, w, h, cabeza, hojaN){

     SVG lleva su propia copia de PAGE_CSS y NO ve las reglas del modo angosto,
     que viven en la hoja de estilos de la aplicación. Sin esto, la foto se
     compone con el acomodo de escritorio y sale otra hoja. */

                               hueco:11, orilla:16 } : null;

                         'px;padding-left:'+med.orilla+'px;padding-right:'+med.orilla+'px;' : '';

                         'padding-bottom:'+getComputedStyle(pgBody.closest('.pg-inner')).paddingBottom+'"' : '';

     copia de PAGE_CSS y nada más—. Sin repetirlo aquí, la foto salía con el
     titulillo en la esquina y el texto más arriba, y al voltear la hoja
     el texto daba un brinco.
     Cuánto baja el texto ya NO se repite como número: se lee de la hoja viva.
     Estaba escrito 15px en los dos lados, y cuando se corrigió el de la hoja
     de estilos este se habría quedado atrás —que es exactamente el brinco que
     describe el párrafo de arriba, pero al revés. Un número que tiene que
     coincidir en dos sitios termina no coincidiendo; leerlo de un solo sitio

  const estCab  = med ? ' style="left:'+(med.texto/2)+'px;right:auto;width:auto;' +
                        'transform:translateX(-50%);text-align:center;font-size:21px;' +
                        'line-height:26px;padding:4px 13px 5px;border-radius:0 0 5px 5px"' : '';

                        'transform:translateX(-50%);text-align:center;' +
                        'font-size:21px;line-height:26px;letter-spacing:.10em;padding:3px 13px 2px"' : '';

         arriba, pero de color. */
      '<div xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es" class="pg sin-tinta" style="width:'+w+'px;height:'+h+'px;font-family:'+fuente+';--fam:'+fuente+

          /* Estas dos NO pintan nada aquí, y conviene saberlo antes de ir a

        '<div class="pg-cabeza"'+estCab+'>'+esc(cabeza||'')+'</div><div class="pg-cols"'+estCols+'>'+
        '<div class="pg-body" xml:lang="es" lang="es" style="'+estBody+estiloEnLinea()+'">'+bodyHTML+'</div>'+
        '<div class="pg-margin" style="width:'+m+';margin-left:'+g+';--mw:'+m+';--mgap:'+g+'">'+marginHTML+'</div>'+
        '</div><div class="pg-foot">'+footHTML+'</div></div></div>'+
    '</foreignObject></svg>';

/* LA CARGA SE RESUELVE UNA SOLA VEZ, Y NUNCA SE QUEDA ESPERANDO.

   Quien pide una foto apaga su estado en `ok` o en `fail`; si el navegador no
   dispara ninguno de los dos —pasa con data: muy grandes— ese estado se queda
   encendido y el paso de hoja no vuelve a entrar. El plazo no marca el ritmo de
   nada: una hoja se rasteriza en decenas de milisegundos, así que este reloj
   solo se cumple cuando la carga ya no va a llegar, y entonces sale por el
   camino de fallo, que todos los que llaman aquí ya saben atender. */
const ESPERA_FOTO = 4000;
function loadSVG(svg, ok, fail){
  const img = new Image();
  let hecho = false;
  function salir(bien){
    if (hecho) return;
    hecho = true; clearTimeout(reloj);
    if (bien) ok(img); else if (fail) fail();
  }
  const reloj = setTimeout(() => salir(false), ESPERA_FOTO);
  img.onload = () => salir(true); img.onerror = () => salir(false);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function cuerpoHTML(a,b){ let s=''; const below = placement==='below';
  for (let i=a;i<b;i++) s += verseHTML(i, SPAN_MARKS, below); return s; }
function rectsDeMarcas(bodyEl, hostEl){
  if (SPAN_MARKS) return [];
  const host = hostEl.getBoundingClientRect(), out = [];
  for (const m of marcas){
    if (!visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, bodyEl); if (!rg) continue;
    const rs = [];
    for (const q of rg.getClientRects())
      if (q.width >= .5) rs.push({x:q.left-host.left, y:q.top-host.top, w:q.width, h:q.height});
    if (rs.length) out.push({ estilo:m.estilo, color:m.color, rects:rs,
                              dudosa:['aprox','versiculo'].includes(RES.get(m.id).grado) });
  }

function componer(img, ms, palabras, w, h){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const c = document.createElement('canvas'); c.width = w*dpr; c.height = h*dpr;
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(img,0,0,w,h);              // papel, recuadros y bordes
  pintarPalabras(g, palabras);           // los glifos, ya medidos de la hoja real
  for (const m of ms){
    if (m.estilo === 'fill'){
      g.save(); g.globalCompositeOperation='multiply';
      g.globalAlpha = FILL_ALFA[m.color];      /* la misma que en la hoja viva */
      g.fillStyle = 'rgb('+FILL_RGB[m.color]+')';
      for (const q of m.rects) g.fillRect(q.x-1, q.y, q.w+2, q.h);
      g.restore();
    } else {
      g.strokeStyle = TRAZO_HEX[m.color]; g.lineWidth = GRUESO_TRAZO;
      for (const q of m.rects){ const y = Math.round(q.y+q.h-0.5)+.5;
        g.beginPath(); g.moveTo(q.x,y); g.lineTo(q.x+q.w,y); g.stroke(); }
    }
    if (m.dudosa){
      g.save(); g.strokeStyle='#b23a3a'; g.lineWidth=2; g.setLineDash([2,3]);
      for (const q of m.rects){ const y = Math.round(q.y+q.h+1)+.5;
        g.beginPath(); g.moveTo(q.x,y); g.lineTo(q.x+q.w,y); g.stroke(); }
      g.restore();

}
/* Fotografía CUALQUIER hoja del mapa, no solo las vecinas: un salto
   necesita la foto de su destino aunque esté a cinco hojas. */
function fotoDeHoja(p, asignar){
  /* Sin el zoom puesto: aquí dentro se mide la hoja fantasma contra la viva y
     se retratan las palabras una a una. Ver sinZoom. */
  return sinZoom(() => fotoDeHojaCrudo(p, asignar));
}
function fotoDeHojaCrudo(p, asignar){
  if (!hayHojaN(p)){ asignar(null); return; }
  /* El ancho del PAPEL, no el de la ventana: en teléfono la hoja sobresale y
     la foto tiene que retratarla entera, glosas incluidas. */
  const med = medirHojaTelefono();
  const w = med ? (med.texto + med.hueco + med.glosa)
                : Math.max(pg.scrollWidth, pg.offsetWidth);
  const h = pg.offsetHeight;
  const from = paginas[p], hasta = finDe(p);
  prepararHoja(ghost, w, h);
  if (med) ghost.style.setProperty('--mx', '0px');
  const r = layoutInto(ghostBody, ghostMargin, ghostFoot, from, hasta);
  ghostCabeza.textContent = cabezaDe(from);
  const ms = rectsDeMarcas(ghostBody, ghost);
  const palabras = medirPalabras(ghost);
  loadSVG(buildSVG(cuerpoHTML(from, hasta), r.marginHTML, r.footHTML, r.mw, r.gap, w, h, cabezaDe(from), p),
    img => {
      /* Componer puede reventar —un lienzo enorme no siempre se reserva— y si
         revienta aquí, `asignar` no se llama nunca y quien esperaba la foto se
         queda esperando. Una foto que no salió es una foto nula, que es un
         desenlace que todos los que llaman aquí ya saben atender. */
      let foto = null;

   forma a las glosas— sembrado con el filo y la altura del toque, así que
   cambia de un toque a otro y es SIEMPRE la misma para el mismo punto. Es la

function crestasHuella(semilla){
  const r = azarDe(String(semilla));

    const rx = 3.4 + i * 3.25 + r() * 1.1;
    const ry = 4.2 + i * 3.95 + r() * 1.3;

       un trazo mal hecho en vez de como piel. */
    const fase = r() * 6.283, amp = .020 + r() * .030;

       y no como una diana— pero ya ninguna se pierde.

       el navegador los reparte entre dos filas y los pinta a media tinta, así

    d += '<path d="' + p + '" fill="none" stroke="rgba(' + DORADO + ',' +

}

     y se sigue leyendo como "tu dedo está en este filo". */

     que dura un clic—: la huella se va sin que pase nada, que es exactamente
     lo que hay que contar. */

     entendió y todavía no mueve nada. Se apaga en el mismo cuadro en que
     arranca el giro —ni antes, que devolvería el hueco a otro sitio, ni
     después, que la dejaría flotando sobre una hoja que ya se fue. */

     ancho de la PANTALLA y no el del papel, al texto le quedaban 150px y salía
     esa columnita justificada. La hoja que se voltea tiene que ser la misma

                        'min-width':COL_GLOSA + 'px', 'margin-left':HUECO_COL + 'px' });

    /* Cruzado el umbral: la decisión está tomada y el gesto termina aquí. El
       cajón sale o entra ENTERO —jalar hacia la izquierda trae las glosas,
       hacia la derecha devuelve el texto— y el dedo ya no manda nada más. */
    activo = false;
    ev.preventDefault();
    irA(dx < 0 ? tope() : 0);
  });

  const soltar = ev => {
    if (ev && ev.pointerId != null && ev.pointerId !== puntero) return;
    activo = false;
  };
  pg.addEventListener('pointerup', soltar);
  pg.addEventListener('pointercancel', soltar);
  /* Cancela el acomodo en curso y suelta el gesto antes de cerrar. Sin
     cancelar el reloj, la hoja aterrizada heredaría el viaje que traía la
     anterior y se pondría a correrse sola. */
  cerrarCajonDeGlosas = () => {
    cancelAnimationFrame(reloj);
    activo = false;
    pg.classList.remove('agarrado');
    pg.scrollLeft = 0;
  };
})();

/* CORRER EL PAPEL CON RATÓN O TRACKPAD.

   En un teléfono el desliz con el dedo ya funciona solo: es desplazamiento
   nativo. En una computadora NO, y no es un defecto nuestro: arrastrar con el
   ratón nunca desplaza una caja —eso selecciona texto—, y como escondimos la
   barra de desplazamiento tampoco quedaba de dónde jalar. Se quedaba uno
   arrastrando sin que pasara nada, que es justo lo que te pasó.

   Aquí la rueda vertical se traduce en movimiento horizontal, porque en esta
   caja no hay nada que desplazar hacia abajo: rodar hacia abajo trae las
   glosas, rodar hacia arriba devuelve el texto. Y solo se toma la rueda
   mientras quede papel por correr en esa dirección; si no, se deja pasar para
   no secuestrar el desplazamiento de la página. */
pg.addEventListener('wheel', ev => {
  if (zoomActivo) return;               /* de lejos no hay papel que correr */
  const sobra = pg.scrollWidth - pg.clientWidth;
  if (sobra < 4) return;
  /* La rueda vertical da pasos chicos —unos 40px por muesca— y con 233px que
     correr eso son seis muescas para llegar. Se multiplica para que dos o tres
     basten. El gesto lateral del trackpad no se toca: ése ya viene con la
     distancia que el dedo pidió. */
  const lateral = Math.abs(ev.deltaX) > Math.abs(ev.deltaY);
  const paso = lateral ? ev.deltaX : ev.deltaY * 2.6;
  const destino = pg.scrollLeft + paso;
  if ((paso > 0 && pg.scrollLeft >= sobra - 1) ||
      (paso < 0 && pg.scrollLeft <= 1)) return;
  ev.preventDefault();
  pg.scrollLeft = Math.min(Math.max(destino, 0), sobra);
}, { passive:false });

/* Cuando el papel ya está corrido hasta las glosas, la insinuación del borde
   sobra: ya viste lo que había que ver. Se apaga sola y vuelve al regresar. */
pg.addEventListener('scroll', () => {
  const alFondo = pg.scrollLeft >= pg.scrollWidth - pg.clientWidth - 4;
  stage.classList.toggle('hasta-el-fondo', alFondo);
  if (folding) fx.style.left = (-pg.scrollLeft) + 'px';
}, { passive:true });

/* ============================================================
   VER LA HOJA ENTERA.

   Solo escala; no cambia ni un ancho. Por eso lo que se ve de lejos es
   exactamente la hoja a la que se vuelve, con los mismos cortes de renglón.
   ============================================================ */
/* zoomK y zoomFx son la traducción de pantalla a papel mientras dura la vista
   de lejos: la escala, y dónde queda la esquina del lienzo. Los deja puestos
   medirZoom, que es quien los calcula para colocar la hoja, y los lee aPapel
   para que el dedo y el papel hablen del mismo sitio. */
let zoomActivo = false, zoomK = 1, zoomFx = { x:0, y:0 };
/* LA HOJA VA CENTRADA, y eso decide cómo se calcula la escala. Estaba
   arriba, con todo el hueco de una vez debajo: se veía como una hoja pegada al
   techo, no como una hoja puesta sobre la mesa. Centrada, el hueco se reparte
   —arriba y abajo— y la hoja queda donde el ojo la busca.
   El precio es que el sitio de los botones hay que reservarlo DOS veces, una
   por lado, porque centrar lo que sobra lo parte por la mitad: reservar solo
   abajo dejaría la hoja centrada encima de sus propios botones. Por eso la
   escala se calcula contra H menos dos reservas, y sale una hoja un pelo más
   chica que la de antes. Es lo que cuesta que esté en su sitio. */
const ZOOM_RESERVA = 76, ZOOM_AIRE = 12;
/* CUÁNTO SE LE GUARDA A LOS BOTONES, MEDIDO Y NO SUPUESTO.

   Los 76 de arriba eran el alto de los botones de antes más su aire, escrito a
   mano. Al crecer a 93 la cuenta dejó de cuadrar sin que nadie la tocara: el
   botón llega 105px hacia arriba desde el canto y solo se reservaban 76, así
   que en cuanto el ALTO manda sobre la escala —una pantalla apaisada, que es
   media pantalla de teléfono girada— la hoja terminaba por debajo de los
   botones y estos le tapaban la parte de abajo, robándole además los toques.
   Medido antes de arreglarlo: 29px de solape a 560x360, 540x320 y 412x300,
   y 6px a 412x420. En vertical no se veía porque ahí manda el ancho.
   Ahora se pregunta al propio elemento cuánto ocupa, así que cambiar el CSS de
   los botones no puede volver a descuadrar esto. El 76 se queda como suelo,
   para el aire del titulillo cuando los botones no están.
   Lo levantó la revisión de Codex, con la cifra exacta. */
function reservaDeZoom(){
  const c = $('zoomPasos');
  const alto = c ? c.offsetHeight : 0;
  return Math.max(ZOOM_RESERVA, alto + ZOOM_AIRE*2);
}
function medirZoom(){
  if (!zoomActivo) return;
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return;
  /* El ancho del PAPEL, no el de la ventana: en teléfono el papel sobresale, y
     retratarlo entero es de lo que se trata. offsetWidth del inner y no
     scrollWidth de #pg, porque el segundo cambia cuando el cajón está corrido
     y aquí hace falta la medida verdadera, la que no depende de dónde lo
     dejaste. */
  const W = pg.clientWidth, H = pg.clientHeight;
