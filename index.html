       Un salto no. Vienes de tocar una referencia DENTRO de una glosa —o sea
       con el cajón abierto y el versículo fuera de la pantalla— y lo que
       llega es otro pasaje, que es justo lo que no se ve desde ahí. Se
       aterrizaba en el margen de la hoja nueva, con las notas de un sitio al
       que no habías ido, y había que arrastrar de vuelta para ver a dónde
       habías llegado.
       Va antes de renderPage a propósito: el destello de llegada mide dónde
       está el versículo, y tiene que medirlo con el papel ya en su sitio. */
    cerrarCajonDeGlosas();
    renderPage();
    fx.style.display='none'; pg.classList.remove('hidden');
    if (typeof sepTrasPliegue === 'function') sepTrasPliegue();
    if (alLlegar) alLlegar();
  };
  if (!pageImg || destino === paginaActual){ aterrizar(); return; }
  const salto = Math.abs(destino - paginaActual);

  /* Siempre bonche, aunque sea una sola hoja de distancia: un puño de papel
     abanicándose se lee mejor que una hoja rígida. El grosor crece con la
     distancia y se topa en siete, porque pasando cierto punto "muchas" ya no
     se distingue de "muchísimas". */
  const b = bonchePara(salto);
  pasoAnimado(paginaActual, destino, rnd(b.dur[0], b.dur[1]), b.hojas, aterrizar);
}

/* ============================================================
   PANEL DE LIBROS. Entra desde la derecha al detenerte en el filo. Cada
   renglón crece al pasarle encima —eso vive en el CSS, con transform, para
   que ninguno empuje a los demás. Al soltar, salta al libro con un bonche.
   ============================================================ */
const mayus = t => t.replace(/^(\d?)(.)/, (_, d, c) => d + c.toUpperCase());
const CANON = Object.keys(LIBROS_ES).map((id, i) => {
  const alias = LIBROS_ES[id].split(' ');
  /* para la pestaña, el alias MÁS corto: en varios libros el segundo es el
     nombre sin acento y salían etiquetas de ocho letras */
  const breve = alias.slice(1).concat(alias[0]).sort((a,b) => a.length - b.length)[0];
  return {
    id,
    nombre: mayus(alias[0]).replace(/^(\d)(?=\p{L})/u, '$1 '),
    corto: mayus(breve),
    nt: i >= Object.keys(LIBROS_ES).indexOf('MAT')
  };
});
const nombreDe = id => (CANON.find(b => b.id === id) || {nombre:id}).nombre;
const abrevDe  = id => (CANON.find(b => b.id === id) || {corto:id}).corto || id;

const canto = $('canto');
let cantoAbierto = false, relojCanto = null;

/* Los conteos salen SIEMPRE de los datos —capsDe()— y no de una tabla: si
   un libro tiene 16 capítulos se ven 16, y si el archivo solo trae 2, se
   ven 2. El menú nunca ofrece algo que no existe. */
let selLibro = null, selCap = null;

const capitulosDe = libro => {
  const caps = capsDe(version, libro);
  return caps ? Object.keys(caps).map(Number).sort((a,b) => a-b) : [];
};
const versiculosDe = (libro, cap) => {
  const caps = capsDe(version, libro);
  return caps && caps[cap] ? caps[cap].length : 0;
};

/* EL LIBRO DE AL LADO EN EL ORDEN DEL CANON, saltándose los que no están en
   los datos cargados. Se salta y no se para: si la versión no trae Abdías, el
   lector no tiene por qué encontrarse un final de libro que no lleva a
   ninguna parte —para él ese libro sencillamente no existe—.
   Devuelve null en Génesis hacia atrás y en Apocalipsis hacia adelante, que
   son los dos únicos sitios donde de verdad se acaba la lectura. */
/* La marca de «estás aquí» del panel de Libros, al día. Se llama desde
   renderPage, así que da igual por dónde se haya cambiado de libro —un salto,
   una referencia, o pasar la última hoja— la lista nunca señala el anterior.
   Toca las tres clases y no solo 'aqui' porque son excluyentes: dejar 'viva'
   puesta debajo daría un botón que dice dos cosas. */
function refrescarLibroActual(){
  document.querySelectorAll('#canto [data-libro]').forEach(b => {
    const vivo = hayLibro(b.dataset.libro), aqui = b.dataset.libro === LIBRO;
    b.classList.toggle('aqui', aqui);
    b.classList.toggle('viva', !aqui && vivo);
    b.classList.toggle('muerta', !aqui && !vivo);
  });
}

function libroVecino(s){
  const i = CANON.findIndex(b => b.id === LIBRO);
  if (i < 0) return null;
  const paso = s === 'right' ? 1 : -1;
  for (let j = i + paso; j >= 0 && j < CANON.length; j += paso)
    if (hayLibro(CANON[j].id)) return CANON[j].id;
  return null;
}

/* PASAR DEL FINAL DE UN LIBRO AL PRINCIPIO DEL SIGUIENTE.

   Es una hoja más, y por eso no reutiliza saltarA: un salto es haber ido a
   buscar algo, y esto es seguir leyendo. Se nota en tres cosas.
   · Voltea UNA hoja, no un bonche. Entre la última de Mateo y la primera de
     Marcos hay exactamente una hoja, igual que en el papel.
   · No apunta en el rastro. Pasar hojas es leer; el rastro guarda a dónde
     fuiste a propósito, y llenarlo de cruces de libro lo volvería un
     registro de lectura, que es otra cosa y no sirve para lo mismo.
   · No destella el versículo de llegada. No preguntaste por ninguno.

   Lo que sí comparte con saltarA es lo caro: rehacer el plano del libro nuevo
   y repaginarlo. En un teléfono eso son segundos, así que se enciende el
   disco y el trabajo arranca al cuadro siguiente, para que dé tiempo a
   pintarlo antes de que el hilo se cierre.

   `sinAnimar` es para cuando el giro ya lo hizo el dedo: ahí el pliegue está
   terminado y lo único que falta es aterrizar en el libro nuevo. Animar otra
   vez daría dos vueltas de hoja para un solo gesto. */
function cruzarLibro(s, clientY, sinAnimar){
  const destinoLibro = libroVecino(s);
  if (!destinoLibro) return false;
  const viejo = pageImg;
  const y = Number.isFinite(clientY) ? aPapel(0, clientY).y : H/2;
  const anclaY = Math.min(Math.max(y, 0), H);
  side = s;
  preparandoPliegue = true;
  mostrarBuscando(s === 'right' ? 'pasando al libro siguiente…'
                                : 'pasando al libro anterior…');
  const armar = () => {
    LIBRO = destinoLibro;
    volverA = null;                    /* pasar hojas a mano cancela el regreso */
    paginasSucias = true;
    rehacerPlano();
    resolverTodas(); recalcularRefs(); calcularVinculos();
    asegurarPaginas();
    /* Entrando por delante se cae en la primera hoja; volviendo hacia atrás,
       en la última. Es por dónde se entra al libro, no dónde está su
       principio.
       Y ahí está la asimetría del coste: entrar por delante cuesta un corte,
       porque la primera hoja es la primera que se averigua. Entrar por detrás
       obliga a paginar el libro entero, porque no hay forma de saber cuál es
       la última sin llegar a ella. No hay atajo honesto: cualquier estimación
       daría una hoja que no es la última y se notaría al instante. */
    const destino = s === 'right' ? 0 : Math.max(0, todasLasPaginas() - 1);
    const aterrizar = () => {
      preparandoPliegue = false;
      hojasExtra = []; progreso = 0; alfaTop = 1;
      folding = false; plegandoConDedo = false; anchor = F = null;
      paginaActual = destino;
      renderPage();
      fx.style.display = 'none'; pg.classList.remove('hidden');
      if (typeof sepTrasPliegue === 'function') sepTrasPliegue();
      quitarBuscando();
      if (zoomActivo) refrescarPasos();
    };
    if (sinAnimar){ aterrizar(); return; }
    fotoDeHoja(destino, img => {
      if (!viejo || !img){ aterrizar(); return; }
      pageImg = viejo; bajoImg = img;
      quitarBuscando();
      animarHojas(1, rnd(620, 780), aterrizar, anclaY);
    });
  };
  /* Rehacer el plano de un libro entero es lo más caro que hace el programa, y
     si revienta a mitad, `aterrizar` no llega nunca: la preparación se queda
     pedida y el disco de "pasando al libro siguiente" tapando la hoja. Ninguna
     de las dos cosas se puede quedar puesta por una excepción. */
  trasPintar(() => {
    try { armar(); }
    catch(e){ preparandoPliegue = false; quitarBuscando(); throw e; }
  });
  return true;
}

function pintarCanto(){
  /* Vacía: el rótulo "Libros" ya está en la pestaña, y repetirlo dos renglones
     más abajo solo gastaba alto. Esta cabecera se queda para el botón de
     regreso de la cascada de capítulos. */
  $('cantoCab').innerHTML = '';
  const celdas = libros => libros.map(b => {
      const vivo = hayLibro(b.id), aqui = b.id === LIBRO;
      return '<button class="tabo ' + (aqui ? 'aqui' : vivo ? 'viva' : 'muerta') +
             '" data-libro="' + b.id + '" title="' + b.nombre +
             (vivo ? '' : ' — no está en estos datos') + '">' + b.nombre + '</button>';
    }).join('');
  /* CADA TESTAMENTO EN SU MITAD. Antes los dos grupos iban seguidos dentro de
     una sola caja con desplazamiento, y con 39 libros el Antiguo se comía el
     panel entero: el Nuevo Testamento quedaba abajo del todo, fuera de la
     vista, y para llegar a Mateo había que recorrer el Antiguo entero. Un
     índice en el que la mitad del contenido no se ve no es un índice.
     Ahora cada testamento tiene su propia caja con su propio desplazamiento y
     no pasa de la mitad del alto. Correr el Antiguo ya no mueve al Nuevo: son
     dos listas vecinas, no una lista larga. Y el rótulo se queda fijo fuera
     del desplazamiento, así que siempre se sabe cuál se está mirando.
     El aire de abajo va como un elemento vacío y no como padding de la caja.
     Parece rebuscado y no lo es: el relleno final de una caja con
     desplazamiento se lo comen varios navegadores en cuanto el contenido
     desborda —justo el caso que aquí es la norma—. Con flex-basis:100% cae en
     su propio renglón dentro de la rejilla y ocupa alto de verdad. */
  const grupo = (titulo, libros) =>
    '<div class="testamento"><span class="grupo-tit">' + titulo + '</span>' +
    '<div class="rejilla-libros">' + celdas(libros) +
    '<div class="aire-final"></div></div></div>';
  const c = $('cantoCuerpo');
  c.classList.add('testamentos');
  c.innerHTML = grupo('Antiguo Testamento', CANON.filter(b => !b.nt)) +
                grupo('Nuevo Testamento',  CANON.filter(b => b.nt));
}

/* ============================================================
   MENÚS EN CASCADA. Los capítulos salen pegados al libro que tocaste y
   los versículos pegados al capítulo, en vez de reemplazar la lista.
   Así no pierdes de vista de dónde venías.
   ============================================================ */
const flyCaps = $('flyCaps'), flyVers = $('flyVers');

function ocultarFly(el){
  el.classList.remove('visible');
  setTimeout(() => { if (!el.classList.contains('visible')) el.style.display = 'none'; }, 240);
}
function ocultarCascada(){ ocultarFly(flyVers); ocultarFly(flyCaps); }

/* Se coloca al lado del ancla; si no cabe a la derecha, se pasa a la
   izquierda, y siempre se mantiene dentro de la hoja. */
function colocarFly(el, ancla){
  const e = stage.getBoundingClientRect();
  el.style.display = 'block';
  el.style.visibility = 'hidden';
  el.classList.remove('visible');
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = ancla.right - e.left + 7;
  if (x + w > e.width - 5) x = ancla.left - e.left - w - 7;
  x = Math.max(5, Math.min(x, e.width - w - 5));
  let y = ancla.top - e.top - 4;
  y = Math.max(5, Math.min(y, e.height - h - 5));
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(y) + 'px';
  el.style.visibility = '';
  requestAnimationFrame(() => el.classList.add('visible'));
}

function abrirCapitulos(libro, ancla){
  selLibro = libro; selCap = null;
  ocultarFly(flyVers);
  const caps = capitulosDe(libro);
  flyCaps.innerHTML = '<span class="fly-tit">' + esc(nombreDe(libro)) + ' · ' +
    caps.length + ' cap</span><div class="fly-rejilla">' +
    caps.map(c => '<button class="num" data-cap="' + c + '" title="' +
      versiculosDe(libro, c) + ' versículos">' + c + '</button>').join('') + '</div>';
  colocarFly(flyCaps, ancla);
}
function abrirVersiculos(cap, ancla){
  selCap = cap;
  const n = versiculosDe(selLibro, cap);
  const textos = capsDe(version, selLibro)[cap] || [];
  flyVers.innerHTML = '<span class="fly-tit">' + esc(nombreDe(selLibro)) + ' ' + cap +
    ' · ' + n + ' v</span><div class="fly-rejilla">' +
    Array.from({length:n}, (_, i) => {
      const vacio = !(textos[i] || '').trim();
      return '<button class="num' + (vacio ? ' vacio' : '') + '" data-vers="' + (i+1) +
             '" title="' + (vacio ? 'versículo unido al anterior'
                                  : esc((textos[i]||'').slice(0,60)) + '…') + '">' +
             (i+1) + '</button>';
    }).join('') + '</div>';
  colocarFly(flyVers, ancla);
}

/* Los rollos de lectura y de etiquetas no tienen niveles ni selección:
   solo aparecen. Como son idénticos en comportamiento, salen de una misma
   fábrica en vez de duplicar el código dos veces. */
/* LAS TRES SECCIONES DE LA BURBUJA. Cambiar de pestaña NO debe verse como
   cerrar una cosa y abrir otra: el papel se enrollaría y volvería a bajar, y
   eso son 800 ms de teatro para un gesto que debería ser instantáneo. Por eso
   el cambio de pestaña cierra a la hermana en seco —sin animación— y solo el
   abrir la burbuja desde la esquina y el cerrarla se animan. */
/* LOS NOMBRES. "Lectura" no decía nada: todo el programa es lectura. Lo que
   hay dentro es tamaño, tipografía, márgenes, columnas y versión, o sea cómo
   se ve la página — "Formato". Y "Etiquetas" era la mitad de su contenido:
   ahora ahí viven las glosas mismas, listadas y filtrables, así que se llama
   por lo que guarda y no por cómo se ordena. El cuarto es "Respaldo", que es
   literalmente lo que hacen exportar e importar. */
const SECCIONES = [
  { id:'libros',   rotulo:'Libros'   },
  { id:'glosas',   rotulo:'Glosas'   },
  { id:'formato',  rotulo:'Formato'  },
  { id:'respaldo', rotulo:'Respaldo' },
];
/* el elemento de cada sección, en un solo sitio para no repetir el mapeo */
const PANEL = { libros:'canto', glosas:'etiquetas', formato:'ajustes', respaldo:'respaldo' };
let seccionViva = 'libros', cambiandoSeccion = false, dirSeccion = 1;

/* EL ACUSE TIENE QUE SOBREVIVIR AL CAMBIO DE BARRA. Abrir una sección vuelve
   a poner la barra de pestañas desde cero —ponerBarra la borra y la rehace,
   porque la pestaña encendida cambia—, así que el botón que traía el borde
   encendido deja de existir a los 180 ms. Sin esto, el acuse se cortaba en
   seco justo cuando entra el contenido: la mitad del gesto.
   Por eso el estado no vive en el botón sino aquí, en qué sección se pidió, y
   cada barra recién nacida lo recoge. Se apaga solo, y no por tiempo de
   animación: por que el trabajo terminó. */
let acusePendiente = null, relojAcuse = null;
function apagarAcuse(){
  acusePendiente = null;
  document.querySelectorAll('.pestanas button.acusa')
    .forEach(x => x.classList.remove('acusa'));
}
/* Recibe el BOTÓN, no solo la sección, y eso no es comodidad. Las barras de
   las secciones cerradas no se borran: se quedan dentro de su panel con
   display:none, así que en el documento hay varias .pestanas a la vez y
   buscar "la" barra devuelve la del primer panel del HTML —#ajustes—, que
   casi nunca es la que tocaste. Encendía un botón invisible. El que recibió
   el toque no hay que adivinarlo. */
function acusarPestana(sec, boton){
  acusePendiente = sec;
  clearTimeout(relojAcuse);
  document.querySelectorAll('.pestanas button.acusa')
    .forEach(x => x.classList.remove('acusa'));
  if (boton) boton.classList.add('acusa');
  /* La red de seguridad: si por lo que sea nadie viene a apagarlo —tocaste la
     pestaña que ya estaba abierta, o el panel se cerró por otro camino— el
     borde no se queda encendido para siempre. */
  relojAcuse = setTimeout(apagarAcuse, 900);
}

function barraPestanas(activa){
  const b = document.createElement('div');
  b.className = 'pestanas';
  b.innerHTML = SECCIONES.map(x =>
    '<button data-sec="' + x.id + '"' + (x.id === activa ? ' class="aqui"' : '') +
    '>' + x.rotulo + '</button>').join('') +
    '<button type="button" class="cerrar-x" aria-label="Cerrar el panel">×</button>';
  /* El acuse se enciende AL APOYAR EL DEDO, y también cuando tocas la pestaña
     que ya está abierta: ahí no va a pasar nada más —abrirSeccion no se llama—
     y sin el borde ese toque parecería no haber entrado. Un recibo que solo
     llega cuando además ocurre algo no es un recibo. */
  b.addEventListener('pointerdown', ev => {
    const t = ev.target.closest('[data-sec]'); if (!t) return;
    acusarPestana(t.dataset.sec, t);
  });
  if (acusePendiente) {
    const t = b.querySelector('[data-sec="' + acusePendiente + '"]');
    if (t){
      t.classList.add('acusa');
      /* Que exista esta barra nueva ES la señal de que la sección ya está
         armada: el trabajo terminó. Se le deja un respiro para que el borde
         se vea también sobre el contenido recién llegado —si se apagara en
         este mismo cuadro no llegaría a pintarse nunca— y luego se va con su
         propia transición, sin corte. */
      clearTimeout(relojAcuse);
      relojAcuse = setTimeout(apagarAcuse, 200);
    }
  }
  b.addEventListener('click', ev => {
    const x = ev.target.closest('.cerrar-x');
    if (x){
      ev.preventDefault(); ev.stopPropagation();
      cerrarTodosLosRollos();
      return;
    }
    const t = ev.target.closest('[data-sec]'); if (!t) return;
    ev.preventDefault(); ev.stopPropagation();
    if (t.dataset.sec !== activa) abrirSeccion(t.dataset.sec, true);
  });
  return b;
}
/* La barra se vuelve a poner cada vez que se abre, porque la pestaña activa
   cambia. Se quita la anterior si quedó. */
function ponerBarra(el, activa){
  const vieja = el.querySelector('.pestanas');
  if (vieja) vieja.remove();
  el.insertBefore(barraPestanas(activa), el.firstChild);
}
const SALIDA = 180;
const panelDe = id => document.getElementById(PANEL[id]);
const seccionDe = el => Object.keys(PANEL).find(k => document.getElementById(PANEL[k]) === el);

function abrirSeccion(id, enSeco){
  const de = SECCIONES.findIndex(x => x.id === seccionViva);
  const a  = SECCIONES.findIndex(x => x.id === id);
  dirSeccion = a >= de ? 1 : -1;              /* de dónde entra el contenido */
  const previo = panelDe(seccionViva);
  const seVa = enSeco && burbujaAbierta() && previo && previo.style.display !== 'none';
  seccionViva = id;

  const arranca = () => {
    cambiandoSeccion = !!enSeco;
    if (id === 'libros')        abrirCanto();
    else if (id === 'glosas')   rGlosas.abrir();
    else if (id === 'formato')  rFormato.abrir();
    else                        rRespaldo.abrir();
    cambiandoSeccion = false;
  };
  if (!seVa) return arranca();

  /* La pestaña nueva se enciende YA, antes de que nada se mueva: el usuario
     tiene que ver que su clic se registró aunque el contenido tarde 180 ms en
     irse. Si el acuse llegara junto con el contenido, la pestaña se sentiría
     pegajosa. La barra no se desvanece con lo demás, por eso queda fuera del
     :not(.pestanas) de la animación. */
  const barra = previo.querySelector('.pestanas');
  if (barra) barra.querySelectorAll('[data-sec]').forEach(b =>
    b.classList.toggle('aqui', b.dataset.sec === id));
  previo.style.setProperty('--dir', dirSeccion);
  previo.classList.add('saliendo');
  setTimeout(() => { previo.classList.remove('saliendo'); arranca(); }, SALIDA);
}
/* El panel entra sin cortina cuando ya había una burbuja abierta. Reiniciar la
   animación pide quitar la clase, forzar un reflujo y volver a ponerla: si no,
   el navegador ve la misma clase de antes y no rearranca nada. */
function entradaDeSeccion(el){
  el.classList.remove('cambio');
  if (!cambiandoSeccion) return;
  el.style.setProperty('--dir', dirSeccion);
  void el.offsetWidth;
  el.classList.add('cambio');
}
function burbujaAbierta(){ return cantoAbierto || rFormato.abierto || rGlosas.abierto || rRespaldo.abierto; }
/* `cerrando` va en true cuando se llama desde el cierre, porque en ese momento
   la bandera del panel todavía no se ha apagado. */
/* EL RÓTULO DE ABAJO YA NO ES DE FORMATO. Lo era cuando lo abría, y de eso
   quedaba esta línea: abrir Formato por la pestaña seguía encendiendo el
   rótulo del pie, aunque el globo de versiones estuviera cerrado. El pie decía
   "esto está abierto" señalando algo que no lo estaba, y tocarlo —lo natural
   viendo un control encendido— abría el globo en vez de cerrar lo que parecía
   indicar. Ahora el pie lo enciende solo quien es su dueño: abrirVersiones.
   El titulillo de arriba sí conserva la suya, porque él sí sigue abriendo
   Libros. Lo encontró la revisión de Codex. */
function marcarCabeza(cerrando){
  const c = document.getElementById('pgCabeza');
  if (!c) return;
  c.classList.toggle('abierta', !cerrando && seccionViva === 'libros');
  /* EL ATRIBUTO NO DICE LO MISMO QUE LA CLASE, y por eso se calcula aparte.
     La clase enciende el rótulo solo cuando lo que se ve es Libros —es el
     aviso de "esto que abriste es lo mío"—. aria-expanded contesta otra
     pregunta: si el panel que este rótulo abre está puesto. Cambiar a la
     pestaña de Formato apaga la clase y NO cierra nada, así que un
     aria-expanded copiado de la clase diría "cerrado" con el panel delante.
     Se pone aquí porque marcarCabeza es por donde pasan las cuatro secciones
     al abrirse y al cerrarse. */
  c.setAttribute('aria-expanded', !cerrando && burbujaAbierta() ? 'true' : 'false');
}
function alternarBurbuja(seccion){
  /* Si ya está abierta pero en otra sección, no cierra: cambia. Cerrar sería
     castigar al que tocó la etiqueta equivocada; cambiar es lo que quería. */
  if (burbujaAbierta()) {
    if (seccionViva === seccion) cerrarTodosLosRollos();
    else abrirSeccion(seccion, true);
  } else abrirSeccion(seccion);
}

function rolloSimple(el){
  let abierto = false;
  return {
    get abierto(){ return abierto; },
    abrir(){
      if (abierto || folding) return;
      cerrarOtrosRollos(el);
      abierto = true;
      ponerBarra(el, seccionDe(el));
      if (el === etiquetas) pintarIndice();   /* la lista, al día con los filtros */
      el.classList.remove('plegando', 'disuelto');
      el.style.display = 'flex';
      void el.offsetWidth;
      el.classList.add('abierto');
      entradaDeSeccion(el);
      marcarCabeza();
    },
    /* Tres maneras de cerrarse, y no son intercambiables:
         seco      — cambio de pestaña, sin animación
         disolver  — elegiste algo, el panel se esfuma donde está
         normal    — te arrepentiste, el papel se vuelve a enrollar
       La diferencia entre las dos últimas es lo que comunican. Enrollarse es
       "me devuelvo"; disolverse es "ya te entendí, quítate de en medio". */
    cerrar(seco, disolver){
      if (!abierto) return;
      abierto = false;
      el.classList.remove('cambio', 'saliendo');
      if (seco || cambiandoSeccion){
        el.style.display = 'none';
        el.classList.remove('abierto', 'plegando', 'disuelto');
        return;
      }
      marcarCabeza(true);
      if (disolver) el.classList.add('disuelto');
      else { el.classList.remove('abierto'); el.classList.add('plegando'); }
      setTimeout(() => {
        if (!abierto){
          el.style.display = 'none';
          el.classList.remove('abierto', 'plegando', 'disuelto');
        }
      }, disolver ? 340 : 430);
    }
  };
}
const rFormato = rolloSimple(ajustes), rGlosas = rolloSimple(etiquetas),
      rRespaldo = rolloSimple(document.getElementById('respaldo'));

/* ============================================================
   "TE OÍ, ESTOY EN ELLO" EN EL BOTÓN QUE TOCASTE.

   Se enciende en pointerdown y NO en click, por lo de siempre: pointerdown es
   cuando apoyas el dedo y click cuando lo levantas, y el hueco que hay que
   tapar empieza en el primero. Además así queda pintado ANTES de que corra el
   manejador, que es lo que importa cuando ese manejador va a trabar el hilo:
   una clase puesta en el mismo cuadro que el trabajo no se pinta nunca.
   Se apaga en click, pero dos cuadros después: el manejador ya terminó —los
   oyentes del contenedor corren tras el del botón— y esos dos cuadros son los
   que dejan verlo encendido cuando la operación fue instantánea.
   Con un mínimo de permanencia, porque casi todas lo son y un borde que
   aparece y se va en un cuadro no es una señal, es un defecto de pintado.
   Y con una red por si algo se cierra a media faena y el click no llega.
   ============================================================ */
const MIN_OBRANDO = 320;
let obrandoEl = null, t0Obrando = 0, relojObrando = null;
function apagarObrando(yaMismo){
  clearTimeout(relojObrando); relojObrando = null;
  const el = obrandoEl; if (!el) return;
  const quitar = () => { el.classList.remove('obrando'); if (obrandoEl === el) obrandoEl = null; };
  const falta = yaMismo ? 0 : MIN_OBRANDO - (performance.now() - t0Obrando);
  if (falta <= 0){ quitar(); return; }
  relojObrando = setTimeout(quitar, falta);
}
function encenderObrando(el){
  apagarObrando(true);
  obrandoEl = el; t0Obrando = performance.now();
  el.classList.add('obrando');
  relojObrando = setTimeout(() => apagarObrando(true), 1400);
}
for (const el of [ajustes, etiquetas, document.getElementById('respaldo')]){
  el.addEventListener('pointerdown', ev => {
    const b = ev.target.closest('.btn, .chip');
    /* Los deshabilitados no acusan nada: no va a pasar nada, y encender el
       borde ahí enseñaría a desconfiar de la señal donde sí sirve. */
    if (!b || b.disabled || !el.contains(b)) return;
    encenderObrando(b);
  });
  el.addEventListener('click', ev => {
    if (!ev.target.closest('.btn, .chip')) return;
    trasPintar(() => apagarObrando());
  });
}
/* Los tres se excluyen: comparten el mismo filo y la misma superficie. */
function cerrarOtrosRollos(menos){
  if (ajustes   !== menos) rFormato.cerrar();
  if (etiquetas !== menos) rGlosas.cerrar();
  if (document.getElementById('respaldo') !== menos) rRespaldo.cerrar();
  if (canto     !== menos) cerrarCanto();
  /* Y los dos globos, que comparten la misma hoja. Se cedían en un solo
     sentido —abrir un globo cerraba los rollos, pero abrir un rollo dejaba el
     globo puesto— y dos cosas ocupando el mismo papel a la vez es la misma
     clase de defecto que el rótulo encendido de más: la pantalla dice dos
     cosas y solo una es verdad. Aquí, que es por donde pasa todo el que abre
     un rollo, se cierran los dos. Los que abren un globo llaman a esto ANTES
     de levantar su bandera, así que no se apagan a sí mismos. */
  cerrarVersiones();
  cerrarHistorial();
}
function cerrarTodosLosRollos(){ cerrarOtrosRollos(null); }

function abrirCanto(){
  if (cantoAbierto || folding) return;
  cerrarOtrosRollos(canto);
  cantoAbierto = true;
  selLibro = selCap = null;
  pintarCanto();
  ponerBarra(canto, 'libros');
  canto.classList.remove('plegando', 'disuelto');
  canto.style.display = 'flex';
  void canto.offsetWidth;                    // fuerza el arranque de la transición
  canto.classList.add('abierto');
  entradaDeSeccion(canto);
  marcarCabeza();
}
/* `disolver` se usa al elegir un libro: el panel no se devuelve al filo,
   se desvanece donde está. Volver por el filo es "me arrepentí"; disolverse
   es "ya te entendí". */
function cerrarCanto(alTerminar, disolver){
  clearTimeout(relojCanto);
  ocultarCascada();
  if (!cantoAbierto){ if (alTerminar) alTerminar(); return; }
  cantoAbierto = false;
  canto.classList.remove('cambio', 'saliendo');
  if (!cambiandoSeccion) marcarCabeza(true);
  if (cambiandoSeccion && !disolver){       /* cambio de pestaña: sin teatro */
    canto.style.display = 'none';
    canto.classList.remove('abierto', 'plegando', 'disuelto');
    if (alTerminar) alTerminar();
    return;
  }
  if (disolver) canto.classList.add('disuelto');
  else { canto.classList.remove('abierto'); canto.classList.add('plegando'); }
  setTimeout(() => {
    if (!cantoAbierto){
      canto.style.display = 'none';
      canto.classList.remove('abierto', 'disuelto', 'plegando');
    }
    if (alTerminar) alTerminar();
  }, disolver ? 340 : 360);
}

/* Aquí vivía un segundo oyente de "clic fuera" que no exceptuaba el menú
   flotante, así que elegir un libro en el menú del chip cerraba el panel
   entero. Sobraba: más abajo hay otro que hace lo mismo y sí conoce todas las
   excepciones. Dos guardias en la misma puerta, con listas distintas de quién
   puede pasar, siempre acaban así.
*/
document.addEventListener('keydown', ev => {
  /* ESCAPE TAMBIÉN CIERRA EL PANEL DE LA MARCA, y esto es lo único que hay
     que teclear para salir de él.

     El panel se cerraba solo tocando fuera, y tocar fuera es un pointerdown:
     quien no tiene puntero —teclado solo, control por conmutador— se quedaba
     dentro sin salida. Y como lo escrito se cobra en cerrarBorrador, no era
     solo incomodidad: la nota se quedaba sin guardar hasta que alguien tocara
     el papel con un dedo. Mientras estuvo el botón «Listo» el hueco no se
     notaba; al quitarlo quedó al descubierto. Lo levantó la revisión de Codex.

     CIERRA GUARDANDO, como tocar fuera, y no descartando como suele hacer un
     Escape. Aquí no hay nada que cancelar: este panel no tiene camino de
     abandono —vaciar la caja es como se borra una glosa— así que un Escape
     que tirara lo escrito inventaría un gesto destructivo que no existe en
     ningún otro sitio del programa. Salir es terminar, se salga por donde se
     salga.

     Va ANTES del guardián de «escribiendo» a propósito: el caso que importa
     es justamente el de estar tecleando dentro de la caja de la glosa. */
  if (ev.key === 'Escape'){ ocultarCascada(); cerrarTodosLosRollos(); ocultarMenu();
    /* Y lo del separador, que también son cosas de las que hay que poder
       salir sin puntero: el menú, y la pregunta si está puesta. */
    if (sepBorrando){ sepBorrando = null; pintarSepMenu(); colocarSepMenu(); }
    else cerrarSepMenu();
    cerrarPiedraMenu();
    piedraCerrarEdicion();
    if (sepOfertaAbierta){ sepOfrecido = true; cerrarOferta(); }
  }
  /* Las flechas pasan hoja. Antes había botones y ahora no, así que el teclado
     deja de ser un lujo: sin él, quien no descubra los filos se queda encerrado
     en una hoja. Se ignoran si estás escribiendo en un campo. */
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName || '');
  if (escribiendo || folding) return;
  /* Desde el teclado no hay dedo ni esquina, así que se agarra por el mismo
     sitio que un chevrón: el canto de abajo. */
  const cantoY = pg.getBoundingClientRect().bottom - 20;
  if (ev.key === 'ArrowRight'){ ev.preventDefault(); pasarHoja('right', cantoY); }
  if (ev.key === 'ArrowLeft' ){ ev.preventDefault(); pasarHoja('left',  cantoY); }
});

/* Un solo manejador para los tres niveles, ahora en cascada: el libro abre
   los capítulos a su lado, el capítulo abre los versículos al suyo, y solo
   el versículo dispara el salto. */
function tocarLibro(ev){
  const lib = ev.target.closest('.tabo'); if (!lib) return;
  const id = lib.dataset.libro;
  if (!hayLibro(id)){
    readout.textContent = nombreDe(id) + ' no está en estos datos — genéralo con el convertidor';
    return;
  }
  abrirCapitulos(id, lib.getBoundingClientRect());
}
canto.addEventListener('click', tocarLibro);

/* ============================================================
   LA LUPA DEL PANEL DE LIBROS.

   Con los renglones apretados a 26px, el dedo tapa el nombre justo cuando hay
   que leerlo. Así que el nombre sale afuera: se apoya el dedo sobre la lista,
   un globo encima dice qué libro hay debajo, y arrastrando se va cambiando
   hasta soltar sobre el que se quería. Un blanco chico con confirmación se
   atina mejor que uno grande a ciegas.

   NO captura el puntero. Capturar redirigiría el click al contenedor y mataría
   el toque simple —es exactamente lo que dejó muertos los dos rótulos de la
   hoja con ratón, y no vamos a repetirlo—. Los movimientos se escuchan en el
   documento mientras dura el gesto y se sueltan al terminar.

   Y solo actúa si el dedo SE MUEVE. Un toque limpio sigue siendo un toque
   limpio, que lo atiende tocarLibro por la vía de siempre; la lupa se mete en
   medio únicamente cuando el gesto pasó a ser un arrastre, y entonces sí se
   queda ella con el desenlace y anula el click que vendría detrás.
   ============================================================ */
(function lupaDeLibros(){
  const lupa = $('lupaLibro');
  if (!lupa) return;
  /* LA LUPA SE GANA CON UNA PAUSA, no con un movimiento.

     La primera versión la disparaba cualquier arrastre de más de 7px, y eso
     chocaba de frente con lo único que la lista también necesita: poder
     DESPLAZARSE. Cada testamento es una caja con desplazamiento propio y casi
     toda su superficie son libros, así que no quedaba por dónde agarrar para
     correrla: cualquier desliz vertical se leía como lupa, se le llamaba
     preventDefault y al soltar se abría un libro que nadie había pedido.
     Y el eje no sirve para separarlos, porque la rejilla envuelve: ir de
     Génesis a Deuteronomio es moverse hacia abajo, igual que desplazar.

     Lo que sí los separa es el TIEMPO. Un desliz para correr la lista arranca
     enseguida; un dedo que quiere mirar se posa y espera. Así que la lupa pide
     que el dedo se quede quieto 200 ms: si se mueve antes, era un
     desplazamiento y la lupa se retira sin haber estorbado.

     Una vez enganchada se apaga touch-action en la caja, que es lo único que
     de verdad impide que el navegador se ponga a desplazar a media lupa:
     preventDefault sobre pointermove ya no sirve si el desplazamiento
     arrancó, y aquí no habrá arrancado porque el dedo estuvo quieto.
     Lo encontró la revisión de Codex. */
  const ESPERA = 200;     /* ms de dedo quieto para que sea lupa */
  const RUIDO = 10;       /* px que se le perdonan al dedo mientras espera */
  let armado = false, activo = false, x0 = 0, y0 = 0;
  let ultimo = null, reloj = null, pid = null, caja = null;

  const libroEn = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.tabo') : null;
  };
  const marcar = t => {
    if (ultimo === t) return;
    if (ultimo) ultimo.classList.remove('bajoeldedo');
    ultimo = t;
    if (t) t.classList.add('bajoeldedo');
  };
  const poner = (t, x, y) => {
    marcar(t);
    if (!t){ lupa.classList.remove('viva'); return; }
    const vivo = hayLibro(t.dataset.libro);
    lupa.textContent = t.textContent + (vivo ? '' : ' — no está');
    lupa.classList.toggle('muerto', !vivo);
    const r = canto.getBoundingClientRect();
    /* El globo va sobre el dedo y pegado al canto del panel si no cabe: un
       aviso que se sale de la pantalla no avisa. */
    const mitad = lupa.offsetWidth / 2 || 60;
    const cx = Math.min(Math.max(x - r.left, mitad + 4), r.width - mitad - 4);
    lupa.style.left = Math.round(cx) + 'px';
    lupa.style.top  = Math.round(y - r.top - 12) + 'px';
    lupa.classList.add('viva');
  };
  const limpiar = () => {
    clearTimeout(reloj); reloj = null;
    armado = false; activo = false; pid = null;
    lupa.classList.remove('viva');
    if (caja){ caja.style.removeProperty('touch-action'); caja = null; }
    document.removeEventListener('pointermove', mueve, true);
    document.removeEventListener('pointerup', arriba, true);
    document.removeEventListener('pointercancel', aborta, true);
  };
  /* CANCELAR NO ES SOLTAR. Si el navegador se queda con el gesto —porque
     decidió desplazar, o porque entró otro dedo— llega un pointercancel, y eso
     NO es "he elegido este libro": es "aquí no ha pasado nada". Antes los dos
     caminos terminaban en el mismo sitio y una cancelación abría un libro al
     azar. */
  function aborta(){ marcar(null); limpiar(); }
  function arriba(){
    const t = activo ? ultimo : null;
    marcar(null);
    const eraLupa = activo;
    limpiar();
    if (!eraLupa) return;          /* fue un toque o un desliz: no es cosa nuestra */
    /* Fue lupa: el desenlace es suyo, y el click que viene detrás sobra
       —abriría los capítulos del libro donde EMPEZÓ el dedo, no del que
       elegiste—. Se traga uno solo, y en captura para llegar antes. */
    const tragar = e => { e.stopPropagation(); e.preventDefault(); };
    document.addEventListener('click', tragar, { capture:true, once:true });
    setTimeout(() => document.removeEventListener('click', tragar, true), 350);
    if (t) abrirCapitulosDe(t);
  }
  function mueve(ev){
    if (ev.pointerId !== pid) return;
    if (!activo){
      /* Todavía esperando: si el dedo se va, era para desplazar. */
      if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > RUIDO) limpiar();
      return;
    }
    ev.preventDefault();
    poner(libroEn(ev.clientX, ev.clientY), ev.clientX, ev.clientY);
  }
  function engancharse(){
    if (!armado) return;
    armado = false; activo = true;
    /* Se congela el desplazamiento de la lista mientras dura la lupa. */
    if (caja) caja.style.touchAction = 'none';
    poner(libroEn(x0, y0), x0, y0);
  }
  canto.addEventListener('pointerdown', ev => {
    const t = ev.target.closest && ev.target.closest('.tabo');
    if (!t || !ev.target.closest('.rejilla-libros')) return;
    limpiar();
    armado = true; pid = ev.pointerId;
    x0 = ev.clientX; y0 = ev.clientY;
    caja = ev.target.closest('.rejilla-libros');
    reloj = setTimeout(engancharse, ESPERA);
    document.addEventListener('pointermove', mueve, true);
    document.addEventListener('pointerup', arriba, true);
    document.addEventListener('pointercancel', aborta, true);
  });
})();
/* El mismo desenlace que un toque, para que la lupa y el click no cuenten dos
   historias distintas de lo que pasa al elegir un libro. */
function abrirCapitulosDe(lib){
  const id = lib.dataset.libro;
  if (!hayLibro(id)){
    readout.textContent = nombreDe(id) + ' no está en estos datos — genéralo con el convertidor';
    return;
  }
  abrirCapitulos(id, lib.getBoundingClientRect());
}
/* Tocar fuera cierra la burbuja. Quedan exentos los sitios que son la burbuja
   o la abren: el propio panel, las cajitas de capítulos y versículos, el menú
   flotante y las dos etiquetas de la hoja —esas ya alternan por su cuenta y si
   además cerraran aquí, se cerraría y se volvería a abrir en el mismo gesto.

   Se cierra enrollándose, no disolviéndose: tocar afuera es "me arrepentí" o
   "ya acabé", no "elegí esto". La disolución se reserva para cuando el panel
   entendió una orden. */
const FUERA_NO = '.rollo, .fly, #menu, #pgCabeza, #pgVersion';
document.addEventListener('pointerdown', ev => {
  if (!burbujaAbierta()) return;
  if (ev.target.closest(FUERA_NO)) return;
  cerrarTodosLosRollos();
}, true);

/* Un clic en cualquier otro lado cierra la cascada. Sin esto, una vez abierta
   la lista de capítulos no había manera de arrepentirse y elegir otro libro:
   los libros quedaban debajo de la cajita y el clic no les llegaba. Va en
   captura y sobre el documento para enterarse antes que nadie, y se ignora
   si el clic cae dentro de las cajitas o sobre un libro —ese ya tiene dueño. */
document.addEventListener('pointerdown', ev => {
  if (flyCaps.style.display === 'none' && flyVers.style.display === 'none') return;
  if (ev.target.closest('#flyCaps, #flyVers, .tabo')) return;
  ocultarCascada();
}, true);

flyCaps.addEventListener('click', ev => {
  const n = ev.target.closest('.num'); if (!n || !n.dataset.cap) return;
  abrirVersiculos(+n.dataset.cap, n.getBoundingClientRect());
});
flyVers.addEventListener('click', ev => {
  const n = ev.target.closest('.num');
  if (!n || !n.dataset.vers || n.classList.contains('vacio')) return;
  ocultarCascada();
  saltarA(selLibro, selCap, +n.dataset.vers);
});

/* Cuántas hojas hay, más o menos, entre dos puntos del canon. No hace falta
   exactitud —nadie va a contarlas— pero sí orden de magnitud: el bonche de un
   salto de Mateo a Apocalipsis tiene que verse distinto al de uno de veinte
   hojas, y para eso hay que saber que uno son cientos y el otro decenas. */
function hojasEntreLibros(desdeLibro, aLibro, capDestino){
  /* Hojas por capítulo, medidas sobre lo que se haya paginado hasta ahora y no
     sobre el libro entero: pedir el libro entero aquí, solo para decidir el
     grosor de un manojo de papel, costaría más que el salto que va a animar.
     Con menos de dos hojas sabidas no hay de dónde sacar una densidad y se usa
     la de un libro cualquiera. */
  const ultima = plano[Math.min(paginas[paginas.length-1], plano.length-1)];
  const capsVistos = ultima && plano.length ? Math.max(1, ultima.cap - plano[0].cap + 1) : 1;
  const porCap = paginas.length > 1 ? (paginas.length - 1) / capsVistos : 2.2;
  const i = CANON.findIndex(b => b.id === desdeLibro);
  const j = CANON.findIndex(b => b.id === aLibro);
  if (i < 0 || j < 0) return 999;
  const [a, b] = i < j ? [i, j] : [j, i];
  /* capitulosDe() lee los datos reales, así que un libro que no venga en el
     archivo cuenta cero y no infla la estimación con capítulos que no existen.
     Para los que sí están pero no se han cargado nunca, se usa un promedio. */
  let caps = 0;
  for (let k = a; k < b; k++){
    const n = capitulosDe(CANON[k].id).length;
    caps += n || 22;
  }
  return Math.max(1, Math.round(caps * porCap));
}

/* ENSEÑAR EL DISCO Y DEJARLO PINTAR ANTES DE TRABAR EL HILO.

   Poner la clase no lo pinta. El navegador dibuja al final del cuadro, así
   que si el cálculo del salto arranca en el mismo cuadro en que se pidió el
   disco, el disco no llega a existir en pantalla: se le añade la clase y se
   le quita segundos después sin que se haya visto nunca. Es el mismo error
   que la transición congelada de .ref.buscando, contado desde el otro lado.

   Dos cuadros y no uno, y esto sí es exacto: los avisos de
   requestAnimationFrame corren ANTES de que se pinte el cuadro que los
   convocó, así que trabajar dentro del primero bloquea justo la pintada que
   se estaba esperando. El segundo es el primero que corre con el disco ya en
   la pantalla. Cuesta unos 32 ms de un viaje que dura cientos, y es lo que
   compra que el aviso exista. */
const trasPintar = fn => requestAnimationFrame(() => requestAnimationFrame(fn));
/* Y un mínimo de permanencia: un salto corto dentro del mismo libro termina
   casi en el acto, y un disco que aparece y se va en un cuadro es un
   parpadeo—se lee como un fallo de pintado, no como una espera. */
const MINIMO_BUSCANDO = 320;
let t0Buscando = 0, relojBuscando = null;
/* El aviso hablado se escribe y se borra, no se enciende y se apaga: una
   región viva anuncia cuando le cambia el CONTENIDO. Escribir la frase es lo
   que dispara el anuncio; borrarla no anuncia nada, que es lo correcto —el
   final del trabajo ya lo cuenta el aviso de abajo con el nombre del pasaje—.
   Se escribe siempre, aunque la frase fuera la misma que la vez anterior,
   porque para entonces ya está vacía: cada búsqueda es un cambio de verdad. */
const dice = t => { const d = $('buscando').querySelector('.dice'); if (d) d.textContent = t; };
function mostrarBuscando(frase){
  clearTimeout(relojBuscando); relojBuscando = null;
  t0Buscando = performance.now();
  $('buscando').classList.add('viva');
  dice(frase || 'buscando el pasaje…');
}
function quitarBuscando(){
  const el = $('buscando');
  if (!el.classList.contains('viva')) return;
  clearTimeout(relojBuscando);
  const apagar = () => { el.classList.remove('viva'); dice(''); };
  const falta = MINIMO_BUSCANDO - (performance.now() - t0Buscando);
  if (falta <= 0){ apagar(); relojBuscando = null; return; }
  relojBuscando = setTimeout(apagar, falta);
}

/* ============================================================
   EL RASTRO DE ESCRITURAS.

   Se apunta en los dos sitios por donde se llega a un pasaje a propósito: el
   panel de Libros y el clic en una referencia de una glosa. NO se apunta al
   pasar hojas, y esa es la diferencia entre un rastro y un registro: pasar
   hojas es seguir leyendo, saltar es haber ido a buscar algo. Un historial
   que apunta cada hoja se llena de ruido en diez minutos y deja de servir
   para lo único que sirve, que es reencontrar aquello a lo que fuiste.

   Se guarda en el almacén del navegador porque un rastro que se borra al
   cerrar la pestaña no es un rastro; es una lista de la sesión. Y va aparte
   de los ajustes y de las marcas: si algún día se corrompe, se pierde el
   historial y no las glosas, que es lo que no se puede perder.
   ============================================================ */
const HISTORIAL = 'glossa:historial:v1';
const TOPE_HISTORIAL = 40;
let historial = [];
/* POR DÓNDE VA EL BOTÓN DE ATRÁS. Cero es «estás en la punta del rastro», y
   entonces atrás es historial[1]. Cada paso atrás sube la cuenta en vez de
   apuntar nada, que es lo que lo hace un ATRÁS y no un columpio: apuntando, el
   sitio de atrás pasaría a ser el primero y el siguiente «atrás» te devolvería
   a donde acababas de estar. Cualquier salto de verdad la devuelve a cero. */
let atrasEn = 0;
function cargarHistorial(){
  try {
    const a = JSON.parse(localStorage.getItem(HISTORIAL) || '[]');
    if (Array.isArray(a)) historial = a
      .filter(h => h && typeof h.libro === 'string' && h.cap > 0 && h.vers > 0)
      .slice(0, TOPE_HISTORIAL);
  } catch(e){ historial = []; }
}
/* DE DÓNDE SALTASTE, apuntado justo antes del destino para que quede debajo
   de él en la lista —la lista va del más nuevo al más viejo—.

   Sin esto el rastro contaba a dónde fuiste y se callaba de dónde: abrías el
   historial después de tres saltos desde tres glosas y tenías tres destinos
   sueltos, sin el hilo que los unía. Y es justo la mitad que hace falta para
   volver: «¿desde qué versículo llegué aquí?».

   No se apunta si es lo mismo que ya encabeza la lista. Pasa constantemente
   —vas a un sitio, y desde ese mismo sitio saltas a otro— y apuntarlo dejaría
   la referencia repetida dos veces seguidas sin que hubieras ido a ninguna
   parte entre medias. Que el rastro tenga vueltas es bueno; que tenga ecos,
   no. */
function apuntarDeDonde(origen){
  if (!origen || !origen.libro || !(origen.cap > 0) || !(origen.vers > 0)) return;
  const arriba = historial[0];
  if (arriba && arriba.libro === origen.libro &&
      arriba.cap === origen.cap && arriba.vers === origen.vers) return;
  apuntarVisto(origen.libro, origen.cap, origen.vers);
}
function apuntarVisto(libro, cap, vers){
  if (!libro || !(cap > 0) || !(vers > 0)) return;
  /* SE RELEE ANTES DE ESCRIBIR. Con dos pestañas abiertas, la lista que esta
     pestaña tiene en memoria puede estar vieja: si la otra apuntó algo desde
     que ésta cargó, el filtrar-y-reescribir de aquí abajo pisaría esa entrada
     sin enterarse. Releer justo antes cuesta un JSON de cuarenta renglones y
     cierra la ventana entre la lectura y la escritura casi del todo. Casi: no
     hay transacciones en este almacén, y perseguir el último resquicio pediría
     bloqueos que no valen lo que guardan. Lo encontró Codex. */
  cargarHistorial();
  /* SE APUNTA TAL CUAL, REPETIDO Y TODO. Antes, volver a un sitio donde ya
     habías estado no creaba entrada nueva: subía la vieja. La intención era
     evitar que ir y venir entre dos pasajes seis veces llenara la lista con
     dos referencias; el efecto era otro, y peor. Esto no es un índice de
     sitios visitados: es el camino que seguiste, y en un camino las vueltas
     son parte de lo que pasó. Reordenarlo dejaba una lista que decía dónde
     habías estado y mentía sobre en qué orden, que es justo lo que se viene
     a consultar —«¿por dónde llegué hasta aquí?»—.
     Que se repitan no rompe nada: cada fila lleva su referencia entera y salta
     a ella, y el tope de cuarenta sigue cortando por lo más viejo. */
  historial.unshift({ libro, cap, vers, t: Date.now() });
  /* Un sitio nuevo en el camino deja el botón de atrás al principio: desde
     aquí, «atrás» es el de justo debajo y no donde se hubiera quedado la
     cuenta de una tanda anterior de pasos atrás. */
  atrasEn = 0;
  if (historial.length > TOPE_HISTORIAL) historial.length = TOPE_HISTORIAL;
  try { localStorage.setItem(HISTORIAL, JSON.stringify(historial)); } catch(e){}
  if (histAbierto) pintarHistorial();
}

/* ============================================================
   LOS SEPARADORES DE LECTURA.

   El objeto que se deja dentro de un libro para volver. Aquí es una cinta que
   cuelga del alto de la columna de glosas, y hace lo que hace la de tela: se
   queda donde dejaste de leer, la mueves contigo mientras sigues leyendo, y
   sirve para volver.

   TRES COSAS QUE ESTE CÓDIGO NO INVENTA, porque ya estaban:
   · Dónde está una cinta se guarda como REFERENCIA —libro, capítulo,
     versículo—, igual que el rastro. Guardar el número de hoja sería guardar
     algo que cambia solo: basta subir la letra en Formato para que la hoja 12
     de ayer sea otro texto. La referencia es lo único que no se mueve.
   · Que una cinta esté en ESTA hoja se pregunta igual que el «estás aquí» del
     rastro: si su versículo cae en el tramo que reparte la hoja.
   · Se guarda en su propio cajón del almacén, aparte de las glosas y de los
     ajustes, por lo mismo que el rastro: si algún día se corrompe, se pierden
     las cintas y no las glosas.

   Y UNA QUE SÍ ES NUEVA: distinguir leer de hojear. Ver más abajo, en
   LECTURA_MINIMA.
   ============================================================ */
const SEPARADORES = 'glossa:separadores:v1';
const TOPE_SEPARADORES = 30;
/* CUÁNTO HAY QUE QUEDARSE EN UNA HOJA PARA QUE CUENTE COMO LEÍDA.

   Una hoja de este libro trae diez o quince versículos, que leídos de verdad
   son entre cuarenta segundos y minuto y medio. Veinte segundos no certifican
   que la hayas leído entera —no es lo que se busca— pero sí separan las dos
   cosas que hay que separar: hojear y leer. Nadie pasa veinte segundos en una
   hoja por la que solo iba de paso, y quien lee de verdad los pasa siempre.

   Está aquí, con nombre y solo, para poder moverlo: es el único número de
   toda esta sección que se puede querer ajustar después de usarla un rato. */
const LECTURA_MINIMA = 20000;
/* Y CUÁNDO SE ACABA UNA SESIÓN DE LECTURA. Volver veinte minutos después no
   es seguir leyendo, es volver a empezar: la cuenta de hojas leídas se pone a
   cero, la cinta activa se suelta —donde esté se queda— y la aplicación puede
   volver a ofrecer una cinta nueva. Abrir la aplicación también empieza
   sesión, que es el otro corte natural y sale gratis. */
const PAUSA_SESION = 20 * 60 * 1000;
/* Los cuatro colores de tela: oscuros y con la saturación baja, que es lo que
   pide un papel crema. Cada uno lleva su nombre escrito porque el color no
   puede ser la única manera de reconocer una cinta. */
/* ============================================================
   LAS PIEDRAS: LO QUE SE DEJA SOBRE LA HOJA Y AHÍ SE QUEDA.

   Una cinta SIGUE al lector: la mueves leyendo, marca por dónde vas, y solo
   hay una en juego. Una piedra es lo contrario y por eso es otra cosa y no un
   ajuste de la cinta: se posa donde tú la pones, no se mueve nunca más, y
   puede haber muchas. Es un recuerdo puesto sobre una hoja concreta —«aquí
   me quedé pensando»— y no un dedo metido en el libro.

   A QUÉ SE AGARRA, que es la decisión que lo sostiene todo. Las hojas se
   rehacen solas: cambiar la letra, las columnas, la orientación o la versión
   reparte el texto de otra manera y «la hoja 7» deja de contener lo que
   contenía. Así que la piedra NO guarda un número de hoja: guarda el
   VERSÍCULO sobre el que cayó —el primero de esa hoja— y su sitio como
   fracción del papel. Reaparece en la hoja que hoy contenga ese versículo, en
   el mismo punto visual. Es lo mismo que hacen las cintas con sepK, y por la
   misma razón: guardar la hoja habría sido más corto de escribir y habría
   dejado las piedras encima de un texto que no es el que marcaste, sin manera
   de saber que se descolocaron.

   Y LA POSICIÓN VA EN FRACCIONES, no en píxeles. El papel mide distinto en
   cada pantalla y con cada ajuste de márgenes; en píxeles, una piedra puesta
   en el teléfono aparecería fuera de la hoja en el escritorio. */
const PIEDRAS = 'glossa:piedras:v1';
const TOPE_PIEDRAS = 300;
/* Las tres formas, en el orden en que se van dando al tocarlas. El dibujo va
   en SVG y no en un emoji: un emoji lo dibuja el sistema, así que cambia de
   cara entre teléfonos y encima no hereda la tinta de la hoja. */
const FORMAS = ['piedra', 'avion', 'hoja'];
const FORMA_NOMBRE = { piedra:'piedra', avion:'avioncito', hoja:'hoja de árbol' };
/* Los escalones de tamaño. Discretos y no continuos: con un control de un
   dedo, cuatro tamaños que se distinguen valen más que un resbalón infinito
   donde nunca aciertas dos veces el mismo. */
const PIEDRA_TAMS = [22, 30, 40, 54];
const PIEDRA_TAM_POR = 1;              /* el de en medio tirando a chico */
let piedras = [];
let piedraEditando = null;             /* id de la que está en modo edición */
let piedraBorradas = new Set();        /* ver sepBorrados: mismo motivo */

const piedraNuevoId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const piedraDe = id => piedras.find(x => x.id === id) || null;
/* SANEAR ES OBLIGATORIO Y NO PARANOIA: esto sale de localStorage, que lo puede
   haber escrito una versión anterior, otra pestaña, o una importación a mano.
   Una forma que no existe o un tamaño fuera de la lista dejarían la piedra sin
   dibujo y sin manera de arreglarla desde la aplicación. */
function piedraEntendible(x){
  return x && typeof x === 'object' && typeof x.id === 'string' && x.id &&
         typeof x.libro === 'string' && x.libro &&
         Number.isFinite(+x.cap) && Number.isFinite(+x.vers);
}
function piedraSanear(x){
  const enRango = (v, sino) => Number.isFinite(+v) ? Math.min(Math.max(+v, 0), 1) : sino;
  return {
    id: String(x.id), libro: String(x.libro), cap: +x.cap, vers: +x.vers,
    x: enRango(x.x, .5), y: enRango(x.y, .45),
    forma: FORMAS.includes(x.forma) ? x.forma : FORMAS[0],
    tam: (Number.isInteger(+x.tam) && +x.tam >= 0 && +x.tam < PIEDRA_TAMS.length)
           ? +x.tam : PIEDRA_TAM_POR,
    creado: +x.creado || Date.now(), tocado: +x.tocado || Date.now()
  };
}
function piedrasDelAlmacen(){
  try {
    const a = JSON.parse(localStorage.getItem(PIEDRAS) || '[]');
    return Array.isArray(a) ? a.filter(piedraEntendible).map(piedraSanear) : [];
  } catch(e){ return []; }
}
function cargarPiedras(){ piedras = piedrasDelAlmacen().slice(0, TOPE_PIEDRAS); }
/* Se funde con lo que haya en el almacén, como las cintas: dos pestañas
   abiertas es un caso real y guardar a lo bruto se lleva por delante lo que
   hizo la otra. Lo que ESTA pestaña borró no vuelve. */
function piedrasGuardar(){
  for (const x of piedrasDelAlmacen()){
    if (piedraBorradas.has(x.id)) continue;
    const mia = piedras.find(y => y.id === x.id);
    if (!mia) piedras.push(x);
    else if (x.tocado > mia.tocado) Object.assign(mia, x);
  }
  piedras.sort((a, b) => b.tocado - a.tocado);
  if (piedras.length > TOPE_PIEDRAS) piedras.length = TOPE_PIEDRAS;
  try { localStorage.setItem(PIEDRAS, JSON.stringify(piedras)); } catch(e){}
}
/* EN QUÉ RENGLÓN DEL LIBRO CAE, para saber si es de esta hoja. Igual que sepK,
   y con el mismo respaldo por capítulo: una piedra de otra versión puede
   apuntar a un versículo que aquí no existe, y perderla por eso sería no poder
   ni verla ni quitarla. */
function piedraK(x){
  if (x.libro !== LIBRO) return -1;
  const k = plano.findIndex(pp => pp.cap === x.cap && pp.vers === x.vers);
  return k >= 0 ? k : plano.findIndex(pp => pp.cap === x.cap);
}
const piedraAqui = x => {
  const k = piedraK(x);
  return k >= 0 && k >= (paginas[paginaActual] || 0) && k < finDe(paginaActual);
};
const piedrasDeLaHoja = () => piedras.filter(piedraAqui);
/* EL VERSÍCULO AL QUE SE ANCLA UNA PIEDRA NUEVA: el primero de esta hoja. Es
   el único que no se mueve dentro de la hoja pase lo que pase con el reparto
   —el último sí se mueve, porque de él depende cuántos quepan— así que es el
   que mejor devuelve la piedra a donde estaba. */
function piedraAncla(){
  const k = paginas[paginaActual] || 0;
  const it = plano[k];
  if (!it) return null;
  return { libro: LIBRO, cap: it.cap, vers: it.vers };
}
const piedraRef = x => nombreDe(x.libro) + ' ' + x.cap + ':' + x.vers;
const piedraTexto = x => piedraRef(x) + (piedraAqui(x) ? ' · aquí' : '');

/* LOS TRES DIBUJOS. Trazados a mano en un lienzo de 24x24, con currentColor
   para que hereden la tinta de la hoja: el papel cambia de tono entre el día y
   la noche, y un color escrito a pelo se quedaría clavado en uno de los dos.
   La piedra va rellena y las otras dos combinan relleno y trazo, que es lo que
   las distingue de un vistazo a 22 px, que es el tamaño más chico. */
const PIEDRA_SVG = {
  /* LAS TRES LLENAN LA CAJA POR IGUAL, y hubo que rehacerlas por eso: la
     primera piedra ocupaba de 4 a 19 en un lienzo de 24, así que al mismo
     tamaño se veía la mitad de grande que el avión, que sí llegaba a los
     bordes. Puestas una al lado de otra parecían dos tamaños distintos
     cuando eran el mismo número. */
  piedra:
    '<path d="M3.1 14.2c-.7-3.1 1-6.3 3.9-8.1 3-1.9 7-2.1 9.9-.4 3 1.7 4.6 5.3 3.9 8.4' +
    '-.7 3.2-3.7 5.8-7.2 6.3-3.6.6-7.8-.9-9.5-3.6a6.9 6.9 0 0 1-1-2.6z" fill="currentColor"/>' +
    '<path d="M6.6 11.1c1.3-1.7 3.3-2.8 5.4-3" fill="none" stroke="#fff" stroke-opacity=".38"' +
    ' stroke-width="1.6" stroke-linecap="round"/>' +
    '<circle cx="15.6" cy="15.4" r="1.5" fill="#fff" fill-opacity=".16"/>',
  avion:
    '<path d="M22.4 1.9 1.4 10.8c-.6.3-.6 1.1 0 1.3l6.6 2.4 2.4 6.6c.2.6 1 .6 1.3 0L22.4 1.9z"' +
    ' fill="currentColor"/>' +
    '<path d="M22.4 1.9 8 14.5" fill="none" stroke="#fff" stroke-opacity=".45"' +
    ' stroke-width="1.5" stroke-linecap="round"/>',
  /* LA HOJA CON SU NERVIO Y SU RABILLO. Sin ellos, el contorno solo era una
     gota y se confundía con la piedra a tamaño chico: lo que dice «hoja» no
     es la silueta, es la raya de en medio. */
  hoja:
    '<path d="M21.4 2.3c1 7.2-1.3 12.3-5.2 15.1-3.7 2.7-8.4 2.5-10.8.2C3.1 15.4 3 11.2 5.6 8' +
    ' 8.3 4.6 13.5 2 21.4 2.3z" fill="currentColor"/>' +
    '<path d="M19.9 3.9C14.4 7.3 9.2 12.6 5.4 21.6" fill="none" stroke="#fff"' +
    ' stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M13.9 7.4c.6 1.6.8 3.2.7 4.9M17.4 11.1c-1.8.4-3.4 1.2-4.8 2.3" fill="none"' +
    ' stroke="#fff" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>'
};
const piedraDibujo = f =>
  '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PIEDRA_SVG[f] || PIEDRA_SVG.piedra) + '</svg>';

const TELAS = [['carmin', 'carmín', '#9b2a2a', '#7a1f1f'],
               ['oliva',  'oliva',  '#4d6a35', '#3a5127'],
               ['indigo', 'índigo', '#2f4a78', '#22375a'],
               ['ocre',   'ocre',   '#a4761d', '#845c12']];
const telaDe = c => TELAS.find(t => t[0] === c) || TELAS[0];

let separadores = [];
/* CUÁL ES LA CINTA ACTIVA vive en memoria y no en el almacén, y no es un
   olvido: activa quiere decir «la que va siguiendo ESTA lectura», y una
   lectura no sobrevive a cerrar la aplicación. Lo que sí sobrevive es dónde
   se quedó, que es lo que se guarda. Al abrir de nuevo no hay ninguna activa
   hasta que pongas una o vuelvas a una desde la lista. */
let sepActivo = null;
/* El estado de la lectura: dónde estamos, desde cuándo, cuántas hojas
   seguidas se han leído de verdad y si ya se preguntó en esta sesión. */
let sepHojaAnterior = null, sepLlegadaEn = 0, sepLeidasSeguidas = 0,
    sepOfrecido = false, sepCayendo = null, sepMenuAbierto = null,
    sepOfertaAbierta = false, sepRelojOferta = null, sepBorrando = null,
    /* sepMenuAncla: de qué se cuelga el menú cuando NO lo abrió una cinta.
       sepEditando: la fila cuyo nombre se está escribiendo, o null. */
    sepMenuAncla = null, sepEditando = null;

/* Cada campo se comprueba antes de aceptarlo: un almacén de otra versión, a
   medio escribir o manoseado a mano no debe dejar cintas imposibles. Lo que
   no se entiende se tira; lo que se entiende a medias se completa. */
const sepEntendible = x => x && typeof x.id === 'string' && x.id &&
                           typeof x.libro === 'string' && x.libro && x.cap > 0 && x.vers > 0;
/* El nombre es de una mano, así que se limpia como todo lo que escribe una
   mano: los espacios de sobra se juntan, los de los bordes se van, y 70
   caracteres es el tope —más no cabe en la fila y una fila que no se lee no
   sirve de nada—. Un almacén viejo no lo trae, y eso es válido: la cinta sin
   nombre es la de siempre. */
const sepNombreLimpio = x => String(x || '').replace(/\s+/g, ' ').trim().slice(0, 70);
function sepSanear(x){
  const nombre = sepNombreLimpio(x.nombre);
  const out = { id: x.id, libro: x.libro, cap: +x.cap, vers: +x.vers,
           color: telaDe(x.color)[0],
           creado: +x.creado > 0 ? +x.creado : Date.now(),
           tocado: +x.tocado > 0 ? +x.tocado : (+x.creado > 0 ? +x.creado : Date.now()) };
  /* Sin nombre NO se guarda la clave: así el almacén de quien no nombra
     ninguna cinta queda exactamente como estaba. */
  if (nombre) out.nombre = nombre;
  return out;
}
function sepDelAlmacen(){
  try {
    const a = JSON.parse(localStorage.getItem(SEPARADORES) || '[]');
    return Array.isArray(a) ? a.filter(sepEntendible).map(sepSanear) : [];
  } catch(e){ return []; }
}
function cargarSeparadores(){
  separadores = sepDelAlmacen().slice(0, TOPE_SEPARADORES);
}
/* LO QUE ESTA PESTAÑA QUITÓ, para no resucitarlo al fundir. Sin esta lista,
   una cinta borrada aquí volvería con la primera fusión: en el almacén sigue
   estando, y no habría manera de distinguir «la puso la otra pestaña» de «la
   quité yo». Vive en memoria porque solo hace falta mientras esta pestaña
   sigue abierta; en la siguiente, el almacén ya no la trae. */
const sepBorrados = new Set();
/* SE RELEE Y SE FUNDE ANTES DE ESCRIBIR, igual que el rastro y por lo mismo.

   Con dos pestañas abiertas, la lista que ésta tiene en memoria es la de
   cuando cargó: si la otra puso una cinta desde entonces, escribir a pelo se
   la llevaba por delante sin enterarse —y con ella, cambios de color, mudanzas
   y borrados—. Fundir cuesta un JSON de treinta renglones.

   La regla de quién gana es por cinta y por fecha: la que se tocó más tarde.
   Y no hay transacciones en este almacén, así que la ventana entre leer y
   escribir no se cierra del todo; perseguir el último resquicio pediría
   bloqueos que no valen lo que guardan. Lo levantó la revisión de Codex. */
function sepGuardar(reciente){
  for (const x of sepDelAlmacen()){
    if (sepBorrados.has(x.id)) continue;
    const mio = separadores.find(y => y.id === x.id);
    if (!mio) separadores.push(x);
    else if (x.tocado > mio.tocado) Object.assign(mio, x);
  }
  /* LO QUE SE ACABA DE DECIDIR GANA SOBRE LO QUE SE FUNDE, y hace falta decirlo
     aparte porque la regla de arriba es por FECHA y nombrar no toca la fecha:
     ponerle nombre a una cinta no es volver a leerla, así que `tocado` se
     queda como estaba —si no, la lista se reordenaría al nombrar—. El precio
     es que si otra pestaña movió o recoloreó esa misma cinta después, su
     registro es más nuevo y el Object.assign de arriba se llevaría por delante
     el nombre recién escrito: la lista se repintaría sin él mientras el aviso
     dice «separador nombrado». Se vuelve a poner después de fundir, que es lo
     que dice la regla de verdad —gana lo último que decidió una persona— sin
     tocar el orden. Lo levantó la revisión de Codex. */
  if (reciente){
    const mio = separadores.find(y => y.id === reciente.id);
    if (mio){
      if (reciente.nombre) mio.nombre = reciente.nombre;
      else delete mio.nombre;
    }
  }
  separadores.sort((a, b) => b.tocado - a.tocado);
  if (separadores.length > TOPE_SEPARADORES) separadores.length = TOPE_SEPARADORES;
  try { localStorage.setItem(SEPARADORES, JSON.stringify(separadores)); } catch(e){}
}
/* El identificador no puede salir del sitio que ocupa en la lista: la lista
   se reordena al tocar una cinta y se acorta al borrar otra. */
function sepNuevoId(){
  return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
const sepDe = id => separadores.find(x => x.id === id) || null;
/* CON NOMBRE, LA REFERENCIA SE ENCOGE. «Mateo 1:1» pasa a «Mt 1:1», porque
   cuando una cinta se llama «lo de la genealogía» lo que se busca es el
   nombre y el sitio exacto se lee después. Sin nombre no hay nada que ceder,
   así que la referencia va entera. */
const sepRef = (x, corta) => (corta ? abrevDe(x.libro) : nombreDe(x.libro)) + ' ' + x.cap + ':' + x.vers;
function sepTexto(x){
  const ref = sepRef(x, !!x.nombre);
  return ref + (x.nombre ? ' · ' + x.nombre : '') + (sepAqui(x) ? ' · aquí' : '');
}

/* ¿QUÉ CINTA TOCA PINTAR EN ESTA HOJA? La misma pregunta que el «estás aquí»
   del rastro. Si hay más de una —se puede: son referencias distintas de la
   misma hoja— se enseña la más reciente, y la activa gana siempre: es la que
   se está moviendo contigo. Las demás siguen en la lista del menú, que es
   donde se ven todas. */
/* DÓNDE CAE UNA CINTA EN EL LIBRO DE AHORA, con una red.

   El versículo exacto puede no existir: cambiar de versión en Formato cambia
   la numeración, y hay versiones a las que les faltan versículos enteros. Una
   cinta cuyo versículo ya no está no puede volverse invisible para siempre
   —no habría manera de llegar a ella ni de quitarla—, así que se conforma con
   su capítulo, que es donde la dejaste con un renglón de diferencia. */
function sepK(x){
  if (x.libro !== LIBRO) return -1;
  const k = plano.findIndex(pp => pp.cap === x.cap && pp.vers === x.vers);
  return k >= 0 ? k : plano.findIndex(pp => pp.cap === x.cap);
}
/* Y A DÓNDE SE VIAJA, que no es lo mismo. sepK solo sabe del libro que está
   cargado —es el único que tiene plano— así que para una cinta de otro libro
   devolvía -1 siempre y el respaldo por capítulo no llegaba a calcularse: irA
   recibía el versículo que ya no existe, lo rechazaba por fuera de rango, y la
   cinta se quedaba sin manera de alcanzarse. Fuera de casa se le pregunta al
   texto, que sí está cargado entero. Lo levantó la revisión de Codex. */
function sepDestino(x){
  if (x.libro === LIBRO){
    const k = sepK(x), r = k >= 0 ? plano[k] : null;
    return r ? { cap: r.cap, vers: r.vers } : { cap: x.cap, vers: x.vers };
  }
  if (versoTexto(version, x.cap, x.vers, x.libro)) return { cap: x.cap, vers: x.vers };
  if (versoTexto(version, x.cap, 1, x.libro)) return { cap: x.cap, vers: 1 };
  return { cap: x.cap, vers: x.vers };
}
const sepAqui = x => {
  const k = sepK(x);
  return k >= 0 && k >= (paginas[paginaActual] || 0) && k < finDe(paginaActual);
};
function sepEnPagina(n){
  if (!separadores.length) return null;
  const desde = paginas[n] || 0, hasta = finDe(n);
  const aqui = separadores.filter(x => {
    const k = sepK(x);
    return k >= 0 && k >= desde && k < hasta;
  });
  if (!aqui.length) return null;
  return aqui.find(x => x.id === sepActivo) ||
         aqui.slice().sort((a, b) => b.tocado - a.tocado)[0];
}
function sepDeLaHoja(){
  return sepEnPagina(paginaActual);
}
/* CUÁNTO HAY QUE SUBIRLA para que su filo sea el filo del papel, cuánto
   tiene que medir de ancho, y DÓNDE cae a lo ancho.

   Se miden y no se suponen, porque cambian con los ajustes: el relleno de la
   hoja lo mueve el ajuste de márgenes y el ancho de la columna depende de la
   pantalla. Se usan offsetTop / offsetLeft / offsetWidth a propósito, que son
   de acomodo y no de pintura: con la vista de lejos puesta, .pg-inner lleva una
   escala encima y un getBoundingClientRect devolvería los números encogidos.

   El ancho es una proporción de la COLUMNA aunque la percha cuelgue de
   .pg-inner: es la columna la que le da su sitio, y un porcentaje de CSS
   mediría ahora contra la hoja entera. El doble de lo que era —36 %, entre
   32 y 64 px— y el alto sale del aspect-ratio. Sin columna —las glosas
   puestas debajo o al pie— se conforma con el mínimo.

   La percha se clava en el borde IZQUIERDO de la columna menos 19 px, para
   que se vea un buen trozo desde el texto sin tener que abrir las glosas. */
const CINTA_ASOMO = 19;
function sepMedidas(){
  const inner = pg.querySelector('.pg-inner');
  const col = pgMargin.offsetWidth;
  let izq = 0;
  if (inner && pgMargin){
    let n = pgMargin, x = 0;
    while (n && n !== inner){
      x += n.offsetLeft;
      n = n.offsetParent;
    }
    izq = x - CINTA_ASOMO;
  }
  return { arriba: -(inner ? inner.offsetTop : 0),
           ancho: Math.round(Math.min(64, Math.max(32, (col || 90) * 0.36))),
           izq };
}
/* La cinta ACTIVA no se desmonta al pasar hoja: vive en .pg-inner, que
   sobrevive al pliegue. Remontarla (ocultar → esperar → entrar) era lo que
   la hacía desaparecer y a veces no volver. Solo se anima al PONERLA, al
   quitarla, o al llegar a una cinta que ya estaba en esa hoja. */
let sepRetiroGen = 0;
function sepSinMovimiento(){
  return window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function aplicarMedidasSeparador(percha){
  const m = sepMedidas();
  percha.style.setProperty('--cinta-arriba', m.arriba + 'px');
  percha.style.setProperty('--cinta-ancho', m.ancho + 'px');
  percha.style.setProperty('--cinta-izq', m.izq + 'px');
}
function actualizarSeparador(percha, s){
  const t = telaDe(s.color);
  const btn = percha.querySelector('.separador');
  if (btn){
    btn.style.setProperty('--tela', t[2]);
    btn.style.setProperty('--tela-osc', t[3]);
    btn.dataset.sep = s.id;
    btn.setAttribute('aria-expanded', sepMenuAbierto === s.id ? 'true' : 'false');
    btn.classList.toggle('abierta', sepMenuAbierto === s.id);
  }
  const x = percha.querySelector('.sep-x');
  if (x){
    const abierta = sepMenuAbierto === s.id;
    x.classList.toggle('viva', abierta);
    x.classList.toggle('puesta', abierta);
  }
  aplicarMedidasSeparador(percha);
}
function sepPaginaTapada(){
  return folding || (pg && pg.classList.contains('hidden'));
}
/* Al empezar el pliegue la cinta se va suave —el lector aún ve la hoja vieja
   un instante—. El nodo se queda, para no remontarla a ciegas. */
function sepAlPlegar(){
  const btn = document.querySelector('#sepPercha .separador');
  if (!btn) return;
  btn.classList.remove('entrando', 'cayendo');
  if (sepSinMovimiento()){ btn.classList.add('sep-espera'); return; }
  if (btn.classList.contains('sep-espera') || btn.classList.contains('saliendo')) return;
  void btn.offsetWidth;
  btn.classList.add('saliendo');
}
/* Al descubrir la hoja: si venimos de PASAR página (sepQuiereEntrar), la
   cinta entra suave; si venimos de un SALTO del menú, se enseña al momento
   —reanimar ahí hacía un flash porque la foto del pliegue ya la traía. */
function sepTrasPliegue(){
  const suave = sepQuiereEntrar;
  sepQuiereEntrar = false;
  if (sepPaginaTapada()){
    if (suave) sepQuiereEntrar = true;
    clearTimeout(sepRelojTras);
    sepRelojTras = setTimeout(() => {
      sepRelojTras = null;
      if (!sepPaginaTapada()) sepTrasPliegue();
    }, 60);
    return;
  }
  const puesta = document.getElementById('sepPercha');
  const s = sepDeLaHoja();
  if (!s){
    if (puesta){ sepRetiroGen++; puesta.remove(); }
    return;
  }
  const idPuesta = puesta && puesta.querySelector('[data-sep]')
    ? puesta.querySelector('[data-sep]').dataset.sep : null;
  if (puesta && idPuesta === s.id){
    actualizarSeparador(puesta, s);
    const btn = puesta.querySelector('.separador');
    if (!btn || btn.classList.contains('cayendo')) return;
    const oculta = btn.classList.contains('sep-espera') ||
                   btn.classList.contains('saliendo');
    btn.classList.remove('saliendo', 'sep-espera');
    if (suave && oculta && !sepSinMovimiento()){
      void btn.offsetWidth;
      btn.classList.add('entrando');
    } else {
      btn.classList.remove('entrando');
    }
    return;
  }
  montarSeparador(s, suave ? 'entra' : null);
}
let sepRelojTras = null;
function retirarSeparador(el){
  if (!el) return;
  const gen = ++sepRetiroGen;
  const btn = el.querySelector('.separador');
  const fin = () => {
    if (gen !== sepRetiroGen) return;
    if (el.parentNode) el.remove();
  };
  if (!btn || sepSinMovimiento() || btn.classList.contains('sep-espera')){
    fin();
    return;
  }
  if (btn.classList.contains('saliendo')){
    btn.addEventListener('animationend', fin, { once:true });
    setTimeout(fin, 400);
    return;
  }
  btn.classList.remove('entrando', 'cayendo', 'sep-espera', 'abierta');
  void btn.offsetWidth;
  btn.classList.add('saliendo');
  btn.addEventListener('animationend', fin, { once:true });
  setTimeout(fin, 400);
}
function montarSeparador(s, modo){
  sepRetiroGen++;                    /* un retiro pendiente no puede borrar ésta */
  const vieja = document.getElementById('sepPercha');
  if (vieja) vieja.remove();
  const t = telaDe(s.color);
  const percha = document.createElement('div');
  percha.className = 'sep-percha';
  percha.id = 'sepPercha';
  const cae = (modo === 'cae' || sepCayendo === s.id) ? ' cayendo' : '';
  const entra = (!cae && modo === 'entra' && !sepSinMovimiento()) ? ' entrando' : '';
  sepCayendo = null;
  const abierta = sepMenuAbierto === s.id;
  percha.innerHTML =
    '<button type="button" class="sep-hit" data-sep="' + esc(s.id) + '"' +
      ' tabindex="-1" aria-hidden="true" title="Abrir separador"></button>' +
    '<button class="separador' + cae + entra + (abierta ? ' abierta' : '') + '"' +
      ' style="--tela:' + t[2] + ';--tela-osc:' + t[3] + '"' +
      ' data-sep="' + esc(s.id) + '" aria-haspopup="dialog"' +
      ' aria-expanded="' + (abierta ? 'true' : 'false') + '"' +
      ' aria-label="Separador ' + t[1] + ' en ' + esc(abrevDe(s.libro)) + ' ' +
        s.cap + ':' + s.vers + '. Abre sus opciones."></button>' +
    '<button class="sep-x' + (abierta ? ' viva puesta' : '') + '" data-sep-x="1"' +
      ' aria-label="Quitar este separador" title="Quitar este separador">' +
      '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 L9 9 M9 1 L1 9"' +
      ' stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
  aplicarMedidasSeparador(percha);
  (pg.querySelector('.pg-inner') || pgMargin).appendChild(percha);
}
let sepQuiereSalirSuave = false;
let sepQuiereEntrar = false;
function pintarSeparador(){
  const puesta = document.getElementById('sepPercha');
  const s = sepDeLaHoja();
  const idPuesta = puesta && puesta.querySelector('[data-sep]')
    ? puesta.querySelector('[data-sep]').dataset.sep : null;
  const tapada = sepPaginaTapada();
  if (!s){
    if (puesta){
      /* Hoja tapada por el pliegue: se quita ya, nadie la ve.
         Hoja a la vista: sale suave (borrar, o una cinta que no sigue). */
      if (tapada && !sepQuiereSalirSuave){ sepRetiroGen++; puesta.remove(); }
      else retirarSeparador(puesta);
    }
    sepQuiereSalirSuave = false;
    return;
  }
  sepQuiereSalirSuave = false;
  if (puesta && idPuesta === s.id){
    if (sepCayendo === s.id){ sepCayendo = null; montarSeparador(s, 'cae'); return; }
    actualizarSeparador(puesta, s);
    if (tapada){
      const btn = puesta.querySelector('.separador');
      if (btn){ btn.classList.remove('entrando'); btn.classList.add('sep-espera'); }
    }
    return;
  }
  /* Solo "cae" al ponerla a mano. Al llegar por salto o pliegue no se usa
     "entra": reanimar provocaba un parpadeo (ya se veía en la foto). */
  const modo = sepCayendo === s.id ? 'cae' : null;
  montarSeparador(s, modo);
  if (tapada && modo !== 'cae'){
    const btn = document.querySelector('#sepPercha .separador');
    if (btn) btn.classList.add('sep-espera');
  }
}

/* ---------- poner, mover y quitar ---------- */
function crearSeparador(){
  const p = puntoActual();
  const s = { id: sepNuevoId(), libro: p.libro, cap: p.ref.cap, vers: p.ref.vers,
              /* El color va rotando: dos cintas seguidas del mismo tono se
                 confunden en la lista, y elegir uno al azar podía repetirlo. */
              color: TELAS[separadores.length % TELAS.length][0],
              creado: Date.now(), tocado: Date.now() };
  separadores.unshift(s);
  if (separadores.length > TOPE_SEPARADORES) separadores.length = TOPE_SEPARADORES;
  sepActivo = s.id;
  sepOfrecido = true;              /* ya hay cinta en esta lectura: no se pregunta más */
  sepCayendo = s.id;
  sepGuardar();
  pintarSeparador();
  return s;
}
/* La cinta activa sigue al lector hoja a hoja —hacia adelante y hacia
   atrás—, y solo ella: las demás se quedan donde las dejaron. Mover es
   mover la referencia, no crear otra. */
function avanzarSeparador(){
  const s = sepDe(sepActivo);
  if (!s) return;
  const p = puntoActual();
  if (s.libro === p.libro && s.cap === p.ref.cap && s.vers === p.ref.vers) return;
  s.libro = p.libro; s.cap = p.ref.cap; s.vers = p.ref.vers; s.tocado = Date.now();
  sepGuardar();
}
function borrarSeparador(id){
  const i = separadores.findIndex(x => x.id === id);
  if (i < 0) return;
  separadores.splice(i, 1);
  sepBorrados.add(id);                    /* para que la fusión no lo resucite */
  if (sepActivo === id) sepActivo = null;
  sepGuardar();
  cerrarSepMenu();
  sepQuiereSalirSuave = true;
  pintarSeparador();
}

/* ---------- ¿está leyendo, o solo pasando hojas? ----------

   La máquina es corta y son tres reglas:

   · Cada llegada a una hoja distinta cierra la medición de la anterior. Si el
     lector se quedó ahí LECTURA_MINIMA y el movimiento fue el de leer —la
     hoja de al lado hacia adelante, o el principio del libro siguiente— esa
     hoja cuenta como leída y la cuenta sube.
   · Cualquier otra cosa la pone a cero: un salto desde el índice o desde una
     glosa, un paso atrás, un vistazo de tres segundos. Eso no es leer, y la
     cuenta no debe sobrevivirlo.
   · Con dos hojas leídas seguidas, al llegar a la tercera se ofrece la cinta.

   Hay UNA sola medición y vive en dos números —dónde y desde cuándo—, así que
   no hay temporizadores sueltos que se puedan encimar ni que haga falta
   cancelar. Todo se resuelve en la llegada. */
/* UN SALTO NO ES PASAR LA HOJA, aunque caiga en la de al lado.

   La cuenta de abajo mira números de hoja, y con eso solo no se distingue
   «pasé la hoja» de «salté aquí»: saltar al principio de cualquier libro cae
   en la hoja 0, que es exactamente lo que hace cruzar leyendo, y un salto
   dentro del mismo libro puede caer en la de al lado. En los dos casos la
   cinta activa se mudaba sola a un sitio al que el lector no llegó leyendo,
   que es justo lo que no puede pasar: es su marca, y se le movió sin pedirlo.

   Así que el modo de viajar viaja con el viaje. Lo encienden los dos sitios
   por los que se salta —saltarA y el salto corto de irA— y lo apaga la
   llegada, que es quien lo lee. Cruzar de libro leyendo no lo enciende, y por
   eso sigue contando como lo que es: la hoja siguiente.
   Lo levantó la revisión de Codex. */
let sepSalto = false;
function sepTerminarSesion(){
  sepLeidasSeguidas = 0;
  sepOfrecido = false;
  sepActivo = null;
}
function sepLlegada(){
  const ahora = Date.now();
  const sitio = { libro: LIBRO, n: paginaActual };
  const permanencia = sepLlegadaEn ? ahora - sepLlegadaEn : 0;
  const ant = sepHojaAnterior;
  const salto = sepSalto; sepSalto = false;
  /* Adelante: hoja siguiente del mismo libro, o primera hoja del libro
     siguiente al cruzar leyendo. Atrás: hoja anterior del mismo libro.
     En los dos casos la cinta ACTIVA sigue al lector; un salto (índice,
     glosa, paso atrás del rastro) no. */
  const adelante = !salto && !!ant &&
                  ((sitio.libro === ant.libro && sitio.n === ant.n + 1) ||
                   (sitio.libro !== ant.libro && sitio.n === 0));
  const atras = !salto && !!ant &&
