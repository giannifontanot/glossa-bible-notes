function pintarPalabras(g, palabras){
  g.textBaseline = 'alphabetic';
  let ultimo = null, subida = 0;
  for (const p of palabras){
    const clave = p.f + '|' + p.e + '|' + (p.vc || 'normal');
    if (clave !== ultimo){
      g.font = p.f;
      /* LA RED DEBAJO DE LA ABREVIATURA. Una asignación que el lienzo no
         entiende no lanza error: se ignora en silencio y ctx.font se queda
         con la letra ANTERIOR. Comprobado. Así que si algún motor rechazara
         la variante en la abreviatura, no perderíamos las versalitas de un
         titulillo: perderíamos la letra de TODAS las palabras que vinieran
         después, que sale infinitamente peor. Se comprueba que el tamaño
         pedido esté en lo que quedó puesto, y si no, se repite sin variante.
         Cuesta una comparación de cadenas por cambio de letra, no por
         palabra. */
      if (p.f !== p.f0 && g.font.indexOf(p.px) < 0) g.font = p.f0;
      if ('letterSpacing' in g) g.letterSpacing = p.e;
      /* La propiedad, encima de la abreviatura, para los motores que la
         tienen: es la única que sabe decir all-small-caps, y va DESPUÉS
         porque asignar font puede reponerla a normal. Se repone a 'normal'
         cuando toca, porque el estado del lienzo es pegajoso: si no, la
         primera palabra en versalitas dejaría en versalitas todo el resto. */
      if ('fontVariantCaps' in g) g.fontVariantCaps = p.vc || 'normal';
      ultimo = clave;
      const m = g.measureText('Hxg');
      subida = m.fontBoundingBoxAscent || m.actualBoundingBoxAscent || p.h * 0.8;
    }
    g.fillStyle = p.c;
    /* si la palabra vive en una glosa torcida, se gira el lienzo igual que
       la caja: mismo ángulo y mismo centro que en la hoja viva */
    if (p.a){ g.save(); g.translate(p.gx, p.gy); g.rotate(p.a); g.translate(-p.gx, -p.gy); }
    /* El motor de texto del lienzo compone las letras dentro de la palabra
       con mínimas diferencias respecto al del navegador —uno o dos píxeles.
       En vez de confiar en él, se le obliga a ocupar el ancho EXACTO que la
       palabra tiene en la página. */
    const anchoLienzo = g.measureText(p.t).width;
    if (p.w > 0.5 && Math.abs(anchoLienzo - p.w) > 0.25 && anchoLienzo > 0.5){
      g.save();
      g.translate(p.x, 0);
      g.scale(p.w / anchoLienzo, 1);
      g.fillText(p.t, 0, p.y + subida);
      g.restore();
    } else {
      g.fillText(p.t, p.x, p.y + subida);
    }
    if (p.a) g.restore();
  }
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  if ('fontVariantCaps' in g) g.fontVariantCaps = 'normal';
}

function buildSVG(bodyHTML, marginHTML, footHTML, mw, gap, w, h, cabeza){

     que viven en la hoja de estilos de la aplicación. Sin esto, la foto se
     compone con el acomodo de escritorio y sale otra hoja. */

     Estaba escrito 15px en los dos lados, y cuando se corrigió el de la hoja
     de estilos este se habría quedado atrás —que es exactamente el brinco que
     describe el párrafo de arriba, pero al revés. Un número que tiene que

         arriba, pero de color. */

        '<div class="pg-version"'+estVer+'>'+esc(D.versiones[version].abrev || version)+'</div>'+
        '<div class="pg-cabeza"'+estCab+'>'+esc(cabeza||'')+'</div><div class="pg-cols"'+estCols+'>'+

function fotoDeHojaCrudo(p, asignar){

     mide igual que en fotoDeHoja, y las marcas y las palabras se miden contra

  const med = medirHojaTelefono();

let W=0, H=0, anchor=null, F=null, side='right', bajoImg=null;
/* Cada hoja del bonche tiene SU punto de agarre y SU diagonal. Si todas
   doblan desde el mismo punto se ven como una máquina; el papel nunca se
   agarra dos veces igual. */
let hojasExtra = [], progreso = 0, alfaTop = 1;
const rnd = (a,b) => a + Math.random()*(b-a);
/* Arranca despacio, agarra vuelo y se posa. La curva de antes salía
   disparada desde el primer cuadro y por eso se sentía violenta. */
const suave = k => (k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2);

/* EL GROSOR DEL BONCHE. Antes eran cinco rangos, y el defecto se veía: pasar
   4 hojas o pasar 8 daba el mismo puño de 3. La cuenta ahora es real —el
   bonche trae EXACTAMENTE las hojas que estás pasando— pero solo hasta seis.

   Por qué no exacto siempre: de Génesis a Apocalipsis hay del orden de 900
   hojas, y dibujar 900 en cada cuadro no termina nunca. Y aunque terminara,
   no serviría de nada: el ojo cuenta bien hasta cinco o seis objetos de un
   vistazo —eso es la subitización— y de ahí en adelante solo percibe "muchos".
   Un bonche de 40 y uno de 900 se ven igual.

   Así que la cuenta es exacta justo en el tramo donde se puede percibir, y de
   ahí crece en logaritmo hasta toparse en trece. Cada vez que la distancia se
   duplica, el puño engorda unas tres hojas. */

  const s = Math.max(1, salto);
  const hojas = s <= EXACTO ? s
              : Math.min(TOPE_HOJAS, Math.round(EXACTO + Math.log2(s / EXACTO) * 4.6));
  /* La duración crece con el logaritmo de la distancia. Y crece harto: un
     viaje de Mateo a Apocalipsis son cientos de hojas, y si se despacha en el
     mismo segundo que un salto de diez, el gesto miente sobre la distancia.
     Lo que hace que se lean como MUCHAS no es solo cuántas se dibujan sino
     cuánto rato siguen saliendo: un chorro largo pesa más que un manotazo. */
  const base = Math.min(2150, 520 + 260 * Math.log2(1 + s));

function sizeCanvas(){

     donde viven las glosas— se quedaría fuera de la foto.

     que el encuadre: el pliegue nace en el borde derecho del papel, y ese borde

     glosa escondida, la hoja se levanta desde fuera de cuadro y entra
     barriendo, que es lo que haría el papel de verdad. Midiendo la ventana, la
     hoja se doblaría desde el aire. */
  const med = medirHojaTelefono();

    const sC=sideOf(cur,M,ex,ey),sN=sideOf(nxt,M,ex,ey);
    const iC=keep?sC>=-1e-6:sC<=1e-6, iN=keep?sN>=-1e-6:sN<=1e-6;

    const sh = ctx.createLinearGradient(fold.M.x,fold.M.y,anchor.x,anchor.y);

    ctx.fillStyle=sh; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  pintarBonche();
  ctx.save(); pathFrom(fold?fold.remainPoly:rectPoly()); ctx.clip();
  ctx.drawImage(pageImg,0,0,W,H); ctx.restore();
  if (!fold) return;
  const [A,B] = fold.crease;
  ctx.save(); pathFrom(fold.remainPoly); ctx.clip();
  ctx.filter='blur(7px)'; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.restore();

/* DE LA PANTALLA AL PAPEL. Todo el pliegue —el punto de agarre, la línea del
   doblez, la cuenta de si has jalado bastante para que la hoja pase— vive en
   coordenadas de PAPEL: de 0 a W, de 0 a H. Un dedo, en cambio, da
   coordenadas de pantalla. Aquí se traduce, y hay dos cosas que traducir.

   El desplazamiento del cajón, que ya estaba y no se contaba: el lienzo se
   corre -scrollLeft para acompañar al papel, así que el punto de papel que hay
   bajo el dedo está scrollLeft más allá. Con el cajón cerrado da igual —vale
   cero— y por eso no se notaba nunca.

   Y la escala de la vista de lejos, que es la que trajo esto. Al encender los
   filos en el zoom, el dedo empezó a entregar píxeles de una hoja al 58% y el
   pliegue a leerlos como si fueran de la hoja entera: el doblez se despegaba
   del dedo en cuanto te apartabas del centro, y endFold medía un jalón que no
   habías dado —un arrastre corto pasaba hoja porque contra W*.45 esos píxeles
   inflados ya bastaban—. Lo encontró la revisión de Codex; mi prueba se había
   quedado en el TOQUE del filo, que no pasa por aquí, y por eso salía verde.

   La escala se lee de lo que dejó puesto medirZoom en vez de recalcularla:
   dos sitios haciendo la misma cuenta terminan discrepando, y aquí discrepar
   significa que el papel no sigue al dedo. */
function aPapel(clientX, clientY){
  const r = pg.getBoundingClientRect();
  const x = clientX - r.left + pg.scrollLeft, y = clientY - r.top;
  if (!zoomActivo) return { x, y };
  return { x:(x - zoomFx.x) / zoomK, y:(y - zoomFx.y) / zoomK };

const local = ev => aPapel(ev.clientX, ev.clientY);
const clampPg = p => ({ x:Math.min(Math.max(p.x, side==='right'?-W*.3:0), side==='right'?W:W*1.3),
                        y:Math.min(Math.max(p.y,0),H) });
/* ============================================================
   EL FILO HACE DOS COSAS Y SE DISTINGUEN SOLAS: un toque abre el
   índice de libros, un arrastre pasa la hoja. Sin cronómetros y sin
   hover —el reposo del ratón no es una intención, y en táctil ni
   siquiera existe. El pliegue no arranca hasta que hay movimiento
   real, para que un toque limpio no deje un destello de hoja. */
const UMBRAL_ARRASTRE = 6;      // px que hay que moverse para que sea arrastre
let gestoPendiente = null;

function iniciarPliegue(s, clientY){
  if (!hayHoja(s)) return false;
  side = s;
  hojasExtra = []; alfaTop = 1;
  bajoImg = (s === 'right' ? nextImg : prevImg);
  if (!pageImg || snapStale()) makeSnapshot();
  /* Por la misma traducción que el arrastre: el agarre nace donde pusiste el
     dedo, y de lejos ese sitio no es el que dice la pantalla. */
  anchor = { x: s === 'right' ? W : 0,
             y: Math.min(Math.max(aPapel(0, clientY).y, 0), H) };
  F = { ...anchor };
  folding = true;
  sizeCanvas(); fx.style.display = 'block';
  if (pageImg) pg.classList.add('hidden');
  return true;
}
/* ============================================================
   LA HUELLA. Se dibuja, no se pinta a mano: unas crestas trazadas siempre
   iguales serían un sello, y un sello puesto dos veces en el mismo sitio se
   nota falso. Cada impresión sale de azarDe —el mismo generador que le da
   forma a las glosas— sembrado con el filo y la altura del toque, así que
   cambia de un toque a otro y es SIEMPRE la misma para el mismo punto. Es la
   regla que ya sigue el resto del programa: azar que no cambia bajo los pies.
   ============================================================ */
const huella = $('huella');
let cuadroHuella = 0;
function crestasHuella(semilla){
  const r = azarDe(String(semilla));
  const cx = 31, cy = 37;
  let d = '';
  for (let i = 0; i < 8; i++){
    const rx = 3.4 + i * 3.25 + r() * 1.1;
    const ry = 4.2 + i * 3.95 + r() * 1.3;
    /* Cada cresta ABRE en un ángulo distinto y no cierra: una huella real no
       son anillos concéntricos, son líneas que empiezan y acaban donde les
       toca. Cerrarlas daba un tiro al blanco, no un dedo. */
    const a0 = -Math.PI/2 + (r() - .5) * 1.7;
    const barrido = Math.PI * (1.30 + r() * .55);
    /* La ondulación es una sinusoidal con fase propia, no ruido por punto:
       con ruido cada cresta salía dentada, y una cresta dentada se lee como
       un trazo mal hecho en vez de como piel. */
    const fase = r() * 6.283, amp = .020 + r() * .030;
    let p = '';
    for (let s = 0; s <= 30; s++){
      const a = a0 + barrido * (s / 30);
      const w = 1 + Math.sin(a * 3 + fase) * amp;
      p += (s ? 'L' : 'M') + (cx + Math.cos(a) * rx * w).toFixed(1) + ' '
                           + (cy + Math.sin(a) * ry * w).toFixed(1);
    }
    /* LOS TRAZOS, MÁS SÓLIDOS Y MÁS GRUESOS. Empezaban en .52 de dorado y
       bajaban hasta .24 en la cresta de fuera; sobre papel crema eso es casi
       el papel, y en la práctica solo se veían los dos o tres anillos de
       dentro. Ahora van de .95 a .60: la de fuera sigue siendo la más tenue
       —el degradado hacia el borde es lo que hace que se lea como una huella
       y no como una diana— pero ya ninguna se pierde.
       El grosor sube en la misma proporción. Con trazos de menos de un píxel
       el navegador los reparte entre dos filas y los pinta a media tinta, así
       que adelgazar de más no afinaba: descoloría. Ninguna baja de 1.1. */
    d += '<path d="' + p + '" fill="none" stroke="rgba(' + DORADO + ',' +
         (.95 - i * .05).toFixed(3) + ')" stroke-width="' +
         (2.05 - i * .12).toFixed(2) + '" stroke-linecap="round"/>';
  }
  return d;
}
function mostrarHuella(ev, s){
  const r = stage.getBoundingClientRect();
  /* A la ALTURA donde tocaste —que es de donde va a girar la hoja, así que la
     marca y el giro cuentan lo mismo— pero metida hacia adentro: el filo mide
     24px y una huella centrada ahí saldría partida por el canto. Se ve entera
     y se sigue leyendo como "tu dedo está en este filo". */
  const y = Math.min(Math.max(ev.clientY - r.top, 42), r.height - 42);
  huella.style.left = (s === 'right' ? r.width - 34 : 34) + 'px';
  huella.style.top  = y + 'px';
  huella.innerHTML = '<div class="brillo"></div>' +
    '<svg class="crestas" width="62" height="74" viewBox="0 0 62 74">' +
    crestasHuella(s + ':' + Math.round(y)) + '</svg>';
  /* Un cuadro de respiro antes de encender: puesta y encendida en el mismo
     cuadro, el navegador se salta la transición y la huella aparece de golpe
     en vez de posarse.
     Ese cuadro hay que poder CANCELARLO, y se paga caro si no. Un gesto que
     nace y muere dentro del mismo cuadro —un pointercancel inmediato, o un
     jalón que cruza el umbral de arrastre antes de que pinte nadie— llamaba a
     ocultarHuella() cuando la clase todavía no estaba puesta: quitarla no
     hacía nada, y el cuadro pendiente la ponía después. La huella se quedaba
     encendida y latiendo sobre una hoja quieta, sin gesto que la explicara,
     hasta el siguiente toque. Guardar el cuadro y cancelarlo cierra esa
     puerta: encender y apagar pasan a ser la misma cola. */
  cancelAnimationFrame(cuadroHuella);
  cuadroHuella = requestAnimationFrame(() => {
    cuadroHuella = 0; huella.classList.add('viva');
  });
}
function ocultarHuella(){
  cancelAnimationFrame(cuadroHuella); cuadroHuella = 0;
  huella.classList.remove('viva');
}

function bordeAbajo(ev, s){
  if (cantoAbierto){ cerrarCanto(); return; }
  gestoPendiente = { s, x: ev.clientX, y: ev.clientY, t: performance.now() };
  /* En el filo de la primera hoja —o de la última— no hay a dónde ir. El filo
     ya se ve apagado, pero .off es solo pintura: los oyentes siguen ahí y la
     huella se encendía igual, prometiendo un giro durante los 240ms de la
     espera para luego apagarse sin que pasara nada. Una señal que dice "voy"
     donde no se va a ningún lado es peor que no dar señal: enseña a
     desconfiar de ella en los filos donde sí sirve. */
  if (hayHoja(s)) mostrarHuella(ev, s);
  /* Con su red, igual que la del arrastre del papel: capturar un puntero que
     ya se soltó lanza, y una excepción aquí abortaría lo que quede del
     manejador. Pasa poco y cuesta una línea. */
  try { (s === 'right' ? edgeR : edgeL).setPointerCapture(ev.pointerId); } catch(e){}
}
function bordeMueve(ev, s){
  if (folding){ F = clampPg(local(ev)); drawFold(); ev.preventDefault(); return; }
  const g = gestoPendiente;
  if (!g || g.s !== s) return;
  if (Math.hypot(ev.clientX - g.x, ev.clientY - g.y) < UMBRAL_ARRASTRE) return;
  gestoPendiente = null;
  /* Dejó de ser un toque y pasó a ser un arrastre: la huella sobra, porque
     ahora el papel ya se mueve bajo el dedo y eso avisa mejor que cualquier
     marca. */
  ocultarHuella();
  if (!iniciarPliegue(s, g.y)) return;       // no hay hoja de ese lado
  F = clampPg(local(ev)); drawFold(); ev.preventDefault();
}
/* Un clic pasa la hoja; dos abren el índice. Como el primer clic de un
   doble es indistinguible de un clic solo, el paso de hoja espera un
   instante por si viene el segundo. Es el único retardo del sistema y no
   hay forma de evitarlo compartiendo el mismo blanco. */
const ESPERA_DOBLE = 240;
let relojClic = null;
/* Un clic pasa UNA hoja, y la voltea desde la altura exacta donde tocaste:
   el gesto se lee como si la hubieras empujado tú desde ahí. Nada de bonche
   —el bonche es para viajes largos, no para la hoja de al lado. */
function pasarHoja(s, clientY, intento){
  const destino = paginaActual + (s === 'right' ? 1 : -1);
  if (destino < 0 || destino >= paginas.length) return;
  volverA = null;
  sizeCanvas();
  if (!pageImg || snapStale()){
    if ((intento || 0) > 3){ paginaActual = destino; renderPage(); return; }
    makeSnapshot();
    setTimeout(() => pasarHoja(s, clientY, (intento || 0) + 1), 130);
    return;
  }
  const viejo = pageImg;
  /* Sin punto de agarre válido, el centro de la hoja. Antes, quien llamara sin
     clientY producía NaN y el doblez se dibujaba en ninguna parte: la hoja
     cambiaba de golpe, sin animación. Un valor que no es número no se debe
     propagar en silencio hasta la geometría. */
  const y = Number.isFinite(clientY) ? aPapel(0, clientY).y : H/2;
  const anclaY = Math.min(Math.max(y, 0), H);
  side = s;
  fotoDeHoja(destino, img => {
    if (!img){ paginaActual = destino; renderPage(); return; }
    pageImg = viejo; bajoImg = img;
    animarHojas(1, rnd(620, 780), () => {
      hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; anchor = F = null;
      paginaActual = destino;
      renderPage();
      fx.style.display = 'none'; pg.classList.remove('hidden');
    }, anclaY);
  });
}
function bordeArriba(ev, s){
  if (folding){ ocultarHuella(); endFold(); return; }
  const g = gestoPendiente; gestoPendiente = null;
  if (!g || g.s !== s){ ocultarHuella(); return; }
  const quieto = Math.hypot(ev.clientX - g.x, ev.clientY - g.y) < UMBRAL_ARRASTRE;
  /* Gesto descartado —te moviste demasiado, o te quedaste apoyado más de lo
     que dura un clic—: la huella se va sin que pase nada, que es exactamente
     lo que hay que contar. */
  if (!quieto || performance.now() - g.t > 600){ ocultarHuella(); return; }
  clearTimeout(relojClic);
  const alturaClic = g.y;                    // la hoja gira desde donde tocaste
  /* Y AQUÍ es donde la huella se gana el sueldo: sigue encendida durante los
     240ms de espera del doble clic, que es el rato en que el programa ya te
     entendió y todavía no mueve nada. Se apaga en el mismo cuadro en que
     arranca el giro —ni antes, que devolvería el hueco a otro sitio, ni
     después, que la dejaría flotando sobre una hoja que ya se fue. */
  relojClic = setTimeout(() => {
    relojClic = null; ocultarHuella(); pasarHoja(s, alturaClic);
  }, ESPERA_DOBLE);
}
function endFold(){
  if (!folding) return;
  folding = false;

}
/* El índice baja del filo de arriba; los laterales solo pasan hoja. Cada
   borde hace una cosa y se acabaron los gestos compartidos. */
/* Un solo clic: este filo no hace nada más, así que no hay ambigüedad que
   resolver ni ventana de espera que aguantar. */
/* EL ANCHO DE LA HOJA EN TELÉFONO, ESCRITO A MANO EN EL ELEMENTO.

   Llevamos tres intentos poniéndolo en el CSS y el papel seguía midiendo unos
   50px más que la pantalla en vez de 193. No sé cuál de las reglas le está
   ganando —hay tres hojas de estilo en juego: la de la aplicación, PAGE_CSS
   inyectada después, y lo que el guion escribe en el elemento— y ya no vale la
   pena averiguarlo: un estilo en línea marcado como importante no lo puede
   vencer nada. Se acabó la discusión.

   Se recalcula al cambiar de tamaño porque girar el teléfono cambia si estamos
   o no en modo angosto. */
const COL_GLOSA = 240, HUECO_COL = 11, ORILLA = 16;
/* La columna de texto ya no mide 340 fijos: mide LO QUE MIDE LA PANTALLA. El
   usuario que ya sabe que a la derecha viven las glosas no necesita verlas
   asomarse, y esos 90px que se gastaban en insinuarlo rinden más como texto:
   en un teléfono de 430px son 56 caracteres por renglón en vez de 48. */
function medirHojaTelefono(){
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return;
  const COL_TEXTO = Math.max(240, pg.clientWidth);
  const fijar = (el, props) => {
    for (const k in props){
      if (props[k] === null) el.style.removeProperty(k);
      else el.style.setProperty(k, props[k], 'important');
    }
  };
  if (!enTelefono()){
    const g = ghost.querySelector('.pg-inner');
    fijar(inner,   { width:null, 'max-width':null });
    fijar(pgBody,  { flex:null, width:null, 'min-width':null });
    fijar(pgMargin,{ flex:null, width:null, 'min-width':null, 'margin-left':null });
    if (g) fijar(g,{ width:null, 'max-width':null });
    fijar(ghostBody,  { flex:null, width:null, 'min-width':null });
    fijar(ghostMargin,{ flex:null, width:null, 'min-width':null, 'margin-left':null });
    return null;
  }
  /* --col-texto viaja al CSS para que los rótulos se centren sobre la columna
     y no sobre la hoja: como la columna ahora es la pantalla, quedan centrados
     en pantalla, que es donde se leen. */
  pg.style.setProperty('--col-texto', COL_TEXTO + 'px');
  ghost.style.setProperty('--col-texto', COL_TEXTO + 'px');
  fijar(inner,    { width:(COL_TEXTO + HUECO_COL + COL_GLOSA) + 'px', 'max-width':'none' });
  fijar(pgBody,   { flex:'0 0 ' + COL_TEXTO + 'px', width:COL_TEXTO + 'px',
                    'min-width':COL_TEXTO + 'px' });
  fijar(pgMargin, { flex:'0 0 ' + COL_GLOSA + 'px', width:COL_GLOSA + 'px',
                    'min-width':COL_GLOSA + 'px', 'margin-left':HUECO_COL + 'px' });

     veía al pasar hoja: la foto se compone en #ghost, y el fantasma no llevaba
     el acomodo del teléfono. Como sí llevaba el margen de 240px pero con el
     ancho de la PANTALLA y no el del papel, al texto le quedaban 150px y salía
     esa columnita justificada. La hoja que se voltea tiene que ser la misma
     hoja que estabas leyendo, o el pliegue deja de ser un pliegue. */
  const ginner = ghost.querySelector('.pg-inner');
  if (ginner){
    fijar(ginner,     { width:(COL_TEXTO + HUECO_COL + COL_GLOSA) + 'px', 'max-width':'none' });
    fijar(ghostBody,  { flex:'0 0 ' + COL_TEXTO + 'px', width:COL_TEXTO + 'px',
                        'min-width':COL_TEXTO + 'px' });
    fijar(ghostMargin,{ flex:'0 0 ' + COL_GLOSA + 'px', width:COL_GLOSA + 'px',
                        'min-width':COL_GLOSA + 'px', 'margin-left':HUECO_COL + 'px' });
  }
  return { texto:COL_TEXTO, glosa:COL_GLOSA, hueco:HUECO_COL, orilla:ORILLA };
}
window.addEventListener('resize', medirHojaTelefono);
/* Un diagnóstico a la mano: en la consola se escribe medida() y contesta lo
   que de verdad mide la hoja. Si "papel" no es 623 en un teléfono, el ancho no
   se aplicó; si lo es y aun así no corre, el problema es del desplazamiento y
   no del acomodo. Dos números y se acabaron las adivinanzas. */
window.estado = () => window.__estado;
window.medida = () => ({
  compilacion: window.GLOSS_BUILD,
  enTelefono: enTelefono(),
  ventana: pg.clientWidth,
  papel: pg.scrollWidth,
  seCorre: pg.scrollWidth - pg.clientWidth,
  columnaTexto: pgBody.offsetWidth,
  columnaGlosa: pgMargin.offsetWidth

/* CORRER EL PAPEL ARRASTRÁNDOLO DESDE DONDE NO HAY TEXTO.

   corres. Sobre el texto no, porque ahí arrastrar significa seleccionar, y
   seleccionar es como se hacen las glosas: quitarle eso al texto sería
   cambiar una cosa que sirve por otra.

   ni se entera. Y no estorba a los clics: hasta que no mueves 4px no se
   considera arrastre, de modo que un toque limpio sigue siendo un toque. */
/* CERRAR EL CAJÓN DE GLOSAS DE GOLPE. Lo usa el aterrizaje de un salto, que
   no es un gesto tuyo sobre el papel sino una hoja nueva: no hay nada que
   acompañar con inercia, solo que la hoja llegue puesta como se empieza a
   leer. La versión de verdad la instala correrPapel más abajo —ahí vive el
   reloj de la animación de acomodo, y hay que cancelarlo o seguiría corriendo
   el papel de la hoja recién llegada—. Ésta de aquí es la que vale mientras
   tanto, por si alguien salta antes de que aquello se arme. */
let cerrarCajonDeGlosas = () => { pg.scrollLeft = 0; };
(function correrPapel(){
  /* EL CAJÓN, CON PALANCA.

     El problema de las versiones anteriores era que yo decidía. Se cerraba
     solo por cercanía, o se cerraba solo por impulso, y en los dos casos el
     movimiento terminaba sin ti. Ayudar no es tomar el control: es hacer que
     lo que quieres cueste menos trabajo.

     Así que la ayuda ya no está en decidir por ti, está en la PALANCA: un
     píxel de ratón mueve diez de papel. Sigues tú al mando en todo momento
     —puedes dejar el cajón donde se te dé la gana, a un tercio, a la mitad—
     pero recorrerlo entero cuesta 22px de movimiento en vez de 219.

     Los imanes se quedan, y solo hacen lo que hace un imán: si SUELTAS cerca
     de una punta, el cajón termina de acomodarse. Ya no te arrebatan el
     movimiento a media carrera. */

     otra mitad del "ON/OFF". Con 5 a 1, el cajón entero —251px— se recorre con
     50px de dedo. Un desliz normal en un teléfono mide entre 100 y 200, así
     que el papel llegaba al tope en el primer tercio del gesto y los otros dos
     tercios se gastaban contra el freno: abierto antes de terminar de abrir.
