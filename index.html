<script src="bibles-included.js"></script>
<script>
(function(){
/* Sello de compilación. Sirve para una sola cosa, y es una que ya hizo falta:
   saber si el archivo que se está probando es el último.
   Llevaba tiempo mintiendo: era una hora suelta escrita a mano que nadie
   volvió a tocar, así que decía lo mismo en todas las versiones y contestaba
   que sí a la única pregunta que sabe responder. Ahora lleva fecha, y hay que
   subirla al cambiar algo que se vaya a probar en otro aparato.
   Y se lee sin consola, en el panel de Respaldo: un dato que solo se alcanza
   con las herramientas de desarrollo no sirve para lo que este sirve, que es
   que alguien con un teléfono en la mano pueda decir qué versión tiene. */
/* LA VERSIÓN: LA HORA A LA QUE SE TOCÓ ESTE ARCHIVO.

   Sirve para una pregunta concreta: cuando algo no funciona en un teléfono, lo
   primero que hay que saber es si ese teléfono tiene la versión nueva o una
   guardada en caché. Se enseña en el panel de Respaldo, para que la conteste
   quien sostiene el aparato sin enchufarlo a nada.

   CÓMO SE ACTUALIZA: quien cambia este archivo mira el reloj de Dallas en ese
   momento y escribe la hora aquí. Nada más. No se calcula: una fecha escrita
   no puede equivocarse de huso ni de horario de verano, y quien la escribe es
   justamente el que sabe cuándo está haciendo el cambio.

   Formato: DD-MMM-YY HH:MM, hora de Dallas. */
window.GLOSS_BUILD = '02-SEP-26 23:34';
console.log('%cGloss Bible · compilación ' + window.GLOSS_BUILD,
            'color:#b8892b; font-weight:bold');
'use strict';

const PAGE_CSS = `
/* El documento de afuera tiene una regla universal de box-sizing; dentro
   del SVG no existe, así que hay que repetirla o las cajas con relleno
   miden distinto en la foto. */
.pg, .pg *{ box-sizing:border-box; }
/* El papel y la tinta salen de variables porque el sepia los mueve a los dos
   a la vez: entintar solo el fondo deja la letra negra flotando encima y se
   ve una foto con filtro, no papel viejo. Los valores de fábrica quedan como
   respaldo en el var() —si algún día alguien compone una hoja sin pasar por
   prepararHoja, sale blanca en vez de transparente. */
.pg{ background:var(--papel,#faf7f1); color:var(--tinta,#241f1a);
     font-family:var(--fam, Georgia, 'Times New Roman', serif);
     padding:22px var(--mx,18px) 18px; height:100%; width:100%; box-sizing:border-box; }
.pg-inner{ position:relative; display:flex; flex-direction:column; height:100%; box-sizing:border-box; }
.pg-cols{ display:flex; flex:1 1 auto; min-height:0; box-sizing:border-box; }
/* Titulillo: dice dónde empieza esta hoja. Va POSICIONADO, no en el flujo,
   así que no le quita ni un renglón al texto —vive a la altura de la
   primera línea, en la esquina. El fondo de papel lo despega de lo que
   haya debajo. */
/* La versión, al pie y al centro: es un dato de la hoja, no de la aplicación,
   así que vive en el papel y sale también en la foto del pliegue. Discreta
   como el folio de un libro impreso. */
/* LA LETRA DE LOS RÓTULOS. Un titulillo y un folio no son texto de la obra:
   son aparato del libro, y en un libro impreso se componen aparte, en
   VERSALITAS —capitales de altura de equis— de una serif clásica. Es la
   convención de cinco siglos que ya perseguía todo este bloque, y era la única
   parte que faltaba: hasta ahora heredaban la letra del cuerpo y se veían como
   un trozo más del versículo puesto de canto.
   Con font-variant-caps:small-caps la mayúscula inicial conserva su altura y
   el resto baja: "Mateo" se lee MATEO con la eme un punto más alta. Eso es
   exactamente lo que se pide —que parezcan todas mayúsculas— sin las dos cosas
   que arruinan una línea de capitales de verdad: el bloque macizo y la pérdida
   de la inicial.
   Y NO con text-transform:uppercase, que era el otro camino. El lienzo del
   pliegue dibuja cada palabra leyendo el nodo de texto CRUDO: con
   text-transform mediría "MATEO" en la hoja y pintaría "Mateo" en la foto,
   estirado hasta el ancho que no le toca. small-caps no toca el nodo, así que
   ese engaño no puede darse; solo hay que pasarle la variante al lienzo, que
   es lo que se hace en medirPalabras.
   La familia va escrita y no heredada a propósito: el cuerpo puede quedar en
   Verdana o en Segoe, y el rótulo tiene que seguir siendo el rótulo.
   text-transform se retira porque ya no hace falta y porque, si mañana una
   abreviatura de versión trajera minúsculas, volvería a romper la foto. */
.pg-cabeza, .pg-version{
  font-family:'Palatino Linotype',Palatino,'Book Antiqua','Iowan Old Style',
              Georgia,'Noto Serif',serif;
  font-variant-caps:small-caps; font-synthesis:small-caps; }
/* Y EL FOCO SE VE. Al hacerlos alcanzables con el tabulador aparece la otra
   mitad del trabajo: un foco invisible es peor que ninguno —se navega a
   ciegas—. Va con :focus-visible y no con :focus, que es la diferencia entre
   enseñar el aro a quien lo necesita y pintárselo encima al que acaba de tocar
   el rótulo con el dedo. El color es el marrón del programa, no el azul del
   sistema, y el outline-offset lo despega del papel para que se lea sobre el
   fondo claro del rótulo. */
.pg-cabeza:focus-visible, .pg-version:focus-visible{
  outline:2px solid #b8892b; outline-offset:2px; }
.pg-version{ position:absolute; bottom:0; left:50%; transform:translateX(-50%);
             z-index:2; font-size:9px; letter-spacing:.14em;
             color:var(--rot-pie,#8a6e3c); background:var(--papel,#faf7f1); padding:2px 8px 1px;
             white-space:nowrap; cursor:pointer; border-radius:4px 4px 0 0;
             transition:background .34s cubic-bezier(.65,0,.35,1),
                        color .34s cubic-bezier(.65,0,.35,1); }
/* EL ROTULO NO SE PONE BLANCO. Tenía un :hover que le pintaba el fondo de
   #fffdf6, y en un teléfono eso no es un estado que exista: el navegador
   aplica :hover al tocar y lo DEJA PUESTO hasta que tocas otra cosa. O sea que
   después de abrir las versiones el rótulo se quedaba blanco, encendido por un
   gesto que ya había terminado, y no había forma de apagarlo desde dentro.
   Este rótulo tiene dos estados y no tres: en reposo, y abierto. El aviso de
   «se puede tocar» con ratón se queda —ahí :hover sí significa lo que dice—
   pero solo cambia la tinta, no el papel, y solo donde hay puntero de verdad.
   El blanco se acabó en los dos sitios. */
@media (hover:hover) and (pointer:fine){
  .pg-version:hover{ color:#6d5c33; }
}
/* Las dos etiquetas de la hoja abren la sección que les corresponde: la de
   arriba dice dónde estás y abre Libros; la de abajo dice en qué versión lees
   y abre Formato, que es donde se cambia. Cada rótulo es la puerta de lo que
   nombra, así no hay que acordarse de nada. */
.pg-version.abierta, .pg-version.abierta:hover{ background:#b8892b; color:#fff8e4; }
/* Los dos rótulos son botones, no texto: no se seleccionan ni reciben el
   destello que los navegadores pintan encima de lo que tocas. Ese destello es
   azul en Chrome y aparecía justo al hacer clic; y si el dedo se movía un
   pelo, encima empezaba a seleccionar las letras. Ninguna de las dos cosas
   tiene sentido en algo que solo sirve para abrirse. */
.pg-cabeza, .pg-version{ -webkit-user-select:none; user-select:none;
                         -webkit-tap-highlight-color:transparent; }
/* Las versalitas piden más tracking que la caja baja: son letras anchas y
   bajas, y pegadas se empastan. .07em era la separación de un texto normal. */
/* La cinta ya no vive en esta esquina: cuelga del borde izquierdo de las
   glosas y asoma al texto. El titulillo se queda pegado a la derecha. */
.pg-cabeza{ position:absolute; top:0; right:0; z-index:2;
            font-size:10.5px; line-height:1.3; letter-spacing:.10em;
            color:var(--rot-cab,#795f35); background:var(--papel,#faf7f1); padding:1px 5px 2px 9px;
            white-space:nowrap; cursor:pointer; border-radius:0 0 0 4px;
            transition:background .34s cubic-bezier(.65,0,.35,1),
                       color .34s cubic-bezier(.65,0,.35,1); }
/* EL FUNDIDO SE APAGA MIENTRAS SE MUEVE EL SEPIA. La transición de arriba está
   puesta para cuando TOCAS el rótulo: se enciende en ámbar y vuelve. Pero el
   sepia cambia esas dos mismas propiedades, y ahí estorba. Ver sinFundido.

   Va a (0,2,0) a propósito, o sea por debajo de #pg.suavizando: si alguna vez
   coincidieran, importa más que el zoom no le pegue un brinco al tamaño que
   ahorrarse un fundido de color. Y no coinciden, porque renderPage entra por
   sinZoom y sinZoom cancela el suavizado en su primer renglón. */
.sin-fundido .pg-cabeza, .sin-fundido .pg-version{ transition:none; }
/* Y EL MOLDE NO SE FUNDE NUNCA. #ghost vive en left:-99999px y existe para una
   sola cosa: que se le midan las palabras. Nadie lo mira, así que una
   transición ahí no puede mejorar nada y sí puede estropear una medida.

   Estropeaba una. sinFundido cubre la hoja viva mientras se mueve el sepia,
   pero la foto de las hojas VECINAS se toma después, dentro del setTimeout(0)
   de invalidateSnapshot: allí fotoDeHojaCrudo llama a prepararHoja(ghost) —que
   es donde el molde recibe el color nuevo, porque renderPage solo prepara la
   hoja viva— y mide acto seguido. Con el fundido puesto, medía el color de
   antes: al pasar de página el titulillo salía con el tono viejo durante el
   pliegue y saltaba al bueno al aterrizar. Lo levantó la revisión.

   Se arregla aquí y no envolviendo esa llamada porque fotoDeHoja se pide desde
   varios sitios —vecinas, saltos— y cada sitio nuevo tendría que acordarse.
   Un molde que no anima nunca no puede olvidarse de no animar. */
#ghost .pg-cabeza, #ghost .pg-version{ transition:none; }
/* Sin subrayado en ningún estado. Lo que dice "estoy buscando otra cosa" es
   exactamente lo mismo que marca al libro elegido dentro del panel: fondo
   dorado sólido y letra crema, ni una raya. Dos señales distintas para la
   misma idea obligan a aprender dos cosas; una sola no obliga a nada. */
@media (hover:hover) and (pointer:fine){
  .pg-cabeza:hover{ color:#6d5c33; }
}
.pg-cabeza.abierta, .pg-cabeza.abierta:hover{ background:#b8892b; color:#fff8e4; }
/* hyphens:auto queda FUERA a propósito: la partición de palabras depende
   del diccionario del idioma, y ese diccionario no está disponible cuando
   la hoja se rasteriza para el pliegue. Resultado: el texto vivo partía
   palabras y la foto no, y al agarrar el borde los espacios brincaban. */
.pg-body{ flex:1 1 auto; min-width:0; font-size:var(--fs,15px); line-height:var(--lh,1.62);
          text-align:var(--ali,left); hyphens:var(--guion,none);
          overflow:hidden; box-sizing:border-box;
          column-count:var(--cols,1); column-gap:15px; column-fill:auto;
          column-rule:1px solid rgba(150,130,90,.26); }
.pg-margin{ position:relative; flex:0 0 auto; width:var(--mw,0px);
            margin-left:var(--mgap,0px); overflow:hidden; }
.pg-foot{ flex:0 0 auto; }
.pg-foot:empty{ display:none; }
.foot-in{ border-top:1px solid rgba(140,118,72,.45); padding-top:6px; margin-top:7px;
          column-count:var(--fcols,1); column-gap:15px; }
/* El número de capítulo, en su propio renglón y centrado. En papel se
   flotaría para no gastar líneas; aquí el espacio no es escaso y se lee
   mucho mejor como un descanso entre capítulos.
   break-after evita que quede huérfano al pie de una columna. */
/* EL NUMERAL VA CON LA LETRA DE LOS RÓTULOS, no con la del texto. Es aparato
   del libro igual que el titulillo y el folio —no es palabra de la Escritura,
   es un dispositivo para encontrarla—, y el aparato de un libro impreso se
   compone aparte del texto. Heredando la del cuerpo, cambiar la tipografía en
   Formato le cambiaba la cara al numeral: en Verdana se veía un número de
   formulario en medio de la página. Con la suya propia, el numeral es lo mismo
   en las seis tipografías, que es lo que se espera de un mueble de la hoja.
   No lleva versalitas: son cifras, y small-caps no las toca. */
.cap{ display:block; text-align:center; break-after:avoid;
      font-family:'Palatino Linotype',Palatino,'Book Antiqua','Iowan Old Style',
                  Georgia,'Noto Serif',serif;
      font-size:calc(4.2em - (var(--cols,1) - 1) * 0.45em);
      line-height:1; font-weight:400; color:#b0873a;
      letter-spacing:.04em;
      /* Un poco MÁS abajo que arriba, al revés de lo que pide un título
         normal. Dos razones: un numeral centrado y solo se lee como
         separador, y los separadores quieren equilibrio; y sobre todo, el
         hueco de arriba ya viene inflado por donde haya terminado el
         capítulo anterior —eso no lo controla el margen. Van en em del
         propio número, así que encogen con él en varias columnas. */
      margin:.30em 0 .46em; }
/* Aquí iba font-variant-numeric:oldstyle-nums, y se veía precioso —pero el
   lienzo no sabe leer esa propiedad, así que en la foto del pliegue el
   número salía con otra forma y otra altura. Entre una cifra elegante y un
   pliegue que no miente, gana el pliegue. */
/* Los versículos van CORRIDOS, siempre. Hubo un ajuste para ponerlos cada uno
   en su renglón y se ha quitado: partía el texto en una lista de frases
   sueltas y una Biblia no es una lista, es prosa —así se leyó durante
   diecinueve siglos, y los números vinieron después—. Lo que aportaba era
   encontrar un versículo de un vistazo, y para eso ya está el salto por
   referencia, que además te lleva. */
.v{ display:inline; }
/* Los números no se seleccionan. No es un parche: es lo que son. El número de
   versículo y el de capítulo son aparato, no texto bíblico —los pusieron
   Stephanus y Langton siglos después— y nadie quiere subrayarlos ni citarlos.
   Al sacarlos de la selección, el doble clic sobre la primera palabra ya no
   arrastra el número, que es de donde venía la falla. De paso, copiar un
   pasaje ya no se lleva los números pegados a las palabras. */
.vn, .cap{ -webkit-user-select:none; user-select:none; }
.vn{ font-size:.68em; color:#a98f57; vertical-align:.4em; padding-right:2px; }
.vn-yellow{ color:#c9a227; font-weight:700; }
.vn-green { color:#3a8f4f; font-weight:700; }
.vn-blue  { color:#1d6f9c; font-weight:700; }
.vn-orange{ color:#9c4708; font-weight:700; }
.hl{ border-radius:2px; }
.f-yellow{ background:rgba(255,214,64,.45); }
.f-green { background:rgba(94,196,110,.19); }
.f-blue  { background:rgba(86,182,238,.18); }
.f-orange{ background:rgba(242,105,20,.17); }
.b-yellow{ text-decoration:underline 1.6px #c9a227; text-underline-offset:3px; }
.b-green { text-decoration:underline 1.6px #3a8f4f; text-underline-offset:3px; }
.b-blue  { text-decoration:underline 1.6px #2b9fd4; text-underline-offset:3px; }
.b-orange{ text-decoration:underline 1.6px #e2650c; text-underline-offset:3px; }
.aprox{ text-decoration:underline dotted 2px #b23a3a; text-underline-offset:4px; }
/* LA GLOSA SE LEE AL MISMO TAMAÑO QUE EL TEXTO. Estaba clavada en 11px, así
   que subir la letra de la hoja agrandaba el versículo y dejaba la nota igual
   de chica: acababas leyendo cómodo el texto y forzando la vista en lo que tú
   escribiste, que es al revés de lo que quieres. Va con --fs, la misma medida
   que manda en el cuerpo. */
/* LA INTERLÍNEA DE LA GLOSA NO ES LA DEL VERSÍCULO, y no tiene por qué serlo.
   El cuerpo va en 1.62 porque es texto para leer seguido, renglón tras renglón
   durante minutos, y ahí el aire descansa la vista. La nota es otra cosa: son
   dos o tres líneas que se leen de un vistazo, dentro de un recuadro que las
   delimita solo.
   A 1.42 el aire de más no ayudaba a leerlas; ocupaba margen, que en teléfono
   es lo único que hay. Bajó a 1.28, que era más de lo que pedía una
   monoespaciada: a 15px son 2.1px menos por renglón.
   El RELLENO escrito aquí es solo el de reserva y casi nunca se ve. El de
   verdad lo pone formaOrganica en el atributo style de cada nota —de ahí sale
   que el recuadro no sea un rectángulo— y contra un atributo style no puede
   ninguna hoja de estilos. Ahí se recortó también. */
/* LA LETRA DE LA NOTA: UNA SANS HUMANISTA, NO LA MONOESPACIADA.

   La monoespaciada estaba puesta para que la glosa se leyera como OTRA VOZ, no
   como más Biblia: una nota a máquina frente al texto impreso. La intención es
   buena y se conserva; lo que no funcionaba era la ejecución, y falla justo en
   el aparato donde se lee.
   'Courier New' no existe en Android. Lo que hay ahí es la monoespaciada del
   sistema —Roboto Mono, Droid Sans Mono—, que son fuentes DE CÓDIGO: trazo
   uniforme, x grande, formas cerradas. Eso no se lee como «escrito a máquina»,
   se lee como salida de terminal. La caída no era una versión pobre de la
   intención: era la intención contraria.

   Y costaba margen, que es el único recurso escaso de esta columna. Medido en
   los 216 px útiles: Courier a 15px da 23 caracteres por renglón; esta pila a
   14 da 33. La misma nota de ejemplo pasó de 6 renglones y 116 px a 4 y 80 px,
   un 31% menos de margen POR GLOSA, y con más aire entre renglones, no menos.

   No se ve más chica aunque el número baje de 15 a 14: la altura de la x sale
   igual —8 px medidos en las dos—, que es lo que decide el tamaño aparente.
   La interlínea SUBE de 1.28 a 1.35, y es al revés de lo que parece: 1.28
   estaba bien para una Courier de x pequeña y letras ya separadas; una
   humanista de x grande tiene ascendente más descendente por encima de 1.3, y a
   1.28 los extremos se rozan. De ahí el aspecto apretado.

   El carácter de «escrito a mano» no lo tiene que dar la fuente: ya lo da
   formaOrganica, con sus esquinas dispares, su grosor de pluma por nota, una
   sola dirección de luz y el giro. La caja hace ese trabajo.

   El tamaño va como FACTOR de --fs y nunca clavado: el guion escribe --fs desde
   el ajuste de letra del libro, y estar clavado en un valor fijo fue justo el
   defecto que se arregló en su día. Y la pila es de sistema a propósito: una
   fuente web no cargaría dentro del SVG del pliegue y la caja de la foto
   saldría de otro alto que la de la hoja viva. */
.gl{ font-family:'Segoe UI','Avenir Next',-apple-system,'Noto Sans',Roboto,
                 'Helvetica Neue',Arial,sans-serif;
     font-size:var(--fs-glosa, calc(var(--fs,15px) * .93)); line-height:1.35;
     border-radius:3px; padding:2px 6px; white-space:pre-wrap; box-sizing:border-box; }
/* El hueco de giro: la caja se estrecha 4px por lado para que sus esquinas
   tengan a dónde asomarse. Sin esto, .pg-margin las recorta. */
.gl-margin{ position:absolute; left:4px; width:calc(100% - 8px); }
.gl-below { margin:4px 5px 5px 14px; }
.gl-foot  { margin:0 5px 3px 0; break-inside:avoid; }
/* EL ANCLA Y LA ETIQUETA SALEN DE LA FAMILIA DE LA NOTA, y eso es el cambio.

   Las tres partes de una glosa —ancla, nota, etiqueta— venían distinguidas solo
   por PESO y OPACIDAD, que son los dos recursos más débiles que hay: sobre
   tinte claro la negrita apenas oscurece, y la opacidad no dice «otra clase de
   cosa», dice «lo mismo pero apagado». De ahí que la etiqueta se leyera como el
   final de la frase: «Esta es otra glosa. #Interesante».
   La nota es lo que escribió una mano. El ancla y la etiqueta son APARATO: lo
   que el programa sabe de esa nota. Se separan por TAMAÑO, PESO y SITIO —.85em
   en negrita el ancla, .78em a media asta y en su renglón la etiqueta—, que es
   una escalera que se lee de un vistazo.
   La familia no se repite aquí: la pone .gl y estos la heredan. Escribirla otra
   vez sería una copia que puede quedarse atrás el día que .gl cambie. */
.gl-ref{ font-size:.85em; font-weight:700; padding-right:5px; }
/* LA ETIQUETA, EN SU RENGLÓN Y A LA DERECHA.
   Renglón propio porque nada que comparta renglón con la última palabra de la
   frase deja de leerse como la frase; el tamaño y el color no arreglan
   gramática, el salto de línea sí. Y a la derecha porque la prosa va en bandera
   izquierda: lo que queda a ras del filo derecho se lee como sello, no como
   continuación de la oración. De paso, alineada a la derecha ya no puede
   desbordarse por la derecha.
   Sin pastilla: las pastillas de este programa son los chips del filtro, o sea
   «esto se toca». Un rótulo que se consulta no debe vestirse de control. */
.gl-tag{ display:block; margin-top:3px; text-align:right; padding-right:2px;
         font-size:.78em; line-height:1.25; font-weight:500; letter-spacing:.02em; }
.gl-tag .gl-t{ padding-left:7px; }
/* El contador de citas del índice era también .gl-tag y no es una etiqueta: con
   la etiqueta convertida en bloque a la derecha se habría ido de renglón. */
.gl-cuenta{ font-size:.78em; padding-left:5px; opacity:.55; }
/* LA REFERENCIA QUE SE ESTÁ BUSCANDO. Un salto entre libros no es gratis:
   hay que rearmar el plano del libro destino y volver a paginarlo entero, y
   con el Nuevo Testamento cargado eso se siente. Antes no pasaba nada en la
   pantalla y el clic parecía perdido.

   El latido va en la referencia misma —justo donde pusiste el dedo— y NO se
   parece al destello de llegada: aquél son tres pulsos naranjas sobre el
   texto y se apaga; éste es un respiro dorado sobre el enlace y sigue hasta
   que la hoja se voltea. Uno dice "voy", el otro dice "aquí es". */
.ref{ cursor:pointer; border-bottom:1px dotted currentColor; border-radius:2px; }
/* La rampa dorada de antes de saltar ya no vive en la referencia: tocarla
   abre la ventanita de leer, que es instantánea, y el salto lo dispara el
   texto de esa ventanita. La rampa se fue con él. Lo que sigue valiendo es
   por qué se pinta cuadro por cuadro desde el guion y no con una transición
   de CSS: el cálculo del salto bloquea el hilo, y la transición se congelaría
   en su primer fotograma, que es el transparente. Por eso la rampa corre
   ANTES de arrancar el cálculo. */
.ref.muerta{ opacity:.45; border-bottom-style:dashed; cursor:default; }
.vn.back{ color:#8a7048; font-weight:400; padding-left:3px; cursor:pointer; }
/* El fondo del recuadro es el mismo tono del resaltado al 42% de su alfa
   (ver FILL_ALFA): aquí se necesita menos color porque el borde ya delimita
   la nota. Van escritos a mano y no calculados porque PAGE_CSS se arma antes
   de que existan las constantes; si tocas FILL_ALFA, toca también estos. */
.g-yellow{ border:1px solid #c9a227; background:rgba(255,214,64,.19); color:#6d5410; }
.g-green { border:1px solid #3a8f4f; background:rgba(94,196,110,.08); color:#235c31; }
.g-blue  { border:1px solid #1d6f9c; background:rgba(86,182,238,.08); color:#0f4b6b; }
.g-orange{ border:1px solid #9c4708; background:rgba(242,105,20,.07); color:#6e3406; }
/* LA ETIQUETA SE ACLARA CON UN COLOR, NUNCA CON opacity, y esto arregla además
   un defecto que ya estaba puesto. medirPalabras se lleva al lienzo el color
   calculado pero NO la opacidad, así que .gl-tag{opacity:.62} se veía al 62% en
   la hoja viva y al 100% en la foto del pliegue: la etiqueta cambiaba de tono
   al voltear la hoja. Un rgba en la propia tinta sí viaja, porque llega dentro
   del color. */
.g-yellow .gl-tag{ color:rgba(109, 84,16,.72); }
.g-green  .gl-tag{ color:rgba( 35, 92,49,.72); }
.g-blue   .gl-tag{ color:rgba( 15, 75,107,.72); }
.g-orange .gl-tag{ color:rgba(110, 52, 6,.72); }

/* En la foto el texto va transparente: los glifos los dibuja el lienzo en
   las coordenadas medidas de la hoja real. Va AL FINAL y con !important a
   propósito: .cap, .vn y las glosas declaran su propio color, y sin esto
   ganaban por especificidad y se pintaban dos veces —una el SVG y otra el
   lienzo. Eso era el número de capítulo "doble". */
.sin-tinta, .sin-tinta *{ color:transparent !important; }
`;

/* El rojo salió de la paleta: se lo quedó, en exclusiva, el subrayado
   punteado del anclaje dudoso. Un color que solo significa una cosa avisa
   mejor que uno que además es decorativo. En su lugar entra el naranja, a
   23° de matiz — 24° del amarillo, que es la distancia mínima cómoda. */
const COLORS = ['yellow','green','orange','blue'];   /* este es el orden en que salen los botones */
const nextColor = c => COLORS[(COLORS.indexOf(c)+1) % COLORS.length];
/* El azul era rgb(90,140,230): matiz 219°, ya con un pie en el morado.
   Este es azul cielo de verdad —matiz 200°— y de paso deja de pelearse
   con el rojo por parecer el mismo color frío. Al ser más claro necesita
   más alfa para pesar lo mismo que los otros tres: .18 contra .13. */
const FILL_RGB = {yellow:'255,214,64', green:'94,196,110', blue:'86,182,238', orange:'242,105,20'};
const LINE_HEX = {yellow:'#c9a227', green:'#3a8f4f', blue:'#1d6f9c', orange:'#9c4708'};
/* El trazo del subrayado va en el color del resaltado, no en el oscuro de
   los bordes: así la marca de línea y la de relleno se leen como la misma

   #ffd640 el trazo se pierde contra el papel crema— y se hunde a ámbar.
   El oscuro sigue vivo en el recuadro de la glosa y en los botones. */
const TRAZO_HEX = {yellow:'#edb200', green:'#4fb862', blue:'#2b9fd4', orange:'#e2650c'};
/* El resaltado del texto y el fondo del recuadro de la glosa son el mismo
   tono; lo único que cambia es cuánto. Las alfas no son parejas a propósito:

const FILL_ALFA = {yellow:.45, green:.19, blue:.18, orange:.17};   /* el naranja va a propósito un punto por encima del peso común */
const lavado = c => 'rgba(' + FILL_RGB[c] + ',' + FILL_ALFA[c] + ')';
const GRUESO_TRAZO = 2.6;

let marcas = [];                 // ver el modelo en crearMarca()

/* La última etiqueta usada se guarda entre sesiones para poder salir en

let etiquetasOcultas = new Set(); /* ya no filtra: se queda por si algo viejo lo nombra */
let etiquetasVer = new Set();     /* chips marcadas en VER; vacío = ver todas */
/* Libros que se están mirando en la lista de glosas. Vacío significa "solo el

let librosFiltro = new Set();
let diaFiltro = '';              // '' = todos los días
let showMarks = true, fontSize = 15, fontSizeGlosa = 14;
/* EL SEPIA. Va de 0 a 100 y mueve papel y tinta juntos, no solo el fondo:
   entintar el papel y dejar la letra negra encima da una foto con filtro, no
   una hoja vieja. En papel amarillento la tinta también envejece hacia el
   marrón, así que las dos puntas se interpolan a la vez.
   Los extremos están elegidos para que el contraste aguante: el papel más
   entintado sigue siendo claro y la tinta sigue siendo oscura. No es un tema
   oscuro disfrazado —para eso haría falta pensar aparte todos los colores de
   las glosas— sino el mismo papel, más cálido. */
const PAPEL = [[250,247,241], [232,211,172]];
const TINTA = [[ 36, 31, 26], [ 59, 43, 24]];
/* LOS DOS RÓTULOS VIAJAN CON EL SEPIA, como el papel y la tinta.

   Eran lo ÚNICO de la hoja que no lo hacía: llevaban un color fijo, así que
   según entintas el papel se le van acercando hasta desaparecer. Medido con
   los colores de antes —#a98f57 y #c0ac86— el titulillo caía de 2.91 a 2.12 de
   contraste y el del pie de 2.07 a 1.51. El del pie ya estaba mal con papel
   BLANCO: no era un problema del sepia, el sepia solo lo destapó.

   PRIMERO SE RESOLVIÓ MAL, y la corrección enseña más que el resultado. La
   primera versión clavaba el contraste WCAG a lo largo del deslizador: 5.5
   arriba y 4.5 abajo, planos. Pero el ratio de WCAG es un cociente de
   luminancias, y oscurecer papel y rótulo al mismo ritmo lo deja casi intacto
   POR CONSTRUCCIÓN. O sea que el número estaba plano porque no podía hacer
   otra cosa, no porque el contraste de verdad lo estuviera. Medido en APCA,
   que sí modela lo que ve el ojo, aquellos colores caían de Lc 75.1 a 64.0 el
   titulillo y de 69.1 a 58.6 el del pie: once puntos de contraste percibido
   que el número vigilado no veía.

   Y HABÍA UN SEGUNDO FALLO, DE MATIZ. En sepia 0 el papel es casi neutro
   —croma .009 en OKLCH— y la tinta del cuerpo también, .012. Aquellos rótulos
   iban a .069 y .076: seis veces el croma de la tinta, y catorce grados de
   matiz más hacia el amarillo. Sobre papel blanco eso no lee como tinta
   suave, lee como ORO, un adorno o un enlace. Peor: su croma BAJABA según el
   papel subía el suyo, así que el rótulo era más dorado justo donde el papel
   era más neutro y menos había con qué disimularlo.

   Los de ahora tienen la mitad de croma —.033 y .038 en blanco— y crecen con
   el papel en vez de contra él, hasta .048 y .052 en sepia 100. Siguen siendo
   cálidos, dejan de ser oro. Ganan además en los dos contrastes a la vez, en
   todo el recorrido: WCAG 5.59-5.99 y 4.79-5.10, y APCA Lc 75.2-65.5 y
   70.7-61.4. Interpolar en recta de sRGB basta: comparado con el arco en
   OKLCH, el peor punto del sistema se separa .0026 de ΔE, un orden de
   magnitud por debajo de lo perceptible.

   LOS DOS NÚMEROS NO SON IGUALES A PROPÓSITO. La jerarquía de la página es
   texto > titulillo > pie, y se cumple en los 101 pasos con las dos medidas.
   El titulillo dice dónde estás y se busca; el del pie dice en qué traducción
   lees, que se consulta una vez.

   LO QUE ESTO NO ARREGLA, y conviene que quede escrito. El del pie mide 9 px
   en escritorio, y por debajo de 14-15 px la tabla de APCA no habilita texto
   de contenido con NINGÚN color: su fallo de fondo es de tamaño, no de tinta.
   Y en sepia 100 el papel deja el cuerpo del texto en Lc 75.7, justo en el
   mínimo para texto corrido: ahí ni ennegreciendo la tinta se llega al valor
   cómodo, porque el techo lo pone el papel. Las dos cosas son decisiones
   aparte —una repagina, la otra cambia la rampa del sepia entera— y ninguna se
   toca aquí. */
const ROTULO_CAB = [[112, 97, 79], [ 91, 72, 45]];
const ROTULO_PIE = [[124,107, 86], [103, 82, 52]];
/* EL SEPIA ARRANCA EN EL TOPE, no en cero. Un papel blanco de pantalla es el
   de un documento, no el de un libro; con el riel arriba el papel queda en un
   crema cálido y la tinta se va al marrón con él —los dos a la vez, que es lo
   que distingue una hoja vieja de una foto con filtro—. Es solo el ARRANQUE:
   quien lo mueva en Formato guarda el suyo y cargarAjustes se lo devuelve,
   incluido el cero.

   ESTUVO EN 75 Y AHORA ESTÁ EN 100, que es el extremo de la rampa. Vale la
   pena dejar escrito lo que eso cuesta, porque está medido unas líneas más
   arriba y sigue siendo verdad: en sepia 100 el papel deja el cuerpo del
   texto en Lc 75.7, el mínimo de la tabla de APCA para texto corrido. Ahí el
   techo lo pone el papel y ennegrecer la tinta no lo levanta.
   Lo que sí lo levanta es el riel de al lado: el contraste arranca en 125 y
   separa papel y tinta después de mezclarlos, así que el arranque de fábrica
   NO es el 75.7 pelado. Los dos números se eligieron juntos y conviene
   moverlos mirándose: bajar el contraste a 100 con el sepia en el tope
   devuelve la hoja justo a ese mínimo. */
let sepia = 100;
/* EL CONTRASTE ARRANCA EN 125, y no en el 100 que sería "no tocar nada".

   100 es el valor neutro —el filtro no hace nada— y fue el arranque el primer
   día, con el argumento de que el papel y la tinta ya están calibrados por la
   rampa del sepia de aquí arriba. El argumento sigue siendo cierto y aun así
   el arranque cambió: un cuarto más de contraste despega la letra del papel
   sin volverlo blanco de documento, que es lo que este riel vino a resolver.
   Quien prefiera el neutro lo tiene a un tirón, y su 100 se guarda como
   cualquier otro número.

   OJO CON LO QUE ESTO ARRASTRA: este 125 es también el respaldo de
   cargarAjustes, así que unos ajustes guardados ANTES de que el riel
   existiera —que no traen el campo— abren en 125 y no en 100. Es a propósito:
   el arranque es el arranque para todos, y quien ya había elegido un número
   lo tiene guardado y no pasa por aquí.

   Se guarda en por ciento y no en factor porque en por ciento es como se lee
   y como se enseña en el riel; la división entre cien la hace un solo sitio,
   aplicarFiltros, para que no haya dos versiones del mismo número.
   50 y 200 son los topes del riel, y se vuelven a comprobar en el manejador y
   al cargar los ajustes: el riel es la puerta normal, no la única.
   NO ENTRA EN estiloFirma. La firma decide si la foto del pliegue sigue
   sirviendo, y esta foto sirve igual: el contraste no se hornea en ella, cae
   encima del lienzo por CSS. Meterlo ahí rehornearía la hoja entera en cada
   paso del riel para llegar al mismo píxel. */
let contraste = 125;
/* EL BRILLO ARRANCA EN 100, y aquí el 100 sí es el neutro de verdad: el riel
   no compensa nada, sólo sube o baja la luz de lo que ya está pintado. Quien
   no lo toque ve exactamente lo de siempre.
   50 y 150 son los topes, más estrechos que los del contraste a propósito: por
   debajo de 50 la hoja se apaga hasta dejar de leerse y por encima de 150 el
   papel se quema y se lleva la letra con él. Se vuelven a comprobar en el
   manejador y al cargar los ajustes.
   NO ENTRA EN estiloFirma, por lo mismo que el contraste: no se hornea en la
   foto del pliegue, cae encima del lienzo por CSS. */
let brillo = 100;
/* UNA SOLA FUNCIÓN PARA LOS DOS, y no dos que se pisen. Los dos efectos viven
   en la MISMA declaración filter del CSS —tienen que, o la segunda borra a la
   primera— así que aquí se escriben sus dos variables juntas: quien mueva un
   riel deja la variable del otro intacta, y el navegador recompone la cadena
   con lo que haya en cada una. Con una función por riel escribiendo cada una
   su propia propiedad filter, mover uno apagaría al otro. */
const aplicarFiltros = () => {
  const v = document.documentElement.style;
  v.setProperty('--contraste', (contraste / 100).toFixed(2));
  v.setProperty('--brillo',    (brillo    / 100).toFixed(2));
};
const mezclar = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = a => 'rgb(' + a.join(',') + ')';
const papelRGB = () => mezclar(PAPEL[0], PAPEL[1], sepia / 100);
const colorPapel = () => rgb(papelRGB());
const colorTinta = () => rgb(mezclar(TINTA[0], TINTA[1], sepia / 100));
const colorRotuloCab = () => rgb(mezclar(ROTULO_CAB[0], ROTULO_CAB[1], sepia / 100));
const colorRotuloPie = () => rgb(mezclar(ROTULO_PIE[0], ROTULO_PIE[1], sepia / 100));
/* EL REVÉS DE LA HOJA Y EL BONCHE. El pliegue se dibuja en un lienzo, no en
   el DOM, así que no ve --papel: sus tonos estaban escritos a mano. Con el
   sepia puesto, arrastrar el filo enseñaba un revés casi blanco girando
   contra una hoja marrón. Los tres sitios que revisé al poner el sepia eran
   los del DOM; este es un cuarto, y de otra especie.
   Se guardan como FACTORES del papel, no como colores: así el revés sigue
   siendo el mismo papel un punto más apagado —que es lo que lo distingue de
   la cara— en cualquier punto del riel. Los tres números de cada terna salen
   de dividir el color viejo entre el papel viejo, de modo que en sepia 0 sale
   exactamente lo que salía antes: 250x.976=244, y así las nueve. */
const REVES  = [.976, .968, .946];   /* la cara de atrás, con la tinta detrás */
const BONCHE = [.956, .939, .905];   /* las hojas del manojo, más apagadas */
const FONDO  = [.956, .943, .913];   /* el respaldo cuando no hay foto debajo */
const tono = f => rgb(papelRGB().map((v, i) => Math.round(v * f[i])));
/* Solo tipos de letra del SISTEMA: la hoja se rasteriza dentro de un SVG
   para poder doblarla, y ahí las fuentes web no cargan. Una fuente que se
   viera bonita en pantalla y distinta en la foto delataría el truco. */
const FUENTES = [
  ['Georgia',  "Georgia,'Times New Roman',serif",                    'serif de pantalla'],
  ['Palatino', "'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif", 'serif clásico'],
  ['Cambria',  "Cambria,Charter,Georgia,serif",                      'serif para leer'],
  ['Times',    "'Times New Roman',Times,serif",                      'serif tradicional'],
  ['Verdana',  "Verdana,Geneva,sans-serif",                          'sans muy legible'],
  ['Segoe',    "'Segoe UI',Tahoma,Geneva,sans-serif",                'sans compacta']
];
let fuente = FUENTES[0][1];
/* Los cuatro ajustes de espaciado, cada uno con su interruptor. El
   justificado en columna angosta abre huecos porque no tiene de dónde
   repartir; los guiones son lo que lo salva, por eso van aparte: puedes
   quererlos con alineación a la izquierda, o justificar sin ellos. */
let alineacion = 'left';      // 'left' | 'justify'
/* Los guiones quedaron fuera: una palabra partida ocupa dos rectángulos
   y el dibujado por palabra no puede colocarla. Es el precio de que la
   foto coincida siempre. */
const guionesOn = false;
/* TRES INTERLÍNEAS, y la de en medio es la de fábrica. La reducida no es un
   capricho de densidad: en un teléfono, dos puntos menos de aire son un par de
   versículos más por hoja, y pasar menos hojas para leer un capítulo cambia
   cómo se lee. 1.38 es lo más apretado que aguanta un texto con números de
   versículo volados encima sin que los renglones se toquen. */
const AIRES = [['reducida', 1.38], ['normal', 1.62], ['amplia', 1.95]];
let interlineado = 1.62;
/* Los márgenes SÍ son una variable independiente: cambian el ancho del
   texto sin tocar el número de columnas. El "ancho de columna" no lo es
   —ya lo mueven las columnas, el ancho de hoja y el tamaño de letra. */
const MARGENES = [['angostos',10], ['normales',18], ['amplios',40]];
let margen = 1;

/* UNA sola firma con todo lo que afecta al acomodo. Antes había seis
   variables sueltas y dos veces se me olvidó copiar una a la foto; con la
   firma, agregar un ajuste nuevo no puede quedarse a medias. */
/* El sepia entra en la firma o la foto se queda con el color anterior: la
   firma es lo único que decide si la foto guardada todavía sirve, y una hoja
   del color de antes girando sobre la mesa de ahora se nota igual que si
   cambiara de letra. */
const estiloFirma = () => [fontSize, fontSizeGlosa, columns, fuente, alineacion, guionesOn,
  interlineado, margen, version, sepia, pg.offsetWidth].join('|');
/* Lo que va en el CONTENEDOR de la hoja, no en el cuerpo: tipo de letra y
   márgenes. Va aparte porque son propiedades de .pg, y tiene que llamarse
   en los TRES lugares donde se compone una hoja —la real, el mapa de
   páginas y la foto del pliegue. Olvidarlo en uno solo hace que la foto
   salga con otra letra, que es exactamente lo que pasó. */
function prepararHoja(el, w, h){
  if (w != null){ el.style.width = w + 'px'; el.style.height = h + 'px'; }
  el.style.setProperty('--fam', fuente);
  el.style.setProperty('--mx', MARGENES[margen][1] + 'px');
  /* El sepia entra por aquí justamente porque este es el sitio que ya se
     llama en los tres lados. La foto del pliegue no pasa por aquí —se arma
     sola en buildSVG— y allá se repite; es la única copia, y va marcada. */
  el.style.setProperty('--papel', colorPapel());
  el.style.setProperty('--tinta', colorTinta());
  el.style.setProperty('--rot-cab', colorRotuloCab());
  el.style.setProperty('--rot-pie', colorRotuloPie());
  /* --fs se ponía solo en el cuerpo, y las glosas del margen y del pie son
     hermanas suyas, no hijas: allí no llegaba. Se pone en la hoja entera, que
     es el ancestro común de las tres, y así la nota mide lo que mide el texto
     esté donde esté. */
  el.style.setProperty('--fs', fontSize + 'px');
  el.style.setProperty('--fs-glosa', fontSizeGlosa + 'px');
}
function aplicarEstilo(bodyEl){
  const v = bodyEl.style;
  v.setProperty('--fs', fontSize + 'px');
  v.setProperty('--fs-glosa', fontSizeGlosa + 'px');
  v.setProperty('--cols', columns);
  v.setProperty('--ali', alineacion);
  v.setProperty('--guion', guionesOn ? 'auto' : 'none');
  v.setProperty('--lh', interlineado);
}
const estiloEnLinea = () =>
  'font-size:' + fontSize + 'px;--fs:' + fontSize + 'px;--fs-glosa:' + fontSizeGlosa + 'px' +
  ';column-count:' + columns + ';--cols:' + columns +
  ';text-align:' + alineacion + ';--ali:' + alineacion +
  ';hyphens:' + (guionesOn?'auto':'none') + ';-webkit-hyphens:' + (guionesOn?'auto':'none') +
  ';--guion:' + (guionesOn?'auto':'none') +
  ';line-height:' + interlineado + ';--lh:' + interlineado;
let columns = 2, placement = 'margin';   // arranca en hoja ancha, dos columnas, glosa al margen
let placementTocado = false;
let plano = [], startIdx = 0, nextIdx = 0;
/* De dónde saliste, para el botón de regreso. Guarda el LIBRO además de la
   hoja: un número de hoja sin libro no significa nada en cuanto una glosa
   puede mandarte de Apocalipsis a Mateo. */
let volverA = null;              // {libro, hoja} o null
let curMW='0px', curGap='0px', curMarginHTML='', curFootHTML='';
let RES = new Map(), REFS = new Map(), TINT_V = new Map();

/* Las marcas guardadas antes del cambio de paleta dicen 'red'. Se traducen
   al entrar —desde el almacenamiento y desde un archivo importado— porque el
   color viaja hasta el nombre de la clase CSS: una marca con color 'red'
   pediría .f-red, que ya no existe, y se pintaría sin resaltar ninguno. */
const RENOMBRES = {red:'orange'};
const alDia = m => { if (m && RENOMBRES[m.color]) m.color = RENOMBRES[m.color]; return m; };
/* NUNCA existió, que no es lo mismo que estar vacía: si borraste todas tus
   glosas a propósito, la clave queda en '[]' y hay que respetarlo. Solo se
   siembran ejemplos cuando esto es una instalación recién estrenada. */
let primeraVez = false;
try {
  const r = localStorage.getItem(KEY);
  if (r) marcas = JSON.parse(r).map(alDia);
  else primeraVez = true;
} catch(e){}
/* Si el guardado falla —cuota llena, almacenamiento bloqueado— hay que
   DECIRLO. Tragarse el error deja al lector creyendo que sus glosas
   están a salvo cuando no lo están. */
let avisoGuardado = false;
/* QUÉ DE UNA MARCA PUEDE MOVER UN CORTE DE HOJA. Solo una cosa: que la nota
   ocupe renglones en el cuerpo del texto. Y eso pide dos condiciones a la vez
   —que la disposición no sea "al margen", donde la nota va en position:absolute
   y no estorba, y que la nota TENGA texto, porque verseHTML solo pinta la glosa
   si hay algo que pintar (m.nota && visible(m))—.
   La segunda faltaba, y era la que importaba de verdad. Crear una glosa nueva
   la crea VACÍA: el editor se abre después, para que escribas. Así que el gesto
   de crearla no cambia ni un renglón del cuerpo, y aun así se repaginaba el
   libro entero. Medido con la CPU frenada a la cuarta parte, que es más
   parecido a un teléfono: 15562 ms para llegar exactamente al mismo reparto.
   La firma lleva el texto de la nota y las etiquetas que se pintan junto a
   ella, no solo su presencia, porque dos notas distintas del mismo largo —o una
   etiqueta larga— parten los renglones en sitios distintos y pueden mover el
   corte. Y lleva visible(), porque una nota escondida por el filtro de etiquetas
   no se pinta y por tanto no ocupa. */
function firmaDelCuerpo(){
  if (placement === 'margin') return '';
  let f = '';
  for (const m of marcas) if (m.nota && visible(m)){
    const etiquetas = (m.etiquetas||[]).join('\u0003');
    f += m.id + '\u0001' + m.nota + '\u0002' + etiquetas + '\u0004';
  }
  return f;
}
let firmaCuerpo = '';
const save = () => {
  /* GUARDAR NO SIEMPRE OBLIGA A REPAGINAR, y creer que sí costaba tres
     segundos por marca. Aquí se ponía la bandera siempre, y con ella la
     siguiente pintada recalculaba dónde corta cada hoja del libro entero —y
     como la paginación va sincronizada entre versiones, una vez por cada
     versión cargada—.
     Con las glosas AL MARGEN ese trabajo llega siempre al mismo resultado que
     ya estaba guardado: las notas van en position:absolute dentro de su propia
     columna, no ocupan alto en el cuerpo del texto, así que ninguna marca
     puede mover un corte de hoja. Medido: 3.2 segundos por marca antes, 17
     milisegundos ahora, y el reparto de páginas sale idéntico.
     Abajo o al pie es otra cosa: ahí la nota SÍ ocupa renglones y el corte se
     mueve de verdad, así que la bandera se pone y se repagina.

     La regla, por si vuelve a aparecer: la bandera de "recalcular" no la debe
     poner el sitio donde ocurre el cambio, sino el que sabe si ese cambio
     afecta al cálculo. save() sabe que algo cambió; lo que decide es si el
     dato que cambió participa en el flujo que se está invalidando.

     Los demás caminos que sí mueven los cortes ya ponen la bandera por su
     cuenta y siguen intactos: cambiar de disposición —que es el caso que
     importaba comprobar, porque pasar de margen a abajo con marcas ya
     guardadas tiene que repaginar—, de versión, de columnas, de letra, de
     interlínea, apagar las marcas y redimensionar la ventana. */
  const firma = firmaDelCuerpo();
  if (firma !== firmaCuerpo){ firmaCuerpo = firma; paginasSucias = true; }
  try {
    localStorage.setItem(KEY, JSON.stringify(marcas));
    avisoGuardado = false;
  } catch(e){
    if (!avisoGuardado){
      avisoGuardado = true;
      readout.textContent = 'NO SE PUDO GUARDAR (' + (e.name || 'error') + ') — exporta tus glosas';
    }
  }
};

const $ = id => document.getElementById(id);
const stage=$('stage'), pg=$('pg'), pgBody=$('pgBody'), pgMargin=$('pgMargin'), pgFoot=$('pgFoot');
const ghost=$('ghost'), ghostBody=$('ghostBody'), ghostMargin=$('ghostMargin'), ghostFoot=$('ghostFoot');
const fx=$('fx'), ctx=fx.getContext('2d'), readout=$('readout');
/* Se intercepta la ESCRITURA de textContent en vez de cambiar los cien sitios
   que le escriben. Así cualquier aviso, venga de donde venga, aparece y se
   desvanece solo — y si mañana se agrega otro mensaje, hereda el
   comportamiento sin que nadie se acuerde de pedirlo. */
(function avisoQueSeVa(){
  const dentro = document.createElement('span');
  readout.appendChild(dentro);
  let reloj = null;
  Object.defineProperty(readout, 'textContent', {

    set(t){

         estás leyendo arriba: para cuando bajas la vista, tres segundos ya se
         habían consumido en el viaje. Y varios avisos dicen cosas que hay que
         alcanzar a leer enteras —"por ahora una marca no puede cruzar de
         versículo"— no solo a notar de reojo. */

})();
const edgeR=$('edgeR'), edgeL=$('edgeL');
const ajustes=$('ajustes'), etiquetas=$('etiquetas');
const HL_API = !!(window.CSS && CSS.highlights);

/* Cuántos caracteres caben en una línea. La medida cómoda para leer ronda
   45–75; fuera de ahí el ojo se pierde al saltar de renglón (muy larga) o
   tropieza (muy corta). Se mide de verdad con el tipo y tamaño actuales,
   no con una regla de dedo. */
const medidor = document.createElement('canvas').getContext('2d');
function medidaLinea(){
  medidor.font = fontSize + 'px ' + fuente;
  const muestra = 'en el principio creo Dios los cielos y la tierra de nada';
  const porChar = medidor.measureText(muestra).width / muestra.length;
  const anchoCol = (pgBody.clientWidth - (columns - 1) * 15) / columns;
  return Math.max(1, Math.round(anchoCol / porChar));
}
const SPAN_MARKS = !HL_API;

/* ---------- texto ---------- */
const capsDe = (v, libro) => D.versiones[v].texto[libro || LIBRO];
const versoTexto = (v, cap, vers, libro) => {
  const caps = capsDe(v, libro); if (!caps) return '';
  const c = caps[cap]; return c ? (c[vers-1] || '') : '';
};
const hayLibro = id => !!D.versiones[version].texto[id];
/* EL PLANO SE GUARDA, Y ESA ES LA MITAD DEL COSTE DE CAMBIAR DE LIBRO.

   Armar el plano de un libro es recorrer sus capítulos y crear un objeto por
   versículo: barato de una vez, carísimo repetido. Y se repetía muchísimo. La
   paginación sincronizada llama a planoDe UNA VEZ POR HOJA Y POR VERSIÓN para
   poder maquetar cada corte en todas las traducciones a la vez; con Mateo, que
   son unas sesenta hojas, y cuatro versiones, eso son doscientas cuarenta
   reconstrucciones del mismo puñado de listas. Encima versionesSincronizables
   arma otras cinco cada vez que se la pregunta.

   Con la memoria puesta se arma uno por versión y por libro, y ya. Se guarda
   por libro y se tira entero al cambiar de libro: guardar los sesenta y seis
   sería quedarse con la Biblia entera duplicada en objetos para no volver a
   hacer un trabajo que solo se hace al llegar a un libro nuevo. */
const memoPlano = new Map();
let libroDelMemo = null;
function planoDe(v, libro){
  const cual = libro || LIBRO;
  if (libroDelMemo !== cual){ memoPlano.clear(); libroDelMemo = cual; }
  const clave = v + '|' + cual;
  const guardado = memoPlano.get(clave);
  if (guardado) return guardado;
  const salida = [], caps = capsDe(v, cual);
  if (caps)
    for (const cap of Object.keys(caps).map(Number).sort((a,b)=>a-b))
      caps[cap].forEach((t, i) => salida.push({ cap, vers: i+1, texto: t }));
  memoPlano.set(clave, salida);
  return salida;
}
/* El plano vivo se copia del guardado. Tiene que ser una COPIA: la paginación
   le da la vuelta a `plano` para maquetar en otras versiones y lo devuelve al
   terminar, pero quien lo reciba puede quedárselo, y una lista compartida que
   alguien ordene o recorte por su cuenta se llevaría por delante la memoria. */
function rehacerPlano(){ plano = planoDe(version).slice(); }

/* Versiones que se pueden paginar a la par: solo las que traen el mismo
   libro con la misma cantidad de versículos. Si una tradición numera
   distinto, se queda fuera en vez de descuadrar todo. */
/* También se guarda: la respuesta no cambia mientras no cambien el libro ni la
   versión, y comprobarla cuesta recorrer todos los versículos de todas las
   traducciones. La paginación la preguntaba una vez por tanda; ahora que corta
   hoja a hoja la preguntaría una vez por hoja. */
let memoSinc = null, memoSincClave = '';
function versionesSincronizables(){
  const clave = version + '|' + LIBRO;
  if (memoSinc && memoSincClave === clave) return memoSinc;
  const base = planoDe(version);
  memoSinc = Object.keys(D.versiones).filter(v => {
    const p = planoDe(v);
    return p.length === base.length &&
           p.every((x,i) => x.cap === base[i].cap && x.vers === base[i].vers);
  });
  memoSincClave = clave;
  return memoSinc;
}

/* ============================================================
   ANCLAJE ROBUSTO. Cada marca guarda tres direcciones, de la más
   precisa a la más terca, y al abrir en otra versión se resuelve
   con la mejor que todavía cuadre:
     1. posición  (ini/fin) — solo vale en la versión donde se hizo
     2. cita      (texto exacto + contexto antes/después)
     3. cita normalizada (sin acentos, mayúsculas ni puntuación)
     4. el versículo completo — nunca se pierde la glosa
   Es el patrón de selectores del modelo de anotaciones de la W3C.
   ============================================================ */
function normalizar(s){
  const map = [], out = [];
  for (let i = 0; i < s.length; i++){
    const base = s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    if (/\s/.test(s[i])){
      if (out.length && out[out.length-1] === ' ') continue;
      out.push(' '); map.push(i); continue;
    }
    for (const ch of base){
      if (!/[\p{L}\p{N}]/u.test(ch)) continue;
      out.push(ch); map.push(i);
    }
  }
  return { t: out.join(''), map };
}
function buscarConContexto(texto, m){
  if (!m.cita) return -1;
  let mejor = -1, mejorPuntaje = -1, desde = 0, k;
  while ((k = texto.indexOf(m.cita, desde)) >= 0){
    const antes = texto.slice(Math.max(0, k - 24), k);
    const desp  = texto.slice(k + m.cita.length, k + m.cita.length + 24);
    let p = 0;
    for (let i = 1; i <= Math.min(antes.length, (m.antes||'').length); i++)
      if (antes.slice(-i) === (m.antes||'').slice(-i)) p = i;
    let q = 0;
    for (let i = 1; i <= Math.min(desp.length, (m.despues||'').length); i++)
      if (desp.slice(0,i) === (m.despues||'').slice(0,i)) q = i;
    if (p + q > mejorPuntaje){ mejorPuntaje = p + q; mejor = k; }
    desde = k + 1;
  }
  return mejor;
}
function buscarNormalizado(texto, cita){
  const T = normalizar(texto), C = normalizar(cita);
  if (!C.t) return null;
  const k = T.t.indexOf(C.t);
  if (k < 0) return null;
  return { ini: T.map[k], fin: T.map[k + C.t.length - 1] + 1 };
}
function resolver(m, ver){
  const texto = versoTexto(ver, m.cap, m.vers, m.libro);
  if (!texto) return null;
  if (m.versionOrigen === ver && texto.slice(m.ini, m.fin) === m.cita)
    return { ini:m.ini, fin:m.fin, grado:'exacta' };
  const k = buscarConContexto(texto, m);
  if (k >= 0) return { ini:k, fin:k + m.cita.length, grado:'cita' };
  const n = buscarNormalizado(texto, m.cita);
  if (n) return { ini:n.ini, fin:n.fin, grado:'aprox' };
  return { ini:0, fin:texto.length, grado:'versiculo' };
}
function resolverTodas(){
  RES = new Map();
  for (const m of marcas){
    const r = resolver(m, version);
    if (r) RES.set(m.id, r);
  }
  recalcularTurnos();
}

/* El turno de cada glosa dentro de su capítulo, en el orden en que se lee.
   Sirve para una sola cosa: que los giros alternen de lado.

   Primero lo até a la paridad del versículo y estuvo mal. Funcionaba solo si
   las notas caían en renglones seguidos, y las notas reales caen donde hay
   algo que comentar: si tus glosas viven en los versículos 3, 5, 7 y 9, todas
   tienen la misma paridad y salían todas ladeadas para el mismo lado, siempre.
   Cambié un amontonamiento ocasional por uno sistemático, que es peor.

   Con el turno no puede pasar: la primera nota del capítulo va para un lado,
   la segunda para el otro, sin importar en qué versículos caigan. Y sigue
   siendo estable —una glosa no cambia de giro al repintar ni al cambiar de
   hoja—, que es la regla que no se toca. Lo único que la mueve es agregar
   otra nota más arriba en el mismo capítulo. */
let TURNO = new Map();
function recalcularTurnos(){
  TURNO = new Map();
  const porCapitulo = new Map();
  for (const m of marcas){
    const k = m.libro + ':' + m.cap;
    if (!porCapitulo.has(k)) porCapitulo.set(k, []);
    porCapitulo.get(k).push(m);
  }
  for (const grupo of porCapitulo.values()){
    grupo.sort((a,b) => (a.vers - b.vers) || ((a.ini||0) - (b.ini||0)) ||
                        (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    grupo.forEach((m, i) => TURNO.set(m.id, i));
  }
}
const diaDe = m => m.creada || '(sin fecha)';
/* Una marca de otro libro no pinta aquí. Sin esta línea, Mateo 1:15 se
   dibujaba encima de Marcos 1:15: mismo capítulo y versículo, otro libro. */
/* Los filtros que NO dependen del libro, separados a propósito: la hoja los
   aplica junto con "y además es de este libro", y la lista de glosas los
   aplica junto con "y además es de alguno de los libros elegidos". */
/* Los dos se preguntan también POR SEPARADO —ver destaparLaNueva—, porque
   cuando un filtro esconde una glosa recién escrita hay que quitar el que la
   esconde y no los dos: apagar de paso un filtro que no estorbaba sería
   deshacer algo que el lector sí quería. */
const pasaDia = m => !diaFiltro || diaDe(m) === diaFiltro;
const pasaEtiquetas = m =>
  etiquetasVer.size === 0 ||
    ((m.etiquetas || []).length === 0
      ? etiquetasVer.has('(sin etiqueta)')
      : (m.etiquetas || []).some(t => etiquetasVer.has(t)));
const pasaFiltros = m => pasaDia(m) && pasaEtiquetas(m);
const visible = m => showMarks && m.libro === LIBRO && pasaFiltros(m);
/* El libro abierto SIEMPRE está en la lista, y los chips van sumando. Lo tenía
   al revés: en cuanto agregabas un libro, el actual desaparecía y la lista
   pasaba a ser solo de los elegidos. Eso contradice al propio chip, que dice
   "ver TAMBIÉN las glosas de otro libro". Además dejaba llegar a un estado
   sin salida obvia: la lista vacía de un libro sin notas, con las tuyas
   escondidas detrás de un chip que no recuerdas haber puesto. */
const enLista = m => pasaFiltros(m) &&
  (m.libro === LIBRO || librosFiltro.has(m.libro));

/* LA MARCA SE ESTIRA A LA PALABRA ENTERA.

   Nadie quiere subrayar «adre» de «padre». Marcar media palabra no es una
   intención que exista: si el dedo cogió cuatro letras de una, lo que se pedía
   era la palabra. Así que el arranque se retrocede hasta el principio de su
   palabra y el final se adelanta hasta el final de la suya.

   Y NO ES SÓLO PULCRITUD. Con el dedo la precisión de un extremo es de varios
   milímetros, y en los bordes de la hoja ni eso: el canto de pasar hoja son
   30px con touch-action:none encima del texto, así que el principio de cada
   renglón de la columna izquierda —y el final de los de la derecha— no se
   pueden tocar. Estirando a la palabra, alcanzar CUALQUIER letra de ella
   basta, y el canto deja de estorbar sin tener que encogerlo.

   Dos pasos, y el orden importa:
   · primero se RECORTA lo que sobra por fuera —espacios, comas, comillas—,
     porque una selección que acaba en un espacio no está pidiendo la palabra
     siguiente. Sin este paso, soltar el dedo un pelo pasado de la última letra
     se llevaba la palabra de al lado entera;
   · y luego se ESTIRA hacia fuera mientras haya letra pegada.
   Si entre los dos extremos no queda ni una letra —se marcó un espacio o un
   signo suelto— se devuelve lo que había: no hay palabra que estirar, y
   inventar una sería marcar algo que nadie señaló.

   Letra es \p{L} o \p{N}, no [a-z]: aquí se lee en español, y «Ezequías» o
   «Zorobabel» se parten mal con el alfabeto inglés. El guión y el apóstrofo
   quedan FUERA a propósito, o sea que cuentan como borde: en este texto no
   unen palabras, y tratarlos como letra haría que marcar una parte de
   «Jesús-Cristo» se tragara las dos. */
const LETRA_DE_PALABRA = /[\p{L}\p{N}]/u;
function aPalabrasEnteras(texto, ini, fin){
  if (typeof texto !== 'string' || !texto.length) return { ini, fin };
  let a = Math.max(0, Math.min(ini, texto.length));
  let b = Math.max(0, Math.min(fin, texto.length));
  if (a > b){ const t = a; a = b; b = t; }
  while (a < b && !LETRA_DE_PALABRA.test(texto[a])) a++;
  while (b > a && !LETRA_DE_PALABRA.test(texto[b-1])) b--;
  if (a >= b) return { ini, fin };
  while (a > 0 && LETRA_DE_PALABRA.test(texto[a-1])) a--;
  while (b < texto.length && LETRA_DE_PALABRA.test(texto[b])) b++;
  return { ini: a, fin: b };
}
function crearMarca(cap, vers, ini, fin){
  const texto = versoTexto(version, cap, vers);
  /* Aquí y no en quien llama: por este embudo pasan los dos caminos que crean
     una marca —el arrastre y el toque sobre lo apuntado— y el día que haya un
     tercero se estirará solo. */
  ({ ini, fin } = aPalabrasEnteras(texto, ini, fin));
  return {
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    libro: LIBRO, cap, vers,
    cita: texto.slice(ini, fin),
    antes: texto.slice(Math.max(0, ini-24), ini),
    despues: texto.slice(fin, fin+24),
    ini, fin, versionOrigen: version,
    estilo: 'fill', color: 'yellow',
    etiquetas: [],
    creada: new Date().toISOString().slice(0,10)
  };
}
/* Si reencuadras una marca en la versión donde estás, se reancla aquí:
   la posición se vuelve a medir y la cita se refresca. */
function reanclar(m){
  const r = RES.get(m.id); if (!r) return;
  const texto = versoTexto(version, m.cap, m.vers, m.libro);
  m.cita = texto.slice(r.ini, r.fin);
  m.antes = texto.slice(Math.max(0, r.ini-24), r.ini);
  m.despues = texto.slice(r.fin, r.fin+24);
  m.ini = r.ini; m.fin = r.fin; m.versionOrigen = version;
}

/* ---------- referencias y tintes ---------- */
/* LA NOTA QUE CUENTA AHORA MISMO. Mientras el panel está abierto, lo escrito
   vive en el textarea y no en la marca —nada se guarda hasta cerrar— así que
   para todo lo que se DERIVA de tener nota, la marca en edición parecía no
   tenerla. Y la referencia es justo eso: un «12a» se gana por ser una de las
   notas de ese versículo. Sin esto, el anticipo de una glosa nueva enseñaba un
   punto suelto donde la hoja iba a poner «1b·», y con él la sangría del primer
   renglón, que es la que decide dónde parte. */
function notaViva(m){
  if (typeof borrador !== 'undefined' && borrador && borrador.m === m){
    const ta = menu.querySelector('#glosaCaja');
    if (ta) return ta.value.trim();
  }
  return m.nota;
}
function recalcularRefs(){
  REFS = new Map(); TINT_V = new Map();
  const conNota = marcas.filter(m => notaViva(m) && visible(m))
    /* El respaldo NO es {ini:0}: era mandar al principio del versículo a
       cualquiera que el reanclaje todavía no hubiera medido, y con el anticipo
       eso se nota —la glosa que estás escribiendo se creía la primera y se
       anunciaba «1a» para acabar siendo «1b»—. La marca lleva su propio ini
       desde que nace, así que ése es el respaldo bueno. */
    .sort((a,b) => a.cap - b.cap || a.vers - b.vers ||
                   (RES.get(a.id) || a).ini - (RES.get(b.id) || b).ini);
  const cuenta = new Map(), vistos = new Map();
  for (const m of conNota){ const k = m.cap+':'+m.vers; cuenta.set(k, (cuenta.get(k)||0)+1); }
  for (const m of conNota){
    const k = m.cap+':'+m.vers, i = vistos.get(k)||0; vistos.set(k, i+1);
    REFS.set(m.id, m.vers + (cuenta.get(k) > 1 ? LETTERS[i] : ''));
    if (!TINT_V.has(k)) TINT_V.set(k, m.color);
  }
}

/* ============================================================
   REFERENCIAS DENTRO DE LAS GLOSAS. La dirección de un vínculo es la
   referencia bíblica, que ya sabes escribir: "Mc 2:27" se vuelve el
   enlace. Sin selector, sin identificadores internos, y —lo que más
   importa— sobrevive al cambio de versión, porque una referencia es
   lo único verdaderamente estable entre traducciones.
   ============================================================ */
const LIBROS_ES = {
  GEN:'génesis gn gen', EXO:'éxodo exodo ex', LEV:'levítico levitico lv lev',
  NUM:'números numeros nm num', DEU:'deuteronomio dt deut', JOS:'josué josue jos',
  JDG:'jueces jc jue', RUT:'rut rt', '1SA':'1samuel 1sa 1s', '2SA':'2samuel 2sa 2s',

  '2CH':'2crónicas 2cronicas 2cr', EZR:'esdras esd', NEH:'nehemías nehemias neh',
  EST:'ester est', JOB:'job jb', PSA:'salmos salmo sal sl', PRO:'proverbios pr prov',
  ECC:'eclesiastés eclesiastes ec ecl', SNG:'cantares cantar cnt ct',
  ISA:'isaías isaias is', JER:'jeremías jeremias jer', LAM:'lamentaciones lm lam',
  EZK:'ezequiel ez', DAN:'daniel dn dan', HOS:'oseas os', JOL:'joel jl',
  AMO:'amós amos am', OBA:'abdías abdias abd', JON:'jonás jonas jon',
  MIC:'miqueas miq mi', NAM:'nahúm nahum nah', HAB:'habacuc hab',
  ZEP:'sofonías sofonias sof', HAG:'hageo hag', ZEC:'zacarías zacarias zac',
  MAL:'malaquías malaquias mal',
  MAT:'mateo mt', MRK:'marcos mc mr', LUK:'lucas lc lu', JHN:'juan jn',
  ACT:'hechos hch hc', ROM:'romanos rm ro', '1CO':'1corintios 1co', '2CO':'2corintios 2co',
  GAL:'gálatas galatas gl ga', EPH:'efesios ef', PHP:'filipenses flp fil',
  COL:'colosenses col', '1TH':'1tesalonicenses 1ts', '2TH':'2tesalonicenses 2ts',
  '1TI':'1timoteo 1ti', '2TI':'2timoteo 2ti', TIT:'tito tt', PHM:'filemón filemon flm',
  HEB:'hebreos heb', JAS:'santiago stg', '1PE':'1pedro 1p', '2PE':'2pedro 2p',
  '1JN':'1juan 1jn', '2JN':'2juan 2jn', '3JN':'3juan 3jn', JUD:'judas jud',
  REV:'apocalipsis ap apoc'
};
const CLAVE_LIBRO = (() => {
  const m = new Map();
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[\s.]/g,'');
  for (const id in LIBROS_ES) for (const alias of LIBROS_ES[id].split(' ')) m.set(norm(alias), id);
  return { mapa: m, norm };
})();
/* Primero el número, luego se mira HACIA ATRÁS por el nombre del libro.
   Al revés no funciona: un grupo opcional al frente se traga la palabra
   anterior ("en 2:17") y tira la referencia entera.
   La coma solo cuenta sin espacios (Lc 4,18) para no confundir "los
   capítulos 2, 3 y 4" con una referencia. */
const RE_REF = /(\d{1,3})(?:\s*:\s*|,)(\d{1,3})([a-h])?/g;
const RE_LIBRO_PREVIO = /([1-3]\s?)?([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,15})\.?\s*$/;

function interpretar(m, texto){
  let libro = LIBRO, inicio = m.index;                // sin nombre: el libro actual
  const antes = texto.slice(Math.max(0, m.index - 18), m.index);
  const mb = antes.match(RE_LIBRO_PREVIO);
  if (mb){
    const id = CLAVE_LIBRO.mapa.get(CLAVE_LIBRO.norm((mb[1]||'') + mb[2]));
    if (id){ libro = id; inicio = m.index - mb[0].length; }
  }
  return { libro, cap:+m[1], vers:+m[2], letra:m[3]||'', inicio, fin:m.index + m[0].length };
}
function refsDe(texto){
  const out = [];
  RE_REF.lastIndex = 0;
  let m;
  while ((m = RE_REF.exec(texto))) out.push(interpretar(m, texto));
  return out;
}
const refExiste = r => !!versoTexto(version, r.cap, r.vers, r.libro);
/* Convierte el texto de una glosa en HTML con las referencias activas. */
function enlazar(texto){
  let out = '', ultimo = 0;
  for (const r of refsDe(texto)){
    if (r.inicio < ultimo) continue;                  // por si dos se traslapan
    out += esc(texto.slice(ultimo, r.inicio));
    /* El globo dice A DÓNDE va, con el nombre completo del libro. El texto del
       enlace es lo que tú escribiste —"Ap 22:20"— y eso está bien, pero
       entonces no hay manera de comprobar que se interpretó como querías.
       Con el globo, el texto escrito y el destino resuelto se ven por
       separado y cualquier desajuste salta a la vista. */
    const vivo = refExiste(r);
    const destino = nombreDe(r.libro) + ' ' + r.cap + ':' + r.vers +
                    (r.letra ? ' (glosa ' + r.letra + ')' : '') +
                    (vivo ? '' : ' — no está en los datos cargados');
    out += '<span class="ref' + (vivo ? '' : ' muerta') + '" data-ref="' +
           r.libro + ':' + r.cap + ':' + r.vers + ':' + r.letra + '"' +
           ' title="' + esc(destino) + '">' +
           esc(texto.slice(r.inicio, r.fin)) + '</span>';
    ultimo = r.fin;
  }
  return out + esc(texto.slice(ultimo));
}

/* Vínculos de regreso: se derivan, no se escriben. Y cuelgan del
   VERSÍCULO, no de una glosa — porque el versículo citado puede no
   tener glosa propia y el vínculo tiene que vivir en algún lado. */
let BACK = new Map(), firmaBack = '';
function calcularVinculos(){
  BACK = new Map();
  for (const m of marcas){
    if (!m.nota) continue;
    for (const r of refsDe(m.nota)){
      if (r.libro === m.libro && r.cap === m.cap && r.vers === m.vers) continue;  // autocita
      const k = r.libro + ':' + r.cap + ':' + r.vers;
      const arr = BACK.get(k) || [];
      if (!arr.includes(m)) arr.push(m);
      BACK.set(k, arr);
    }
  }
  /* Y AQUÍ SÍ HAY QUE REPAGINAR, aunque las glosas estén al margen. Es el
     hueco que le faltaba al atajo de save(): la nota vive fuera del cuerpo,
     de acuerdo, pero el contador de citas que produce —el "‹1" que verseHTML
     escribe junto al número del versículo citado— vive DENTRO. Es texto en
     línea: cambia dónde parten los renglones, y cerca del canto de una hoja
     eso mueve un corte.
     Así que save() se queda preguntando lo suyo, que es si la nota ocupa alto,
     y la otra mitad de la pregunta se responde donde se puede responder: aquí,
     que es el único sitio que sabe si los contadores cambiaron. Se compara una
     firma del mapa —quién cita a quién, y cuántos de esos se están viendo—
     porque el contador depende también de los filtros de etiqueta.
     Corre justo antes de asegurarPaginas, así que la bandera se atiende en la
     misma pintada. Y sale barato: el mapa solo tiene las notas que citan algo,
     que son pocas, y crear un subrayado o una nota sin citas no lo mueve.
     Lo encontró la revisión de Codex; mi comprobación se había quedado en que
     la glosa no ocupa alto, que era verdad pero no era todo. */
  const firma = [...BACK.keys()].sort()
    .map(k => k + '=' + BACK.get(k).filter(visible).length).join('|');
  if (firma !== firmaBack){ firmaBack = firma; paginasSucias = true; }
}
const backDe = (cap, vers) => (BACK.get(LIBRO + ':' + cap + ':' + vers) || []).filter(visible);

/* ---------- la glosa no es un rectángulo ----------
   Una nota al margen la escribió una mano, y ninguna mano traza un rectángulo
   perfecto: el recuadro queda un pelo más ancho de un lado, las esquinas no
   redondean parejo, la pluma carga más en un trazo que en otro y el papel
   nunca estuvo del todo derecho. Eso es lo que se imita aquí.

   Dos reglas que no se pueden romper. La primera: el desorden se deriva del
   id de la marca, así que es siempre el mismo —una glosa no puede bailar
   cada vez que se repinta la página, ni cambiar de forma al pasar de hoja.
   La segunda: la inclinación se queda por debajo de 0.6 grados. En la foto
   de la hoja doblada el recuadro lo pinta el SVG (ya torcido) pero las
   letras las dibuja el lienzo en horizontal; a este ángulo el desfase es de
   menos de un píxel y no se ve, pero si subiéramos a dos o tres grados se
   notaría el texto derecho dentro de una caja chueca. */
function azarDe(id){
  let h = 2166136261;
  for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}
function formaOrganica(m){
  const r = azarDe(m.id);
  const esq = () => (3 + r() * 5.5).toFixed(1) + 'px';          /* esquinas dispares */
  const radio = esq()+' '+esq()+' '+esq()+' '+esq()+' / '+esq()+' '+esq()+' '+esq()+' '+esq();
  /* +-2px de aire a los lados: poco mas de medio milimetro por lado.
     EL AIRE DE ARRIBA Y ABAJO BAJA, el de los lados no. Y aquí es donde de
     verdad se decide, no en la regla .gl de la hoja de estilos: este relleno
     se escribe en el atributo style de cada nota, así que gana siempre. Quien
     venga a estrechar la glosa y solo toque el CSS no va a mover nada —cuesta
     una tarde averiguar por qué—.
     De 2.5–3.9px a 1.6–2.7px arriba y abajo: unos 2px menos por nota, que con
     la interlínea recortada suman cerca de un renglón por glosa de tres
     líneas. La variación se queda: el recuadro tiene que seguir sin ser un
     rectángulo. Y siguen siendo cuatro llamadas a r(), ni una más ni una
     menos: el azar va sembrado con el id de la marca, así que quitar o añadir
     una corre toda la serie y cambiaría el grosor, la sombra y el giro de
     todas las glosas ya escritas. */
  const pad = (1.6 + r()*1.1).toFixed(1)+'px '+(5 + r()*3.4).toFixed(1)+'px '+
              (1.6 + r()*1.1).toFixed(1)+'px '+(5 + r()*3.4).toFixed(1)+'px';
  /* Un solo ancho de pluma para toda la glosa: el trazo puede ser mas grueso
     en una nota que en otra —otro dia, otra pluma— pero nunca dentro de la
     misma, que es lo que se veia mal. */
  const grosor = (r() < .45 ? '1.3px' : '1px');
  /* La luz de la habitacion no cambia de sitio entre una nota y otra: todas
     las sombras caen hacia abajo y a la derecha, y lo unico que varia es
     cuanto se levanto esa esquina del papel. */
  const dx = (2.4 + r()*1.9).toFixed(1), dy = (2.8 + r()*2.0).toFixed(1);
  const sombra = dx+'px '+dy+'px '+(4.5 + r()*2.5).toFixed(1)+'px -2.6px rgba(72,56,28,.30)';
  /* Aquí NO se decide el ángulo, solo las ganas: un número de -1 a 1. Cuánto
     se puede girar de verdad depende del alto de la nota, y el alto no se
     sabe hasta que el navegador la acomoda. Lo resuelve asentarGiro().

     El TAMAÑO de esas ganas sale del azar, pero el SENTIDO no: lo decide el
     turno de la nota en su capítulo (ver recalcularTurnos). El azar puro reparte 50/50 en el total y aun así
     amontona en grupos chicos —con cuatro glosas en una hoja, una de cada
     ocho hojas las tiene las cuatro para el mismo lado—, y como la sombra
     siempre cae hacia abajo-derecha, esa racha se lee como si todas
     estuvieran giradas igual. Alternando por turno no hay racha posible, y cada
     nota conserva su giro. */
  const lado = (TURNO.get(m.id) || 0) % 2 ? 1 : -1;
  const frac = (lado * (.3 + r() * .7)).toFixed(3);
  return { frac: frac,
           css: 'border-radius:'+radio+';padding:'+pad+';border-width:'+grosor+
                ';box-shadow:'+sombra+';' };
}

/* CUÁNTO SE PUEDE TORCER UNA NOTA. Tres frenos, y manda el más estricto.

   1. El asomo lateral. Al girar theta, una caja de alto h saca las esquinas
      h*sen(theta)/2 por cada costado, y ese asomo crece con el alto. Se
      reserva un hueco de 4px por lado y nadie puede pasarse de ahí; si no,
      .pg-margin recorta la nota, que era el defecto que se veía.

   2. El brinco vertical. Este es el que de verdad manda a la vista: lo que
      el ojo juzga no es el ángulo sino cuánto sube y baja la esquina, y eso
      depende del ANCHO. Una caja de 200px a 2.4 grados levanta la esquina
      4.2px —un cuarto de renglón— y se lee como error de impresión, no como
      papel anotado. El presupuesto es 1.0px, que a 200px de ancho salen 0.57
      grados. Por eso las notas del margen apenas se ladean aunque sean
      cortas: son anchas.

   3. Un tope duro de 0.75 grados, para las cajas angostas, donde los otros
      dos frenos dejarían pasar ángulos absurdos. */
const HUECO_GIRO = 4, BRINCO_GIRO = 1.0, TOPE_GIRO = 0.75;
function asentarGiro(el, frac){
  const h = el.offsetHeight || 1, w = el.offsetWidth || 1;
  const grados = x => Math.asin(Math.min(1, x)) * 180 / Math.PI;
  const cabe = Math.min(TOPE_GIRO, grados(2 * HUECO_GIRO / h), grados(2 * BRINCO_GIRO / w));
  const giro = (parseFloat(frac) * cabe).toFixed(2);
  el.dataset.giro = giro;
  el.style.transform = 'rotate(' + giro + 'deg)';
}
function asentarGlosas(raiz){
  if (!raiz) return;
  for (const el of raiz.querySelectorAll('.gl[data-frac]')) asentarGiro(el, el.dataset.frac);
}

/* ---------- markup ---------- */
/* LAS COMILLAS TAMBIÉN, porque esto se usa dentro de atributos.

   Escapaba &, < y >, que es lo que hace falta para meter texto entre etiquetas.
   Pero la mitad de las llamadas lo meten dentro de un ATRIBUTO —data-tag,
   data-bv, title, value—, y ahí una comilla doble cierra el atributo antes de
   tiempo. Una etiqueta llamada la "roca" producía esto:

     <option value="la " roca""="">la "roca"</option>

   o sea un valor cortado en «la » y dos atributos inventados. El texto lo pone
   quien usa la aplicación, así que esto no es una hipótesis: es cuestión de que
   alguien entrecomille una palabra.
   En el texto entre etiquetas, &quot; se dibuja como una comilla normal, así
   que escaparlas siempre no le cuesta nada a los demás usos. */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* PARTIR UNA ETIQUETA LARGA, Y POR QUÉ CON <wbr> Y NO CON CSS.

   «#Interesante» es un token sin un solo punto de corte, y en la columna del
   margen —240px en teléfono, pero 104 en la ventana angosta de escritorio— se
   sale de la caja; .pg-margin la recorta con su overflow:hidden y aparece
   «#Interesant». Se veía en el teléfono del autor.

   La corrección de manual sería overflow-wrap:anywhere, y AQUÍ ESTÁ PROHIBIDA:
   medirPalabras toma solo rects[0] de cada palabra, así que una palabra partida
   pierde su segunda mitad al dibujarse en la foto del pliegue. Es la misma
   restricción por la que guionesOn está clavado en false, y peor: con guiones
   el texto se movía, aquí desaparecería media etiqueta al voltear la hoja.

   <wbr> sí vale porque es un ELEMENTO: parte el nodo de texto, así que cada
   trozo pasa a ser una palabra con su propio rectángulo y el dibujado por
   palabra lo coloca bien. Un espacio de ancho cero (\u200B) no sirve: no parte
   el nodo y el \s de JavaScript no lo reconoce, o sea que reproduce el fallo.
   Se corta el texto CRUDO y se escapa cada trozo, no al revés: partir una
   cadena ya escapada puede cortar un &amp; por la mitad.

   Y OJO CON EL VIAJE AL SVG: la foto del pliegue va como data:image/svg+xml, o
   sea que la parsea un lector de XML, donde un elemento sin cerrar no es un
   vacío sino un error fatal —comprobado: con <wbr> el SVG entero dispara
   onerror y se queda sin foto, así que cualquier hoja con etiqueta larga
   perdía la animación de pasar página—. Pero cerrarlo AQUÍ no sirve de nada:
   el SVG no recibe esta cadena, recibe marginEl.innerHTML, y al serializar el
   DOM el navegador vuelve a escribir <wbr> sin cerrar SIEMPRE. Por eso el
   cierre se pone en la frontera, en aXML, justo antes de entrar al SVG.
   Lo levantó la revisión de Codex; el viaje por innerHTML salió al comprobar
   que su arreglo no bastaba.

   EL CORTE VA POR GRAFEMAS, no por unidades de UTF-16. length y slice cuentan
   unidades de 16 bits, así que una etiqueta con emoji se puede partir por la
   mitad de un par suplente; con un <wbr/> metido en medio los dos trozos ya no
   se recomponen y salen dos rombos de reemplazo. Las etiquetas las escribe el
   lector y pueden llevar lo que sea. Intl.Segmenter agrupa además los emoji
   compuestos y las tildes sueltas; Array.from vale de red porque al menos
   respeta los pares suplentes. */
const CORTE_ETIQUETA = 11;
function grafemas(t){
  try {
    if (typeof Intl !== 'undefined' && Intl.Segmenter)
      return [...new Intl.Segmenter('es', { granularity:'grapheme' }).segment(t)].map(g => g.segment);
  } catch(e){ /* a la red de abajo */ }
  return Array.from(t);
}
function etiquetaHTML(t){
  const g = grafemas(t);
  if (g.length <= CORTE_ETIQUETA) return esc(t);
  const trozos = [];
  for (let i = 0; i < g.length; i += CORTE_ETIQUETA)
    trozos.push(esc(g.slice(i, i + CORTE_ETIQUETA).join('')));
  return trozos.join('<wbr>');
}
/* Una etiqueta por span, no todas en una cadena unida con ' #'. Unidas se leen
   como una frase; separadas, como una lista. */
function etiquetasHTML(m){
  const e = m.etiquetas || [];
  return e.length ? '<span class="gl-tag">' +
    e.map(t => '<span class="gl-t">#' + etiquetaHTML(t) + '</span>').join('') + '</span>' : '';
}
function glossHTML(m, cls, style){
  const tags = etiquetasHTML(m);
  const grado = (RES.get(m.id)||{}).grado;
  const senal = (grado && grado !== 'exacta' && grado !== 'cita') ? '≈' : '';
  const forma = formaOrganica(m);
  return '<div class="gl ' + cls + ' g-' + m.color + '" data-gl="' + m.id + '"' +
         ' data-frac="' + forma.frac + '"' +
         ' style="' + forma.css + (style || '') + '"><span class="gl-ref">' + senal +
         (REFS.get(m.id)||'') + '·</span>' + enlazar(m.nota) + tags + '</div>';
}
function verseHTML(k, withMarks, below){
  const it = plano[k], base = it.texto;
  const aqui = marcas.filter(m => m.cap===it.cap && m.vers===it.vers && visible(m) && RES.has(m.id));
  let inner;
  if (!withMarks || !aqui.length){
    inner = esc(base);
  } else {
    const cortes = new Set([0, base.length]);
    for (const m of aqui){ const r = RES.get(m.id); cortes.add(r.ini); cortes.add(r.fin); }
    const pts = [...cortes].filter(p => p>=0 && p<=base.length).sort((a,b)=>a-b);
    inner = '';
    for (let i = 0; i < pts.length-1; i++){
      const s = pts[i], e = pts[i+1], seg = esc(base.slice(s,e));
      const m = aqui.find(m => { const r = RES.get(m.id); return r.ini <= s && r.fin >= e; });
      if (!m){ inner += seg; continue; }
      const g = RES.get(m.id).grado;
      const cls = 'hl ' + (m.estilo==='fill'?'f-':'b-') + m.color +
                  (g === 'aprox' || g === 'versiculo' ? ' aprox' : '');
      inner += '<span class="' + cls + '">' + seg + '</span>';
    }
  }
  const tint = TINT_V.get(it.cap+':'+it.vers);
  let html = '';
  if (it.vers === 1) html += '<span class="cap">' + it.cap + '</span>';
  /* El contador de citas lleva clase "vn" a propósito: los recorredores de
     offsets saltan esa clase, así que no altera las posiciones del texto. */
  const nb = backDe(it.cap, it.vers).length;
  const marca = nb ? '<span class="vn back" data-back="' + it.cap + ':' + it.vers +
                     '" title="citado desde otras glosas">‹' + nb + '</span>' : '';
  html += '<span class="v" data-k="' + k + '"><span class="vn' + (tint ? ' vn-'+tint : '') + '">' +
          it.vers + '</span>' + marca + inner + ' </span>';
  if (below){
    for (const m of marcas)
      if (m.nota && visible(m) && m.cap===it.cap && m.vers===it.vers) html += glossHTML(m, 'gl-below');
  }
  return html;
}

/* ---------- paginación (sirve para 1, 2 o 3 columnas) ---------- */
function cabe(bodyEl, marca){
  const c = bodyEl.getBoundingClientRect();
  for (let i = marca; i < bodyEl.childNodes.length; i++){
    const n = bodyEl.childNodes[i];
    if (n.nodeType !== 1) continue;
    for (const r of n.getClientRects()){
