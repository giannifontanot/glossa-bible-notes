              transition:opacity .22s ease, transform .3s cubic-bezier(.2,.85,.3,1); }
  #sepOferta.visible{ opacity:1; transform:translateX(-50%); }
  .so-dice{ font:600 12.5px/1.3 var(--ui); color:#4a3a1c; }
  .so-btn{ flex:0 0 auto; min-height:32px; min-width:44px; border-radius:999px;
           cursor:pointer; font:600 12.5px/1 var(--ui); letter-spacing:.04em;
           padding:8px 14px; -webkit-tap-highlight-color:transparent;
           border:1px solid rgba(140,116,68,.42); color:#6d5a2c;
           background:rgba(140,116,68,.14); }
  .so-btn:hover{ background:rgba(140,116,68,.28); color:#4d3f1d; }
  .so-btn:focus-visible{ outline:2px solid #b8892b; outline-offset:2px; }
  .so-btn.si{ border-color:rgba(184,137,43,.6); background:rgba(184,137,43,.22);
              color:#5a4413; }
  .so-btn.si:hover{ background:rgba(184,137,43,.34); }
  /* El botón del panel del rastro. Va vestido igual que el paso atrás que
     tiene al lado —son dos acciones del mismo renglón— con su cinta delante
     para que se reconozca sin leerlo. */
  /* SEPARADOR y el paso atrás comparten renglón, a la derecha, con la misma
     altura y el mismo estilo de pastilla: se leen como un par de acciones,
     no como dos piezas sueltas en filas distintas. El título queda solo
     arriba, sin pelear espacio. */
  /* LOS DOS BOTONES EN UN RENGLÓN. Cabían desde que «separador» pasó a
     llamarse «nuevo»: medido en 320 px, los dos y su hueco ocupan bastante
     menos que el panel. Se deja flex-wrap:wrap de todas formas —no para que
     parta, sino para que si algún día no cupieran bajara uno en vez de
     desbordarse el panel por el lado—. */
  .hs-acciones{ display:flex; align-items:center; justify-content:flex-end;
                flex-wrap:wrap; gap:8px; padding:0 3px 7px; }
  .hs-sep{ flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
           min-height:34px; font:600 12px/1 var(--ui); letter-spacing:.06em;
           text-transform:uppercase;
           color:#6d5a2c; background:rgba(140,116,68,.13);
           border:1px solid rgba(140,116,68,.4); border-radius:999px;
           padding:7px 13px; cursor:pointer;
           -webkit-tap-highlight-color:transparent; }
  .hs-sep:hover{ background:rgba(140,116,68,.26); color:#4d3f1d; }
  .hs-sep:active{ transform:translateY(1px); }
  .hs-sep-cinta{ flex:0 0 auto; width:8px; height:14px; background:#9b2a2a;
                 clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); }
  /* EL MANOJO. Van casi pegadas —2 px— porque lo que tienen que leerse es
     «unas cuantas cintas», no cuatro adornos sueltos: con el hueco de 6 del
     botón parecían una fila de banderitas. */
  .hs-cintas{ flex:0 0 auto; display:inline-flex; align-items:center; gap:2px; }
/* ---------- las piedras ---------- */
  /* LA CAPA NO TOCA NADA. Cubre el papel entero para poder colocar por
     porcentaje, y deja pasar todo: sin pointer-events:none se comería el
     arrastre del papel, la selección de texto y el toque que abre una glosa,
     que es todo lo que se hace en esta hoja. Las piedras se lo devuelven una
     a una, que son lo único que sí responde. */
  .piedrero{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .piedra-sitio{ position:absolute; transform:translate(-50%, -50%);
                 pointer-events:auto; display:grid; place-items:center; }
  .piedra{ display:block; width:var(--piedra-tam, 30px); height:var(--piedra-tam, 30px);
           padding:0; border:0; background:none; cursor:pointer;
           color:#7a6434; opacity:.82;
           -webkit-tap-highlight-color:transparent;
           filter:drop-shadow(0 1px 1px rgba(60,44,18,.35)); }
  .piedra svg{ display:block; width:100%; height:100%; }
  .piedra:hover{ opacity:1; }
  .piedra:focus-visible{ outline:2px solid #b8892b; outline-offset:3px; border-radius:4px; }
  /* EN EDICIÓN SE VE QUE ESTÁ VIVA: un aro alrededor y el cursor de mover. El
     aro va en el sitio y no en el botón para que no crezca con la piedra: a 54
     px un borde proporcional se vería como un marco. */
  .piedra-sitio.editando::before{
    content:''; position:absolute; inset:-9px; border-radius:50%;
    border:1.5px dashed rgba(184,137,43,.85); background:rgba(184,137,43,.1);
    animation:piedraLatir 1.9s ease-in-out infinite; }
  .piedra-sitio.editando .piedra{ opacity:1; cursor:grab; touch-action:none; }
  .piedra-sitio.editando .piedra:active{ cursor:grabbing; }
  @keyframes piedraLatir{ 50%{ border-color:rgba(184,137,43,.4); } }
  /* EL MANDO, colgado debajo de la piedra. position:absolute con el sitio
     centrado: así queda centrado bajo ella sea cual sea su tamaño. */
  .piedra-mandos{ position:absolute; top:100%; left:50%; transform:translate(-50%, 12px);
                  display:flex; gap:4px; padding:4px;
                  background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
                  border:1px solid rgba(140,116,68,.45); border-radius:999px;
                  box-shadow:0 4px 12px -6px rgba(60,40,15,.8); }
  .pm-btn{ width:30px; height:30px; display:grid; place-items:center; padding:0;
           color:#6d5a2c; background:rgba(140,116,68,.12);
           border:1px solid rgba(140,116,68,.35); border-radius:50%;
           cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .pm-btn:hover{ background:rgba(140,116,68,.28); color:#4d3f1d; }
  .pm-btn:disabled{ opacity:.3; cursor:default; }
  .pm-btn:focus-visible{ outline:2px solid #b8892b; outline-offset:1px; }
  .pm-btn svg{ display:block; width:12px; height:12px; }
  /* El manojo de formas del botón del pie, como el de las telas. */
  .hs-formas{ flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; }
  .hs-formas svg{ display:block; width:13px; height:13px; color:#7a6434; }
  .hs-sep-forma{ flex:0 0 auto; display:block; width:13px; height:13px; }
  @media (prefers-reduced-motion: reduce){
    .piedra-sitio.editando::before{ animation:none; }
  }
  @media (pointer:coarse){
    .pm-btn{ width:38px; height:38px; }
    .pm-btn svg{ width:14px; height:14px; }
  }

  /* EL PIE DEL RASTRO. Va al final y no arriba porque no compite con lo que se
     viene a hacer aquí —mirar por dónde has pasado—: se lee la lista, y si lo
     que buscabas no estaba, ahí abajo están las cintas. Pegado con sticky para
     que con el rastro largo no haya que llegar al fondo para verlo. La franja
     lo separa de la lista sin una raya dura: el degradado dice «esto ya no es
     rastro» y deja pasar por debajo lo que se está desplazando. */
  /* Dos puertas ahora, y con hueco para partir en dos renglones si la pantalla
     es muy angosta: es preferible a que una se salga del panel. */
  .hs-pie{ position:sticky; bottom:-6px; z-index:1;
           display:flex; align-items:center; justify-content:flex-end;
           flex-wrap:wrap; gap:8px;
           box-sizing:border-box; padding:11px 13px 10px; margin:5px -6px -6px;
           background:linear-gradient(to bottom, rgba(231,219,190,.86), #e2d4ad 14px, #e7dbbe);
           border-top:1px solid rgba(140,116,68,.18);
           border-radius:0 0 5px 5px;
           box-shadow:0 -15px 24px -18px rgba(74,58,28,.7); }
  .hs-sep-lista{ box-shadow:0 5px 12px -9px rgba(60,40,15,.75); }
  /* La lista de piedras se viste igual que la de cintas: es la misma clase de
     panel y aprender dos aspectos para lo mismo sería gratuito. */
  #piedraMenu{ position:absolute; z-index:9; width:min(280px, calc(100% - 16px));
               max-height:64%; display:none; flex-direction:column; overflow-y:auto;
               overscroll-behavior:contain;
               background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
               border:1px solid rgba(140,116,68,.5); border-radius:7px;
               padding:9px 10px 10px; gap:3px;
               box-shadow:0 12px 26px -14px rgba(60,40,15,.85);
               opacity:0; transform:translateY(7px) scale(.98);
               transition:opacity .2s ease, transform .28s cubic-bezier(.2,.85,.3,1); }
  #piedraMenu.visible{ opacity:1; transform:none; }
  #piedraMenu::-webkit-scrollbar{ width:0; height:0; display:none; }
  .sp-chip-forma{ flex:0 0 auto; display:block; width:15px; height:15px; color:#7a6434; }
  .sp-chip-forma svg{ display:block; width:100%; height:100%; }
  .sp-vacio{ margin:4px 2px 2px; font:400 12.5px/1.45 var(--ui); color:#6d5a2c; }

  /* QUIEN PIDIÓ MENOS MOVIMIENTO NO RECIBE NINGUNO DE ÉSTOS. Aparecer y
     desaparecer se queda —hace falta para entender que algo salió— pero sin
     recorrido ni escala: solo el fundido, y la cinta ya no cae. */
  @media (prefers-reduced-motion: reduce){
    .separador, .sep-x, #sepMenu, #sepOferta, .sp-borrar, .sp-tela, .sp-fila,
    .sp-fila-lapiz{
      transition-duration:.01ms !important; }
    .separador.cayendo, .separador.entrando, .separador.saliendo{
      animation:none !important; }
    .separador.entrando{ opacity:1; }
    .separador.saliendo{ opacity:0; }
    #sepMenu{ transform:none !important; }
    #sepOferta{ transform:translateX(-50%) !important; }
    .sp-borrar{ transform:none !important; }
  }

  /* LA VENTANITA DEL VERSÍCULO. Un paso más, y el paso es el que evita el
     error caro: desde una línea cortada no se puede saber si es el versículo
     que buscabas, y un salto equivocado cuesta esperar el viaje y volver.
     Aquí lo lees entero y decides. Tocar el texto salta; tocar fuera, no. */
  #versoPleno{ position:absolute; left:50%; top:50%; z-index:10;
               transform:translate(-50%,-50%) scale(.96);
               width:min(330px, calc(100% - 26px)); max-height:70%;
               display:none; flex-direction:column; overflow-y:auto;
               background:linear-gradient(to bottom, #f7f0dd, #ece0c2);
               border:1px solid rgba(140,116,68,.55); border-radius:7px;
               box-shadow:0 16px 34px -10px rgba(0,0,0,.6);
               /* Sin relleno arriba: se lo queda el renglón del rótulo, que
                  va pegajoso y tiene que llegar al filo del papel para tapar
                  lo que se le pase por debajo. Ver .vp-cab. */
               padding:0 14px 11px; scrollbar-width:none;
               opacity:0; transition:opacity .18s ease,
                                     transform .26s cubic-bezier(.2,.85,.3,1); }
  #versoPleno::-webkit-scrollbar{ width:0; height:0; display:none; }
  #versoPleno.visible{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  /* EL RÓTULO Y LA X, EN UN RENGLÓN.

     La X podría ir suelta y pegada a la esquina con position:absolute, y sería
     peor: este panel LEE —tiene overflow-y:auto para los versículos largos—,
     así que una X absoluta se iría hacia arriba con el desplazamiento, y
     además el rótulo lleva el nombre entero del libro («Primera a los
     Corintios 15:58») y se metería por debajo de ella. En un renglón propio
     son hermanos: el rótulo ocupa lo que le toca y la X se queda en su punta
     derecha pase lo que pase. align-items:center porque la X es más alta que
     el rótulo, y alinearlos por la base la dejaría colgando.

     Y VA PEGAJOSO, que es la otra mitad. Con un versículo largo —los hay que
     no caben en el 70% de alto que se le deja a este panel— el que desplaza es
     #versoPleno, así que un renglón normal se va hacia arriba con el texto: se
     desplaza dos dedos y la X ya no está, que es justo el defecto que la X
     venía a arreglar. Lo levantó la revisión de Codex. Pegajoso arriba se
     queda en su sitio con el texto pasando por debajo.

     Los tres detalles que lo hacen funcionar y no se ven:
     · el relleno de arriba se muda del panel a este renglón. Los offsets de
       sticky se miden contra la CAJA DE RELLENO, así que con los 13px puestos
       en el panel el renglón se quedaría clavado 13px más abajo del filo y por
       ese hueco asomaría el texto pasando.
     · los márgenes negativos a los lados, para que su fondo llegue a los dos
       filos y no deje dos franjas por donde se vea pasar el renglón de debajo.
     · el fondo OPACO y del tono exacto con el que arranca el degradado del
       panel. El fondo de un elemento que desplaza no se mueve con su
       contenido, así que arriba del todo el degradado siempre vale #f7f0dd:
       el mismo color, o sea que en reposo no se nota que hay dos capas. */
  .vp-cab{ position:sticky; top:0; z-index:2;
           display:flex; align-items:center; gap:10px;
           margin:0 -14px; padding:13px 14px 8px; background:#f7f0dd; }
  .vp-ref{ display:block; flex:1 1 auto; min-width:0;
           font:700 12px/1.2 var(--ui); letter-spacing:.1em;
           text-transform:uppercase; color:#8a7746; }
  /* LA PUERTA DE SALIDA, DICHA.

     Cerrar ya se podía —tocando fuera, o con Escape—, pero las dos son cosas
     que hay que saber de antes; nada en la ventanita las contaba. Una X en la
     esquina de arriba a la derecha es la única salida que se VE, y es donde
     todo el mundo la busca ya.

     LA X SOLA, SIN DISCO NI BORDE. Nació dentro de un botón redondo con su
     fondo y su filo, y era demasiado: en una ventanita que enseña un versículo
     para leerlo, el aspa acabó siendo lo primero que se ve, compitiendo con lo
     único que había que mirar. Un aspa suelta se encuentra igual —ahí arriba a
     la derecha no hay nada más— y no se pone delante.

     Discreta no es invisible, así que va del dorado del rótulo y no más
     pálida: se lee como parte del mismo renglón. Se oscurece al pasar por
     encima y se hunde al pulsar, que es lo mismo que hacen los demás botones
     de la hoja, y ahí es donde se confirma que sí es un botón.

     Y EL BLANCO DE TOQUE NO ENCOGE con el disco: sigue midiendo 30px de lado
     —34 en pantalla chica—, que es lo que necesita el pulgar. Es la misma
     regla que ya siguen los puntos de las esquinas de la hoja: lo que se
     retira es el color, no el sitio donde se toca. */
  .vp-x{ flex:0 0 auto; display:inline-flex; align-items:center;
         justify-content:center; width:30px; height:30px; margin:-6px -9px -6px 0;
         border:0; background:transparent; color:#8a7746;
         font:400 20px/1 var(--ui); cursor:pointer;
         -webkit-tap-highlight-color:transparent;
         transition:color .28s cubic-bezier(.65,0,.35,1),
                    transform .18s cubic-bezier(.65,0,.35,1); }
  .vp-x:hover{ color:#4d3f1d; }
  .vp-x:active{ transform:scale(.85); }
  .vp-txt{ display:block; width:100%; text-align:left; border:0; cursor:pointer;
           background:rgba(255,253,247,.75); border-radius:5px;
           padding:11px 12px; color:#2f2610;
           font-family:Georgia,'Times New Roman',serif; font-size:15.5px;
           line-height:1.55; -webkit-tap-highlight-color:transparent;
           transition:background .28s cubic-bezier(.65,0,.35,1),
                      box-shadow .28s cubic-bezier(.65,0,.35,1); }
  .vp-txt:hover{ background:#fffdf6; box-shadow:0 0 0 1.5px rgba(184,137,43,.55); }
  /* El que no lleva a ningún lado tampoco se ofrece: ni cursor de mano ni
     realce al pasar por encima. Se ve como lo que es, un recuadro de aviso. */
  .vp-mudo, .vp-mudo:hover{ cursor:default; box-shadow:none; opacity:.75;
                            background:rgba(255,253,247,.5); font-style:italic; }
  .vp-pie{ display:block; padding:7px 2px 0; font:400 11px/1.4 var(--ui);
           color:#6b5936; opacity:.85; }

  @media (max-width: 560px){
    #historial{ bottom:56px; right:8px; }
    .hs-ref{ font-size:14px; min-width:70px; }
    .hs-txt{ font-size:14px; }
    .hs-fila{ min-height:44px; padding:10px; }
    /* EL RELLENO SE APRIETA PORQUE AHORA SON TRES. Con 14 px a los lados los
       tres del renglón pedían 319 de los 302 útiles en una pantalla de 320, y
       el que sobraba se bajaba a otro renglón. A 10 px caben con holgura —291—
       y no se pierde blanco de dedo: el alto sigue en 38 y el más estrecho
       mide 83 de ancho, que es más que un dedo. */
    .hs-atras{ min-height:38px; font-size:13px; padding:9px 10px 9px 12px; }
    .hs-sep{ min-height:38px; font-size:13px; padding:9px 10px; }
