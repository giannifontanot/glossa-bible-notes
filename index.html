<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gloss Bible</title>
<style>
  :root{ --desk:#362c20; --desk-2:#4a3c29; --ui:'Segoe UI', system-ui, -apple-system, sans-serif;
         /* EL CONTRASTE VIVE EN LA RAÍZ y no en la hoja, porque lo leen dos
            elementos que no son parientes: la hoja viva y el lienzo del
            pliegue. Puesto arriba, los dos heredan el mismo número y no hay
            manera de que uno se quede con el de antes. 1 es "sin tocar". */
         --contraste:1;
         /* Y el brillo, por lo mismo y en el mismo sitio: los dos los leen
            la hoja viva y el lienzo del pliegue, que no son parientes. */
         --brillo:1; }
  *{ box-sizing:border-box; }
  /* EL COLOR SÓLIDO VA ADEMÁS DEL DEGRADADO, y no es repetirse.

     Estaba solo el degradado, o sea solo background-IMAGE: el background-color
     de la página se quedaba en transparent. En pantalla no se nota —la imagen
     tapa el hueco entero— pero fuera de la página sí. El navegador del
     teléfono pinta ahora la franja de los botones del sistema con el color de
     fondo de la página, y una imagen no le sirve para eso: necesita un color
     liso. Sin él se queda con su blanco de fábrica, y aparece una franja
     blanca debajo del libro que no está en ninguna parte del documento —de
     ahí que no se pudiera encontrar mirando la página—.
     El escritorio es de este color; ahora también lo dice donde se pregunta. */
  /* EL ALTO DEL CUERPO USA LA MISMA UNIDAD QUE LA ESCENA, y tiene que usarla.

     Estaba en 100vh mientras .stage va en 100dvh, y esas dos NO miden lo mismo
     en un teléfono: 100vh es la pantalla con la barra del navegador retraída y
     100dvh es lo que se ve ahora mismo. Con la barra a la vista el cuerpo se
     forzaba más alto que lo visible, y ese sobrante se podía desplazar —unos
     50 px de nada que no llevan a ninguna parte y que además arrastran hacia
     abajo los botones del pie—. Reproducido con lo visible en 865 y el cuerpo
     en 915: 50 px de desplazamiento; igualando las unidades, cero.
     No se ve en un navegador de escritorio porque ahí vh y dvh son lo mismo:
     hace falta una barra que se esconda, como la del navegador de DuckDuckGo
     donde lo encontró el autor.
     Van las tres en cascada, igual que en .stage: quien no entienda dvh se
     queda en svh, y quien no entienda ninguna, en vh. */
  body{ margin:0; min-height:100vh; min-height:100svh; min-height:100dvh;
        display:flex; flex-direction:column; align-items:center;
        gap:7px; padding:12px 14px 30px; font-family:var(--ui); color:#eee7d8;
        background-color:var(--desk);
        background-image:radial-gradient(ellipse at 30% 8%, var(--desk-2), var(--desk) 70%); }
  h1{ font-size:.9rem; font-weight:600; margin:0; letter-spacing:.03em; }
  /* Los controles de Formato/Glosas nacen en el body y el guion los muda a
     su rollo. Sin esto se ve un instante el panel de Formato al abrir. */
  body > #ctrlConfig, body > #ctrlEtiquetas{ display:none !important; }
  /* PORTADA. Cubre la mesa hasta que la primera hoja está lista. */
  #portada{ position:fixed; inset:0; z-index:200; display:flex;
            flex-direction:column; align-items:center; justify-content:center;
            gap:14px; padding:24px;
            background-color:var(--desk);
            background-image:
              radial-gradient(ellipse at 50% 40%, var(--desk-2), var(--desk) 68%);
            transition:opacity .55s ease, visibility .55s ease;
            opacity:1; visibility:visible; }
  #portada.fuera{ opacity:0; visibility:hidden; pointer-events:none; }
  #portada .portada-marca{
    font-family:Georgia, 'Palatino Linotype', 'Times New Roman', serif;
    font-weight:700; font-size:clamp(2.1rem, 9vw, 3.6rem);
    letter-spacing:.22em; text-transform:uppercase;
    color:#e8d5a3; text-shadow:0 2px 0 rgba(0,0,0,.35),
                               0 0 28px rgba(201,162,39,.18);
    margin:0; line-height:1.15; text-align:center; }
  #portada .portada-sub{
    font-family:var(--ui); font-size:clamp(.72rem, 2.4vw, .9rem);
    letter-spacing:.28em; text-transform:uppercase;
    color:rgba(238,231,216,.55); margin:0; }
  .row{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .btn{ font:inherit; font-size:.7rem; color:#eee7d8; cursor:pointer; line-height:1;
        background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18);
        border-radius:8px; padding:6px 10px; }
  .btn.active{ background:rgba(201,162,39,.32); border-color:rgba(201,162,39,.75); }
  .btn.ghost{ opacity:.6; background:transparent; }
  .btn:disabled{ opacity:.3; cursor:default; }
  .sep{ width:1px; height:18px; background:rgba(255,255,255,.15); margin:0 3px; }
  .lbl{ font-size:.62rem; opacity:.45; letter-spacing:.07em; text-transform:uppercase; }
  .medida{ font:600 .7rem/1 ui-monospace,Menlo,monospace; min-width:30px; text-align:center;
           padding:6px 2px; opacity:.85; }
  input,select{ font:inherit; font-size:.7rem; color:#eee7d8; background:rgba(0,0,0,.28);
        border:1px solid rgba(255,255,255,.2); border-radius:7px; padding:5px 8px; }
  select option{ color:#222; }

  .chip{ font-size:.66rem; padding:4px 9px; border-radius:999px; cursor:pointer;
         border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.05); }
  .chip.off{ opacity:.34; text-decoration:line-through; }
  .rollo .chip.sel{ border-color:#8a6416; border-width:2px;
                    background:#fff8e4; box-shadow:0 0 0 1px rgba(184,137,43,.45); }
  .chip .n{ opacity:.55; padding-left:5px; }
  /* El chip de libro se distingue del de etiqueta porque se comporta al revés:
     los de etiqueta se apagan, éstos se quitan. Por eso lleva una × y no la
     raya de tachado. */
  .rollo .chip-libro{ background:#f3e7c8; border-color:rgba(140,116,68,.6); }
  .chip-libro .x{ padding-left:6px; opacity:.5; font-weight:700; }
  .chip-libro:hover .x{ opacity:1; }
  .rollo .chip-mas{ background:transparent; border-style:dashed; opacity:.8; }
  .rollo .chip-mas:hover{ background:rgba(255,253,247,.75); opacity:1; }

  .stage{ position:relative; height:470px; width:340px; transition:width .22s ease;
          filter:drop-shadow(0 14px 26px rgba(0,0,0,.45)); }

  /* ============================================================
     TELÉFONO. La hoja no se encoge ni cambia de modo: se queda del tamaño
     que necesita —columna de texto cómoda MÁS su margen de glosas— y lo que
     se achica es la ventana por la que la miras. Corres el papel para traer
     las glosas, como quien mueve un mapa grande sobre una mesa chica.

     Es la única solución que no convierte la glosa en otra cosa. Bajarla al
     pie, esconderla tras un botón o mandarla al reverso son todas maneras de
     admitir que no cabe; correr el papel es admitir que la mesa es chica,
     que es la verdad.
     ============================================================ */
  /* En teléfono los rótulos se centran SOBRE LA COLUMNA DE TEXTO, no sobre la
     hoja: centrados en la hoja completa quedarían corridos hacia las glosas y
     se saldrían de la pantalla, que es justo lo que hay que evitar.
     Arriba el titulillo, abajo el folio, el texto enmarcado entre los dos.
     Así se compone una página impresa desde hace cinco siglos, y por eso una
     hoja así se lee como página y no como pantalla. */
  @media (max-width: 560px){
    body{ padding:0; margin:0; display:block; }
    /* Con #pg delante a propósito: estas dos reglas viven en la hoja de
       estilos de la aplicación, y las originales viven en PAGE_CSS, que se
       inyecta DESPUÉS. A igual especificidad ganaría la última, así que sin
       el #pg estas anulaciones no se aplicarían nunca. */
    /* EL MOLDE VA INCLUIDO. #ghost es donde se compone la foto de la hoja, y
       las letras de esa foto las dibuja el lienzo en las coordenadas que mide
       AHÍ. Si el molde no lleva el mismo acomodo que la hoja viva, la foto sale
       con el titulillo en la esquina y el texto 15px más arriba — y al terminar
       de pasar la hoja, el texto brinca a su sitio. Ése es el desconcierto de
       "ya estaba lista y se movió".
       Por eso las tres reglas nombran a los dos: la hoja y su molde. */
    /* Los rótulos miden LO QUE MIDE SU TEXTO, no la pantalla. Antes les daba el
       ancho completo de la columna para centrarlos, pero eso convertía dos
       franjas invisibles de lado a lado en zonas que abrían el panel: tocabas
       el aire junto al titulillo y se te abría la burbuja. Un botón tiene que
       ocupar exactamente lo que se ve de él.
       Se centran sobre la columna de texto —a la mitad de --col-texto— y no
       sobre el papel entero, que se sale de la pantalla. */
    /* line-height escrito en píxeles, no en múltiplo: de aquí sale el alto del
       titulillo, y de ese alto sale cuánto tiene que bajar el texto. Con un
       múltiplo el alto depende del redondeo de cada navegador y la cuenta de
       abajo deja de cuadrar. 26 + 4 + 5 = 35, que es --alto-cabeza. */
    #pg .pg-cabeza, #ghost .pg-cabeza{
        left:calc(var(--col-texto, 340px) / 2); right:auto; width:auto;
        transform:translateX(-50%); font-size:21px; line-height:26px;
        text-align:center; padding:4px 13px 5px; border-radius:0 0 5px 5px; }
    /* Mismo trato que el titulillo, y por la misma razón: de este alto sale
       cuánto tiene que subir el pie del texto. 26 + 3 + 2 = 31.
       La versión lleva menos espaciado que antes: a 11px las letras sueltas
       ayudaban a leer una abreviatura en versalitas, pero a 21px separan
       tanto que "VBL" deja de leerse como una palabra. */
    #pg .pg-version, #ghost .pg-version{
        left:calc(var(--col-texto, 340px) / 2); right:auto; width:auto;
        transform:translateX(-50%); text-align:center;
        font-size:21px; line-height:26px; letter-spacing:.10em; padding:3px 13px 2px; }

    /* DE LEJOS LOS DOS RÓTULOS SE LEEN, que es exactamente para lo que están.

       De lejos la hoja se encoge al 58%, y con ella los rótulos: 21px se
       quedan en 12,3 reales, justo cuando más falta hace saber en qué capítulo
       y en qué versión estás. La vista de lejos existe para orientarse; un
       rótulo ilegible ahí no orienta.

       LA LETRA CRECE SIN QUE CREZCA LA CAJA, y esto es lo que hace que el
       cambio sea seguro. De --alto-cabeza (35) y --alto-version (31) sale el
       relleno con el que el texto se aparta de los rótulos, así que tocarlos
       movería el texto y repaginaría. Aquí la caja se respeta al píxel y lo
       que se recorta es el relleno interior: 26+4+5 pasa a 30+2+3, y 26+3+2 a
       29+1+1. Mismo alto, letra de 28 en vez de 21 —16,4 reales de lejos—.

       AQUÍ YA NO SE TOCA EL COLOR, y esa es la parte que cambió. Esta regla
       también los entintaba de marrón oscuro y en negrita, y visto de frente
       era un parche: los dejaba legibles de lejos y pálidos de cerca, que es
       donde de verdad se leen. Peor aún, el color pegaba un brinco al entrar
       y salir del zoom, como si el rótulo fuera dos cosas distintas.

       El contraste se resuelve ahora una sola vez y para las dos vistas, en
       --rot-cab y --rot-pie, que van con el sepia. Lo que a la vista de lejos
       le falta es TAMAÑO —eso sí es propio del zoom—, y es lo único que queda
       aquí.

       El tamaño va con transición porque .suavizando la enciende: sin ella el
       rótulo pegaría un salto en el primer cuadro mientras la hoja empieza a
       encogerse despacio. Las otras dos son las de la hoja de cerca, repetidas
       porque este 'transition' sustituye entero al de la regla base: si no se
       nombran aquí, mover el sepia durante el zoom cambiaría el color de golpe. */
    #pg.zoom .pg-cabeza{
        font-size:28px; line-height:30px; padding:2px 13px 3px; }
    #pg.zoom .pg-version{
        font-size:28px; line-height:29px; padding:1px 13px 1px; }
    #pg.suavizando .pg-cabeza, #pg.suavizando .pg-version{
        transition:font-size  .46s cubic-bezier(.32,.72,.24,1),
                   background .34s cubic-bezier(.65,0,.35,1),
                   color      .34s cubic-bezier(.65,0,.35,1); }
    /* EL TEXTO BAJA PARA QUE EL TITULILLO RESPIRE. La idea ya estaba; el
       número estaba mal. El titulillo va posicionado y mide 26px —17 de
       renglón más 4 y 5 de relleno— pero aquí se bajaba el texto 15px, así
       que la etiqueta invadía 10.9px del área de texto.
       No se notaba en la primera columna porque el número de capítulo la
       empuja hacia abajo con su propio margen. Se notaba en la segunda, que
       empieza pegada al borde de arriba: ahí la primera línea quedaba tocando
       el titulillo. Con tres columnas pasa en la segunda y la tercera.
       La cuenta va en una variable porque el alto del titulillo se decide
       arriba: si algún día cambia su letra o su relleno, se corrige --alto-
       cabeza y el texto vuelve a acomodarse solo. */
    /* A 21px los rótulos miden bastante más, así que las dos sumas se rehacen
       aquí y el texto se aparta solo. Es exactamente para esto que la cuenta
       vive en variables en vez de estar escrita en el padding. */
    #pg, #ghost{ --alto-cabeza:35px; --alto-version:31px; --aire-cabeza:6px; }
    #pg .pg-cols, #ghost .pg-cols{
        padding-top:calc(var(--alto-cabeza) + var(--aire-cabeza)); }
    /* Y EL MISMO DEFECTO AL PIE, que salió al medir el de arriba. La versión
       —el "VBL" de abajo— también va posicionada y también se le encimaba el
       texto: mide 18px y nadie le reservaba ni uno. Ya pasaba antes de tocar
       nada, pero bajar el texto para despegarlo del titulillo lo empujaba
       contra este otro, así que arreglar arriba y no abajo habría sido
       cambiar un choque por otro.
       El reservado va en .pg-inner y no en .pg-cols porque cuando las glosas
       están al pie, lo último de la hoja es .pg-foot, no la columna. Y el
       rótulo no se mueve: está posicionado contra la caja de relleno, así
       que sigue pegado al borde de abajo mientras el texto se detiene antes.
       Reservar altura cambia lo que cabe, y de eso ya se encarga paginate:
       mide contra la caja viva, así que se entera solo. */
    #pg .pg-inner, #ghost .pg-inner{
        padding-bottom:calc(var(--alto-version) + var(--aire-cabeza)); }
    .stage{ width:100vw !important; height:100svh; height:100dvh;
            filter:none; transition:none; }
    #pg{ border-radius:0;
         /* desplazamiento nativo: trae su inercia y su rebote de fábrica, y
            ningún código mío lo hace mejor */
         overflow-x:auto; overflow-y:hidden;
         /* SIN ESTO EL NAVEGADOR SE ROBA EL GESTO. Al llegar al tope de una
            caja que se desplaza de lado, el navegador entiende que sigues
            empujando y se queda con el gesto para su "atrás" o su rebote. El
            síntoma es justo el que se ve: llegas al final y ya no puedes
            regresar, como si el papel se hubiera trabado. `contain` dice que
            el desplazamiento se acaba aquí y no se le pasa a nadie. */
         overscroll-behavior-x:contain; overscroll-behavior-y:none;
         /* pan-y, no pan-x: el desplazamiento DE LADO lo hace EL GUION, para
            ratón y para dedo igual. Dejar que el navegador también lo hiciera
            nos costó dos vueltas: los dos empujaban el mismo papel y se
            atoraba; y al quitarme yo, resultó que el navegador tampoco lo
            movía. Con un solo responsable no hay a quién culpar. pan-y no
            le devuelve nada de eso: sigue sin poder correr el papel a los
            lados, y de arriba abajo no hay a dónde correrlo —overflow-y va
            en hidden—. El guion conserva el mando completo.

            Aquí decía `none`, y `none` cobraba un peaje que no se veía: apaga
            TODO gesto de fábrica sobre la hoja, y uno de esos gestos es
            seleccionar texto arrastrando el dedo. En el teléfono no se podía
            elegir un pasaje para hacerlo glosa —el sistema pintaba sus
            manijas, pero el navegador no formaba la selección y la página no
            se enteraba—. El doble toque sí funcionaba, porque esa es otra
            ruta. Y no bastaba con relajarlo en el versículo: touch-action no
            se hereda, pero el navegador lo INTERSECTA con el de los
            ancestros, así que un `none` aquí arriba manda sobre todo lo que
            vive adentro por más `auto` que diga cada hijo. Se corrige donde
            estaba puesto, no donde se notaba. */
         touch-action:pan-y;
         scrollbar-width:none; -ms-overflow-style:none; }
    #pg::-webkit-scrollbar{ width:0; height:0; display:none; }
    /* LOS DOS ANCHOS DE LA HOJA. Aquí estaba el error de proporción: le había
       dejado al margen su ancho de tablet, 132px, que son 18 caracteres por
       renglón. Una nota de seis palabras ocupaba cinco renglones — eso no es
       una glosa, es una tira.

       Y es que en teléfono la columna de glosas deja de ser un margen para
       convertirse en un destino: corres el papel para ir a ella y te quedas
       ahí leyendo. Un sitio al que vas merece ancho de sitio. Con 240px son
       34 caracteres, que es donde una nota se lee de corrido.

       Como la hoja es más ancha que la pantalla de todos modos, crecer no
       cuesta nada: solo cambia cuánto hay que correr. */
    /* --col-texto lo escribe el guion en el elemento, porque depende del ancho
       real de la pantalla. Aquí solo queda un valor de respaldo por si algo
       fallara antes del primer repintado. */
    /* SIN RELLENO LATERAL EN LA HOJA. Estaba causando que el molde donde se
       compone la foto y la hoja viva tuvieran aritméticas distintas —una
       restaba el relleno y la otra no— y la paginación, que mide en el molde,
       calculaba con una columna más angosta de la real. Resultado: hojas con
       dos versículos y media página en blanco.
       El aire de las orillas ahora lo pone la columna de texto por dentro, así
       el ancho del papel es exactamente la suma de sus columnas y no hay nada
       que restar en ningún lado. */
    #pg{ padding-left:0; padding-right:0; cursor:grab;
         --col-texto:340px; --col-glosa:240px; --hueco-col:11px; }
    #pgBody, #ghostBody{ padding-left:16px; padding-right:16px; }
    #pg.agarrado{ cursor:grabbing; }
    /* sobre el texto manda el cursor de texto: ahí se selecciona, no se corre.
       El número de capítulo es la excepción: ahí sí se agarra el papel. */
    #pg .v, #pg .gl{ cursor:auto; }
    #pg .cap{ cursor:grab; }
    #pg.agarrado .cap{ cursor:grabbing; }
    /* Los tres anchos se fuerzan desde aquí, con !important, y el JavaScript
       queda fuera de la ecuación. El margen tomaba su ancho de una variable
       que el guion escribe en el elemento (--mw), y en teléfono esa variable
       no estaba llegando con el valor correcto: la hoja terminaba midiendo
       ~424px en vez de 591 y por eso topabas antes de descubrir las glosas.
       Con el acomodo escrito en un solo sitio ya no hay dos versiones de la
       verdad que se puedan desincronizar. */
    #pg .pg-inner{ width:calc(var(--col-texto) + var(--hueco-col) + var(--col-glosa)) !important;
                   max-width:none !important; }
    #pg .pg-cols{ width:100%; }
    #pgBody{ flex:0 0 var(--col-texto) !important; width:var(--col-texto) !important;
             min-width:var(--col-texto) !important; }
    #pgMargin{ flex:0 0 var(--col-glosa) !important; width:var(--col-glosa) !important;
               min-width:var(--col-glosa) !important;
               margin-left:var(--hueco-col) !important; }
    /* Aquí había imanes en los dos extremos. Los quité: con el papel corriendo
       tan poco —125px— el imán no ayudaba a llegar a ningún lado y sí se
       sentía como si el papel se resistiera. Correr libre es más honesto. */

    /* Los TAMAÑOS DE LETRA EN TELÉFONO estaban aquí y no hacían nada. Ver la
       nota al final de la hoja de estilos, que es donde viven ahora. */

    /* Aquí estaba el degradado que insinuaba que el papel seguía hacia la
       derecha. Se fue: servía para enseñar algo que ya se sabe, y a cambio
       robaba 26px del área de lectura y ensuciaba el canto de la hoja. Una
       ayuda que sigue puesta después de aprendida deja de ser ayuda. */

  }
  #pg{ position:absolute; inset:0; border-radius:3px; overflow:hidden; }
  /* Nada de destellos del sistema sobre los controles del lector: los que
     valen la pena ya los pintamos nosotros, y los del navegador no siguen
     ninguna de nuestras reglas de color ni de tiempo. */
  .btn, .chip, .tabo, .num, .pestanas button, .ix-item, .edge{
    -webkit-tap-highlight-color:transparent; }
  /* EL AVISO, Y CUÁNDO SE PERMITE HABLAR.

     Antes era un renglón permanente debajo de la hoja, y un renglón que
     siempre está deja de leerse: se vuelve parte del mueble. Ahora aparece
     sobre la hoja y se va solo. No captura clics, así que nunca estorba.

     Y ahora dice muchas menos cosas, porque se había convertido en lo otro:
     un cartelito que confirmaba cada acierto. Pasas hoja y aparece «tres
     hojas»; saltas a un versículo y aparece el versículo al que acabas de
     saltar; cambias de versión y aparece la versión que se lee en el rótulo
     de abajo. Todo eso ya lo estaba diciendo la pantalla —esa es la parte que
     funciona— y repetirlo por escrito no informa: interrumpe.

     La regla es una sola: SE HABLA CUANDO NO PASÓ LO QUE PEDISTE. Una
     referencia que no existe, un archivo que no se pudo leer, un guardado que
     falló, un botón que no tenía nada que hacer. Ahí el aviso es lo único que
     distingue «no hacía falta» de «está roto», y sin él la aplicación se
     queda muda justo cuando hay algo que explicar. Lo que salió bien se
     enseña; no se cuenta. */
  #readout{ position:absolute; left:50%; bottom:26px; transform:translate(-50%, 6px);
            z-index:7; max-width:86%; pointer-events:none;
            font:400 10.5px/1.45 var(--ui); color:#f3ead6; text-align:center;
            background:rgba(40,31,14,.9); padding:5px 11px; border-radius:5px;
            opacity:0; transition:opacity .34s cubic-bezier(.65,0,.35,1),
                                  transform .34s cubic-bezier(.65,0,.35,1); }
  #readout.viva{ opacity:1; transform:translate(-50%, 0); }
  /* El botón «volver» del salto se quitó: el atrás del historial cubre
     ese camino y el flotante competía con el zoom y el papel. */
  #btnVolver{ display:none !important; }
  /* Aquí estaban los chevrones de pasar hoja. Se fueron: la hoja se pasa
     arrastrando el filo, con las flechas del teclado o tocando el borde, y
     tres caminos al mismo sitio no valen el par de botones encima del papel.
     Además en teléfono competían con el gesto de traer las glosas. */
  #fx{ position:absolute; left:0; top:0; display:none; pointer-events:none; border-radius:3px; }
  /* EL CONTRASTE, Y POR QUÉ VA EN ESTOS DOS Y EN NINGÚN OTRO SITIO.

     Lo que se pidió aclarar u oscurecer es la LECTURA, no el programa. Y la
     lectura se enseña en dos superficies que se turnan: #pg mientras la hoja
     está quieta, #fx mientras se dobla —el pliegue esconde la hoja viva y
     pinta su foto en el lienzo—. Las dos llevan el mismo número o el filtro
     se caería justo al empezar a arrastrar y volvería al soltar, que es el
     salto más visible que puede dar esta pantalla.

     NO VA EN #stage NI EN body, aunque sería una línea menos. #ajustes,
     #etiquetas, #respaldo, #canto, el menú, el readout y los filos son HIJOS
     DE #stage: un filtro ahí dentro se los lleva a todos, y con el contraste
     al máximo el propio panel de Formato —desde el que estás moviendo el
     riel— cambiaría de color mientras lo usas. Un control no puede teñirse a
     sí mismo mientras lo mueves.

     Tampoco hizo falta un contenedor nuevo: la hoja ya es un elemento con
     nombre. Envolverla habría tocado el posicionamiento absoluto, las
     coordenadas del pliegue y el desplazamiento de las glosas, que es mucho
     que arriesgar para no ganar nada.

     Lo que queda dentro de #pg viene incluido de regalo, y está bien que así
     sea: #zoomPapel y .pg-inner son la vista de lejos, o sea la misma hoja
     más chica. Lo que queda fuera —.pg-canto, la huella, el disco de
     buscando— no es papel con texto: son señales del programa, y se quedan
     con sus colores.

     Ninguno de los dos traía filter puesto, así que aquí no hay nada que
     combinar; el drop-shadow que sí existe vive en .stage, que es el padre, y
     se compone con éste sin estorbarlo. Si algún día uno de los dos estrena
     un filtro propio, hay que SUMARLO en la misma declaración, no cambiarla:
     la segunda propiedad filter gana y la primera desaparece sin avisar. */
  /* LOS DOS EFECTOS VAN EN UNA SOLA DECLARACIÓN, y esto es exactamente lo que
     avisaba el párrafo de arriba: una segunda propiedad filter no se suma a la
     primera, la SUSTITUYE, y la que perdiera desaparecería sin dar ningún
     síntoma más que "el riel no hace nada". Brillo y contraste se escriben
     juntos aquí, cada uno con su variable, y cada riel mueve la suya sin
     tocar la del otro.

     EL ORDEN IMPORTA, aunque no lo parezca: los filtros se aplican en cadena,
     de izquierda a derecha. brightness antes que contrast significa "aclara el
     papel y luego separa la letra de él", que es lo que se espera al subir los
     dos. Al revés —contrastar y después aclarar— el contraste trabajaría sobre
     un papel que todavía no ha subido y el resultado se lava.

     EL SEPIA NO ENTRA AQUÍ. No es un filtro: es la rampa que mezcla papel y
     tinta en --papel y --tinta antes de pintarlos, y por eso entinta los dos a
     la vez en vez de teñir una foto ya hecha. Meterlo en esta cadena como
     sepia() sería un tercer efecto encima del suyo, no el mismo. */
  #pg, #fx{ filter:brightness(var(--brillo,1)) contrast(var(--contraste,1)); }
  /* EL NÚMERO SE RESERVA SU SITIO, y esto no es maquetación fina: la .medida
     y el riel se reparten el mismo renglón, así que cuando el número pasa de
     "50%" a "100%" el riel se encoge 5 px MIENTRAS LO ESTÁS ARRASTRANDO y la
     manija se corre debajo del pulgar. Con cuatro caracteres de monospace
     reservados —que es lo que mide "200%", el más ancho de los tres— el riel
     mide siempre lo mismo y la manija se queda donde la pusiste. Va en ch y
     no en px porque en el teléfono esta letra crece a 13 px.
     Solo a éste: el del sepia se queda exactamente como estaba. */
  #contrasteAhora, #brilloAhora{ min-width:4.6ch; }
  /* el lienzo se recorta contra la ventana: puede ser más ancho que ella */
  .stage{ overflow:hidden; }
  #pg.hidden{ visibility:hidden; }
  /* 30px y no 24: el canto es el blanco que se toca para pasar hoja, y 24 se
     falla con el pulgar en marcha. Sube a costa de tapar un poco más del
     principio del renglón —el canto lleva touch-action:none, así que ahí no se
     puede seleccionar— y eso se paga aparte: la marca se estira a la palabra
     entera, así que basta con alcanzar CUALQUIER letra de la palabra. Ver
     aPalabrasEnteras. */
  .edge{ position:absolute; top:0; width:30px; height:100%; z-index:3; touch-action:none; cursor:grab; }
  .edge-r{ right:0; background:linear-gradient(to right, rgba(201,162,39,0), rgba(201,162,39,.16)); }
  /* El filo de arriba: de donde baja el índice de libros. Va metido entre
     los dos laterales para no robarles el gesto de pasar hoja. */
  /* Dos mitades: izquierda para los ajustes, derecha para los libros. */
  /* Los tres filos de arriba salieron. Eran invisibles: nada en la hoja decía
     que el borde estuviera partido en tres ni que sirviera para algo. Ahora la
     única puerta es la referencia de la esquina, que sí se ve y además dice
     dónde estás — hacer clic en dónde estás para ir a otro lado es un mapeo
     que no hay que explicar. */
  .edge-l{ left:0;  background:linear-gradient(to left,  rgba(201,162,39,0), rgba(201,162,39,.16)); }
  .edge.off{ opacity:.2; cursor:default; }

  /* LA HUELLA EN EL FILO. Tocar el filo no daba señal de nada. Y hay un rato
     en que no puede darla: el paso de hoja espera 240ms por si viene un
     segundo clic —el propio código lo llama "el único retardo del sistema"—
     así que entre que apoyas el dedo y que la hoja arranca hay un hueco en el
     que el programa ya te entendió y no lo parece. Ese hueco se sentía como
     un toque que no entró, y la respuesta natural es volver a tocar, que es
     justo lo que reinicia la espera.
     Ahora queda la marca del dedo donde lo pusiste. Late despacio mientras
     dura la espera —eso es el "estoy en ello"— y se apaga en el instante en
     que la hoja empieza a girar, no antes: apagarla antes devolvería el hueco
     a otro sitio. No captura clics; es un aviso, no un blanco. */
  /* APARECE CASI DE INMEDIATO. Estaba en .17s, y una señal que tarda casi dos
     décimas en llegar no acompaña al dedo: lo alcanza. Con .07s ya está puesta
     antes de que levantes la vista, y sigue habiendo transición —no salta— que
     es para lo que se cede el cuadro de antes. La escala entra un pelo después
     que la opacidad, y eso es lo que da el "se posa" en vez del "se enciende";
     acortadas las dos, el gesto se conserva y solo se hace rápido. */
  #huella{ position:absolute; z-index:4; width:62px; height:74px;
           margin-left:-31px; margin-top:-37px; pointer-events:none;
           opacity:0; transform:scale(1.07);
           transition:opacity .07s linear, transform .11s cubic-bezier(.3,.8,.4,1); }
  #huella.viva{ opacity:1; transform:scale(1); }
  #huella .crestas{ position:absolute; left:0; top:0; }
  /* EL RESPLANDOR. Estaba en .30 de dorado y era casi invisible: sobre papel
     crema, un dorado translúcido al treinta por ciento se confunde con el
     propio papel. Sube a .62 en el centro y se estira más lejos, para que la
     huella traiga su propia mancha de fondo contra la que leerse en vez de
     depender del contraste de los trazos.
     El aire de fuera crece con él: un resplandor fuerte cortado en seco por el
     borde de la caja se ve como un círculo pegado, no como luz. */
  #huella .brillo{ position:absolute; inset:-12px; border-radius:50%;
                   background:radial-gradient(ellipse at center,
                              rgba(184,137,43,.62), rgba(184,137,43,.30) 48%,
                              rgba(184,137,43,.10) 68%, rgba(184,137,43,0) 82%); }
  #huella.viva .crestas, #huella.viva .brillo{
           animation:huellaLate 1.15s cubic-bezier(.45,0,.35,1) infinite; }
  /* Respira entre .82 y 1, no entre .58 y 1: el latido tiene que notarse sin
     que la huella se apague a medio camino. Bajar a .58 le quitaba casi la
     mitad del color justo en el momento en que hay que verla, y sumado a unos
     trazos ya pálidos la hacía desaparecer media parte de cada ciclo. No baja
     a cero por lo de siempre: un parpadeo dice "error", no "espera". */
  @keyframes huellaLate{ 0%,100%{ opacity:.82; } 50%{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    #huella.viva .crestas, #huella.viva .brillo{ animation:none; opacity:1; }
  }
  /* EL DISCO QUE GIRA MIENTRAS SE BUSCA.

     Un salto a otro libro no es barato: hay que rehacer el plano del libro
     destino, resolver todas las marcas, recalcular referencias y paginarlo
     entero. En un teléfono eso son segundos en los que la pantalla se queda
     exactamente como estaba, y una pantalla quieta después de un toque dice
     "no te oí". La respuesta natural es volver a tocar, y volver a tocar
     empieza el trabajo otra vez.

     Aquí hay una trampa que este archivo ya conoce: ese cálculo BLOQUEA el
     hilo principal, así que cualquier señal que dependa del hilo se congela
     junto con él. Lo dice el comentario de .ref.buscando: una transición de
     CSS se queda pegada en su primer fotograma. Un giro hecho con
     requestAnimationFrame se quedaría igual de quieto, y un disco de espera
     detenido miente peor que no poner nada: dice "colgado".

     Por eso el giro se hace con una animación de `transform` y nada más. Esas
     las lleva el compositor, que es OTRO hilo, y sigue girando aunque el
     principal esté ocupado. Comprobado: bloqueando 1500 ms a propósito, dos
     capturas del disco tomadas antes y después salen distintas. `will-change`
     no es adorno, es lo que asegura la capa propia que hace posible ese
     reparto.
     Sin animar el borde ni el color: eso volvería a pedirle trabajo al hilo
     bloqueado y perderíamos justo lo que se vino a buscar. */
  #buscando{ position:absolute; left:50%; top:50%; z-index:9;
             width:92px; height:92px; margin:-46px 0 0 -46px;
             pointer-events:none; opacity:0; transition:opacity .16s linear; }
  #buscando.viva{ opacity:1; }
  /* EL ARO. Un anillo tenue con un arco dorado que da vueltas, y se acabó.

     Aquí hubo antes un halo elíptico con estela de cometa, y el problema no
     era que estuviera mal hecho: era que había que DESCIFRARLO. Una figura que
     pide un instante para entenderse no sirve como aviso de espera, porque el
     aviso de espera se mira de reojo mientras piensas en otra cosa. Un aro
     girando no se interpreta, se reconoce.

     Lo único que no se negocia es cómo se anima: transform y nada más. Esas
     las lleva el compositor, que es otro hilo, así que el aro sigue girando
     mientras el principal está trabado —que es exactamente cuando este aviso
     existe—. Cualquier cosa que pidiera repintar el borde o el color se
     congelaría con él, y un aviso de espera congelado dice "colgado".

     El arco cubre un cuarto de vuelta: menos parece un punto suelto y más deja
     de leerse como algo que gira. El resto del anillo se queda puesto y tenue,
     para que el arco tenga un camino visible que recorrer. */
  #buscando .aro{ position:absolute; left:50%; top:50%;
                  width:52px; height:52px; margin:-26px 0 0 -26px;
                  border-radius:50%; border:4px solid rgba(122,96,42,.28);
                  border-top-color:#b8892b;
                  /* UN FILO DE PAPEL A CADA LADO DEL ANILLO, y nada más. Sin
                     fondo, el aro cae encima de los renglones y las letras se
                     le cruzan por debajo: se lee, pero cuesta. Con un disco
                     entero tapando el texto se leería de sobra y volveríamos a
                     lo que ya se descartó.
                     Dos sombras —una por fuera y otra por dentro— despejan una
                     banda de tres píxeles pegada al anillo. Es lo justo para
                     que el círculo se recorte contra algo y siga sin tapar la
                     hoja. Son sombras estáticas: no animan nada, así que no le
                     quitan al compositor lo que se le vino a dar. */
                  box-shadow:0 0 0 3px rgba(253,251,246,.78),
                             inset 0 0 0 3px rgba(253,251,246,.78);
                  animation:giroBuscando .85s linear infinite;
                  will-change:transform; }
  @keyframes giroBuscando{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  /* La frase que lee el lector de pantalla. Se esconde a la vista sin salir
     del árbol de accesibilidad, que es justo lo que display:none y
     visibility:hidden no permiten: esos la sacarían de los dos sitios y no
     se anunciaría. */
  #buscando .dice{ position:absolute; width:1px; height:1px; margin:-1px;
                   padding:0; border:0; overflow:hidden; white-space:nowrap;
                   clip-path:inset(50%); }
  /* Quien pidió menos movimiento no se queda sin aviso: se queda con el aro
     puesto, entero y quieto, que sigue diciendo "estoy en ello". */
  @media (prefers-reduced-motion: reduce){
    /* Quieto se queda el aro entero encendido: sigue diciendo "estoy en ello"
       sin moverse. */
    #buscando .aro{ animation:none; border-color:#c9a227; opacity:.6; }
  }
  /* ============================================================
     LA HOJA ENTERA, DESDE LEJOS.

     En el teléfono nunca se ve la hoja completa: el papel mide más que la
     ventana —de ahí el cajón— así que las glosas del margen y el texto no
     caben a la vez. Para leer está bien, porque leyendo se mira un renglón.
     Para BUSCAR no: buscar es reconocer una mancha, acordarse de que la nota
     estaba a la izquierda y abajo, pasar hojas hasta dar con la forma. Eso
     pide ver la hoja entera aunque no se pueda leer.

     Se hace escalando .pg-inner y no cambiando anchos, y esa es la decisión
     que sostiene lo demás: un transform es pintura, no maquetación. Tocar el
     ancho volvería a partir los renglones y a repaginar, y entonces la hoja
     que ves de lejos no sería la hoja a la que vuelves —que es justo lo que
     hace inútil una vista de conjunto—. Escalada, es la misma hoja, con sus
     mismos cortes, más chica.

     El papel se despega del fondo: #pg deja de ser papel y lo es .pg-inner,
     así que alrededor aparece el escritorio. POR ESE HUECO SE VUELVE, y el
     libro no se toca para salir.

     Estuvo al revés un tiempo, por una razón que resultó ser la de menos: en
     la vista de lejos hay mucho escritorio y poco papel, así que salir por el
     vacío parecía demasiado fácil por accidente. Lo que enseñó el uso es que
     el libro NO está libre para servir de botón. De lejos se sigue leyendo:
     se pasa hoja por los filos y se tocan las glosas del margen, que es
     justamente para lo que uno se aleja —para ver la hoja entera y elegir a
     dónde ir—. Un libro que además cierra la vista convierte cada uno de esos
     toques en una apuesta.
     El hueco, en cambio, no hace ninguna otra cosa. Ahí un toque de más no
     cuesta nada, y un toque de menos tampoco: es el sitio donde equivocarse
     es gratis. Y el accidente que se temía tiene ya su propio freno —con una
     hoja girando o el paso automático en marcha, el toque solo detiene—.
     Afuera viven también los dos botones de pasar hoja —abajo a la derecha,
     fuera del papel, porque encima del papel taparían justo lo que se vino a
     mirar—, y ésos se defienden por ser ellos el destino del toque.
     ============================================================ */
  /* El cursor dice cuál de los dos vuelve: la lupa va en el hueco, no en la
     hoja. Sobre la hoja se lee, y en el escritorio de alrededor no hay nada
     más que hacer. */
  #pg.zoom{ background:transparent; cursor:zoom-in; }
  /* EL ORIGEN DEL TRANSFORM VIVE FUERA DE .zoom, y tiene que vivir fuera.

     Estaba dentro de la regla de abajo, que es lo natural mientras el cambio
     ocurre en un solo cuadro. Con la transición puesta deja de serlo: al
     salir, la clase .zoom se va en el primer cuadro y con ella el
     `transform-origin:top left`, que vuelve al centro DE GOLPE mientras la
     matriz todavía está interpolando. Los 460 ms siguientes la hoja se escala
     respecto a su centro en vez de a su esquina, así que crece hacia los
     cuatro lados a la vez y aterriza dando un tirón para volver a su sitio.
     Medido: a un 8% del camino, la hoja en x=137 cuando le tocaba x=11.
     transform-origin no está en la lista de propiedades que se interpolan, ni
     debería estarlo —lo que hay que arreglar es que cambie—. Aquí arriba no
     depende de ninguna clase y las dos direcciones usan la misma esquina.
     Sin transform puesto no hace nada, así que no le cuesta nada a nadie. */
  #pg .pg-inner{ transform-origin:top left; }
  #pg.zoom .pg-inner{
      transform:translate(var(--zx,0px), var(--zy,0px)) scale(var(--zk,1));
      transform-origin:top left; background:transparent; cursor:default; }
  /* ALEJARSE Y ACERCARSE SIN CORTE.

     Las tres cosas que cambian —la escala de la hoja, el papel que llenaba la
     pantalla y el papel chico de debajo— pasaban de un estado al otro en un
     solo cuadro. Eso no se lee como alejarse: se lee como que la pantalla se
     cambió por otra, y el ojo tiene que volver a buscar dónde quedó todo. Con
     medio segundo de por medio, la misma hoja se va haciendo chica delante de
     ti y no hay nada que reencontrar; es la razón entera de que exista esta
     vista, y se estaba perdiendo en el salto.

     Y POR QUÉ NO VIVE EN .pg-inner A SECAS. Mientras estás de lejos, sinZoom
     le quita el transform y se lo devuelve en cada repaginación, para medir la
     hoja a tamaño natural. Con la transición puesta siempre, cada una de esas
     medidas se vería como un temblor: la hoja creciendo y encogiéndose sola al
     pasar página. Se arma solo mientras dura el gesto —la clase .suavizando,
     que el guion pone y quita— y así lo que se interpola es exactamente lo que
     se pidió interpolar.

     La curva frena y no rebota: una hoja de papel apoyándose en la mesa no
     da un salto al llegar. */
  #pg.suavizando .pg-inner,
  #pg.suavizando #zoomPapel{ transition:transform .46s cubic-bezier(.32,.72,.24,1),
                                        opacity   .46s cubic-bezier(.32,.72,.24,1); }
  #pg.suavizando{ transition:background-color .46s cubic-bezier(.32,.72,.24,1); }
  /* Y QUIEN PIDIÓ MENOS MOVIMIENTO NO RECIBE ÉSTE. De todo lo que se mueve en
     este programa, esto es lo más grande: la hoja entera cambiando de tamaño y
     de sitio durante medio segundo. Es justo la clase de movimiento por la que
     existe la preferencia —quien la enciende suele hacerlo porque un plano que
     se le mueve debajo le marea— y sería raro apagar el giro de un disco y
     dejar puesto esto.
     Se apaga la transición, no el zoom: la hoja sigue viéndose entera, y
     llega ahí en un cuadro en vez de en veintiocho, que es como estaba antes.
     El fundido del papel se va con ella por lo mismo: apagar el movimiento y
     dejar el resto a medio camino daría una entrada más rara que las dos.
     Lo levantó la revisión de Codex. */
  @media (prefers-reduced-motion: reduce){
    #pg.suavizando, #pg.suavizando .pg-inner, #pg.suavizando #zoomPapel{ transition:none; }
  }
  /* EL PAPEL DE DEBAJO, Y POR QUÉ HACE FALTA UNO APARTE.
     .pg-inner no es la hoja entera: la hoja lleva 22px de relleno arriba y 18
     abajo —el aire del titulillo y del folio— y eso es .pg, no .pg-inner. Al
     pintar el papel sobre .pg-inner, la hoja de lejos salía sin ese aire.
     El defecto se veía justo al pasar hoja: la FOTO del pliegue retrata .pg
     entera, con su relleno, así que en cuanto empezaba el giro aparecían los
     márgenes que faltaban, y al aterrizar volvían a encogerse. Empezaba
     estrecha, giraba ancha y terminaba estrecha otra vez.
     Este respaldo se coloca desde el guion con la medida de .pg —la misma que
     usa la foto— así que las dos coinciden exactamente y el salto desaparece.
     Va detrás de todo, y es él quien lleva ahora el canto redondeado y la
     sombra de hoja flotando. */
  #zoomPapel{ position:absolute; z-index:0; display:none;
              background:var(--papel,#faf7f1); border-radius:3px;
              transform-origin:top left;
              box-shadow:0 10px 26px -8px rgba(0,0,0,.5); pointer-events:none; }
  #pg.zoom #zoomPapel{ display:block; }
  /* Los filos NO se apagan de lejos: se recortan al canto de la hoja pequeña
     desde el guion (ver medirZoom), para que el papel se siga pasando con el
     dedo —con su huella y su pliegue— igual que de cerca. Lo único que cambia
     es dónde están, no lo que hacen. */
  /* Y las dos esquinas de abajo se quitan de en medio mientras dura: la
     derecha se la quedan los botones de hoja, y la izquierda el propio botón
     del zoom, que se queda para poder salir también por donde entraste. */
  .stage.zoom #btnHistorial, .stage.zoom #btnVolver{ display:none !important; }

  /* LAS DOS ESQUINAS DE ABAJO, EN PUNTOS. Tenían dibujo —un menos dentro de un
     círculo y una flecha girando— y el dibujo no estaba aportando: a ese
     tamaño ninguno de los dos se lee como lo que significa, y encima obligaban
     a mirar dos cosas distintas en dos esquinas para acordarse de cuál era
     cuál. Lo que de verdad los distingue es DÓNDE están, y eso ya se sabe
     después de usarlos una vez.
     Así que se quedan en lo que hacía falta: un punto gordo que dice "aquí hay
     algo que tocar" y nada más. El blanco de toque no encoge —el círculo va
     entero, es la tinta la que se retira—. */
  #btnZoom, #btnHistorial{ position:absolute; bottom:8px; z-index:7;
            width:34px; height:34px; padding:0; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            background:transparent; border:0; border-radius:50%;
            -webkit-tap-highlight-color:transparent;
            -webkit-user-select:none; user-select:none; }
  #btnZoom{ left:8px; }
  #btnHistorial{ right:8px; }
  #btnZoom::before, #btnHistorial::before{ content:''; display:block;
            width:11px; height:11px; border-radius:50%;
            background:#a98f57; opacity:.62;
            transition:opacity .28s cubic-bezier(.65,0,.35,1),
                       background .28s cubic-bezier(.65,0,.35,1),
                       transform .28s cubic-bezier(.3,.8,.4,1); }
  #btnZoom:hover::before, #btnHistorial:hover::before{ opacity:1; transform:scale(1.18); }
  #btnZoom:active::before, #btnHistorial:active::before{ transform:scale(.9); }
  /* Abierto, el punto se pone del marrón macizo del programa: el mismo idioma
     que un botón cumplido en el panel. */
  #btnZoom.abierto::before, #btnHistorial.abierto::before{
            background:#b8892b; opacity:1; transform:scale(1.25); }
  /* Y de lejos, el botón que abrió el zoom se va: ya no hay nada que abrir, se
     sale tocando el hueco, y un control encendido que no lleva a ningún sitio
     solo compite con el papel. */
  .stage.zoom #btnZoom{ display:none !important; }
  /* El botón de volver del salto sube un piso: la esquina de abajo a la
     izquierda ahora tiene dueño. */
  #btnVolver{ bottom:46px; }

  /* Los dos de pasar hoja. Van en la escena y NO dentro de #pg, para que el
     escalado no se los lleve por delante: tienen que medir lo que mide un
     dedo aunque la hoja mida la mitad. */
  /* AL CENTRO, y no en la esquina donde estaban. Dejaron de ser dos puertas
     que se tocan de vez en cuando para ser un mando que se agarra y se corre a
     los lados: un mando se pone donde cae el pulgar sin pensar y donde tiene
     sitio para moverse a los DOS lados por igual. En la esquina derecha, correr
     el botón hacia afuera se salía de la pantalla a los treinta píxeles.
     El centro de abajo además deja libres las dos esquinas, que ya tienen
     dueño: el hueco a la izquierda y el rastro a la derecha. */
  #zoomPasos{ position:absolute; left:50%; transform:translateX(-50%);
              bottom:8px; z-index:7;
              display:none; gap:8px; }
  .stage.zoom #zoomPasos{ display:flex; }
  /* DOS PUNTOS, NO DOS FLECHAS. Un par de chevrones dentro de recuadros
     pálidos es mucho aparato para lo que hacen, y encima compiten con el papel
     justo cuando el papel es lo único que importa: de lejos se está mirando la
     hoja, no la interfaz. Un punto redondo y gordo dice "toca aquí" sin decir
     nada más, y a esta distancia una flecha tampoco se leería como flecha.
     Cuál pasa hacia dónde no lo dice el dibujo: lo dice el sitio. El de la
     derecha adelanta y el de la izquierda retrocede, que es la convención de
     cualquier libro y del propio filo de la hoja.
     Redondos y sin recuadro: el punto ES el botón. El blanco de toque sigue
     midiendo lo que tiene que medir aunque la tinta sea chica —el círculo va
     entero, es el color el que se retira—. */
  #zoomPasos button{ width:66px; height:66px; padding:0; cursor:pointer;
                     display:flex; align-items:center; justify-content:center;
                     background:transparent; border:0; border-radius:50%;
                     -webkit-tap-highlight-color:transparent;
                     /* El desliz hacia arriba es NUESTRO, no del navegador. Sin
                        esto, empujar el botón hacia arriba con el dedo cuenta
                        como desplazar la página: el navegador se queda con el
                        gesto, manda pointercancel a media subida y el
                        automático no llega a arrancar nunca. */
                     touch-action:none;
                     transition:opacity .26s cubic-bezier(.65,0,.35,1); }
  /* El punto va CLARO y no oscuro, y esto lo dijo la captura: de lejos el
     fondo que rodea la hoja es el escritorio, que es marrón oscuro. Un punto
     marrón encima se perdía del todo —discreto acabó siendo invisible, que no
     es lo mismo—. En crema se lee sin gritar, que era lo que se pedía. */
  /* AQUÍ SÍ VAN LAS FLECHAS, y no es contradicción con los puntos de la
     esquina. Aquellos son puertas: se tocan una vez y lo que hacen se aprende
     de dónde están. Éstos son un PAR, hacen cosas opuestas y se usan seguidos,
     así que hay que distinguirlos entre sí a cada toque; ahí un dibujo que
     apunta hacia donde va la hoja se lee sin pensar y dos puntos iguales
     obligan a acordarse de cuál era cuál cada vez.
     Redondos, eso sí: la forma de la esquina se conserva. */
  /* MÁS GRANDES, PERO NO MÁS PESADOS. Crecen un cincuenta por ciento porque
     son los únicos controles de la vista de lejos y se usan seguidos, mirando
     el papel y no el botón. Lo que NO crece a la par es la tinta: escalarlo
     todo por igual —disco y flecha— da dos manchones oscuros sobre el
     escritorio, que es justo lo que se vino a mirar por detrás. La flecha sube
     de 24 a 28 y no a 36, y el disco se aclara de .22 a .15, así que el blanco
     de toque es medio dedo más grande y el peso en pantalla es el mismo o
     menos. Es la misma regla que ya siguen los puntos de las esquinas: el
     círculo va entero, es el color el que se retira. */
  /* Y ENTEROS, NO A MEDIA LUZ. Estaban al 62% de opacidad por discreción, y
     la discreción se leyó como avería: al lado de un botón deshabilitado de
     verdad —que es el mismo dibujo al 16%— un botón a medio encender parece
     otro deshabilitado, solo que menos. Y aquí eso importa más que en ningún
     otro sitio, porque justamente estos dos SE APAGAN cuando se acaba el
     libro: si el apagado no se distingue del encendido, la única señal que dan
     deja de decir nada.
     Lo discreto se lo sigue quedando la tinta, que es donde tiene que estar:
     una flecha crema de 28px sobre un disco casi transparente ya es poca cosa
     en pantalla. Lo que se retira es el color, no el estado. */
  #zoomPasos button{ color:#efe4c8; font:400 28px/1 var(--ui);
                     background:rgba(0,0,0,.15); opacity:1;
                     text-shadow:0 1px 3px rgba(0,0,0,.5);
                     transition:opacity .26s cubic-bezier(.65,0,.35,1),
                                background .26s cubic-bezier(.65,0,.35,1),
                                transform .26s cubic-bezier(.3,.8,.4,1); }
  #zoomPasos button:hover{ background:rgba(0,0,0,.34); transform:scale(1.08); }
  #zoomPasos button:active{ transform:scale(.94); }
  /* MIENTRAS EL DEDO TIRA, EL BOTÓN NO INTERPOLA. El seguimiento se escribe
     cuadro a cuadro en el atributo de estilo, y con la transición puesta cada
     cuadro arrancaría una rampa de 260 ms hacia el siguiente: el botón iría
     un cuarto de segundo por detrás del dedo, que es lo que hace que un gesto
     se sienta pegajoso. Al soltar se borra el estilo y la rampa vuelve, así
     que la vuelta a su sitio sí es suave.
     El :active de arriba también sobra aquí: encoger y subir a la vez son dos
     transformaciones sobre la misma propiedad, y gana la última escrita. */
  #zoomPasos button[style*="translate"]{ transition:none; }
  /* EL MARRÓN ES EL DE SIEMPRE: el de la pestaña abierta y el del libro en el
     que estás dentro del panel de Libros. Aquí significa lo mismo que allí
     —esto es lo que está pasando ahora mismo— y por eso no estrena color.
     Va después de :hover a propósito: mientras el automático anda, el estado
     manda sobre el dedo que pase por encima. Y antes de :disabled, que sigue
     ganando: si se acaba el libro, el botón se apaga aunque venga encendido. */
  #zoomPasos button.auto{ background:#b8892b; color:#fff8e4; opacity:1; }
  /* El deshabilitado baja a .2 y no a .16: ahora es la ÚNICA diferencia de
     luz que hay en estos botones —los demás van enteros—, así que ya no tiene
     que competir con un 62% para leerse como apagado, y en el escritorio
     oscuro un 16% se acercaba demasiado a no estar. */
  #zoomPasos button:disabled{ cursor:default; opacity:.2; transform:none; }

  @media (max-width: 560px){
    /* En el teléfono el punto se HACE MÁS CHICO, no más grande. Es la única
       medida de toda la pantalla que va al revés que las demás, y tiene su
       razón: los puntos no se leen, se tocan. El blanco de toque sí sube a 44,
       que es lo que necesita el pulgar; la tinta baja a 9, que es lo que
       necesita una señal discreta que no compita con el papel. En pantalla
       ancha se quedan como estaban, que ahí ya estaban bien. */
    #btnZoom, #btnHistorial{ width:44px; height:44px; bottom:10px; }
    #btnZoom{ left:10px; } #btnHistorial{ right:10px; }
    #btnZoom::before, #btnHistorial::before{ width:9px; height:9px; }
    #btnVolver{ bottom:58px; }
    /* Más grandes y más separadas: son los únicos controles de la vista de
       lejos y se usan seguidos, uno tras otro, mirando el papel y no el botón.
       Con 52 y 10 de hueco el pulgar rebotaba de uno a otro; con 62 y 18 cada
       uno tiene su sitio y no hay que apuntar.

       Y AQUÍ SE PARÓ EL CRECIMIENTO: en 80, no en 93. El cincuenta por ciento
       que se pidió daba 93, y 93 más 93 más el hueco son 206 px de los 412 que
       mide la pantalla —la mitad del ancho ocupada por dos botones, en la
       vista que existe justamente para ver la hoja entera—. Con 80 y 16 siguen
       siendo casi un tercio más grandes que los de antes, que es de sobra para
       el pulgar, y le devuelven treinta píxeles al papel.
       La tinta baja a 34 por la regla de siempre: lo que crece es el blanco de
       toque, no la mancha. */
    #zoomPasos{ bottom:12px; gap:16px; }
    #zoomPasos button{ width:80px; height:80px; font-size:34px; }
  }

  /* ============================================================
     LA VERSIÓN, DONDE SE PREGUNTA POR ELLA.

     El rótulo del pie abría el panel de Formato entero, y la versión era su
     última fila de diez: había que barrer el panel para encontrar justo lo que
     acababas de pedir. Eso se tapó un tiempo con un destello dorado sobre la
     fila, que es la clase de arreglo que confiesa el problema en vez de
     resolverlo —si hay que señalar dónde quedó lo que pediste, es que no
     quedó donde tenía que quedar—.

     Ahora el rótulo abre la lista de versiones y nada más. La fila sigue en
     Formato, porque ahí es donde se va cuando se anda cambiando ajustes; lo
     que cambia es que tocar "VBL" ya no es un rodeo. Y el destello se retira
     entero: la puerta lleva a la cosa, así que no hay nada que señalar.

     Sale del pie hacia arriba, que es de donde la llamaste, y con la lista
     completa: aquí sí caben los nombres largos, que es lo que hace falta para
     elegir entre cuatro traducciones. En el panel siguen siendo abreviaturas
     porque allí compiten por sitio con otros nueve ajustes.
     ============================================================ */
  #burbujaVersion{ position:absolute; left:50%; bottom:40px; z-index:9;
                   width:min(300px, calc(100% - 24px));
                   display:none; flex-direction:column; max-height:62%;
                   overflow-y:auto; overscroll-behavior:contain;
                   background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
                   border:1px solid rgba(140,116,68,.5); border-radius:6px;
                   box-shadow:0 12px 28px -9px rgba(0,0,0,.55);
                   padding:6px; scrollbar-width:none;
                   opacity:0; transform:translate(-50%, 9px) scale(.97);
                   transform-origin:bottom center;
                   transition:opacity .2s ease,
                              transform .28s cubic-bezier(.2,.85,.3,1); }
  #burbujaVersion::-webkit-scrollbar{ width:0; height:0; display:none; }
  #burbujaVersion.visible{ opacity:1; transform:translate(-50%, 0) scale(1); }
  .bv-tit{ display:block; font:700 10.5px/1 var(--ui); letter-spacing:.14em;
           text-transform:uppercase; color:#8a7746; padding:3px 3px 6px; }
  .bv-fila{ display:flex; align-items:baseline; gap:9px; width:100%;
            border:0; background:rgba(255,253,247,.62); cursor:pointer;
            text-align:left; padding:9px; border-radius:4px; margin-bottom:5px;
            min-height:40px; -webkit-tap-highlight-color:transparent;
            transition:background .28s cubic-bezier(.65,0,.35,1),
                       color .28s cubic-bezier(.65,0,.35,1); }
  .bv-fila:last-child{ margin-bottom:0; }
  .bv-fila:hover{ background:#fffdf6; }
  /* La puesta va en marrón macizo, igual que un botón cumplido en el panel:
     es el mismo idioma en otro sitio, y así no hay nada nuevo que aprender. */
  .bv-fila.aqui, .bv-fila.aqui:hover{ background:#b8892b; }
  .bv-fila.aqui .bv-abrev, .bv-fila.aqui .bv-nombre{ color:#fff8e4; }
  .bv-abrev{ flex:0 0 auto; min-width:62px; font:700 13px/1.35 var(--ui);
             color:#6d5c33; letter-spacing:.06em; white-space:nowrap; }
  .bv-nombre{ flex:1 1 auto; min-width:0; font:400 12.5px/1.35 var(--ui);
              color:#4a3a1c; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }

  @media (max-width: 560px){
    #burbujaVersion{ bottom:52px; }
    .bv-fila{ min-height:44px; padding:10px; }
    .bv-abrev{ font-size:14px; min-width:68px; }
    .bv-nombre{ font-size:13.5px; }
  }

  /* ============================================================
     EL HISTORIAL DE LO VISTO.

     Un lector de la Biblia salta mucho: una referencia lleva a otra y a la
     media hora no te acuerdas de por dónde entraste. El botón de volver
     resuelve UN paso atrás —el último salto— y eso no es un rastro: es un
     deshacer. Aquí queda el rastro entero.

     Guarda ESCRITURAS y no glosas a propósito. Las glosas ya tienen su lista
     en el panel de Glosas, ordenada por canon y filtrable; ésta es la otra
     cosa, la que no estaba: por dónde has ido pasando, en el orden en que
     pasaste. Por eso va por tiempo y no por canon, y por eso lo más reciente
     va arriba.
     ============================================================ */
  /* Sube desde su esquina, que es de donde lo llamaste. Nada de cortina: la
     cortina es el gesto de la burbuja de arriba, y dos cosas que aparecen
     igual se confunden. */
  #historial{ position:absolute; right:6px; bottom:44px; z-index:8;
              width:min(340px, calc(100% - 12px)); max-height:62%;
              display:none; flex-direction:column; overflow-y:auto;
              overscroll-behavior:contain;
              background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
              border:1px solid rgba(140,116,68,.5); border-radius:6px;
              box-shadow:0 12px 26px -9px rgba(0,0,0,.55);
              padding:6px; scrollbar-width:none;
              opacity:0; transform:translateY(9px) scale(.97);
              transform-origin:bottom right;
              transition:opacity .2s ease, transform .28s cubic-bezier(.2,.85,.3,1); }
  #historial::-webkit-scrollbar{ width:0; height:0; display:none; }
  #historial.visible{ opacity:1; transform:none; }
  /* EL RÓTULO, SOLO EN SU RENGLÓN.

     Aquí vivió también el paso atrás, y se ha bajado al renglón de los botones
     —ver .hs-acciones—. Se queda el renglón propio aunque ahora lleve un solo
     hijo: el relleno de arriba del panel es éste, y disolverlo obligaría a
     devolvérselo al rótulo, que es de donde vino. */
  .hs-cab{ display:flex; align-items:center; gap:8px; padding:3px 3px 6px; }
  .hs-tit{ font:700 10.5px/1 var(--ui);
           letter-spacing:.14em; text-transform:uppercase; color:#8a7746; }
  /* EL PASO ATRÁS. Dice a dónde va además de llevar la flecha: una flecha
     sola en una lista de escrituras no distingue «atrás por donde vine» de
     «sube una fila», y la referencia lo desambigua sin gastar un renglón.
     margin-left:auto lo manda a la derecha del renglón del rótulo, que es lo
     pedido y además el borde por el que este panel crece. Y flex-shrink:0
     porque su referencia no se parte: antes que encogerse y partir «Lc 2:1»
     en dos renglones, que se recorte el rótulo, que es texto fijo. */
  /* Y ES UN BLANCO QUE SE PUEDA TOCAR. Nació del tamaño del rótulo que tiene
     al lado —10.5px de letra y 4px de relleno—, o sea unos 19px de alto: la
     mitad de lo que mide un dedo, en un panel que se usa con el pulgar y con
     filas de 40px justo debajo. Fallar el botón y caer en una fila cuesta un
     salto a otra escritura, que es lo contrario de volver. Ahora mide 34px de
     alto —38 en pantalla chica—, que es el mínimo con el que se acierta, y la
     letra sube a la de las filas para que no parezca un rótulo. */
  /* Ya no lleva margin-left:auto: vive en .hs-acciones, que empuja a sus dos
     hijos al filo derecho con justify-content. Con el auto puesto se habría
     separado del botón de al lado hasta el otro extremo del renglón, que es
     justo lo contrario de tenerlos juntos. */
  .hs-atras{ flex:0 0 auto;
             display:inline-flex; align-items:center; justify-content:center;
             gap:7px; min-height:34px;
             font:600 12px/1 var(--ui); letter-spacing:.06em;
             color:#6d5a2c; background:rgba(140,116,68,.13);
             border:1px solid rgba(140,116,68,.4); border-radius:999px;
             padding:7px 13px 7px 15px; cursor:pointer;
             -webkit-tap-highlight-color:transparent; }
  .hs-atras:hover{ background:rgba(140,116,68,.26); color:#4d3f1d; }
  .hs-atras:active{ transform:translateY(1px); }
  .hs-atras-ref{ text-transform:none; letter-spacing:.02em; }
  /* LA FLECHA SE DIBUJA, NO SE ESCRIBE.

     Era el carácter «←», y salía flaquísima venga de donde venga el botón:
     los tipos de interfaz dibujan las flechas con un solo trazo de pelo y no
     traen versión gorda, así que el negrita del botón no las engorda —el
     navegador la saca de la fuente que tenga a mano, y ninguna la tiene
     recia—. Al lado de una referencia en 12px seminegrita, un pelo de trazo
     se lee como suciedad y no como una flecha.

     Con un trazo propio el grosor es una cifra que se elige: 2.2 sobre un
     lienzo de 16, o sea un trazo del mismo peso que la letra que acompaña.
     Y hereda el color por currentColor, así que sigue encendiéndose con el
     botón al pasar por encima sin repetir el color en dos sitios. */
  .hs-flecha{ flex:0 0 auto; width:15px; height:15px; display:block;
              fill:none; stroke:currentColor; stroke-width:2.2;
              stroke-linecap:round; stroke-linejoin:round; }
  /* LA FILA ES UNA SOLA LÍNEA, Y ESO NO ES DECORACIÓN. Una lista en la que
     cada renglón mide lo mismo se recorre con el ojo; una en la que cada
     entrada mide dos o tres líneas hay que leerla. Por eso la referencia va
     en una columna fija a la izquierda —así los números quedan alineados— y
     el texto se corta con puntos suspensivos donde deje de caber. */
  .hs-fila{ display:flex; align-items:baseline; gap:9px; width:100%;
            border:0; background:rgba(255,253,247,.62); cursor:pointer;
            text-align:left; padding:9px 9px; border-radius:4px;
            margin-bottom:5px; min-height:40px;
            -webkit-tap-highlight-color:transparent;
            transition:background .28s cubic-bezier(.65,0,.35,1); }
  .hs-fila:last-child{ margin-bottom:0; }
  .hs-fila:hover{ background:#fffdf6; }
  .hs-fila.aqui{ box-shadow:inset 0 0 0 1.5px rgba(184,137,43,.7); }
  .hs-ref{ flex:0 0 auto; min-width:64px; font:700 13px/1.35 var(--ui);
           color:#6d5c33; letter-spacing:.02em; white-space:nowrap; }
  .hs-txt{ flex:1 1 auto; min-width:0; font:400 13px/1.35 var(--ui);
           color:#4a3a1c; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; }
  .hs-vacio{ display:block; padding:8px 5px 10px; font:400 12.5px/1.5 var(--ui);
             color:#6b5936; opacity:.8; }

  /* ============================================================
     EL SEPARADOR DE LECTURA: LA CINTA QUE CUELGA DEL MARGEN.

     Es el objeto que se deja dentro de un libro para volver, y por eso vive
     DENTRO del papel y no encima de la pantalla: cuelga de la columna de
     glosas, se corre con la hoja cuando el papel se corre —en el teléfono la
     hoja es más ancha que la ventana— y la propia columna lo recorta, así que
     no hay manera de que se salga ni de que empuje la página a lo ancho.

     CORTA A PROPÓSITO, PERO SE VE DESDE EL TEXTO. Cuelga del borde IZQUIERDO
     de la columna de glosas y asoma 19 px hacia la columna de lectura, para
     que se note que hay cinta sin tener que abrir el cajón de las glosas.
     El ancho es el doble de lo que era —36 % de la columna, entre 32 y 64 px—
     y el alto sale de la misma proporción (aspect-ratio 1 / 1.75), así que
     también queda al doble. Con eso ocupa la esquina de arriba a la izquierda
     de las glosas y deja el titulillo, que vive a la derecha, en paz.

     La percha no recibe toques: los reciben la cinta y su equis, que son
     botones de verdad. Importa por dos cosas que ya estaban: el papel se
     arrastra con el dedo y su lista de "esto no es papel" ya conoce los
     botones, y las glosas de debajo tienen que poder tocarse por el hueco. */
  /* ARRANCA EN EL FILO DEL PAPEL, sin hueco por encima. Una cinta de verdad
     sale del canto de arriba del libro; empezada un poco más abajo se lee como
     una pegatina puesta en medio de la hoja, y el hueco entre el filo y ella es
     lo primero que salta a la vista.

     El filo NO es el alto de .pg-inner: la hoja tiene 22px de relleno arriba,
     así que la caja del contenido empieza ya metida. Por eso --cinta-arriba es
     un número NEGATIVO —lo mide el guion, que es quien puede preguntar cuánto
     relleno hay— y por eso la percha cuelga de .pg-inner y no de la columna de
     glosas: la columna la recorta con su overflow, y lo que asomara por encima
     se perdería. El ancho sigue saliendo de la columna, medido aparte. */
  .sep-percha{ position:absolute; top:var(--cinta-arriba,0px);
               left:var(--cinta-izq,0px); z-index:4;
               width:var(--cinta-ancho,56px); aspect-ratio:1 / 1.75;
               pointer-events:none; }
  /* Zona invisible a la IZQUIERDA de la cinta: el asomo es estrecho y se
     confunde con el filo de pasar hoja. Unos 50 px más de blanco de toque
     (solo a la altura de la cinta) hacen que ahí mande el menú, no la huella. */
  .sep-hit{ position:absolute; right:100%; top:0; width:50px; height:100%;
            border:0; padding:0; margin:0; background:transparent; cursor:pointer;
            pointer-events:auto; -webkit-tap-highlight-color:transparent; }
  /* La tela: un degradado de lado a lado —la cinta no es plana, tiene un
     doblez— y encima un rayado finísimo que insinúa la trama. La cola en pico
     se recorta con clip-path, que es lo que la distingue de una pestaña de
     colores; y por eso la sombra va en filter y no en box-shadow: box-shadow
     dibuja la caja, no la forma recortada. */
  .separador{ position:absolute; inset:0; border:0; padding:0; margin:0;
              cursor:pointer; pointer-events:auto; -webkit-tap-highlight-color:transparent;
              background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px,
                                                 rgba(0,0,0,.05) 1px 3px),
                linear-gradient(100deg, var(--tela-osc,#7a1f1f) 0%,
                                        var(--tela,#9b2a2a) 32%,
                                        var(--tela,#9b2a2a) 68%,
                                        var(--tela-osc,#7a1f1f) 100%);
              clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
              /* DOS SOMBRAS, y la clara es la que importa. Una cinta puesta en
                 la esquina de la columna se cruza con la primera glosa cuando
                 la hay —es lo que hace una cinta de verdad: se echa encima de
                 lo que haya— y sin nada que las separe, el renglón cortado se
                 lee como una nota rota. Con un filo de papel a su izquierda,
                 el texto pasa POR DEBAJO y se entiende que sigue ahí.
                 Por eso asoma 19 px al texto: se ve claro desde la lectura
                 y aún no tapa el versículo. El titulillo vive a la derecha
                 y ya no comparte esquina con ella. */
              filter:drop-shadow(-1.5px 0 0 rgba(252,247,235,.92))
                     drop-shadow(0 2px 3px rgba(60,40,15,.42));
              transition:transform .24s cubic-bezier(.2,.85,.3,1), filter .22s ease; }
  .separador:hover{ filter:drop-shadow(-1.5px 0 0 rgba(252,247,235,.92))
                            drop-shadow(0 3px 5px rgba(60,40,15,.5)); }
  .separador:active{ transform:translateY(1px); }
  /* El foco no puede ir en outline: el clip-path se lo lleva por delante. */
  .separador:focus-visible{ outline:none;
              box-shadow:inset 0 0 0 2px rgba(255,252,240,.92); }
  .separador.abierta{ transform:translateY(3px);
              filter:drop-shadow(-1.5px 0 0 rgba(252,247,235,.92))
                     drop-shadow(0 4px 7px rgba(60,40,15,.55)); }
  /* Cae desde arriba, y SOLO al ponerla: repetir la caída en cada repintado
     convertiría un gesto en un tic. */
  @keyframes sep-cae{ from{ transform:translateY(-105%); } to{ transform:none; } }
  .separador.cayendo{ animation:sep-cae .42s cubic-bezier(.2,.85,.3,1); }
  /* Entrada al pasar de hoja: más corta y discreta que la caída al ponerla.
     Se dispara DESPUÉS del pliegue, para no robar la lectura. */
  @keyframes sep-entra{ from{ opacity:0; transform:translateY(-22%); }
                        to{ opacity:1; transform:none; } }
  .separador.entrando{ animation:sep-entra .4s cubic-bezier(.2,.85,.3,1); }
  /* Salida simétrica: sube un poco y se desvanece, sin arrancar la lectura. */
  @keyframes sep-sale{ from{ opacity:1; transform:none; }
                       to{ opacity:0; transform:translateY(-18%); } }
  .separador.saliendo{ animation:sep-sale .32s cubic-bezier(.55,0,.35,1) forwards;
                       pointer-events:none; }
  /* Mientras la hoja aún se pliega, la cinta espera invisible. */
  .separador.sep-espera{ opacity:0; }
  /* La equis vive en la esquina de la cinta y solo mientras el menú está
     abierto: un botón de borrar siempre visible sobre algo que se toca para
     otra cosa es una trampa. */
  .sep-x{ position:absolute; top:2px; right:2px; width:18px; height:18px;
          display:none; place-items:center; pointer-events:auto;
          border:0; border-radius:50%; padding:0; cursor:pointer;
          background:rgba(255,252,240,.9); color:#5a3a12;
          -webkit-tap-highlight-color:transparent;
          opacity:0; transform:scale(.7);
          transition:opacity .18s ease, transform .22s cubic-bezier(.2,.85,.3,1); }
  .sep-x.viva{ display:grid; }
  .sep-x.viva.puesta{ opacity:1; transform:none; }
  .sep-x:hover{ background:#fff; }
  .sep-x:focus-visible{ outline:2px solid #b8892b; outline-offset:1px; }
  .sep-x svg{ display:block; width:9px; height:9px; }
  /* De lejos la cinta SE VE y SE TOCA: es justo lo que asoma del margen y
     lo que el lector busca. El filo de pasar hoja le cede el toque (ver
     toqueEnCinta). El resto de la hoja pequeña sigue siendo "acércame". */
  #pg.zoom .separador, #pg.zoom .sep-x, #pg.zoom .sep-hit{ pointer-events:auto; }

  /* EL MENÚ DE LA CINTA, LA OFERTA Y LA CONFIRMACIÓN se visten como el panel
     del rastro —papel dorado, borde tenue, sombra baja— porque son la misma
     clase de cosa: hojas pequeñas que salen de un sitio concreto y se van. */
  #sepMenu{ position:absolute; z-index:9; width:min(280px, calc(100% - 16px));
            max-height:64%; display:none; flex-direction:column; overflow-y:auto;
            overscroll-behavior:contain;
            background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
            border:1px solid rgba(140,116,68,.5); border-radius:6px;
            box-shadow:0 12px 26px -9px rgba(0,0,0,.55);
            padding:7px; scrollbar-width:none;
            opacity:0; transform:translateY(-8px) scale(.97);
            transform-origin:top left;
            transition:opacity .2s ease, transform .28s cubic-bezier(.2,.85,.3,1); }
  #sepMenu::-webkit-scrollbar{ width:0; height:0; display:none; }
  #sepMenu.visible{ opacity:1; transform:none; }
  .sp-tit{ display:block; font:700 10.5px/1 var(--ui); letter-spacing:.14em;
           text-transform:uppercase; color:#8a7746; padding:3px 3px 7px; }
  .sp-telas{ display:flex; gap:7px; padding:0 3px 9px; }
  .sp-tela{ flex:0 0 auto; width:30px; height:30px; border-radius:50%;
            border:1px solid rgba(90,70,30,.45); cursor:pointer; padding:0;
            -webkit-tap-highlight-color:transparent;
            transition:transform .2s cubic-bezier(.2,.85,.3,1); }
  .sp-tela:hover{ transform:scale(1.08); }
  .sp-tela[aria-pressed="true"]{ box-shadow:0 0 0 2px #f2e9d6, 0 0 0 3.5px #6d5a2c; }
  .sp-tela:focus-visible{ outline:2px solid #b8892b; outline-offset:2px; }
  .sp-fila{ display:flex; align-items:center; gap:4px; width:100%;
            background:rgba(255,253,247,.62); padding:4px 4px 4px 9px;
            border-radius:4px; margin-bottom:5px; min-height:38px;
            transition:background .28s cubic-bezier(.65,0,.35,1); }
  .sp-fila:last-child{ margin-bottom:0; }
  .sp-fila:hover{ background:#fffdf6; }
  .sp-fila.aqui{ box-shadow:inset 0 0 0 1.5px rgba(184,137,43,.7); }
  /* Ir al pasaje: ocupa el grueso de la fila. La X de borrar va aparte. */
  .sp-ir{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
          border:0; background:transparent; cursor:pointer; text-align:left;
          padding:6px 4px 6px 0; min-height:38px;
          -webkit-tap-highlight-color:transparent; }
  /* La muestra de color lleva la misma cola en pico que la cinta: quien no
     distinga los tonos reconoce igual la fila por su referencia. */
  .sp-chip{ flex:0 0 auto; width:11px; height:20px;
            clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
            border-radius:1px; }
  .sp-ref{ flex:1 1 auto; min-width:0; font:700 13px/1.3 var(--ui); color:#4a3a1c;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* EL NOMBRE, EN LA MISMA FILA Y CON LA MISMA LETRA. La referencia se queda
     delante y encogida a su abreviatura —«Mt 1:1 -»— porque cuando hay nombre
     el nombre es lo que se busca; el sitio exacto se lee después. Editando, la
     fila mantiene su alto para que la lista no dé un salto al abrir el campo. */
  .sp-edit{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:6px;
            padding:4px 4px 4px 0; min-height:38px; }
  .sp-edit-base, .sp-edit-aqui{ flex:0 0 auto; font:700 13px/1.3 var(--ui);
                                color:#4a3a1c; white-space:nowrap; }
  .sp-edit-aqui{ color:#6b5936; }
  .sp-nombre{ flex:1 1 auto; min-width:72px; height:30px; box-sizing:border-box;
              border:1px solid rgba(140,116,68,.45); border-radius:999px;
              background:rgba(255,253,247,.82); color:#4a3a1c;
              padding:6px 10px; font:600 13px/1 var(--ui); }
  .sp-nombre:focus{ outline:2px solid rgba(184,137,43,.55); outline-offset:1px; }
  /* EL LÁPIZ, hermano de la X y con su misma medida: son las dos cosas que se
     le hacen a una fila, y puestas iguales se leen como un par. */
  .sp-fila-lapiz{ flex:0 0 auto; }
  .sp-fila-lapiz:hover{ background:rgba(140,116,68,.2); color:#4d3f1d; }
  /* X por fila: borra ese separador tras el diálogo sí/no. */
  .sp-fila-x, .sp-fila-lapiz{
              width:36px; height:36px; display:grid; place-items:center;
              border:0; border-radius:50%; padding:0; cursor:pointer;
              background:transparent; color:#7b6838;
              -webkit-tap-highlight-color:transparent;
              transition:background .18s ease, color .18s ease; }
  .sp-fila-x:hover{ background:rgba(155,42,42,.14); color:#7d2323; }
  .sp-fila-x:focus-visible, .sp-fila-lapiz:focus-visible{
              outline:2px solid #b8892b; outline-offset:1px; }
  .sp-fila-x svg, .sp-fila-lapiz svg{ display:block; width:12px; height:12px; }
  .sp-vacio{ display:block; padding:6px 5px 8px; font:400 12.5px/1.5 var(--ui);
             color:#6b5936; opacity:.85; }
  /* La confirmación de borrado sale DENTRO del mismo menú y no en otra caja
     flotante: la pregunta es sobre la cinta que estás mirando, y sacarla a
     otro sitio de la pantalla obliga a buscar a qué se refiere.
     Los botones van grandes a propósito: en teléfono el área útil es estrecha
     y un toque fallido cancela sin querer. */
  /* Y VA PEGADA ARRIBA. Con la lista llena, la pregunta nacía al final del
     menú y había que desplazarse para contestarla: se preguntaba en un sitio
     que no se estaba mirando. position:sticky la deja a la vista sin sacarla
     del menú, que es lo que dice el párrafo de aquí arriba. */
  .sp-borrar{ position:sticky; top:7px; z-index:2;
              margin:0 0 10px; padding:14px 12px; border-radius:7px;
              background:rgba(155,42,42,.1); border:1px solid rgba(155,42,42,.35);
              box-shadow:0 10px 24px -13px rgba(60,40,15,.8);
              opacity:0; transform:translateY(-4px);
              transition:opacity .18s ease, transform .24s cubic-bezier(.2,.85,.3,1); }
  .sp-borrar.puesta{ opacity:1; transform:none; }
  .sp-pregunta{ display:block; font:600 14px/1.4 var(--ui); color:#5c2323;
                padding-bottom:12px; }
  .sp-botones{ display:flex; gap:10px; }
  .sp-btn{ flex:1 1 auto; min-height:48px; border-radius:999px; cursor:pointer;
           font:600 14px/1 var(--ui); letter-spacing:.04em; padding:12px 14px;
           -webkit-tap-highlight-color:transparent;
           border:1px solid rgba(140,116,68,.4); color:#6d5a2c;
           background:rgba(140,116,68,.13); }
  .sp-btn:hover{ background:rgba(140,116,68,.26); color:#4d3f1d; }
  .sp-btn.si{ border-color:rgba(155,42,42,.5); color:#7d2323;
              background:rgba(155,42,42,.14); }
  .sp-btn.si:hover{ background:rgba(155,42,42,.24); color:#5c1a1a; }
  .sp-btn:focus-visible{ outline:2px solid #b8892b; outline-offset:2px; }

  /* LA OFERTA. Sale abajo y en el centro, que es la única franja de la escena
     que no tiene nada encima —los cuatro rincones están ocupados— y sobre
     todo la que no tapa el texto que se estaba leyendo. No interrumpe: si no
     se contesta, se va sola y no vuelve a preguntar en esta lectura. */
  #sepOferta{ position:absolute; left:50%; bottom:54px; z-index:9;
              display:none; align-items:center; gap:10px;
              width:max-content; max-width:calc(100% - 24px);
              background:linear-gradient(to bottom, #f2e9d6, #e7dbbe);
              border:1px solid rgba(140,116,68,.5); border-radius:999px;
              box-shadow:0 12px 26px -9px rgba(0,0,0,.5);
              padding:7px 8px 7px 15px;
              opacity:0; transform:translateX(-50%) translateY(9px);
