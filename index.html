/* Las etiquetas viven en la marca, no en la glosa: así puedes filtrar
   también resaltados que todavía no tienen nada escrito. */
function todasEtiquetas(){
  const s = new Map();
  let sin = 0;
  for (const m of marcas){
    const t = m.etiquetas || [];
    if (!t.length) sin++;
    for (const x of t) s.set(x, (s.get(x)||0)+1);
  }
  return { mapa: s, sin };
}
/* El menú de libros del chip: solo los que de verdad tienen glosas, porque
   ofrecer los 66 obligaría a buscar entre libros vacíos. Y solo los que aún
   no están en el filtro. */
function menuDeLibros(rect){
  const conGlosas = new Map();
  for (const m of marcas)
    if (m.nota && m.libro !== LIBRO && !librosFiltro.has(m.libro))
      conGlosas.set(m.libro, (conGlosas.get(m.libro) || 0) + 1);
  if (!conGlosas.size){
    readout.textContent = 'no hay glosas en otros libros';
    return;
  }
  const orden = [...conGlosas.keys()].sort((a,b) =>
    CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b));
  mostrarMenu(orden.map(id =>
    '<button class="mi" data-libfil="' + id + '">' + esc(nombreDe(id)) +
    '<span class="n">' + conGlosas.get(id) + '</span></button>').join(''), rect);
}

function pintarFiltros(){
  const cont = $('filtros');
  cont.querySelectorAll('.chip').forEach(c => c.remove());
  const { mapa, sin } = todasEtiquetas();
  const add = (nombre, n) => {
    const b = document.createElement('span');
    b.className = 'chip' + (etiquetasOcultas.has(nombre) ? ' off' : '');
    b.innerHTML = esc(nombre) + '<span class="n">' + n + '</span>';
    b.onclick = () => { etiquetasOcultas.has(nombre) ? etiquetasOcultas.delete(nombre) : etiquetasOcultas.add(nombre); renderPage(); };
    cont.appendChild(b);
  };
  [...mapa.entries()].sort().forEach(([k,v]) => add(k,v));
  if (sin) add('(sin etiqueta)', sin);

  /* LOS CHIPS DE LIBRO. Los de etiqueta se APAGAN al tocarlos —están todos
     desde el principio y tú vas quitando—; éstos se AGREGAN, porque los libros
     son 66 y ponerlos todos sería una pared. Por eso el chip "+ libro" no
     desaparece nunca: sigue ahí para sumar el siguiente. */
  for (const id of [...librosFiltro].sort((a,b) => CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b))){
    const n = marcas.filter(m => m.nota && m.libro === id).length;
    const b = document.createElement('span');
    b.className = 'chip chip-libro';
    b.innerHTML = esc(nombreDe(id)) + '<span class="n">' + n + '</span><span class="x">×</span>';
    b.title = 'Quitar ' + nombreDe(id) + ' de la lista';
    b.onclick = () => { librosFiltro.delete(id); pintarFiltros(); pintarIndice(); };
    cont.appendChild(b);
  }
  const mas = document.createElement('span');
  mas.className = 'chip chip-mas';
  mas.textContent = '+ libro';
  mas.title = 'Sumar a la lista las glosas de otro libro';
  mas.onclick = ev => { ev.stopPropagation(); menuDeLibros(mas.getBoundingClientRect()); };
  cont.appendChild(mas);
  const sel = $('selActiva'), previo = etiquetaActiva;
  sel.innerHTML = '<option value="">— ninguna —</option>' +
    [...mapa.keys()].sort().map(k => '<option>'+esc(k)+'</option>').join('');
  sel.value = previo;
  $('banda').classList.toggle('apagada', !etiquetaActiva);
  pintarDias();
}
/* ============================================================
   POR DÍA. La fecha se queda como campo, no como etiqueta: si cada
   día fuera un chip, a los seis meses habría ciento ochenta chips
   revueltos con "estudio". Aquí tiene su propio control, y sirve de

$('selDia').onchange = e => { diaFiltro = e.target.value; renderPage(); };
$('btnEtiquetarDia').onclick = () => {

$('nuevaEtiqueta').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;

/* ---------- fotos y pliegue ---------- */
let pageImg=null, nextImg=null, prevImg=null, pend=false, folding=false;
let snapFirma = null;
const snapStale = () => (snapFirma !== estiloFirma());
function invalidateSnapshot(){
  pageImg = nextImg = prevImg = null;
  if (pend) return; pend = true;
  setTimeout(() => { pend = false; makeSnapshot(); }, 0);
}
/* ============================================================
   LA FOTO, POR MEDICIÓN Y NO POR RECOMPOSICIÓN.
   Igualar ajustes entre la hoja viva y el SVG nunca alcanzó: son dos
   motores de composición y cada uno decide por su cuenta dónde parte el
   renglón. Así que ya no se le pide al SVG que componga texto —solo pinta
   papel, recuadros y bordes— y cada palabra se dibuja en el lienzo en la
   coordenada exacta donde el navegador la puso en la hoja real.
   Coincide por construcción, no por coincidencia.
   ============================================================ */
function medirPalabras(hostEl){
  const host = hostEl.getBoundingClientRect();
  const salida = [];
  /* Las glosas van torcidas, y un rectángulo de texto girado devuelve su caja
     envolvente, no su posición real: medir así dejaría las letras corridas.
     Se enderezan un instante para medirlas en limpio, se apunta el ángulo y el
     centro de giro de cada una, y al final se devuelven a su sitio. El lienzo
     rehace el giro palabra por palabra. Nadie ve nada: no hay repintado entre
     el enderezado y el restablecido, todo pasa dentro del mismo cuadro. */
  const torcidas = [];
  for (const el of hostEl.querySelectorAll('[data-giro]')){
    torcidas.push({ el:el, previo:el.style.transform });
    el.style.transform = 'none';
  }
  const eje = new Map();
  for (const t of torcidas){
    const r = t.el.getBoundingClientRect();
    eje.set(t.el, { a: parseFloat(t.el.dataset.giro || 0) * Math.PI / 180,
                    gx: r.left - host.left + r.width/2,
                    gy: r.top  - host.top  + r.height/2 });
  }
  const paseo = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT);
  const rango = document.createRange();
  let n;
  while ((n = paseo.nextNode())){
    if (!n.nodeValue.trim()) continue;
    const el = n.parentElement;
    if (!el || el.offsetParent === null && el.closest('#ghost') === null) continue;
    const est = getComputedStyle(el);
    if (est.visibility === 'hidden' || est.display === 'none') continue;
    const tipo = est.fontStyle + ' ' + est.fontWeight + ' ' + est.fontSize + ' ' + est.fontFamily;
    /* El lienzo sí sabe de espaciado entre letras y de variantes numéricas,
       pero hay que pasárselos aparte: no viajan en la abreviatura de font. */
    const esp = est.letterSpacing === 'normal' ? '0px' : est.letterSpacing;
    const re = /\S+/g;
    let m;
    while ((m = re.exec(n.nodeValue))){
      rango.setStart(n, m.index);
      rango.setEnd(n, m.index + m[0].length);
      const rects = rango.getClientRects();
      if (!rects.length) continue;
      const r = rects[0];                 // sin guiones, una palabra = un rectángulo
      if (r.width < .5) continue;
      const caja = el.closest('[data-giro]');
      const j = caja ? eje.get(caja) : null;
      salida.push({ t:m[0], x:r.left - host.left, y:r.top - host.top,
                    w:r.width, h:r.height, f:tipo, c:est.color, e:esp,
                    a: j ? j.a : 0, gx: j ? j.gx : 0, gy: j ? j.gy : 0 });
    }
  }
  for (const t of torcidas) t.el.style.transform = t.previo;
  return salida;
}
function pintarPalabras(g, palabras){
  g.textBaseline = 'alphabetic';
  let ultimo = null, subida = 0;
  for (const p of palabras){
    const clave = p.f + '|' + p.e;
    if (clave !== ultimo){
      g.font = p.f;
      if ('letterSpacing' in g) g.letterSpacing = p.e;
      ultimo = clave;
      const m = g.measureText('Hxg');
      subida = m.fontBoundingBoxAscent || m.actualBoundingBoxAscent || p.h * 0.8;
    }
    g.fillStyle = p.c;
    /* si la palabra vive en una glosa torcida, se gira el lienzo igual que
       la caja: mismo ángulo y mismo centro que en la hoja viva */
    if (p.a){ g.save(); g.translate(p.gx, p.gy); g.rotate(p.a); g.translate(-p.gx, -p.gy); }
    /* El motor de texto del lienzo compone las letras dentro de la palabra
       con mínimas diferencias respecto al del navegador —uno o dos píxeles.
       En vez de confiar en él, se le obliga a ocupar el ancho EXACTO que la
       palabra tiene en la página. */
    const anchoLienzo = g.measureText(p.t).width;
    if (p.w > 0.5 && Math.abs(anchoLienzo - p.w) > 0.25 && anchoLienzo > 0.5){
      g.save();
      g.translate(p.x, 0);
      g.scale(p.w / anchoLienzo, 1);
      g.fillText(p.t, 0, p.y + subida);
      g.restore();
    } else {
      g.fillText(p.t, p.x, p.y + subida);
    }
    if (p.a) g.restore();
  }
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}

function buildSVG(bodyHTML, marginHTML, footHTML, mw, gap, w, h, cabeza){
  const fs = fontSize+'px', m = mw||'0px', g = gap||'0px';
  /* En teléfono las columnas van escritas a la fuerza también aquí dentro: el
     SVG lleva su propia copia de PAGE_CSS y NO ve las reglas del modo angosto,
     que viven en la hoja de estilos de la aplicación. Sin esto, la foto se
     compone con el acomodo de escritorio y sale otra hoja. */
  const med = enTelefono() ? { texto:pgBody.offsetWidth, glosa:pgMargin.offsetWidth,
                               hueco:11, orilla:16 } : null;
  const estBody  = med ? 'flex:0 0 '+med.texto+'px;width:'+med.texto+'px;min-width:'+med.texto+
                         'px;padding-left:'+med.orilla+'px;padding-right:'+med.orilla+'px;' : '';
  const estInner = med ? ' style="width:'+(med.texto+med.hueco+med.glosa)+'px;max-width:none;' +
                         'padding-bottom:'+getComputedStyle(pgBody.closest('.pg-inner')).paddingBottom+'"' : '';
  /* Los rótulos también: en teléfono van centrados sobre la columna de texto y
     el cuerpo baja para dejarlos respirar. Eso vive en la hoja de estilos
     de la aplicación, dentro de un @media que el SVG no ve —trae su propia
     copia de PAGE_CSS y nada más—. Sin repetirlo aquí, la foto salía con el
     titulillo en la esquina y el texto más arriba, y al voltear la hoja
     el texto daba un brinco.
     Cuánto baja el texto ya NO se repite como número: se lee de la hoja viva.
     Estaba escrito 15px en los dos lados, y cuando se corrigió el de la hoja
     de estilos este se habría quedado atrás —que es exactamente el brinco que
     describe el párrafo de arriba, pero al revés. Un número que tiene que
     coincidir en dos sitios termina no coincidiendo; leerlo de un solo sitio
     no puede desincronizarse. El titulillo sí conserva su copia porque el
     SVG no hereda las variables del modo angosto. */
  const estCab  = med ? ' style="left:'+(med.texto/2)+'px;right:auto;width:auto;' +
                        'transform:translateX(-50%);text-align:center;font-size:21px;' +
                        'line-height:26px;padding:4px 13px 5px;border-radius:0 0 5px 5px"' : '';
  const estVer  = med ? ' style="left:'+(med.texto/2)+'px;right:auto;width:auto;' +
                        'transform:translateX(-50%);text-align:center;' +
                        'font-size:21px;line-height:26px;letter-spacing:.10em;padding:3px 13px 2px"' : '';
  const estCols = med ? ' style="padding-top:' +
                        getComputedStyle(pgBody.parentElement).paddingTop + '"' : '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
    '<foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+
      /* --papel y --tinta van aquí a mano: la foto no pasa por prepararHoja.
         Si se olvidan, el pliegue enseña una hoja blanca girando sobre una
         mesa sepia, que es el mismo brinco que ya costó dos comentarios más
         arriba, pero de color. */
      '<div xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es" class="pg sin-tinta" style="width:'+w+'px;height:'+h+'px;font-family:'+fuente+';--fam:'+fuente+
          ';--papel:'+colorPapel()+';--tinta:'+colorTinta()+
          ';--mx:'+(med ? 0 : MARGENES[margen][1])+'px'+'">'+
        '<style>'+PAGE_CSS+'</style><div class="pg-inner"'+estInner+'>'+
        '<div class="pg-version"'+estVer+'>'+esc(D.versiones[version].abrev || version)+'</div>'+
        '<div class="pg-cabeza"'+estCab+'>'+esc(cabeza||'')+'</div><div class="pg-cols"'+estCols+'>'+
        '<div class="pg-body" xml:lang="es" lang="es" style="'+estBody+estiloEnLinea()+'">'+bodyHTML+'</div>'+
        '<div class="pg-margin" style="width:'+m+';margin-left:'+g+';--mw:'+m+';--mgap:'+g+'">'+marginHTML+'</div>'+
        '</div><div class="pg-foot">'+footHTML+'</div></div></div>'+
    '</foreignObject></svg>';
}
function loadSVG(svg, ok, fail){
  const img = new Image();
  img.onload = () => ok(img); img.onerror = () => fail && fail();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function cuerpoHTML(a,b){ let s=''; const below = placement==='below';
  for (let i=a;i<b;i++) s += verseHTML(i, SPAN_MARKS, below); return s; }
function rectsDeMarcas(bodyEl, hostEl){
  if (SPAN_MARKS) return [];
  const host = hostEl.getBoundingClientRect(), out = [];
  for (const m of marcas){
    if (!visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, bodyEl); if (!rg) continue;
    const rs = [];
    for (const q of rg.getClientRects())
      if (q.width >= .5) rs.push({x:q.left-host.left, y:q.top-host.top, w:q.width, h:q.height});
    if (rs.length) out.push({ estilo:m.estilo, color:m.color, rects:rs,
                              dudosa:['aprox','versiculo'].includes(RES.get(m.id).grado) });
  }
  return out;
}
function componer(img, ms, palabras, w, h){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const c = document.createElement('canvas'); c.width = w*dpr; c.height = h*dpr;
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(img,0,0,w,h);              // papel, recuadros y bordes
  pintarPalabras(g, palabras);           // los glifos, ya medidos de la hoja real
  for (const m of ms){
    if (m.estilo === 'fill'){
      g.save(); g.globalCompositeOperation='multiply';
      g.globalAlpha = FILL_ALFA[m.color];      /* la misma que en la hoja viva */
      g.fillStyle = 'rgb('+FILL_RGB[m.color]+')';

      g.restore();
    } else {
      g.strokeStyle = TRAZO_HEX[m.color]; g.lineWidth = GRUESO_TRAZO;
      for (const q of m.rects){ const y = Math.round(q.y+q.h-0.5)+.5;
        g.beginPath(); g.moveTo(q.x,y); g.lineTo(q.x+q.w,y); g.stroke(); }
    }
    if (m.dudosa){
      g.save(); g.strokeStyle='#b23a3a'; g.lineWidth=2; g.setLineDash([2,3]);
      for (const q of m.rects){ const y = Math.round(q.y+q.h+1)+.5;

}
/* Fotografía CUALQUIER hoja del mapa, no solo las vecinas: un salto
   necesita la foto de su destino aunque esté a cinco hojas. */
function fotoDeHoja(p, asignar){
  if (p < 0 || p >= paginas.length){ asignar(null); return; }
  /* El ancho del PAPEL, no el de la ventana: en teléfono la hoja sobresale y
     la foto tiene que retratarla entera, glosas incluidas. */
  const med = medirHojaTelefono();
  const w = med ? (med.texto + med.hueco + med.glosa)
                : Math.max(pg.scrollWidth, pg.offsetWidth);
  const h = pg.offsetHeight;
  const from = paginas[p], hasta = finDe(p);
  prepararHoja(ghost, w, h);
  if (med) ghost.style.setProperty('--mx', '0px');
  const r = layoutInto(ghostBody, ghostMargin, ghostFoot, from, hasta);
  ghostCabeza.textContent = cabezaDe(from);
  const ms = rectsDeMarcas(ghostBody, ghost);
  const palabras = medirPalabras(ghost);
  loadSVG(buildSVG(cuerpoHTML(from, hasta), r.marginHTML, r.footHTML, r.mw, r.gap, w, h, cabezaDe(from)),
    img => { asignar(componer(img, ms, palabras, w, h)); if (folding) drawFold(); }, () => asignar(null));
}
function makeSnapshot(){
  /* La hoja de ARRIBA se retrataba con el ancho de la ventana mientras la de
     abajo ya usaba el del papel. Por eso solo la de arriba salía descompuesta:
     eran dos fotos de la misma hoja tomadas con encuadres distintos. Aquí se
     mide igual que en fotoDeHoja, y las marcas y las palabras se miden contra
     la hoja viva, que ya trae el acomodo correcto. */
  const med = medirHojaTelefono();
  const w = med ? (med.texto + med.hueco + med.glosa)
                : Math.max(pg.scrollWidth, pg.offsetWidth);
  const h = pg.offsetHeight;
  snapFirma = estiloFirma();
  const ms = rectsDeMarcas(pgBody, pg);
  const palabras = medirPalabras(pg);
  loadSVG(buildSVG(cuerpoHTML(startIdx, nextIdx), curMarginHTML, curFootHTML, curMW, curGap, w, h, cabezaDe(startIdx)),
    img => { pageImg = componer(img, ms, palabras, w, h); if (folding){ pg.classList.add('hidden'); drawFold(); } },
    () => { pageImg = null; pg.classList.remove('hidden'); });
  fotoDeHoja(paginaActual + 1, i => { nextImg = i; if (folding && side==='right') bajoImg = i; });
  fotoDeHoja(paginaActual - 1, i => { prevImg = i; if (folding && side==='left')  bajoImg = i; });
}

let W=0, H=0, anchor=null, F=null, side='right', bajoImg=null;
/* Cada hoja del bonche tiene SU punto de agarre y SU diagonal. Si todas
   doblan desde el mismo punto se ven como una máquina; el papel nunca se
   agarra dos veces igual. */
let hojasExtra = [], progreso = 0, alfaTop = 1;
const rnd = (a,b) => a + Math.random()*(b-a);
/* Arranca despacio, agarra vuelo y se posa. La curva de antes salía
   disparada desde el primer cuadro y por eso se sentía violenta. */
const suave = k => (k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2);

/* EL GROSOR DEL BONCHE. Antes eran cinco rangos, y el defecto se veía: pasar
   4 hojas o pasar 8 daba el mismo puño de 3. La cuenta ahora es real —el
   bonche trae EXACTAMENTE las hojas que estás pasando— pero solo hasta seis.

   Por qué no exacto siempre: de Génesis a Apocalipsis hay del orden de 900
   hojas, y dibujar 900 en cada cuadro no termina nunca. Y aunque terminara,
   no serviría de nada: el ojo cuenta bien hasta cinco o seis objetos de un
   vistazo —eso es la subitización— y de ahí en adelante solo percibe "muchos".
   Un bonche de 40 y uno de 900 se ven igual.

   Así que la cuenta es exacta justo en el tramo donde se puede percibir, y de
   ahí crece en logaritmo hasta toparse en trece. Cada vez que la distancia se
   duplica, el puño engorda unas tres hojas. */
const EXACTO = 6, TOPE_HOJAS = 26;
function bonchePara(salto){
  const s = Math.max(1, salto);
  const hojas = s <= EXACTO ? s
              : Math.min(TOPE_HOJAS, Math.round(EXACTO + Math.log2(s / EXACTO) * 4.6));
  /* La duración crece con el logaritmo de la distancia. Y crece harto: un
     viaje de Mateo a Apocalipsis son cientos de hojas, y si se despacha en el
     mismo segundo que un salto de diez, el gesto miente sobre la distancia.
     Lo que hace que se lean como MUCHAS no es solo cuántas se dibujan sino
     cuánto rato siguen saliendo: un chorro largo pesa más que un manotazo. */
  const base = Math.min(2150, 520 + 260 * Math.log2(1 + s));
  return { hojas: hojas, dur: [base * .94, base * 1.06] };
}
function sizeCanvas(){
  /* El lienzo mide el PAPEL, no la ventana. En teléfono la hoja es más ancha
     que la pantalla, y si el pliegue se dibujara del tamaño de la ventana
     doblaría una hoja que no es la que estás viendo: la mitad derecha —justo
     donde viven las glosas— se quedaría fuera de la foto.
     Por eso se mide el contenido desplazable y el lienzo se corre junto con
     el papel, para que la parte visible coincida siempre. */
  /* El ancho del PAPEL, calculado igual que en las fotos. Importa para algo más
     que el encuadre: el pliegue nace en el borde derecho del papel, y ese borde
     es el canto de la columna de glosas, no la orilla de la pantalla. Con la
     glosa escondida, la hoja se levanta desde fuera de cuadro y entra
     barriendo, que es lo que haría el papel de verdad. Midiendo la ventana, la
     hoja se doblaría desde el aire. */
  const med = medirHojaTelefono();
  W = med ? (med.texto + med.hueco + med.glosa)
          : Math.max(pg.scrollWidth, pg.offsetWidth);
  H = pg.offsetHeight;
  fx.style.left = (-pg.scrollLeft) + 'px';
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  fx.style.width=W+'px'; fx.style.height=H+'px'; fx.width=W*dpr; fx.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rectPoly=()=>[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];

const sideOf=(P,M,ex,ey)=>(P.x-M.x)*ey-(P.y-M.y)*ex;
function clipToSide(poly,M,ex,ey,keep){
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){ const cur=poly[i],nxt=poly[(i+1)%n];
    const sC=sideOf(cur,M,ex,ey),sN=sideOf(nxt,M,ex,ey);
    const iC=keep?sC>=-1e-6:sC<=1e-6, iN=keep?sN>=-1e-6:sN<=1e-6;
    if(iC) out.push(cur);
    if(iC!==iN){ const t=sC/(sC-sN); out.push({x:cur.x+t*(nxt.x-cur.x),y:cur.y+t*(nxt.y-cur.y)}); } }
  return out;
}
function creaseOf(M,ex,ey){
  const pts=[]; const push=(x,y)=>{ if(x<-.01||x>W+.01||y<-.01||y>H+.01) return;
    if(!pts.some(p=>dist(p,{x,y})<.5)) pts.push({x,y}); };
  if(Math.abs(ey)>1e-9){ push(M.x+ex*(0-M.y)/ey,0); push(M.x+ex*(H-M.y)/ey,H); }
  if(Math.abs(ex)>1e-9){ push(0,M.y+ey*(0-M.x)/ex); push(W,M.y+ey*(W-M.x)/ex); }
  return pts.length>=2 ? [pts[0],pts[pts.length-1]] : null;
}
function computeFold(a,f){
  const dx=f.x-a.x, dy=f.y-a.y; if(dx*dx+dy*dy<4) return null;   // hoja plana
  const M={x:(a.x+f.x)/2,y:(a.y+f.y)/2}, ex=-dy, ey=dx;
  const keep=sideOf(a,M,ex,ey)>=0, rp=rectPoly();
  const flapPoly=clipToSide(rp,M,ex,ey,keep);
  const crease=creaseOf(M,ex,ey);
  if(!crease || flapPoly.length<3){
    /* La línea de doblez ya salió de la hoja: o la hoja quedó entera del
       lado doblado (giro completo) o entera del lado plano. Distinguirlo
       importa, porque si no el último cuadro devolvía la página sin doblar. */
    const centro = {x:W/2, y:H/2};
    return ((sideOf(centro,M,ex,ey) >= 0) === keep) ? {completa:true} : null;

function reflection(M,ex,ey){
  const l=Math.hypot(ex,ey)||1, ux=ex/l, uy=ey/l;
  const R11=ux*ux-uy*uy,R12=2*ux*uy,R21=2*ux*uy,R22=uy*uy-ux*ux;
  return {R11,R12,R21,R22,e:M.x-R11*M.x-R12*M.y,f:M.y-R21*M.x-R22*M.y};

/* Una solapa doblada. `conTinta` decide si se le ve el texto traspasado

function pintarSolapa(fold, conTinta, anc, alfa){
  const {M,ex,ey,flapPoly,crease}=fold, [A,B]=crease;
  if (alfa <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alfa;
  const R = reflection(M,ex,ey);
  ctx.transform(R.R11,R.R21,R.R12,R.R22,R.e,R.f);
  pathFrom(flapPoly); ctx.clip();
  ctx.fillStyle = conTinta ? tono(REVES) : tono(BONCHE);
  ctx.fillRect(-2000,-2000,W+4000,H+4000);
  if (conTinta){ ctx.globalAlpha=.30; ctx.drawImage(pageImg,0,0,W,H); ctx.globalAlpha=1; }
  const g = ctx.createLinearGradient(M.x,M.y,anc.x,anc.y);
  g.addColorStop(0,'rgba(80,60,30,0)');
  g.addColorStop(1, conTinta ? 'rgba(80,60,30,.22)' : 'rgba(80,60,30,.30)');
  ctx.fillStyle=g; ctx.fillRect(-2000,-2000,W+4000,H+4000);
  ctx.restore();
  ctx.strokeStyle = conTinta ? 'rgba(180,150,90,.9)' : 'rgba(150,125,80,.55)';
  ctx.lineWidth = conTinta ? 1.2 : 1;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
}
/* La solapa se desvanece en el último tramo: la hoja ya cruzó entera y lo
   que sigue es que se aparte para descubrir la de abajo. */
const desvanecer = t => (t > .80 ? Math.max(0, 1 - (t - .80)/.20) : 1);

function drawFold(){
  ctx.clearRect(0,0,W,H); if(!pageImg) return;
  const fold = computeFold(anchor,F), under = bajoImg;
  const pintaFondo = () => {
    if (under) ctx.drawImage(under,0,0,W,H);
    else { ctx.fillStyle=tono(FONDO); ctx.fillRect(0,0,W,H); }
  };
  /* EL BONCHE: cada hoja arranca de su propio punto del borde, viaja por su
     propia diagonal y sale con su propio retraso. Eso es lo que hace que se
     lea como un puño de papel y no como una hoja calcada. */
  const pintarBonche = () => {
    for (let i = 0; i < hojasExtra.length; i++){
      const h = hojasExtra[i];
      const t = (progreso - h.retraso) / h.dur;   // cada hoja con su propio tramo
      if (t <= .002) continue;
      const k = Math.min(1, t);
      const fi = { x: h.a.x + (h.b.x - h.a.x)*k, y: h.a.y + (h.b.y - h.a.y)*k };
      const fj = computeFold(h.a, fi);
      if (fj && !fj.completa) pintarSolapa(fj, false, h.a, desvanecer(k));
    }
  };
  if (fold && fold.completa){
    /* La hoja de arriba ya se volteó, pero el bonche NO ha terminado. Antes
       aquí se pintaba el fondo y se salía, y con eso desaparecían de golpe
       todas las hojas que aún venían en camino: en un viaje largo la mayoría
       arranca tarde, así que se borraban casi todas y el manojo se veía como
       una sola hoja. El bonche sigue vivo hasta que termina el último. */
    pintaFondo();
    pintarBonche();
    return;
  }
  if (fold){
    if (under) ctx.drawImage(under,0,0,W,H);
    else { ctx.fillStyle=tono(FONDO); ctx.fillRect(0,0,W,H); }
    ctx.save(); pathFrom(fold.flapPoly); ctx.clip();
    const sh = ctx.createLinearGradient(fold.M.x,fold.M.y,anchor.x,anchor.y);
    sh.addColorStop(0,'rgba(30,22,10,.34)'); sh.addColorStop(.45,'rgba(30,22,10,.10)'); sh.addColorStop(1,'rgba(30,22,10,0)');
    ctx.fillStyle=sh; ctx.fillRect(0,0,W,H); ctx.restore();

  ctx.save(); pathFrom(fold?fold.remainPoly:rectPoly()); ctx.clip();
  ctx.drawImage(pageImg,0,0,W,H); ctx.restore();
  if (!fold) return;
  const [A,B] = fold.crease;
  ctx.save(); pathFrom(fold.remainPoly); ctx.clip();
  ctx.filter='blur(7px)'; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.restore();

const local = ev => { const r = pg.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; };
const clampPg = p => ({ x:Math.min(Math.max(p.x, side==='right'?-W*.3:0), side==='right'?W:W*1.3),
                        y:Math.min(Math.max(p.y,0),H) });
/* ============================================================
   EL FILO HACE DOS COSAS Y SE DISTINGUEN SOLAS: un toque abre el
   índice de libros, un arrastre pasa la hoja. Sin cronómetros y sin
   hover —el reposo del ratón no es una intención, y en táctil ni
   siquiera existe. El pliegue no arranca hasta que hay movimiento
   real, para que un toque limpio no deje un destello de hoja. */
const UMBRAL_ARRASTRE = 6;      // px que hay que moverse para que sea arrastre
let gestoPendiente = null;

function iniciarPliegue(s, clientY){
  if (!hayHoja(s)) return false;
  side = s;
  hojasExtra = []; alfaTop = 1;
  bajoImg = (s === 'right' ? nextImg : prevImg);
  if (!pageImg || snapStale()) makeSnapshot();
  const r = pg.getBoundingClientRect();
  anchor = { x: s === 'right' ? W : 0, y: Math.min(Math.max(clientY - r.top, 0), H) };
  F = { ...anchor };
  folding = true;
  sizeCanvas(); fx.style.display = 'block';
  if (pageImg) pg.classList.add('hidden');

}
/* ============================================================
   LA HUELLA. Se dibuja, no se pinta a mano: unas crestas trazadas siempre
   iguales serían un sello, y un sello puesto dos veces en el mismo sitio se
   nota falso. Cada impresión sale de azarDe —el mismo generador que le da
   forma a las glosas— sembrado con el filo y la altura del toque, así que
   cambia de un toque a otro y es SIEMPRE la misma para el mismo punto. Es la
   regla que ya sigue el resto del programa: azar que no cambia bajo los pies.
   ============================================================ */
const huella = $('huella');
let cuadroHuella = 0;
function crestasHuella(semilla){
  const r = azarDe(String(semilla));
  const cx = 31, cy = 37;
  let d = '';
  for (let i = 0; i < 8; i++){
    const rx = 3.4 + i * 3.25 + r() * 1.1;
    const ry = 4.2 + i * 3.95 + r() * 1.3;
    /* Cada cresta ABRE en un ángulo distinto y no cierra: una huella real no
       son anillos concéntricos, son líneas que empiezan y acaban donde les
       toca. Cerrarlas daba un tiro al blanco, no un dedo. */
    const a0 = -Math.PI/2 + (r() - .5) * 1.7;
    const barrido = Math.PI * (1.30 + r() * .55);
    /* La ondulación es una sinusoidal con fase propia, no ruido por punto:
       con ruido cada cresta salía dentada, y una cresta dentada se lee como
       un trazo mal hecho en vez de como piel. */
    const fase = r() * 6.283, amp = .020 + r() * .030;
    let p = '';
    for (let s = 0; s <= 30; s++){
      const a = a0 + barrido * (s / 30);
      const w = 1 + Math.sin(a * 3 + fase) * amp;
      p += (s ? 'L' : 'M') + (cx + Math.cos(a) * rx * w).toFixed(1) + ' '
                           + (cy + Math.sin(a) * ry * w).toFixed(1);
    }
    /* LOS TRAZOS, MÁS SÓLIDOS Y MÁS GRUESOS. Empezaban en .52 de dorado y
       bajaban hasta .24 en la cresta de fuera; sobre papel crema eso es casi
       el papel, y en la práctica solo se veían los dos o tres anillos de
       dentro. Ahora van de .95 a .60: la de fuera sigue siendo la más tenue
       —el degradado hacia el borde es lo que hace que se lea como una huella
       y no como una diana— pero ya ninguna se pierde.
       El grosor sube en la misma proporción. Con trazos de menos de un píxel
       el navegador los reparte entre dos filas y los pinta a media tinta, así
       que adelgazar de más no afinaba: descoloría. Ninguna baja de 1.1. */
    d += '<path d="' + p + '" fill="none" stroke="rgba(' + DORADO + ',' +
         (.95 - i * .05).toFixed(3) + ')" stroke-width="' +
         (2.05 - i * .12).toFixed(2) + '" stroke-linecap="round"/>';
  }
  return d;
}
function mostrarHuella(ev, s){
  const r = stage.getBoundingClientRect();
  /* A la ALTURA donde tocaste —que es de donde va a girar la hoja, así que la
     marca y el giro cuentan lo mismo— pero metida hacia adentro: el filo mide
     24px y una huella centrada ahí saldría partida por el canto. Se ve entera
     y se sigue leyendo como "tu dedo está en este filo". */
  const y = Math.min(Math.max(ev.clientY - r.top, 42), r.height - 42);
  huella.style.left = (s === 'right' ? r.width - 34 : 34) + 'px';
  huella.style.top  = y + 'px';
  huella.innerHTML = '<div class="brillo"></div>' +
    '<svg class="crestas" width="62" height="74" viewBox="0 0 62 74">' +
    crestasHuella(s + ':' + Math.round(y)) + '</svg>';
  /* Un cuadro de respiro antes de encender: puesta y encendida en el mismo
     cuadro, el navegador se salta la transición y la huella aparece de golpe
     en vez de posarse.
     Ese cuadro hay que poder CANCELARLO, y se paga caro si no. Un gesto que
     nace y muere dentro del mismo cuadro —un pointercancel inmediato, o un
     jalón que cruza el umbral de arrastre antes de que pinte nadie— llamaba a
     ocultarHuella() cuando la clase todavía no estaba puesta: quitarla no
     hacía nada, y el cuadro pendiente la ponía después. La huella se quedaba
     encendida y latiendo sobre una hoja quieta, sin gesto que la explicara,
     hasta el siguiente toque. Guardar el cuadro y cancelarlo cierra esa
     puerta: encender y apagar pasan a ser la misma cola. */
  cancelAnimationFrame(cuadroHuella);
  cuadroHuella = requestAnimationFrame(() => {
    cuadroHuella = 0; huella.classList.add('viva');
  });
}
function ocultarHuella(){
  cancelAnimationFrame(cuadroHuella); cuadroHuella = 0;
  huella.classList.remove('viva');
}

function bordeAbajo(ev, s){
  if (cantoAbierto){ cerrarCanto(); return; }
  gestoPendiente = { s, x: ev.clientX, y: ev.clientY, t: performance.now() };
  /* En el filo de la primera hoja —o de la última— no hay a dónde ir. El filo
     ya se ve apagado, pero .off es solo pintura: los oyentes siguen ahí y la
     huella se encendía igual, prometiendo un giro durante los 240ms de la
     espera para luego apagarse sin que pasara nada. Una señal que dice "voy"
     donde no se va a ningún lado es peor que no dar señal: enseña a
     desconfiar de ella en los filos donde sí sirve. */
  if (hayHoja(s)) mostrarHuella(ev, s);
  (s === 'right' ? edgeR : edgeL).setPointerCapture(ev.pointerId);
}
function bordeMueve(ev, s){
  if (folding){ F = clampPg(local(ev)); drawFold(); ev.preventDefault(); return; }
  const g = gestoPendiente;
  if (!g || g.s !== s) return;
  if (Math.hypot(ev.clientX - g.x, ev.clientY - g.y) < UMBRAL_ARRASTRE) return;
  gestoPendiente = null;
  /* Dejó de ser un toque y pasó a ser un arrastre: la huella sobra, porque
     ahora el papel ya se mueve bajo el dedo y eso avisa mejor que cualquier
     marca. */
  ocultarHuella();
  if (!iniciarPliegue(s, g.y)) return;       // no hay hoja de ese lado
