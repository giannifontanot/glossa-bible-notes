  const pw = inner.offsetWidth || W, ph = inner.offsetHeight || H;
  const k = Math.min((W - ZOOM_AIRE*2) / pw, (H - reservaDeZoom()*2) / ph);
  /* Se descuenta DÓNDE ESTÁ YA la hoja dentro de #pg. Un translate no coloca
     en un sitio: mueve desde donde estabas, y .pg-inner no empieza pegada al
     canto —arranca unos 22px más abajo, que es el aire que el titulillo le
     reserva—. Sin descontarlo, la cuenta salía perfecta y la hoja quedaba esos
     22px baja: medido 223 de aire arriba contra 180 abajo, cuando tenían que
     ser 201 y 201. El síntoma es pequeño y engaña, porque la hoja SÍ se movía
     al centro; solo que al centro de otra cosa. */
  const dx = inner.offsetLeft || 0, dy = inner.offsetTop || 0;
  const px = (W - k*pw) / 2, py = (H - k*ph) / 2;      /* dónde cae el papel */
  pg.style.setProperty('--zk', k.toFixed(4));
  pg.style.setProperty('--zx', Math.round(px - dx) + 'px');
  pg.style.setProperty('--zy', Math.round(py - dy) + 'px');

  /* EL LIENZO DEL PLIEGUE SE ENCOGE IGUAL. El pliegue se dibuja en un lienzo
     del tamaño natural del papel, y todo lo que lleva dentro —el doblez, la
     sombra, las palabras— está calculado en ese tamaño. Corregirlo por dentro
     sería rehacer la geometría entera; escalarlo por fuera es una línea, y así
     el pliegue de lejos es exactamente el mismo pliegue, más chico.
     La cuenta no es la misma que la de la hoja, y por eso va aparte: el
     transform de .pg-inner arranca desde donde .pg-inner YA está —de ahí que
     allí se reste dx y dy sin escalar—, mientras que el lienzo retrata la hoja
     ENTERA, con ese hueco incluido dentro de la foto. Al encogerse, el hueco
     se encoge con ella: aquí se restan k*dx y k*dy. */
  zoomK = k; zoomFx = { x: px - k*dx, y: py - k*dy };
  fx.style.transformOrigin = 'top left';
  fx.style.transform = 'translate(' + Math.round(zoomFx.x) + 'px,' +
                       Math.round(zoomFx.y) + 'px) scale(' + k.toFixed(4) + ')';

  /* EL PAPEL DE DEBAJO, EXACTAMENTE DONDE LO PONE LA FOTO. La hoja no es
     .pg-inner: es .pg, que lleva 22px de relleno arriba y 18 abajo. La foto
     del pliegue retrata .pg entera, así que al empezar el giro aparecían esos
     márgenes y al aterrizar se encogían otra vez —estrecha, ancha, estrecha—.
     Aquí se coloca un papel con la medida de .pg, con la MISMA cuenta que el
     lienzo, así que los dos ocupan el mismo rectángulo y el salto desaparece.
     Se usa el ancho del papel y no el de la ventana, igual que arriba: en
     teléfono la hoja sobresale de la pantalla y hay que retratarla entera. */
  const papel = $('zoomPapel');
  if (papel){
    const anchoPg = Math.max(pw + dx*2, W);      /* el papel, no la ventana */
    papel.style.left   = Math.round(zoomFx.x) + 'px';
    papel.style.top    = Math.round(zoomFx.y) + 'px';
    papel.style.width  = Math.round(k*anchoPg) + 'px';
    papel.style.height = Math.round(k*H) + 'px';
    /* Y AQUÍ SE GUARDA DÓNDE ESTABA ESTE MISMO PAPEL A TAMAÑO NATURAL, que es
       lo que hace falta para que entrar y salir sean el mismo movimiento al
       derecho y al revés. Ver abrirZoom para el porqué.
       Es la transformación que devuelve este rectángulo pequeño al rectángulo
       grande: se agranda 1/k y se sube a la esquina de #pg. Con la caja
       maquetada en pequeño y el crecimiento en el transform, la anchura que
       cuenta para el desplazamiento del papel sigue siendo la chica —hacerlo
       al revés metería 663px de caja en una ventana de 412 y le cambiaría el
       tope al cajón—. */
    papelFuera = 'translate(' + (-Math.round(zoomFx.x)) + 'px,' +
                 (-Math.round(zoomFx.y)) + 'px) scale(' + (1/k).toFixed(4) + ')';
  }

  /* Y LOS FILOS SE PONEN SOBRE EL PAPEL. Ocupan todo el alto de la pantalla, y
     de lejos eso invade el hueco —que ahí significa "vuelve"—: el toque se lo
     comía el filo y no se salía nunca. Se recortan al canto de la hoja
     pequeña, y así las dos cosas conviven: el papel se pasa por sus orillas y
     el hueco sigue siendo la salida.
     No se estrechan con la escala: un filo mide lo que mide un dedo, no lo que
     mide el papel. Se quedan en el ancho que les da el CSS.

     Y ESE ANCHO SE MIDE, no se escribe aquí. Estaba escrito —un 24 a mano— y
     el día que .edge pasó a 30px este sitio se quedó atrás: el filo derecho
     acababa 6px pasado la orilla del papel, o sea metido en el hueco, que de
     lejos es justo lo que NO puede comerse porque ahí el toque significa
     «vuelve». Preguntándole al elemento no puede volver a descuadrarse.
     Lo levantó la revisión de Codex. */
  const alto = Math.round(k*ph), arriba = Math.round(py);
  for (const [el, lado] of [[edgeL, 'left'], [edgeR, 'right']]){
    el.style.top = arriba + 'px';
    el.style.height = alto + 'px';
    if (lado === 'left') el.style.left = Math.round(px) + 'px';
    else el.style.left = Math.round(px + k*pw - (el.offsetWidth || 30)) + 'px';
    el.style.right = 'auto';
  }
  /* Y EL CANTO DEL LIBRO CON ELLOS. Va pegado a la orilla de la ventana, que
     es lo correcto de cerca —ahí la orilla de la ventana ES el canto del
     papel— y de lejos deja de serlo: la hoja se encoge y se centra, y el canto
     se quedaba de arriba abajo en el borde de la pantalla, señalando como
     final del libro un sitio donde ya no hay libro. Se le da la misma
     geometría que a los filos, que es la del papel pequeño.
     No se estrecha con la escala, por lo mismo que los filos: es un aviso, y
     un aviso mide lo que necesita para verse. Lo encontró la revisión de
     Codex. */
  const ANCHO_CANTO = 7;               /* el mismo width que .pg-canto en el CSS */
  for (const [el, lado] of [[$('cantoIzq'), 'left'], [$('cantoDer'), 'right']]){
    if (!el) continue;
    el.style.top = arriba + 'px';
    el.style.bottom = 'auto';
    el.style.height = alto + 'px';
    el.style.left = Math.round(lado === 'left' ? px : px + k*pw - ANCHO_CANTO) + 'px';
    el.style.right = 'auto';
  }
}
/* EL SUAVIZADO, ARMADO Y DESARMADO A MANO. Ver el CSS de .suavizando para el
   porqué. Aquí solo queda el cuándo: se pone al empezar el gesto y se quita
   pasado el tiempo de la curva, con un respiro de más por si el cuadro final
   se retrasa. Cualquier cosa que necesite medir la hoja mientras tanto lo
   cancela en vez de esperarlo —una repaginación a media transición importa
   más que la transición—.

   El papel de debajo se cruza aparte porque display no se interpola: al
   entrar aparece apagado y sube al cuadro siguiente; al salir se le deja
   puesto a mano hasta que termine, ya que la clase que lo enseña se va en el
   primer cuadro. */
const ZOOM_SUAVE = 460;
let relojSuave = null;
/* El paso automático: hacia dónde va y el reloj que lo mantiene vivo. */
let dirZoomAuto = null, relojZoomAuto = null;
/* 0..1: lo que dice el acelerador. Vive aquí arriba con los demás del
   automático porque lo leen msPliegueZoom y detenerZoomAuto, que están
   escritos antes que el acelerador. */
let veloZoom = 0;
/* Dónde tenías el cajón al alejarte, para poder devolverte ahí. */
let cajonAlEntrarZoom = 0;
let relojCajonZoom = null;

/* LA CURVA DE LA HOJA, RESUELTA A MANO.

   El CSS mueve la hoja con cubic-bezier(.32,.72,.24,1) en 460 ms, y el cajón
   tiene que ir montado en eso mismo. Aquí está el porqué, que se vio usándolo:
   el cajón usaba antes la curva del arrastre —lenta al arrancar, que es lo
   correcto para algo que empujas con el dedo— y las dos juntas se leían como
   dos viajes. Al 32% del tiempo la hoja ya llevaba el 72% del camino y el
   cajón el 5%: la hoja terminaba de crecer y ENTONCES la ventana se corría.
   Medido en la primera versión: 0, 1, 2, 5, 12, 23... o sea quieto durante
   todo el crecimiento.
   Con la misma curva y el mismo reloj llegan juntos, y un solo toque produce
   un solo movimiento: la hoja crece ya encuadrada en la columna que pediste.
   Se busca por bisección el t que da esa x —doce vueltas dejan el error muy
   por debajo de un píxel— y se devuelve su y. */
function curvaDeLaHoja(k){
  const en = (t, a, c) => { const u = 1 - t; return 3*u*u*t*a + 3*u*t*t*c + t*t*t; };
  let lo = 0, hi = 1, t = k;
  for (let i = 0; i < 12; i++){
    t = (lo + hi) / 2;
    if (en(t, .32, .24) < k) lo = t; else hi = t;
  }
  return en(t, .72, 1);
}
function acompanarCajon(destino){
  cancelAnimationFrame(relojCajonZoom);
  const desde = pg.scrollLeft, tramo = destino - desde;
  if (Math.abs(tramo) < 1){ pg.scrollLeft = destino; return; }
  /* Quien pidió menos movimiento no recibe éste tampoco. La hoja llega en un
     cuadro —así lo deja el CSS— y el cajón tiene que llegar con ella; si no,
     se quedaría corriéndose solo delante de una hoja ya quieta, que es
     exactamente el movimiento del que esa preferencia venía a librar. */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    pg.scrollLeft = destino; return;
  }
  const t0 = performance.now();
  (function paso(ahora){
    const k = Math.min(1, (ahora - t0) / ZOOM_SUAVE);
    pg.scrollLeft = desde + tramo * curvaDeLaHoja(k);
    if (k < 1) relojCajonZoom = requestAnimationFrame(paso);
    else pg.scrollLeft = destino;
  })(t0);
}
function detenerZoomAuto(){
  const iba = dirZoomAuto;
  clearTimeout(relojZoomAuto); relojZoomAuto = null; dirZoomAuto = null;
  veloZoom = 0;                 /* sin automático no hay acelerador que valga */
  /* Se apaga la luz aquí y no en cada sitio que para, que son cinco. */
  if (iba) refrescarPasos();
  /* Y la tanda de reintentos que pudiera estar esperando su turno: es el único
     reloj del paso de hoja que no cuelga de folding, así que parar sin él
     dejaba una vuelta agendada después de haber parado. */
  soltarReintento();
}
/* La transformación que devuelve el papel chico a la hoja entera. La escribe
   medirZoom, que es quien conoce la escala y el sitio. */
let papelFuera = 'none';
function finSuave(){
  clearTimeout(relojSuave); relojSuave = null;
  pg.classList.remove('suavizando');
  const papel = $('zoomPapel');
  if (papel){
    papel.style.removeProperty('transform');
    papel.style.removeProperty('transition');   /* por si se quedó apagada al asentar */
    papel.style.removeProperty('display');
  }
}
function armarSuave(){
  clearTimeout(relojSuave);
  pg.classList.add('suavizando');
  relojSuave = setTimeout(finSuave, ZOOM_SUAVE + 80);
}
function abrirZoom(){
  if (zoomActivo || folding) return;
  cerrarTodosLosRollos(); cerrarHistorial(); ocultarMenu();
  /* DE QUÉ CAJÓN VENÍAS. Se apunta antes de cerrarlo, que es la única línea en
     la que todavía se sabe: salir por el hueco significa «devuélveme y ya», y
     ya es esto —donde estabas—, no el principio del papel. */
  cancelAnimationFrame(relojCajonZoom);
  cajonAlEntrarZoom = pg.scrollLeft;
  /* El cajón se cierra antes de escalar. Si se quedara corrido, la hoja
     aparecería de lejos y además ladeada, y al volver seguiría ladeada: dos
     cosas cambiando a la vez cuando solo se pidió una. */
  cerrarCajonDeGlosas();
  finSuave();
  const papel = $('zoomPapel');
  zoomActivo = true;
  /* EL ORDEN DE ESTAS SEIS LÍNEAS ES EL CAMBIO, y costó medirlo para verlo.
     armarSuave iba al final, después de medirZoom, y de las tres cosas que
     tenían que interpolarse solo se movía una. El motivo: medirZoom lee
     offsetWidth de la hoja, y leer una medida obliga al navegador a resolver
     los estilos AHÍ MISMO. En ese recálculo la clase .zoom ya estaba puesta y
     .suavizando todavía no, así que el fondo saltó a transparente y el papel
     de debajo se encendió, los dos sin transición que los amparara; para
     cuando se armaba, ya no quedaba nada por cambiar.
     La escala se salvaba de milagro: medirZoom lee ANTES de escribir --zk, así
     que el transform cambiaba en el segundo recálculo, con la clase ya puesta.
     Un fallo que se esconde detrás de una cosa que sí funciona.
     Ahora se arma lo primero y se mide después. */
  armarSuave();
  pg.classList.add('zoom'); stage.classList.add('zoom');
  $('btnZoom').classList.add('abierto');
  medirZoom(); refrescarPasos();
  /* EL PAPEL ENCOGE CON LA HOJA, y no aparece ya encogido.

     Antes salía directamente en su tamaño final y se encendía con un fundido,
     y eso era lo que hacía confuso entrar: durante el primer tercio la letra
     seguía casi a tamaño natural mientras el papelito ya estaba pequeño en
     medio de ella, así que el titulillo, el folio y varios renglones quedaban
     fuera de la hoja, escritos sobre el escritorio. Medido a los 60 ms: el
     bloque de texto en 591px de ancho y el papel en 388.
     Al salir no se notaba —el papel grande entra por detrás y tapa el
     desajuste antes de que se lea— y por eso una dirección parecía correcta y
     la otra no, siendo la misma cuenta.

     Ahora el papel arranca puesto donde estaba la hoja entera y se recoge con
     ella. Las dos escalas quedan atadas por construcción: el papel está
     maquetado en pequeño y crece 1/k, así que su tamaño en pantalla es
     k·entero·[(1/k)+(1−1/k)p], que es exactamente entero·[1+(k−1)p], la misma
     que sigue el texto. No pueden separarse aunque la curva cambie.
     Y no hace falta fundido: al empezar, el papel cubre exactamente lo que
     cubría el fondo de la hoja, así que el relevo no se ve. */
  if (papel){
    /* Y EL PUNTO DE PARTIDA SE ASIENTA CON LA TRANSICIÓN APAGADA.

       Poner el transform grande a secas no servía, y el motivo es el mismo
       recálculo forzado de siempre: medirZoom lee offsetWidth, y en esa
       lectura el papel ya estaba visible con transform:none. Así que lo que
       hacía después era animarse DESDE none HASTA grande, y el aviso diferido
       lo devolvía a none: el papel salía y volvía, quedándose en la práctica
       en su tamaño chico todo el rato. Medido: la letra encogiendo de 663 a
       388 mientras el papel no se movía de 388.

       Se apaga la transición, se pone el tamaño grande, se obliga a resolver
       —ese void es el que hace el trabajo—, y se vuelve a encender. A partir
       de ahí el papel está de verdad en grande, y el encoger de la última
       línea sí tiene de dónde salir.
       Sin aviso diferido a propósito: la letra empieza a moverse en este mismo
       cuadro, y dos cuadros de retraso en el papel son justo los dos cuadros
       en los que más se mueve todo. */
    papel.style.transition = 'none';
    papel.style.transform = papelFuera;
    void papel.offsetWidth;
    papel.style.removeProperty('transition');
    papel.style.transform = 'none';
  }
}
/* CERRAR, Y CON QUÉ A LA VISTA.

   `hacia` dice en qué cajón te deja: 'glosas' o 'libro' cuando has tocado una
   de las dos zonas de la hoja, y nada cuando has salido por el hueco, que te
   devuelve al que traías.

   El movimiento del cajón arranca a la vez que la hoja crece, no después. Son
   la misma vuelta: la hoja se agranda y, como ya no cabe entera, la ventana
   se va corriendo hacia la columna que pediste. Encadenarlos —crecer, parar,
   correrse— serían dos viajes de un segundo largo para un solo toque. */
function cerrarZoom(hacia){
  if (!zoomActivo) return;
  detenerZoomAuto();
  const destinoCajon = hacia === 'glosas' ? topeCajon()
                     : hacia === 'libro'  ? 0
                     : cajonAlEntrarZoom;
  finSuave();
  const papel = $('zoomPapel');
  /* El papel se queda puesto a mano —la clase que lo enseña se va en el primer
     cuadro— y crece con la hoja, que es el mismo viaje de abrirZoom al revés.
     La transformación de destino se lee ANTES de borrar la escala: zoomK y
     zoomFx se reinician tres renglones más abajo y con ellos se iría la cuenta. */
  const destino = papelFuera;
  if (papel) papel.style.display = 'block';
  zoomActivo = false; zoomK = 1; zoomFx = { x:0, y:0 };
  armarSuave();
  pg.classList.remove('zoom'); stage.classList.remove('zoom');
  $('btnZoom').classList.remove('abierto');
  /* Aquí no hace falta asentar nada: el papel viene de la entrada con su
     transform ya resuelto en none, así que ese none es el punto de partida y
     basta con pedirle el destino. Y se pide en este mismo cuadro, no en el
     tercero: la hoja arranca ya, y dos cuadros de diferencia se ven —la letra
     saliéndose del papel justo en el tramo en que más corre—. */
  if (papel) papel.style.transform = destino;
  /* Y el cajón, montado en el mismo reloj y en la misma curva que la hoja. */
  acompanarCajon(destinoCajon);
  pg.style.removeProperty('--zk');
  pg.style.removeProperty('--zx');
  pg.style.removeProperty('--zy');
  fx.style.removeProperty('transform');
  fx.style.removeProperty('transform-origin');
  /* Los filos vuelven a la hoja de estilos. Se quitan las propiedades en vez
     de reescribirlas a mano: los valores buenos ya están en el CSS —incluido
     el right:0 del derecho, que aquí se había pisado con un left— y copiarlos
     al guion sería tener la misma medida en dos sitios. */
  for (const el of [edgeL, edgeR, $('cantoIzq'), $('cantoDer')])
    if (el) for (const p of ['top','bottom','height','left','right'])
      el.style.removeProperty(p);
}
function refrescarPasos(){
  const b = $('zoomPasos').querySelectorAll('[data-paso]');
  /* Se apagan cuando no hay a dónde ir, no cuando se acaba el libro: al final
     de Mateo empieza Marcos, y un botón apagado ahí diría que la lectura se
     terminó. Solo Génesis por la izquierda y Apocalipsis por la derecha. */
  b[0].disabled = !hayHoja('left');
  b[1].disabled = !hayHoja('right');
  /* Y EL ENCENDIDO DICE QUE EL PASO AUTOMÁTICO VA SOLO.
     Sin esto las dos maneras de pasar hoja se ven igual —hojas que pasan— y no
     hay forma de saber si cada una es tuya o si aquello sigue andando por su
     cuenta. Se pinta el de la dirección que lleva, así que además dice hacia
     dónde. Se apaga solo: esto se rehace en cada hoja, y detenerZoomAuto llama
     aquí al parar. */
  b[0].classList.toggle('auto', dirZoomAuto === 'left');
  b[1].classList.toggle('auto', dirZoomAuto === 'right');
}
$('btnZoom').addEventListener('click', ev => {
  ev.preventDefault(); ev.stopPropagation();
  if (zoomActivo) cerrarZoom(); else abrirZoom();
});
/* PASAR HOJA DE LEJOS SE VE IGUAL QUE DE CERCA. Aquí estuvo un rato el
   argumento de que tenía que ser instantáneo —la foto del pliegue se compone
   midiendo cada palabra, y de lejos esas medidas vienen escaladas—, y era
   verdad el problema y falsa la conclusión: lo que había que arreglar era la
   medición, no quitar la animación. Se arregla en sinZoom, midiendo con el
   zoom apagado un instante, y entonces el pliegue funciona tal cual. La hoja
   se voltea igual, solo que más chica.
   Los botones tiran del mismo pasarHoja que el filo, así que el pliegue nace
   a media altura del papel y no en el aire. */
/* Y CON UN DESLIZ HACIA ARRIBA PASAN SOLAS.

   Arrancaba con doble clic y el doble clic no se dejaba dar. Tiene su razón, y
   no es del pulso de nadie: para que el navegador cuente dos toques como uno
   doble tienen que caer casi en el mismo píxel y dentro de la ventana que él
   decide; en un botón de 80px que se toca de lejos, mirando el papel y no el
   dedo, el segundo toque cae dos milímetros más allá y ya son dos toques
   sueltos —o sea, dos hojas pasadas a mano, que es justo lo que no se pedía—.
   Y encima el gesto no se ve: nada en la pantalla dice que el botón tenga una
   segunda cosa dentro.

   El desliz hacia arriba no tiene ventana de tiempo ni de puntería: se empuja
   el botón hacia arriba y en cuanto el dedo pasa de un tramo corto aquello
   arranca. El botón se va yendo con el dedo mientras subes, así que el gesto
   se contesta antes de terminarlo: se ve que algo está pasando y se puede
   soltar a medias sin que arranque nada. «Empujar hacia arriba para que
   siga solo» es además lo que ya hacen los deslizadores de todos lados.

   Para se toca y ya está, que es lo que uno intenta: un toque estando en
   marcha SOLO para.

   El ritmo no lo pone un reloj de lectura —eso sería otro modo, y habría que
   elegir a qué velocidad lee uno— sino la única condición que se ve: en cuanto
   la hoja terminó de pasar, se pide la siguiente. Así el papel no se atropella
   nunca y la cadencia es la del propio pliegue.

   Se para de tres maneras, y las tres son las que uno intentaría: tocando
   cualquiera de los dos botones, tocando el libro —que cierra el zoom— o
   llegándose al final del último libro. Un toque estando en marcha SOLO para;
   no adelanta además una hoja, porque quien toca para detener no está pidiendo
   otra vuelta.

   Los 80 ms no son el ritmo: son cada cuánto se vuelve a preguntar si el
   pliegue ya acabó. Preguntar es barato; el paso lo marca la hoja. */
const ESPERA_ZOOM_AUTO = 80;
const ladoDePaso = b => (+b.dataset.paso > 0 ? 'right' : 'left');

/* EL ACELERADOR, Y POR QUÉ EL PLIEGUE TIENE QUE IRSE.

   Con el automático en marcha, correr el botón hacia AFUERA corre las hojas
   más deprisa. Sirve para una cosa muy concreta que antes no se podía hacer:
   buscar una hoja de lejos. Con el paso normal, ir de Mateo a Apocalipsis era
   quedarse mirando un minuto largo.

   Y aquí está lo que costó entender. El ritmo NO lo pone un reloj: lo pone el
   pliegue. El automático pide la hoja siguiente en cuanto la anterior terminó
   de plegarse, y un pliegue de los de siempre dura 620-780 ms. O sea que
   acortar la espera sola no habría hecho nada: ya iba al máximo que da la
   animación. Lo que acelera es acortar EL PLIEGUE.

   TODAS LAS HOJAS SE PLIEGAN, y esto se decidió después de probar lo otro.

   Hubo un tramo rápido que no plegaba: pasado cierto punto del recorrido se
   repintaba la hoja y a por la siguiente. Sobre el papel tenía su razón —a esa
   velocidad lo que se quiere ver es el rótulo cambiando de capítulo, no una
   hoja girando— pero usándolo no: lo que se veía era el texto dando saltos, y
   una hoja que aparece sin haber girado no se lee como una hoja que pasa, se
   lee como un fallo. La animación no es adorno aquí, es lo que cuenta que
   estás hojeando. Así que se quitó el tramo sin pliegue y todo el recorrido es
   ahora el mismo: el pliegue se acorta de los 700 ms de siempre a
   MS_PLIEGUE_CORTO, y la hoja se ve girar SIEMPRE, solo que con prisa.

   EL SONDEO SE QUEDA EN 80 ms, y esto está medido porque parecía lo
   contrario. El automático pregunta cada ESPERA_ZOOM_AUTO si el pliegue
   terminó, así que a toda velocidad esos 80 ms parecen espera muerta encima de
   un pliegue de 120, y se probó a acortarlos a 24. No compran nada: al tope,
   medianas de cinco tandas de 3 s, las tres variantes —80 fijos, acortado sólo
   fuera del pliegue, y acortado también dentro— caen todas en 11-12 hojas, y
   la propia medida se mueve una hoja entre tandas. O sea que la diferencia, si
   la hay, está por debajo del ruido.

   Y hay una razón para que no la haya: la pregunta se hace MIENTRAS la hoja se
   pliega, así que despertar el hilo más a menudo le quita tiempo justo a la
   animación que se está esperando. El sondeo no es el cuello de botella; el
   coste fijo de cada hoja sí. Se deja un solo número, que es lo que se puede
   defender con lo medido. Lo destapó la revisión de Codex, que vio que el
   acortado no llegaba a aplicarse donde su propio comentario decía: tenía
   razón, y al medirlo resultó que lo que sobraba era el acortado.

   DE RESORTE. Al soltar, el botón vuelve al centro y la velocidad vuelve a la
   normal; el automático sigue andando. Se eligió así frente a dejar el botón
   corrido: el paso rápido es para buscar, y buscar es algo que se hace con el
   dedo puesto y se suelta al llegar. Dejarlo corrido obligaba a volver a tocar
   para recuperar el paso normal. */
const CORRIDA_MAX = 132;      /* px de recorrido lateral hasta el tope */
const CORRIDA_MIN = 56;       /* y lo menos que se le deja, por estrecha que sea */
const CORRIDA_ARRANQUE = 12;  /* px de corrida antes de que esto sea un gesto */
/* 120 ms, y el número está medido por los dos lados. Por abajo: a 60 Hz son
   unos ocho cuadros de giro dibujados por hoja —medido: 8.7— y por debajo de
   cinco deja de leerse como un giro y pasa a ser un destello. Por arriba: de
   190 a 120 se gana un tercio de velocidad (9 → 12 hojas en la misma ventana),
   pero de 120 a 90 se gana UNA hoja, porque a partir de ahí lo que manda ya no
   es el pliegue sino el coste fijo de cada hoja —la foto, el lienzo, el
   repintado—, que ronda los 200 ms. Bajar más sería acortar la animación sin
   comprar velocidad. */
const MS_PLIEGUE_CORTO = 120; /* lo más corto que se pliega, al tope */

/* Cuánto dura el pliegue de ESTA hoja. Sin acelerador puesto devuelve lo de
   siempre, jitter incluido: dos pliegues seguidos que duran exactamente lo
   mismo se ven a máquina. */
function msPliegueZoom(){
  const base = rnd(620, 780);
  if (!dirZoomAuto || veloZoom <= 0) return base;
  const t = Math.min(Math.max(veloZoom, 0), 1);
  return Math.round(base + (MS_PLIEGUE_CORTO - base) * t);
}
function darPasoZoom(s){
  if (folding || preparandoPliegue) return false;
  /* Sin comprobar el rango local. pasarHoja sabe que después de la última hoja
     puede empezar el libro siguiente; aquí solo se pregunta si hay a dónde ir,
     que es lo que decide si el automático sigue o se apaga. */
  if (!hayHoja(s)) return false;
  /* SIEMPRE POR pasarHoja, o sea siempre con pliegue. Aquí hubo un atajo que
     repintaba sin animar cuando el acelerador pasaba de cierto punto, y se
     quitó: ver el comentario de arriba. Una hoja que aparece sin haber girado
     no se lee como una hoja que pasa. */
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return false;
  const r = inner.getBoundingClientRect();
  pasarHoja(s, r.top + r.height/2);
  return true;
}
function seguirZoomAuto(){
  const s = dirZoomAuto;
  if (!s || !zoomActivo){ detenerZoomAuto(); return; }
  /* Las dos vueltas van al mismo ritmo, y esta de arriba es la que corre casi
     siempre: el pliegue dura más que el sondeo, así que la pregunta que
     encuentra la hoja YA plegada sale de aquí. Tenerlas a ritmos distintos era
     mantener dos números para un solo reloj —ver arriba por qué el segundo no
     compraba nada—. */
  if (folding || preparandoPliegue){
    relojZoomAuto = setTimeout(seguirZoomAuto, ESPERA_ZOOM_AUTO);
    return;
  }
  if (!darPasoZoom(s)){ detenerZoomAuto(); return; }
  relojZoomAuto = setTimeout(seguirZoomAuto, ESPERA_ZOOM_AUTO);
}
$('zoomPasos').addEventListener('click', ev => {
  const b = ev.target.closest('[data-paso]'); if (!b || b.disabled) return;
  ev.preventDefault(); ev.stopPropagation();
  /* En marcha, un toque solo para. */
  if (dirZoomAuto){ detenerZoomAuto(); return; }
  darPasoZoom(ladoDePaso(b));
});
function arrancarZoomAuto(b){
  detenerZoomAuto();
  dirZoomAuto = ladoDePaso(b);
  refrescarPasos();
  seguirZoomAuto();
}
/* EL GESTO ES UNO SOLO: CORRER EL BOTÓN A SU LADO.

   Antes eran dos, en este orden: subir el botón 24 px para armar el
   automático, y sólo entonces correrlo a un lado para acelerar. Se quitó el
   primero porque pedía saberlo. Un mando que hay que empujar hacia arriba
   antes de poder usarlo no lo descubre nadie: el que llega a la vista de lejos
   ve dos flechas y un papel chico, prueba a arrastrar la flecha hacia donde
   quiere ir —que es lo obvio— y no pasa nada. El paso rápido existía y estaba
   escondido detrás de un gesto que había que aprenderse.

   Ahora el mando está listo desde que aparece la vista: se agarra el botón, se
   tira hacia su lado, y las hojas arrancan y van cada vez más deprisa cuanto
   más lejos del centro. Un solo gesto que hace las dos cosas —encender y
   acelerar— y que además dice lo que va a pasar mientras se hace.

   CORRIDA_ARRANQUE es lo único que queda de guarda: 12 px de corrida antes de
   que esto cuente como gesto. No es un freno, es la frontera con el TOQUE, que
   sigue significando otra cosa —una hoja suelta con el automático parado, y
   parar con el automático en marcha—. Doce píxeles es más que el temblor del
   dedo al posarse, que ronda los diez, y menos que cualquier arrastre hecho a
   propósito. Un dedo que sube y baja sin irse a los lados tampoco arranca
   nada: lo que cuenta es lo que se aleja del centro, y eso ahí vale cero.

   Va con eventos de puntero y no de tacto: el mismo código sirve para el dedo,
   el ratón y el lápiz. */
let tiron = null;             /* el gesto en curso */
/* El botón corrido a un lado. */
function ponerCorrida(b, dx){
  b.style.transform = dx ? 'translateX(' + dx + 'px)' : '';
}
/* EL RECORRIDO SE MIDE CONTRA LA PANTALLA QUE HAY, no contra un número fijo.

   Con CORRIDA_MAX a pelo, en un teléfono estrecho el tope no se alcanzaba
   nunca: medido en 320 px de ancho, el dedo solo tiene 111 px hasta el borde
   —de los 132 que pedía— así que la velocidad se quedaba en el 84% y los 46 ms
   del barrido más rápido eran inalcanzables. Y peor: el botón se salía 39 px
   de la escena, que lleva overflow:hidden, o sea que a la máxima velocidad que
   sí se podía poner el botón se veía cortado por la mitad.

   Así que el tope de ESTE gesto es el menor de tres: lo que pide el diseño, lo
   que le queda al BOTÓN antes de salirse de la escena, y lo que le queda al
   DEDO antes del borde de la pantalla. Con eso el tope se alcanza siempre, sea
   cual sea el ancho, y el botón nunca se recorta. El suelo está para que en un
   ancho absurdo no acabe siendo un gatillo de pelo. Lo levantó Codex. */
function topeAcelerador(t){
  const r = t.b.getBoundingClientRect();
  const caja = document.querySelector('.stage');
  const e = caja ? caja.getBoundingClientRect()
                 : { left: 0, right: window.innerWidth };
  const haciaLaDerecha = ladoDePaso(t.b) === 'right';
  const sitioBoton = haciaLaDerecha ? e.right - r.right : r.left - e.left;
  const sitioDedo  = haciaLaDerecha ? window.innerWidth - t.x : t.x;
  return Math.max(CORRIDA_MIN, Math.min(CORRIDA_MAX, sitioBoton, sitioDedo));
}
/* CUÁNTO ACELERA ESTE DEDO. Solo cuenta lo que se aleja del centro HACIA SU
   LADO: el botón de adelantar acelera yendo a la derecha y el de retroceder
   yendo a la izquierda, que es hacia donde ya va la hoja. Traerlo de vuelta al
   centro devuelve el paso normal, y pasarse al otro lado no lo pone del revés
   —para eso está el otro botón—: se queda en cero. */
function ponerAcelerador(t, dx){
  const tope = t.tope || CORRIDA_MAX;
  const haciaFuera = ladoDePaso(t.b) === 'right' ? dx : -dx;
  const corrida = Math.min(Math.max(haciaFuera, 0), tope);
  veloZoom = corrida / tope;
  if (corrida > 0) t.corrio = true;
  ponerCorrida(t.b, ladoDePaso(t.b) === 'right' ? corrida : -corrida);
}
$('zoomPasos').addEventListener('pointerdown', ev => {
  const b = ev.target.closest('[data-paso]'); if (!b || b.disabled) return;
  /* Un solo gesto a la vez: con dos dedos encima gana el primero. */
  if (tiron) return;
  /* El tope se mide YA, con el dedo donde se posó: es de donde se cuenta la
     corrida, y topeAcelerador necesita esa x para saber cuánto le queda al
     dedo hasta el borde de la pantalla.
     Esto NO cuenta todavía como gesto —un toque a secas tiene que seguir
     dando una hoja, o parando si el automático va—; lo que decide es si el
     dedo llega a correrse, y eso lo marca t.corrio. */
  tiron = { id: ev.pointerId, b, x: ev.clientX, y: ev.clientY };
  tiron.tope = topeAcelerador(tiron);
  /* Con la captura, el dedo puede salirse del botón sin perder el gesto:
     corriéndose a los lados se sale enseguida. */
  try { b.setPointerCapture(ev.pointerId); } catch(_){}
});
$('zoomPasos').addEventListener('pointermove', ev => {
  if (!tiron || ev.pointerId !== tiron.id) return;
  const dx = ev.clientX - tiron.x;
  /* Cuánto se ha alejado del centro HACIA SU LADO. Volver, o irse al lado
     contrario, no arranca ni acelera: para el otro sentido está el otro botón. */
  const haciaFuera = ladoDePaso(tiron.b) === 'right' ? dx : -dx;
  /* ARRANCA AL CORRERSE, con el dedo todavía puesto, para que el gesto se
     conteste mientras se hace y no al soltar. Si ya iba en su sentido no se
     rearma: se puede soltar, mirar pasar unas hojas, y volver a agarrar el
     botón para correrlo otra vez. */
  if (dirZoomAuto !== ladoDePaso(tiron.b)){
    if (haciaFuera < CORRIDA_ARRANQUE) return;
    tiron.arranco = true;
    arrancarZoomAuto(tiron.b);
  }
  ponerAcelerador(tiron, dx);
});
/* AL SOLTAR, EL CLIC DEL GESTO SE TIRA A LA BASURA.

   Levantar el dedo manda un clic, y ese clic apagaría lo que el desliz acaba
   de encender: si cae en el botón lo para la línea de «un toque para», y si
   cae más arriba —que es lo normal, el dedo terminó fuera del botón— lo para
   el oyente de la escena, que con algo en marcha para lo den donde lo den.

   Se usa el mismo tragador que ya existía para el toque de fuera de la
   ventanita, y se llama AQUÍ y no al arrancar: se quita solo a los 700 ms, y
   entre cruzar el tope y levantar el dedo puede pasar más que eso —basta con
   quedarse mirando cómo pasan las hojas sin soltar—. Puesto al soltar, la
   ventana empieza justo antes del clic que hay que tragarse. */
const soltarTiron = (ev, hubo) => {
  if (!tiron || (ev && ev.pointerId !== tiron.id)) return;
  const t = tiron;
  tiron = null;
  ponerCorrida(t.b, 0);
  /* EL ACELERADOR ES DE RESORTE: el botón vuelve al centro y la velocidad a la
     normal, pero el automático sigue andando. El barrido rápido es para
     buscar, y buscar se hace con el dedo puesto y se suelta al llegar. */
  veloZoom = 0;
  try { t.b.releasePointerCapture(t.id); } catch(_){}
  /* El clic de levantar el dedo se tira si el gesto hizo algo: arrancar el
     automático, o correr el acelerador. Los dos apagarían con ese clic lo que
     acaban de hacer. Un toque a secas —ni arrancó ni se corrió— sí llega, que
     es como se para. */
  if (hubo && (t.arranco || t.corrio)) tragarElClic();
};
/* EL FINAL DEL GESTO SE ESCUCHA EN LA VENTANA, no en el botón, y esto es un
   candado de verdad que estaba puesto.

   Colgando de #zoomPasos, un dedo que se levanta en cualquier otro sitio deja
   el gesto sin cerrar. Y `tiron` abierto bloquea el siguiente —«un solo gesto
   a la vez: con dos dedos encima gana el primero»—, o sea que a partir de ahí
   NINGUNO de los dos botones vuelve a arrancar el automático. Para
   siempre, hasta recargar.

   No es hipotético: estos botones SE APAGAN solos cuando se acaba el libro, y
   refrescarPasos corre en cada hoja. Quien deja el dedo puesto mientras el
   automático llega a Apocalipsis se encuentra el botón deshabilitado debajo
   del dedo, y un botón deshabilitado no reparte eventos de puntero: el
   pointerup no llega, el desliz no se cierra, y el mando queda muerto. Es el
   mismo agujero que el del respaldo —un estado que se pide y no se suelta—
   por otra puerta.

   En la ventana se cierra siempre, aterrice donde aterrice. soltarTiron ya
   comprueba que el pointerId sea el suyo, así que escuchar de más no confunde
   un gesto con otro. */
window.addEventListener('pointerup', ev => soltarTiron(ev, true));
/* Un desliz cancelado —el navegador se quedó con el gesto— no acaba en clic,
   así que aquí no hay nada que tragarse: hacerlo se comería el toque
   siguiente, que sí es de alguien. */
window.addEventListener('pointercancel', ev => soltarTiron(ev, false));
/* QUÉ CUENTA COMO CONTENIDO DE LA HOJA. Es la misma familia que ya usa el
   cajón para decidir qué no se puede agarrar para arrastrar, y por el mismo
   motivo: son las cosas que tienen algo que hacer con tu dedo. */
const CONTENIDO_DE_HOJA =
  '.v, .vn, .cap, .gl, .ref, .chip, a, button, select, input, textarea';

/* EL BLANCO DE LA HOJA ES EL BOTÓN DE VOLVER, y el oyente NO puede colgar de #pg.

   Lo primero: hay TRES puertas, y cada una te devuelve mirando otra cosa.
     · el blanco de la columna de glosas  -> vuelves con el cajón en glosas
     · el blanco del libro                -> vuelves con el cajón en el texto
     · el hueco de fuera de la hoja       -> vuelves al cajón en que estabas
   Las dos primeras son la idea entera: de lejos ves la hoja completa y eliges
   a qué acercarte, así que el toque que te devuelve dice además a qué. La
   tercera es la salida sin puntería, y por eso no cambia nada de sitio.
   Y ninguna de las tres es el contenido. Eso se decide unas líneas más abajo
   y es la mitad del asunto: la hoja de lejos se sigue usando.

   Lo segundo, que costó una revisión: MIENTRAS UNA HOJA GIRA, #pg no existe
   para el dedo. El pliegue lo dibuja el lienzo, y para enseñarlo se apaga la
   hoja viva con visibility:hidden; el lienzo, por su parte, lleva
   pointer-events:none. Un elemento invisible no recibe toques, así que durante
   los 620-780 ms que dura cada vuelta el toque en el centro del papel lo
   recoge la escena y no llegaba aquí. Comprobado: el elemento bajo el dedo era
   #stage. Con el paso automático eso deja el "toca el libro para parar" en
   letra muerta —la hoja está girando casi todo el rato, y solo funcionaba en
   los huecos entre vuelta y vuelta—.
   Colgando de la escena, el toque llega igual con la hoja puesta o quitada.
   Los controles se defienden solos: el toque en un filo o en un botón tiene a
   ESE elemento por destino, así que la comprobación de abajo lo deja pasar sin
   tener que enumerarlos.

   Y lo tercero: con algo en marcha, el toque solo PARA, lo den donde lo den.
   Cerrar el zoom a media vuelta dejaría el lienzo del pliegue a una escala y
   la hoja a otra, y de todas formas quien toca para detener no está pidiendo
   además guardar el libro. Parado, el toque en el hueco cierra.
   Por eso esa comprobación va ANTES que la del sitio: mientras pasan hojas
   solas, el libro es lo que se está mirando y es donde cae el dedo. */
stage.addEventListener('click', ev => {
  if (!zoomActivo) return;
  /* Los controles se defienden solos: un toque en un filo, en una glosa o en
     un botón tiene a ESE elemento por destino, así que sale por aquí sin
     tener que enumerarlos. Solo siguen los toques al papel pelado y al vacío. */
  if (ev.target !== stage && !ev.target.closest('#pg')) return;
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return;
  if (dirZoomAuto || folding || preparandoPliegue){ detenerZoomAuto(); return; }

  /* EL CONTENIDO ES INERTE; EL BLANCO ES LA PUERTA.

     De lejos la hoja no es una miniatura que solo sirva para mirarla: se sigue
     usando entera. Una glosa se abre, salta a su pasaje y se edita; el texto
     se selecciona y de ahí salen Resaltar, Línea y Glosa —comprobado, el menú
     sale igual de lejos que de cerca—. Nada de eso se puede perder por haber
     convertido la hoja en un botón.
     Así que lo que se toca decide: si debajo del dedo hay ALGO —una glosa, un
     versículo, un número, un enlace—, ese algo se queda con el toque y aquí no
     pasa nada. La vuelta se pide tocando donde no hay nada puesto.

     Y una palabra suelta tampoco vale, aunque no lleve selección detrás. Un
     toque encima de un renglón es casi siempre el dedo que se apoyó: cobrarle
     la vista entera por eso sería justo el accidente que se quiso evitar
     cuando la salida dejó de ser el libro. */
  const t = ev.target;
  if (t.closest && t.closest(CONTENIDO_DE_HOJA)) return;

  /* Ya se sabe que el toque cayó en blanco. Ahora, de qué lado.
     Aquí sí mandan las coordenadas y no el destino, y por dos motivos: el
     blanco de la hoja está repartido entre varias cajas —el margen, el cuerpo
     por debajo del último renglón, el borde de arriba y el de abajo— y no
     merece la pena enumerarlas; y mientras una hoja gira, .pg-inner se apaga
     con visibility:hidden y el destino pasa a ser la escena, con lo que las
     coordenadas son lo único que queda. */
  const r = inner.getBoundingClientRect();
  const enLaHoja = ev.clientX >= r.left && ev.clientX <= r.right &&
                   ev.clientY >= r.top  && ev.clientY <= r.bottom;
  if (!enLaHoja){ cerrarZoom(); return; }   /* el hueco: como estabas */

  /* La columna de glosas empieza donde empieza pgMargin. Se le pregunta a él
     y no se calcula: el reparto cambia con el ancho y con los ajustes. */
  const m = pgMargin.getBoundingClientRect();
  cerrarZoom(m.width > 4 && ev.clientX >= m.left ? 'glosas' : 'libro');
});

/* ============================================================
   EL PANEL DEL RASTRO, Y LA VENTANITA DE LEER ANTES DE SALTAR.
   ============================================================ */
let histAbierto = false, plenoAbierto = null;   /* plenoAbierto guarda la referencia */

/* LA CABECERA DEL PANEL, con el rótulo y las dos acciones del renglón.

   Va aparte y se pinta SIEMPRE —también con el rastro vacío— porque una de
   esas acciones ya no depende del rastro: poner un separador se puede hacer
   desde el primer minuto, sin haber saltado a ningún sitio todavía. El paso
   atrás sigue apareciendo solo cuando hay a dónde volver. */
function cabezaHistorial(){
  /* LOS DOS BOTONES COMPARTEN RENGLÓN, y el rótulo se queda solo arriba.

     Antes era al revés: rótulo y paso atrás juntos, y el del separador debajo.
     Los tres en uno no cabían —medido— porque «separador» es una palabra
     larga; llamándolo «nuevo», que es lo que hace, los dos botones caben de
     sobra y el panel gana un renglón entero. Y tiene más sentido así: el
     rótulo dice qué es esto, y debajo van las dos cosas que se pueden hacer,
     una al lado de otra. */
  /* TRES EN EL RENGLÓN, y por eso ninguno se llama ya «nuevo». Con una sola
     familia, «nuevo» bastaba; con dos, dos botones que dicen lo mismo no se
     distinguen. Cada uno dice LO QUE DEJA —una piedra, una cinta— que además
     es más corto y es lo que hace que los tres quepan. */
  return '<div class="hs-cab"><span class="hs-tit">Lo que has visto</span></div>' +
    '<div class="hs-acciones">' +
    pieAtras() +
    '<button class="hs-sep" data-piedra-nueva="1"' +
      ' title="Dejar una piedra en esta hoja"' +
      ' aria-label="Dejar una piedra en esta hoja">' +
      '<span class="hs-sep-forma" aria-hidden="true">' + piedraDibujo('piedra') +
      '</span>piedra</button>' +
    '<button class="hs-sep" data-sep-nuevo="1"' +
      ' title="Dejar un separador en esta hoja"' +
      ' aria-label="Dejar un separador en esta hoja">' +
      '<span class="hs-sep-cinta" aria-hidden="true"></span>cinta</button>' +
    '</div>';
}
/* EL PIE, con la puerta a las cintas que ya hay.

   Hasta ahora la lista de separadores sólo se abría tocando la cinta, y la
   cinta sólo asoma en la hoja donde está: para ver las demás había que
   acertar a llegar a una. O sea que el sitio donde viven tus marcas de
   lectura era el único al que no se podía ir a propósito.

   Va en el RASTRO y no en un panel nuevo porque es la misma pregunta —«¿por
   dónde iba?»— hecha de las dos maneras que existen: lo que has visto, y
   dónde dejaste la cinta. Y va al FINAL, debajo de la lista: primero se mira
   el rastro, que es a lo que se viene, y si lo que buscabas no estaba, ahí
   abajo están las cintas.

   Se pinta también con el rastro vacío. Un lector recién llegado no tiene
   rastro y sí puede tener cintas de otro día; enseñarle un panel vacío sin
   salida sería esconderle lo que sí tiene. */
/* LAS CUATRO TELAS EN LUGAR DE UNA. Una cinta suelta no dice de qué va este
   botón: podría ser «pon una» —que es lo que hace el otro, y llevaba el mismo
   dibujo—. Cuatro juntas, una de cada color, sí: eso es una COLECCIÓN, que es
   lo que hay detrás. Salen de TELAS y no de una lista escrita a mano, para que
   no se queden atrás el día que la paleta cambie. */
function pieSeparadores(){
  const cintas = TELAS.map(t =>
    '<span class="hs-sep-cinta" style="background:' + t[2] + '"></span>').join('');
  const formas = FORMAS.map(piedraDibujo).join('');
  /* DOS PUERTAS, UNA POR FAMILIA, y cada una enseña de qué va: las cuatro
     telas para las cintas, las tres formas para las piedras. Los rótulos son
     el plural de lo que abren —«cintas», «piedras»— y no «actuales» dos veces:
     con una sola lista bastaba decir cuáles, con dos hay que decir de qué. */
  return '<div class="hs-pie">' +
    '<button class="hs-sep hs-sep-lista" data-piedra-lista="1"' +
      ' title="Ver tus piedras" aria-label="Ver tus piedras">' +
      '<span class="hs-formas" aria-hidden="true">' + formas + '</span>piedras</button>' +
    '<button class="hs-sep hs-sep-lista" data-sep-lista="1"' +
      ' title="Ver tus separadores" aria-label="Ver tus separadores">' +
      '<span class="hs-cintas" aria-hidden="true">' + cintas + '</span>cintas</button>' +
    '</div>';
}
function pintarHistorial(){
  const cont = $('historial');
  if (!historial.length){
    cont.innerHTML = cabezaHistorial() +
      '<span class="hs-vacio">Todavía nada. Aquí van quedando los pasajes a los ' +
      'que saltas desde el panel de libros o desde una referencia de una glosa.</span>' +
      pieSeparadores();
    return;
  }
  /* "Estás aquí" se pregunta contra la HOJA ENTERA, no contra su primer
     versículo. Comparando con el primero, saltar a un versículo de en medio
     —que es el caso normal: una hoja lleva diez o doce— dejaba la fila sin
     marcar aunque la estuvieras viendo. Ahora se mira si el versículo cae
     dentro del tramo que esta hoja reparte. Lo encontró Codex. */
  const desde = paginas[paginaActual] || 0, hasta = finDe(paginaActual);
  const enEstaHoja = h => {
    if (h.libro !== LIBRO) return false;
    const k = plano.findIndex(p => p.cap === h.cap && p.vers === h.vers);
    return k >= desde && k < hasta;
  };
  cont.innerHTML = cabezaHistorial() +
    rastroVisible().map(h => {
    /* El texto sale de la VERSIÓN QUE ESTÁ PUESTA, no de la que estaba cuando
       lo miraste: el historial guarda la referencia, que es lo que no cambia,
       y el texto se busca al pintarlo. Cambiar de versión en Formato cambia lo
       que dice esta lista, que es lo correcto —es la misma escritura—. */
    const t = versoTexto(version, h.cap, h.vers, h.libro);
    return '<button class="hs-fila' + (enEstaHoja(h) ? ' aqui' : '') +
      '" data-hs="' + h.libro + ':' + h.cap + ':' + h.vers + '">' +
      '<span class="hs-ref">' + esc(abrevDe(h.libro)) + ' ' + h.cap + ':' + h.vers + '</span>' +
      '<span class="hs-txt">' + esc(t || '(no está en esta versión)') + '</span></button>';
    }).join('') + pieSeparadores();
}
/* EL RASTRO SIN REPETICIONES SEGUIDAS.

   El rastro se guarda tal cual, repetido y todo, y eso no cambia: es el camino
   que seguiste, y reordenarlo o resumirlo al guardar sería mentir sobre en qué
   orden pasaron las cosas. Lo que sobra es VERLO dos veces seguidas.

   Y se dan solas: saltar apunta el de dónde y el a dónde, así que dos saltos
   encadenados desde el mismo sitio, o un salto que acaba donde ya estabas,
   dejan la misma escritura en dos renglones pegados. Dos renglones idénticos
   uno encima de otro no cuentan nada que no contara uno.

   Se resume al PINTAR y no al guardar, y lo usa también el paso atrás: si la
   lista se resumiera solo para verla, el botón diría «atrás a Mt 1:1» estando
   ya en Mt 1:1, y tocarlo no movería nada. Las dos cosas leen la misma lista,
   así que lo que ves es a donde vas. */
function rastroVisible(){
  const out = [];
  for (const h of historial){
    const u = out[out.length - 1];
    if (u && u.libro === h.libro && u.cap === h.cap && u.vers === h.vers) continue;
    out.push(h);
  }
  return out;
}
/* EL PASO ATRÁS, y por qué va arriba y no al pie.
   Se pidió abajo del todo, y abajo del todo de esta lista está lo más VIEJO
   que has visto —el rastro se pinta del más nuevo al más viejo—, así que un
   botón de «atrás» ahí abajo queda pegado justo a lo contrario de lo que hace.
   Va en el mismo renglón del rótulo, a la derecha, que es donde el ojo ya está
   cuando abre el panel y es el borde por el que este panel crece. Lo que hace
   es lo pedido: volver a la escritura que hay detrás de la de ahora, como el
   atrás del navegador.
   Sin sitio a donde volver no se pinta: un botón que no lleva a ninguna parte
   enseña a no fiarse del que sí. */
const FLECHA_ATRAS =
  '<svg class="hs-flecha" viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
  '<path d="M13.2 8H3.6M7.4 3.9 3.3 8l4.1 4.1"/></svg>';
/* A dónde lleva «atrás»: primero lo que ACABA de pasar (volverA —de dónde
   saliste en el último salto), y si no hay, el rastro. No es «recorrer la
   lista», es deshacer el último viaje. */
function destinoAtras(){
  if (volverA && volverA.ref){
    return { libro: volverA.libro, cap: volverA.ref.cap, vers: volverA.ref.vers };
  }
  return rastroVisible()[atrasEn + 1] || null;
}
function pieAtras(){
  const h = destinoAtras();
  if (!h) return '';
  return '<button class="hs-atras" data-atras="1" title="Volver a ' +
    esc(abrevDe(h.libro)) + ' ' + h.cap + ':' + h.vers + '"' +
    ' aria-label="Volver a ' + esc(abrevDe(h.libro)) + ' ' + h.cap + ':' + h.vers + '">' +
    '<span class="hs-atras-ref">' + esc(abrevDe(h.libro)) + ' ' + h.cap + ':' + h.vers +
    '</span>' + FLECHA_ATRAS + '</button>';
}
/* Un paso atrás: deshace el último salto, sin apuntarlo otra vez. */
function darUnPasoAtras(){
  const h = destinoAtras();
  if (!h) return;
  if (volverA) volverA = null;
  else atrasEn++;
  cerrarHistorial();
  trasPintar(() => irA(h.libro, h.cap, h.vers, '', { sinApuntar:true }));
}

function abrirHistorial(){
  if (histAbierto) return;
  cerrarTodosLosRollos();
  cargarHistorial();            /* por si otra pestaña del navegador lo movió */
  histAbierto = true;
  pintarHistorial();
  const el = $('historial');
  el.style.display = 'flex';
  void el.offsetWidth;
  el.classList.add('visible');
  $('btnHistorial').classList.add('abierto');
}
function cerrarHistorial(){
  cerrarPleno();
  if (!histAbierto) return;
  histAbierto = false;
  const el = $('historial');
  el.classList.remove('visible');
  $('btnHistorial').classList.remove('abierto');
  setTimeout(() => { if (!histAbierto) el.style.display = 'none'; }, 260);
}
function cerrarPleno(){
  plenoAbierto = null;
  const el = $('versoPleno');
  el.classList.remove('visible');
  setTimeout(() => { if (!plenoAbierto) el.style.display = 'none'; }, 240);
}
/* `letra` y `origen` no se meten en el data-ir del botón: viajan en
   plenoAbierto, que es donde ya vive la referencia que la ventanita enseña.
   Meterlos en el atributo obligaría a inventar un formato para el origen —que
   son tres campos— dentro de una cadena que ya lleva tres. */
function abrirPleno(libro, cap, vers, letra, origen){
  const t = versoTexto(version, cap, vers, libro);
  plenoAbierto = { libro, cap, vers, letra: letra || '', origen: origen || null };
  const el = $('versoPleno');
  /* SIN TEXTO NO HAY BOTÓN. Una referencia guardada puede no existir en la
     versión que tienes puesta ahora —2 Corintios 13:14 está en la VBL y no en
     la RV1909—, y ahí la ventanita decía "cambia de versión" dentro de un
     botón que seguía llevando el salto: tocarlo cerraba el historial y
     contestaba "referencia fuera de rango". El aviso de cómo arreglarlo se
     llevaba por delante la única manera de leerlo. Ahora, sin texto, es un
     recuadro y nada más. Lo encontró Codex. */
  const cuerpo = t
    ? '<button class="vp-txt" data-ir="' + libro + ':' + cap + ':' + vers + '">' + esc(t) + '</button>'
    : '<div class="vp-txt vp-mudo">Este versículo no está en la versión que tienes puesta.</div>';
  el.innerHTML = '<div class="vp-cab">' +
      '<span class="vp-ref">' + esc(nombreDe(libro)) + ' ' + cap + ':' + vers + '</span>' +
      '<button class="vp-x" data-cerrar-pleno="1" title="Cerrar" ' +
      'aria-label="Cerrar"><span aria-hidden="true">\u00d7</span></button>' +
    '</div>' +
    cuerpo +
    '<span class="vp-pie">' + (t ? 'Toca el versículo para ir ahí.' : 'Cambia de versión en Formato para leerlo.') + '</span>';
  el.style.display = 'flex';
  void el.offsetWidth;
  el.classList.add('visible');
}

$('btnHistorial').addEventListener('click', ev => {
  ev.preventDefault(); ev.stopPropagation();
  if (histAbierto) cerrarHistorial(); else abrirHistorial();
});
$('historial').addEventListener('click', ev => {
  /* LA LISTA DE CINTAS, desde el pie. El menú se cuelga del propio botón: se
     cuelga siempre de lo que lo abrió, y aquí lo que lo abrió no es una cinta.

     Y EL RASTRO SE QUEDA ABIERTO. Antes se cerraba, y cerrarlo era demasiada
     carga visual de golpe: la lista de por dónde has pasado desaparecía entera
     para enseñar la de cintas, cuando las dos contestan la misma pregunta y se
     miran una detrás de otra. El menú vive por encima del rastro (z-index 9
     contra 8) y sale pegado al botón, así que se ve dónde nació y basta con
     cerrarlo para tener el rastro otra vez debajo, tal como estaba.

     Segundo toque en el botón lo cierra: el botón es la puerta, y una puerta
     que solo abre deja al lector buscando por dónde se sale. */
  const lista = ev.target.closest('[data-sep-lista]');
  if (lista){
    ev.preventDefault(); ev.stopPropagation();
    if (sepMenuAbierto === 'lista') cerrarSepMenu();
    else abrirSepMenu(null, lista);
    return;
  }
  /* LA LISTA DE PIEDRAS, por la misma puerta y con las mismas reglas que la de
     cintas: el rastro se queda abierto detrás y el botón alterna. */
  const piedraLista = ev.target.closest('[data-piedra-lista]');
  if (piedraLista){
    ev.preventDefault(); ev.stopPropagation();
    if (piedraMenuAbierto) cerrarPiedraMenu();
    else abrirPiedraMenu(piedraLista);
    return;
  }
  /* PONER UNA PIEDRA cierra el rastro, por lo mismo que ponerle una cinta:
     acabas de dejar algo en la hoja y lo que hay que ver es la hoja. */
  if (ev.target.closest('[data-piedra-nueva]')){
    ev.preventDefault(); ev.stopPropagation();
    cerrarHistorial();
    trasPintar(() => ponerPiedra());
    return;
  }
  /* PONER UNA CINTA A MANO. Cierra el panel: acabas de marcar la hoja donde
     estás y lo que hay que ver es la cinta, no la lista de por dónde has
     pasado. Y la lectura queda marcada, así que no se te vuelve a preguntar
     en esta sesión: ya contestaste poniéndola. */
  if (ev.target.closest('[data-sep-nuevo]')){
    ev.preventDefault(); ev.stopPropagation();
    cerrarHistorial();
    /* Si esta hoja YA tiene cinta, el botón no pone otra encima: abre la suya.
       Dos cintas en la misma hoja no marcan dos sitios, marcan uno mal. Y de
       paso es la puerta a la lista desde el panel, sin inventar otro botón. */
    const ya = sepDeLaHoja();
    if (ya){ abrirSepMenu(ya.id); return; }
    crearSeparador();
    return;
  }
  if (ev.target.closest('[data-atras]')){
    ev.preventDefault(); ev.stopPropagation();
    darUnPasoAtras(); return;
  }
  const f = ev.target.closest('[data-hs]'); if (!f) return;
  ev.preventDefault(); ev.stopPropagation();
  const [lib, c, v] = f.dataset.hs.split(':');
  abrirPleno(lib, +c, +v);
});
$('versoPleno').addEventListener('click', ev => {
  /* LA X SE LLEVA LA VENTANITA Y NADA MÁS. No cierra el rastro que la abrió
     ni el panel de la glosa: cerrar lo que estabas mirando por encima no es
     razón para deshacer el sitio desde el que preguntaste —volver a la lista
     y abrir otra línea es justo lo siguiente que se hace—. Eso lo distingue
     del toque de fuera, que sí se lleva a los dos cuando el rastro está
     abierto, porque ahí el toque cayó fuera de los dos. */
  if (ev.target.closest('[data-cerrar-pleno]')){
    ev.preventDefault(); ev.stopPropagation();
    cerrarPleno(); return;
  }
  ev.preventDefault(); ev.stopPropagation();
  const b = ev.target.closest('[data-ir]');
  const p0 = plenoAbierto || {};
  const lib = b ? b.dataset.ir.split(':')[0] : p0.libro;
  const c = b ? b.dataset.ir.split(':')[1] : p0.cap;
  const v = b ? b.dataset.ir.split(':')[2] : p0.vers;
  if (!lib || !c || !v) return;
  /* La letra y el origen se leen de plenoAbierto, que es de donde salió esta
     ventanita. Sin la letra, saltar desde una referencia con glosa —«2:4b»—
     aterrizaba en el versículo entero en vez de en la glosa concreta. */
  const p = plenoAbierto || {};
  const letra = p.letra || '';
  const origen = p.origen || null;
  /* Si la ventanita salió de una cinta, volver ahí la vuelve la activa, y eso
     es lo que hace una cinta: abres el libro por donde la dejaste y sigues
     desde ahí. No se crea otra —duplicarla sería tener dos marcas del mismo
     sitio— y ninguna de las demás se mueve, tampoco la que estuviera siguiendo
     otra lectura. Se cobra AQUÍ y no al abrir la ventanita: mirar a dónde
     llevaba una cinta no es haber vuelto a ella. */
  if (p.sep && sepDe(p.sep)){
    sepActivo = p.sep;
    sepOfrecido = true;
    sepLeidasSeguidas = 0;
  }
  /* Se cierra TODO antes de saltar, y antes por dos razones: el panel tapa
     justo el texto al que vas, y el disco de buscar sale en el centro de la
     hoja, que es donde está la ventanita. El salto arranca al cuadro
     siguiente para que el cierre alcance a empezar. */
  cerrarHistorial();
  if (rGlosas && rGlosas.abierto) rGlosas.cerrar(false, true);
  /* Y el panel de la glosa también, si la ventanita salió de ahí: saltas a
     otro sitio, así que la edición que abrió esto se da por terminada —lo
     escrito se cobra, que es lo que hace ocultarMenu—. */
  if (borrador) ocultarMenu();
  /* LA RAMPA DORADA SE MUDÓ AQUÍ. Vivía en la referencia de la glosa, porque
     era la referencia la que saltaba; ahora la referencia solo abre esta
     ventanita —que es instantánea, y 260 ms de rampa por delante de algo
     instantáneo son 260 ms de espera—. El salto caro es éste, y es éste el
     que gana con tener despegue. */
  const foco = b || $('versoPleno');
  encender(foco, () => {
    try { irA(lib, +c, +v, letra, { origen }); }
    finally { apagar(foco); }
  });
});
/* Un toque fuera lo cierra, en captura y antes que nadie, igual que la
   burbuja. La ventanita cuenta como "dentro": si no, tocarla la cerraría
   antes de que su propio oyente llegara a leer el toque.

   Y SE PREGUNTA POR LAS DOS, no solo por el historial. La ventanita nació
   colgada del historial —se abría desde una fila y se iba con él—, así que
   mirar `histAbierto` bastaba. Desde que la abren también una referencia
   dentro de una glosa y la caja de escribir del panel, ya no: en esos dos
   caminos el historial está cerrado, este oyente se rendía en la primera
   línea, y la ventanita se quedaba puesta: entonces no llevaba X, así que lo
   único que quedaba era saltar al versículo o dar a Escape —o sea, irse a
   otro sitio para poder quedarse—. La X vino después y es la salida que se
   ve; ésta sigue siendo la que se hace sin mirar.
   El historial sigue haciendo lo de siempre: si está abierto, el toque de
   fuera se los lleva a los dos, que es lo que ya hacía cerrarHistorial. */
/* Y EL MENÚ DE CINTAS TAMBIÉN CUENTA COMO "DENTRO", desde que se abre sin
   cerrar el rastro: sale por encima de él, así que tocar una cinta de la lista
   es un toque fuera del rastro, y sin esta excepción el rastro se cerraba en el
   pointerdown —antes de que el click llegara a la fila— y lo que quedaba
   detrás era el menú solo, colgado de un panel que ya no estaba. */
document.addEventListener('pointerdown', ev => {
  if (!histAbierto && !plenoAbierto) return;
  if (ev.target.closest('#historial, #btnHistorial, #versoPleno, #sepMenu, #piedraMenu')) return;
  if (histAbierto) cerrarHistorial(); else cerrarPleno();
}, true);

/* Las dos puertas a la burbuja, cada una a su sección. */
/* DE LEJOS, LA HOJA ES UNA FOTO Y NO UN TABLERO DE MANDOS.

   Los dos rótulos viven DENTRO del papel, así que con la vista de lejos puesta
   se encogen al 58% y siguen respondiendo. Dos cosas malas a la vez: a ese
   tamaño el rótulo mide unos seis píxeles y nadie lo toca a propósito —lo que
   llega ahí son toques fallidos—, y encima el toque abría el panel Y cerraba
   el zoom, porque estos manejadores no cortan la propagación y el cierre
   cuelga de la escena. Dos respuestas a un gesto que no se pidió.
   De lejos, todo lo que hay sobre el papel significa lo mismo: acércame otra
   vez. Es una regla sola y no hay que aprenderla.
   Lo levantó la revisión de Codex. */
$('pgCabeza').addEventListener('click', e => {
  e.preventDefault();
  if (zoomActivo) return;
  alternarBurbuja('libros');
});
/* Y la de abajo abre la lista de versiones, que es lo que nombra. */
/* UN TOQUE ABRE LAS VERSIONES, DOS ABREN LIBROS. El rótulo del pie lleva dos
   puertas: la de todos los días delante y otra detrás.

   Detrás estaba Formato, por parentesco —la versión se cambia ahí— y era la
   puerta equivocada. Desde que el toque simple abre la lista de versiones en
   su globo, ir a Formato a cambiar de versión ya no hace falta: el doble clic
   llevaba al sitio largo para hacer lo que el corto ya hacía corto. Libros es
   lo otro que se busca de verdad estando en una hoja, y desde el pie no había
   forma de llegar sin subir a la esquina de arriba.
   Las dos etiquetas quedan puestas de la misma manera, cada una con su gesto:
   arriba un toque abre Libros, abajo un toque abre versiones y dos, Libros.

   EL PLAZO DEL DOBLE ES MÁS LARGO AQUÍ QUE EN EL FILO, y a propósito.

   Compartían los 240 ms del filo, con el argumento de que el programa debía
   tener un solo tiempo de doble clic. El argumento era bueno y los dos casos
   no son el mismo. En el filo, el doble clic es un atajo de quien ya conoce
   la aplicación y da dos golpecitos seguidos sin pensarlo. Aquí es la única
   forma de llegar a Libros desde el pie: se hace despacio, mirando, y a
   240 ms el globo de versiones se abría en medio de los dos toques y el
   segundo caía encima de él.

   440 ms es lo que tarda un doble clic hecho a conciencia. El precio es que
   abrir las versiones —el gesto de todos los días— tarda ese pelo más, y es
   un precio real: no se puede abaratar sin renunciar al otro, porque el
   primer clic de un doble es indistinguible de un clic solo hasta que pasa el
   plazo. Se paga porque un gesto que no se consigue hacer no vale nada, y
   440 ms de espera se notan mucho menos que tres intentos.

   Cerrar no espera. Si el globo ya está abierto, el toque lo cierra en el
   acto: ahí no hay ambigüedad que resolver —nadie hace doble clic para
   cerrar— y hacerle esperar a un cierre lo vuelve pegajoso. */
const ESPERA_DOBLE_ROTULO = 440;
let relojVersion = null;
$('pgVersion').addEventListener('click', e => {
  e.preventDefault();
  if (zoomActivo) return;            /* ver el comentario del rótulo de arriba */
  e.stopPropagation();
  clearTimeout(relojVersion);
  if (versionAbierta){ cerrarVersiones(); return; }
  /* CON UN PANEL ABIERTO, EL RÓTULO LO CIERRA Y NADA MÁS. El rótulo vive en la
     hoja, y con el panel corrido encima la hoja es justo lo que no se ve: el
     gesto que se está haciendo es «quítame esto de delante», no «enséñame las
     versiones». Abrir el globo ahí encima apilaba una cosa sobre otra para
     responder a algo que nadie había pedido.
     Y va sin esperar el plazo, por lo mismo que el cierre del globo: cerrar no
     es ambiguo. */
  if (burbujaAbierta()){ cerrarTodosLosRollos(); return; }
  /* Envuelto a propósito: setTimeout(abrirVersiones, ...) le pasaría a la
     función lo que el temporizador quiera darle, y ahora abrirVersiones lee su
     primer argumento. Este camino es el del dedo, así que abre sin mover el
     foco. */
  relojVersion = setTimeout(() => abrirVersiones(false), ESPERA_DOBLE_ROTULO);
});
$('pgVersion').addEventListener('dblclick', e => {
  e.preventDefault();
  if (zoomActivo) return;
  e.stopPropagation();
  clearTimeout(relojVersion);
  cerrarVersiones();
  alternarBurbuja('libros');
});

/* ENTER Y ESPACIO HACEN LO QUE HACE EL TOQUE, y hacen falta porque estos dos
   rótulos son <div>: un <button> respondería solo a las dos teclas, un div no
   responde a ninguna. Con el tabindex puesto y sin esto, el foco llegaría al
   rótulo y ahí se quedaría, que es la peor versión de las dos —parece que se
   puede y no se puede—.

   SIN EL PLAZO DEL DOBLE CLIC. Los 440 ms existen para distinguir el primer
   toque de un doble, y con el teclado no hay tal cosa que distinguir: no
   existe el "doble Enter". Así que la versión se abre en el acto, y la otra
   puerta —Libros— no se pierde por ello: la tiene el rótulo de arriba, que
   con este mismo cambio ya se alcanza con el tabulador.

   El espacio lleva preventDefault sí o sí, incluso con el zoom puesto, porque
   la tecla desplaza la página por defecto y eso pasaría igualmente. */
const conTeclas = (el, hacer) => el.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
  ev.preventDefault();
  if (zoomActivo) return;              /* ver el comentario del rótulo de arriba */
  ev.stopPropagation();
  hacer();
});
conTeclas($('pgCabeza'), () => alternarBurbuja('libros'));
conTeclas($('pgVersion'), () => {
  clearTimeout(relojVersion);
  if (versionAbierta){ cerrarVersiones(); return; }
  /* Con un panel delante el rótulo lo quita y nada más, igual que con el dedo:
     el gesto es "quítame esto", no "enséñame las versiones". */
  if (burbujaAbierta()){ cerrarTodosLosRollos(); return; }
  abrirVersiones(true);
});

/* ============================================================
   LA LISTA DE VERSIONES, EN SU PROPIO GLOBO.

   Las filas se arman aquí y no se copian del panel a propósito: son la misma
   lista pero no el mismo botón. En el panel caben abreviaturas porque compiten
   con otros nueve ajustes; aquí sobra sitio para el nombre entero, que es lo
   que de verdad hace falta para elegir entre traducciones —"RVR1909" no dice
   nada que "Reina-Valera 1909" no diga mejor—. Clonar el marcado del panel
   habría atado las dos formas a la misma decisión para siempre.
   Lo que sí es común es a dónde van: las dos llaman a setVersion, que es donde
   vive el cambio de verdad.
   ============================================================ */
let versionAbierta = false;
function pintarVersiones(){
  $('burbujaVersion').innerHTML = '<span class="bv-tit">Versión</span>' +
    Object.entries(D.versiones).map(([k, v]) =>
      '<button class="bv-fila' + (k === version ? ' aqui' : '') + '" data-bv="' + esc(k) + '"' +
      ' title="' + esc(v.licencia || '') + '">' +
      '<span class="bv-abrev">' + esc(v.abrev || k) + '</span>' +
      '<span class="bv-nombre">' + esc(v.nombre || k) + '</span></button>').join('');
}
function abrirVersiones(conTeclado){
  if (versionAbierta) return;
  cerrarTodosLosRollos(); cerrarHistorial();
  versionAbierta = true;
  pintarVersiones();
  const el = $('burbujaVersion');
  el.style.display = 'flex';
  void el.offsetWidth;
  el.classList.add('visible');
  $('pgVersion').classList.add('abierta');
  $('pgVersion').setAttribute('aria-expanded', 'true');
  /* EL FOCO ENTRA EN EL GLOBO, PERO SOLO SI VINO DEL TECLADO. Las filas ya son
     <button>, así que en cuanto el globo está puesto se recorren solas con el
     tabulador; lo que faltaba es el salto de entrada, porque el foco se queda
     en el rótulo y desde ahí el siguiente tabulador se va a otra parte.
     Y solo con teclado: mover el foco después de un toque abre el teclado del
     sistema en algunos aparatos y desplaza la hoja para "enseñar" lo que ya se
     veía. Quien abre con el dedo no ha pedido nada de eso. */
  if (conTeclado){
    const fila = el.querySelector('.bv-fila.aqui') || el.querySelector('.bv-fila');
    if (fila) fila.focus();
  }
}
function cerrarVersiones(){
  if (!versionAbierta) return;
  versionAbierta = false;
  const el = $('burbujaVersion');
  /* EL FOCO VUELVE AL RÓTULO, y solo si estaba dentro de lo que se cierra. Un
     globo que se va con el foco puesto dentro lo deja en un elemento oculto, y
     el navegador lo devuelve al <body>: el siguiente tabulador empieza otra vez
     desde arriba y se pierde el sitio. Preguntando primero, cerrar el globo por
     cualquier otro camino —un toque fuera, abrir un panel— no le roba el foco a
     quien lo tuviera en otra parte. */
  /* preventScroll porque este rótulo vive DENTRO del papel, y el papel se
     corre de lado —así se llega a la columna de glosas—. Un focus() a secas le
     pide al navegador que lo traiga a la vista, y eso devolvería el papel a su
     sitio: cerrar el globo movería la hoja, que es un efecto que nadie pidió.
     Dentro del globo sí se deja el desplazamiento: ahí traer la fila a la
     vista es justo lo que hace falta si la lista no cabe entera. */
  if (el.contains(document.activeElement)) $('pgVersion').focus({ preventScroll: true });
  el.classList.remove('visible');
  $('pgVersion').classList.remove('abierta');
  $('pgVersion').setAttribute('aria-expanded', 'false');
  setTimeout(() => { if (!versionAbierta) el.style.display = 'none'; }, 260);
}
$('burbujaVersion').addEventListener('click', ev => {
  const f = ev.target.closest('[data-bv]'); if (!f) return;
  ev.preventDefault(); ev.stopPropagation();
  const k = f.dataset.bv;
  /* Se cierra ANTES de cambiar, y no por cortesía: cambiar de versión rehace
     el plano y repagina el libro entero, y eso traba el hilo. Con el globo
     todavía puesto, el cierre no llegaría a pintarse hasta que terminara el
     trabajo y se vería colgado. El cambio arranca al cuadro siguiente, cuando
     el cierre ya empezó. */
  cerrarVersiones();
  /* El diferido que hace falta para que el cierre del globo se pinte —y ahora
     también el disco de «cambiando de versión»— vive dentro de cambiarVersion,
     que es de donde tiene que colgar: el retraso no es cosa de este botón sino
     del trabajo que dispara, y por el camino del panel de Formato hace la
     misma falta.
     Nota de lo que NO arregla, porque la revisión de Codex avisó de ello: el
     globo no se quedaba congelado encima de la hoja durante la repaginación.
     cerrarVersiones() corre aquí mismo, dentro de la tarea del clic, así que
     el navegador pinta al terminarla. Comprobado con la CPU frenada a la
     cuarta parte —15255 ms de hilo trabado, sitio de sobra para verlo—. */
  cambiarVersion(k);
});
/* Un toque fuera lo cierra, en captura, igual que el historial. El propio
   rótulo queda exceptuado: su oyente ya sabe alternar, y cerrarlo aquí lo
   volvería a abrir en el mismo gesto. */
document.addEventListener('pointerdown', ev => {
  if (ev.target.closest('#burbujaVersion, #pgVersion')) return;
  /* Se cancela también el globo PENDIENTE, no solo el abierto. Durante los
     240 ms de espera del doble clic la bandera todavía está en falso, así que
     este oyente no veía nada que cerrar: tocabas el rótulo, te arrepentías y
     tocabas otra cosa, y un cuarto de segundo después el globo se abría encima
     de lo que acabaras de hacer. Antes no pasaba porque el globo se abría en
     el acto y este mismo toque lo cerraba. Lo encontró Codex. */
  clearTimeout(relojVersion);
  if (!versionAbierta) return;
  cerrarVersiones();
}, true);

[['right', edgeR], ['left', edgeL]].forEach(([s, el]) => {
  el.addEventListener('pointerdown', e => bordeAbajo(e, s));
  el.addEventListener('pointermove', e => bordeMueve(e, s));
  el.addEventListener('pointerup',   e => bordeArriba(e, s));
  el.addEventListener('pointercancel', () => { gestoPendiente = null; ocultarHuella(); if (folding) endFold(); });
});
function animate(turn){
  const from = {...F};
  /* El espejo del ancla: ahí la línea de doblez alcanza el borde opuesto y
     el giro se completa de verdad. */
  const to = turn ? {x: side==='right' ? -W*1.06 : W*2.06, y:from.y} : {x:anchor.x, y:anchor.y};
  const dur = turn?420:200, t0 = performance.now();
  const mio = ++generacionPliegue;
  (function step(now){
    if (mio !== generacionPliegue) return;    /* misma regla que en animarHojas */
    const k = Math.min(1,(now-t0)/dur), e = turn ? 1-Math.pow(1-k,3) : 1-Math.pow(1-k,2);
    alfaTop = turn ? desvanecer(e) : 1;
    F = {x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e};
    drawFold();
    if (k<1) return requestAnimationFrame(step);
    if (turn){
      const destino = paginaActual + (side === 'right' ? 1 : -1);
      volverA = null;                       // pasar hojas a mano cancela el regreso
      /* El dedo también cruza de libro. Y cruza SIN volver a animar: la hoja
         que se acaba de voltear es la vuelta, y repetirla daría dos giros por
         un gesto. Lo que queda por hacer es rehacer el libro y aterrizar.
         La cara de debajo sale en blanco durante ese giro, porque la foto de
         la primera hoja del libro siguiente no existe hasta que el libro está
         armado y armarlo a media caricia trabaría el gesto. */
      if (!hayHojaN(destino)){
        anchor = F = null;
        if (cruzarLibro(side, null, true)) return;
        fx.style.display='none'; pg.classList.remove('hidden'); updateReadout();
        return;
      }
      paginaActual = destino;
      renderPage();
    }
    fx.style.display='none'; pg.classList.remove('hidden'); anchor=F=null; updateReadout();
    if (typeof sepTrasPliegue === 'function') sepTrasPliegue();
  })(t0);
}

/* ============================================================
   SALTO CON VUELTA DE HOJA. Aunque el destino esté a cinco hojas,
   se anima UNA sola vuelta y se aterriza ahí: cinco sería mareador.
   ============================================================ */
/* Voltea de la hoja `desde` a la hoja `hacia`, con sus dos fotos. */
function pasoAnimado(desde, hacia, dur, hojas, cb){
  side = hacia > desde ? 'right' : 'left';
  sizeCanvas();
  let arriba = null, abajo = null, faltan = 2;
  const arrancar = () => {
    if (!arriba){ cb(); return; }
    pageImg = arriba; bajoImg = abajo;
    animarHojas(hojas, dur, cb);
  };
  fotoDeHoja(desde, i => { arriba = i; if (!--faltan) arrancar(); });
  fotoDeHoja(hacia, i => { abajo  = i; if (!--faltan) arrancar(); });
}

/* El puño de hojas volteándose, con las fotos ya puestas en pageImg y
   bajoImg. Lo usan los saltos dentro de un libro y el cambio de libro. */
/* `anclaY` fija el punto de agarre; sin él se elige al azar. Un clic en el
   filo lo pasa, para que la hoja gire desde donde pusiste el dedo. */
function animarHojas(hojas, dur, cb, anclaY){
  folding = true;
  plegandoConDedo = false;                 /* esto lo mueve la máquina, no un dedo */
  if (typeof sepAlPlegar === 'function') sepAlPlegar();
  pg.classList.add('hidden'); fx.style.display = 'block';

  const bordeX = side === 'right' ? W : 0;
  anchor = { x: bordeX,
             y: anclaY == null ? rnd(H*0.20, H*0.80)
                               : Math.min(Math.max(anclaY, H*0.06), H*0.94) };
  /* F ARRANCA EN EL ANCLA, aquí y no en el primer cuadro. Dejarlo nulo abría
     una ventana —desde este renglón hasta que corriera el primer rAF— en la
     que folding ya era cierto y F todavía no existía; un toque en el filo
     dentro de esa ventana llegaba a endFold y reventaba leyendo F.x. Con
     toques repetidos y rápidos sobre el filo se reproduce sin dificultad: 14
     pares de pulsación y suelta dan cinco de esos errores.
     El arreglo de fondo es la bandera de arriba, pero un estado a medio armar
     no se deja armado a medias porque alguien más lo tape: F y anchor nacen
     juntos, que es como se leen en todos los demás sitios. */
  F = { ...anchor };

  /* EL TIRO DIAGONAL. Antes la salida era un punto horizontal con un
     empujoncito vertical fijo: como el recorrido horizontal tiene que ser
     larguísimo para que el giro se complete, ese empujón quedaba en 4° y
     se veía recto. Ahora se elige primero el ÁNGULO y de ahí se calcula el
     largo —2·ancho dividido entre el coseno— así el ángulo se conserva
     entero por muy largo que sea el tiro.
     Y se tira hacia el centro de la hoja: jalar hacia la orilla más cercana
     saca la línea de doblez de la página antes de tiempo. */
  const esquinas = [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  const tiro = (y0, maxAng) => {
    const hacia = y0 < H*0.42 ? 1 : y0 > H*0.58 ? -1 : (Math.random() < .5 ? -1 : 1);
    const ang = hacia * rnd(maxAng*0.45, maxAng);
    const dir = side === 'right' ? -1 : 1;
    const ux = dir*Math.cos(ang), uy = Math.sin(ang);
    /* El largo se calcula proyectando las cuatro esquinas sobre la dirección
       del jalón: al inclinar el tiro, la hoja "mide más" en esa dirección y
       hay que recorrer más para que el doblez la cruce entera. */
    let alcance = 0;
    for (const p of esquinas)
      alcance = Math.max(alcance, (p.x - bordeX)*ux + (p.y - y0)*uy);
    const largo = 2*alcance*rnd(1.04, 1.12);
    return { x: bordeX + largo*ux, y: y0 + largo*uy };
  };
  const meta = tiro(anchor.y, 0.30);          // hasta 17°

  /* Aquí estuvo un rato el "arranque adelantado": la animación empezaba ya
     avanzada para saltarse el tramo en que el doblez viaja por fuera de la
     pantalla. En el papel sonaba bien y en la mano no: la hoja aparecía a
     media vuelta y el gesto perdía su principio. Se probó y se quitó.
     El pliegue nace en el borde real del papel y recorre todo su camino,
     aunque el primer tercio no se vea. */
  hojasExtra = [];
  for (let i = 1; i < hojas; i++){
    const a = { x: bordeX, y: rnd(H*0.12, H*0.88) };
    /* Cada hoja sale cuando se le da la gana y tarda lo suyo; si todas
       terminaran juntas se volvería a ver a compás. */
    /* La ventana de salida se abre según cuántas sean: con pocas conviene que
       vayan casi juntas, con muchas hay que repartirlas o se ven como una sola
       masa gruesa en vez de como hoja tras hoja tras hoja. */
    const retraso = rnd(0, Math.min(0.72, 0.24 + 0.028*hojas));
    /* Cada hoja tarda lo suyo en cruzar, y ese rato NO se reparte con las
       demás: antes la duración era el pedazo que sobraba después del retraso,
       así que las últimas cruzaban en un tercio del tiempo y se veían como un
       latigazo. Ahora todas tardan parecido y las rezagadas simplemente
       terminan después de que la hoja de arriba ya se volteó. */
    hojasExtra.push({ a, b: tiro(a.y, 0.34),
                      retraso, dur: rnd(0.34, 0.52) });
  }
  hojasExtra.sort((x,y) => y.retraso - x.retraso);   // las más rezagadas, al fondo

  /* EL RELOJ DE LA ANIMACIÓN AVANZA POR CUADROS, NO POR RELOJ DE PARED.
     Con (now - t0) un tirón del hilo principal se come la animación: si
     calcular la hoja destino tarda 700 ms y la animación dura 1200, al pintar
     el primer cuadro ya pasó más de la mitad y el bonche aparece a mitad de
     camino o directamente terminado. Eso es exactamente lo que se veía —entre
     más tardaba el salto, más corto el manojo— y era peor al regresar, porque
     ahí hay que rearmar el libro de origen.
     Sumando los saltos entre cuadros con un tope, un tirón largo cuenta como
     un cuadro normal: la animación se pausa, no se salta. */
  let t = 0, previo = performance.now();
  const mio = ++generacionPliegue;
  (function paso(now){
    if (mio !== generacionPliegue) return;    /* llegó otro pliegue: éste se retira */
    if (!anchor || !F) return;
    t += Math.min(now - previo, 45);          // 45 ms = tres cuadros a 60 Hz
    previo = now;
    const k = Math.min(1, t/dur);
    progreso = suave(k);
    alfaTop = desvanecer(progreso);
    F = { x: anchor.x + (meta.x - anchor.x)*progreso,
          y: anchor.y + (meta.y - anchor.y)*progreso };
    drawFold();
    if (k < 1) return requestAnimationFrame(paso);
    cb();
  })(previo);          /* el primer cuadro arranca con delta cero */
}

function animarSalto(destino, alLlegar){
  const aterrizar = () => {
    paginaActual = destino;
    hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; plegandoConDedo = false; anchor = F = null;
    /* UNA HOJA NUEVA SE ABRE POR EL TEXTO. El cajón de glosas se queda donde
       lo dejaste mientras pasas hojas, y eso está bien: es la misma lectura.
