     sobra no se recorta con barra: se derrama y lo tapa .stage, que sí lleva
     overflow:hidden. El resultado es que los últimos ajustes y el crédito
     quedan fuera de la pantalla sin manera de llegar a ellos.
     Medido a 560x360: 40px de contenido inalcanzable.

     El tope se vuelve desplazable, no más alto: el panel tiene que seguir
     dejando ver la hoja debajo, que es de lo que trata la burbuja.
     overscroll-behavior:contain para que llegar al final del panel no
     empiece a correr la hoja de atrás.

     YA NO VA ACOTADO A LAS PANTALLAS BAJAS. Lo estuvo, y con razón: mientras
     el panel medía 476px sobraba sitio en vertical y no había nada que
     resolver. Agrandar los blancos de toque le suma unos 135px a Formato, y
     eso lo acerca al tope en pantallas que antes ni se enteraban. Poner la
     barra donde no hace falta no cuesta nada —si el contenido cabe, no
     aparece— y no ponerla donde sí hace falta cuesta el último ajuste del
     panel, que es lo que ya pasó una vez. El caso de orilla dejó de ser de
     orilla. Va también Respaldo, que se había quedado fuera de la lista sin
     más motivo que ser el más corto de los tres. */
  @media (max-width: 560px){
    #ajustes, #etiquetas, #respaldo{ overflow-y:auto; overflow-x:visible;
                                     overscroll-behavior:contain; }
  }
</style>
</head>
<body>


<div id="ctrlConfig">

<div class="grupo-simple">
  <div class="ajuste"><span class="lbl">tamaño</span><span class="ctrl">
    <button class="btn" id="fsDown" title="Un punto menos">A−</button>
    <select id="fsAhora" title="Elige el tamaño de un tirón"></select>
    <button class="btn" id="fsUp" title="Un punto más">A+</button>
  </span></div>
  <div class="ajuste"><span class="lbl">tipografía</span><span class="ctrl">
    <select id="selFuente" title="Tipo de letra"></select>
  </span></div>
  <div class="ajuste"><span class="lbl">márgenes</span><span class="ctrl">
    <button class="btn" id="btnMargen">normales</button>
  </span></div>
  <div class="ajuste"><span class="lbl">alineación</span><span class="ctrl">
    <button class="btn" id="btnAli">izquierda</button>
  </span></div>
  <div class="ajuste"><span class="lbl">interlínea</span><span class="ctrl">
    <button class="btn" id="btnAire">normal</button>
  </span></div>
  <div class="ajuste"><span class="lbl">versículos</span><span class="ctrl">
    <button class="btn" id="btnVerso">corridos</button>
  </span></div>
</div>

<div class="grupo-triple">
  <!-- Cada botón lleva sus dos nombres y el CSS enseña el que toca: en el
       teléfono la cifra, en pantalla ancha la palabra. Se hace así y no desde
       el guion porque girar el aparato cruza el umbral de los 560px, y con
       JavaScript habría que acordarse de reescribirlos en cada giro; con dos
       nombres puestos, el navegador lo resuelve solo y no hay nada que
       recordar. Los manejadores leen data-cols, nunca el texto. -->
  <div class="ajuste"><span class="lbl">columnas</span><span class="ctrl">
    <button class="btn" data-cols="1"><span class="largo">una</span><span class="corto">1</span></button>
    <button class="btn active" data-cols="2"><span class="largo">dos</span><span class="corto">2</span></button>
    <button class="btn" data-cols="3"><span class="largo">tres</span><span class="corto">3</span></button>
  </span></div>
  <!-- Aquí vivía "hoja" —celular / tablet / ancha—. Se fue: el ancho ya se
       ajusta solo a la pantalla, así que era un control que ofrecía decidir
       algo que no estaba en tus manos. En teléfono la hoja siempre midió
       100vw por CSS, y el botón no cambiaba nada de lo que se veía. -->
  <div class="ajuste"><span class="lbl">glosa</span><span class="ctrl">
    <button class="btn" data-lay="below">abajo</button>
    <button class="btn active" data-lay="margin">margen</button>
    <button class="btn" data-lay="foot">al pie</button>
  </span></div>
</div>

<!-- El sepia va a lo ancho porque un deslizador corto no se atina con el
     pulgar: cuanto más largo el riel, más fino el ajuste con el mismo gesto.
     Y va ARRIBA de la versión, que es lo último del panel por ser lo que
     menos se toca. -->
<div class="ajuste ancho"><span class="lbl">sepia</span><span class="ctrl">
  <input type="range" id="sepia" min="0" max="100" step="1" value="0"
         title="Entinta el papel: de blanco de imprenta a papel viejo" />
  <span class="medida" id="sepiaAhora">0</span>
</span></div>

<!-- Lleva id propio para que el rótulo de la hoja pueda señalarla al abrir:
     tocas "VBL" abajo y esta fila da un destello. Ver destellarVersion. -->
<div class="ajuste ancho" id="filaVersion"><span class="lbl">versión</span><span class="ctrl" id="ctrlVersiones">
  <!-- se arma solo con lo que traiga bibles-included.js -->
</span></div>
</div>

<div id="ctrlEtiquetas">
<div class="ajuste"><span class="lbl">aplicando</span><span class="ctrl">
  <div class="banda" id="banda">
    <select id="selActiva"><option value="">— ninguna —</option></select>
    <input id="nuevaEtiqueta" placeholder="nueva etiqueta" size="12" />
  </div>
</span></div>

<div class="ajuste"><span class="lbl">día</span><span class="ctrl">
  <select id="selDia"></select>
  <button class="btn ghost" id="btnEtiquetarDia">etiquetar</button>
</span></div>

<div class="ajuste ancho"><span class="lbl">ver</span><span class="ctrl" id="filtros"></span></div>
</div>

<div class="stage" id="stage">
  <div id="pg" class="pg">
    <div class="pg-inner">
      <div class="pg-cabeza" id="pgCabeza"></div>
      <div class="pg-cols">
        <div id="pgBody" class="pg-body" lang="es"></div>
        <div id="pgMargin" class="pg-margin"></div>
      </div>
      <div id="pgFoot" class="pg-foot"></div>
      <div class="pg-version" id="pgVersion"></div>
    </div>
  </div>
  <div id="flyCaps" class="fly"></div>
  <div id="flyVers" class="fly"></div>
  <div id="ajustes" class="rollo"></div>
  <div id="etiquetas" class="rollo"></div>
  <div id="respaldo" class="rollo"></div>
  <div id="canto" class="rollo"><div id="cantoCab"></div><div id="cantoCuerpo"></div></div>
  <canvas id="fx"></canvas>
  <div id="huella" aria-hidden="true"></div>
  <!-- role=status para que un lector de pantalla también se entere de que hay
       algo en marcha: el disco es la versión visible del mismo aviso.
       El aviso vive en .dice y NO en un aria-label, porque una región viva
       anuncia cuando le CAMBIA el contenido, no cuando le cambia la opacidad.
       Con el rótulo puesto en el atributo, la región decía "buscando" desde
       que se cargaba la página hasta que se cerraba y no anunciaba nunca
       nada: el comentario prometía algo que el código no hacía. Ahora
       mostrarBuscando escribe la frase y quitarBuscando la borra, que es lo
       que de verdad dispara el anuncio. Lo encontró la revisión de Codex. -->
  <div id="buscando" role="status" aria-live="polite">
    <!-- El brillo que gira: la cabeza del cometa y, detrás, su estela. Las <i>
         son las gotas de la estela, cada una rotada un poco más atrás que la
         anterior; cuelgan del mismo giro, así que hay UNA animación en toda la
         figura. Sin fondo: la luz se vale sola. -->
    <div class="halo">
      <div class="orbita">
        <span class="chispa"></span>
        <i><span class="chispa"></span></i>
        <i><span class="chispa"></span></i>
        <i><span class="chispa"></span></i>
        <i><span class="chispa"></span></i>
        <i><span class="chispa"></span></i>
        <i><span class="chispa"></span></i>
      </div>
    </div>
    <span class="dice"></span>
  </div>
  <div class="edge edge-l" id="edgeL" title="Clic: hoja anterior · Arrastra: pliega"></div>
  <div class="edge edge-r" id="edgeR" title="Clic: pasa la hoja · Arrastra: pliega"></div>
  <div id="menu"></div>
  <div id="readout"></div>
  <button class="btn" id="btnVolver" style="display:none">↩ volver</button>
  <!-- LO QUE HAS VISTO. El botón vive en la esquina de abajo a la derecha, que
       es la única de las cuatro que estaba libre: arriba a la izquierda no hay
       nada, arriba a la derecha está el titulillo, abajo a la izquierda el
       botón de volver del salto. Y va discreto a propósito: es una salida que
       se busca cuando se necesita, no una que tenga que llamar la atención
       mientras lees. -->
  <button id="btnZoom" title="Ver la hoja entera" aria-label="Ver la hoja entera">⊖</button>
  <!-- El punto lo dibuja el CSS con ::before; el botón va vacío a propósito,
       para que no haya un glifo que el navegador pueda componer a su manera.
       Lo que dice cada uno vive en aria-label, que es donde tiene que estar. -->
  <div id="zoomPasos">
    <button data-paso="-1" title="Hoja anterior" aria-label="Hoja anterior"></button>
    <button data-paso="1" title="Hoja siguiente" aria-label="Hoja siguiente"></button>
  </div>
  <button id="btnHistorial" title="Lo que has visto" aria-label="Lo que has visto">↺</button>
  <div id="historial" role="dialog" aria-label="Escrituras vistas" aria-modal="false"></div>
  <div id="versoPleno" role="dialog" aria-label="Versículo completo"></div>

const capsDe = (v, libro) => D.versiones[v].texto[libro || LIBRO];
const versoTexto = (v, cap, vers, libro) => {
  const caps = capsDe(v, libro); if (!caps) return '';
  const c = caps[cap]; return c ? (c[vers-1] || '') : '';
};
const hayLibro = id => !!D.versiones[version].texto[id];
function planoDe(v, libro){
  const salida = [], caps = capsDe(v, libro);
  if (!caps) return salida;
  for (const cap of Object.keys(caps).map(Number).sort((a,b)=>a-b))
    caps[cap].forEach((t, i) => salida.push({ cap, vers: i+1, texto: t }));

}

/* Versiones que se pueden paginar a la par: solo las que traen el mismo

   distinto, se queda fuera en vez de descuadrar todo. */
function versionesSincronizables(){
  const base = planoDe(version).length;
  return Object.keys(D.versiones).filter(v => {
    const p = planoDe(v);
    return p.length === base &&
           p.every((x,i) => x.cap === plano[i].cap && x.vers === plano[i].vers);

/* ============================================================
   ANCLAJE ROBUSTO. Cada marca guarda tres direcciones, de la más
   precisa a la más terca, y al abrir en otra versión se resuelve
   con la mejor que todavía cuadre:
     1. posición  (ini/fin) — solo vale en la versión donde se hizo
     2. cita      (texto exacto + contexto antes/después)
     3. cita normalizada (sin acentos, mayúsculas ni puntuación)
     4. el versículo completo — nunca se pierde la glosa
   Es el patrón de selectores del modelo de anotaciones de la W3C.
   ============================================================ */
function normalizar(s){
  const map = [], out = [];
  for (let i = 0; i < s.length; i++){
    const base = s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    if (/\s/.test(s[i])){
      if (out.length && out[out.length-1] === ' ') continue;
      out.push(' '); map.push(i); continue;
    }
    for (const ch of base){
      if (!/[\p{L}\p{N}]/u.test(ch)) continue;
      out.push(ch); map.push(i);
    }
  }
  return { t: out.join(''), map };
}
function buscarConContexto(texto, m){
  if (!m.cita) return -1;
  let mejor = -1, mejorPuntaje = -1, desde = 0, k;
  while ((k = texto.indexOf(m.cita, desde)) >= 0){
    const antes = texto.slice(Math.max(0, k - 24), k);
    const desp  = texto.slice(k + m.cita.length, k + m.cita.length + 24);
    let p = 0;
    for (let i = 1; i <= Math.min(antes.length, (m.antes||'').length); i++)
      if (antes.slice(-i) === (m.antes||'').slice(-i)) p = i;
    let q = 0;
    for (let i = 1; i <= Math.min(desp.length, (m.despues||'').length); i++)
      if (desp.slice(0,i) === (m.despues||'').slice(0,i)) q = i;
    if (p + q > mejorPuntaje){ mejorPuntaje = p + q; mejor = k; }
    desde = k + 1;
  }
  return mejor;
}
function buscarNormalizado(texto, cita){
  const T = normalizar(texto), C = normalizar(cita);
  if (!C.t) return null;
  const k = T.t.indexOf(C.t);
  if (k < 0) return null;
  return { ini: T.map[k], fin: T.map[k + C.t.length - 1] + 1 };
}
function resolver(m, ver){
  const texto = versoTexto(ver, m.cap, m.vers, m.libro);
  if (!texto) return null;
  if (m.versionOrigen === ver && texto.slice(m.ini, m.fin) === m.cita)
    return { ini:m.ini, fin:m.fin, grado:'exacta' };
  const k = buscarConContexto(texto, m);
  if (k >= 0) return { ini:k, fin:k + m.cita.length, grado:'cita' };
  const n = buscarNormalizado(texto, m.cita);
  if (n) return { ini:n.ini, fin:n.fin, grado:'aprox' };
  return { ini:0, fin:texto.length, grado:'versiculo' };
}
function resolverTodas(){
  RES = new Map();
  for (const m of marcas){
    const r = resolver(m, version);
    if (r) RES.set(m.id, r);
  }
  recalcularTurnos();

/* El turno de cada glosa dentro de su capítulo, en el orden en que se lee.
   Sirve para una sola cosa: que los giros alternen de lado.

   Primero lo até a la paridad del versículo y estuvo mal. Funcionaba solo si
   las notas caían en renglones seguidos, y las notas reales caen donde hay
   algo que comentar: si tus glosas viven en los versículos 3, 5, 7 y 9, todas
   tienen la misma paridad y salían todas ladeadas para el mismo lado, siempre.
   Cambié un amontonamiento ocasional por uno sistemático, que es peor.

   Con el turno no puede pasar: la primera nota del capítulo va para un lado,
   la segunda para el otro, sin importar en qué versículos caigan. Y sigue
   siendo estable —una glosa no cambia de giro al repintar ni al cambiar de
   hoja—, que es la regla que no se toca. Lo único que la mueve es agregar
   otra nota más arriba en el mismo capítulo. */
let TURNO = new Map();
function recalcularTurnos(){
  TURNO = new Map();
  const porCapitulo = new Map();
  for (const m of marcas){
    const k = m.libro + ':' + m.cap;
    if (!porCapitulo.has(k)) porCapitulo.set(k, []);
    porCapitulo.get(k).push(m);
  }
  for (const grupo of porCapitulo.values()){
    grupo.sort((a,b) => (a.vers - b.vers) || ((a.ini||0) - (b.ini||0)) ||
                        (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    grupo.forEach((m, i) => TURNO.set(m.id, i));
  }
}

const enLista = m => pasaFiltros(m) &&

function crearMarca(cap, vers, ini, fin){
  const texto = versoTexto(version, cap, vers);

    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),

    cita: texto.slice(ini, fin),

    despues: texto.slice(fin, fin+24),

/* Si reencuadras una marca en la versión donde estás, se reancla aquí:

function reanclar(m){
  const r = RES.get(m.id); if (!r) return;
  const texto = versoTexto(version, m.cap, m.vers, m.libro);
  m.cita = texto.slice(r.ini, r.fin);
  m.antes = texto.slice(Math.max(0, r.ini-24), r.ini);
  m.despues = texto.slice(r.fin, r.fin+24);

  for (const m of conNota){ const k = m.cap+':'+m.vers; cuenta.set(k, (cuenta.get(k)||0)+1); }

  }

  '1TI':'1timoteo 1ti', '2TI':'2timoteo 2ti', TIT:'tito tt', PHM:'filemón filemon flm',
  HEB:'hebreos heb', JAS:'santiago stg', '1PE':'1pedro 1p', '2PE':'2pedro 2p',
  '1JN':'1juan 1jn', '2JN':'2juan 2jn', '3JN':'3juan 3jn', JUD:'judas jud',
  REV:'apocalipsis ap apoc'
};
const CLAVE_LIBRO = (() => {
  const m = new Map();
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[\s.]/g,'');
  for (const id in LIBROS_ES) for (const alias of LIBROS_ES[id].split(' ')) m.set(norm(alias), id);
  return { mapa: m, norm };
})();
/* Primero el número, luego se mira HACIA ATRÁS por el nombre del libro.
   Al revés no funciona: un grupo opcional al frente se traga la palabra
   anterior ("en 2:17") y tira la referencia entera.
   La coma solo cuenta sin espacios (Lc 4,18) para no confundir "los
   capítulos 2, 3 y 4" con una referencia. */
const RE_REF = /(\d{1,3})(?:\s*:\s*|,)(\d{1,3})([a-h])?/g;
const RE_LIBRO_PREVIO = /([1-3]\s?)?([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,15})\.?\s*$/;

function interpretar(m, texto){
  let libro = LIBRO, inicio = m.index;                // sin nombre: el libro actual
  const antes = texto.slice(Math.max(0, m.index - 18), m.index);
  const mb = antes.match(RE_LIBRO_PREVIO);
  if (mb){
    const id = CLAVE_LIBRO.mapa.get(CLAVE_LIBRO.norm((mb[1]||'') + mb[2]));
    if (id){ libro = id; inicio = m.index - mb[0].length; }
  }
  return { libro, cap:+m[1], vers:+m[2], letra:m[3]||'', inicio, fin:m.index + m[0].length };
}
function refsDe(texto){
  const out = [];
  RE_REF.lastIndex = 0;
  let m;
  while ((m = RE_REF.exec(texto))) out.push(interpretar(m, texto));
  return out;
}
const refExiste = r => !!versoTexto(version, r.cap, r.vers, r.libro);
/* Convierte el texto de una glosa en HTML con las referencias activas. */
function enlazar(texto){
  let out = '', ultimo = 0;
  for (const r of refsDe(texto)){
    if (r.inicio < ultimo) continue;                  // por si dos se traslapan
    out += esc(texto.slice(ultimo, r.inicio));
    /* El globo dice A DÓNDE va, con el nombre completo del libro. El texto del
       enlace es lo que tú escribiste —"Ap 22:20"— y eso está bien, pero
       entonces no hay manera de comprobar que se interpretó como querías.
       Con el globo, el texto escrito y el destino resuelto se ven por
       separado y cualquier desajuste salta a la vista. */
    const vivo = refExiste(r);
    const destino = nombreDe(r.libro) + ' ' + r.cap + ':' + r.vers +
                    (r.letra ? ' (glosa ' + r.letra + ')' : '') +
                    (vivo ? '' : ' — no está en los datos cargados');
    out += '<span class="ref' + (vivo ? '' : ' muerta') + '" data-ref="' +
           r.libro + ':' + r.cap + ':' + r.vers + ':' + r.letra + '"' +
           ' title="' + esc(destino) + '">' +
           esc(texto.slice(r.inicio, r.fin)) + '</span>';
    ultimo = r.fin;
  }
  return out + esc(texto.slice(ultimo));
}

/* Vínculos de regreso: se derivan, no se escriben. Y cuelgan del
   VERSÍCULO, no de una glosa — porque el versículo citado puede no
   tener glosa propia y el vínculo tiene que vivir en algún lado. */
let BACK = new Map(), firmaBack = '';
function calcularVinculos(){
  BACK = new Map();
  for (const m of marcas){
    if (!m.nota) continue;
    for (const r of refsDe(m.nota)){
      if (r.libro === m.libro && r.cap === m.cap && r.vers === m.vers) continue;  // autocita
      const k = r.libro + ':' + r.cap + ':' + r.vers;
      const arr = BACK.get(k) || [];
      if (!arr.includes(m)) arr.push(m);
      BACK.set(k, arr);
    }
  }
  /* Y AQUÍ SÍ HAY QUE REPAGINAR, aunque las glosas estén al margen. Es el
     hueco que le faltaba al atajo de save(): la nota vive fuera del cuerpo,
     de acuerdo, pero el contador de citas que produce —el "‹1" que verseHTML
     escribe junto al número del versículo citado— vive DENTRO. Es texto en
     línea: cambia dónde parten los renglones, y cerca del canto de una hoja
     eso mueve un corte.
     Así que save() se queda preguntando lo suyo, que es si la nota ocupa alto,
     y la otra mitad de la pregunta se responde donde se puede responder: aquí,
     que es el único sitio que sabe si los contadores cambiaron. Se compara una
     firma del mapa —quién cita a quién, y cuántos de esos se están viendo—
     porque el contador depende también de los filtros de etiqueta.
     Corre justo antes de asegurarPaginas, así que la bandera se atiende en la
     misma pintada. Y sale barato: el mapa solo tiene las notas que citan algo,
     que son pocas, y crear un subrayado o una nota sin citas no lo mueve.
     Lo encontró la revisión de Codex; mi comprobación se había quedado en que
     la glosa no ocupa alto, que era verdad pero no era todo. */
  const firma = [...BACK.keys()].sort()
    .map(k => k + '=' + BACK.get(k).filter(visible).length).join('|');
  if (firma !== firmaBack){ firmaBack = firma; paginasSucias = true; }
}
const backDe = (cap, vers) => (BACK.get(LIBRO + ':' + cap + ':' + vers) || []).filter(visible);

/* ---------- la glosa no es un rectángulo ----------
   Una nota al margen la escribió una mano, y ninguna mano traza un rectángulo
   perfecto: el recuadro queda un pelo más ancho de un lado, las esquinas no
   redondean parejo, la pluma carga más en un trazo que en otro y el papel
   nunca estuvo del todo derecho. Eso es lo que se imita aquí.

   Dos reglas que no se pueden romper. La primera: el desorden se deriva del
   id de la marca, así que es siempre el mismo —una glosa no puede bailar
   cada vez que se repinta la página, ni cambiar de forma al pasar de hoja.
   La segunda: la inclinación se queda por debajo de 0.6 grados. En la foto
   de la hoja doblada el recuadro lo pinta el SVG (ya torcido) pero las
   letras las dibuja el lienzo en horizontal; a este ángulo el desfase es de
   menos de un píxel y no se ve, pero si subiéramos a dos o tres grados se
   notaría el texto derecho dentro de una caja chueca. */
function azarDe(id){
  let h = 2166136261;
  for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}
function formaOrganica(m){
  const r = azarDe(m.id);
  const esq = () => (3 + r() * 5.5).toFixed(1) + 'px';          /* esquinas dispares */
  const radio = esq()+' '+esq()+' '+esq()+' '+esq()+' / '+esq()+' '+esq()+' '+esq()+' '+esq();
  /* +-2px de aire a los lados: poco mas de medio milimetro por lado.
     EL AIRE DE ARRIBA Y ABAJO BAJA, el de los lados no. Y aquí es donde de
     verdad se decide, no en la regla .gl de la hoja de estilos: este relleno
     se escribe en el atributo style de cada nota, así que gana siempre. Quien
     venga a estrechar la glosa y solo toque el CSS no va a mover nada —cuesta
     una tarde averiguar por qué—.
     De 2.5–3.9px a 1.6–2.7px arriba y abajo: unos 2px menos por nota, que con
     la interlínea recortada suman cerca de un renglón por glosa de tres
     líneas. La variación se queda: el recuadro tiene que seguir sin ser un
     rectángulo. Y siguen siendo cuatro llamadas a r(), ni una más ni una
     menos: el azar va sembrado con el id de la marca, así que quitar o añadir
     una corre toda la serie y cambiaría el grosor, la sombra y el giro de
     todas las glosas ya escritas. */
  const pad = (1.6 + r()*1.1).toFixed(1)+'px '+(5 + r()*3.4).toFixed(1)+'px '+
              (1.6 + r()*1.1).toFixed(1)+'px '+(5 + r()*3.4).toFixed(1)+'px';
  /* Un solo ancho de pluma para toda la glosa: el trazo puede ser mas grueso
     en una nota que en otra —otro dia, otra pluma— pero nunca dentro de la
     misma, que es lo que se veia mal. */
  const grosor = (r() < .45 ? '1.3px' : '1px');
  /* La luz de la habitacion no cambia de sitio entre una nota y otra: todas
     las sombras caen hacia abajo y a la derecha, y lo unico que varia es
     cuanto se levanto esa esquina del papel. */
  const dx = (2.4 + r()*1.9).toFixed(1), dy = (2.8 + r()*2.0).toFixed(1);
  const sombra = dx+'px '+dy+'px '+(4.5 + r()*2.5).toFixed(1)+'px -2.6px rgba(72,56,28,.30)';
  /* Aquí NO se decide el ángulo, solo las ganas: un número de -1 a 1. Cuánto
     se puede girar de verdad depende del alto de la nota, y el alto no se
     sabe hasta que el navegador la acomoda. Lo resuelve asentarGiro().

     El TAMAÑO de esas ganas sale del azar, pero el SENTIDO no: lo decide el
     turno de la nota en su capítulo (ver recalcularTurnos). El azar puro reparte 50/50 en el total y aun así
     amontona en grupos chicos —con cuatro glosas en una hoja, una de cada
     ocho hojas las tiene las cuatro para el mismo lado—, y como la sombra
     siempre cae hacia abajo-derecha, esa racha se lee como si todas
     estuvieran giradas igual. Alternando por turno no hay racha posible, y cada
     nota conserva su giro. */
  const lado = (TURNO.get(m.id) || 0) % 2 ? 1 : -1;
  const frac = (lado * (.3 + r() * .7)).toFixed(3);
  return { frac: frac,
           css: 'border-radius:'+radio+';padding:'+pad+';border-width:'+grosor+
                ';box-shadow:'+sombra+';' };
}

/* CUÁNTO SE PUEDE TORCER UNA NOTA. Tres frenos, y manda el más estricto.

   1. El asomo lateral. Al girar theta, una caja de alto h saca las esquinas
      h*sen(theta)/2 por cada costado, y ese asomo crece con el alto. Se
      reserva un hueco de 4px por lado y nadie puede pasarse de ahí; si no,
      .pg-margin recorta la nota, que era el defecto que se veía.

   2. El brinco vertical. Este es el que de verdad manda a la vista: lo que
      el ojo juzga no es el ángulo sino cuánto sube y baja la esquina, y eso
      depende del ANCHO. Una caja de 200px a 2.4 grados levanta la esquina
      4.2px —un cuarto de renglón— y se lee como error de impresión, no como
      papel anotado. El presupuesto es 1.0px, que a 200px de ancho salen 0.57
      grados. Por eso las notas del margen apenas se ladean aunque sean
      cortas: son anchas.

   3. Un tope duro de 0.75 grados, para las cajas angostas, donde los otros
      dos frenos dejarían pasar ángulos absurdos. */
const HUECO_GIRO = 4, BRINCO_GIRO = 1.0, TOPE_GIRO = 0.75;
function asentarGiro(el, frac){
  const h = el.offsetHeight || 1, w = el.offsetWidth || 1;
  const grados = x => Math.asin(Math.min(1, x)) * 180 / Math.PI;
  const cabe = Math.min(TOPE_GIRO, grados(2 * HUECO_GIRO / h), grados(2 * BRINCO_GIRO / w));
  const giro = (parseFloat(frac) * cabe).toFixed(2);
  el.dataset.giro = giro;
  el.style.transform = 'rotate(' + giro + 'deg)';
}
function asentarGlosas(raiz){
  if (!raiz) return;
  for (const el of raiz.querySelectorAll('.gl[data-frac]')) asentarGiro(el, el.dataset.frac);
}

/* ---------- markup ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function glossHTML(m, cls, style){
  const tags = (m.etiquetas||[]).length ? '<span class="gl-tag">#' + esc(m.etiquetas.join(' #')) + '</span>' : '';
  const grado = (RES.get(m.id)||{}).grado;
  const senal = (grado && grado !== 'exacta' && grado !== 'cita') ? '≈' : '';
  const forma = formaOrganica(m);
  return '<div class="gl ' + cls + ' g-' + m.color + '" data-gl="' + m.id + '"' +
         ' data-frac="' + forma.frac + '"' +
         ' style="' + forma.css + (style || '') + '"><span class="gl-ref">' + senal +
         (REFS.get(m.id)||'') + '·</span>' + enlazar(m.nota) + tags + '</div>';
}
function verseHTML(k, withMarks, below){
  const it = plano[k], base = it.texto;
  const aqui = marcas.filter(m => m.cap===it.cap && m.vers===it.vers && visible(m) && RES.has(m.id));
  let inner;
  if (!withMarks || !aqui.length){
    inner = esc(base);
  } else {
    const cortes = new Set([0, base.length]);
    for (const m of aqui){ const r = RES.get(m.id); cortes.add(r.ini); cortes.add(r.fin); }
    const pts = [...cortes].filter(p => p>=0 && p<=base.length).sort((a,b)=>a-b);
    inner = '';
    for (let i = 0; i < pts.length-1; i++){
      const s = pts[i], e = pts[i+1], seg = esc(base.slice(s,e));
      const m = aqui.find(m => { const r = RES.get(m.id); return r.ini <= s && r.fin >= e; });
      if (!m){ inner += seg; continue; }
      const g = RES.get(m.id).grado;
      const cls = 'hl ' + (m.estilo==='fill'?'f-':'b-') + m.color +
                  (g === 'aprox' || g === 'versiculo' ? ' aprox' : '');
      inner += '<span class="' + cls + '">' + seg + '</span>';
    }
  }
  const tint = TINT_V.get(it.cap+':'+it.vers);
  let html = '';
  if (it.vers === 1) html += '<span class="cap">' + it.cap + '</span>';
  /* El contador de citas lleva clase "vn" a propósito: los recorredores de
     offsets saltan esa clase, así que no altera las posiciones del texto. */
  const nb = backDe(it.cap, it.vers).length;
  const marca = nb ? '<span class="vn back" data-back="' + it.cap + ':' + it.vers +
                     '" title="citado desde otras glosas">‹' + nb + '</span>' : '';
  html += '<span class="v" data-k="' + k + '"><span class="vn' + (tint ? ' vn-'+tint : '') + '">' +
          it.vers + '</span>' + marca + inner + ' </span>';
  if (below){
    for (const m of marcas)
      if (m.nota && visible(m) && m.cap===it.cap && m.vers===it.vers) html += glossHTML(m, 'gl-below');
  }
  return html;
}

/* ---------- paginación (sirve para 1, 2 o 3 columnas) ---------- */
function cabe(bodyEl, marca){
  const c = bodyEl.getBoundingClientRect();
  for (let i = marca; i < bodyEl.childNodes.length; i++){
    const n = bodyEl.childNodes[i];
    if (n.nodeType !== 1) continue;
    for (const r of n.getClientRects()){
      if (r.width < .5 && r.height < .5) continue;
      if (r.right > c.right + 1.5 || r.bottom > c.bottom + 1.5) return false;
    }
  }
  return true;
}
/* Con `hasta` se pintan exactamente esos versículos, sin medir: la hoja ya
   tiene decidido su contenido. Sin `hasta` se mide hasta que desborda, que
   es como se construye el mapa de hojas. */
function paginate(bodyEl, from, below, hasta){
  aplicarEstilo(bodyEl);
  bodyEl.innerHTML = '';
  const tope = hasta == null ? plano.length : hasta;
  let i = from;
  while (i < tope){
    const marca = bodyEl.childNodes.length;
    bodyEl.insertAdjacentHTML('beforeend', verseHTML(i, SPAN_MARKS, below));
    if (hasta == null && i > from && !cabe(bodyEl, marca)){
      while (bodyEl.childNodes.length > marca) bodyEl.removeChild(bodyEl.lastChild);
      break;
    }
    i++;
  }
  return Math.max(i, from+1);
}
const glosasEn = (a,b) => marcas.filter(m => m.nota && visible(m) && RES.has(m.id) &&
  plano.findIndex(p => p.cap===m.cap && p.vers===m.vers) >= a &&
  plano.findIndex(p => p.cap===m.cap && p.vers===m.vers) < b)
  .sort((x,y) => x.cap-y.cap || x.vers-y.vers);
/* En teléfono el margen NO se encoge: la hoja es más ancha que la pantalla a
   propósito, así que la columna de glosas conserva su ancho de tablet y se
   asoma corriendo el papel. Encogerla aquí sería justo el error que estamos
   evitando. */
const enTelefono = () => window.matchMedia('(max-width: 560px)').matches;
/* En teléfono el ancho lo manda el CSS, que es donde está escrito el acomodo
   de la hoja. Leerlo de ahí en vez de repetir el número evita justo lo que ya
   nos pasó una vez: dos sitios con la misma medida y uno que se queda atrás. */
const anchoGlosaCSS = () => {
  const v = parseFloat(getComputedStyle(pg).getPropertyValue('--col-glosa'));
  return Number.isFinite(v) && v > 0 ? v : 240;
};
const MARGIN_W = () => enTelefono() ? anchoGlosaCSS()
                     : stage.offsetWidth >= 560 ? 152
                     : stage.offsetWidth >= 420 ? 132 : 104;

function layoutInto(bodyEl, marginEl, footEl, from, hasta){
  const below = placement === 'below';
  const setM = o => { marginEl.style.setProperty('--mw', o?MARGIN_W()+'px':'0px');
                      marginEl.style.setProperty('--mgap', o?'11px':'0px'); };
  marginEl.innerHTML = ''; footEl.innerHTML = '';
  const out = n => ({ next:n, mw:marginEl.style.getPropertyValue('--mw'),
                      gap:marginEl.style.getPropertyValue('--mgap'),
                      marginHTML:marginEl.innerHTML, footHTML:footEl.innerHTML });
  const pie = (a, b) => {
    const gl = glosasEn(a, b), fc = columns >= 2 ? 2 : 1;
    return gl.length ? '<div class="foot-in" style="column-count:' + fc + ';--fcols:' + fc + '">' +
      gl.map(m => glossHTML(m,'gl-foot')).join('') + '</div>' : '';
  };
  if (below){ setM(false); return out(paginate(bodyEl, from, true, hasta)); }
  if (placement === 'foot'){
    setM(false);
    if (hasta != null){                       // la hoja ya sabe qué trae
      footEl.innerHTML = pie(from, hasta);
      return out(paginate(bodyEl, from, false, hasta));
    }
    let next = paginate(bodyEl, from, false);
    for (let p = 0; p < 4; p++){              // el pie ocupa alto y cambia qué cabe
      const html = pie(from, next);
      if (html === footEl.innerHTML) break;
      footEl.innerHTML = html;
      const otra = paginate(bodyEl, from, false);
      if (otra === next) break;
      next = otra;
    }
    return out(next);
  }
  /* El margen queda SIEMPRE abierto, tenga o no glosas esta hoja. El espacio
     en blanco no es desperdicio: es la promesa de que el texto no se va a
     mover cuando escribas la primera glosa de la página. Además así todas
     las hojas tienen la misma caja de texto y el ojo no brinca al pasar. */
  setM(true);
  const next = paginate(bodyEl, from, false, hasta);
  asentarGlosas(bodyEl); asentarGlosas(footEl);   /* las de "abajo" y las del pie */
  colocarMargen(bodyEl, marginEl);
  return out(next);
}

/* ============================================================
   MAPA DE HOJAS. Como en una Biblia de papel, cada versículo vive
   en una hoja concreta y siempre en la misma. Se calcula una vez
   para todo el libro, midiendo fuera de pantalla, y solo se rehace
   cuando cambia algo que afecta el acomodo (letra, columnas, ancho,
   dónde van las glosas, o las glosas mismas si estorban al texto).
   ============================================================ */
let paginas = [0], paginaActual = 0, paginasSucias = true;
function asegurarPaginas(){
  if (!paginasSucias) return;
  /* El molde se prepara con el ancho del PAPEL y con las mismas columnas que
     la hoja viva. Si midiera con el ancho de la ventana, contaría con una
     columna de texto más angosta, el texto le saldría más alto y cortaría las
     hojas antes de tiempo. */
  const med = medirHojaTelefono();
  const w = med ? (med.texto + med.hueco + med.glosa)
                : pg.offsetWidth;
  const h = pg.offsetHeight;
  prepararHoja(ghost, w, h);
  if (med) ghost.style.setProperty('--mx', '0px');
  /* PAGINACIÓN SINCRONIZADA. Cada hoja se corta donde quepa en TODAS las
     versiones, no solo en la que estás leyendo. Así la hoja 7 contiene los
     mismos versículos en la VBL y en la RVR1909, y cambiar de versión te
     deja mirando exactamente el mismo pasaje.
     El precio: en la versión de texto más corto sobra un poco de espacio al
     final de la hoja. Lo pago con gusto —es lo mismo que hacen las Biblias
     interlineales impresas. */
  const versiones = versionesSincronizables();
  const original = plano;
  paginas = [];
  let i = 0, guard = 0;
  while (i < original.length && guard++ < 20000){
    paginas.push(i);
    let corte = Infinity;
    for (const v of versiones){
      plano = (v === version) ? original : planoDe(v);
      const r = layoutInto(ghostBody, ghostMargin, ghostFoot, i);
      corte = Math.min(corte, r.next);
    }
    plano = original;
    if (!isFinite(corte) || corte <= i) break;
    i = corte;
  }
  if (!paginas.length) paginas = [0];
  paginasSucias = false;
}
const paginaDe = k => {
  let p = 0;
  while (p + 1 < paginas.length && paginas[p+1] <= k) p++;
  return p;
};
const finDe = p => (p + 1 < paginas.length ? paginas[p+1] : plano.length);
/* ¿Hay hoja de ese lado? La pregunta ya se hacía en tres sitios con la cuenta
   escrita a mano —al apagar el filo, al empezar el pliegue y al pasar la
   hoja— y la huella necesitaba hacerla una cuarta vez. Con la cuenta suelta,
   olvidarla es lo natural: es justo lo que pasó, y el síntoma fue una huella
   prometiendo un giro en un filo donde no hay a dónde ir. */
const hayHoja = s => s === 'right' ? paginaActual < paginas.length - 1
                                   : paginaActual > 0;
/* Libro, capítulo y versículo con los que ARRANCA la hoja */
const cabezaDe = k => {
  const it = plano[Math.min(Math.max(k,0), plano.length-1)];
  return it ? nombreDe(LIBRO) + '  ' + it.cap + ':' + it.vers : '';
};

/* ============================================================
   MEDIR SIN EL ZOOM PUESTO.

   La vista de lejos escala .pg-inner, y getBoundingClientRect devuelve las
   coordenadas YA escaladas. Todo lo que mide la hoja para colocar algo —dónde
   va cada nota del margen, dónde cae cada palabra para la foto del pliegue,
   qué rectángulos ocupan las marcas— compara esas medidas con altos de
   maquetación, que NO se escalan. Mezclar las dos escalas descoloca las notas
   y descompone la foto: por eso pasar hoja de lejos empezó siendo instantáneo.

   La solución no es corregir cada cuenta dividiendo por la escala —serían
   cinco sitios y el sexto que se olvide—, sino quitar el zoom un instante
   mientras se mide y devolverlo. Es exactamente lo que ya hace medirPalabras
   con las glosas torcidas: las endereza para medirlas en limpio y las vuelve a
   torcer. Nadie ve nada, porque entre lo uno y lo otro no hay repintado: el
   navegador solo pinta al final del cuadro, y aquí todo pasa dentro del mismo.
   ============================================================ */
function sinZoom(fn){
  const inner = zoomActivo ? pg.querySelector('.pg-inner') : null;
  if (!inner) return fn();
  inner.style.transform = 'none';
  try { return fn(); }
  finally { inner.style.removeProperty('transform'); }
}

function renderPage(){
  const r = sinZoom(renderPageCrudo);
  /* Los dos puntos de pasar hoja se apagan en las puntas del libro, y quien
     sabe si estamos en una punta es esto, que corre después de cada cambio de
     hoja venga de donde venga: del filo, del botón o de un salto. */
  if (zoomActivo) refrescarPasos();
  return r;
}
function renderPageCrudo(){
  resolverTodas(); recalcularRefs(); calcularVinculos();
  asegurarPaginas();
  paginaActual = Math.max(0, Math.min(paginaActual, paginas.length - 1));
  startIdx = paginas[paginaActual];
  nextIdx = finDe(paginaActual);
  prepararHoja(pg);
  reflejarTamano();
  $('pgCabeza').textContent = cabezaDe(startIdx);
  $('pgCabeza').title = 'Libros, glosas, formato y respaldo';
  $('pgVersion').textContent = D.versiones[version].abrev || version;
  $('pgVersion').title = 'Formato y versión · compilación ' + window.GLOSS_BUILD;
  /* La pestaña lleva solo el nombre de la aplicación. Le puse el libro un
     rato —'Gloss Bible · Marcos'— y estorba: el libro y el capítulo ya se
     leen en la esquina de la hoja, y en la pestaña solo hacían ruido. Si
     algún día abres varias hojas a la vez y quieres distinguirlas, se le
     agrega de vuelta ' · ' + nombreDe(LIBRO) aquí mismo. */
  document.title = 'Gloss Bible';
  const r = layoutInto(pgBody, pgMargin, pgFoot, startIdx, nextIdx);
  curMW = r.mw; curGap = r.gap;
  curMarginHTML = r.marginHTML; curFootHTML = r.footHTML;
  if (HL_API) aplicarHighlights();

  edgeL.classList.toggle('off', !hayHoja('left'));
  $('btnVolver').style.display = volverA == null ? 'none' : '';

  pintarFiltros(); pintarIndice(); invalidateSnapshot(); updateReadout();

/* ---------- rangos ---------- */
function nodoEn(root, off){
  let acc = 0, res = null;
  (function rec(n){
    if (res) return;
    if (n.nodeType===1 && n.classList && (n.classList.contains('vn')||n.classList.contains('cap'))) return;
    if (n.nodeType===3){
      if (off <= acc + n.nodeValue.length){ res = {node:n, offset:off-acc}; return; }
      acc += n.nodeValue.length; return;
    }
    for (const c of n.childNodes){ rec(c); if (res) return; }
  })(root);
  return res;
}
function rangoDe(m, bodyEl){
  bodyEl = bodyEl || pgBody;
  if (m.libro !== LIBRO) return null;
  const r = RES.get(m.id); if (!r) return null;
  const k = plano.findIndex(p => p.cap===m.cap && p.vers===m.vers);
  const el = bodyEl.querySelector('.v[data-k="'+k+'"]'); if (!el) return null;
  const a = nodoEn(el, r.ini), b = nodoEn(el, r.fin);
  if (!a || !b) return null;
  const rg = document.createRange();
  try { rg.setStart(a.node, a.offset); rg.setEnd(b.node, b.offset); } catch(e){ return null; }
  return rg;
}
function aplicarHighlights(){
  for (const c of COLORS){ CSS.highlights.delete('f-'+c); CSS.highlights.delete('b-'+c); }
  CSS.highlights.delete('aprox');
  const b = {}, dud = [];
  for (const m of marcas){
    if (!visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, pgBody); if (!rg) continue;
    const n = (m.estilo==='fill'?'f-':'b-') + m.color;
    (b[n] = b[n] || []).push(rg);
    const g = RES.get(m.id).grado;
    if (g === 'aprox' || g === 'versiculo') dud.push(rg.cloneRange());
  }
  for (const n in b) CSS.highlights.set(n, new Highlight(...b[n]));
  if (dud.length) CSS.highlights.set('aprox', new Highlight(...dud));
}
/* La escala del destello vive aquí arriba a la fuerza: el bloque de estilos
   de abajo la usa en el momento en que se carga la página, y un const no
   existe antes de su propia línea. Declararla después del uso no es un
   detalle de orden —es un ReferenceError que mata el script entero. */
const ESCALA = [.04, .09, .15, .22, .30, .38];

/* ENCENDER LA REFERENCIA ANTES DE SALTAR. Sube en rampa hasta el dorado
   pleno y solo entonces llama a lo que sigue. La curva es cuadrática por lo
   mismo que la del destello: el ojo lee el color por la raíz del pigmento, y
   una rampa lineal se ve como un escalón al principio y como nada al final.
   Al terminar se cede un cuadro más para que el último paso alcance a
   pintarse antes de que el cálculo congele todo. */
const DORADO = '184,137,43', TOPE_DORADO = .62, RAMPA = 260;
function pintarDorado(el, k){
  const a = (k * k * TOPE_DORADO).toFixed(3);
  el.style.backgroundColor = 'rgba(' + DORADO + ',' + a + ')';
  el.style.boxShadow = '0 0 0 3px rgba(' + DORADO + ',' + a + ')';
}
function apagar(el){ el.classList.remove('buscando'); el.style.backgroundColor = ''; el.style.boxShadow = ''; }
function encender(el, alLlegar){
  const t0 = performance.now();
  (function sube(ahora){
    const k = Math.min(1, (ahora - t0) / RAMPA);
    pintarDorado(el, k);
    if (k < 1) return requestAnimationFrame(sube);
    requestAnimationFrame(alLlegar);
  })(t0);
}
if (HL_API){
  const F = Object.fromEntries(COLORS.map(c => [c, lavado(c)]));
  const st = document.createElement('style');
  st.textContent = COLORS.map(c =>
    '::highlight(f-'+c+'){ background-color:'+F[c]+'; }\n'+
    '::highlight(b-'+c+'){ text-decoration:underline '+GRUESO_TRAZO+'px '+TRAZO_HEX[c]+';'+
    ' text-underline-offset:4px; text-decoration-skip-ink:none; }'
  ).join('\n') +
  '\n::highlight(aprox){ text-decoration:underline dotted 2px #b23a3a; text-underline-offset:4px; }' +
  /* Naranja, tres pulsos, y ya. Probamos el contorno pegado a las letras —se
     veía fantasmal— y el marco alrededor del versículo —se veía bien, pero
     pedía una capa de elementos encima de la hoja y medir rectángulos en cada
     salto—. Esto es un fondo y nada más: dos estados, un puñado de relojes.
     Lo único que hay que cuidar es que no se confunda con la marca naranja de
     abajo, y de eso se encarga el movimiento: la marca no late. */
  ESCALA.map((a, i) =>
    '\n::highlight(d' + i + '){ background-color:rgba(255,138,20,' + a + '); }').join('');
  document.head.appendChild(st);
}
/* UNA SOLA RESPIRACIÓN, NO TRES PARPADEOS.

   Lo que se leía como alarma era el encendido y apagado: algo que aparece de
   golpe tres veces es un foco, y un foco avisa de un peligro. Aquí no hay
   peligro, hay un "es aquí". Así que ahora el color SUBE, se queda un momento
   y se DISUELVE, sin pasar dos veces por el mismo sitio. Una respiración.

   La subida es rápida y la bajada es como el doble de lenta, que es como se
   comporta cualquier cosa que se desvanece de verdad —tinta secándose, una
   nota de piano— y por eso se siente orgánico y no mecánico. Y la escala de
   opacidades no es lineal sino cuadrática: el ojo percibe el color en
   proporción a la raíz del pigmento, así que pasos iguales de número se ven
   como saltos desiguales de brillo. */
let relojes = [];
function apagarDestello(){
  relojes.forEach(clearTimeout); relojes = [];
  if (HL_API) for (let i = 0; i < ESCALA.length; i++) CSS.highlights.delete('d' + i);
}
function resaltarSuave(rangos){
  if (!HL_API || !rangos || !rangos.length) return;
  apagarDestello();
  const marca = new Highlight(...rangos);
  const poner = n => {
    for (let i = 0; i < ESCALA.length; i++) CSS.highlights.delete('d' + i);
    if (n !== null) CSS.highlights.set('d' + n, marca);
  };
  /* TRES RESPIRACIONES. Aquí decía dos, y decía que tres eran un tic. Lo
     pedido son tres, y en uso hay una razón que la teoría no vio: llegar de un
     salto largo no es como encender una marca que ya sabías dónde estaba. El
     bonche de hojas termina de girar, los ojos aterrizan en cualquier parte de
     la hoja y para cuando encuentran el sitio ya iba la segunda. Con tres,
     todavía queda una por ver.
     Se pagan unos 900 ms más de destello, y ese es el costo real de la
     decisión: si alguna vez estorba, aquí es donde se baja el número.
     Entre una y otra NO se apaga: baja hasta el tinte más tenue y vuelve a
     subir. Apagarse del todo y volver a prender es parpadeo, y el parpadeo
     es lo que se lee como alarma. Bajar y subir es oleaje.
     El QUIETO se acorta un poco con el número de vueltas: tres mesetas del
     largo de las de antes se harían eternas, y lo que hace falta repetir es el
     pulso, no la pausa. */
  const guion = [];
  let t = 0;
  const VUELTAS = 3;
  const SUBE = 55, BAJA = 105, QUIETO = 340, ENTRE = 120;
  for (let vuelta = 0; vuelta < VUELTAS; vuelta++){
    /* la primera sube desde nada; las demás, desde el tinte que quedó */
    for (let i = (vuelta ? 1 : 0); i < ESCALA.length; i++){ guion.push([i, t]); t += SUBE; }
    t += QUIETO;
    const ultima = vuelta === VUELTAS - 1;
    const hasta = ultima ? -1 : 0;                    // la última baja hasta apagarse
    for (let i = ESCALA.length - 2; i > hasta; i--){ guion.push([i, t]); t += BAJA; }
    if (!ultima) t += ENTRE;                          // un respiro entre una y otra
  }
  guion.push([null, t]);
  for (const [n, cuando] of guion){
    if (cuando === 0) poner(n);
    else relojes.push(setTimeout(() => poner(n), cuando));
  }
}
function flash(m){
  const rg = rangoDe(m, pgBody);
  if (rg) resaltarSuave([rg]);
}

/* ---------- glosas al margen (centrado por grupo) ---------- */
const GAP = 9;   /* aire entre glosas del margen; con el giro actual las esquinas
                    apenas se asoman 0.9px, así que sobra de sobra */
function colocarMargen(bodyEl, marginEl){
  const mR = marginEl.getBoundingClientRect();
  if (mR.width < 8) return;
  const alto = marginEl.clientHeight, items = [];
  for (const m of marcas){
    if (!m.nota || !visible(m) || !RES.has(m.id)) continue;
    const rg = rangoDe(m, bodyEl); if (!rg) continue;
    const rects = rg.getClientRects(); if (!rects.length) continue;
    const d = document.createElement('div');
    d.className = 'gl gl-margin g-' + m.color; d.dataset.gl = m.id;
    d.innerHTML = glossHTML(m,'x').replace(/^<div[^>]*>|<\/div>$/g,'');
    const forma = formaOrganica(m);          /* la misma forma que tendría en cualquier otro sitio */
    d.style.cssText = forma.css;
    d.style.top = '0px'; marginEl.appendChild(d);
    asentarGiro(d, forma.frac);              /* ya está en el papel: ya se puede medir su alto */
    items.push({ m, el:d, h:d.offsetHeight, deseo: rects[0].top + rects[0].height/2 - mR.top });
  }
  if (!items.length) return;
  items.sort((a,b) => a.deseo - b.deseo);
  let cl = items.map(it => ({items:[it], n:1, suma:it.deseo, centro:it.deseo, h:it.h}));
  let cambio = true, guard = 0;
  while (cambio && guard++ < 300){
    cambio = false;
    for (let i = 0; i < cl.length-1; i++){
      if (cl[i].centro + cl[i].h/2 + GAP > cl[i+1].centro - cl[i+1].h/2){
        const a = cl[i], b = cl[i+1];
        const m = {items:a.items.concat(b.items), n:a.n+b.n, suma:a.suma+b.suma, h:a.h+b.h+GAP};
        m.centro = m.suma/m.n; cl.splice(i,2,m); cambio = true; break;
      }
    }
    if (cambio) continue;
    for (const c of cl){
      if (c.h >= alto){ if (Math.abs(c.centro-alto/2)>.5){ c.centro = alto/2; cambio = true; } continue; }
      const t = c.centro-c.h/2, b = c.centro+c.h/2;
      if (t < 0){ c.centro -= t; cambio = true; } else if (b > alto){ c.centro -= (b-alto); cambio = true; }
    }
  }
  for (const c of cl){ let y = c.centro-c.h/2; for (const it of c.items){ it.el.style.top = Math.round(y)+'px'; y += it.h+GAP; } }
}

/* ---------- selección y toque ---------- */
function offsetGlobal(node, off){
  const el = node.nodeType===3 ? node.parentElement : node;
  const v = el && el.closest ? el.closest('.v') : null;
  if (!v) return null;
  /* Si el punto cae dentro del número, se pega al arranque del versículo en
     vez de rendirse. user-select:none evita el caso común —el doble clic— pero
     no todos: seleccionar todo, arrastrar desde el versículo anterior o algún
     navegador que lo ignore. Y devolver null aquí no fallaba con un aviso:
     fallaba en silencio, que es la peor manera. Redondear hacia el primer
     carácter del texto es lo que el usuario quiso decir de todos modos. */
  if (el.closest('.vn, .cap')) return { k:+v.dataset.k, off:0 };
  let acc = 0, out = null;
  (function rec(n){
    if (out !== null) return;
    if (n.nodeType===1 && n.classList && (n.classList.contains('vn')||n.classList.contains('cap'))) return;
    if (n === node && n.nodeType===3){ out = acc+off; return; }
    if (n.nodeType===3){ acc += n.nodeValue.length; return; }
    for (const c of n.childNodes){ rec(c); if (out !== null) return; }
  })(v);
  return out === null ? null : { k:+v.dataset.k, off:out };
}
function puntoA(x,y){
  let p = null;
  if (document.caretPositionFromPoint){ const q = document.caretPositionFromPoint(x,y); if (q) p={node:q.offsetNode,offset:q.offset}; }
  else if (document.caretRangeFromPoint){ const q = document.caretRangeFromPoint(x,y); if (q) p={node:q.startContainer,offset:q.startOffset}; }
  return p ? offsetGlobal(p.node, p.offset) : null;
}
function marcaEn(k, off){
  const it = plano[k];
  return marcas.find(m => m.cap===it.cap && m.vers===it.vers && visible(m) &&
    RES.has(m.id) && off >= RES.get(m.id).ini && off < RES.get(m.id).fin);
}
/* ============================================================
   MENÚ CONTEXTUAL. Sin modos: primero señalas, luego dices qué.
   Un toque nunca muta nada por sí solo — abre opciones y se cierra
   tocando afuera. La última acción usada queda al frente para que
   marcar en tanda sea "arrastra y toca el mismo botón de siempre".
   ============================================================ */
const menu = $('menu');
const ACC = { fill:{t:'Resaltar', ic:'▮'}, border:{t:'Línea', ic:'▁'}, nota:{t:'Glosa', ic:'✎'} };
let pendiente = null, menuMarca = null, ultimaAccion = 'fill';
let ultimoBorrado = null, tempDeshacer = null;

let ultimoRect = null;
function ocultarMenu(){ menu.style.display='none'; pendiente=null; menuMarca=null; ultimoRect=null; }
function mostrarMenu(html, rect){
  if (rect) ultimoRect = rect;
  menu.innerHTML = html;
  menu.style.display = 'flex';
  const r = ultimoRect || {left:0,top:0,width:0,height:0,bottom:0};
  const s = stage.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
  let x = r.left - s.left + r.width/2 - w/2;
  let y = r.top - s.top - h - 8;
  if (y < 2) y = r.bottom - s.top + 8;
  menu.style.left = Math.round(Math.min(Math.max(x, 2), s.width - w - 2)) + 'px';
  menu.style.top  = Math.round(Math.min(Math.max(y, 2), s.height - h - 2)) + 'px';
}
function menuSeleccion(){
  const orden = [ultimaAccion, ...Object.keys(ACC).filter(a => a !== ultimaAccion)];
  return '<div class="macciones">' +
         orden.map((a,i) => '<button class="' + (i?'':'primera') + '" data-acc="' + a + '">' +
         ACC[a].ic + ' ' + ACC[a].t + '</button>').join('') +
         '<button data-acc="copiar" title="Copiar">⧉</button></div>';
}
function menuDeMarca(m){
  /* Los colores van dentro de su propia caja y las acciones dentro de otra.
     Antes eran todos hermanos sueltos, y así el menú solo sabía ponerse en
     una fila: en vertical los colores se habrían apilado uno debajo de otro,
     que es justo lo que no se quiere. Con las dos cajas, el teléfono los pone
     en un renglón arriba y las acciones en columna debajo, y el escritorio
     los sigue viendo en una sola fila. */
  return '<div class="mcolores">' +
         COLORS.map(c => '<button class="mc" data-color="' + c + '" style="background:' +
           LINE_HEX[c] + '"' + (m.color===c ? ' data-on="1"' : '') + '></button>').join('') +
         '</div><div class="macciones">' +
         '<button data-acc="estilo">' + (m.estilo==='fill' ? '▁ Línea' : '▮ Relleno') + '</button>' +
         '<button data-acc="nota">✎ Glosa</button>' +
         '<button data-acc="tags" title="Etiquetas">#' +
           ((m.etiquetas||[]).length ? ' ' + m.etiquetas.length : '') + '</button>' +
         '<button class="quitar" data-acc="quitar" title="Quitar">✕</button></div>';
}
/* Panel de etiquetas de UNA marca: se prenden y apagan sin cerrar el menú,
   porque casi siempre pones dos o tres de un tirón. */
function menuEtiquetas(m){
  const tiene = new Set(m.etiquetas || []);
  const lista = [...new Set([...todasEtiquetas().mapa.keys(), ...tiene])].sort();
  return '<div class="tagbox">' +
    (lista.length
      ? lista.map(t => '<button class="tg' + (tiene.has(t)?' on':'') + '" data-tag="' +
          esc(t) + '">' + esc(t) + '</button>').join('')
      : '<span class="vacio">sin etiquetas todavía</span>') +
    '<input id="tagNueva" placeholder="nueva…" />' +
    '<button data-acc="listo">Listo</button></div>';
}
function avisarBorrado(m){
  ultimoBorrado = m;
  const d = $('deshacer'); d.style.display = 'flex';
  clearTimeout(tempDeshacer);
  tempDeshacer = setTimeout(() => { d.style.display='none'; ultimoBorrado=null; }, 7000);
}
$('btnDeshacer').onclick = () => {
  if (!ultimoBorrado) return;
  marcas.push(ultimoBorrado); ultimoBorrado = null;
  $('deshacer').style.display = 'none'; save(); renderPage();
};

pgBody.addEventListener('pointerup', ev => {
  if (ev.target.tagName === 'TEXTAREA') return;
  if (ev.target.closest('.gl')) return;   // las glosas de "abajo" viven aquí dentro
  setTimeout(() => {
    const sel = window.getSelection();
    const arrastre = sel && !sel.isCollapsed && sel.toString().trim().length > 0;
    if (arrastre){
      const a = offsetGlobal(sel.anchorNode, sel.anchorOffset);
      const b = offsetGlobal(sel.focusNode, sel.focusOffset);
      if (a && b && a.k === b.k && a.off !== b.off){
        const it = plano[a.k];
        menuMarca = null;
        pendiente = { k:a.k, cap:it.cap, vers:it.vers,
                      ini:Math.min(a.off,b.off), fin:Math.max(a.off,b.off) };
        mostrarMenu(menuSeleccion(), sel.getRangeAt(0).getBoundingClientRect());
      } else if (a && b && a.k !== b.k){
        readout.textContent = 'por ahora una marca no puede cruzar de versículo';
        ocultarMenu();
      }
      return;
    }
    const p = puntoA(ev.clientX, ev.clientY);
    const m = p && marcaEn(p.k, p.off);
    if (!m){ ocultarMenu(); return; }
    pendiente = null; menuMarca = m;
    const rg = rangoDe(m, pgBody);
    mostrarMenu(menuDeMarca(m), rg ? rg.getBoundingClientRect()
      : { left:ev.clientX, top:ev.clientY, width:0, height:0, bottom:ev.clientY });
  }, 0);
});

menu.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  ev.preventDefault();

  if (b.dataset.color && menuMarca){
    menuMarca.color = b.dataset.color; reanclar(menuMarca);
    save(); ocultarMenu(); renderPage(); return;
  }
  /* prender/apagar una etiqueta: el panel se queda abierto */
  if (b.dataset.tag && menuMarca){
    const t = b.dataset.tag, actuales = menuMarca.etiquetas || [];
    menuMarca.etiquetas = actuales.includes(t) ? actuales.filter(x => x !== t) : actuales.concat(t);
    save(); renderPage();
    mostrarMenu(menuEtiquetas(menuMarca));
    return;
  }
  if (b.dataset.ir){
    const [c, v, l] = b.dataset.ir.split(':');
    irA(LIBRO, +c, +v, l || ''); return;
  }
  const acc = b.dataset.acc;
  if (acc === 'tags' && menuMarca){ mostrarMenu(menuEtiquetas(menuMarca)); return; }
  if (acc === 'listo'){ ocultarMenu(); return; }

  if (pendiente){
    if (acc === 'copiar'){
      const t = window.getSelection().toString();
      if (navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
      ocultarMenu(); return;
    }
    const { cap, vers, ini, fin } = pendiente;
    marcas = marcas.filter(m => !(m.libro===LIBRO && m.cap===cap && m.vers===vers && RES.has(m.id) &&
      ini < RES.get(m.id).fin && fin > RES.get(m.id).ini));
    const nueva = crearMarca(cap, vers, ini, fin);
    if (acc === 'border') nueva.estilo = 'border';
    marcas.push(nueva);
    ultimaAccion = acc;
    save();
    window.getSelection().removeAllRanges();
    ocultarMenu(); renderPage();
    if (acc === 'nota') abrirGlosa(nueva);
    return;
  }

  if (menuMarca){
    const m = menuMarca;
    if (acc === 'estilo'){
      m.estilo = m.estilo === 'fill' ? 'border' : 'fill';
      reanclar(m); save(); ocultarMenu(); renderPage();
    } else if (acc === 'nota'){
      ocultarMenu(); abrirGlosa(m);
    } else if (acc === 'quitar'){
      marcas = marcas.filter(x => x !== m);
      save(); avisarBorrado(m); ocultarMenu(); renderPage();
    }
  }
});
document.addEventListener('pointerdown', ev => {
  if (!ev.target.closest('#menu')) ocultarMenu();
}, true);
/* etiqueta nueva desde el propio panel */
menu.addEventListener('keydown', ev => {
  if (ev.target.id !== 'tagNueva' || ev.key !== 'Enter' || !menuMarca) return;
  ev.preventDefault();
  const t = ev.target.value.trim(); if (!t) return;
  const actuales = menuMarca.etiquetas || [];
  if (!actuales.includes(t)) menuMarca.etiquetas = actuales.concat(t);
  save(); renderPage();
  mostrarMenu(menuEtiquetas(menuMarca));
});
/* ============================================================
   NAVEGACIÓN POR VÍNCULOS. Saltar apila la hoja de origen, así que
   "volver por donde viniste" es el borde izquierdo de siempre: uno
   solo e inequívoco, porque es tu recorrido y no una lista derivada.
   ============================================================ */
/* Dónde estoy parado, en términos que sobreviven a un cambio de libro. */
function puntoActual(){
  const p = plano[Math.min(Math.max(paginas[paginaActual]||0,0), plano.length-1)];
  return { libro: LIBRO, hoja: paginaActual, ref: p ? {cap:p.cap, vers:p.vers} : {cap:1, vers:1} };
}
function irA(libro, cap, vers, letra){
  /* Cruzar a otro libro. Esto estaba prohibido de cuando los datos eran solo
     Marcos: cualquier referencia a otro libro se rechazaba con "ese libro
     todavía no está en estos datos", aunque estuviera. Ahora solo se rechaza
     si de verdad no está, y si está, se salta como desde el menú de libros. */
  if (libro !== LIBRO){
    if (!D.versiones[version].texto[libro]){
      readout.textContent = 'ese libro no está en los datos cargados';
      return;
    }
    if (!versoTexto(version, cap, vers, libro)){
      readout.textContent = 'referencia fuera de rango: ' + nombreDe(libro) + ' ' + cap + ':' + vers;
      return;
    }
    ocultarMenu();
    saltarA(libro, cap, vers, puntoActual());
    return;
  }
  const k = plano.findIndex(p => p.cap === cap && p.vers === vers);
  if (k < 0){ readout.textContent = 'referencia fuera de rango: ' + cap + ':' + vers; return; }
  ocultarMenu();
  /* Al rastro. Va DESPUÉS de las dos comprobaciones de arriba a propósito: una
     referencia que no lleva a ningún sitio no es un pasaje que hayas visto, y
     apuntarla dejaría el historial lleno de callejones. También se apunta
     cuando el versículo ya está en esta hoja: preguntaste por él igual. */
  apuntarVisto(libro, cap, vers);
  const destino = paginaDe(k);
  if (destino === paginaActual){ destacar(cap, vers, letra); return; }
  volverA = puntoActual();                  // de dónde veníamos, para el botón de regreso
  animarSalto(destino, () => destacar(cap, vers, letra));
}
/* Al llegar, parpadea lo que buscabas: la glosa concreta si la referencia
   traía letra, si no el versículo entero. */
function destacar(cap, vers, letra){
  if (!HL_API) return;
  let rangos = [];
  if (letra){
    const objetivo = marcas.find(m => m.cap===cap && m.vers===vers && visible(m) &&
                                      RES.has(m.id) && (REFS.get(m.id)||'') === vers + letra);
    if (objetivo){ const r = rangoDe(objetivo, pgBody); if (r) rangos = [r]; }
  }
  if (!rangos.length){
    const k = plano.findIndex(p => p.cap===cap && p.vers===vers);
    const el = pgBody.querySelector('.v[data-k="' + k + '"]');
    if (el){ const r = document.createRange(); r.selectNodeContents(el); rangos = [r]; }
  }
  resaltarSuave(rangos);
}
/* Quién cita este versículo. Nunca "el" regreso: todos, y tú eliges. */
function menuVinculos(cap, vers){
  return '<div class="tagbox"><span class="vacio">citado desde</span>' +
    backDe(cap, vers).map(m => '<button data-ir="' + m.cap + ':' + m.vers + ':' +
      (REFS.get(m.id)||'').replace(/^\d+/,'') + '">' +
      m.cap + ':' + (REFS.get(m.id) || m.vers) + ' · ' +
      esc(m.nota.slice(0,24)) + (m.nota.length > 24 ? '…' : '') + '</button>').join('') +
    '</div>';
}
/* Un clic en una referencia salta; un clic en el contador abre la lista. */
[pgMargin, pgFoot, pgBody].forEach(el => el.addEventListener('click', ev => {
  const r = ev.target.closest('.ref');
  if (r && !r.classList.contains('muerta')){
    ev.preventDefault(); ev.stopPropagation();
    const [lib, c, v, letra] = r.dataset.ref.split(':');
    /* Ceder DOS cuadros antes de calcular. Uno solo no basta: el navegador
       necesita uno para aplicar la clase y calcular estilos, y otro para
       pintarlos. Si se llama a irA() de corrido, el hilo se bloquea con la
       paginación y el latido nunca llega a verse —el aviso existiría en el
       DOM y en la pantalla no aparecería jamás. */
    r.classList.add('buscando');
    readout.textContent = 'buscando ' + nombreDe(lib) + ' ' + c + ':' + v + '…';
    encender(r, () => {
      try { irA(lib, +c, +v, letra || ''); }
      finally { apagar(r); }
    });
    return;
  }
  if (r){ readout.textContent = 'esa referencia no está en los datos cargados'; return; }
  const b = ev.target.closest('.back');
  if (b){
    ev.preventDefault(); ev.stopPropagation();
    const [c, v] = b.dataset.back.split(':').map(Number);
    pendiente = null; menuMarca = null;
    mostrarMenu(menuVinculos(c, v), b.getBoundingClientRect());
  }
}, true));

/* Un clic sobre la glosa hace parpadear su marca en el texto; dos clics
   la abren para editar. El parpadeo espera un momento por si viene el
   segundo clic, para no encender y apagar antes de abrir el editor. */
const glosaDe = ev => {
  const d = ev.target.closest('.gl');
  return d ? marcas.find(x => x.id === d.dataset.gl) : null;
};
let esperaTap = null;
function clicGlosa(ev){
  const m = glosaDe(ev); if (!m) return;
  ev.preventDefault();
  clearTimeout(esperaTap);
  esperaTap = setTimeout(() => flash(m), 210);
}
function dobleGlosa(ev){
  const m = glosaDe(ev); if (!m) return;
  ev.preventDefault();
  clearTimeout(esperaTap);
  apagarDestello();
  abrirGlosa(m);
}
[pgMargin, pgFoot, pgBody].forEach(el => {
  el.addEventListener('click', clicGlosa);
  el.addEventListener('dblclick', dobleGlosa);
});

/* El recuadro de edición se viste como la glosa que está reemplazando. Se
   deriva de las mismas tablas en vez de repetir los valores: así estaba antes
   y se había quedado con las alfas viejas sin que nadie lo notara. */
const TEXTO_HEX = {yellow:'#6d5410', green:'#235c31', blue:'#0f4b6b', orange:'#6e3406'};
const TINT = Object.fromEntries(COLORS.map(c =>
  [c, [LINE_HEX[c], 'rgba(' + FILL_RGB[c] + ',' + (FILL_ALFA[c]*.42).toFixed(2) + ')', TEXTO_HEX[c]]]));
function abrirGlosa(m){
  /* El repintado solo hace falta para los caminos que colocan el recuadro
     DENTRO de la hoja: necesitan que el margen esté recién armado para saber
     dónde va. El de teléfono lo cuelga del cuerpo del documento y no mide
     nada de la hoja, así que aquí solo estorba —y estorba en el peor sitio,
     entre el dedo y el foco: en un teléfono el teclado solo sube si el foco
     ocurre dentro del gesto que lo pidió, y cuanto más trabajo se mete en
     medio, más ocasiones hay de perder ese hilo. */
  if (!enTelefono()) renderPage();
  const ta = document.createElement('textarea');
  const [bd,bg,fg] = TINT[m.color];
  ta.className='gl-edit'; ta.style.border='1px dashed '+bd; ta.style.background=bg; ta.style.color=fg;
  ta.rows=3; ta.value=m.nota||''; ta.placeholder='glosa…';
  /* EN TELÉFONO EL EDITOR NO VA DONDE VA LA GLOSA. Iba a la altura de su
     marca, y eso funciona en una pantalla grande pero no aquí: en cuanto sale
     el teclado se come la mitad de abajo, así que toda marca de la mitad
     inferior abría su recuadro justo detrás. Medido a 390x844 con un teclado
     de los normales: una marca a y=458 abría el editor en 456..519, y el
     teclado empieza hacia 460.
     Ese fue el error de la vez pasada: llevar la hoja al tope arregló que se
     saliera por la derecha, pero el problema de verdad no era horizontal.
     Ahora el editor se despega de la hoja y se ancla arriba del todo, que es
     el único sitio de la pantalla donde el teclado no llega nunca, mida lo que
     mida. Va en el cuerpo del documento y no dentro de la hoja para que
     arrastrar el papel no se lo lleve, y para que renderPage —que rehace el
     margen entero— no lo borre a media escritura.
     Lleva su propio botón de listo porque en un teléfono no siempre hay dónde
     tocar para quitar el foco: el texto se guarda al perderlo, y sin una
     salida clara eso se convierte en adivinar. */
  if (enTelefono()){
    for (const raiz of [pgMargin, pgFoot, pgBody]){
      const viejo = raiz.querySelector('.gl[data-gl="'+m.id+'"]');
      if (viejo) viejo.remove();
    }
    const caja = document.createElement('div');
    caja.className = 'gl-movil';
    caja.style.background = colorPapel();
    ta.style.width = '100%';
    /* La nota se escribe del tamaño con el que se va a leer. Se pone aquí y no
       en el CSS porque la caja cuelga del cuerpo del documento, fuera de la
       hoja, así que no hereda su --fs. */
    ta.style.fontSize = fontSize + 'px';
    const listo = document.createElement('button');
    listo.className = 'btn'; listo.textContent = 'listo';
    listo.style.fontSize = Math.max(14, fontSize - 2) + 'px';
    listo.addEventListener('click', () => ta.blur());
    caja.appendChild(ta); caja.appendChild(listo);
    document.body.appendChild(caja);
    ta.dataset.caja = '1';
  } else if (placement === 'margin'){
    const viejo = pgMargin.querySelector('.gl[data-gl="'+m.id+'"]');
    const rg = rangoDe(m, pgBody), rects = rg && rg.getClientRects();
    if (!rects || !rects.length) return;
    const top = viejo ? parseFloat(viejo.style.top)
              : Math.round(rects[0].top - pgMargin.getBoundingClientRect().top - 2);
    if (viejo) viejo.remove();
    ta.style.position='absolute'; ta.style.left='0'; ta.style.width='100%'; ta.style.top=top+'px';
    pgMargin.appendChild(ta);
  } else if (placement === 'foot'){
    const viejo = pgFoot.querySelector('.gl[data-gl="'+m.id+'"]');
    ta.style.width='100%'; ta.style.margin='0 0 4px 0';
    if (viejo) viejo.replaceWith(ta); else pgFoot.appendChild(ta);
  } else {
    const k = plano.findIndex(p => p.cap===m.cap && p.vers===m.vers);
    const v = pgBody.querySelector('.v[data-k="'+k+'"]'); if (!v) return;
    const viejo = pgBody.querySelector('.gl[data-gl="'+m.id+'"]');
    ta.style.margin='5px 0 7px 14px'; ta.style.width='calc(100% - 14px)';
    if (viejo) viejo.replaceWith(ta); else v.after(ta);
  }
  ta.focus();
  ta.addEventListener('blur', () => {
    const val = ta.value.trim();
    if (val){
      m.nota = val;
      if (etiquetaActiva && !(m.etiquetas||[]).includes(etiquetaActiva))
        m.etiquetas = (m.etiquetas||[]).concat(etiquetaActiva);
    } else delete m.nota;
    if (ta.dataset.caja && ta.parentElement) ta.parentElement.remove();
    save(); renderPage();
  });
}

/* ---------- etiquetas ---------- */
/* Las etiquetas viven en la marca, no en la glosa: así puedes filtrar
   también resaltados que todavía no tienen nada escrito. */
function todasEtiquetas(){
  const s = new Map();
  let sin = 0;
  for (const m of marcas){
    const t = m.etiquetas || [];
    if (!t.length) sin++;
    for (const x of t) s.set(x, (s.get(x)||0)+1);
  }
  return { mapa: s, sin };
}
/* El menú de libros del chip: solo los que de verdad tienen glosas, porque
   ofrecer los 66 obligaría a buscar entre libros vacíos. Y solo los que aún
   no están en el filtro. */
function menuDeLibros(rect){
  const conGlosas = new Map();
  for (const m of marcas)
    if (m.nota && m.libro !== LIBRO && !librosFiltro.has(m.libro))
      conGlosas.set(m.libro, (conGlosas.get(m.libro) || 0) + 1);
  if (!conGlosas.size){
    readout.textContent = 'no hay glosas en otros libros';
    return;
  }
  const orden = [...conGlosas.keys()].sort((a,b) =>
    CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b));
  mostrarMenu(orden.map(id =>
    '<button class="mi" data-libfil="' + id + '">' + esc(nombreDe(id)) +
    '<span class="n">' + conGlosas.get(id) + '</span></button>').join(''), rect);
}

function pintarFiltros(){
  const cont = $('filtros');
  cont.querySelectorAll('.chip').forEach(c => c.remove());
  const { mapa, sin } = todasEtiquetas();
  const add = (nombre, n) => {
    const b = document.createElement('span');
    b.className = 'chip' + (etiquetasOcultas.has(nombre) ? ' off' : '');
    b.innerHTML = esc(nombre) + '<span class="n">' + n + '</span>';
    b.onclick = () => { etiquetasOcultas.has(nombre) ? etiquetasOcultas.delete(nombre) : etiquetasOcultas.add(nombre); renderPage(); };
    cont.appendChild(b);
  };
  [...mapa.entries()].sort().forEach(([k,v]) => add(k,v));
  if (sin) add('(sin etiqueta)', sin);

  /* LOS CHIPS DE LIBRO. Los de etiqueta se APAGAN al tocarlos —están todos
     desde el principio y tú vas quitando—; éstos se AGREGAN, porque los libros
     son 66 y ponerlos todos sería una pared. Por eso el chip "+ libro" no
     desaparece nunca: sigue ahí para sumar el siguiente. */
  for (const id of [...librosFiltro].sort((a,b) => CANON.findIndex(x=>x.id===a) - CANON.findIndex(x=>x.id===b))){
    const n = marcas.filter(m => m.nota && m.libro === id).length;
    const b = document.createElement('span');
    b.className = 'chip chip-libro';
    b.innerHTML = esc(nombreDe(id)) + '<span class="n">' + n + '</span><span class="x">×</span>';
    b.title = 'Quitar ' + nombreDe(id) + ' de la lista';
    b.onclick = () => { librosFiltro.delete(id); pintarFiltros(); pintarIndice(); };
    cont.appendChild(b);
  }
  const mas = document.createElement('span');
  mas.className = 'chip chip-mas';
  mas.textContent = '+ libro';
  mas.title = 'Sumar a la lista las glosas de otro libro';
  mas.onclick = ev => { ev.stopPropagation(); menuDeLibros(mas.getBoundingClientRect()); };
  cont.appendChild(mas);
  const sel = $('selActiva'), previo = etiquetaActiva;
  sel.innerHTML = '<option value="">— ninguna —</option>' +
    [...mapa.keys()].sort().map(k => '<option>'+esc(k)+'</option>').join('');
  sel.value = previo;
  $('banda').classList.toggle('apagada', !etiquetaActiva);
  pintarDias();
}
/* ============================================================
   POR DÍA. La fecha se queda como campo, no como etiqueta: si cada
   día fuera un chip, a los seis meses habría ciento ochenta chips
   revueltos con "estudio". Aquí tiene su propio control, y sirve de
   rescate para cuando se te olvidó prender la banda.
   ============================================================ */
function pintarDias(){
  const cuenta = new Map();
  for (const m of marcas) cuenta.set(diaDe(m), (cuenta.get(diaDe(m))||0) + 1);
  if (diaFiltro && !cuenta.has(diaFiltro)) diaFiltro = '';
  const sel = $('selDia');
  sel.innerHTML = '<option value="">todos los días</option>' +
    [...cuenta.keys()].sort().reverse()
      .map(d => '<option value="'+esc(d)+'">'+esc(d)+' ('+cuenta.get(d)+')</option>').join('');
  sel.value = diaFiltro;
  const btn = $('btnEtiquetarDia');
  btn.disabled = !diaFiltro || !etiquetaActiva;
  btn.textContent = (diaFiltro && etiquetaActiva) ? 'etiquetar «' + etiquetaActiva + '»' : 'etiquetar';
  btn.title = !etiquetaActiva ? 'Elige primero una etiqueta activa arriba'
            : (!diaFiltro ? 'Elige primero un día' : '');
}
$('selDia').onchange = e => { diaFiltro = e.target.value; renderPage(); };
$('btnEtiquetarDia').onclick = () => {
  if (!diaFiltro || !etiquetaActiva) return;
  let n = 0;
  for (const m of marcas){
    if (diaDe(m) !== diaFiltro) continue;
    const t = m.etiquetas || [];
    if (!t.includes(etiquetaActiva)){ m.etiquetas = t.concat(etiquetaActiva); n++; }
  }
  save(); renderPage();
  readout.textContent = n
    ? n + ' marca(s) de ' + diaFiltro + ' etiquetadas como «' + etiquetaActiva + '»'
    : 'todas las de ' + diaFiltro + ' ya tenían esa etiqueta';
};
$('selActiva').onchange = e => { etiquetaActiva = e.target.value; pintarFiltros(); updateReadout(); };
$('nuevaEtiqueta').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v) return;
  etiquetaActiva = v; e.target.value = '';
  const sel = $('selActiva');
  if (![...sel.options].some(o => o.value === v)) sel.add(new Option(v, v));
  sel.value = v; pintarFiltros(); updateReadout();
});

/* ---------- fotos y pliegue ---------- */
let pageImg=null, nextImg=null, prevImg=null, pend=false, folding=false;
let snapFirma = null;
const snapStale = () => (snapFirma !== estiloFirma());
function invalidateSnapshot(){
  pageImg = nextImg = prevImg = null;
  if (pend) return; pend = true;
  setTimeout(() => { pend = false; makeSnapshot(); }, 0);
}
/* ============================================================
   LA FOTO, POR MEDICIÓN Y NO POR RECOMPOSICIÓN.
   Igualar ajustes entre la hoja viva y el SVG nunca alcanzó: son dos
   motores de composición y cada uno decide por su cuenta dónde parte el
   renglón. Así que ya no se le pide al SVG que componga texto —solo pinta
   papel, recuadros y bordes— y cada palabra se dibuja en el lienzo en la
   coordenada exacta donde el navegador la puso en la hoja real.
   Coincide por construcción, no por coincidencia.
   ============================================================ */
function medirPalabras(hostEl){
  const host = hostEl.getBoundingClientRect();
  const salida = [];
  /* Las glosas van torcidas, y un rectángulo de texto girado devuelve su caja
     envolvente, no su posición real: medir así dejaría las letras corridas.
     Se enderezan un instante para medirlas en limpio, se apunta el ángulo y el
     centro de giro de cada una, y al final se devuelven a su sitio. El lienzo
     rehace el giro palabra por palabra. Nadie ve nada: no hay repintado entre
     el enderezado y el restablecido, todo pasa dentro del mismo cuadro. */
  const torcidas = [];
  for (const el of hostEl.querySelectorAll('[data-giro]')){
    torcidas.push({ el:el, previo:el.style.transform });
    el.style.transform = 'none';
  }
  const eje = new Map();
  for (const t of torcidas){
    const r = t.el.getBoundingClientRect();
    eje.set(t.el, { a: parseFloat(t.el.dataset.giro || 0) * Math.PI / 180,
                    gx: r.left - host.left + r.width/2,
                    gy: r.top  - host.top  + r.height/2 });
  }
  const paseo = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT);
  const rango = document.createRange();
  let n;
  while ((n = paseo.nextNode())){
    if (!n.nodeValue.trim()) continue;
    const el = n.parentElement;
    if (!el || el.offsetParent === null && el.closest('#ghost') === null) continue;
    const est = getComputedStyle(el);
    if (est.visibility === 'hidden' || est.display === 'none') continue;
    /* El lienzo sí sabe de espaciado entre letras y de variantes numéricas,
       pero hay que pasárselos aparte: no viajan en la abreviatura de font. */
    const esp = est.letterSpacing === 'normal' ? '0px' : est.letterSpacing;
    /* Y las VERSALITAS, por dos caminos a la vez. Los titulillos se componen
       con font-variant-caps, y sin pasársela el lienzo mediría "Mateo 5:12" en
       capitales de altura de equis y lo pintaría en caja alta y baja, así que
       el ajuste de ancho de más abajo lo aplastaría para que cupiera: un
       titulillo estrujado durante el giro y el bueno al aterrizar, que es el
       brinco que este archivo lleva media docena de comentarios evitando.

       DOS CAMINOS Y NO UNO, y esto lo encontró la revisión de Codex. La
       propiedad ctx.fontVariantCaps es reciente; hay navegadores que entienden
       font-variant-caps en el CSS —así que la hoja SÍ sale en versalitas— y no
       conocen la propiedad del lienzo. Ahí preguntar y rendirse dejaba
       exactamente el defecto que se vino a arreglar, solo que en los
       navegadores que nadie prueba.
       Así que la variante viaja también en la ABREVIATURA de font, que admite
       small-caps desde CSS2 y la entiende todo el mundo. Comprobado que dan lo
       mismo: 99.58px por la propiedad y 99.58px por la abreviatura.
       El orden es el que manda CSS —estilo, variante, peso, tamaño, familia—
       y f0 guarda la misma cadena sin la variante, para lo de abajo. */
    const vers = est.fontVariantCaps || 'normal';
    const versalitas = (vers === 'small-caps' || vers === 'all-small-caps');
    const cola = ' ' + est.fontWeight + ' ' + est.fontSize + ' ' + est.fontFamily;
    const tipo0 = est.fontStyle + cola;
    const tipo = versalitas ? est.fontStyle + ' small-caps' + cola : tipo0;
    const re = /\S+/g;
    let m;
    while ((m = re.exec(n.nodeValue))){
      rango.setStart(n, m.index);
      rango.setEnd(n, m.index + m[0].length);
      const rects = rango.getClientRects();
      if (!rects.length) continue;
      const r = rects[0];                 // sin guiones, una palabra = un rectángulo
      if (r.width < .5) continue;
      const caja = el.closest('[data-giro]');
      const j = caja ? eje.get(caja) : null;
      salida.push({ t:m[0], x:r.left - host.left, y:r.top - host.top,
                    w:r.width, h:r.height, f:tipo, f0:tipo0, px:est.fontSize,
                    c:est.color, e:esp, vc:vers,
                    a: j ? j.a : 0, gx: j ? j.gx : 0, gy: j ? j.gy : 0 });
    }
  }
