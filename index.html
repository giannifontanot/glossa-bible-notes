                sitio.libro === ant.libro && sitio.n === ant.n - 1;
  const pasandoHoja = adelante || atras;
  if (sepLlegadaEn && permanencia > PAUSA_SESION) sepTerminarSesion();
  else if (adelante && permanencia >= LECTURA_MINIMA) sepLeidasSeguidas++;
  else sepLeidasSeguidas = 0;
  sepHojaAnterior = sitio;
  sepLlegadaEn = ahora;
  if (pasandoHoja){
    /* Si no hay activa (recarga, sesión nueva) pero la hoja que dejas
       tenía cinta, ésa es la que el lector está usando: se viene con él. */
    if (!sepDe(sepActivo) && ant && ant.libro === LIBRO){
      const huella = sepEnPagina(ant.n);
      if (huella) sepActivo = huella.id;
    }
    avanzarSeparador();
    sepQuiereEntrar = true;
  }
  if (sepLeidasSeguidas >= 2) ofrecerSeparador();
}
/* El enganche desde renderPage. Se pinta siempre; la llegada se cuenta solo
   cuando de verdad cambió la hoja, porque renderPage vuelve a pintar por
   muchas más razones que pasar de hoja —cambiar la letra, escribir una
   glosa, mover un filtro— y ninguna de ésas es llegar a ningún sitio. */
let sepClaveHoja = null;
function separadorAlPintar(){
  const p = plano[paginas[paginaActual]] || null;
  const clave = LIBRO + ' ' + (p ? p.cap + ':' + p.vers : '?');
  const cambio = clave !== sepClaveHoja;
  sepClaveHoja = clave;
  if (cambio && sepMenuAbierto) cerrarSepMenu();
  if (cambio) sepLlegada();
  pintarSeparador();
  /* Tras un salto o un pliegue, la cinta puede quedar en sep-espera: al
     descubrir la hoja hay que enseñarla. */
  if (!sepPaginaTapada()) sepTrasPliegue();
  if (sepMenuAbierto) colocarSepMenu();
}

/* ---------- la oferta ---------- */
function ofrecerSeparador(){
  if (sepOfrecido || sepOfertaAbierta || sepActivo) return;
  /* Si ya hay una cinta en esta hoja no hay nada que ofrecer. */
  if (sepDeLaHoja()) return;
  /* Y no se interrumpe: ni con una hoja en el aire, ni de lejos, ni con un
     panel abierto encima. La lectura sigue y se preguntará en la siguiente. */
  if (folding || preparandoPliegue || zoomActivo || borrador || cantoAbierto) return;
  const el = $('sepOferta');
  el.innerHTML = '<span class="so-dice" id="soDice">¿Pongo un separador aquí?</span>' +
    '<button class="so-btn si" data-sep-si="1">Sí</button>' +
    '<button class="so-btn" data-sep-no="1">No</button>';
  el.setAttribute('aria-describedby', 'soDice');
  el.style.display = 'flex';
  void el.offsetWidth;
  el.classList.add('visible');
  sepOfertaAbierta = true;
  /* Sin respuesta se va sola, y contar como respondida es lo correcto: quien
     no contestó ya dijo que no le hacía falta, y volver a preguntar cada dos
     hojas sería exactamente lo que no se quiere. */
  clearTimeout(sepRelojOferta);
  sepRelojOferta = setTimeout(() => { sepOfrecido = true; cerrarOferta(); }, 12000);
}
function cerrarOferta(){
  clearTimeout(sepRelojOferta); sepRelojOferta = null;
  if (!sepOfertaAbierta) return;
  sepOfertaAbierta = false;
  const el = $('sepOferta');
  el.classList.remove('visible');
  setTimeout(() => { if (!sepOfertaAbierta) el.style.display = 'none'; }, 260);
}
$('sepOferta').addEventListener('click', ev => {
  const si = ev.target.closest('[data-sep-si]');
  const no = ev.target.closest('[data-sep-no]');
  if (!si && !no) return;
  ev.preventDefault(); ev.stopPropagation();
  sepOfrecido = true;
  cerrarOferta();
  if (si){
    crearSeparador();
  }
});

/* ---------- las piedras sobre el papel ---------- */
/* SE PINTAN EN SU PROPIA CAPA, encima del papel y debajo de todo lo demás. La
   capa cuelga de .pg-inner por lo mismo que la percha de la cinta: es el papel
   de verdad —#pg lleva relleno alrededor— y es lo que la vista de lejos
   escala, así que las piedras se encogen con la hoja sin hacer nada. */
function pintarPiedras(){
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return;
  let capa = document.getElementById('piedrero');
  const mias = piedrasDeLaHoja();
  if (!mias.length){
    if (capa) capa.remove();
    return;
  }
  if (!capa){
    capa = document.createElement('div');
    capa.id = 'piedrero';
    capa.className = 'piedrero';
    inner.appendChild(capa);
  } else if (capa.parentElement !== inner){
    inner.appendChild(capa);
  }
  capa.innerHTML = mias.map(x => {
    const edita = piedraEditando === x.id;
    const px = PIEDRA_TAMS[x.tam];
    return '<div class="piedra-sitio' + (edita ? ' editando' : '') + '"' +
        ' style="left:' + (x.x * 100).toFixed(3) + '%;top:' + (x.y * 100).toFixed(3) + '%"' +
        ' data-piedra="' + esc(x.id) + '">' +
      '<button type="button" class="piedra" data-piedra-cuerpo="' + esc(x.id) + '"' +
        ' style="--piedra-tam:' + px + 'px"' +
        ' aria-label="' + FORMA_NOMBRE[x.forma] + ' en ' + esc(piedraRef(x)) +
          '. Doble toque para moverla." title="' + FORMA_NOMBRE[x.forma] + ' · ' +
          esc(piedraRef(x)) + '">' + piedraDibujo(x.forma) + '</button>' +
      (edita ? piedraMandos(x) : '') +
    '</div>';
  }).join('');
}
/* EL MANDO DE EDICIÓN. Sale solo con la piedra en edición y lleva lo que no se
   puede pedir arrastrando: los dos tamaños y el quitar. La forma NO tiene
   botón —se cambia tocando la propia piedra— porque es lo que se hace más y
   pedirlo desde aquí obligaría a apuntar a un blanco chico al lado de otro. */
function piedraMandos(x){
  const b = (acc, rot, dib, apagado) =>
    '<button type="button" class="pm-btn" data-piedra-acc="' + acc + '"' +
      (apagado ? ' disabled' : '') +
      ' aria-label="' + rot + '" title="' + rot + '">' + dib + '</button>';
  return '<div class="piedra-mandos" role="group" aria-label="Ajustar esta piedra">' +
    b('menos', 'Más pequeña', '<svg viewBox="0 0 12 12" aria-hidden="true">' +
      '<path d="M2.5 6h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      x.tam <= 0) +
    b('mas', 'Más grande', '<svg viewBox="0 0 12 12" aria-hidden="true">' +
      '<path d="M2.5 6h7M6 2.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      x.tam >= PIEDRA_TAMS.length - 1) +
    b('quitar', 'Quitar esta piedra', '<svg viewBox="0 0 12 12" aria-hidden="true">' +
      '<path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor"' +
      ' stroke-width="1.8" stroke-linecap="round"/></svg>') +
  '</div>';
}
function ponerPiedra(){
  const a = piedraAncla();
  if (!a){ readout.textContent = 'aquí no hay hoja donde dejarla'; return null; }
  const ahora = Date.now();
  const x = { id: piedraNuevoId(), libro: a.libro, cap: a.cap, vers: a.vers,
              x: .5, y: .45, forma: FORMAS[0], tam: PIEDRA_TAM_POR,
              creado: ahora, tocado: ahora };
  piedras.unshift(x);
  piedrasGuardar();
  /* NACE YA EN EDICIÓN, y eso es media explicación de cómo funciona: aparece
     con su mando puesto, así que se ve de entrada que se puede mover, cambiar
     y quitar. Sin esto habría que adivinar el doble toque para descubrirlo. */
  piedraEditando = x.id;
  pintarPiedras();
  readout.textContent = 'piedra puesta · tócala para cambiarle la forma, arrástrala para moverla';
  return x;
}
function quitarPiedra(id){
  const x = piedraDe(id);
  if (!x) return;
  piedraBorradas.add(id);
  piedras = piedras.filter(y => y.id !== id);
  if (piedraEditando === id) piedraEditando = null;
  piedrasGuardar();
  pintarPiedras();
  if (typeof pintarPiedrero === 'function') pintarPiedrero();
  readout.textContent = 'piedra quitada';
}
function piedraCerrarEdicion(){
  if (!piedraEditando) return;
  piedraEditando = null;
  pintarPiedras();
}
/* CAMBIAR DE FORMA ES DAR LA VUELTA A LA LISTA. Un toque, la siguiente; al
   final se vuelve a la primera. Sin menú y sin elegir: son tres, y girarlas
   con el dedo puesto encima es más rápido que abrir nada. */
function piedraSiguienteForma(id){
  const x = piedraDe(id);
  if (!x) return;
  x.forma = FORMAS[(FORMAS.indexOf(x.forma) + 1) % FORMAS.length];
  x.tocado = Date.now();
  piedrasGuardar();
  pintarPiedras();
  readout.textContent = FORMA_NOMBRE[x.forma];
}
function piedraTamano(id, paso){
  const x = piedraDe(id);
  if (!x) return;
  const t = Math.min(Math.max(x.tam + paso, 0), PIEDRA_TAMS.length - 1);
  if (t === x.tam) return;
  x.tam = t; x.tocado = Date.now();
  piedrasGuardar();
  pintarPiedras();
}

/* EL DOBLE TOQUE ABRE LA EDICIÓN, y el toque simple no hace nada.

   Se usa el dblclick del navegador y no un plazo a mano —que es lo que hace el
   rótulo del pie con sus 440 ms— porque aquí no hay nada que desambiguar: el
   toque simple sobre una piedra QUIETA no hace nada, así que no hay que
   esperar a ver si viene un segundo. Ese plazo existe allí para distinguir dos
   acciones distintas; aquí solo hay una.

   Y una piedra quieta tiene que dejar pasar el resto de la hoja: no traga el
   arrastre del papel ni el toque que abre una glosa. Por eso solo escucha el
   doble toque mientras no está en edición. */
stage.addEventListener('dblclick', ev => {
  const cuerpo = ev.target.closest('[data-piedra-cuerpo]');
  if (!cuerpo) return;
  ev.preventDefault(); ev.stopPropagation();
  const id = cuerpo.dataset.piedraCuerpo;
  if (piedraEditando === id) return;         /* ya estaba: no la cierra */
  piedraEditando = id;
  pintarPiedras();
  readout.textContent = 'piedra en edición · arrástrala para moverla, tócala para cambiarle la forma';
});

/* ARRASTRAR MUEVE, TOCAR CAMBIA LA FORMA, y lo que los distingue es si el dedo
   se movió. El umbral son 6 px: menos lo dispararía el temblor de un dedo al
   posarse —que ronda los diez en un botón grande, pero aquí el dedo va quieto
   apuntando a algo chico— y más obligaría a un arrastre exagerado para mover
   la piedra un pelo. */
const PIEDRA_ARRASTRE = 6;
let piedraGesto = null;
stage.addEventListener('pointerdown', ev => {
  const cuerpo = ev.target.closest('[data-piedra-cuerpo]');
  if (!cuerpo) return;
  const id = cuerpo.dataset.piedraCuerpo;
  if (piedraEditando !== id) return;          /* quieta: el toque no es suyo */
  const x = piedraDe(id);
  const inner = pg.querySelector('.pg-inner');
  if (!x || !inner) return;
  ev.preventDefault(); ev.stopPropagation();
  const caja = inner.getBoundingClientRect();
  piedraGesto = { id, pid: ev.pointerId, x0: ev.clientX, y0: ev.clientY,
                  movio: false, caja, sitio: cuerpo.closest('.piedra-sitio') };
  try { cuerpo.setPointerCapture(ev.pointerId); } catch(_){}
}, true);
stage.addEventListener('pointermove', ev => {
  if (!piedraGesto || ev.pointerId !== piedraGesto.pid) return;
  const g = piedraGesto;
  if (!g.movio &&
      Math.abs(ev.clientX - g.x0) < PIEDRA_ARRASTRE &&
      Math.abs(ev.clientY - g.y0) < PIEDRA_ARRASTRE) return;
  g.movio = true;
  ev.preventDefault();
  /* SE MIDE CONTRA LA CAJA DEL PAPEL, no contra la ventana, y en fracciones:
     es lo que se guarda, y así el arrastre y lo guardado son el mismo número.
     Se pinta moviendo el nodo directamente —sin repintar la capa— porque
     rehacer el HTML en cada cuadro perdería la captura del puntero. */
  const fx = Math.min(Math.max((ev.clientX - g.caja.left) / g.caja.width, 0), 1);
  const fy = Math.min(Math.max((ev.clientY - g.caja.top) / g.caja.height, 0), 1);
  g.fx = fx; g.fy = fy;
  if (g.sitio){
    g.sitio.style.left = (fx * 100).toFixed(3) + '%';
    g.sitio.style.top = (fy * 100).toFixed(3) + '%';
  }
}, true);
function piedraSoltar(ev){
  if (!piedraGesto || (ev && ev.pointerId !== piedraGesto.pid)) return;
  const g = piedraGesto;
  piedraGesto = null;
  const x = piedraDe(g.id);
  if (!x) return;
  if (g.movio){
    x.x = g.fx; x.y = g.fy; x.tocado = Date.now();
    piedrasGuardar();
    pintarPiedras();
    /* El clic que manda el dedo al levantarse apagaría la edición en el oyente
       de fuera; se traga, igual que en el acelerador del zoom. */
    tragarElClic();
  } else {
    piedraSiguienteForma(g.id);
    tragarElClic();
  }
}
/* Se escucha en la VENTANA por el mismo candado que el acelerador: un dedo que
   se levanta fuera del elemento —y arrastrando se sale siempre— dejaría el
   gesto sin cerrar, y con él la piedra pegada al dedo para siempre. */
window.addEventListener('pointerup', ev => piedraSoltar(ev));
window.addEventListener('pointercancel', ev => piedraSoltar(ev));

stage.addEventListener('click', ev => {
  const acc = ev.target.closest('[data-piedra-acc]');
  if (!acc) return;
  ev.preventDefault(); ev.stopPropagation();
  const sitio = acc.closest('[data-piedra]');
  const id = sitio ? sitio.dataset.piedra : null;
  if (!id) return;
  if (acc.dataset.piedraAcc === 'menos') piedraTamano(id, -1);
  else if (acc.dataset.piedraAcc === 'mas') piedraTamano(id, +1);
  else if (acc.dataset.piedraAcc === 'quitar') quitarPiedra(id);
});
/* UN TOQUE FUERA CIERRA LA EDICIÓN. En captura y antes que nadie, como los
   demás paneles. La propia piedra y su mando cuentan como «dentro». */
document.addEventListener('pointerdown', ev => {
  if (!piedraEditando) return;
  if (ev.target.closest('.piedra-sitio')) return;
  piedraCerrarEdicion();
}, true);

/* ---------- la lista de piedras ---------- */
/* Se cuelga del botón del pie y se coloca igual que el menú de la cinta, con
   el mismo apaño de guardar el RECTÁNGULO y no el elemento: el botón se va con
   el rastro si se cierra, y un elemento fuera del documento no mide nada. */
let piedraMenuAbierto = false, piedraMenuAncla = null;
function abrirPiedraMenu(ancla){
  piedraMenuAbierto = true;
  piedraMenuAncla = ancla ? ancla.getBoundingClientRect() : null;
  pintarPiedraMenu();
  const el = $('piedraMenu');
  el.style.display = 'flex';
  colocarPiedraMenu();
  void el.offsetWidth;
  el.classList.add('visible');
  const foco = el.querySelector('[data-piedra-ir]');
  if (foco) foco.focus({ preventScroll:true });
}
function cerrarPiedraMenu(){
  if (!piedraMenuAbierto) return;
  piedraMenuAbierto = false;
  piedraMenuAncla = null;
  const el = $('piedraMenu');
  el.classList.remove('visible');
  setTimeout(() => { if (!piedraMenuAbierto) el.style.display = 'none'; }, 280);
}
function pintarPiedrero(){ if (piedraMenuAbierto) pintarPiedraMenu(); }
function pintarPiedraMenu(){
  const el = $('piedraMenu');
  if (!piedras.length){
    el.innerHTML = '<span class="sp-tit">Tus piedras</span>' +
      '<p class="sp-vacio">Todavía no has dejado ninguna. El botón «piedra» del' +
      ' rastro deja una en la hoja que estés leyendo.</p>';
    return;
  }
  el.innerHTML = '<span class="sp-tit">Tus piedras</span>' +
    piedras.map(x =>
      '<div class="sp-fila' + (piedraAqui(x) ? ' aqui' : '') + '">' +
        '<button class="sp-ir" data-piedra-ir="' + esc(x.id) + '"' +
          ' aria-label="Ver el versículo de la ' + FORMA_NOMBRE[x.forma] + ' en ' +
            esc(piedraRef(x)) + '" title="' + esc(piedraTexto(x)) + '">' +
          '<span class="sp-chip-forma" aria-hidden="true">' + piedraDibujo(x.forma) + '</span>' +
          '<span class="sp-ref">' + esc(piedraTexto(x)) + '</span></button>' +
        '<button type="button" class="sp-fila-x" data-piedra-quitar="' + esc(x.id) + '"' +
          ' aria-label="Quitar la ' + FORMA_NOMBRE[x.forma] + ' de ' + esc(piedraRef(x)) + '"' +
          ' title="Quitar">' +
          '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5 L9.5 9.5' +
          ' M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.8"' +
          ' stroke-linecap="round"/></svg></button>' +
      '</div>').join('');
}
function colocarPiedraMenu(){
  const el = $('piedraMenu');
  if (el.style.display === 'none') return;
  const st = stage.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let izq = st.width - w - 8, arr = 44;
  const r = piedraMenuAncla;
  if (r){
    izq = r.right - st.left - w;
    arr = r.bottom - st.top + 8;
    if (arr + h > st.height - 8) arr = r.top - st.top - h - 8;
  }
  izq = Math.min(Math.max(8, izq), Math.max(8, st.width - w - 8));
  if (arr + h > st.height - 8) arr = Math.max(8, st.height - h - 8);
  el.style.left = Math.round(izq) + 'px';
  el.style.top = Math.round(Math.max(8, arr)) + 'px';
}
$('piedraMenu').addEventListener('click', ev => {
  const quitar = ev.target.closest('[data-piedra-quitar]');
  if (quitar){
    ev.preventDefault(); ev.stopPropagation();
    quitarPiedra(quitar.dataset.piedraQuitar);
    return;
  }
  const ir = ev.target.closest('[data-piedra-ir]');
  if (!ir) return;
  ev.preventDefault(); ev.stopPropagation();
  const x = piedraDe(ir.dataset.piedraIr);
  if (!x) return;
  /* ENSEÑA ANTES DE SALTAR, igual que la lista de cintas: se abre la ventanita
     con el versículo y el salto se pide tocando la escritura. Un solo camino
     para la misma pregunta, se pregunte desde donde se pregunte. */
  cerrarPiedraMenu();
  abrirPleno(x.libro, x.cap, x.vers);
});
/* Un toque fuera lo cierra, con su propia puerta exceptuada para que el
   segundo toque del botón lo cierre en vez de reabrirlo. */
document.addEventListener('pointerdown', ev => {
  if (!piedraMenuAbierto) return;
  if (ev.target.closest('#piedraMenu, [data-piedra-lista]')) return;
  cerrarPiedraMenu();
}, true);

/* ---------- el menú de la cinta ---------- */
/* SIN id SE ABRE EN MODO LISTA. Es la puerta del pie del rastro: no vienes de
   una cinta, así que no hay color que cambiar —esa sección es de la cinta que
   tocaste— y lo único que tiene sentido enseñar es la lista. La bandera se
   pone en 'lista' y no en null porque null es «cerrado» en todo este bloque, y
   confundir los dos dejaría el menú abierto sin que nadie supiera cerrarlo. */
function abrirSepMenu(id, ancla){
  if (id && !sepDe(id)) return;
  cerrarOferta();
  sepMenuAbierto = id || 'lista';
  /* Se guarda el RECTÁNGULO, no el elemento: quien lo abrió puede irse —el
     botón del pie se va con el rastro al cerrarlo— y un elemento fuera del
     documento no mide nada. */
  sepMenuAncla = ancla ? ancla.getBoundingClientRect() : null;
  sepEditando = null;
  sepBorrando = null;
  pintarSepMenu();
  const el = $('sepMenu');
  el.style.display = 'flex';
  colocarSepMenu();
  void el.offsetWidth;
  el.classList.add('visible');
  pintarSeparador();
  /* En modo lista no hay telas, así que el foco va a la primera cinta: quien
     llega con el teclado tiene que caer en algo que sirva. */
  const foco = el.querySelector('.sp-tela') || el.querySelector('.sp-ir');
  if (foco) foco.focus({ preventScroll:true });
}
function cerrarSepMenu(){
  if (!sepMenuAbierto) return;
  sepCobrarNombre();               /* ver sepCobrarNombre: cerrar es terminar */
  sepMenuAbierto = null;
  sepMenuAncla = null;
  sepEditando = null;
  sepBorrando = null;
  const el = $('sepMenu');
  el.classList.remove('visible');
  setTimeout(() => { if (!sepMenuAbierto) el.style.display = 'none'; }, 280);
  pintarSeparador();
}
function pintarSepMenu(){
  /* Puede no haber cinta: en modo lista sepMenuAbierto vale 'lista' y sepDe
     devuelve null. No es un fallo, es el otro modo. */
  const s = sepDe(sepMenuAbierto);
  const aqui = sepAqui;
  /* La lista va por lo último que se tocó, que es lo que se busca: la cinta
     de la lectura de ahora arriba, y las de antes debajo en el orden en que
     se dejaron. A la derecha, una X para borrarlo (con confirmación). */
  const lista = separadores.slice().sort((a, b) => b.tocado - a.tocado);
  const aBorrar = sepBorrando ? sepDe(sepBorrando) : null;
  const refBorrar = aBorrar
    ? (esc(nombreDe(aBorrar.libro)) + ' ' + aBorrar.cap + ':' + aBorrar.vers)
    : '';
  /* La pregunta va DELANTE de la lista y pegada arriba —ver .sp-borrar—: con la
     lista llena, puesta al final había que desplazarse para contestarla. */
  const borrarHtml = sepBorrando ?
    '<div class="sp-borrar" role="group" aria-label="Confirmar borrado">' +
      '<span class="sp-pregunta">¿Eliminar el separador' +
        (refBorrar ? ' de ' + refBorrar : '') + '?</span>' +
      '<div class="sp-botones">' +
        '<button class="sp-btn si" data-sep-borrar="' + esc(sepBorrando) + '">Eliminar</button>' +
        '<button class="sp-btn" data-sep-cancelar="1">Cancelar</button>' +
      '</div></div>' : '';
  $('sepMenu').innerHTML =
    /* Las telas sólo si se vino de una cinta: en modo lista no hay «esta
       cinta» cuyo color cambiar, y enseñar la paleta apuntando a ninguna
       sería ofrecer un mando que no manda nada. */
    (s ? '<span class="sp-tit">Color de la cinta</span>' +
      '<div class="sp-telas" role="group" aria-label="Color del separador">' +
      TELAS.map(t => '<button class="sp-tela" data-sep-color="' + t[0] + '"' +
        ' style="background:' + t[2] + '" aria-pressed="' + (t[0] === s.color) + '"' +
        ' aria-label="Cinta ' + t[1] + '" title="' + t[1] + '"></button>').join('') +
      '</div>' : '') +
    '<span class="sp-tit">Tus separadores</span>' +
    borrarHtml +
    (lista.length ? lista.map(x => {
      const t = telaDe(x.color);
      const editando = sepEditando === x.id;
      const donde = esc(nombreDe(x.libro)) + ' ' + x.cap + ':' + x.vers;
      return '<div class="sp-fila' + (aqui(x) ? ' aqui' : '') + '">' +
        (editando
          /* ESCRIBIENDO, LA FILA SE QUEDA CALLADA. Fuera el «· aquí» y fuera la
             X: estás nombrando, no yendo a ningún sitio ni borrando nada, y en
             un teléfono los tres juntos dejaban al campo 70px y el aviso
             partido a la mitad. Que la cinta sea la de esta hoja se sigue
             viendo —la fila lleva su aro—, y la X vuelve al terminar. */
          ? '<div class="sp-edit">' +
              '<span class="sp-chip" style="background:' + t[2] + '" aria-hidden="true"></span>' +
              '<span class="sp-edit-base">' + esc(sepRef(x, true)) + ' ·</span>' +
              '<input class="sp-nombre" data-sep-nombre="' + esc(x.id) + '"' +
                ' value="' + esc(x.nombre || '') + '" maxlength="70" autocomplete="off"' +
                ' enterkeyhint="done" placeholder="nombre…"' +
                ' aria-label="Nombre del separador en ' + donde + '" />' +
            '</div>'
          /* EL RÓTULO DICE VER, NO IR, porque la fila ya no lleva: abre la
             ventanita con el versículo y el salto se pide después, tocando la
             escritura. Decía «Ir al separador…», y quien no ve la pantalla
             pedía una cosa y le pasaba otra —justo en el paso que se acaba de
             partir en dos—. Lo levantó la revisión de Codex. */
          : '<button class="sp-ir" data-sep-ir="' + esc(x.id) + '"' +
              ' aria-label="Ver el versículo del separador en ' + donde + '"' +
              /* El nombre largo se recorta con puntos suspensivos, así que el
                 texto entero va también en el title: si no, la única manera de
                 leerlo sería abrir el campo de escribirlo. */
              ' title="' + esc(sepTexto(x)) + '">' +
              '<span class="sp-chip" style="background:' + t[2] + '" aria-hidden="true"></span>' +
              '<span class="sp-ref">' + esc(sepTexto(x)) + '</span></button>' +
            /* EL LÁPIZ, y no un doble clic sobre el nombre. Un doble clic
               obliga a esperar a que pase el plazo antes de atender el toque
               simple, o sea que ABRIR la cinta —lo que se hace siempre—
               pagaría un retraso por culpa de nombrarla, que se hace una vez.
               Este archivo ya pagó ese precio en el rótulo del pie y hubo que
               subirlo a 440 ms. Un botón aparte no cuesta nada a nadie, se ve
               que está, y se alcanza con el tabulador. */
            '<button type="button" class="sp-fila-lapiz" data-sep-renombrar="' + esc(x.id) + '"' +
              ' aria-label="' + (x.nombre ? 'Cambiar el nombre del' : 'Ponerle nombre al') +
              ' separador en ' + donde + '" title="Ponerle nombre">' +
              '<svg viewBox="0 0 12 12" aria-hidden="true">' +
              '<path d="M1.2 8.4 L8.1 1.5 L10.5 3.9 L3.6 10.8 L0.9 11.1 Z"' +
              ' fill="none" stroke="currentColor" stroke-width="1.4"' +
              ' stroke-linejoin="round"/></svg></button>') +
        (editando ? '' :
          '<button type="button" class="sp-fila-x" data-sep-pedir-borrar="' + esc(x.id) + '"' +
            ' aria-label="Eliminar separador en ' + donde + '" title="Eliminar">' +
            '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 L9 9 M9 1 L1 9"' +
            ' stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' +
          '</button>') + '</div>';
    }).join('') : '<span class="sp-vacio">Todavía ninguno.</span>');
  if (sepBorrando){
    const caja = $('sepMenu').querySelector('.sp-borrar');
    void caja.offsetWidth;
    caja.classList.add('puesta');
    const b = caja.querySelector('.sp-btn'); if (b) b.focus({ preventScroll:true });
  } else if (sepEditando){
    /* El foco entra en el campo y lo que hubiera queda seleccionado: nombrar
       de nuevo es lo normal, y así se escribe encima sin borrar antes. */
    const campo = $('sepMenu').querySelector('[data-sep-nombre]');
    if (campo){ campo.focus({ preventScroll:true }); campo.select(); }
  }
}
/* El menú se cuelga de la cinta —debajo y alineado por su borde derecho— y de
   ahí no se sale de la escena: si no cabe debajo, sube. Nunca se recorta. */
function colocarSepMenu(){
  const el = $('sepMenu');
  if (el.style.display === 'none') return;
  /* El ancla guardada manda sobre la cinta: si el menú lo abrió el pie del
     rastro, colgarlo de una cinta que además está en otra esquina sería
     señalar a lo que no lo abrió. */
  const de = sepMenuAncla || document.querySelector('.separador');
  const st = stage.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let izq = st.width - w - 8, arr = 44;
  if (de){
    const r = typeof de.getBoundingClientRect === 'function' ? de.getBoundingClientRect() : de;
    izq = r.right - st.left - w;
    arr = r.bottom - st.top + 8;
    /* Y SI NO CABE DEBAJO, SE PONE ENCIMA. El botón del pie vive abajo del
       todo: colgando el menú debajo de él no cabe nunca, y sin esto acababa
       aplastado contra el borde tapando el propio botón. */
    if (arr + h > st.height - 8) arr = r.top - st.top - h - 8;
  }
  izq = Math.min(Math.max(8, izq), Math.max(8, st.width - w - 8));
  if (arr + h > st.height - 8) arr = Math.max(8, st.height - h - 8);
  arr = Math.max(8, arr);
  el.style.left = Math.round(izq) + 'px';
  el.style.top = Math.round(arr) + 'px';
}
/* La cinta y su equis. Van en la escena porque la cinta se rehace en cada
   repintado: un oyente puesto en el elemento se iría con él. */
stage.addEventListener('click', ev => {
  const x = ev.target.closest('[data-sep-x]');
  if (x){
    ev.preventDefault(); ev.stopPropagation();
    if (!sepMenuAbierto) return;
    sepBorrando = sepMenuAbierto; pintarSepMenu(); colocarSepMenu();
    return;
  }
  const cinta = ev.target.closest('[data-sep]');
  if (!cinta) return;
  /* De lejos también: la cinta asoma a propósito y es un control, no decoración. */
  ev.preventDefault(); ev.stopPropagation();
  if (sepMenuAbierto === cinta.dataset.sep) cerrarSepMenu();
  else abrirSepMenu(cinta.dataset.sep);
}, true);
/* NOMBRAR UNA CINTA.

   El nombre no mueve la fila de sitio: la lista va por lo último que se tocó,
   y ponerle nombre a una cinta no es volver a leerla. Se toca `nombre` y nada
   más —ni `tocado` ni `color`—, así que la de arriba sigue siendo la de la
   lectura de ahora.

   Vaciar el campo QUITA el nombre, no guarda una cadena vacía: una cinta sin
   nombre es un estado que existe —es como nacen todas— y es la única manera
   de deshacerse de uno puesto por error. */
/* PONER EL NOMBRE Y NADA MÁS: guarda, y no repinta el menú.

   Está partido en dos a propósito. Repintar el menú borra y rehace sus
   botones, y hay dos momentos en que eso llega demasiado pronto —los dos
   están abajo—. Quien sí quiere el repintado lo pide con sepGuardarNombre. */
function sepPonerNombre(id, valor){
  const s = sepDe(id); if (!s) return null;
  const antes = s.nombre || '';
  const nombre = sepNombreLimpio(valor);
  if (nombre) s.nombre = nombre; else delete s.nombre;
  sepEditando = null;
  /* Se le pasa lo recién decidido para que la fusión no lo pise: ver sepGuardar. */
  sepGuardar({ id, nombre: nombre || null });
  pintarSeparador();
  return { cambio: nombre !== antes, nombre };
}
/* Sólo se dice algo si algo cambió: abrir el campo, mirarlo y salir no es un
   cambio, y avisar de él enseñaría a no leer los avisos. */
function sepDecirNombre(r){
  if (r && r.cambio)
    readout.textContent = r.nombre ? 'separador nombrado' : 'nombre del separador borrado';
}
function sepGuardarNombre(id, valor){
  const r = sepPonerNombre(id, valor);
  if (!r) return;
  pintarSepMenu(); colocarSepMenu();
  sepDecirNombre(r);
}
/* LO ESCRITO SE COBRA ANTES DE CERRAR, y el orden es todo el arreglo.

   Un toque fuera lo recoge un oyente de captura sobre el documento, que corre
   ANTES de que el navegador mueva el foco. Cerrando primero, sepEditando ya
   valía null cuando llegaba el focusout, su guardia se iba por la primera
   línea, y lo escrito se perdía sin decir nada: escribías el nombre, tocabas
   la hoja para seguir leyendo, y la cinta seguía sin nombre.

   Es palabra por palabra el mismo fallo que tuvo el panel de la glosa con las
   etiquetas —está contado en su oyente— y se arregla igual: se cobra aquí,
   mientras el campo todavía existe. Al ponerlo en cerrarSepMenu lo cubre por
   todos los caminos que cierran, no sólo por el toque de fuera: Escape, abrir
   otro panel, saltar a la cinta, cambiar de hoja. */
function sepCobrarNombre(){
  if (!sepEditando) return;
  const id = sepEditando;
  const campo = $('sepMenu').querySelector('[data-sep-nombre]');
  if (!campo || campo.dataset.sepNombre !== id){ sepEditando = null; return; }
  sepDecirNombre(sepPonerNombre(id, campo.value));
}
function sepEditarNombre(id){
  if (!sepDe(id)) return;
  sepBorrando = null;
  sepEditando = id;
  pintarSepMenu(); colocarSepMenu();
}
/* Enter cierra y guarda; Escape sale sin tocar nada. Y el foco que se va
   guarda también, que es lo que espera cualquiera que toque en otro sitio: no
   estaba abandonando, estaba terminando. Es la misma regla que el panel de la
   glosa, y por la misma razón. */
$('sepMenu').addEventListener('keydown', ev => {
  const campo = ev.target.closest('[data-sep-nombre]');
  if (!campo) return;
  if (ev.key === 'Enter'){
    ev.preventDefault(); ev.stopPropagation();
    sepGuardarNombre(campo.dataset.sepNombre, campo.value);
  } else if (ev.key === 'Escape'){
    ev.preventDefault(); ev.stopPropagation();
    sepEditando = null; pintarSepMenu(); colocarSepMenu();
  }
});
/* EL FOCO QUE SE VA GUARDA, PERO EL REPINTADO ESPERA AL CLIC.

   Salir del campo es terminar, no abandonar —la misma regla que el panel de la
   glosa—, así que se guarda. Lo que NO puede hacerse aquí es repintar: el
   focusout llega antes que el clic del botón que se está tocando, y repintar
   borra y rehace las filas, así que ese botón deja de existir antes de que su
   clic aterrice. El toque se perdía y había que darlo dos veces.

   Se veía yendo del campo al lápiz de otra fila, que es lo natural al nombrar
   varias seguidas; pero le pasa igual al ir a una fila, a su equis o a una
   tela. Lo intenté primero salvando sólo el caso del lápiz, y era tapar un
   agujero de tres: lo levantó la revisión de Codex.

   Así que se guarda ya —el dato no espera a nadie— y el repintado se aplaza al
   turno siguiente, cuando el clic ya se atendió. Si ese clic hizo algo que
   repinta por su cuenta —abrir otro nombre, ir a la cinta, cerrar el menú— el
   aplazado se encuentra el trabajo hecho y se aparta. */
$('sepMenu').addEventListener('focusout', ev => {
  const campo = ev.target.closest('[data-sep-nombre]');
  if (!campo || sepEditando !== campo.dataset.sepNombre) return;
  sepDecirNombre(sepPonerNombre(campo.dataset.sepNombre, campo.value));
  setTimeout(() => {
    if (sepMenuAbierto && !sepEditando){ pintarSepMenu(); colocarSepMenu(); }
  }, 0);
});
$('sepMenu').addEventListener('click', ev => {
  /* Dentro del campo no hay nada que hacer aquí: poner el cursor a media
     palabra es escribir, no pulsar. (Cerrar el menú no hace falta pararlo: el
     oyente que cierra con un toque de fuera ya exceptúa #sepMenu entero.) */
  if (ev.target.closest('[data-sep-nombre]')) return;
  const renombrar = ev.target.closest('[data-sep-renombrar]');
  if (renombrar){
    ev.preventDefault(); ev.stopPropagation();
    sepEditarNombre(renombrar.dataset.sepRenombrar);
    return;
  }
  const color = ev.target.closest('[data-sep-color]');
  if (color){
    ev.preventDefault(); ev.stopPropagation();
    const s = sepDe(sepMenuAbierto); if (!s) return;
    s.color = telaDe(color.dataset.sepColor)[0];
    s.tocado = Date.now();
    sepGuardar(); pintarSepMenu(); pintarSeparador();
    return;
  }
  const pedirBorrar = ev.target.closest('[data-sep-pedir-borrar]');
  if (pedirBorrar){
    ev.preventDefault(); ev.stopPropagation();
    sepBorrando = pedirBorrar.dataset.sepPedirBorrar;
    pintarSepMenu(); colocarSepMenu();
    return;
  }
  const cancelar = ev.target.closest('[data-sep-cancelar]');
  if (cancelar){
    ev.preventDefault(); ev.stopPropagation();
    sepBorrando = null; pintarSepMenu(); colocarSepMenu();
    return;
  }
  const borrar = ev.target.closest('[data-sep-borrar]');
  if (borrar){
    ev.preventDefault(); ev.stopPropagation();
    borrarSeparador(borrar.dataset.sepBorrar);
    readout.textContent = 'separador eliminado';
    return;
  }
  const ir = ev.target.closest('[data-sep-ir]');
  if (!ir) return;
  ev.preventDefault(); ev.stopPropagation();
  const s = sepDe(ir.dataset.sepIr); if (!s) return;
  cerrarSepMenu();
  /* TOCAR UNA CINTA ENSEÑA, NO SALTA. Antes saltaba en el acto, y saltar es la
     única cosa de este panel que no se puede deshacer sin volver a buscar: la
     hoja donde estabas se va, y con ella el rastro y la lista. Ahora hace lo
     mismo que una fila del rastro —abre la ventanita con el versículo— y el
     salto se pide tocando el texto. Es un paso más, pero es el paso que ya se
     conoce: leer primero, ir después.
     Se enseña a donde la cinta CAE hoy, no lo que dice guardado: si el
     versículo ya no existe en esta versión, su capítulo sí. */
  const d = sepDestino(s);
  abrirPleno(s.libro, d.cap, d.vers);
  /* De qué cinta salió la ventanita. Se cuelga aquí y no viaja como parámetro
     de abrirPleno porque solo lo mira el salto: hasta que no se toca el texto
     no ha pasado nada que convierta esta cinta en la activa. */
  if (plenoAbierto) plenoAbierto.sep = s.id;
  /* Y EL FOCO SE VA CON LA VENTANITA. Aquí y no dentro de abrirPleno: el foco
     se mueve porque la lista que lo tenía se está escondiendo, y esa es una
     condición de ESTE camino. Las otras tres puertas de la ventanita —una fila
     del rastro, una referencia dentro de una glosa, el índice— dejan en pie lo
     que llevaba el foco, y en la de la glosa robárselo al textarea cortaría lo
     que se está escribiendo.
     Antes esto no hacía falta porque tocar la cinta saltaba: la hoja cambiaba
     entera y no había segundo paso. Ahora lo hay, y sin esto quien llega con
     el teclado se queda sin foco en cuanto el menú se pone en display:none,
     con la ventanita abierta y sin manera de contestarle salvo recorrer el
     documento. Va al versículo, que es lo que se viene a hacer; si no está en
     esta versión no hay botón, y entonces a la equis. Lo levantó Codex. */
  const vp = $('versoPleno');
  const foco = vp.querySelector('button.vp-txt') || vp.querySelector('[data-cerrar-pleno]');
  if (foco) foco.focus({ preventScroll:true });
});
/* Un toque fuera lo cierra, como los demás paneles. La cinta queda exceptuada
   —su oyente ya sabe alternar— y también el menú, claro. */
document.addEventListener('pointerdown', ev => {
  if (!sepMenuAbierto && !sepOfertaAbierta) return;
  /* El botón del pie del rastro va exceptuado por lo mismo que la cinta: es su
     puerta y alterna. Sin esto, el pointerdown lo cerraba y el click de detrás
     lo volvía a abrir, así que el segundo toque no cerraba nunca. */
  if (ev.target.closest('#sepMenu, #sepOferta, [data-sep], [data-sep-x], [data-sep-lista]')) return;
  if (sepMenuAbierto) cerrarSepMenu();
  /* La oferta NO se cierra con un toque en cualquier sitio: se contesta con
     sus dos botones o se va sola. Tocar el papel para seguir leyendo no es
     decir que no. */
}, true);

/* El salto: cierra el panel disolviéndolo, rearma el mapa de hojas del libro
   destino y voltea un bonche hasta la hoja donde vive ese versículo. */
/* `regreso` es opcional: lo manda quien salta desde una referencia, para que
   el botón de volver sepa a dónde. Tiene que viajar como parámetro y no
   asignarse después de llamar, porque saltarA no termina en el acto —espera a
   que el panel se cierre— y adentro limpia volverA. Asignarlo por fuera se
   perdía en cuanto corría el diferido. */
function saltarA(libro, cap, vers, regreso, opciones){
  const op = opciones || {};
  sepSalto = true;                   /* esto es saltar, no leer: ver sepSalto */
  const viejo = pageImg, mismo = libro === LIBRO, desdeHoja = paginaActual;
  /* De qué libro salimos. Hay que guardarlo AQUÍ: dentro del diferido lo
     primero que pasa es LIBRO = libro, así que para cuando se calcula el
     grosor del bonche, LIBRO ya es el destino. La cuenta salía "de
     Apocalipsis a Apocalipsis" = cero hojas = un bonche de una, en TODOS los
     saltos entre libros, que son justo los que más tardan y más manojo
     piden. Por eso se veía chiquito cuando más debía verse grande. */
  const libroOrigen = LIBRO;
  /* ¿El destino queda antes o después de donde estoy? Dentro del mismo libro
     se compara el número de hoja; entre libros distintos, el orden del canon.
     Antes esto último no se miraba: irse de Apocalipsis a Mateo volteaba las
     hojas hacia adelante, como si Mateo estuviera más allá. */
  const iAhora = CANON.findIndex(b => b.id === LIBRO);
  const iAlla  = CANON.findIndex(b => b.id === libro);
  const haciaAtras = mismo ? false : (iAlla >= 0 && iAhora >= 0 && iAlla < iAhora);
  mostrarBuscando();
  cerrarCanto(() => trasPintar(() => {
    LIBRO = libro;
    volverA = regreso || null; paginasSucias = true;
    rehacerPlano();
    resolverTodas(); recalcularRefs(); calcularVinculos();
    asegurarPaginas();
    const k = Math.max(0, plano.findIndex(p => p.cap === cap && p.vers === vers));
    const destino = paginaDe(k);
    const aterrizar = () => {
      hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; plegandoConDedo = false; anchor = F = null;
      paginaActual = destino;
      cerrarCajonDeGlosas();              /* misma razón que en animarSalto */
      renderPage();
      fx.style.display = 'none'; pg.classList.remove('hidden');
      if (typeof sepTrasPliegue === 'function') sepTrasPliegue();
      destacar(cap, vers, '');
      quitarBuscando();
      /* Al rastro, y aquí al ATERRIZAR y no al pedirlo: un salto entre libros
         puede quedarse a medias —el libro no está en los datos, la foto no
         carga— y el historial solo debe contar lo que de verdad llegaste a
         ver. En irA, dentro del mismo libro, se apunta antes porque allí ya se
         comprobó que el destino existe y no hay viaje que pueda fallar.
         El de dónde va primero para que quede DEBAJO del destino: la lista se
         lee del más nuevo al más viejo. Y sin encargo no hay origen que
         apuntar, que es el caso de saltar desde el menú de libros: ahí no
         vienes de una escritura, vienes del índice. */
      if (!op.sinApuntar){
        const origen = op.origen || (regreso && regreso.ref
          ? { libro: regreso.libro, cap: regreso.ref.cap, vers: regreso.ref.vers }
          : null);
        apuntarDeDonde(origen);
        apuntarVisto(libro, cap, vers);
      }
    };
    if (mismo && destino === desdeHoja){ aterrizar(); return; }
    side = (mismo ? destino < desdeHoja : haciaAtras) ? 'left' : 'right';
    fotoDeHoja(destino, img => {
      if (!viejo || !img){ aterrizar(); return; }
      pageImg = viejo; bajoImg = img;
      /* cambiar de libro es siempre un viaje largo, aunque el número de
         hoja del libro nuevo sea chico */
      /* Entre libros distintos el número de hoja del libro nuevo no dice nada
         del viaje: se cuenta cuántos capítulos hay de por medio en el canon y
         se estiman las hojas con la densidad del libro actual. */
      const salto = mismo ? Math.abs(destino - desdeHoja)
                          : hojasEntreLibros(libroOrigen, libro, cap);
      const b = bonchePara(salto);
      /* El giro se apaga cuando arrancan las hojas, no cuando llegan. A partir
         de aquí ya no hay nada que esperar: el bonche volteándose ES la
         respuesta, y dejar el disco encima taparía el viaje que se pagó por
         enseñar. */
      quitarBuscando();
      animarHojas(b.hojas, rnd(b.dur[0], b.dur[1]), aterrizar);
    });
  }), true);
}

/* ============================================================
   EXPORTAR E IMPORTAR. La salida de emergencia: un archivo que tú
   guardas donde quieras. No depende de red, de cuenta ni de que el
   navegador conserve su almacenamiento. Es lo único que responde a
   "¿y si mañana esto no está?".
   ============================================================ */
const FORMATO = 'glossa/marcas';

$('btnExportar').onclick = () => {
  if (!marcas.length){ readout.textContent = 'no hay nada que exportar todavía'; return; }
  /* El archivo tiene que decir qué es en la primera línea que se ve al
     abrirlo, y también en su nombre. Dentro de un año, entre cincuenta
     archivos, "glossa-2026-08-14.json" no le dice nada a nadie. */
  const paquete = {
    _que_es: 'Respaldo de Gloss Bible: tus subrayados y glosas. ' +
             'Se restaura con el botón Importar del lector.',
    formato: FORMATO, version: 1,
    exportado: new Date().toISOString(),
    versionTexto: version,
    totalMarcas: marcas.length,
    marcas
  };
  const blob = new Blob([JSON.stringify(paquete, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gloss-bible-respaldo-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};

$('btnImportar').onclick = () => $('archivoImp').click();
$('archivoImp').onchange = ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';                       // permite reimportar el mismo archivo
  if (!f) return;
  const lector = new FileReader();
  lector.onerror = () => { readout.textContent = 'no se pudo leer el archivo'; };
  lector.onload = () => {
    let datos;
    try { datos = JSON.parse(lector.result); }
    catch(e){ readout.textContent = 'ese archivo no es JSON válido'; return; }
    const entrantes = Array.isArray(datos) ? datos
                    : (datos && datos.formato === FORMATO ? datos.marcas : null);
    if (!Array.isArray(entrantes)){
      readout.textContent = 'ese archivo no parece una exportación de Glossa';
      return;
    }
    /* Se FUSIONA, no se reemplaza: importar nunca debe borrar lo que ya
       tenías. Las repetidas se saltan por id, y a las que les falte id
       (editadas a mano) se les inventa uno. */
    const conocidas = new Set(marcas.map(m => m.id));
    let nuevas = 0, repetidas = 0, malas = 0;
    for (const m of entrantes){
      if (!m || typeof m !== 'object' || !m.libro || !m.cap || !m.vers){ malas++; continue; }
      if (!m.id) m.id = 'imp' + Math.random().toString(36).slice(2,9);
      if (conocidas.has(m.id)){ repetidas++; continue; }
      conocidas.add(m.id);
      marcas.push(alDia(m));               /* traduce la paleta vieja al entrar */
      nuevas++;
    }
    save(); renderPage();
    /* Lo que entró se ve entrar: la hoja se vuelve a pintar con las glosas
       nuevas puestas. Lo que NO entró no se ve por ningún lado, y eso sí hay
       que decirlo: un archivo con veinte notas del que solo aparecen tres se
       lee como una importación completa a menos que alguien cuente las otras
       diecisiete. */
    if (repetidas || malas)
      readout.textContent = nuevas + ' importada(s)' +
        (repetidas ? ' · ' + repetidas + ' ya estaban' : '') +
        (malas ? ' · ' + malas + ' ilegibles' : '');
  };
  lector.readAsText(f);
};

/* ============================================================
   COMPARADOR. Dibuja la foto encima de la hoja viva en modo
   "difference": donde coinciden, negro; donde no, brilla. Es la única
   forma honesta de encontrar diferencias que el ojo no atrapa al vuelo.
   ============================================================ */
/* Aquí vivían dos herramientas de desarrollo: "Comparar", que superponía la
   foto sobre la hoja en modo diferencia, y la auditoría que imprimía en la
   consola una tabla de la hoja viva contra la foto. Sirvieron para cazar los
   defectos del pliegue —el texto que brincaba, los espacios que cambiaban— y
   ya cumplieron. Se van con su botón. */


/* ---------- controles ---------- */
function setVersion(v){
  /* Conservar el lugar por REFERENCIA, no por número de hoja: los textos de
     dos versiones tienen largos distintos, así que la hoja 3 de una no es la
     hoja 3 de la otra. Estabas en 1:35 y aparecías en 1:40. */
  const donde = plano[startIdx];
  version = v; paginasSucias = true;
  rehacerPlano();
  renderPage();
  if (donde){
    const k = plano.findIndex(x => x.cap === donde.cap && x.vers === donde.vers);
    if (k >= 0){
      /* Aterriza en la hoja que CONTIENE tu versículo. No puede empezar en
         él: las hojas son fijas, como en papel, y forzarlas a arrancar en un
         versículo arbitrario sería volver al scroll disfrazado. Lo que sí
         hace falta es señalarlo, porque el texto de al lado es distinto y
         sin la marca parece que saltó de sitio. */
      /* Con la paginación sincronizada los cortes coinciden, así que esto
         normalmente ni se mueve; queda como red por si una versión no se
         pudo sincronizar (versificación distinta). */
      if (paginaDe(k) !== paginaActual){ paginaActual = paginaDe(k); renderPage(); }
      const inicio = plano[startIdx];
      const igual = inicio && inicio.cap === donde.cap && inicio.vers === donde.vers;
      /* El destello señala el versículo cuando la hoja no arranca en él, que
         es todo lo que había que contar. El aviso escrito decía además la
         abreviatura y el pasaje —lo mismo que ya dicen el rótulo de abajo y la
         hoja— en cada cambio de versión, incluido el caso normal en que no
         había nada que advertir. */
      if (!igual) destacar(donde.cap, donde.vers, '');
    }
  }
  $('cred').textContent = D.versiones[v].nombre + ' — ' + D.versiones[v].licencia + ' · vía eBible.org';
}
/* CAMBIAR DE VERSIÓN ES LO MÁS CARO QUE HACE EL PROGRAMA, y hasta ahora no lo
   decía. Rehace el plano del libro entero y lo vuelve a paginar: con la CPU
   frenada a la cuarta parte —un teléfono de los de verdad— eso son quince
   segundos de hilo trabado. Quince segundos en los que la pantalla se queda
   exactamente igual, sin responder a nada, después de haber tocado un botón.
   La lectura obvia es que el toque no entró, así que se toca otra vez.

   Se enciende el mismo disco que ya espera los saltos entre libros, que es la
   respuesta correcta: no hay barra de progreso posible —el trabajo pasa en una
   sola tarea que no se puede partir— pero sí hay «estoy en ello», que es lo
   que faltaba.

   Y el trabajo arranca al CUADRO SIGUIENTE, no aquí mismo. Encender el disco
   solo cambia el DOM; si a continuación se traba el hilo, el navegador nunca
   llega a pintarlo y el disco aparecería justo cuando ya sobra. trasPintar
   cede dos cuadros —uno para calcular los estilos y otro para pintarlos—
   antes de soltar el trabajo pesado.

   El apagado va en un finally: si la repaginación falla a mitad, lo peor que
   puede pasar es que se pierda el cambio de versión, no que el disco se quede
   girando para siempre encima de la hoja. */
function cambiarVersion(v){
  if (!v || v === version) return;
  mostrarBuscando('cambiando de versión…');
  trasPintar(() => {
    try { setVersion(v); }
    finally { quitarBuscando(); }
  });
}
/* los clics de versión se enganchan al armar los botones, más abajo */
/* El margen es el default mientras la hoja dé el ancho; en celular no cabe
   y la glosa se va abajo del versículo. Con dos o tres columnas el margen
   pierde la referencia por alineación, pero la conserva por número de
   versículo, así que sigue siendo una elección válida. */
const placementPorOmision = () => (stage.offsetWidth >= 420 ? 'margin' : 'below');
function setPlacement(p){
  /* Cambiar de disposición cambia lo que la firma significa —al margen no
     cuenta nada, abajo cuentan todas las notas— así que se vuelve a sembrar.
     Ya se repagina de todas formas, y esa repaginación es la que deja el
     reparto acorde con la firma nueva. */
  placement = p; paginasSucias = true; firmaCuerpo = firmaDelCuerpo();
  document.querySelectorAll('[data-lay]').forEach(x => x.classList.toggle('active', x.dataset.lay===p));
}
function setColumns(n){
  columns = n; paginasSucias = true;
  document.querySelectorAll('[data-cols]').forEach(x => x.classList.toggle('active', +x.dataset.cols===n));
  if (!placementTocado) setPlacement(placementPorOmision());
}
document.querySelectorAll('[data-cols]').forEach(b => b.onclick = () => { setColumns(+b.dataset.cols); renderPage(); });
document.querySelectorAll('[data-lay]').forEach(b => b.onclick = () => {
  placementTocado = true; setPlacement(b.dataset.lay); renderPage();
});
/* LOS TAMAÑOS, EN UN SOLO SITIO. El mínimo y el máximo estaban escritos tres
   veces —en A+, en A− y en la validación de los ajustes— y ahora hacía falta
   una cuarta para armar la lista. Cuatro copias de un rango es una de más
   para que alguna se quede corta el día que se mueva. */
const FS_MIN = 10, FS_MAX = 26;
const TAMANOS = Array.from({length: FS_MAX - FS_MIN + 1}, (_, i) => FS_MIN + i);
$('fsAhora').innerHTML = TAMANOS.map(n => '<option value="' + n + '">' + n + '</option>').join('');
/* A+ y A− se quedan: la lista sirve para ir lejos de un tirón —de 15 a 22 sin
   siete clics— y los botones para el ajuste fino, que es lo que de verdad se
   hace cuando estás leyendo y algo no acaba de caer. Cada uno hace bien lo
   que el otro hace mal, así que no se estorban. */
function reflejarTamano(){
  $('fsAhora').value = String(fontSize);
  const g = $('fsGlosaAhora');
  if (g) g.value = String(fontSizeGlosa);
}
function ponerTamano(n){
  const v = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(n)));
  if (v === fontSize){ reflejarTamano(); return; }   // rebota el select si topó
  fontSize = v; paginasSucias = true; renderPage();
}
function ponerTamanoGlosa(n){
  const v = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(n)));
  if (v === fontSizeGlosa){ reflejarTamano(); return; }
  fontSizeGlosa = v;
  if (placement !== 'margin') paginasSucias = true;
  renderPage();
}
$('fsUp').onclick    = () => ponerTamano(fontSize + 1);
$('fsDown').onclick  = () => ponerTamano(fontSize - 1);
$('fsAhora').onchange = e => ponerTamano(+e.target.value);
$('fsGlosaAhora').innerHTML = TAMANOS.map(n => '<option value="' + n + '">' + n + '</option>').join('');

$('fsGlosaDown').onclick  = () => ponerTamanoGlosa(fontSizeGlosa - 1);

/* EL SEPIA. En 'input' y no en 'change' para que el papel se entinte mientras
   arrastras: elegir un color a ciegas y verlo al soltar es elegir dos veces.
   No se marca paginasSucias —el color no cambia cuánto texto cabe, así que
   repaginar sería tirar el trabajo para llegar al mismo sitio— pero la firma
   sí lleva el sepia, así que la foto del pliegue se rehace sola. */
$('sepia').oninput = e => {
  sepia = Math.max(0, Math.min(100, +e.target.value || 0));
  $('sepiaAhora').textContent = sepia;
  /* Sin fundido: los rótulos tienen que llegar al color nuevo dentro de esta
     misma tarea, o la foto del pliegue los retrata con el tono de antes. */
  sinFundido(renderPage);
};
/* EL CONTRASTE. También en 'input', y por la misma razón que el sepia: se
   busca el punto arrastrando, no soltando y volviendo a probar.

   LO QUE NO HACE, que es casi todo. No marca paginasSucias ni repagina: un
   filtro no cambia el ancho de una letra, así que la hoja parte por el mismo
   sitio antes y después. No llama a renderPage: no hay nada que recomponer,
   la variable de CSS repinta las dos superficies sola. Y no invalida la foto
   del pliegue —el contraste no está DENTRO de ella— así que arrastrar el riel
   no tira el trabajo de la instantánea.
   Y no toca el sepia: son dos números aparte, cada uno con su riel y su hueco
   en los ajustes guardados. Mover uno después del otro deja los dos puestos.

   Se guarda aquí mismo porque este es el único camino: el sepia se persiste de
   rebote —renderPage llama a guardarAjustes al final— y como éste no
   repagina, sin esta línea el ajuste solo sobreviviría si además pasaras
   hoja. Cuesta lo mismo que ya cuesta mover el sepia. */
$('contraste').oninput = e => {
  contraste = Math.max(50, Math.min(200, +e.target.value || 125));
  $('contrasteAhora').textContent = contraste + '%';
  aplicarFiltros();
  guardarAjustes();
};
/* EL BRILLO, calcado del contraste: mismo evento, mismas razones y la misma
   lista de cosas que NO hace —ni repagina, ni marca páginas sucias, ni rehace
   la foto del pliegue—. Llama a la misma aplicarFiltros, así que mover este
   riel deja el contraste donde estaba y al revés. */
$('brillo').oninput = e => {
  brillo = Math.max(50, Math.min(150, +e.target.value || 100));
  $('brilloAhora').textContent = brillo + '%';
  aplicarFiltros();
  guardarAjustes();
};

/* Y aquí vivía "Ejemplo", que sembraba cinco marcas de muestra sobre Marcos.
   Servía para probar el anclaje entre versiones cuando no había nada guardado;
   ahora que tienes glosas de verdad, sembrar encima solo estorbaría. */

function updateReadout(){
  const pos = plano[startIdx], fin = plano[Math.max(0,nextIdx-1)];
  /* Termómetro del anclaje: cuántas marcas cayeron en su sitio exacto y
     cuántas hubo que reencontrar. Escrito en español, no en claves. */
  const NOMBRE_GRADO = { exacta:['exacta','exactas'], cita:['por su cita','por su cita'],
                         aprox:['aproximada','aproximadas'],
                         versiculo:['al versículo entero','al versículo entero'] };
  const enPalabras = (k, v) => v + ' ' + ((NOMBRE_GRADO[k] || [k,k])[v === 1 ? 0 : 1]);
  const grados = {};
  let total = 0;
  for (const m of marcas){
    if (m.libro !== LIBRO) continue;
    const g = (RES.get(m.id) || {}).grado;
    if (g){ grados[g] = (grados[g] || 0) + 1; total++; }
  }
  const partes = Object.entries(grados);
  const resumen = !total ? 'sin marcas'
    : partes.length === 1 && partes[0][0] === 'exacta'
      ? total + (total === 1 ? ' marca exacta' : ' marcas, todas exactas')
      : total + ' marcas: ' + partes.map(([k,v]) => enPalabras(k,v)).join(', ');
  const cpl = medidaLinea();
  const juicio = cpl < 45 ? ' (corta)' : cpl > 75 ? ' (larga)' : '';
  /* Esto es ESTADO, no un aviso: describe la hoja que estás viendo y cambia en
     cada repintado. Mandarlo al aviso flotante lo convertía en un cartel que
     saluda al abrir la aplicación y vuelve a salir cada vez que pasas hoja,
     diciendo algo que nadie pidió. Se guarda para consulta —estado() en la
     consola— y no interrumpe a nadie. */
  window.__estado = nombreDe(LIBRO) + ' ' + pos.cap + ':' + pos.vers + '–' + fin.cap + ':' + fin.vers +
    ' · ' + cpl + ' car/línea' + juicio +
    ' · ' + D.versiones[version].abrev + ' · ' + resumen;
}
/* ---------- índice de glosas ---------- */
/* LA LISTA DE GLOSAS. Cada una se ve como se ve en el margen: mismo tipo de
   letra, mismo tamaño, mismo color de su marca. La referencia visual vale más
   que el orden alfabético — reconoces "la verde larga" antes de leer nada.

   Van en un flexbox que las deja crecer hasta donde alcance el ancho, con un
   mínimo para que ninguna quede tan angosta que la nota se parta en tiras.

   Ya no hay encabezados de capítulo: con el filtro por libro la lista puede
   cruzar varios, así que la referencia completa va dentro de cada glosa, que
   además es donde se lee sin perder de vista la nota. */
function pintarIndice(){
  const cont = $('indice');
  if (!cont || !rGlosas.abierto) return;      /* solo cuando su panel está a la vista */
  const lista = marcas.filter(m => m.nota && enLista(m));
  const peso = new Map(ordenIndice.map((id, i) => [id, i]));
  lista.sort((a,b) => {
    const ha = peso.has(a.id), hb = peso.has(b.id);
    if (ha && hb) return peso.get(a.id) - peso.get(b.id);
    if (ha) return -1;
    if (hb) return 1;
    return CANON.findIndex(x=>x.id===a.libro) - CANON.findIndex(x=>x.id===b.libro) ||
           a.cap - b.cap || a.vers - b.vers;
  });
  if (!lista.length){
    cont.innerHTML = '<span class="ix-vacio">ninguna glosa pasa los filtros de ahorita</span>';
    return;
  }
  const variosLibros = true;
  /* Ocho píxeles menos, y no son de adorno: MARGIN_W() es el ancho de la
     COLUMNA del margen, y la nota que va dentro no lo ocupa entero —.gl-margin
     se estrecha 4px por lado para que las esquinas del giro tengan a dónde
     asomarse—. Copiando la columna, la del panel salía 8px más ancha que la de
     la hoja y partía los renglones un poco más tarde: el espejo casi cuadraba,
     que en un espejo es no cuadrar. */
  cont.style.setProperty('--ancho-glosa', Math.max(60, MARGIN_W() - 8) + 'px');
  cont.style.setProperty('--fs', fontSize + 'px');
  cont.style.setProperty('--fs-glosa', fontSizeGlosa + 'px');
  cont.innerHTML = lista.map(m => {
    const nb = backDe(m.cap, m.vers).length;
    const letra = (REFS.get(m.id) || '').toString().replace(/^\d+/, '');
    const ref = (variosLibros ? abrevDe(m.libro) + ' ' : '') + m.cap + ':' + m.vers + letra;
    /* la MISMA forma que en el margen: esquinas, aire, pluma y sombra salen
       del id, así que la de la lista y la de la hoja son la misma nota */
    const forma = formaOrganica(m);
    return '<div class="ix-item gl g-' + m.color +
      (glosasElegidas.has(m.id) ? ' elegida' : '') + '" data-ir="' +
      m.libro + ':' + m.cap + ':' + m.vers + ':' + letra + '"' +
      ' data-gl-id="' + esc(m.id) + '"' +
      ' style="' + forma.css + 'padding-bottom:20px;">' +
      '<span class="gl-ref">' + esc(ref) + '·</span>' + esc(m.nota) +
      /* EL MISMO MARCADO QUE EN LA HOJA. El espejo existe para que la lista
         parta los renglones donde los parte el margen; construir la etiqueta
         de otra manera aquí lo descuadra, y un espejo que casi cuadra es un
         espejo que no cuadra. */
      etiquetasHTML(m) +
      (nb ? '<span class="gl-cuenta">‹' + nb + '</span>' : '') +
      '<button type="button" class="ix-asa" aria-label="Reordenar glosa" title="Arrastra para reordenar">' +
        '<span></span><span></span><span></span><span></span><span></span><span></span>' +
      '</button></div>';
  }).join('');
}
/* Los botones "Libros" e "Índice" salieron de la barra de abajo: la burbuja
