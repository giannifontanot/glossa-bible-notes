/* Un clic pasa la hoja; dos abren el índice. Como el primer clic de un
   doble es indistinguible de un clic solo, el paso de hoja espera un
   instante por si viene el segundo. Es el único retardo del sistema y no
   hay forma de evitarlo compartiendo el mismo blanco. */
const ESPERA_DOBLE = 240;
let relojClic = null;
/* Un clic pasa UNA hoja, y la voltea desde la altura exacta donde tocaste:
   el gesto se lee como si la hubieras empujado tú desde ahí. Nada de bonche
   —el bonche es para viajes largos, no para la hoja de al lado. */
function pasarHoja(s, clientY, intento){
  const destino = paginaActual + (s === 'right' ? 1 : -1);
  if (destino < 0 || destino >= paginas.length) return;
  volverA = null;
  sizeCanvas();
  if (!pageImg || snapStale()){
    if ((intento || 0) > 3){ paginaActual = destino; renderPage(); return; }
    makeSnapshot();
    setTimeout(() => pasarHoja(s, clientY, (intento || 0) + 1), 130);
    return;
  }
  const viejo = pageImg;
  const r = pg.getBoundingClientRect();
  /* Sin punto de agarre válido, el centro de la hoja. Antes, quien llamara sin
     clientY producía NaN y el doblez se dibujaba en ninguna parte: la hoja
     cambiaba de golpe, sin animación. Un valor que no es número no se debe
     propagar en silencio hasta la geometría. */
  const y = Number.isFinite(clientY) ? clientY - r.top : H/2;
  const anclaY = Math.min(Math.max(y, 0), H);
  side = s;
  fotoDeHoja(destino, img => {
    if (!img){ paginaActual = destino; renderPage(); return; }
    pageImg = viejo; bajoImg = img;
    animarHojas(1, rnd(620, 780), () => {
      hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; anchor = F = null;
      paginaActual = destino;
      renderPage();
      fx.style.display = 'none'; pg.classList.remove('hidden');
    }, anclaY);
  });
}
function bordeArriba(ev, s){
  if (folding){ ocultarHuella(); endFold(); return; }
  const g = gestoPendiente; gestoPendiente = null;
  if (!g || g.s !== s){ ocultarHuella(); return; }
  const quieto = Math.hypot(ev.clientX - g.x, ev.clientY - g.y) < UMBRAL_ARRASTRE;
  /* Gesto descartado —te moviste demasiado, o te quedaste apoyado más de lo
     que dura un clic—: la huella se va sin que pase nada, que es exactamente
     lo que hay que contar. */
  if (!quieto || performance.now() - g.t > 600){ ocultarHuella(); return; }
  clearTimeout(relojClic);
  const alturaClic = g.y;                    // la hoja gira desde donde tocaste
  /* Y AQUÍ es donde la huella se gana el sueldo: sigue encendida durante los
     240ms de espera del doble clic, que es el rato en que el programa ya te
     entendió y todavía no mueve nada. Se apaga en el mismo cuadro en que
     arranca el giro —ni antes, que devolvería el hueco a otro sitio, ni
     después, que la dejaría flotando sobre una hoja que ya se fue. */
  relojClic = setTimeout(() => {
    relojClic = null; ocultarHuella(); pasarHoja(s, alturaClic);
  }, ESPERA_DOBLE);
}
function endFold(){
  if (!folding) return;
  folding = false;
  animate((side === 'right' ? anchor.x - F.x : F.x - anchor.x) > W*.45);
}
/* El índice baja del filo de arriba; los laterales solo pasan hoja. Cada
   borde hace una cosa y se acabaron los gestos compartidos. */
/* Un solo clic: este filo no hace nada más, así que no hay ambigüedad que
   resolver ni ventana de espera que aguantar. */
/* EL ANCHO DE LA HOJA EN TELÉFONO, ESCRITO A MANO EN EL ELEMENTO.

   Llevamos tres intentos poniéndolo en el CSS y el papel seguía midiendo unos
   50px más que la pantalla en vez de 193. No sé cuál de las reglas le está
   ganando —hay tres hojas de estilo en juego: la de la aplicación, PAGE_CSS
   inyectada después, y lo que el guion escribe en el elemento— y ya no vale la
   pena averiguarlo: un estilo en línea marcado como importante no lo puede
   vencer nada. Se acabó la discusión.

   Se recalcula al cambiar de tamaño porque girar el teléfono cambia si estamos
   o no en modo angosto. */
const COL_GLOSA = 240, HUECO_COL = 11, ORILLA = 16;
/* La columna de texto ya no mide 340 fijos: mide LO QUE MIDE LA PANTALLA. El
   usuario que ya sabe que a la derecha viven las glosas no necesita verlas
   asomarse, y esos 90px que se gastaban en insinuarlo rinden más como texto:
   en un teléfono de 430px son 56 caracteres por renglón en vez de 48. */
function medirHojaTelefono(){
  const inner = pg.querySelector('.pg-inner');
  if (!inner) return;
  const COL_TEXTO = Math.max(240, pg.clientWidth);
  const fijar = (el, props) => {
    for (const k in props){
      if (props[k] === null) el.style.removeProperty(k);
      else el.style.setProperty(k, props[k], 'important');
    }
  };
  if (!enTelefono()){
    const g = ghost.querySelector('.pg-inner');
    fijar(inner,   { width:null, 'max-width':null });
    fijar(pgBody,  { flex:null, width:null, 'min-width':null });
    fijar(pgMargin,{ flex:null, width:null, 'min-width':null, 'margin-left':null });
    if (g) fijar(g,{ width:null, 'max-width':null });
    fijar(ghostBody,  { flex:null, width:null, 'min-width':null });
    fijar(ghostMargin,{ flex:null, width:null, 'min-width':null, 'margin-left':null });
    return null;
  }
  /* --col-texto viaja al CSS para que los rótulos se centren sobre la columna
     y no sobre la hoja: como la columna ahora es la pantalla, quedan centrados
     en pantalla, que es donde se leen. */
  pg.style.setProperty('--col-texto', COL_TEXTO + 'px');
  ghost.style.setProperty('--col-texto', COL_TEXTO + 'px');
  fijar(inner,    { width:(COL_TEXTO + HUECO_COL + COL_GLOSA) + 'px', 'max-width':'none' });
  fijar(pgBody,   { flex:'0 0 ' + COL_TEXTO + 'px', width:COL_TEXTO + 'px',
                    'min-width':COL_TEXTO + 'px' });
  fijar(pgMargin, { flex:'0 0 ' + COL_GLOSA + 'px', width:COL_GLOSA + 'px',
                    'min-width':COL_GLOSA + 'px', 'margin-left':HUECO_COL + 'px' });
  /* Y EL MOLDE FANTASMA, con las mismas medidas. Aquí estaba el defecto que se
     veía al pasar hoja: la foto se compone en #ghost, y el fantasma no llevaba
     el acomodo del teléfono. Como sí llevaba el margen de 240px pero con el
     ancho de la PANTALLA y no el del papel, al texto le quedaban 150px y salía
     esa columnita justificada. La hoja que se voltea tiene que ser la misma
     hoja que estabas leyendo, o el pliegue deja de ser un pliegue. */
  const ginner = ghost.querySelector('.pg-inner');
  if (ginner){
    fijar(ginner,     { width:(COL_TEXTO + HUECO_COL + COL_GLOSA) + 'px', 'max-width':'none' });
    fijar(ghostBody,  { flex:'0 0 ' + COL_TEXTO + 'px', width:COL_TEXTO + 'px',
                        'min-width':COL_TEXTO + 'px' });
    fijar(ghostMargin,{ flex:'0 0 ' + COL_GLOSA + 'px', width:COL_GLOSA + 'px',
                        'min-width':COL_GLOSA + 'px', 'margin-left':HUECO_COL + 'px' });
  }
  return { texto:COL_TEXTO, glosa:COL_GLOSA, hueco:HUECO_COL, orilla:ORILLA };
}
window.addEventListener('resize', medirHojaTelefono);
/* Un diagnóstico a la mano: en la consola se escribe medida() y contesta lo
   que de verdad mide la hoja. Si "papel" no es 623 en un teléfono, el ancho no
   se aplicó; si lo es y aun así no corre, el problema es del desplazamiento y
   no del acomodo. Dos números y se acabaron las adivinanzas. */
window.estado = () => window.__estado;
window.medida = () => ({
  compilacion: window.GLOSS_BUILD,
  enTelefono: enTelefono(),
  ventana: pg.clientWidth,
  papel: pg.scrollWidth,
  seCorre: pg.scrollWidth - pg.clientWidth,
  columnaTexto: pgBody.offsetWidth,
  columnaGlosa: pgMargin.offsetWidth
});

/* CORRER EL PAPEL ARRASTRÁNDOLO DESDE DONDE NO HAY TEXTO.

   Ésta es la manera directa: agarras el papel por cualquier parte vacía —el
   margen, el hueco entre columnas, la orilla, el blanco de abajo— y lo
   corres. Sobre el texto no, porque ahí arrastrar significa seleccionar, y
   seleccionar es como se hacen las glosas: quitarle eso al texto sería
   cambiar una cosa que sirve por otra.

   Sale solo cuando de verdad hay papel de sobra, así que en escritorio ancho
   ni se entera. Y no estorba a los clics: hasta que no mueves 4px no se
   considera arrastre, de modo que un toque limpio sigue siendo un toque. */
(function correrPapel(){
  /* EL CAJÓN, CON PALANCA.

     El problema de las versiones anteriores era que yo decidía. Se cerraba
     solo por cercanía, o se cerraba solo por impulso, y en los dos casos el
     movimiento terminaba sin ti. Ayudar no es tomar el control: es hacer que
     lo que quieres cueste menos trabajo.

     Así que la ayuda ya no está en decidir por ti, está en la PALANCA: un
     píxel de ratón mueve diez de papel. Sigues tú al mando en todo momento
     —puedes dejar el cajón donde se te dé la gana, a un tercio, a la mitad—
     pero recorrerlo entero cuesta 22px de movimiento en vez de 219.

     Los imanes se quedan, y solo hacen lo que hace un imán: si SUELTAS cerca
     de una punta, el cajón termina de acomodarse. Ya no te arrebatan el
     movimiento a media carrera. */
  const PALANCA = 5;       /* px de papel por cada px de ratón */
  const DESPEGUE = 6;      /* px de RATÓN que hay que jalar para soltar el cajón */
  const IMAN = 45;         /* px de PAPEL: qué tan cerca de una punta atrae */
  let activo = false, despegado = false, x0 = 0, s0 = 0, puntero = null, reloj = null;
  const sobraPapel = () => pg.scrollWidth - pg.clientWidth > 4;
  /* El número de capítulo SÍ se puede agarrar. Es un blanco grande —ocupa casi
     un tercio del ancho en la primera hoja de cada capítulo— y nadie lo
     selecciona nunca para copiar: de hecho ya está marcado como no
     seleccionable, porque es aparato y no texto bíblico. Con el texto ocupando
     ahora todo el ancho de la pantalla, hacían falta asideros, y éste estaba
     ahí sin usarse.
     Los números de versículo quedan fuera aunque también sean aparato: son
     chiquitos, y algunos llevan encima el contador de citas, que se toca. */
  const intocable = t => t.closest && t.closest('.v, .gl, .ref, .vn, button, a, select, input, textarea, .chip');
  const tope = () => pg.scrollWidth - pg.clientWidth;
  const poner = x => { pg.scrollLeft = Math.min(Math.max(x, 0), tope()); };

  /* CÓMO SE ACOMODA EL CAJÓN. Solo frenado, sin rebote: el rebote se probó y
     se veía como un tic, no como madera. Lo que sí aporta es la cuarta
     potencia —frena tarde y fuerte, y ese arrastre final es lo que se lee como
     peso—: en los últimos 100ms el papel recorre cuatro píxeles de 241. */
  const DURA_ACOMODO = 430;
  function irA(meta){
    cancelAnimationFrame(reloj);
    const desde = pg.scrollLeft, tramo = meta - desde;
    if (Math.abs(tramo) < 1){ poner(meta); return; }
    const t0 = performance.now();
    (function paso(ahora){
      const k = Math.min(1, (ahora - t0) / DURA_ACOMODO);
      poner(desde + tramo * (1 - Math.pow(1 - k, 4)));
      if (k < 1) reloj = requestAnimationFrame(paso);
      else poner(meta);
    })(t0);
  }

  /* .cap vive DENTRO de .v, así que la exclusión del versículo lo atraparía;
     por eso se le pregunta primero a él. */
  const agarrable = t => (t.closest && t.closest('.cap')) || !intocable(t);
  pg.addEventListener('pointerdown', ev => {
    if (!sobraPapel() || !agarrable(ev.target)) return;
    cancelAnimationFrame(reloj);
    activo = true; despegado = false;
    x0 = ev.clientX; s0 = pg.scrollLeft; puntero = ev.pointerId;
    try { pg.setPointerCapture(puntero); } catch(e){}
    pg.classList.add('agarrado');
  });

  pg.addEventListener('pointermove', ev => {
    if (!activo || ev.pointerId !== puntero) return;
    const d = ev.clientX - x0;
    if (!despegado){
      /* Trabado hasta que jalas de verdad. El umbral se mide en píxeles de
         RATÓN, no de papel: con la palanca puesta, 45px de papel serían menos
         de cinco de mano y no se sentiría trabado en absoluto. */
      if (Math.abs(d) < DESPEGUE) return;
      despegado = true;
      /* arranca desde donde está, sin brincar los píxeles del umbral */
      x0 = ev.clientX + (d < 0 ? DESPEGUE : -DESPEGUE);
    }
    ev.preventDefault();
    poner(s0 - (ev.clientX - x0) * PALANCA);
  });

  const soltar = ev => {
    if (!activo) return;
    if (ev && ev.pointerId != null && ev.pointerId !== puntero) return;
    const salio = despegado;
    activo = false; despegado = false;
    pg.classList.remove('agarrado');
    try { pg.releasePointerCapture(puntero); } catch(e){}
    if (!salio) return;
    /* AQUÍ, y solo aquí, actúan los imanes: al soltar. Si quedaste cerca de una
       punta, el cajón termina de acomodarse; si quedaste en medio, ahí se
       queda, porque ahí lo dejaste tú. */
    const t = tope(), x = pg.scrollLeft;
    /* Se llama SIEMPRE que quedaste en una punta o cerca de ella, aunque ya
       estés exactamente en el tope: ahí irA() ya no viaja, solo rebota. */
    if (x <= IMAN) irA(0);
    else if (x >= t - IMAN) irA(t);
  };
  pg.addEventListener('pointerup', soltar);
  pg.addEventListener('pointercancel', soltar);
  /* pointerleave NO se escucha: al cruzar sobre un filo —hermano de #pg que
     está encima— el navegador anuncia que el puntero salió, y obedecer eso
     cancelaba el arrastre a media carrera. */
  pg.addEventListener('lostpointercapture', soltar);
})();

/* CORRER EL PAPEL CON RATÓN O TRACKPAD.

   En un teléfono el desliz con el dedo ya funciona solo: es desplazamiento
   nativo. En una computadora NO, y no es un defecto nuestro: arrastrar con el
   ratón nunca desplaza una caja —eso selecciona texto—, y como escondimos la
   barra de desplazamiento tampoco quedaba de dónde jalar. Se quedaba uno
   arrastrando sin que pasara nada, que es justo lo que te pasó.

   Aquí la rueda vertical se traduce en movimiento horizontal, porque en esta
   caja no hay nada que desplazar hacia abajo: rodar hacia abajo trae las
   glosas, rodar hacia arriba devuelve el texto. Y solo se toma la rueda
   mientras quede papel por correr en esa dirección; si no, se deja pasar para
   no secuestrar el desplazamiento de la página. */
pg.addEventListener('wheel', ev => {
  const sobra = pg.scrollWidth - pg.clientWidth;
  if (sobra < 4) return;
  /* La rueda vertical da pasos chicos —unos 40px por muesca— y con 233px que
     correr eso son seis muescas para llegar. Se multiplica para que dos o tres
     basten. El gesto lateral del trackpad no se toca: ése ya viene con la
     distancia que el dedo pidió. */
  const lateral = Math.abs(ev.deltaX) > Math.abs(ev.deltaY);
  const paso = lateral ? ev.deltaX : ev.deltaY * 2.6;
  const destino = pg.scrollLeft + paso;
  if ((paso > 0 && pg.scrollLeft >= sobra - 1) ||
      (paso < 0 && pg.scrollLeft <= 1)) return;
  ev.preventDefault();
  pg.scrollLeft = Math.min(Math.max(destino, 0), sobra);
}, { passive:false });

/* Cuando el papel ya está corrido hasta las glosas, la insinuación del borde
   sobra: ya viste lo que había que ver. Se apaga sola y vuelve al regresar. */
pg.addEventListener('scroll', () => {
  const alFondo = pg.scrollLeft >= pg.scrollWidth - pg.clientWidth - 4;
  stage.classList.toggle('hasta-el-fondo', alFondo);
  if (folding) fx.style.left = (-pg.scrollLeft) + 'px';
}, { passive:true });

/* Las dos puertas a la burbuja, cada una a su sección. */
$('pgCabeza').addEventListener('click', e => { e.preventDefault(); alternarBurbuja('libros'); });
$('pgVersion').addEventListener('click', e => { e.preventDefault(); alternarBurbuja('formato'); });

[['right', edgeR], ['left', edgeL]].forEach(([s, el]) => {
  el.addEventListener('pointerdown', e => bordeAbajo(e, s));
  el.addEventListener('pointermove', e => bordeMueve(e, s));
  el.addEventListener('pointerup',   e => bordeArriba(e, s));
  el.addEventListener('pointercancel', () => { gestoPendiente = null; ocultarHuella(); if (folding) endFold(); });
});
function animate(turn){
  const from = {...F};
  /* El espejo del ancla: ahí la línea de doblez alcanza el borde opuesto y
     el giro se completa de verdad. */
  const to = turn ? {x: side==='right' ? -W*1.06 : W*2.06, y:from.y} : {x:anchor.x, y:anchor.y};
  const dur = turn?420:200, t0 = performance.now();
  (function step(now){
    const k = Math.min(1,(now-t0)/dur), e = turn ? 1-Math.pow(1-k,3) : 1-Math.pow(1-k,2);
    alfaTop = turn ? desvanecer(e) : 1;
    F = {x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e};
    drawFold();
    if (k<1) return requestAnimationFrame(step);
    if (turn){
      paginaActual += (side === 'right' ? 1 : -1);
      volverA = null;                       // pasar hojas a mano cancela el regreso
      renderPage();
    }
    fx.style.display='none'; pg.classList.remove('hidden'); anchor=F=null; updateReadout();
  })(t0);
}

/* ============================================================
   SALTO CON VUELTA DE HOJA. Aunque el destino esté a cinco hojas,
   se anima UNA sola vuelta y se aterriza ahí: cinco sería mareador.
   ============================================================ */
/* Voltea de la hoja `desde` a la hoja `hacia`, con sus dos fotos. */
function pasoAnimado(desde, hacia, dur, hojas, cb){
  side = hacia > desde ? 'right' : 'left';
  sizeCanvas();
  let arriba = null, abajo = null, faltan = 2;
  const arrancar = () => {
    if (!arriba){ cb(); return; }
    pageImg = arriba; bajoImg = abajo;
    animarHojas(hojas, dur, cb);
  };
  fotoDeHoja(desde, i => { arriba = i; if (!--faltan) arrancar(); });
  fotoDeHoja(hacia, i => { abajo  = i; if (!--faltan) arrancar(); });
}

/* El puño de hojas volteándose, con las fotos ya puestas en pageImg y
   bajoImg. Lo usan los saltos dentro de un libro y el cambio de libro. */
/* `anclaY` fija el punto de agarre; sin él se elige al azar. Un clic en el
   filo lo pasa, para que la hoja gire desde donde pusiste el dedo. */
function animarHojas(hojas, dur, cb, anclaY){
  folding = true;
  pg.classList.add('hidden'); fx.style.display = 'block';

  const bordeX = side === 'right' ? W : 0;
  anchor = { x: bordeX,
             y: anclaY == null ? rnd(H*0.20, H*0.80)
                               : Math.min(Math.max(anclaY, H*0.06), H*0.94) };

  /* EL TIRO DIAGONAL. Antes la salida era un punto horizontal con un
     empujoncito vertical fijo: como el recorrido horizontal tiene que ser
     larguísimo para que el giro se complete, ese empujón quedaba en 4° y
     se veía recto. Ahora se elige primero el ÁNGULO y de ahí se calcula el
     largo —2·ancho dividido entre el coseno— así el ángulo se conserva
     entero por muy largo que sea el tiro.
     Y se tira hacia el centro de la hoja: jalar hacia la orilla más cercana
     saca la línea de doblez de la página antes de tiempo. */
  const esquinas = [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  const tiro = (y0, maxAng) => {
    const hacia = y0 < H*0.42 ? 1 : y0 > H*0.58 ? -1 : (Math.random() < .5 ? -1 : 1);
    const ang = hacia * rnd(maxAng*0.45, maxAng);
    const dir = side === 'right' ? -1 : 1;
    const ux = dir*Math.cos(ang), uy = Math.sin(ang);
    /* El largo se calcula proyectando las cuatro esquinas sobre la dirección
       del jalón: al inclinar el tiro, la hoja "mide más" en esa dirección y
       hay que recorrer más para que el doblez la cruce entera. */
    let alcance = 0;
    for (const p of esquinas)
      alcance = Math.max(alcance, (p.x - bordeX)*ux + (p.y - y0)*uy);
    const largo = 2*alcance*rnd(1.04, 1.12);
    return { x: bordeX + largo*ux, y: y0 + largo*uy };
  };
  const meta = tiro(anchor.y, 0.30);          // hasta 17°

  /* Aquí estuvo un rato el "arranque adelantado": la animación empezaba ya
     avanzada para saltarse el tramo en que el doblez viaja por fuera de la
     pantalla. En el papel sonaba bien y en la mano no: la hoja aparecía a
     media vuelta y el gesto perdía su principio. Se probó y se quitó.
     El pliegue nace en el borde real del papel y recorre todo su camino,
     aunque el primer tercio no se vea. */
  hojasExtra = [];
  for (let i = 1; i < hojas; i++){
    const a = { x: bordeX, y: rnd(H*0.12, H*0.88) };
    /* Cada hoja sale cuando se le da la gana y tarda lo suyo; si todas
       terminaran juntas se volvería a ver a compás. */
    /* La ventana de salida se abre según cuántas sean: con pocas conviene que
       vayan casi juntas, con muchas hay que repartirlas o se ven como una sola
       masa gruesa en vez de como hoja tras hoja tras hoja. */
    const retraso = rnd(0, Math.min(0.72, 0.24 + 0.028*hojas));
    /* Cada hoja tarda lo suyo en cruzar, y ese rato NO se reparte con las
       demás: antes la duración era el pedazo que sobraba después del retraso,
       así que las últimas cruzaban en un tercio del tiempo y se veían como un
       latigazo. Ahora todas tardan parecido y las rezagadas simplemente
       terminan después de que la hoja de arriba ya se volteó. */
    hojasExtra.push({ a, b: tiro(a.y, 0.34),
                      retraso, dur: rnd(0.34, 0.52) });
  }
  hojasExtra.sort((x,y) => y.retraso - x.retraso);   // las más rezagadas, al fondo

  /* EL RELOJ DE LA ANIMACIÓN AVANZA POR CUADROS, NO POR RELOJ DE PARED.
     Con (now - t0) un tirón del hilo principal se come la animación: si
     calcular la hoja destino tarda 700 ms y la animación dura 1200, al pintar
     el primer cuadro ya pasó más de la mitad y el bonche aparece a mitad de
     camino o directamente terminado. Eso es exactamente lo que se veía —entre
     más tardaba el salto, más corto el manojo— y era peor al regresar, porque
     ahí hay que rearmar el libro de origen.
     Sumando los saltos entre cuadros con un tope, un tirón largo cuenta como
     un cuadro normal: la animación se pausa, no se salta. */
  let t = 0, previo = performance.now();
  (function paso(now){
    t += Math.min(now - previo, 45);          // 45 ms = tres cuadros a 60 Hz
    previo = now;
    const k = Math.min(1, t/dur);
    progreso = suave(k);
    alfaTop = desvanecer(progreso);
    F = { x: anchor.x + (meta.x - anchor.x)*progreso,
          y: anchor.y + (meta.y - anchor.y)*progreso };
    drawFold();
    if (k < 1) return requestAnimationFrame(paso);
    cb();
  })(previo);          /* el primer cuadro arranca con delta cero */
}

function animarSalto(destino, alLlegar){
  const aterrizar = () => {
    paginaActual = destino;
    hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; anchor = F = null;
    renderPage();
    fx.style.display='none'; pg.classList.remove('hidden');
    if (alLlegar) alLlegar();
  };
  if (!pageImg || destino === paginaActual){ aterrizar(); return; }
  const salto = Math.abs(destino - paginaActual);

  /* Siempre bonche, aunque sea una sola hoja de distancia: un puño de papel
     abanicándose se lee mejor que una hoja rígida. El grosor crece con la
     distancia y se topa en siete, porque pasando cierto punto "muchas" ya no
     se distingue de "muchísimas". */
  const b = bonchePara(salto);
  readout.textContent = salto === 1 ? 'una hoja' : salto + ' hojas';
  pasoAnimado(paginaActual, destino, rnd(b.dur[0], b.dur[1]), b.hojas, aterrizar);
}

/* ============================================================
   PANEL DE LIBROS. Entra desde la derecha al detenerte en el filo. Cada
   renglón crece al pasarle encima —eso vive en el CSS, con transform, para
   que ninguno empuje a los demás. Al soltar, salta al libro con un bonche.
   ============================================================ */
const mayus = t => t.replace(/^(\d?)(.)/, (_, d, c) => d + c.toUpperCase());
const CANON = Object.keys(LIBROS_ES).map((id, i) => {
  const alias = LIBROS_ES[id].split(' ');
  /* para la pestaña, el alias MÁS corto: en varios libros el segundo es el
     nombre sin acento y salían etiquetas de ocho letras */
  const breve = alias.slice(1).concat(alias[0]).sort((a,b) => a.length - b.length)[0];
  return {
    id,
    nombre: mayus(alias[0]).replace(/^(\d)(?=\p{L})/u, '$1 '),
    corto: mayus(breve),
    nt: i >= Object.keys(LIBROS_ES).indexOf('MAT')
  };
});
const nombreDe = id => (CANON.find(b => b.id === id) || {nombre:id}).nombre;
const abrevDe  = id => (CANON.find(b => b.id === id) || {corto:id}).corto || id;

const canto = $('canto');
let cantoAbierto = false, relojCanto = null;

/* Los conteos salen SIEMPRE de los datos —capsDe()— y no de una tabla: si
   un libro tiene 16 capítulos se ven 16, y si el archivo solo trae 2, se
   ven 2. El menú nunca ofrece algo que no existe. */
let selLibro = null, selCap = null;

const capitulosDe = libro => {
  const caps = capsDe(version, libro);
  return caps ? Object.keys(caps).map(Number).sort((a,b) => a-b) : [];
};
const versiculosDe = (libro, cap) => {
  const caps = capsDe(version, libro);
  return caps && caps[cap] ? caps[cap].length : 0;
};

function pintarCanto(){
  /* Vacía: el rótulo "Libros" ya está en la pestaña, y repetirlo dos renglones
     más abajo solo gastaba alto. Esta cabecera se queda para el botón de
     regreso de la cascada de capítulos. */
  $('cantoCab').innerHTML = '';
  const celdas = libros => libros.map(b => {
      const vivo = hayLibro(b.id), aqui = b.id === LIBRO;
      return '<button class="tabo ' + (aqui ? 'aqui' : vivo ? 'viva' : 'muerta') +
             '" data-libro="' + b.id + '" title="' + b.nombre +
             (vivo ? '' : ' — no está en estos datos') + '">' + b.nombre + '</button>';
    }).join('');
  const grupo = (titulo, libros) =>
    '<div><span class="grupo-tit">' + titulo + '</span>' +
    '<div class="rejilla-libros">' + celdas(libros) + '</div></div>';
  /* El aire de abajo va como un elemento vacío y no como padding del
     contenedor. Parece rebuscado y no lo es: #cantoCuerpo es una caja con
     desplazamiento, y el relleno final de una caja así se lo comen varios
     navegadores en cuanto el contenido desborda —justo el caso de la lista
     completa de 66 libros, que es cuando más falta hace—. Un div vacío ocupa
     alto de verdad y nadie se lo puede saltar. */
  $('cantoCuerpo').innerHTML = grupo('Antiguo Testamento', CANON.filter(b => !b.nt)) +
                               grupo('Nuevo Testamento',  CANON.filter(b => b.nt)) +
                               '<div class="aire-final"></div>';
}

/* ============================================================
   MENÚS EN CASCADA. Los capítulos salen pegados al libro que tocaste y
   los versículos pegados al capítulo, en vez de reemplazar la lista.
   Así no pierdes de vista de dónde venías.
   ============================================================ */
const flyCaps = $('flyCaps'), flyVers = $('flyVers');

function ocultarFly(el){
  el.classList.remove('visible');
  setTimeout(() => { if (!el.classList.contains('visible')) el.style.display = 'none'; }, 240);
}
function ocultarCascada(){ ocultarFly(flyVers); ocultarFly(flyCaps); }

/* Se coloca al lado del ancla; si no cabe a la derecha, se pasa a la
   izquierda, y siempre se mantiene dentro de la hoja. */
function colocarFly(el, ancla){
  const e = stage.getBoundingClientRect();
  el.style.display = 'block';
  el.style.visibility = 'hidden';
  el.classList.remove('visible');
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = ancla.right - e.left + 7;
  if (x + w > e.width - 5) x = ancla.left - e.left - w - 7;
  x = Math.max(5, Math.min(x, e.width - w - 5));
  let y = ancla.top - e.top - 4;
  y = Math.max(5, Math.min(y, e.height - h - 5));
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(y) + 'px';
  el.style.visibility = '';
  requestAnimationFrame(() => el.classList.add('visible'));
}

function abrirCapitulos(libro, ancla){
  selLibro = libro; selCap = null;
  ocultarFly(flyVers);
  const caps = capitulosDe(libro);
  flyCaps.innerHTML = '<span class="fly-tit">' + esc(nombreDe(libro)) + ' · ' +
    caps.length + ' cap</span><div class="fly-rejilla">' +
    caps.map(c => '<button class="num" data-cap="' + c + '" title="' +
      versiculosDe(libro, c) + ' versículos">' + c + '</button>').join('') + '</div>';
  colocarFly(flyCaps, ancla);
}
function abrirVersiculos(cap, ancla){
  selCap = cap;
  const n = versiculosDe(selLibro, cap);
  const textos = capsDe(version, selLibro)[cap] || [];
  flyVers.innerHTML = '<span class="fly-tit">' + esc(nombreDe(selLibro)) + ' ' + cap +
    ' · ' + n + ' v</span><div class="fly-rejilla">' +
    Array.from({length:n}, (_, i) => {
      const vacio = !(textos[i] || '').trim();
      return '<button class="num' + (vacio ? ' vacio' : '') + '" data-vers="' + (i+1) +
             '" title="' + (vacio ? 'versículo unido al anterior'
                                  : esc((textos[i]||'').slice(0,60)) + '…') + '">' +
             (i+1) + '</button>';
    }).join('') + '</div>';
  colocarFly(flyVers, ancla);
}

/* Los rollos de lectura y de etiquetas no tienen niveles ni selección:
   solo aparecen. Como son idénticos en comportamiento, salen de una misma
   fábrica en vez de duplicar el código dos veces. */
/* LAS TRES SECCIONES DE LA BURBUJA. Cambiar de pestaña NO debe verse como
   cerrar una cosa y abrir otra: el papel se enrollaría y volvería a bajar, y
   eso son 800 ms de teatro para un gesto que debería ser instantáneo. Por eso
   el cambio de pestaña cierra a la hermana en seco —sin animación— y solo el
   abrir la burbuja desde la esquina y el cerrarla se animan. */
/* LOS NOMBRES. "Lectura" no decía nada: todo el programa es lectura. Lo que
   hay dentro es tamaño, tipografía, márgenes, columnas y versión, o sea cómo
   se ve la página — "Formato". Y "Etiquetas" era la mitad de su contenido:
   ahora ahí viven las glosas mismas, listadas y filtrables, así que se llama
   por lo que guarda y no por cómo se ordena. El cuarto es "Respaldo", que es
   literalmente lo que hacen exportar e importar. */
const SECCIONES = [
  { id:'libros',   rotulo:'Libros'   },
  { id:'glosas',   rotulo:'Glosas'   },
  { id:'formato',  rotulo:'Formato'  },
  { id:'respaldo', rotulo:'Respaldo' },
];
/* el elemento de cada sección, en un solo sitio para no repetir el mapeo */
const PANEL = { libros:'canto', glosas:'etiquetas', formato:'ajustes', respaldo:'respaldo' };
let seccionViva = 'libros', cambiandoSeccion = false, dirSeccion = 1;

function barraPestanas(activa){
  const b = document.createElement('div');
  b.className = 'pestanas';
  b.innerHTML = SECCIONES.map(x =>
    '<button data-sec="' + x.id + '"' + (x.id === activa ? ' class="aqui"' : '') +
    '>' + x.rotulo + '</button>').join('');
  b.addEventListener('click', ev => {
    const t = ev.target.closest('[data-sec]'); if (!t) return;
    ev.preventDefault(); ev.stopPropagation();
    if (t.dataset.sec !== activa) abrirSeccion(t.dataset.sec, true);
  });
  return b;
}
/* La barra se vuelve a poner cada vez que se abre, porque la pestaña activa
   cambia. Se quita la anterior si quedó. */
function ponerBarra(el, activa){
  const vieja = el.querySelector('.pestanas');
  if (vieja) vieja.remove();
  el.insertBefore(barraPestanas(activa), el.firstChild);
}
const SALIDA = 180;
const panelDe = id => document.getElementById(PANEL[id]);
const seccionDe = el => Object.keys(PANEL).find(k => document.getElementById(PANEL[k]) === el);

function abrirSeccion(id, enSeco){
  const de = SECCIONES.findIndex(x => x.id === seccionViva);
  const a  = SECCIONES.findIndex(x => x.id === id);
  dirSeccion = a >= de ? 1 : -1;              /* de dónde entra el contenido */
  const previo = panelDe(seccionViva);
  const seVa = enSeco && burbujaAbierta() && previo && previo.style.display !== 'none';
  seccionViva = id;

  const arranca = () => {
    cambiandoSeccion = !!enSeco;
    if (id === 'libros')        abrirCanto();
    else if (id === 'glosas')   rGlosas.abrir();
    else if (id === 'formato')  rFormato.abrir();
    else                        rRespaldo.abrir();
    cambiandoSeccion = false;
  };
  if (!seVa) return arranca();

  /* La pestaña nueva se enciende YA, antes de que nada se mueva: el usuario
     tiene que ver que su clic se registró aunque el contenido tarde 180 ms en
     irse. Si el acuse llegara junto con el contenido, la pestaña se sentiría
     pegajosa. La barra no se desvanece con lo demás, por eso queda fuera del
     :not(.pestanas) de la animación. */
  const barra = previo.querySelector('.pestanas');
  if (barra) barra.querySelectorAll('[data-sec]').forEach(b =>
    b.classList.toggle('aqui', b.dataset.sec === id));
  previo.style.setProperty('--dir', dirSeccion);
  previo.classList.add('saliendo');
  setTimeout(() => { previo.classList.remove('saliendo'); arranca(); }, SALIDA);
}
/* El panel entra sin cortina cuando ya había una burbuja abierta. Reiniciar la
   animación pide quitar la clase, forzar un reflujo y volver a ponerla: si no,
   el navegador ve la misma clase de antes y no rearranca nada. */
function entradaDeSeccion(el){
  el.classList.remove('cambio');
  if (!cambiandoSeccion) return;
  el.style.setProperty('--dir', dirSeccion);
  void el.offsetWidth;
  el.classList.add('cambio');
}
function burbujaAbierta(){ return cantoAbierto || rFormato.abierto || rGlosas.abierto || rRespaldo.abierto; }
/* `cerrando` va en true cuando se llama desde el cierre, porque en ese momento
   la bandera del panel todavía no se ha apagado. */
function marcarCabeza(cerrando){
  const c = document.getElementById('pgCabeza'), v = document.getElementById('pgVersion');
  if (c) c.classList.toggle('abierta', !cerrando && seccionViva === 'libros');
  if (v) v.classList.toggle('abierta', !cerrando && seccionViva === 'formato');
}
function alternarBurbuja(seccion){
  /* Si ya está abierta pero en otra sección, no cierra: cambia. Cerrar sería
     castigar al que tocó la etiqueta equivocada; cambiar es lo que quería. */
  if (burbujaAbierta()) {
    if (seccionViva === seccion) cerrarTodosLosRollos();
    else abrirSeccion(seccion, true);
  } else abrirSeccion(seccion);
}

function rolloSimple(el){
  let abierto = false;
  return {
    get abierto(){ return abierto; },
    abrir(){
      if (abierto || folding) return;
      cerrarOtrosRollos(el);
      abierto = true;
      ponerBarra(el, seccionDe(el));
      if (el === etiquetas) pintarIndice();   /* la lista, al día con los filtros */
      el.classList.remove('plegando', 'disuelto');
      el.style.display = 'flex';
      void el.offsetWidth;
      el.classList.add('abierto');
      entradaDeSeccion(el);
      marcarCabeza();
    },
    /* Tres maneras de cerrarse, y no son intercambiables:
         seco      — cambio de pestaña, sin animación
         disolver  — elegiste algo, el panel se esfuma donde está
         normal    — te arrepentiste, el papel se vuelve a enrollar
       La diferencia entre las dos últimas es lo que comunican. Enrollarse es
       "me devuelvo"; disolverse es "ya te entendí, quítate de en medio". */
    cerrar(seco, disolver){
      if (!abierto) return;
      abierto = false;
      el.classList.remove('cambio', 'saliendo');
      if (seco || cambiandoSeccion){
        el.style.display = 'none';
        el.classList.remove('abierto', 'plegando', 'disuelto');
        return;
      }
      marcarCabeza(true);
      if (disolver) el.classList.add('disuelto');
      else { el.classList.remove('abierto'); el.classList.add('plegando'); }
      setTimeout(() => {
        if (!abierto){
          el.style.display = 'none';
          el.classList.remove('abierto', 'plegando', 'disuelto');
        }
      }, disolver ? 340 : 430);
    }
  };
}
const rFormato = rolloSimple(ajustes), rGlosas = rolloSimple(etiquetas),
      rRespaldo = rolloSimple(document.getElementById('respaldo'));
/* Los tres se excluyen: comparten el mismo filo y la misma superficie. */
function cerrarOtrosRollos(menos){
  if (ajustes   !== menos) rFormato.cerrar();
  if (etiquetas !== menos) rGlosas.cerrar();
  if (document.getElementById('respaldo') !== menos) rRespaldo.cerrar();
  if (canto     !== menos) cerrarCanto();
}
function cerrarTodosLosRollos(){ cerrarOtrosRollos(null); }

function abrirCanto(){
  if (cantoAbierto || folding) return;
  cerrarOtrosRollos(canto);
  cantoAbierto = true;
  selLibro = selCap = null;
  pintarCanto();
  ponerBarra(canto, 'libros');
  canto.classList.remove('plegando', 'disuelto');
  canto.style.display = 'flex';
  void canto.offsetWidth;                    // fuerza el arranque de la transición
  canto.classList.add('abierto');
  entradaDeSeccion(canto);
  marcarCabeza();
}
/* `disolver` se usa al elegir un libro: el panel no se devuelve al filo,
   se desvanece donde está. Volver por el filo es "me arrepentí"; disolverse
   es "ya te entendí". */
function cerrarCanto(alTerminar, disolver){
  clearTimeout(relojCanto);
  ocultarCascada();
  if (!cantoAbierto){ if (alTerminar) alTerminar(); return; }
  cantoAbierto = false;
  canto.classList.remove('cambio', 'saliendo');
  if (!cambiandoSeccion) marcarCabeza(true);
  if (cambiandoSeccion && !disolver){       /* cambio de pestaña: sin teatro */
    canto.style.display = 'none';
    canto.classList.remove('abierto', 'plegando', 'disuelto');
    if (alTerminar) alTerminar();
    return;
  }
  if (disolver) canto.classList.add('disuelto');
  else { canto.classList.remove('abierto'); canto.classList.add('plegando'); }
  setTimeout(() => {
    if (!cantoAbierto){
      canto.style.display = 'none';
      canto.classList.remove('abierto', 'disuelto', 'plegando');
    }
    if (alTerminar) alTerminar();
  }, disolver ? 340 : 360);
}

/* Aquí vivía un segundo oyente de "clic fuera" que no exceptuaba el menú
   flotante, así que elegir un libro en el menú del chip cerraba el panel
   entero. Sobraba: más abajo hay otro que hace lo mismo y sí conoce todas las
   excepciones. Dos guardias en la misma puerta, con listas distintas de quién
   puede pasar, siempre acaban así.
*/
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ ocultarCascada(); cerrarTodosLosRollos(); }
  /* Las flechas pasan hoja. Antes había botones y ahora no, así que el teclado
     deja de ser un lujo: sin él, quien no descubra los filos se queda encerrado
     en una hoja. Se ignoran si estás escribiendo en un campo. */
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName || '');
  if (escribiendo || folding) return;
  /* Desde el teclado no hay dedo ni esquina, así que se agarra por el mismo
     sitio que un chevrón: el canto de abajo. */
  const cantoY = pg.getBoundingClientRect().bottom - 20;
  if (ev.key === 'ArrowRight'){ ev.preventDefault(); pasarHoja('right', cantoY); }
  if (ev.key === 'ArrowLeft' ){ ev.preventDefault(); pasarHoja('left',  cantoY); }
});

/* Un solo manejador para los tres niveles, ahora en cascada: el libro abre
   los capítulos a su lado, el capítulo abre los versículos al suyo, y solo
   el versículo dispara el salto. */
function tocarLibro(ev){
  const lib = ev.target.closest('.tabo'); if (!lib) return;
  const id = lib.dataset.libro;
  if (!hayLibro(id)){
    readout.textContent = nombreDe(id) + ' no está en estos datos — genéralo con el convertidor';
    return;
  }
  abrirCapitulos(id, lib.getBoundingClientRect());
}
canto.addEventListener('click', tocarLibro);
/* Tocar fuera cierra la burbuja. Quedan exentos los sitios que son la burbuja
   o la abren: el propio panel, las cajitas de capítulos y versículos, el menú
   flotante y las dos etiquetas de la hoja —esas ya alternan por su cuenta y si
   además cerraran aquí, se cerraría y se volvería a abrir en el mismo gesto.

   Se cierra enrollándose, no disolviéndose: tocar afuera es "me arrepentí" o
   "ya acabé", no "elegí esto". La disolución se reserva para cuando el panel
   entendió una orden. */
const FUERA_NO = '.rollo, .fly, #menu, #pgCabeza, #pgVersion';
document.addEventListener('pointerdown', ev => {
  if (!burbujaAbierta()) return;
  if (ev.target.closest(FUERA_NO)) return;
  cerrarTodosLosRollos();
}, true);

/* Un clic en cualquier otro lado cierra la cascada. Sin esto, una vez abierta
   la lista de capítulos no había manera de arrepentirse y elegir otro libro:
   los libros quedaban debajo de la cajita y el clic no les llegaba. Va en
   captura y sobre el documento para enterarse antes que nadie, y se ignora
   si el clic cae dentro de las cajitas o sobre un libro —ese ya tiene dueño. */
document.addEventListener('pointerdown', ev => {
  if (flyCaps.style.display === 'none' && flyVers.style.display === 'none') return;
  if (ev.target.closest('#flyCaps, #flyVers, .tabo')) return;
  ocultarCascada();
}, true);

flyCaps.addEventListener('click', ev => {
  const n = ev.target.closest('.num'); if (!n || !n.dataset.cap) return;
  abrirVersiculos(+n.dataset.cap, n.getBoundingClientRect());
});
flyVers.addEventListener('click', ev => {
  const n = ev.target.closest('.num');
  if (!n || !n.dataset.vers || n.classList.contains('vacio')) return;
  ocultarCascada();
  saltarA(selLibro, selCap, +n.dataset.vers);
});

/* Cuántas hojas hay, más o menos, entre dos puntos del canon. No hace falta
   exactitud —nadie va a contarlas— pero sí orden de magnitud: el bonche de un
   salto de Mateo a Apocalipsis tiene que verse distinto al de uno de veinte
   hojas, y para eso hay que saber que uno son cientos y el otro decenas. */
function hojasEntreLibros(desdeLibro, aLibro, capDestino){
  const porCap = plano.length && paginas.length
               ? (paginas.length / Math.max(1, plano[plano.length-1].cap)) : 2.2;
  const i = CANON.findIndex(b => b.id === desdeLibro);
  const j = CANON.findIndex(b => b.id === aLibro);
  if (i < 0 || j < 0) return 999;
  const [a, b] = i < j ? [i, j] : [j, i];
  /* capitulosDe() lee los datos reales, así que un libro que no venga en el
     archivo cuenta cero y no infla la estimación con capítulos que no existen.
     Para los que sí están pero no se han cargado nunca, se usa un promedio. */
  let caps = 0;
  for (let k = a; k < b; k++){
    const n = capitulosDe(CANON[k].id).length;
    caps += n || 22;
  }
  return Math.max(1, Math.round(caps * porCap));
}

/* El salto: cierra el panel disolviéndolo, rearma el mapa de hojas del libro
   destino y voltea un bonche hasta la hoja donde vive ese versículo. */
/* `regreso` es opcional: lo manda quien salta desde una referencia, para que
   el botón de volver sepa a dónde. Tiene que viajar como parámetro y no
   asignarse después de llamar, porque saltarA no termina en el acto —espera a
   que el panel se cierre— y adentro limpia volverA. Asignarlo por fuera se
   perdía en cuanto corría el diferido. */
function saltarA(libro, cap, vers, regreso){
  const viejo = pageImg, mismo = libro === LIBRO, desdeHoja = paginaActual;
  /* De qué libro salimos. Hay que guardarlo AQUÍ: dentro del diferido lo
     primero que pasa es LIBRO = libro, así que para cuando se calcula el
     grosor del bonche, LIBRO ya es el destino. La cuenta salía "de
     Apocalipsis a Apocalipsis" = cero hojas = un bonche de una, en TODOS los
     saltos entre libros, que son justo los que más tardan y más manojo
     piden. Por eso se veía chiquito cuando más debía verse grande. */
  const libroOrigen = LIBRO;
  /* ¿El destino queda antes o después de donde estoy? Dentro del mismo libro
     se compara el número de hoja; entre libros distintos, el orden del canon.
     Antes esto último no se miraba: irse de Apocalipsis a Mateo volteaba las
     hojas hacia adelante, como si Mateo estuviera más allá. */
  const iAhora = CANON.findIndex(b => b.id === LIBRO);
  const iAlla  = CANON.findIndex(b => b.id === libro);
  const haciaAtras = mismo ? false : (iAlla >= 0 && iAhora >= 0 && iAlla < iAhora);
  cerrarCanto(() => {
    LIBRO = libro;
    volverA = regreso || null; paginasSucias = true;
    rehacerPlano();
    resolverTodas(); recalcularRefs(); calcularVinculos();
    asegurarPaginas();
    const k = Math.max(0, plano.findIndex(p => p.cap === cap && p.vers === vers));
    const destino = paginaDe(k);
    const aterrizar = () => {
      hojasExtra = []; progreso = 0; alfaTop = 1; folding = false; anchor = F = null;
      paginaActual = destino;
      renderPage();
      fx.style.display = 'none'; pg.classList.remove('hidden');
      destacar(cap, vers, '');
      readout.textContent = nombreDe(libro) + ' ' + cap + ':' + vers;
    };
    if (mismo && destino === desdeHoja){ aterrizar(); return; }
    side = (mismo ? destino < desdeHoja : haciaAtras) ? 'left' : 'right';
    fotoDeHoja(destino, img => {
      if (!viejo || !img){ aterrizar(); return; }
      pageImg = viejo; bajoImg = img;
      /* cambiar de libro es siempre un viaje largo, aunque el número de
         hoja del libro nuevo sea chico */
      /* Entre libros distintos el número de hoja del libro nuevo no dice nada
         del viaje: se cuenta cuántos capítulos hay de por medio en el canon y
         se estiman las hojas con la densidad del libro actual. */
      const salto = mismo ? Math.abs(destino - desdeHoja)
                          : hojasEntreLibros(libroOrigen, libro, cap);
      const b = bonchePara(salto);
      animarHojas(b.hojas, rnd(b.dur[0], b.dur[1]), aterrizar);
    });
  }, true);
}

/* ============================================================
   EXPORTAR E IMPORTAR. La salida de emergencia: un archivo que tú
   guardas donde quieras. No depende de red, de cuenta ni de que el
   navegador conserve su almacenamiento. Es lo único que responde a
   "¿y si mañana esto no está?".
   ============================================================ */
const FORMATO = 'glossa/marcas';

$('btnExportar').onclick = () => {
  if (!marcas.length){ readout.textContent = 'no hay nada que exportar todavía'; return; }
  /* El archivo tiene que decir qué es en la primera línea que se ve al
     abrirlo, y también en su nombre. Dentro de un año, entre cincuenta
     archivos, "glossa-2026-08-14.json" no le dice nada a nadie. */
  const paquete = {
    _que_es: 'Respaldo de Gloss Bible: tus subrayados y glosas. ' +
             'Se restaura con el botón Importar del lector.',
    formato: FORMATO, version: 1,
    exportado: new Date().toISOString(),
    versionTexto: version,
    totalMarcas: marcas.length,
    marcas
  };
  const blob = new Blob([JSON.stringify(paquete, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gloss-bible-respaldo-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  readout.textContent = marcas.length + ' marca(s) exportadas · guárdalo fuera del navegador';
};

$('btnImportar').onclick = () => $('archivoImp').click();
$('archivoImp').onchange = ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';                       // permite reimportar el mismo archivo
  if (!f) return;
  const lector = new FileReader();
  lector.onerror = () => { readout.textContent = 'no se pudo leer el archivo'; };
  lector.onload = () => {
    let datos;
    try { datos = JSON.parse(lector.result); }
    catch(e){ readout.textContent = 'ese archivo no es JSON válido'; return; }
    const entrantes = Array.isArray(datos) ? datos
                    : (datos && datos.formato === FORMATO ? datos.marcas : null);
    if (!Array.isArray(entrantes)){
      readout.textContent = 'ese archivo no parece una exportación de Glossa';
      return;
    }
    /* Se FUSIONA, no se reemplaza: importar nunca debe borrar lo que ya
       tenías. Las repetidas se saltan por id, y a las que les falte id
       (editadas a mano) se les inventa uno. */
    const conocidas = new Set(marcas.map(m => m.id));
    let nuevas = 0, repetidas = 0, malas = 0;
    for (const m of entrantes){
      if (!m || typeof m !== 'object' || !m.libro || !m.cap || !m.vers){ malas++; continue; }
      if (!m.id) m.id = 'imp' + Math.random().toString(36).slice(2,9);
      if (conocidas.has(m.id)){ repetidas++; continue; }
      conocidas.add(m.id);
      marcas.push(alDia(m));               /* traduce la paleta vieja al entrar */
      nuevas++;
    }
    save(); renderPage();
    readout.textContent = nuevas + ' importada(s)' +
      (repetidas ? ' · ' + repetidas + ' ya estaban' : '') +
      (malas ? ' · ' + malas + ' ilegibles' : '');
  };
  lector.readAsText(f);
};

/* ============================================================
   COMPARADOR. Dibuja la foto encima de la hoja viva en modo
   "difference": donde coinciden, negro; donde no, brilla. Es la única
   forma honesta de encontrar diferencias que el ojo no atrapa al vuelo.
   ============================================================ */
/* Aquí vivían dos herramientas de desarrollo: "Comparar", que superponía la
   foto sobre la hoja en modo diferencia, y la auditoría que imprimía en la
   consola una tabla de la hoja viva contra la foto. Sirvieron para cazar los
   defectos del pliegue —el texto que brincaba, los espacios que cambiaban— y
   ya cumplieron. Se van con su botón. */


/* ---------- controles ---------- */
function setVersion(v){
  /* Conservar el lugar por REFERENCIA, no por número de hoja: los textos de
     dos versiones tienen largos distintos, así que la hoja 3 de una no es la
     hoja 3 de la otra. Estabas en 1:35 y aparecías en 1:40. */
  const donde = plano[startIdx];
  version = v; paginasSucias = true;
  document.querySelectorAll('[data-ver]').forEach(x => x.classList.toggle('active', x.dataset.ver===v));
  rehacerPlano();
  renderPage();
  if (donde){
    const k = plano.findIndex(x => x.cap === donde.cap && x.vers === donde.vers);
    if (k >= 0){
      /* Aterriza en la hoja que CONTIENE tu versículo. No puede empezar en
         él: las hojas son fijas, como en papel, y forzarlas a arrancar en un
         versículo arbitrario sería volver al scroll disfrazado. Lo que sí
         hace falta es señalarlo, porque el texto de al lado es distinto y
         sin la marca parece que saltó de sitio. */
      /* Con la paginación sincronizada los cortes coinciden, así que esto
         normalmente ni se mueve; queda como red por si una versión no se
         pudo sincronizar (versificación distinta). */
      if (paginaDe(k) !== paginaActual){ paginaActual = paginaDe(k); renderPage(); }
      const inicio = plano[startIdx];
      const igual = inicio && inicio.cap === donde.cap && inicio.vers === donde.vers;
      readout.textContent = D.versiones[v].abrev + ' · ' + nombreDe(LIBRO) + ' ' +
        donde.cap + ':' + donde.vers + (igual ? ' · mismo pasaje' : ' · pasaje aproximado');
      if (!igual) destacar(donde.cap, donde.vers, '');
    }
  }
  $('cred').textContent = D.versiones[v].nombre + ' — ' + D.versiones[v].licencia + ' · vía eBible.org';
}
/* los clics de versión se enganchan al armar los botones, más abajo */
/* El margen es el default mientras la hoja dé el ancho; en celular no cabe
   y la glosa se va abajo del versículo. Con dos o tres columnas el margen
   pierde la referencia por alineación, pero la conserva por número de
   versículo, así que sigue siendo una elección válida. */
const placementPorOmision = () => (stage.offsetWidth >= 420 ? 'margin' : 'below');
function setPlacement(p){
  placement = p; paginasSucias = true;
  document.querySelectorAll('[data-lay]').forEach(x => x.classList.toggle('active', x.dataset.lay===p));
}
function setColumns(n){
  columns = n; paginasSucias = true;
  document.querySelectorAll('[data-cols]').forEach(x => x.classList.toggle('active', +x.dataset.cols===n));
  if (!placementTocado) setPlacement(placementPorOmision());
}
document.querySelectorAll('[data-cols]').forEach(b => b.onclick = () => { setColumns(+b.dataset.cols); renderPage(); });
document.querySelectorAll('[data-lay]').forEach(b => b.onclick = () => {
  placementTocado = true; setPlacement(b.dataset.lay); renderPage();
});
/* LOS TAMAÑOS, EN UN SOLO SITIO. El mínimo y el máximo estaban escritos tres
   veces —en A+, en A− y en la validación de los ajustes— y ahora hacía falta
   una cuarta para armar la lista. Cuatro copias de un rango es una de más
   para que alguna se quede corta el día que se mueva. */
const FS_MIN = 10, FS_MAX = 26;
const TAMANOS = Array.from({length: FS_MAX - FS_MIN + 1}, (_, i) => FS_MIN + i);
$('fsAhora').innerHTML = TAMANOS.map(n => '<option value="' + n + '">' + n + '</option>').join('');
/* A+ y A− se quedan: la lista sirve para ir lejos de un tirón —de 15 a 22 sin
   siete clics— y los botones para el ajuste fino, que es lo que de verdad se
   hace cuando estás leyendo y algo no acaba de caer. Cada uno hace bien lo
   que el otro hace mal, así que no se estorban. */
function reflejarTamano(){ $('fsAhora').value = String(fontSize); }
function ponerTamano(n){
  const v = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(n)));
  if (v === fontSize){ reflejarTamano(); return; }   // rebota el select si topó
  fontSize = v; paginasSucias = true; renderPage();
}
$('fsUp').onclick    = () => ponerTamano(fontSize + 1);
$('fsDown').onclick  = () => ponerTamano(fontSize - 1);
$('fsAhora').onchange = e => ponerTamano(+e.target.value);

/* EL SEPIA. En 'input' y no en 'change' para que el papel se entinte mientras
   arrastras: elegir un color a ciegas y verlo al soltar es elegir dos veces.
   No se marca paginasSucias —el color no cambia cuánto texto cabe, así que
   repaginar sería tirar el trabajo para llegar al mismo sitio— pero la firma
   sí lleva el sepia, así que la foto del pliegue se rehace sola. */
$('sepia').oninput = e => {
  sepia = Math.max(0, Math.min(100, +e.target.value || 0));
  $('sepiaAhora').textContent = sepia;
  renderPage();
};
$('selFuente').innerHTML = FUENTES.map((f,i) =>
  '<option value="'+i+'" title="'+f[2]+'">'+f[0]+'</option>').join('');
$('selFuente').title = FUENTES.map(f => f[0] + ': ' + f[2]).join(' · ');
const btnAl = $('btnAli'), btnA = $('btnAire'), btnV = $('btnVerso');

/* las flechas pasan la hoja igual que un clic en el filo, agarrando
   por el centro: brincar sin animación era lo que se sentía atropellado */
$('btnVolver').onclick = () => {

  const d = volverA; volverA = null;

  else {

       hoja de la que saliste. Se busca por capítulo y versículo, no por número
       de hoja, porque la paginación del otro libro pudo cambiar de tamaño. */
    const p = d.ref;

};
$('marksBtn').onclick = () => { showMarks = !showMarks; paginasSucias = true;
  $('marksBtn').textContent = 'Marcas: ' + (showMarks?'ON':'OFF'); renderPage(); };
/* "Borrar todo" salió del programa. Era un botón de un solo clic, sin
   confirmación y sin deshacer, capaz de tirar años de notas; y no resolvía
   ningún problema real, porque las glosas se borran de una en una y ésas sí
   se pueden deshacer. Un botón así no se arregla con un "¿estás seguro?": se
   quita. Si algún día hace falta vaciar, se hace desde Respaldo, exportando
   primero. */

/* Y aquí vivía "Ejemplo", que sembraba cinco marcas de muestra sobre Marcos.
   Servía para probar el anclaje entre versiones cuando no había nada guardado;
   ahora que tienes glosas de verdad, sembrar encima solo estorbaría. */

function updateReadout(){
  const pos = plano[startIdx], fin = plano[Math.max(0,nextIdx-1)];
  /* Termómetro del anclaje: cuántas marcas cayeron en su sitio exacto y
     cuántas hubo que reencontrar. Escrito en español, no en claves. */
  const NOMBRE_GRADO = { exacta:['exacta','exactas'], cita:['por su cita','por su cita'],
                         aprox:['aproximada','aproximadas'],
                         versiculo:['al versículo entero','al versículo entero'] };
  const enPalabras = (k, v) => v + ' ' + ((NOMBRE_GRADO[k] || [k,k])[v === 1 ? 0 : 1]);
  const grados = {};
  let total = 0;
  for (const m of marcas){
    if (m.libro !== LIBRO) continue;
    const g = (RES.get(m.id) || {}).grado;
    if (g){ grados[g] = (grados[g] || 0) + 1; total++; }
  }
  const partes = Object.entries(grados);
  const resumen = !total ? 'sin marcas'
    : partes.length === 1 && partes[0][0] === 'exacta'
      ? total + (total === 1 ? ' marca exacta' : ' marcas, todas exactas')
      : total + ' marcas: ' + partes.map(([k,v]) => enPalabras(k,v)).join(', ');
  const cpl = medidaLinea();
  const juicio = cpl < 45 ? ' (corta)' : cpl > 75 ? ' (larga)' : '';
  /* Esto es ESTADO, no un aviso: describe la hoja que estás viendo y cambia en
     cada repintado. Mandarlo al aviso flotante lo convertía en un cartel que
     saluda al abrir la aplicación y vuelve a salir cada vez que pasas hoja,
     diciendo algo que nadie pidió. Se guarda para consulta —estado() en la
     consola— y no interrumpe a nadie. */
  window.__estado = nombreDe(LIBRO) + ' ' + pos.cap + ':' + pos.vers + '–' + fin.cap + ':' + fin.vers +
    ' · ' + cpl + ' car/línea' + juicio +
    ' · ' + D.versiones[version].abrev + ' · ' + resumen +
    (etiquetaActiva ? ' · etiquetando: ' + etiquetaActiva : '');
}
/* ---------- índice de glosas ---------- */
/* LA LISTA DE GLOSAS. Cada una se ve como se ve en el margen: mismo tipo de
   letra, mismo tamaño, mismo color de su marca. La referencia visual vale más
   que el orden alfabético — reconoces "la verde larga" antes de leer nada.

   Van en un flexbox que las deja crecer hasta donde alcance el ancho, con un
   mínimo para que ninguna quede tan angosta que la nota se parta en tiras.

   Ya no hay encabezados de capítulo: con el filtro por libro la lista puede
   cruzar varios, así que la referencia completa va dentro de cada glosa, que
   además es donde se lee sin perder de vista la nota. */
function pintarIndice(){
  const cont = $('indice');
  if (!cont || !rGlosas.abierto) return;      /* solo cuando su panel está a la vista */
  const lista = marcas.filter(m => m.nota && enLista(m)).sort((a,b) =>
    CANON.findIndex(x=>x.id===a.libro) - CANON.findIndex(x=>x.id===b.libro) ||
    a.cap - b.cap || a.vers - b.vers);
  if (!lista.length){
    cont.innerHTML = '<span class="ix-vacio">ninguna glosa pasa los filtros de ahorita</span>';
    return;
  }
  const variosLibros = new Set(lista.map(m => m.libro)).size > 1;
  cont.style.setProperty('--ancho-glosa', MARGIN_W() + 'px');
  cont.innerHTML = lista.map(m => {
    const nb = backDe(m.cap, m.vers).length;
    const letra = (REFS.get(m.id) || '').toString().replace(/^\d+/, '');
    const ref = (variosLibros ? abrevDe(m.libro) + ' ' : '') + m.cap + ':' + m.vers + letra;
    /* la MISMA forma que en el margen: esquinas, aire, pluma y sombra salen
       del id, así que la de la lista y la de la hoja son la misma nota */
    const forma = formaOrganica(m);
    return '<button class="ix-item gl g-' + m.color + '" data-ir="' +
      m.libro + ':' + m.cap + ':' + m.vers + ':' + letra + '"' +
      ' data-frac="' + forma.frac + '" style="' + forma.css + '">' +
      '<span class="gl-ref">' + esc(ref) + '·</span>' + esc(m.nota) +
      ((m.etiquetas||[]).length ? '<span class="gl-tag">#' + esc(m.etiquetas.join(' #')) + '</span>' : '') +
      (nb ? '<span class="gl-tag">‹' + nb + '</span>' : '') + '</button>';
  }).join('');
  asentarGlosas(cont);        /* y el mismo giro, que depende del alto y del ancho */
}
/* Los botones "Libros" e "Índice" salieron de la barra de abajo: la burbuja
   de la esquina ya lleva a los dos, y dos puertas al mismo cuarto solo
   obligan a decidir cuál usar. */
menu.addEventListener('click', ev => {
  const b = ev.target.closest('[data-libfil]'); if (!b) return;
  ev.stopPropagation();
  librosFiltro.add(b.dataset.libfil);
  ocultarMenu(); pintarFiltros(); pintarIndice();
}, true);

$('indice').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ir]'); if (!b) return;
  const [lib, c, v, l] = b.dataset.ir.split(':');
  /* El panel se disuelve —no se enrolla— porque elegir una glosa es una orden
     cumplida, no un arrepentimiento. Y se va ANTES del salto: si se quedara,
     taparía justo el texto al que acabas de pedir ir. El salto arranca al
     cuadro siguiente para que la disolución alcance a empezar. */
  rGlosas.cerrar(false, true);
  requestAnimationFrame(() => irA(lib, +c, +v, l || ''));
});

/* Y aquí estaba el instructivo largo que salía debajo de la hoja. Se fue con
   los botones que explicaba. Lo que hace falta saber está en los globos de
   ayuda de cada control, que es donde se necesita: al lado de la cosa. */

/* ============================================================
   AJUSTES DEL LECTOR. Se guardan aparte de las marcas: son cosas
   distintas y con distinto valor. Perder los ajustes es una molestia
   de treinta segundos; perder las glosas sería una tragedia —por eso
   las marcas tienen exportación y esto no la necesita.
   Se guarda también DÓNDE te quedaste, pero como libro:capítulo:versículo
   y no como número de hoja: el número de hoja cambia si mañana abres con
   otra letra o con otras columnas, la referencia no.
   ============================================================ */
const AJUSTES = 'glossa:ajustes:v1';
/* El ancho de la hoja en pantalla ancha. Era un ajuste con tres botones y
   ahora es una medida fija: en teléfono nunca se usó —.stage lleva 100vw con
   !important— y en escritorio 620px es el ancho para el que está calibrada la
   tipografía. Se queda como constante y no viaja a los ajustes guardados. */
const ANCHO_HOJA = 620;

function guardarAjustes(){
  const aqui = plano[startIdx] || { cap:1, vers:1 };
  try {
    localStorage.setItem(AJUSTES, JSON.stringify({
      v: 1, fontSize, columns, placement, alineacion,
      interlineado, versoAparte, margen, version, showMarks, sepia,
      fuente: FUENTES.findIndex(f => f[1] === fuente),
      libro: LIBRO, cap: aqui.cap, vers: aqui.vers
    }));
  } catch(e){ /* si no se puede, se arranca con lo de fábrica */ }
}

/* Cada campo se valida antes de aceptarlo: un archivo de ajustes viejo o
   manoseado no debe dejar la app en un estado imposible. */
function cargarAjustes(){
  let a = null;
  try { a = JSON.parse(localStorage.getItem(AJUSTES) || 'null'); } catch(e){}
  if (!a || a.v !== 1) return null;
  if (a.fontSize >= FS_MIN && a.fontSize <= FS_MAX) fontSize = a.fontSize;
  /* Number.isFinite y no un simple >=: un null guardado por una version
     vieja pasaba la comparacion como 0 y dejaba el sepia mudo sin decirlo. */
  if (Number.isFinite(a.sepia)) sepia = Math.max(0, Math.min(100, a.sepia));
  if (FUENTES[a.fuente]) fuente = FUENTES[a.fuente][1];
  if ([1,2,3].includes(a.columns)) columns = a.columns;
  if (['below','margin','foot'].includes(a.placement)){ placement = a.placement; placementTocado = true; }
  if (['left','justify'].includes(a.alineacion)) alineacion = a.alineacion;
  if (a.interlineado > 1 && a.interlineado < 3) interlineado = a.interlineado;
  if (MARGENES[a.margen]) margen = a.margen;
  versoAparte = !!a.versoAparte;
  showMarks = a.showMarks !== false;
  if (D.versiones[a.version]) version = a.version;      // antes que el libro:
  if (a.libro && hayLibro(a.libro)) LIBRO = a.libro;    // hayLibro depende de version
  return a;
}

/* Un solo lugar que pone los controles a decir lo que el estado dice.
   Sin esto, restaurar ajustes deja botones mintiendo. */
function reflejarControles(){
  reflejarTamano();
  $('sepia').value = String(sepia);
  $('sepiaAhora').textContent = sepia;
  $('selFuente').value = String(Math.max(0, FUENTES.findIndex(f => f[1] === fuente)));
  const marcar = (sel, ok) => document.querySelectorAll(sel).forEach(x => x.classList.toggle('active', ok(x)));
  marcar('[data-cols]', x => +x.dataset.cols === columns);
  marcar('[data-lay]',  x => x.dataset.lay === placement);
  marcar('[data-ver]',  x => x.dataset.ver === version);
  const poner = (b, txt, on) => { b.textContent = txt; b.classList.toggle('active', on); };
  poner(btnAl, alineacion === 'justify' ? 'justificado' : 'izquierda', alineacion === 'justify');
  poner(btnA,  interlineado > 1.8 ? 'amplio' : 'normal', interlineado > 1.8);
  poner(btnV,  versoAparte ? 'aparte' : 'corridos', versoAparte);
  poner(btnM,  MARGENES[margen][0], margen !== 1);
  marksBtn.textContent = 'Marcas: ' + (showMarks ? 'ON' : 'OFF');
  /* 'estrecho' pone el panel en una sola columna cuando no hay ancho para
     dos. Preguntaba por anchoHoja, que era el ajuste de la hoja y no el
     espacio disponible; y como el manejador de aquellos botones nunca
     escribía la variable, la respuesta era siempre 620 y la clase no se
     ponía jamás. Ahora se le pregunta a la escena, que es lo que de verdad
     decide si los dos grupos caben uno al lado del otro. */
  const angosto = stage.offsetWidth < 560;
  $('ctrlConfig').classList.toggle('estrecho', angosto);
  $('ctrlEtiquetas').classList.toggle('estrecho', angosto);
}

/* Los controles se MUEVEN al cajón con appendChild, no se recrean: así
   conservan todos sus manejadores y no hay que volver a conectarlos. */
/* Se MUEVEN los nodos que ya existen, no se clonan ni se vuelven a crear:
   así los manejadores de clic que se engancharon arriba siguen siendo los del
   mismo elemento. Clonar habría dejado botones mudos. */
ajustes.appendChild($('ctrlConfig'));
etiquetas.appendChild($('ctrlEtiquetas'));
/* "Marcas: ON/OFF" apaga TODOS los resaltados de la hoja de un golpe: es una
   propiedad de las glosas, no de la página, así que vive con ellas. */
(function ponerInterruptor(){
  const fila = document.createElement('div');
  fila.className = 'ajuste';
  fila.innerHTML = '<span class="lbl">marcas</span>';
  const c = document.createElement('span');
  c.className = 'ctrl';
  const b = $('marksBtn');
  b.style.display = '';
  c.appendChild(b);
  fila.appendChild(c);
  $('ctrlEtiquetas').appendChild(fila);
})();
etiquetas.appendChild($('indice'));

/* El crédito de licencia se va al panel de Formato, pegado a la versión que
   nombra. No es adorno legal: la Versión Biblia Libre es CC BY-SA y exige
   atribución, así que tiene que estar a la vista en alguna parte. Al lado del
   selector es donde de verdad significa algo. */
ajustes.appendChild($('cred'));

/* El panel de Respaldo se arma con los botones que vivían en la barra de
   abajo: exportar e importar, que son las dos cosas que le pasan al archivo
   de tus glosas, no al texto ni a la página. ("Borrar todo" estuvo aquí y se
   fue del programa entero; la razón está más arriba, donde se quitó.) */
(function armarRespaldo(){
  const caja = document.getElementById('respaldo');
  const fila = document.createElement('div');
  fila.className = 'ajuste ancho';
  fila.innerHTML = '<span class="lbl">archivo</span>';
  const ctrl = document.createElement('span');
  ctrl.className = 'ctrl';
  /* HAY QUE QUITARLES EL display:none AL TRAERLOS, y no es un detalle: los
     tres nacen ocultos en el HTML para que no se vean un instante al pie de
     la página antes de que el guion los mude a su panel. Al mudarlos hay que
     devolverles la visibilidad, porque ese "none" está escrito en el atributo
     style y ninguna hoja de estilos le gana.
     No se hacía, así que el panel de Respaldo enseñaba el rótulo "archivo",
     un hueco donde debían estar los botones, y debajo una nota explicando
     cómo usar dos botones que no estaban. Exportar era además la única forma
     de sacar las glosas de este navegador.
     El interruptor de marcas, que se muda igual unas líneas más arriba, sí lo
     hacía —b.style.display = ''—: era la misma cuenta, hecha en un sitio y
     olvidada en el otro. */
  ['btnExportar', 'btnImportar'].forEach(id => {
    const b = $(id);
    b.style.display = '';
    ctrl.appendChild(b);
  });
  /* El de archivo NO: es el <input type=file> que abre el diálogo del
     sistema, y se dispara desde el botón de Importar. Ese sí vive oculto. */
  ctrl.appendChild($('archivoImp'));
  fila.appendChild(ctrl);
  caja.appendChild(fila);
  const nota = document.createElement('p');
  nota.className = 'nota-respaldo';
  nota.textContent = 'Tus glosas viven en este navegador y en ningún otro lado. ' +
    'Exportar es la única copia que sobrevive a limpiar el historial, cambiar de ' +
    'computadora o publicar el lector en otro sitio. Importar fusiona, nunca reemplaza.';
  caja.appendChild(nota);
})();

/* ---------- arranque ---------- */
/* Los botones de versión se arman con lo que venga en bibles-included.js.
   Estaban escritos a mano en el HTML, así que bajar la BSB y la WEB no las
   hacía aparecer por ningún lado: el archivo las traía y el lector no las
   ofrecía. Ahora la lista siempre es la del archivo. */
(function armarVersiones(){
  const cont = $('ctrlVersiones');
  cont.innerHTML = Object.entries(D.versiones).map(([k, v]) =>
    '<button class="btn" data-ver="' + k + '" title="' + esc(v.nombre + ' — ' + v.licencia) +
    '">' + esc(v.abrev || k) + '</button>').join('');
  cont.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => setVersion(b.dataset.ver));
})();

const guardado = cargarAjustes();
stage.style.transition = 'none';
stage.style.width = ANCHO_HOJA + 'px';
void stage.offsetWidth;
stage.style.transition = '';
reflejarControles();
rehacerPlano();
sizeCanvas();
$('cred').textContent = D.versiones[version].nombre + ' — ' + D.versiones[version].licencia + ' · vía eBible.org';
renderPage();

/* Volver a donde te quedaste, por referencia y no por número de hoja */
if (guardado && guardado.cap){
  const k = plano.findIndex(p => p.cap === guardado.cap && p.vers === guardado.vers);
  if (k >= 0){ paginaActual = paginaDe(k); renderPage(); }
}
window.addEventListener('resize', () => { sizeCanvas(); paginasSucias = true; renderPage(); });
})();
</script>
</body>
</html>
