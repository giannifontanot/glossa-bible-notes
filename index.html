/* Reordenar el índice: se jala por el asa de seis puntos, no por la nota.
   El orden se guarda aparte de las marcas, para no tocar el modelo. */
(function reordenarIndice(){
  const cont = $('indice');
  const suave = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pieza = null, hueco = null, ox = 0, oy = 0, bloqueoHasta = 0, ultimoDest = null;
  function fotos(){
    const m = new Map();
    for (const el of cont.querySelectorAll('.ix-item')){
      if (el === pieza) continue;
      m.set(el, el.getBoundingClientRect());
    }
    return m;
  }
  function cajaEnFlujo(el){
    const t = el.style.transform;
    el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = t;
    return r;
  }
  /* El asa se queda bajo el dedo: la tarjeta sigue al cursor. */
  function pegarAlDedo(ev){
    if (!pieza) return;
    const r = cajaEnFlujo(pieza);
    const dx = ev.clientX - ox - r.left;
    const dy = ev.clientY - oy - r.top;
    pieza.style.transition = 'none';
    pieza.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.045)';
  }
  /* FLIP: las vecinas se deslizan al hueco con la misma curva de la cinta. */
  function animarSitios(antes){
    if (!suave() || !antes) return;
    for (const el of cont.querySelectorAll('.ix-item')){
      if (el === pieza) continue;
      const a = antes.get(el); if (!a) continue;
      const b = el.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (!dx && !dy) continue;
      el.classList.add('sin-salto');
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      void el.offsetWidth;
      el.classList.remove('sin-salto');
      el.style.transform = '';
    }
  }
  function soltar(){
    if (!pieza) return;
    pieza.classList.remove('arrastrando');
    pieza.style.transform = '';
    pieza.style.transition = '';
    if (hueco) hueco.classList.remove('hueco');
    const vistos = Array.from(cont.querySelectorAll('.ix-item[data-gl-id]'))
      .map(el => el.dataset.glId).filter(Boolean);
    const set = new Set(vistos);
    ordenIndice = vistos.concat(ordenIndice.filter(id => !set.has(id)));
    guardarOrdenIndice();
    pieza = null; hueco = null; bloqueoHasta = 0; ultimoDest = null;
  }
  function bajoPunto(x, y){
    const els = [...cont.querySelectorAll('.ix-item')].filter(el => el !== pieza);
    for (const el of els){
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return el;
    }
    return null;
  }
  /* La caja VISIBLE de la que jalas (sigue al dedo), no el puntero:
     el asa queda abajo y a veces no entra en la de abajo. */
  function destPorSolape(){
    if (!pieza) return null;
    const pr = pieza.getBoundingClientRect();
    let best = null, bestArea = 0;
    for (const el of cont.querySelectorAll('.ix-item')){
      if (el === pieza) continue;
      const r = el.getBoundingClientRect();
      const w = Math.max(0, Math.min(pr.right, r.right) - Math.max(pr.left, r.left));
      const h = Math.max(0, Math.min(pr.bottom, r.bottom) - Math.max(pr.top, r.top));
      const area = w * h;
      if (area > bestArea){ bestArea = area; best = el; }
    }
    return best;
  }
  cont.addEventListener('pointerdown', ev => {
    const asa = ev.target.closest('.ix-asa');
    if (!asa || !cont.contains(asa)) return;
    ev.preventDefault();
    ev.stopPropagation();
    pieza = asa.closest('.ix-item');
    if (!pieza) return;
    const r = pieza.getBoundingClientRect();
    ox = ev.clientX - r.left;
    oy = ev.clientY - r.top;
    pieza.classList.add('arrastrando');
    bloqueoHasta = 0; ultimoDest = null;
    pegarAlDedo(ev);
    try { asa.setPointerCapture(ev.pointerId); } catch(e){}
  });
  cont.addEventListener('pointermove', ev => {
    if (!pieza) return;
    pegarAlDedo(ev);
    if (performance.now() < bloqueoHasta) return;
    const dest = destPorSolape() || bajoPunto(ev.clientX, ev.clientY);
    if (!dest){ ultimoDest = null; return; }
    if (dest === ultimoDest) return;
    const r = dest.getBoundingClientRect();
    const pr = pieza.getBoundingClientRect();
    const oy = Math.max(0, Math.min(pr.bottom, r.bottom) - Math.max(pr.top, r.top));
    const oxl = Math.max(0, Math.min(pr.right, r.right) - Math.max(pr.left, r.left));
    /* 10% de la glosa que jalas, medido por SOLAPE de las cajas. */
    if (oy < pr.height * 0.1 && oxl < pr.width * 0.1) return;
    const sigue = !!(pieza.compareDocumentPosition(dest) & Node.DOCUMENT_POSITION_FOLLOWING);
    const marca = sigue ? dest.nextSibling : dest;
    if (marca === pieza || pieza.nextSibling === marca) return;
    if (hueco) hueco.classList.remove('hueco');
    hueco = dest;
    dest.classList.add('hueco');
    const antes = fotos();
    cont.insertBefore(pieza, marca);
    animarSitios(antes);
    pegarAlDedo(ev);
    /* Espera a que la de abajo termine de deslizarse (~una media glosa)
       antes de volver a decidir. Si no, entra-sale 20 veces por segundo. */
    ultimoDest = dest;
    bloqueoHasta = performance.now() + 360;
  });
  cont.addEventListener('pointerup', soltar);
  cont.addEventListener('pointercancel', soltar);
})();

/* Y aquí estaba el instructivo largo que salía debajo de la hoja. Se fue con
   los botones que explicaba. Lo que hace falta saber está en los globos de
   ayuda de cada control, que es donde se necesita: al lado de la cosa. */

/* ============================================================
   AJUSTES DEL LECTOR. Se guardan aparte de las marcas: son cosas
   distintas y con distinto valor. Perder los ajustes es una molestia
   de treinta segundos; perder las glosas sería una tragedia —por eso
   las marcas tienen exportación y esto no la necesita.
   Se guarda también DÓNDE te quedaste, pero como libro:capítulo:versículo
   y no como número de hoja: el número de hoja cambia si mañana abres con
   otra letra o con otras columnas, la referencia no.
   ============================================================ */
const AJUSTES = 'glossa:ajustes:v1';
/* El ancho de la hoja en pantalla ancha. Era un ajuste con tres botones y
   ahora es una medida fija: en teléfono nunca se usó —.stage lleva 100vw con
   !important— y en escritorio 620px es el ancho para el que está calibrada la
   tipografía. Se queda como constante y no viaja a los ajustes guardados. */
const ANCHO_HOJA = 620;

function guardarAjustes(){
  const aqui = plano[startIdx] || { cap:1, vers:1 };
  try {
    localStorage.setItem(AJUSTES, JSON.stringify({
      v: 1, fontSize, fontSizeGlosa, columns, placement, alineacion,
      interlineado, margen, version, showMarks, sepia, contraste, brillo,
      fuente: FUENTES.findIndex(f => f[1] === fuente),
      libro: LIBRO, cap: aqui.cap, vers: aqui.vers,
      /* LA ÚLTIMA ETIQUETA USADA SE GUARDA, y ya no decide nada: solo sale
         en negrita en el panel de la marca. Aquí vivía la etiqueta activa,
         que sí decidía —se ponía sola a cada nota— y por eso había que
         guardarla con cuidado y enseñarla en una banda encendida para que no
         etiquetara a tus espaldas. Sin nada automático que anunciar, guardarla
         es solo cortesía: vuelves al día siguiente, sigues con el mismo tema,
         y la etiqueta de ayer está donde la dejaste, en negrita y a un toque.
         Si se pierde no se rompe nada; solo hay que buscarla en la lista. */
      ultimaEtiqueta,
      etiquetasVer: [...etiquetasVer]
    }));
  } catch(e){ /* si no se puede, se arranca con lo de fábrica */ }
}

/* Cada campo se valida antes de aceptarlo: un archivo de ajustes viejo o
   manoseado no debe dejar la app en un estado imposible. */
function cargarAjustes(){
  let a = null;
  try { a = JSON.parse(localStorage.getItem(AJUSTES) || 'null'); } catch(e){}
  if (!a || a.v !== 1) return null;
  if (a.fontSize >= FS_MIN && a.fontSize <= FS_MAX) fontSize = a.fontSize;
  if (a.fontSizeGlosa >= FS_MIN && a.fontSizeGlosa <= FS_MAX) fontSizeGlosa = a.fontSizeGlosa;
  /* Number.isFinite y no un simple >=: un null guardado por una version
     vieja pasaba la comparacion como 0 y dejaba el sepia mudo sin decirlo. */
  if (Number.isFinite(a.sepia)) sepia = Math.max(0, Math.min(100, a.sepia));
  /* Mismo cuidado, y una razón más: los ajustes guardados antes de que este
     riel existiera NO traen contraste, y ahí `a.contraste` es undefined.
     Number.isFinite lo rechaza y la variable se queda en su 125 de fábrica
     —el mismo arranque que ve quien abre por primera vez—. Por eso el objeto
     sigue siendo v:1: no se perdió nada ni cambió de forma nada de lo que ya
     estaba, así que subir la versión solo serviría para tirar los ajustes
     buenos de quien actualice. */
  if (Number.isFinite(a.contraste)) contraste = Math.max(50, Math.min(200, a.contraste));
  /* Y el brillo igual: unos ajustes de antes de que este riel existiera no
     traen el campo, Number.isFinite lo rechaza y se queda en su 100, que es
     el neutro. El objeto sigue en v:1 por lo mismo que la vez pasada. */
  if (Number.isFinite(a.brillo)) brillo = Math.max(50, Math.min(150, a.brillo));
  if (FUENTES[a.fuente]) fuente = FUENTES[a.fuente][1];
  if ([1,2,3].includes(a.columns)) columns = a.columns;
  if (['below','margin','foot'].includes(a.placement)){ placement = a.placement; placementTocado = true; }
  if (['left','justify'].includes(a.alineacion)) alineacion = a.alineacion;
  /* Solo una de las tres. Antes se aceptaba cualquier número entre 1 y 3, y
     con tres estados fijos eso deja el botón mintiendo: un 1.71 guardado por
     una versión vieja no tiene nombre que enseñar. */
  if (AIRES.some(x => x[1] === a.interlineado)) interlineado = a.interlineado;
  if (MARGENES[a.margen]) margen = a.margen;
  showMarks = a.showMarks !== false;
  /* Se acepta cualquier texto porque las etiquetas las escribe quien usa la
     aplicación y no hay lista cerrada que consultar; solo se rechaza lo que no
     es texto y lo desmedido, que sería un archivo manoseado y no una etiqueta.
     Vacío vale: significa que todavía no has usado ninguna. */
  if (typeof a.ultimaEtiqueta === 'string' && a.ultimaEtiqueta.length <= 120)
    ultimaEtiqueta = a.ultimaEtiqueta;
  if (Array.isArray(a.etiquetasVer))
    etiquetasVer = new Set(a.etiquetasVer.filter(t => typeof t === 'string' && t.length <= 120));
  if (D.versiones[a.version]) version = a.version;      // antes que el libro:
  if (a.libro && hayLibro(a.libro)) LIBRO = a.libro;    // hayLibro depende de version
  return a;
}

/* Un solo lugar que pone los controles a decir lo que el estado dice.
   Sin esto, restaurar ajustes deja botones mintiendo. */
function reflejarControles(){
  reflejarTamano();
  $('sepia').value = String(sepia);
  $('sepiaAhora').textContent = sepia;
  $('contraste').value = String(contraste);
  $('contrasteAhora').textContent = contraste + '%';
  $('brillo').value = String(brillo);
  $('brilloAhora').textContent = brillo + '%';
  /* Y las variables de CSS se ponen AQUÍ, no en el primer renderPage: esto
     corre antes de que se pinte nada, así que la hoja nace ya con el contraste
     y el brillo que dejaste puestos y no hay un cuadro en 100% antes de
     asentarse. Las dos de un tirón, que es lo que hace aplicarFiltros. */
  aplicarFiltros();
  $('selFuente').value = String(Math.max(0, FUENTES.findIndex(f => f[1] === fuente)));
  const marcar = (sel, ok) => document.querySelectorAll(sel).forEach(x => x.classList.toggle('active', ok(x)));
  marcar('[data-cols]', x => +x.dataset.cols === columns);
  marcar('[data-lay]',  x => x.dataset.lay === placement);
  const poner = (b, txt, on) => { b.textContent = txt; b.classList.toggle('active', on); };
  poner(btnAl, alineacion === 'justify' ? 'justificado' : 'izquierda', alineacion === 'justify');
  const aire = AIRES.find(a => a[1] === interlineado) || AIRES[1];
  poner(btnA,  aire[0], interlineado !== AIRES[1][1]);
  poner(btnM,  MARGENES[margen][0], margen !== 1);
  marksBtn.textContent = 'Marcas: ' + (showMarks ? 'ON' : 'OFF');
  /* 'estrecho' pone el panel en una sola columna cuando no hay ancho para
     dos. Preguntaba por anchoHoja, que era el ajuste de la hoja y no el
     espacio disponible; y como el manejador de aquellos botones nunca
     escribía la variable, la respuesta era siempre 620 y la clase no se
     ponía jamás. Ahora se le pregunta a la escena, que es lo que de verdad
     decide si los dos grupos caben uno al lado del otro. */
  ajustarAnchoPanel();
}
/* Y ESTO TIENE QUE VOLVER A PREGUNTARSE AL CAMBIAR EL TAMAÑO. Vivía dentro de
   reflejarControles, que solo corre al arrancar, así que la respuesta se
   quedaba congelada con la que valía al abrir: girar el aparato de vertical a
   horizontal dejaba el panel en una sola columna aunque ya cupieran dos, y al
   revés dejaba dos columnas donde ya no caben —justo lo que la clase existe
   para evitar—.
   Sale a función aparte y no se llama a reflejarControles entera desde el
   resize a propósito: aquella repone el estado de TODOS los controles, y en un
   giro no hay estado que reponer, solo un ancho que volvió a medirse. */
function ajustarAnchoPanel(){
  /* Se le pregunta a matchMedia y no se miden píxeles, y esto costó una
     medición equivocada: dentro del propio manejador de resize,
     stage.offsetWidth todavía devuelve el ancho de ANTES —el navegador aún no
     ha rehecho el acomodo— así que la clase se decidía con el tamaño viejo y
     no se movía nunca. matchMedia contesta con el estado nuevo desde el primer
     momento, porque no depende de que nada se haya vuelto a acomodar.
     Y de paso es la MISMA pregunta que hace el CSS: la escena mide 100vw en
     teléfono y ANCHO_HOJA —620, que nunca es angosto— en pantalla ancha, así
     que "¿caben dos columnas?" y "¿estamos en modo teléfono?" son la misma
     pregunta. Compartir el umbral con la hoja de estilos evita que un día
     digan cosas distintas. */
  const angosto = enTelefono();
  $('ctrlConfig').classList.toggle('estrecho', angosto);
  $('ctrlEtiquetas').classList.toggle('estrecho', angosto);
}

/* Los controles se MUEVEN al cajón con appendChild, no se recrean: así
   conservan todos sus manejadores y no hay que volver a conectarlos. */
/* Se MUEVEN los nodos que ya existen, no se clonan ni se vuelven a crear:
   así los manejadores de clic que se engancharon arriba siguen siendo los del
   mismo elemento. Clonar habría dejado botones mudos. */
ajustes.appendChild($('ctrlConfig'));
etiquetas.appendChild($('ctrlEtiquetas'));
/* "Marcas: ON/OFF" apaga TODOS los resaltados de la hoja de un golpe: es una
   propiedad de las glosas, no de la página, así que vive con ellas. */
(function ponerInterruptor(){
  const fila = document.createElement('div');
  fila.className = 'ajuste';
  fila.innerHTML = '<span class="lbl">marcas</span>';
  const c = document.createElement('span');
  c.className = 'ctrl';
  const b = $('marksBtn');
  /* Se queda en el árbol, oculto: el interruptor sigue existiendo por si
     hace falta devolverlo a la interfaz. */
  b.style.display = 'none';
  c.appendChild(b);
  fila.appendChild(c);
  fila.style.display = 'none';
  $('ctrlEtiquetas').appendChild(fila);
})();
etiquetas.appendChild($('indice'));
etiquetas.appendChild($('barraGrupo'));

/* El crédito de licencia se va al panel de Formato, pegado a la versión que
   nombra. No es adorno legal: la Versión Biblia Libre es CC BY-SA y exige
   atribución, así que tiene que estar a la vista en alguna parte. Al lado del
   selector es donde de verdad significa algo. */
ajustes.appendChild($('cred'));

/* El panel de Respaldo se arma con los botones que vivían en la barra de
   abajo: exportar e importar, que son las dos cosas que le pasan al archivo
   de tus glosas, no al texto ni a la página. ("Borrar todo" estuvo aquí y se
   fue del programa entero; la razón está más arriba, donde se quitó.) */
(function armarRespaldo(){
  const caja = document.getElementById('respaldo');
  const fila = document.createElement('div');
  fila.className = 'ajuste ancho';
  fila.innerHTML = '<span class="lbl">archivo</span>';
  const ctrl = document.createElement('span');
  ctrl.className = 'ctrl';
  /* HAY QUE QUITARLES EL display:none AL TRAERLOS, y no es un detalle: los
     tres nacen ocultos en el HTML para que no se vean un instante al pie de
     la página antes de que el guion los mude a su panel. Al mudarlos hay que
     devolverles la visibilidad, porque ese "none" está escrito en el atributo
     style y ninguna hoja de estilos le gana.
     No se hacía, así que el panel de Respaldo enseñaba el rótulo "archivo",
     un hueco donde debían estar los botones, y debajo una nota explicando
     cómo usar dos botones que no estaban. Exportar era además la única forma
     de sacar las glosas de este navegador.
     El interruptor de marcas, que se muda igual unas líneas más arriba, sí lo
     hacía —b.style.display = ''—: era la misma cuenta, hecha en un sitio y
     olvidada en el otro. */
  ['btnExportar', 'btnImportar'].forEach(id => {
    const b = $(id);
    b.style.display = '';
    ctrl.appendChild(b);
  });
  /* El de archivo NO: es el <input type=file> que abre el diálogo del
     sistema, y se dispara desde el botón de Importar. Ese sí vive oculto. */
  ctrl.appendChild($('archivoImp'));
  fila.appendChild(ctrl);
  caja.appendChild(fila);
  const nota = document.createElement('p');
  nota.className = 'nota-respaldo';
  nota.textContent = 'Tus glosas viven en este navegador y en ningún otro lado. ' +
    'Exportar es la única copia que sobrevive a limpiar el historial, cambiar de ' +
    'computadora o publicar el lector en otro sitio. Importar fusiona, nunca reemplaza.';
  caja.appendChild(nota);
  /* EL SELLO, A LA VISTA. Existía solo en la consola, y eso lo dejaba inútil
     justo para lo que sirve: cuando algo no funciona en un teléfono, la
     primera pregunta es si ese teléfono tiene la versión nueva o una guardada
     en caché, y esa pregunta la tiene que poder contestar quien sostiene el
     aparato, sin enchufarlo a nada. */
  const sello = document.createElement('p');
  sello.className = 'sello-version';
  sello.textContent = 'VERSIÓN ' + window.GLOSS_BUILD;
  caja.appendChild(sello);
})();

/* ---------- arranque ---------- */
/* Aquí se armaban los botones de versión del panel de Formato, leyendo
   D.versiones. Se fueron con la fila: el globo #burbujaVersion arma su lista
   del mismo sitio (pintarVersiones), así que bajar una Biblia nueva la sigue
   haciendo aparecer sola. Lo que se perdió es la copia, no la lista. */

/* TRES GLOSAS DE ESTRENO, y solo al estrenar.

   Un lector recién abierto no enseña para qué sirve: hoja de Biblia y nada
   más. Con tres notas puestas se ve de un vistazo qué es una glosa, dónde
   vive, que llevan color y que se pueden etiquetar.

   SE SIEMBRAN UNA SOLA VEZ, y la condición es «la clave nunca existió», no
   «no hay marcas». Si algún día borras todas las tuyas, la clave queda en '[]'
   y estas NO vuelven: reaparecer sería deshacer lo que acabas de hacer.
   Y se guardan enseguida, así que desde el primer momento son tuyas —se
   editan, se recolorean y se borran como cualquier otra—.

   El anclaje se CALCULA del texto de verdad, no se escribe a mano. Una marca
   lleva ini/fin, y un par de números escritos a ojo se descuadran en cuanto
   cambia una coma: aquí se busca la frase en el versículo y salen solos. Si
   una frase no aparece —otra versión, otro reparto—, esa glosa simplemente no
   se siembra en vez de aparecer señalando el sitio equivocado.
   Van después de cargarAjustes porque necesitan versoTexto, que se define
   bastante más arriba pero como const: en el sitio donde se leen las marcas
   todavía no existe. */
const GLOSAS_DE_ESTRENO = [
  { cap:1, vers:1, frase:'Hijo de David', color:'yellow',
    nota:'El título real, de entrada. El último libro lo cierra con el mismo, ' +
         'dicho por él: Ap 22:16' },
  { cap:1, vers:3, frase:'su madre fue Tamar', color:'blue',
    nota:'La genealogía nombra mujeres, y no las que uno esperaría.' },
  { cap:1, vers:6, frase:'la esposa de Urías', color:'green',
    nota:'No la nombra: la llama por el marido. Betsabé entra en el linaje sin ' +
         'su nombre propio.' },
];
function sembrarGlosasDeEstreno(){
  /* EL LIBRO VA FIJO, no el que esté abierto. Estas notas hablan de la
     genealogía de Mateo: en otro libro no dirían nada, y peor, la frase podría
     encontrarse por casualidad en otro versículo 1:1 y marcar lo que no es. */
  const libro = D.libros[0] && D.libros[0].id;
  if (!libro) return;
  const hoy = new Date().toISOString().slice(0,10);
  const nuevas = [];
  for (const e of GLOSAS_DE_ESTRENO){
    let texto = '';
    try { texto = versoTexto(version, e.cap, e.vers, libro) || ''; } catch(err){ continue; }
    /* Sin distinguir mayúsculas: hay versiones que escriben «hijo de David» en
       minúscula y por lo demás dicen lo mismo. */
    const ini = texto.toLowerCase().indexOf(e.frase.toLowerCase());
    /* MEJOR NINGUNA QUE UNA MAL PUESTA. Si el lector abre en otra versión y
       ahí la frase no está —otra traducción, otras palabras—, esta glosa
       simplemente no se siembra. Una nota en español sobre un texto en inglés
       tampoco tendría sentido. */
    if (ini < 0) continue;
    const fin = ini + e.frase.length;
    nuevas.push({
      id: 'estreno-' + e.cap + '-' + e.vers,
      libro, cap: e.cap, vers: e.vers,
      cita: texto.slice(ini, fin),      /* la del texto, con sus mayúsculas */
      antes: texto.slice(Math.max(0, ini-24), ini),
      despues: texto.slice(fin, fin+24),
      ini, fin, versionOrigen: version,
      estilo: 'fill', color: e.color,
      nota: e.nota, etiquetas: ['Interesante'],
      creada: hoy
    });
  }
  if (!nuevas.length) return;
  marcas = nuevas;
  save();
}
/* La portada se va cuando la primera hoja ya está pintada, con un mínimo
   de tiempo para que el letrero se lea y no parpadee. */
function quitarPortada(){
  const el = document.getElementById('portada');
  if (!el || el.classList.contains('fuera')) return;
  el.classList.add('fuera');
  setTimeout(() => { if (el.parentNode) el.remove(); }, 600);
}
const t0Portada = performance.now();
/* TECHO DURO. Lo de arriba quita la portada cuando la hoja está pintada, pero
   esa línea vive DESPUÉS de todo el arranque: si algo de en medio tira una
   excepción, nunca se ejecuta y el lector se queda mirando una tapa que no se
   va y que además se come los toques. Este plazo se arma antes que nada y no
   depende de que el arranque termine bien: pase lo que pase, la mesa se
   destapa. */
setTimeout(() => { try { quitarPortada(); } catch(e){} }, 6000);
const guardado = cargarAjustes();
cargarHistorial();
cargarSeparadores();
cargarPiedras();
/* LA SIEMBRA VA DESPUÉS DE CARGAR LOS AJUSTES, y el orden es todo el asunto.
   cargarAjustes restaura la versión y el libro guardados; sembrando antes, las
   glosas se calculaban contra la versión POR DEFECTO y luego el lector abría
   la suya. Medido con RVR1909 guardado y ninguna marca todavía —alguien que
   probó el programa y cambió de versión sin llegar a escribir—: las tres se
   sembraban con citas de VBL y sus anclajes caían en «David, hijo d», « Zara:
   y Phares en» y «r de Urías: ». O sea el resaltado sobre trozos sin sentido.
   Lo levantó la revisión de Codex. */
if (primeraVez) sembrarGlosasDeEstreno();
stage.style.transition = 'none';
stage.style.width = ANCHO_HOJA + 'px';
void stage.offsetWidth;
stage.style.transition = '';
reflejarControles();
rehacerPlano();
sizeCanvas();
$('cred').textContent = D.versiones[version].nombre + ' — ' + D.versiones[version].licencia + ' · vía eBible.org';
renderPage();
/* Portada fuera: la hoja ya está. Mínimo 3 s para que el letrero se lea. */
(function(){
  const falta = Math.max(0, 3000 - (performance.now() - t0Portada));
  setTimeout(quitarPortada, falta);
})();
/* La firma se siembra con lo que ya hay puesto. Sin esto arranca vacía, así
   que el PRIMER guardado de la sesión siempre la ve distinta y repagina —y con
   glosas ya escritas, ese primer guardado es justo el de crear la siguiente—.
   Va después del primer pintado porque ahí el reparto de páginas ya está
   hecho: la firma dice "lo de ahora ya está contado". */
firmaCuerpo = firmaDelCuerpo();

/* Volver a donde te quedaste, por referencia y no por número de hoja */
if (guardado && guardado.cap){
  const k = plano.findIndex(p => p.cap === guardado.cap && p.vers === guardado.vers);
  if (k >= 0){ paginaActual = paginaDe(k); renderPage(); }
}
window.addEventListener('resize', () => {
  sizeCanvas(); ajustarAnchoPanel(); paginasSucias = true; renderPage();
  /* Girar el teléfono cambia el hueco disponible, así que la escala del zoom
     se vuelve a calcular. Va DESPUÉS de renderPage, que es quien deja la hoja
     con sus medidas nuevas: medir antes daría la escala de la orientación que
     acaba de irse. */
  medirZoom(); if (zoomActivo) refrescarPasos();
});
})();
</script>
